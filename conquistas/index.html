<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="../tc/tema.js?v=1"></script>
<title>Conquistas · Tiny Cats</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Grenze:wght@500;600;700&display=swap">
<style>
/* Conquistas (lote 117): o que cada jogador (a conta) já alcançou. As comuns ficam à mostra; as raras, épicas e
   lendárias ficam ocultas até a pessoa ganhar (de quem não ganhou, só se vê quem ganhou, passando o mouse).
   Quem mestra libera, tira, cria e edita. */
:root {
  color-scheme: dark;
  --table: #0d1017; --surface: #161a24; --raised: #1f2431; --hover: #283042;
  --line: #2b3243; --line-strong: #40495f;
  --fg: #e8eaf0; --fg-2: #a6aec0; --fg-3: #7d879c;
  --lamp: #e6ab4f; --lamp-ink: #edb960; --lamp-soft: rgba(230, 171, 79, .16); --on-lamp: #1d1503;
  --ok: #6fbf8f; --danger: #f0786e;
  --shadow: 0 12px 34px rgba(0, 0, 0, .5);
  --ui: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --display: "Grenze", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, Menlo, Consolas, monospace;
}
:root:where([data-claro]) {
  color-scheme: light;
  --table: #c7ced9; --surface: #f2f4f8; --raised: #ffffff; --hover: #e3e8ef;
  --line: #d2d8e2; --line-strong: #aeb8c9;
  --fg: #1a1f2c; --fg-2: #4a5468; --fg-3: #68738a;
  --lamp: #e2a13a; --lamp-ink: #855605; --lamp-soft: rgba(196, 128, 16, .17); --on-lamp: #241a04;
  --ok: #2f7a55; --danger: #b9342a;
  --shadow: 0 12px 34px rgba(40, 50, 72, .24);
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--table); color: var(--fg); font: 14px/1.4 var(--ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; min-width: 0; }
.top { flex: none; display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font: 600 20px/1 var(--display); color: var(--lamp-ink); white-space: nowrap; }
.na-casca .brand { display: none; }
.conta { font: 13px var(--mono); color: var(--fg-2); }
.grow { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raised); font-weight: 600; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.pri { background: var(--lamp); border-color: var(--lamp); color: var(--on-lamp); }
.btn.per { color: var(--danger); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 13px; }
.in { width: 100%; min-width: 0; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raised); }
textarea.in { height: auto; padding: 8px 10px; resize: vertical; }
select.in { padding: 0 6px; }
.filtro { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.filtro button { height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--raised); color: var(--fg-2); font-size: 12.5px; font-weight: 600; }
.filtro button[aria-pressed="true"] { background: var(--lamp-soft); border-color: var(--lamp); color: var(--lamp-ink); }

.corpo { flex: 1; min-height: 0; overflow: auto; padding: 14px 14px 70px; }
.secao { max-width: 1180px; margin: 0 auto 22px; }
.secao > h2 { margin: 0 0 10px; font: 600 19px/1.2 var(--display); color: var(--lamp-ink); display: flex; align-items: baseline; gap: 10px; }
.secao > h2 small { font: 12.5px var(--mono); color: var(--fg-3); }
.secao > p.ajuda { margin: -4px 0 10px; color: var(--fg-3); font-size: 13px; }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }

/* o cartão de uma conquista: o ícone na moldura da raridade */
.cq { --cor: #b08a5a; position: relative; display: grid; grid-template-columns: 54px 1fr; gap: 10px; align-items: start; padding: 11px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.cq .ic { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 50%; color: var(--cor); border: 2px solid var(--cor);
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--cor) 26%, transparent), transparent 70%); }
.cq .tx { min-width: 0; display: grid; gap: 3px; }
.cq .nome { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.cq .desc { font-size: 13px; color: var(--fg-2); overflow-wrap: anywhere; }
.cq .premio { font-size: 12.5px; color: var(--ok); }
.cq .rar { font: 600 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--cor); }
.cq .quando { font: 11.5px var(--mono); color: var(--fg-3); }
.cq.ganha { border-color: var(--cor); box-shadow: 0 0 0 1px color-mix(in srgb, var(--cor) 40%, transparent), 0 6px 22px color-mix(in srgb, var(--cor) 18%, transparent); }
.cq.ganha .ic { color: #fff; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--cor) 85%, #fff), var(--cor) 75%); }
.cq.falta { opacity: .62; }
.cq.falta .ic { filter: grayscale(.85); }
.cq.oculta .ic { border-style: dashed; color: var(--fg-3); }
.cq.oculta .nome { color: var(--fg-3); letter-spacing: .3em; }
.cq .quem { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.cq .pess { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 4px 0 8px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--raised); font-size: 12px; }
.cq .pess button { border: 0; background: none; color: var(--fg-3); width: 18px; height: 18px; padding: 0; border-radius: 50%; }
.cq .pess button:hover { color: var(--danger); background: var(--hover); }
.cq .acoes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.cq .selo { position: absolute; top: 8px; right: 9px; font: 600 10.5px/1 var(--mono); color: var(--fg-3); }
/* quem ganhou: aparece ao passar o mouse (ou ao focar o cartão) */
.cq .dica { position: absolute; left: 10px; right: 10px; bottom: calc(100% + 6px); z-index: 5; padding: 8px 10px; border-radius: 9px; background: var(--raised); border: 1px solid var(--line-strong); box-shadow: var(--shadow); font-size: 12.5px; color: var(--fg-2); opacity: 0; pointer-events: none; transform: translateY(4px); transition: opacity .12s, transform .12s; }
.cq .dica b { color: var(--fg); }
.cq:hover .dica, .cq:focus-visible .dica { opacity: 1; transform: none; }
.vazio { margin: 40px auto; max-width: 520px; text-align: center; color: var(--fg-2); }

/* a janela de criar/editar e a de liberar */
dialog.dl { border: 1px solid var(--line-strong); border-radius: 14px; background: var(--surface); color: var(--fg); padding: 18px; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 30px); box-shadow: var(--shadow); }
dialog.dl::backdrop { background: rgba(5, 7, 12, .55); }
dialog.dl h2 { margin: 0 0 10px; font: 600 21px/1.2 var(--display); color: var(--lamp-ink); }
dialog.dl p { margin: 0 0 12px; color: var(--fg-2); }
dialog.dl .pe { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.campo { display: grid; gap: 4px; margin-bottom: 10px; }
.campo > span { font-size: 12.5px; font-weight: 600; color: var(--fg-2); }
.linha { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.linha > .campo { flex: 1 1 160px; }
.chk { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--fg-2); cursor: pointer; }
.chk input { width: 16px; height: 16px; margin: 0; accent-color: var(--lamp); }
.icones { display: grid; grid-template-columns: repeat(auto-fill, 40px); gap: 5px; max-height: 190px; overflow: auto; padding: 2px; }
.icones button { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 9px; border: 1px solid var(--line); background: var(--raised); color: var(--fg-2); }
.icones button:hover { background: var(--hover); color: var(--fg); }
.icones button[aria-pressed="true"] { border-color: var(--lamp); color: var(--lamp-ink); background: var(--lamp-soft); }
.previa { margin: 4px 0 12px; }
.toasts { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: grid; gap: 8px; z-index: 50; width: min(560px, calc(100vw - 24px)); }
.toast { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; background: var(--raised); border: 1px solid var(--line-strong); box-shadow: var(--shadow); font-size: 13.5px; }
.toast span { flex: 1; }
.toast button { border: 0; background: none; color: var(--lamp-ink); font-weight: 700; padding: 4px 6px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="brand">Conquistas</span>
    <span class="conta" id="conta"></span>
    <div class="filtro" id="filtro" role="group" aria-label="Raridade"></div>
    <span class="grow"></span>
    <button type="button" class="btn pri" id="btNova" hidden>Nova conquista</button>
  </header>
  <main class="corpo" id="corpo" aria-live="polite"></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog class="dl" id="dlg"></dialog>
<script src="../tc/ponte.js?v=22"></script>
<script src="../tc/conquistas.js?v=2"></script>
<script src="conquistas.js?v=1"></script>
</body>
</html>
