<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiny Cats · Sistema de RPG</title>
<meta name="description" content="Tiny Cats, sistema de RPG: cenas, fichas, árvore de habilidades e rolador de dados em um só lugar.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161a24'/%3E%3Cpath d='M7 12 9.5 5.5 14 10.2c1.3-.3 2.7-.3 4 0L22.5 5.5 25 12c1.1 1.7 1.6 3.6 1.4 5.6C25.9 22.600 21.600 26 16 26s-9.900-3.400-10.400-8.400C5.400 15.600 5.900 13.700 7 12z' fill='%23e6ab4f'/%3E%3Ccircle cx='12.200' cy='16.500' r='1.500' fill='%23161a24'/%3E%3Ccircle cx='19.800' cy='16.500' r='1.500' fill='%23161a24'/%3E%3Cpath d='M14.800 20.200h2.400L16 21.600z' fill='%23161a24'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Grenze:wght@600;700&display=swap">
<style>
/* Casca do site: uma barra fina com a marca e as abas; cada sistema roda na própria página, dentro de uma moldura.
   As cores são as mesmas da mesa de cenas (escuro por padrão, claro quando o sistema pede). */
:root {
  color-scheme: dark;
  --table: #0d1017; --surface: #161a24; --raised: #1f2431; --hover: #283042;
  --line: #2b3243; --line-strong: #40495f;
  --fg: #e8eaf0; --fg-2: #a6aec0; --fg-3: #7d879c;
  --lamp: #e6ab4f; --lamp-ink: #edb960; --lamp-soft: rgba(230, 171, 79, .16); --on-lamp: #1d1503;
  --ui: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --display: "Grenze", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --bar: 44px;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --table: #c7ced9; --surface: #f2f4f8; --raised: #ffffff; --hover: #e3e8ef;
    --line: #d2d8e2; --line-strong: #aeb8c9;
    --fg: #1a1f2c; --fg-2: #4a5468; --fg-3: #68738a;
    --lamp: #e2a13a; --lamp-ink: #855605; --lamp-soft: rgba(196, 128, 16, .17); --on-lamp: #241a04;
  }
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--table); color: var(--fg);
  font: 14px/1.4 var(--ui); -webkit-font-smoothing: antialiased;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px);
  display: flex; flex-direction: column;
}
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

.bar {
  flex: none; height: var(--bar); display: flex; align-items: stretch; gap: 6px;
  padding: 0 10px 0 12px; background: var(--surface); border-bottom: 1px solid var(--line);
  min-width: 0;
}
.brand {
  display: flex; align-items: center; gap: 8px; padding-right: 10px; margin-right: 2px;
  color: var(--lamp-ink); text-decoration: none; font: 700 21px/1 var(--display); letter-spacing: .01em;
  white-space: nowrap; border-radius: 6px;
}
.brand svg { flex: none; }
.tabs { display: flex; align-items: stretch; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative; display: flex; align-items: center; gap: 7px; padding: 0 13px;
  color: var(--fg-2); text-decoration: none; font-weight: 600; white-space: nowrap; border-radius: 6px 6px 0 0;
}
.tab svg { flex: none; opacity: .85; }
.tab:hover { color: var(--fg); background: var(--hover); }
.tab[aria-selected="true"] { color: var(--lamp-ink); }
.tab[aria-selected="true"]::after {
  content: ""; position: absolute; left: 9px; right: 9px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--lamp);
}
.bar-r { margin-left: auto; display: flex; align-items: center; gap: 6px; padding-left: 8px; }
.ib {
  display: grid; place-items: center; width: 32px; height: 32px; border-radius: 7px;
  color: var(--fg-2); background: none; border: 1px solid transparent; text-decoration: none; cursor: pointer;
}
.ib:hover { color: var(--fg); background: var(--hover); border-color: var(--line); }

.stage { position: relative; flex: 1; min-height: 0; background: var(--table); }
.stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--table); }
.wait {
  position: absolute; inset: 0; display: grid; place-items: center; color: var(--fg-3); pointer-events: none;
}
.wait span { padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }

@media (max-width: 620px) {
  .brand span { display: none; }
  .tab { padding: 0 10px; }
  .tab svg { display: none; }
}
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="./" id="brand" title="Tiny Cats · Sistema de RPG">
    <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 12 9.5 5.5 14 10.2c1.3-.3 2.7-.3 4 0L22.5 5.5 25 12c1.1 1.7 1.6 3.6 1.4 5.6C25.9 22.6 21.6 26 16 26S6.1 22.600 5.600 17.600C5.400 15.600 5.900 13.700 7 12z" fill="currentColor"/><circle cx="12.200" cy="16.500" r="1.500" fill="var(--surface)"/><circle cx="19.800" cy="16.500" r="1.500" fill="var(--surface)"/><path d="M14.800 20.200h2.400L16 21.600z" fill="var(--surface)"/></svg>
    <span>Tiny Cats</span>
  </a>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sistemas"></nav>
  <div class="bar-r">
    <a class="ib" id="pop" target="_blank" rel="noopener" title="Abrir esta aba em outra janela" aria-label="Abrir esta aba em outra janela">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
    </a>
  </div>
</header>
<main class="stage" id="stage">
  <div class="wait" id="wait"><span>Carregando…</span></div>
</main>
<noscript><p style="padding:20px">Ative o JavaScript do navegador para usar o Tiny Cats.</p></noscript>
<script>
(() => {
  'use strict';
  // Versão publicada: entra no endereço de cada sistema para o navegador buscar a página nova depois de uma atualização.
  const VERSAO = '2026.10.03-1';
  const ICO = {
    cenas: '<path d="M9 4 3 6.500v13.500l6-2.500 6 2.500 6-2.500V4l-6 2.500L9 4z"/><path d="M9 4v13.500"/><path d="M15 6.500V20"/>',
    fichas: '<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="9.500" r="2.300"/><path d="M8.500 16.500c.7-1.700 2-2.500 3.500-2.500s2.800.8 3.500 2.500"/>',
    arvore: '<circle cx="12" cy="5" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><path d="M12 7v4"/><path d="M12 11c-4 0-6 2-6 5"/><path d="M12 11c4 0 6 2 6 5"/>',
    rolador: '<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.100" fill="currentColor"/><circle cx="15" cy="15" r="1.100" fill="currentColor"/><circle cx="15" cy="9" r="1.100" fill="currentColor"/><circle cx="9" cy="15" r="1.100" fill="currentColor"/>',
  };
  const ABAS = [
    { id: 'cenas', nome: 'Cenas', src: 'cenas/' },
    { id: 'fichas', nome: 'Fichas', src: 'fichas/' },
    { id: 'arvore', nome: 'Árvore', src: 'arvore/' },
    { id: 'rolador', nome: 'Rolador', src: 'rolador/' },
  ];
  const CHAVE = 'tinycats:aba';
  const $ = id => document.getElementById(id);
  const stage = $('stage'), tabs = $('tabs'), wait = $('wait'), pop = $('pop');
  const frames = {};
  let atual = null;

  const ler = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const gravar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* sem armazenamento: só não lembra a aba */ } };
  const existe = id => ABAS.some(a => a.id === id);
  const daHash = () => (location.hash || '').replace(/^#\/?/, '').split(/[/?]/)[0];

  // Primeira visita: quem já usava o Rolador neste endereço cai direto nele.
  function inicial() {
    const h = daHash();
    if (existe(h)) return h;
    const salvo = ler(CHAVE);
    if (existe(salvo)) return salvo;
    return ler('rolador-urgm:dados:v1') ? 'rolador' : 'cenas';
  }

  for (const a of ABAS) {
    const el = document.createElement('a');
    el.className = 'tab'; el.id = 'tab-' + a.id; el.href = '#/' + a.id;
    el.setAttribute('role', 'tab'); el.setAttribute('aria-selected', 'false');
    el.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.900" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICO[a.id] + '</svg><span></span>';
    el.lastChild.textContent = a.nome;
    el.addEventListener('click', ev => { ev.preventDefault(); abrir(a.id); });
    tabs.append(el);
  }

  function abrir(id) {
    if (!existe(id)) id = 'cenas';
    const a = ABAS.find(x => x.id === id);
    if (atual !== id) {
      atual = id;
      gravar(CHAVE, id);
      if (daHash() !== id) history.replaceState(null, '', '#/' + id);
      document.title = a.nome + ' · Tiny Cats';
      for (const x of ABAS) $('tab-' + x.id).setAttribute('aria-selected', x.id === id ? 'true' : 'false');
      pop.href = a.src;
    }
    let f = frames[id];
    if (!f) {
      f = frames[id] = document.createElement('iframe');
      f.title = a.nome; f.id = 'f-' + id;
      f.setAttribute('allow', 'clipboard-read; clipboard-write; fullscreen');
      wait.hidden = false;
      f.addEventListener('load', () => { if (atual === id) { wait.hidden = true; foco(f); } });
      f.src = a.src + '?casca=1&v=' + encodeURIComponent(VERSAO);
      stage.append(f);
    } else {
      wait.hidden = true;
    }
    for (const k in frames) frames[k].hidden = k !== id;
    foco(f);
  }
  // O teclado vai para o sistema aberto, para os atalhos dele funcionarem sem um clique antes.
  function foco(f) { try { f.contentWindow.focus(); } catch (e) { /* ainda carregando */ } }

  window.addEventListener('hashchange', () => { const h = daHash(); if (existe(h) && h !== atual) abrir(h); });
  $('brand').addEventListener('click', ev => { ev.preventDefault(); if (atual) foco(frames[atual]); });
  abrir(inicial());
})();
</script>
</body>
</html>
