<!doctype html>

<title>Tiny Cats · Sistema de RPG</title>
<meta name="description" content="Tiny Cats, sistema de RPG: cenas, fichas, árvore de habilidades e rolador de dados em um só lugar.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161a24'/%3E%3Cpath d='M7 12 9.5 5.5 14 10.2c1.3-.3 2.7-.3 4 0L22.5 5.5 25 12c1.1 1.7 1.6 3.6 1.4 5.6C25.9 22.6 21.6 26 16 26s-9.9-3.4-10.4-8.4C5.4 15.6 5.9 13.7 7 12z' fill='%23e6ab4f'/%3E%3Ccircle cx='12.2' cy='16.5' r='1.5' fill='%23161a24'/%3E%3Ccircle cx='19.8' cy='16.5' r='1.5' fill='%23161a24'/%3E%3Cpath d='M14.8 20.2h2.4L16 21.6z' fill='%23161a24'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Grenze:wght@600;700&display=swap">
<style>
/* Casca do site: uma barra fina com a marca, as abas e a mesa; cada sistema roda na própria página, dentro de uma
   moldura; à direita, o painel da mesa ao vivo. Cores iguais às da mesa de cenas (escuro por padrão). */
:root {
  color-scheme: dark;
  --table: #0d1017; --surface: #161a24; --raised: #1f2431; --hover: #283042;
  --line: #2b3243; --line-strong: #40495f;
  --fg: #e8eaf0; --fg-2: #a6aec0; --fg-3: #7d879c;
  --lamp: #e6ab4f; --lamp-ink: #edb960; --lamp-soft: rgba(230, 171, 79, .16); --on-lamp: #1d1503;
  --ok: #6fbf8f; --danger: #f0786e; --secret: #b39cf0; --secret-soft: rgba(150, 120, 240, .14);
  --scrim: rgba(5, 7, 12, .62); --shadow: 0 12px 34px rgba(0, 0, 0, .5);
  --ui: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --display: "Grenze", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, Menlo, Consolas, monospace;
  --bar: 44px;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --table: #c7ced9; --surface: #f2f4f8; --raised: #ffffff; --hover: #e3e8ef;
    --line: #d2d8e2; --line-strong: #aeb8c9;
    --fg: #1a1f2c; --fg-2: #4a5468; --fg-3: #68738a;
    --lamp: #e2a13a; --lamp-ink: #855605; --lamp-soft: rgba(196, 128, 16, .17); --on-lamp: #241a04;
    --ok: #2f7a55; --danger: #b9342a; --secret: #5b3fb5; --secret-soft: rgba(91, 63, 181, .1);
    --scrim: rgba(30, 38, 54, .42); --shadow: 0 12px 34px rgba(40, 50, 72, .24);
  }
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--table); color: var(--fg);
  font: 14px/1.4 var(--ui); -webkit-font-smoothing: antialiased;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px);
  display: flex; flex-direction: column;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

/* ---- barra ---- */
.bar { flex: none; height: var(--bar); display: flex; align-items: stretch; gap: 6px; padding: 0 10px 0 12px; background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; padding-right: 10px; margin-right: 2px; color: var(--lamp-ink); text-decoration: none; font: 700 21px/1 var(--display); letter-spacing: .01em; white-space: nowrap; border-radius: 6px; }
.brand svg { flex: none; }
.tabs { display: flex; align-items: stretch; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; display: flex; align-items: center; gap: 7px; padding: 0 13px; color: var(--fg-2); text-decoration: none; font-weight: 600; white-space: nowrap; border-radius: 6px 6px 0 0; }
.tab svg { flex: none; opacity: .85; }
.tab:hover { color: var(--fg); background: var(--hover); }
.tab[aria-selected="true"] { color: var(--lamp-ink); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 9px; right: 9px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--lamp); }
.bar-r { margin-left: auto; display: flex; align-items: center; gap: 6px; padding-left: 8px; flex: none; }
.ib { position: relative; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 7px; color: var(--fg-2); background: none; border: 1px solid transparent; text-decoration: none; }
.ib:hover { color: var(--fg); background: var(--hover); border-color: var(--line); }
.ib[aria-pressed="true"] { color: var(--lamp-ink); background: var(--lamp-soft); }
.conta { display: flex; align-items: center; gap: 7px; height: 32px; max-width: 250px; padding: 0 11px; border-radius: 7px; background: var(--raised); border: 1px solid var(--line); font-weight: 600; white-space: nowrap; }
.conta:hover { border-color: var(--line-strong); background: var(--hover); }
.conta .nm { overflow: hidden; text-overflow: ellipsis; }
.conta .pp { font-weight: 500; color: var(--fg-3); font-size: 12px; }
.conta.entrar { background: var(--lamp); border-color: var(--lamp); color: var(--on-lamp); }
.versao { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--lamp); background: var(--lamp-soft); color: var(--lamp-ink); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.versao:hover { filter: brightness(1.08); }
.nuvem { font-size: 12px; color: var(--fg-3); white-space: nowrap; }
.nuvem.ruim { color: var(--danger); font-weight: 600; }
.selo { position: absolute; top: -3px; right: -3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9px; background: var(--lamp); color: var(--on-lamp); font: 700 10px/16px var(--ui); text-align: center; }

/* ---- corpo: sistema + mesa ao vivo ---- */
.corpo { flex: 1; min-height: 0; display: flex; position: relative; }
.stage { position: relative; flex: 1; min-width: 0; background: var(--table); }
.stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--table); }
.wait { position: absolute; inset: 0; display: grid; place-items: center; color: var(--fg-3); pointer-events: none; }
.wait span { padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }

.vivo { flex: none; width: 340px; display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-left: 1px solid var(--line); }
.vivo-h { flex: none; display: flex; align-items: center; gap: 8px; padding: 9px 8px 9px 14px; border-bottom: 1px solid var(--line); }
.vivo-h strong { font: 600 17px/1.1 var(--display); letter-spacing: .01em; }
.sinal { width: 8px; height: 8px; border-radius: 50%; background: var(--lamp); flex: none; }
.sinal.on { background: var(--ok); }
.vivo-h .esp { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.vivo-h .ib.ch { width: 28px; height: 28px; color: var(--fg-3); }
.vivo-h .ib.ch[aria-pressed="true"] { color: var(--lamp-ink); background: var(--lamp-soft); }
.vivo-h .ib.ch .corte { display: none; }
.vivo-h .ib.ch[aria-pressed="false"] .corte { display: inline; }
.quem { flex: none; display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.pes { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--raised); font-size: 12.5px; }
.pes i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.pes.fora { opacity: .5; }
.pes.fora i { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--fg-3); }
.pes small { color: var(--fg-3); font-size: 11px; }
.feed { flex: 1; min-height: 0; margin: 0; padding: 8px 10px 10px; list-style: none; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; overscroll-behavior: contain; }
.feed:empty::before { content: "Ainda não há nada aqui. Role um dado ou mande uma mensagem."; color: var(--fg-3); padding: 18px 6px; text-align: center; }
.it { position: relative; padding: 2px 4px; border-radius: 8px; overflow-wrap: anywhere; }
.it-h { display: flex; align-items: baseline; gap: 6px; font-size: 12.5px; color: var(--fg-3); }
.it-h b { font-weight: 700; color: var(--fg); }
.it-h time { margin-left: auto; font: 11px var(--mono); flex: none; }
.it-h .or { font-size: 11px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--line); }
.fala .tx { white-space: pre-wrap; }
.it .av { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; object-position: top center; flex: none; align-self: center; border: 1px solid var(--line-strong); background: var(--raised); }
.it-h .como { color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.it-h .como::before { content: "· "; color: var(--fg-3); }
.acao { display: flex; align-items: center; gap: 6px; }
.acao .av { width: 20px; height: 20px; }
.acao { color: var(--fg-2); font-style: italic; }
.rol { padding: 8px 10px 9px; background: var(--raised); border: 1px solid var(--line); border-left: 3px solid var(--line-strong); }
.rol .tt { margin-top: 3px; font-weight: 600; }
.rol .rs { display: flex; align-items: baseline; gap: 10px; margin-top: 2px; }
.rol .tot { font: 600 26px/1.1 var(--display); color: var(--lamp-ink); flex: none; }
.rol .res { color: var(--fg-2); font-size: 13px; min-width: 0; }
.rol .vd { margin-top: 3px; font-weight: 600; font-size: 13px; }
.rol .vd.sim { color: var(--ok); }
.rol .vd.nao { color: var(--danger); }
.rol .vd.emp { color: var(--fg-2); }
.rol.secreta { background: var(--secret-soft); border-color: var(--secret); border-left-color: var(--secret); }
.rol .sg { display: flex; align-items: center; gap: 8px; margin-top: 7px; color: var(--secret); font-size: 12.5px; font-weight: 600; }
.ped .ped-d { margin-top: 1px; color: var(--fg-2); font-size: 13px; }
.ped-l { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; }
.ped-a { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-size: 13px; color: var(--fg-2); }
.ped-a b { color: var(--fg); font-weight: 600; }
.ped-a.ok span { color: var(--ok); font-weight: 600; }
.ped-a.meu { flex-direction: column; align-items: stretch; gap: 7px; padding: 8px 9px; border: 1px solid var(--lamp); border-radius: 8px; background: var(--lamp-soft); }
.ped-q { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.ped-r { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ped-r label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg-2); }
.ped-fx { width: 62px; height: 28px; padding: 0 6px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--raised); color: var(--fg); text-align: center; font: 13px var(--mono); }
.ped-f { margin-top: 6px; font-size: 12.5px; color: var(--fg-3); }
.it .acts { position: absolute; top: 4px; right: 4px; display: none; gap: 2px; }
.it:hover .acts, .it:focus-within .acts { display: flex; }
.mini { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; border: 0; background: var(--surface); color: var(--fg-3); }
.mini:hover { color: var(--danger); background: var(--hover); }
.nota { padding: 7px 10px; border: 1px dashed var(--line-strong); border-radius: 8px; color: var(--fg-2); font-size: 13px; }
.nota.erro { border-color: var(--danger); color: var(--fg); }
.nota b { color: var(--fg); font-family: var(--mono); font-weight: 600; }
.nota p { margin: 4px 0 0; }
.nota .fechar { float: right; margin: -2px -4px 0 6px; }
.novo { animation: surge .9s ease-out; }
@keyframes surge { from { background-color: var(--lamp-soft); } }
/* o efeito de uma rolagem que acabou de chegar (com a chave "Efeito" ligada): o cartão acende e o total salta */
.rol.rolou { animation: surge .9s ease-out, acende 1s ease-out; }
.rol.rolou .tot { display: inline-block; transform-origin: left 70%; animation: salta .6s cubic-bezier(.2, 1.5, .4, 1); }
@keyframes acende { from { box-shadow: 0 0 0 2px var(--lamp), 0 0 22px var(--lamp-soft); } to { box-shadow: 0 0 0 0 transparent, 0 0 0 transparent; } }
@keyframes salta { 0% { transform: scale(.55) rotate(-8deg); opacity: .15; } 55% { transform: scale(1.2) rotate(2deg); opacity: 1; } 100% { transform: none; } }
.ib.pulso { animation: pulso .9s ease-out; }
@keyframes pulso { from { box-shadow: 0 0 0 0 var(--lamp); } to { box-shadow: 0 0 0 9px transparent; } }
@media (prefers-reduced-motion: reduce) { .novo, .rol.rolou, .rol.rolou .tot, .ib.pulso { animation: none; } }
.novas { flex: none; align-self: center; margin: -34px 0 6px; z-index: 1; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--lamp); background: var(--surface); color: var(--lamp-ink); font-weight: 600; box-shadow: var(--shadow); }
/* ---- a telinha de dados: rolar pela ficha, sem digitar comando ---- */
.dados { flex: none; border-top: 1px solid var(--line); background: var(--surface); }
.dados-h { display: flex; align-items: center; gap: 7px; width: 100%; height: 32px; padding: 0 10px 0 12px; border: 0; background: none; color: var(--fg-2); font-weight: 600; font-size: 13px; text-align: left; }
.dados-h:hover { color: var(--fg); background: var(--hover); }
.dados-h svg { flex: none; }
.dados-h .qm { color: var(--fg-3); font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dados-h .seta { margin-left: auto; transition: transform .15s; }
.dados-h[aria-expanded="true"] .seta { transform: rotate(180deg); }
.dados-c { padding: 2px 10px 9px; display: grid; gap: 7px; }
.dados-l { display: flex; align-items: center; gap: 8px; }
.dados-l select { flex: 1; min-width: 0; height: 30px; padding: 0 6px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--raised); color: var(--fg); font: inherit; font-weight: 600; }
.dados-l label { display: flex; align-items: center; gap: 6px; flex: none; font-size: 12.5px; color: var(--fg-2); font-weight: 600; }
.dados-l input { width: 58px; height: 30px; padding: 0 6px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--raised); text-align: center; font-family: var(--mono); }
.dados-b { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.dados-b button { display: grid; justify-items: center; gap: 0; min-width: 0; padding: 4px 0 5px; border-radius: 7px; border: 1px solid var(--line); background: var(--raised); color: var(--fg); line-height: 1.15; }
.dados-b button:hover:not(:disabled) { border-color: var(--lamp); background: var(--hover); }
.dados-b button:disabled { opacity: .5; cursor: default; }
.dados-b button small { font-size: 10.5px; letter-spacing: .04em; color: var(--fg-3); font-weight: 700; }
.dados-b button b { font: 600 15px/1.2 var(--mono); }
.dados-b button.ini { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 5px 0; }
.dados-b button.ini small { font-size: 12px; letter-spacing: 0; color: var(--fg-2); font-weight: 600; }
.dados-n { font-size: 12px; color: var(--fg-3); }
@media (prefers-reduced-motion: reduce) { .dados-h .seta { transition: none; } }
.compor { flex: none; padding: 8px 10px 10px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 6px; }
.compor.seg { background: var(--secret-soft); border-top-color: var(--secret); }
.compor input { min-width: 0; height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raised); }
.compor .dica { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-3); min-height: 24px; }
.compor.seg .dica { color: var(--secret); font-weight: 600; }
.chave { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--raised); color: var(--fg-2); font-size: 12px; font-weight: 600; flex: none; }
.chave[aria-pressed="true"] { background: var(--secret); border-color: var(--secret); color: #fff; }
.compor { position: relative; }
.chave.como { margin-left: auto; max-width: 55%; padding-left: 4px; }
.chave.como span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chave.como .av, .comolista .av { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; object-position: top center; flex: none; }
.chave.como .semav, .comolista .semav { display: inline-grid; place-items: center; width: 18px; height: 18px; flex: none; color: var(--fg-3); }
.comolista { position: absolute; right: 10px; bottom: 34px; z-index: 6; width: min(260px, calc(100% - 20px)); max-height: 280px; overflow: auto; padding: 5px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); box-shadow: var(--shadow); }
.comolista .rot { padding: 4px 8px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3); font-weight: 600; }
.comolista button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: 7px; background: none; text-align: left; font-weight: 600; color: var(--fg); }
.comolista button:hover { background: var(--hover); }
.comolista button[aria-checked="true"] { color: var(--lamp-ink); }
.comolista button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.btn { height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raised); font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.pri { background: var(--lamp); border-color: var(--lamp); color: var(--on-lamp); }
.btn.pri:hover { filter: brightness(1.06); }
.btn.per { color: var(--danger); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn:disabled { opacity: .55; cursor: default; }

/* ---- menu da conta ---- */
.menu { position: fixed; z-index: 30; top: calc(var(--bar) + 4px + env(safe-area-inset-top, 0px)); right: 8px; width: 310px; max-height: calc(100% - var(--bar) - 16px); overflow: auto; padding: 12px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow); }
.menu h3 { margin: 0; font: 600 18px/1.2 var(--display); }
.menu .sub { color: var(--fg-3); font-size: 12.5px; }
.menu .sec { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.menu .rot { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3); margin-bottom: 6px; }
.cod { display: flex; align-items: center; gap: 6px; }
.cod code { font: 600 19px var(--mono); letter-spacing: .08em; color: var(--lamp-ink); margin-right: auto; }
.mb { display: flex; align-items: center; gap: 7px; padding: 3px 0; }
.mb i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.mb.fora i { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--fg-3); }
.mb .nm { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 7px; min-width: 0; }
.mb span { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mb small { color: var(--fg-3); white-space: nowrap; }
.mb small:empty { display: none; }
.mb .ac { margin-left: auto; display: flex; gap: 5px; flex: none; }
.mb .ac .btn { padding: 0 8px; }
.dl .op { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-weight: 400; }
.dl .op:has(input:checked) { border-color: var(--lamp); background: var(--raised); }
.dl .op input, .dl .cx input { width: 18px; height: 18px; margin: 2px 0 0; padding: 0; accent-color: var(--lamp); }
.dl .op span { display: grid; gap: 2px; }
.dl .op b { color: var(--fg); font-size: 14.5px; }
.dl .op small { color: var(--fg-3); font-size: 12.5px; line-height: 1.4; }
.dl fieldset.abas:disabled { opacity: .5; }
.dl .cxs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 10px; }
.dl .cx { display: flex; grid-template-columns: none; align-items: center; gap: 7px; font-weight: 500; color: var(--fg); cursor: pointer; }
.dl .cx input { margin: 0; flex: none; }
@media (max-width: 420px) { .dl .cxs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.menu .lk { display: block; width: 100%; text-align: left; padding: 8px 8px; border: 0; border-radius: 7px; background: none; font-weight: 600; }
.menu .lk:hover { background: var(--hover); }
.menu .lk.per { color: var(--danger); }

/* ---- janelas ---- */
dialog { width: min(440px, calc(100% - 24px)); padding: 0; border: 1px solid var(--line-strong); border-radius: 14px; background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
dialog::backdrop { background: var(--scrim); }

.dl input { width: 100%; min-width: 0; height: 38px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raised); font-weight: 400; color: var(--fg); }
.dl .lin { display: flex; gap: 8px; align-items: end; }
.dl .lin label { flex: 1; min-width: 0; }
.dl .pe { display: flex; justify-content: flex-end; gap: 8px; margin-top: 2px; }
.dl .err { color: var(--danger); font-weight: 600; min-height: 0; }
.dl .err:empty { display: none; }
.dl .nt { font-size: 12.5px; color: var(--fg-3); }
.dl fieldset { margin: 0; padding: 12px 0 0; border: 0; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.dl legend { padding: 0; font-weight: 700; float: left; width: 100%; margin-bottom: 2px; }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 3px; border-radius: 10px; background: var(--raised); border: 1px solid var(--line); }
.seg2 button { height: 32px; border: 0; border-radius: 7px; background: none; font-weight: 600; color: var(--fg-2); }
.seg2 button[aria-pressed="true"] { background: var(--lamp); color: var(--on-lamp); }
.ms { display: grid; gap: 6px; }
.ms button { display: flex; align-items: center; gap: 8px; width: 100%; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raised); font-weight: 600; text-align: left; }
.ms button:hover { border-color: var(--lamp); }
.ms button small { margin-left: auto; color: var(--fg-3); font-weight: 500; }

.toasts { position: fixed; z-index: 40; left: 50%; bottom: 18px; transform: translateX(-50%); display: grid; gap: 6px; justify-items: center; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; max-width: min(520px, calc(100vw - 24px)); padding: 9px 14px; border-radius: 10px; background: var(--raised); border: 1px solid var(--line-strong); box-shadow: var(--shadow); }
.toast button { border: 0; background: none; color: var(--lamp-ink); font-weight: 700; padding: 0; }

@media (max-width: 900px) {
  .vivo { position: absolute; top: 0; right: 0; bottom: 0; z-index: 20; width: min(340px, 100%); box-shadow: var(--shadow); }
}

}

<script>
(() => {
  'use strict';
  // Versão publicada: entra no endereço de cada sistema para o navegador buscar a página nova depois de uma atualização.
  const VERSAO = '2026.10.07-2';
  const ICO = {
    cenas: '<path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4z"/><path d="M9 4v13.5"/><path d="M15 6.5V20"/>',
    mundo: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.4 2.5 3.6 5.5 3.6 9s-1.2 6.5-3.6 9c-2.4-2.5-3.6-5.5-3.6-9S9.6 5.5 12 3z"/>',
    acampamento: '<path d="M3 20h18"/><path d="M5 20 12 6l7 14"/><path d="M12 6 10.5 3.5M12 6l1.5-2.5"/><path d="M12 20l-2.5-5M12 20l2.5-5"/>',
    fichas: '<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="9.5" r="2.3"/><path d="M8.5 16.500c.7-1.700 2-2.500 3.500-2.500s2.800.8 3.500 2.500"/>',
    arvore: '<circle cx="12" cy="5" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><path d="M12 7v4"/><path d="M12 11c-4 0-6 2-6 5"/><path d="M12 11c4 0 6 2 6 5"/>',
    rolador: '<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.1" fill="currentColor"/><circle cx="15" cy="15" r="1.1" fill="currentColor"/><circle cx="15" cy="9" r="1.1" fill="currentColor"/><circle cx="9" cy="15" r="1.1" fill="currentColor"/>',
  };
  const ABAS = [
    { id: 'cenas', nome: 'Cenas', src: 'cenas/', dados: true },
    { id: 'mundo', nome: 'Mapa-múndi', src: 'mundo/', dados: true },
    { id: 'acampamento', nome: 'Acampamento', src: 'acampamento/', dados: true },
    { id: 'fichas', nome: 'Fichas', src: 'fichas/', dados: true },
    { id: 'arvore', nome: 'Árvore', src: 'arvore/', dados: true },
    { id: 'rolador', nome: 'Rolador', src: 'rolador/', soMestre: true, dados: true },      // ferramenta do mestre: numa mesa, os jogadores não a veem (e os históricos ficam na mesa)
  ];
  const ORIGENS = { rolador: 'Rolador', ficha: 'Fichas', cena: 'Cenas', mundo: 'Mapa-múndi', arvore: 'Árvore', acampamento: 'Acampamento' };
  const CHAVE = 'tinycats:aba';
  const $ = id => document.getElementById(id);
  const stage = $('stage'), tabs = $('tabs'), wait = $('wait'), pop = $('pop');
  const frames = {};
  let atual = null;

  const ler = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const gravar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* sem armazenamento: só não lembra */ } };
  const existe = id => ABAS.some(a => a.id === id);
  // Numa mesa, quem não mestra uma aba que é só do mestre não a vê (o jogador; o auxiliar sem essa aba, ou jogando
  // como jogador). Sem mesa, cada um é o próprio mestre e vê todas.
  let mestraAba = () => true;                     // (a parte da mesa, mais abaixo, troca por quem sabe)
  const pode = id => { const a = ABAS.find(x => x.id === id); return !!a && !(a.soMestre && !mestraAba(id)); };
  const daHash = () => (location.hash || '').replace(/^#\/?/, '').split(/[/?]/)[0];

  /* Monta um elemento: h('button', { class: 'btn', onclick }, 'texto', outroElemento). Texto sempre entra como texto. */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const k in attrs || {}) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'style') el.style.cssText = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) el.append(c);
    return el;
  }
  const X_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  const CAD_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  function icone(svg) { const s = document.createElement('span'); s.style.display = 'inline-grid'; s.innerHTML = svg; return s; }

  function toast(texto, acao, fn, ms) {
    const t = h('div', { class: 'toast' }, h('span', { text: texto }));
    if (acao) t.append(h('button', { type: 'button', text: acao, onclick: () => { t.remove(); fn(); } }));
    $('toasts').append(t);
    setTimeout(() => t.remove(), ms || (acao ? 8000 : 4500));
  }

  /* ================= abas e molduras ================= */
  // Primeira visita: quem já usava o Rolador neste endereço cai direto nele.
  function inicial() {
    const hs = daHash();
    if (pode(hs)) return hs;
    const salvo = ler(CHAVE);
    if (pode(salvo)) return salvo;
    return ler('rolador-urgm:dados:v1') && pode('rolador') ? 'rolador' : 'cenas';
  }
  for (const a of ABAS) {
    const el = h('a', { class: 'tab', id: 'tab-' + a.id, href: '#/' + a.id, role: 'tab', 'aria-selected': 'false' });
    el.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICO[a.id] + '</svg>';
    el.append(h('span', { text: a.nome }));
    el.addEventListener('click', ev => { ev.preventDefault(); abrir(a.id); });
    tabs.append(el);
  }
  function pintarAbas() {
    for (const a of ABAS) {
      const ok = pode(a.id);
      $('tab-' + a.id).hidden = !ok;
      if (!ok && frames[a.id]) { frames[a.id].remove(); delete frames[a.id]; }
    }
    if (atual && !pode(atual)) abrir('cenas');
  }
  function abrir(id) {
    if (!pode(id)) id = 'cenas';
    const a = ABAS.find(x => x.id === id);
    if (atual !== id) {
      atual = id;
      gravar(CHAVE, id);
      if (daHash() !== id) history.replaceState(null, '', '#/' + id);
      document.title = a.nome + ' · Tiny Cats';
      for (const x of ABAS) $('tab-' + x.id).setAttribute('aria-selected', x.id === id ? 'true' : 'false');
      pop.href = a.src;
    }
    const f = frames[id] || moldura(a);
    wait.hidden = prontas.has(f);              // (uma moldura aberta em segundo plano pode ainda estar carregando)
    for (const k in frames) frames[k].hidden = k !== id;
    foco(f);
  }
  // A moldura de um sistema. Nasce escondida; quem a abre (abrir) é que a mostra.
  const prontas = new WeakSet();
  function moldura(a) {
    const f = frames[a.id] = h('iframe', { title: a.nome, id: 'f-' + a.id, allow: 'clipboard-read; clipboard-write; fullscreen' });
    f.hidden = true;
    f.addEventListener('load', () => { prontas.add(f); if (atual === a.id && frames[a.id] === f) { wait.hidden = true; foco(f); } });
    f.src = a.src + '?casca=1&v=' + encodeURIComponent(VERSAO) + (/[?&]debug\b/.test(location.search) ? '&debug' : '');   // ?debug na casca passa adiante (testes)
    stage.append(f);
    return f;
  }
  // O teclado vai para o sistema aberto, para os atalhos dele funcionarem sem um clique antes.
  // (Mas não tira o foco de quem está escrevendo na mesa ao vivo, nem fecha um menu ou janela que a pessoa acabou de abrir.)
  function foco(f) {
    if ((document.activeElement && $('vivo').contains(document.activeElement)) || !$('menu').hidden || $('dlg').open) return;
    try { f.contentWindow.focus(); } catch (e) { /* ainda carregando */ }
  }
  window.addEventListener('hashchange', () => { const hs = daHash(); if (pode(hs) && hs !== atual) abrir(hs); });
  $('brand').addEventListener('click', ev => { ev.preventDefault(); if (atual) foco(frames[atual]); });

  /* ================= conta, mesas e mesa ao vivo ================= */
  const TC = window.TC || {};
  if (!TC.conta || !TC.conta.disponivel()) { abrir(inicial()); return; }      // sem a biblioteca da nuvem, o site segue só com as abas
  const { conta, mesas, aoVivo } = TC;
  const btnConta = $('btnConta'), btnVivo = $('btnVivo'), vivo = $('vivo'), feed = $('feed'), menu = $('menu'), dlg = $('dlg');
  let naoLidas = 0;
  // o papel de alguém numa mesa, em palavras (m: a mesa aberta, um participante ou uma linha da lista de mesas)
  const cargoPt = m => (m.cargo === 'mestre' ? 'Mestre' : m.cargo === 'auxiliar' ? (m.jogando ? 'Auxiliar · jogando' : 'Mestre auxiliar') : 'Jogador');
  mestraAba = id => !mesas.atual || mesas.mestra(id);
  const nomeDaAba = id => { const a = ABAS.find(x => x.id === id); return a ? a.nome : id; };
  const hora = iso => { const d = new Date(iso); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const codigoBonito = c => (c ? c.slice(0, 3) + '-' + c.slice(3) : '');

  /* ---- ponte com os sistemas ---- */
  let canal = null;
  try { canal = new BroadcastChannel('tinycats'); } catch (e) { /* sem BroadcastChannel: só as molduras recebem */ }
  /* O que cada sistema fica sabendo da mesa. `papel` é o de quem usa NAQUELA aba: 'mestre' se ele a mestra (o mestre,
     ou o auxiliar com a aba liberada, enquanto está mestrando), 'jogador' se não. `mestra` diz o mesmo de cada aba
     (um sistema às vezes precisa saber de outra: o Acampamento só mexe nos segredos das fichas com a aba Fichas).
     Dos outros participantes, `papel` é o que estão fazendo agora (o auxiliar mestrando conta como mestre). */
  const abaDaMoldura = jan => { for (const k in frames) if (frames[k].contentWindow === jan) return k; return null; };
  const estadoPonte = aba => {
    const a = mesas.atual, mestra = {};
    if (a) for (const k of mesas.abasDeMestre) mestra[k] = mesas.mestra(k);
    return { t: 'estado', v: 3, mesa: a ? { id: a.id, nome: a.nome } : null, papel: a ? (aba ? (mesas.mestra(aba) ? 'mestre' : 'jogador') : a.papel) : null,
      cargo: a ? a.cargo : null, jogando: !!(a && a.jogando), mestra: a ? mestra : null,
      segredo: !!aoVivo.segredo, eu: conta.usuario ? conta.usuario.id : null,
      membros: a ? a.membros.map(x => ({ id: x.usuario_id, nome: x.nome, papel: x.papel, cargo: x.cargo, cor: x.cor })) : [] };
  };
  function difundir() {
    for (const k in frames) { try { frames[k].contentWindow.postMessage({ tinycats: estadoPonte(k) }, location.origin); } catch (e) { /* moldura ainda carregando */ } }
    if (canal) canal.postMessage(estadoPonte(null));
  }
  function daPonte(m, responder, fonte) {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'ola') { responder(estadoPonte(abaDaMoldura(fonte))); entregarAlvo(fonte, responder); }
    else if (m.t === 'ir') { if (typeof m.aba === 'string' && pode(m.aba)) irPara(m.aba, m.alvo); }
    else if (m.t === 'rolagem' && mesas.atual) aoVivo.deSistema(m.origem, m.dados).catch(e => toast('A rolagem não chegou à mesa: ' + e.message));
    else if (m.t === 'dados.abrir') {
      try { const c = TC.dados.col(m.col); c.pronta.then(() => responder({ t: 'dados.tudo', col: m.col, n: m.n, linhas: c.todas() }), e => responder({ t: 'dados.erro', n: m.n, erro: e.message })); }
      catch (e) { responder({ t: 'dados.erro', n: m.n, erro: e.message }); }
    } else if (m.t === 'dados.gravar' && mesas.atual) {
      if (m.mesa && m.mesa !== mesas.atual.id) return;        // gravação de uma mesa que já não é a aberta (chegou atrasada): não entra nesta

  }

  TC.daPonteDireto = (m, fonte) => { let c; try { c = structuredClone(m); } catch (e) { c = JSON.parse(JSON.stringify(m)); } daPonte(c, () => {}, fonte); };
  function descarregarMolduras() {

  /* ================= versão nova do site =================
     A página aberta fica na versão em que foi carregada. De tempos em tempos, e quando a pessoa volta para a aba, a
     casca pergunta ao servidor qual é a versão publicada (versao.json). Se for outra, aparece um botão discreto na
     barra de cima. Nada recarrega sozinho: quem escolhe a hora é a pessoa (e o botão pergunta antes). */
  const btnVersao = $('versaoNova');
  let publicada = null, conferidaEm = 0;
  async function conferirVersao() {
    conferidaEm = Date.now();
    try {
      const r = await fetch('versao.json?t=' + conferidaEm, { cache: 'no-store' });
      if (!r.ok) return;
      const v = (await r.json()).versao;
      if (typeof v !== 'string' || !v || v === VERSAO || v === publicada) return;
      publicada = v;
      btnVersao.hidden = false;
      toast('Há uma versão nova do site. Recarregue quando puder: botão “Versão nova”, no topo.', null, null, 9000);
    } catch (e) { /* sem rede agora: confere de novo depois */ }
  }
  btnVersao.addEventListener('click', () => {
    const f = h('form', { class: 'dl' }, h('h2', { text: 'Recarregar para a versão nova?' }),
      h('p', { text: 'O site foi atualizado. O que você fez já está guardado. Recarregar leva alguns segundos e traz as correções e as novidades.' }),
      h('div', { class: 'pe' }, h('button', { type: 'button', class: 'btn', text: 'Depois', onclick: fecharJanela }), h('button', { type: 'submit', class: 'btn pri', text: 'Recarregar agora' })));
    f.addEventListener('submit', ev => { ev.preventDefault(); location.reload(); });
    abrirJanela(f);
  });
  setTimeout(conferirVersao, 60 * 1000);
  setInterval(() => { if (!document.hidden) conferirVersao(); }, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - conferidaEm > 60 * 1000) conferirVersao(); });
  window.__conferirVersao = conferirVersao;      // (para os testes)

  async function aoEntrar() {
    pintarConta();
    const ultima = mesas.ultima();
    if (ultima) { try { await mesas.abrir(ultima); return; } catch (e) { /* a mesa sumiu ou a pessoa saiu dela: escolhe outra */ } }
    janelaMesas();
  }
  // Primeiro a mesa (se a pessoa já estava numa), depois a aba: assim o sistema já abre com os dados certos.
  const prazo = new Promise(ok => setTimeout(ok, 8000));
  Promise.race([prazo, conta.pronta.then(async u => {
    pintarConta();
    const ultima = u ? mesas.ultima() : null;
    if (ultima) { try { await mesas.abrir(ultima); } catch (e) { pintarConta(); } }
  })]).then(() => { mesaDasMolduras = assinatura(); pintarAbas(); abrir(inicial()); cenasEmSegundoPlano(); });
})();
</script>
</body>
</html>
