    } else if (hd.kind === 'fxbox') {
      // canto do retângulo: largura e altura, com o centro parado
      const ge = FX.geom(o0, sc), dx = p.x - ge.x, dy = p.y - ge.y;
      const fit = v => clamp(free ? Math.round(v * 100) / 100 : snapTo(v, 0.5), 0.5, 60);
      Store.upd('effects', g.id, { rw: fit(Math.abs(dx * ge.cs + dy * ge.sn) * 2 / sc.cell), rh: fit(Math.abs(dy * ge.cs - dx * ge.sn) * 2 / sc.cell) });
    } else if (hd.kind === 'fx' || hd.kind === 'aura') {
      let ox, oy, half;
      if (hd.kind === 'fx') { const ge = FX.geom(o0, sc); ox = ge.x; oy = ge.y; half = ge.half; }
      else { [ox, oy, half] = tokC(o0, sc); }

      const rect = hd.kind === 'fx' && o0.k === 'rect';       // no retângulo a bolinha fica no meio do lado: a distância é meia largura

  /* ---- Arrastar a seleção ---- */

      else if (s.c === 'shapes') { if ((gm || can('editShape', o)) && !o.lock) items.push({ c: s.c, id: o.id, o0: o.pts ? { pts: o.pts.slice() } : { x: o.x, y: o.y } }); }

    const sc = Store.scene();

    else if (L.c === 'shapes') {

  function endMarquee() {
    const sc = Store.scene(), gm = isGM();

    for (const t of sc.tokens) {

    if (!picked.length) {
      for (const s of sc.shapes) {

  // Desenho travado sob o cursor. O clique simples passa direto por ele (é para isso que se trava a arte

  // Cursor e dica conforme o que está sob o mouse (só na ferramenta Selecionar, uma vez por quadro).

    hint: 'Clique para selecionar e arraste para mover. Arraste no vazio para selecionar vários. Botão direito abre o menu.',
    down(p, e) {

      const hit = hitTest(p);

            : !ownsTok(tk) ? '' : tk.locked ? 'O mestre travou a posição deste token.' : !sc.perms.mover ? 'O mestre não liberou mover tokens nesta cena.' : '';

        // Desenho travado que já está selecionado (por dois cliques): o clique não o solta, e arrastar

    move(p, e) {

    dbl(p) {

    },
    preview(ctx, px, sc) {
      if (!g) return;
      if (g.type === 'marquee') {
        const x = Math.min(g.x0, g.x1), y = Math.min(g.y0, g.y1), w = Math.abs(g.x1 - g.x0), hh = Math.abs(g.y1 - g.y0);

        ctx.strokeStyle = 'rgba(230,171,79,0.9)'; ctx.lineWidth = 1.2 * px; ctx.strokeRect(x, y, w, hh);

  function shapeBase(k) {
    const o = App.opt;

  function buildShape(d, preview) {
    const b = shapeBase(d.k), z = App.view.z;

      b.f = null;

    } else if (d.k === 'line') {

    } else {

    return {

      },
      move(p, e) {

    for (let i = 0; i < d.pts.length; i += 2) {

      if (n && Math.hypot(d.pts[i] - pts[n - 2], d.pts[i + 1] - pts[n - 1]) * z < 3) continue;

  /* ---- Paredes, portas, janelas e cortinas ---- */
  const WALL_COLORS = { wall: '#f0c26a', door: '#7fd1ff', secret: '#e39bff', window: '#8fe9ff', veil: '#b79bff' };

  function wallProps(kind) {

  T.wall = {
    get hint() {
      return App.opt.wallMode === 'room'
        ? 'Arraste um retângulo para levantar as quatro paredes de uma sala. Clique numa parede para selecioná-la. Alt solta da grade.'

        const x0 = Math.min(d.x0, d.x1), x1 = Math.max(d.x0, d.x1), y0 = Math.min(d.y0, d.y1), y1 = Math.max(d.y0, d.y1);

  /* ---- Efeitos de magia ---- */
  function fxFromOpt(x, y, tok) {
    const o = App.opt, sc = Store.scene();

    return {
      id: uid('fx'), fx: o.fx, k: o.fxShape, x, y, r: o.fxR, w: o.fxW, rw: o.fxRW, rh: o.fxRH, ang: o.fxAng, dir: o.fxShape === 'rect' ? o.fxDir : 0,
      pow: 0.8, token: tok ? tok.id : null, gm: false, by: authorId(),
      seed: 1 + Math.floor(Math.random() * 999), dur, dur0: dur, at: dur && sc.turn.on ? sc.turn.cur : null, apply: null,
    };
  }
  // Retângulo: arrasta-se a diagonal, de um canto ao outro (onde o botão desceu é um canto). Os dois cantos
  // encaixam na grade, de meio em meio quadrado; Alt solta. Preso a um token, cresce a partir do centro dele.
  // Com rotação nas opções, a diagonal é lida nos eixos do retângulo girado.
  function dragRect(p, e, sc) {
    if (!g.moved && Math.hypot(p.x - g.x0, p.y - g.y0) * App.view.z < 6) return;
    g.moved = true;
    const cell = sc.cell, [qx, qy] = snapPt(sc, p.x, p.y, e.altKey, 0.5);
    const d = rad(g.e.dir || 0), cs = Math.cos(d), sn = Math.sin(d);
    const dx = qx - g.x0, dy = qy - g.y0;
    let a = dx * cs + dy * sn, b = dy * cs - dx * sn;
    const size = v => clamp(e.altKey ? Math.round(Math.abs(v) / cell * 100) / 100 : snapTo(Math.abs(v) / cell, 0.5), 0.5, 60);
    if (g.tok) { g.e.rw = size(a * 2); g.e.rh = size(b * 2); return; }
    g.e.rw = size(a); g.e.rh = size(b);
    a = (a < 0 ? -1 : 1) * g.e.rw * cell; b = (b < 0 ? -1 : 1) * g.e.rh * cell;
    g.e.x = g.x0 + (cs * a - sn * b) / 2; g.e.y = g.y0 + (sn * a + cs * b) / 2;
  }
  function fxOrigin(p, e) {
    const sc = Store.scene();

    if (App.opt.fxAttach) { const hit = hitTest(p, { tokensOnly: true }); if (hit) tok = Store.get('tokens', hit.id); }
    if (tok && !isGM() && !ownsTok(tok)) tok = null;

  }
  T.fx = {
    get hint() {
      return App.opt.fxShape === 'rect'
        ? 'Arraste de um canto ao outro para desenhar o retângulo; um clique solta no tamanho das opções. Com "prender ao token" ligado, clicar num token faz o efeito acompanhá-lo.'

    down(p, e) {

        const sc = Store.scene(), dx = p.x - g.e.x, dy = p.y - g.e.y, dist = Math.hypot(dx, dy);

const UI = (() => {

  const inText = (id, value, onChange, attrs) => h('input', Object.assign({ id, type: 'text', class: 'in', value: value == null ? '' : value, autocomplete: 'off', onchange: e => onChange(e.target.value) }, attrs || {}));

        h('span', { class: 'menu-l', text: it.label }), it.key ? h('span', { class: 'menu-k', text: it.key }) : null);

  function modal(o) {
    closeModal(); closeMenus();
    const card = h('div', { class: 'modal' + (o.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': o.title },
      h('h2', { class: 'modal-t', text: o.title }),
      o.text ? h('p', { class: 'modal-p', text: o.text }) : null,
      o.body || null,
      h('div', { class: 'modal-a' }, (o.actions || []).filter(Boolean).map(a => btn(a.label, () => { if (a.run && a.run() === false) return; if (!a.keep) closeModal(); }, { kind: a.kind || 'ghost' }))));
    modalCfg = o;
    modalEl = h('div', { class: 'scrim', onpointerdown: e => { if (e.target === modalEl) { closeModal(); if (o.onCancel) o.onCancel(); } } }, card);
    el.layer.append(modalEl);
    const f = card.querySelector('[data-focus]') || (o.focusPrimary ? null : card.querySelector('input:not([type=hidden]), textarea, select')) || card.querySelector('.btn.primary') || card.querySelector('button');
    if (f) { f.focus(); if (f.select && f.type !== 'range' && f.type !== 'checkbox' && f.type !== 'color') f.select(); }
    return card;
  }
  document.addEventListener('keydown', e => {
    if (menuEl && e.key === 'Escape') { closeMenus(); e.stopPropagation(); return; }
    if (!modalEl) return;
    if (e.key === 'Escape') { const c = modalCfg; closeModal(); if (c && c.onCancel) c.onCancel(); e.stopPropagation(); }
    else if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'BUTTON') {
      const p = modalEl.querySelector('.btn.primary');
      if (!p) return;
      e.preventDefault();
      if (e.target.tagName === 'INPUT' && modalEl.contains(e.target)) e.target.blur();   // o que foi digitado vale antes de a janela fechar
      p.click();
    }
  }, true);

  function confirmBox(title, text, okLabel, danger) {
    return new Promise(res => modal({
      title, text, onCancel: () => res(false),
      actions: [{ label: 'Cancelar', run: () => res(false) }, { label: okLabel || 'Confirmar', kind: danger ? 'danger' : 'primary', run: () => res(true) }],
    }));
  }
  function promptBox(title, label, value, o) {
    const p = o || {};
    return new Promise(res => {
      const input = p.multiline
        ? h('textarea', { id: 'dlg-in', class: 'in area', rows: 4, 'data-focus': '', value: value || '' })
        : h('input', { id: 'dlg-in', class: 'in', type: p.type || 'text', 'data-focus': '', value: value == null ? '' : value, min: p.min, max: p.max, autocomplete: 'off' });
      modal({
        title, text: p.text, body: field(label, input, 'stack'), onCancel: () => res(null),
        actions: [{ label: 'Cancelar', run: () => res(null) }, { label: p.ok || 'Confirmar', kind: 'primary', run: () => res(input.value) }],
      });
    });
  }

  /* ================= Imagens ================= */
  function tokenAvatar(t, size) {
    const a = t.img ? Store.S.assets[t.img] : null;
    const owner = t.owner && t.owner !== '*' ? playerById(t.owner) : null;
    const st = { width: size + 'px', height: size + 'px', backgroundColor: t.color, color: inkOn(t.color), fontSize: Math.round(size * 0.38) + 'px', borderColor: owner ? owner.color : 'var(--line-strong)' };
    if (a) st.backgroundImage = `url("${a.url}")`;
    return h('span', { class: 'av' + (t.shape === 'quad' ? ' sq' : ''), style: st, 'aria-hidden': 'true' }, a ? null : initials(tokName(t)));
  }

  function pickImage(cb) { imgTarget = cb; el.fileImg.value = ''; el.fileImg.click(); }
  el.fileImg.addEventListener('change', () => {
    const files = Array.from(el.fileImg.files || []);
    const cb = imgTarget; imgTarget = null;
    if (files.length && cb) cb(files);
  });

  async function setTokenImage(t, file) {
    try {
      const a = await Assets.fromFile(file, 'token');
      Store.tx('Imagem do token', () => Store.upd('tokens', t.id, { img: a.id, imgChar: false }));
    } catch (err) { toast(err.message || 'Não consegui abrir essa imagem.'); }
  }
  async function tokensFromFiles(files, at) {
    const sc = Store.scene();
    const [w, hh] = Render.size();
    const base = at || { x: App.view.x + w / (2 * App.view.z), y: App.view.y + hh / (2 * App.view.z) };
    const made = [];
    for (let i = 0; i < files.length; i++) {
      try {
        const a = await Assets.fromFile(files[i], 'token');
        const [x, y] = snapTok(sc, base.x - sc.cell / 2 + (i % 8) * sc.cell, base.y - sc.cell / 2 + Math.floor(i / 8) * sc.cell, 1, false);
        made.push(newToken(sc, x, y, { name: a.name || 'Token ' + (sc.tokens.length + made.length + 1), img: a.id }));
      } catch (err) { toast(err.message || 'Não consegui abrir uma das imagens.'); }
    }
    if (!made.length) return;
    Store.tx(made.length > 1 ? 'Criar tokens' : 'Criar token', () => made.forEach(t => Store.add('tokens', t)));
    setSel(made.map(t => ({ c: 'tokens', id: t.id })));
    Tools.set('select');
    if (made.length === 1) openTab('sel');
  }
  async function bgFromFile(file) {
    let a;
    try { a = await Assets.fromFile(file, 'bg'); } catch (err) { toast(err.message || 'Não consegui abrir essa imagem.'); return; }
    const sc = Store.scene();
    const input = h('input', { id: 'dlg-cols', class: 'in num', type: 'number', min: 2, max: 300, value: sc.cols, 'data-focus': '' });
    const setBg = fitCols => Store.tx('Imagem de fundo', () => {
      const p = { bg: { asset: a.id, stretch: false, dx: 0, dy: 0, scale: 1 } };
      if (fitCols) { p.cols = fitCols; p.rows = Math.max(2, Math.round(fitCols * a.h / a.w)); }
      Store.scn(p);
    });
    modal({
      title: 'Ajustar a cena ao mapa',
      text: `A imagem tem ${a.w} × ${a.h} px. Se você souber quantos quadrados ela tem de largura, a cena assume o tamanho certo e a grade cai em cima do desenho.`,
      body: field('Quadrados na largura da imagem', input, 'stack'),
      actions: [
        { label: 'Manter o tamanho da cena', run: () => { setBg(0); } },
        { label: 'Ajustar a cena', kind: 'primary', run: () => { const n = clamp(Math.round(parseFloat(input.value) || sc.cols), 2, 300); setBg(n); setTimeout(Render.fit, 30); } },
      ],
    });
  }
  function importImages(files, at) {
    const list = Array.from(files || []).filter(f => /^image\//.test(f.type || ''));
    if (!list.length) { toast('Só consigo usar arquivos de imagem aqui.'); return; }
    if (!isGM()) { toast('Só o mestre pode trazer imagens para a cena.'); return; }
    if (list.length > 1) { tokensFromFiles(list, at); return; }
    const f = list[0];
    const hit = at ? Tools.hitTest(at, { tokensOnly: true }) : null;
    const tok = hit ? Store.get('tokens', hit.id) : null;
    modal({
      title: 'O que fazer com esta imagem?', text: f.name || 'Imagem colada',
      actions: [
        { label: 'Cancelar' },
        { label: 'Fundo da cena', run: () => { setTimeout(() => bgFromFile(f), 0); } },
        { label: 'Novo token', kind: tok ? 'ghost' : 'primary', run: () => { tokensFromFiles([f], at); } },
        tok ? { label: `Imagem de ${tok.name}`, kind: 'primary', run: () => { setTokenImage(tok, f); } } : null,
      ],
    });
  }
  el.stage.addEventListener('dragover', e => {
    if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
    el.drop.hidden = false;
  });
  el.stage.addEventListener('dragleave', e => { if (!el.stage.contains(e.relatedTarget)) el.drop.hidden = true; });
  el.stage.addEventListener('drop', e => {
    e.preventDefault(); el.drop.hidden = true;
    const r = Render.cv.getBoundingClientRect(), v = App.view;
    importImages(e.dataTransfer.files, { x: v.x + (e.clientX - r.left) / v.z, y: v.y + (e.clientY - r.top) / v.z });
  });
  document.addEventListener('paste', e => {
    if (modalEl || Tour.active() || focusKind(e.target) === 'text') return;
    const files = Array.from((e.clipboardData && e.clipboardData.files) || []).filter(f => /^image\//.test(f.type));
    if (files.length) { e.preventDefault(); importImages(files, App.mouse.inside ? { x: App.mouse.x, y: App.mouse.y } : null); return; }
    if (App.clip.length) {
      const [w, hh] = Render.size();
      const at = App.mouse.inside ? App.mouse : { x: App.view.x + w / (2 * App.view.z), y: App.view.y + hh / (2 * App.view.z) };
      const n = Act.pasteAt(at.x, at.y);
      if (n) toast(n === 1 ? 'Colado.' : `${n} itens colados.`);
    }
  });

  /* ================= Exportar e importar ================= */
  /* A mesa roda em dois lugares. Na página do site ela é uma página comum e salva arquivos pelo caminho normal do
     navegador (Blob + <a download>). Dentro do visualizador de artefatos, quem salva é o recurso dele
     (window.claude): hosted diz se esse visualizador está presente. Nada mais depende dele. */
  const framed = (() => { try { return window.top !== window.self; } catch (e) { return true; } })();
  let capsReady = Promise.resolve(null), hosted = false;
  function initCaps() {
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        hosted = true;
        capsReady = window.claude.use('downloads').then(d => { downloads = d || null; return downloads; }, () => null);
      }
    } catch (e) { downloads = null; }
  }
  const slug = s => String(s || 'cena').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'cena';

  function copyBox(name, text, why) {
    const big = text.length > 600000;
    const ta = h('textarea', { id: 'dlg-json', class: 'in area mono', rows: 7, readOnly: true, value: big ? '' : text, placeholder: big ? 'O conteúdo é grande demais para mostrar aqui, mas o botão Copiar leva tudo.' : '' });
    modal({
      title: 'Copiar em vez de salvar', wide: true,
      text: `${why} Copie o conteúdo e cole num arquivo de texto chamado ${name}.`,
      body: ta,
      actions: [
        { label: 'Fechar' },
        {
          label: 'Copiar', kind: 'primary', keep: true, run: () => {
            const fail = () => { if (!big) { ta.focus(); ta.select(); toast('Não consegui copiar sozinho. O texto está selecionado: use Ctrl+C.'); } else toast('Este navegador não deixou copiar.'); };
            try { navigator.clipboard.writeText(text).then(() => toast('Copiado.'), fail); } catch (e) { fail(); }
          },
        },
      ],
    });
  }
  // O caminho normal de qualquer página: entrega o conteúdo ao navegador como um arquivo para baixar.
  function browserDownload(name, text) {
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = h('a', { href: url, download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  async function saveFile(name, text) {
    if (hosted) {
      // O recurso de salvar pode ainda estar chegando logo depois de a página abrir: espera um instante por ele.
      if (!downloads) await Promise.race([capsReady, new Promise(r => setTimeout(r, 1500))]);
      if (downloads) {
        try { await downloads.save({ filename: name, data: new Blob([text], { type: 'application/json' }) }); toast('Arquivo salvo.'); }
        catch (err) {
          const code = err && err.code;
          if (code === 'declined') return;
          if (code === 'rate_limited') { toast('Já há um pedido de salvamento aberto. Responda a ele e tente de novo.'); return; }
          copyBox(name, text, 'Não consegui salvar o arquivo por aqui.');
        }
        return;
      }
      // Visualizador presente, mas sem o recurso de salvar: lá dentro o download comum é barrado em silêncio.
      if (framed) { copyBox(name, text, 'Este visualizador não deixa a página salvar arquivos.'); return; }
    }
    try { browserDownload(name, text); } catch (e) { copyBox(name, text, 'Não consegui salvar o arquivo por aqui.'); return; }
    // Dentro de uma moldura de outra página não dá para saber se o navegador aceitou o pedido: fica uma saída à mão.
    if (framed) toast('Download pedido ao navegador.', { action: 'Não baixou? Copiar', run: () => copyBox(name, text, 'Se o arquivo não chegou à pasta de downloads, a página de fora não deixou esta salvar arquivos.') });
    else toast('Arquivo enviado para a pasta de downloads.');
  }
  function sceneAssets(scenes) {
    const out = {};
    for (const sc of scenes) {
      if (sc.bg && sc.bg.asset && Store.S.assets[sc.bg.asset]) out[sc.bg.asset] = Store.S.assets[sc.bg.asset];
      for (const t of sc.tokens) if (t.img && Store.S.assets[t.img]) out[t.img] = Store.S.assets[t.img];
    }
    return out;
  }
  /* Arquivos exportados. Os de agora se identificam como Tiny Cats (versão 3 dos dados). A importação continua
     aceitando tudo o que as versões anteriores gravaram: os formatos "urgm-cena" e "urgm-mesa", versões 1 e 2
     (normalizeScene completa o que faltar). */
  const FILE_SCENE = 'tinycats-cena', FILE_TABLE = 'tinycats-mesa', FILE_VERSION = 3;
  const FILE_SCENE_IDS = [FILE_SCENE, 'urgm-cena'], FILE_TABLE_IDS = [FILE_TABLE, 'urgm-mesa'];
  function exportScene() {
    const sc = Store.scene();
    const copy = clone(sc); copy.explored = {};
    saveFile(`tinycats-cena-${slug(sc.name)}.json`, JSON.stringify({ format: FILE_SCENE, version: FILE_VERSION, scene: copy, players: Store.S.players, assets: sceneAssets([sc]) }));
  }
  function exportAll() {
    Vision.flushExplored();
    const scenes = Store.S.order.map(id => Store.S.scenes[id]);
    saveFile('tinycats-cenas.json', JSON.stringify({ format: FILE_TABLE, version: FILE_VERSION, scenes, players: Store.S.players, barDefaults: Store.S.prefs.barDefaults || null, assets: sceneAssets(scenes) }));
  }
  function importText(text) {
    let d;
    try { d = JSON.parse(text); } catch (e) { toast('Esse arquivo não é um JSON válido.'); return; }
    const scenes = d && FILE_SCENE_IDS.includes(d.format) && d.scene ? [d.scene] : d && FILE_TABLE_IDS.includes(d.format) && Array.isArray(d.scenes) ? d.scenes : null;
    if (!scenes || !scenes.length) { toast('Esse arquivo não parece ter sido exportado por esta mesa.'); return; }
    for (const id in d.assets || {}) Assets.fromData(d.assets[id]);
    for (const p of d.players || []) if (p && p.id && !playerById(p.id)) Store.S.players.push({ id: p.id, name: p.name || 'Jogador', color: p.color || PLAYER_COLORS[Store.S.players.length % PLAYER_COLORS.length] });
    // As barras padrão do arquivo só entram se esta mesa ainda não tiver as dela.
    if (Array.isArray(d.barDefaults) && d.barDefaults.length && !Store.S.prefs.barDefaults) Store.S.prefs.barDefaults = d.barDefaults.slice(0, MAX_BARS).map(cleanBar);
    let first = null;
    for (const raw of scenes) {
      if (!raw || !Array.isArray(raw.tokens)) continue;
      const sc = normalizeScene(clone(raw));
      if (!sc.id || Store.S.scenes[sc.id]) sc.id = uid('cena');
      Store.addScene(sc);
      Persist.scene(sc.id);
      first = first || sc.id;
    }
    if (!first) { toast('Não encontrei nenhuma cena dentro do arquivo.'); return; }
    Persist.meta();
    switchScene(first);
    toast(scenes.length === 1 ? 'Cena importada.' : `${scenes.length} cenas importadas.`);
  }
  el.fileJson.addEventListener('change', () => {
    const f = el.fileJson.files && el.fileJson.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => importText(String(rd.result || ''));
    rd.onerror = () => toast('Não consegui ler o arquivo.');
    rd.readAsText(f);
  });
  const importFile = () => { el.fileJson.value = ''; el.fileJson.click(); };

  /* ================= Cenas e jogadores ================= */
  function switchScene(id) {
    if (!Store.S.scenes[id]) return;
    Tools.cancel();
    App.sel = [];
    Store.setCurrent(id);
    Persist.meta();
    Vision.invalidate();
    setTimeout(Render.fit, 0);
  }
  function newSceneFlow() {
    promptBox('Nova cena', 'Nome da cena', 'Cena ' + (Store.S.order.length + 1), { ok: 'Criar' }).then(name => {
      if (name == null) return;
      const sc = newScene(name.trim() || 'Nova cena');
      Store.addScene(sc); Persist.scene(sc.id);
      switchScene(sc.id);
      openTab('scene');
    });
  }
  // Uma cena de exemplo novinha, sem tocar nas cenas que já existem: boa para experimentar os recursos.
  function sampleScene() {
    Tools.cancel();
    const prev = Store.S.current;
    const sc = buildSample();              // já deixa a cena nova como a atual e o token principal selecionado
    const keep = App.sel;
    Store.S.current = prev;
    switchScene(sc.id);
    App.sel = keep;
    Tools.set('select'); openTab('sel');
    toast('Cena de exemplo criada. As suas cenas continuam como estavam.');
  }
  function duplicateScene() {
    const src = Store.scene(), sc = clone(src);
    sc.id = uid('cena'); sc.name = src.name + ' (cópia)'; sc.explored = {}; delete sc.sample;
    Store.addScene(sc); Persist.scene(sc.id);
    switchScene(sc.id);
    toast('Cena duplicada.');
  }
  function renameScene() {
    const sc = Store.scene();
    promptBox('Renomear cena', 'Nome da cena', sc.name).then(name => { if (name && name.trim()) Store.tx('Renomear cena', () => Store.scn({ name: name.trim() })); });
  }
  function deleteScene() {
    const sc = Store.scene();
    confirmBox('Apagar esta cena?', `"${sc.name}" e tudo o que está nela serão apagados. Isso não pode ser desfeito.`, 'Apagar cena', true).then(ok => {
      if (!ok) return;
      const id = sc.id;
      Store.removeScene(id); Persist.removeScene(id);
      if (!Store.S.order.length) { const n = newScene('Nova cena'); Store.addScene(n); Persist.scene(n.id); }
      switchScene(Store.S.order[0]);
    });
  }
  function setViewer(v) {
    if (v !== 'gm' && !playerById(v)) v = 'gm';
    Tools.cancel();
    App.viewer = v;
    App.sel = [];
    if (!Tools.allowed(App.tool)) Tools.set('select');
    if (v !== 'gm' && (App.tab === 'scene' || App.tab === 'players')) App.tab = 'sel';
    hideTurn();
    App.floats.length = 0;          // números de dano em trânsito não passam de uma visão para a outra
    Vision.invalidate();
    Store.emit('viewer');
    Render.request();
  }
  function addPlayer() {
    promptBox('Novo jogador', 'Nome do jogador', '', { ok: 'Adicionar' }).then(name => {
      if (!name || !name.trim()) return;
      const used = Store.S.players.map(p => p.color);
      const color = PLAYER_COLORS.find(c => !used.includes(c)) || PLAYER_COLORS[Store.S.players.length % PLAYER_COLORS.length];
      Store.S.players.push({ id: uid('jg'), name: name.trim(), color });
      Persist.meta(); Store.meta();
    });
  }

  /* ================= Barra do topo ================= */
  function renderTop() {
    const sc = Store.scene(), gm = isGM();
    const sceneBtn = h('button', { type: 'button', class: 'scene-b', id: 'sceneBtn', title: 'Trocar de cena', onclick: () => anchorMenu(sceneBtn, sceneMenu()) },
      icon('map', 17), h('span', { class: 'scene-n', text: sc.name }), icon('down', 14));
    const more = iconBtn('more', 'Arquivo e ajuda', () => anchorMenu(more, fileMenu(), true), { id: 'moreBtn' });
    zoomLabel = h('button', { type: 'button', class: 'zoom-l', id: 'zoomBtn', title: 'Enquadrar a cena (0)', text: Math.round(App.view.z * 100) + '%', onclick: () => { Render.fit(); status(); } });
    const zoomBy = k => { const [w, hh] = Render.size(); Render.zoomAt(w / 2, hh / 2, App.view.z * k); status(); };
    el.top.replaceChildren(
      h('span', { class: 'brand', text: 'Tiny Cats' }),
      gm ? sceneBtn : h('span', { class: 'scene-b flat' }, icon('map', 17), h('span', { class: 'scene-n', text: sc.name })),
      h('div', { class: 'grp' },
        iconBtn('undo', 'Desfazer (Ctrl+Z)', Tools.undo, { disabled: !Store.canUndo(), id: 'undoBtn' }),
        iconBtn('redo', 'Refazer (Ctrl+Shift+Z)', Tools.redo, { disabled: !Store.canRedo(), id: 'redoBtn' })),
      h('span', { class: 'spacer' }),
      h('label', { class: 'viewer' }, h('span', { class: 'viewer-l', text: 'Vendo como' }),
        inSelect('viewerSel', App.viewer, [['gm', 'Mestre']].concat(Store.S.players.map(p => [p.id, p.name])), setViewer, { title: 'Testar a cena como o mestre ou como um jogador' })),
      h('div', { class: 'grp zoom' }, iconBtn('minus', 'Afastar (-)', () => zoomBy(1 / 1.25), { size: 16 }), zoomLabel, iconBtn('plus', 'Aproximar (+)', () => zoomBy(1.25), { size: 16 })),
      more,
      iconBtn('panel', App.sideOpen ? 'Esconder o painel' : 'Mostrar o painel', () => { App.sideOpen = !App.sideOpen; refresh(); }, { on: App.sideOpen, id: 'panelBtn' }));
  }
  function sceneMenu() {
    const items = [{ head: 'Cenas' }];
    for (const id of Store.S.order) { const s = Store.S.scenes[id]; items.push({ label: s.name, check: id === Store.S.current, run: () => switchScene(id) }); }
    items.push('-', { label: 'Nova cena', icon: 'plus', run: newSceneFlow }, { label: 'Nova cena de exemplo', icon: 'map', run: sampleScene }, { label: 'Duplicar esta cena', icon: 'copy', run: duplicateScene },
      { label: 'Renomear', icon: 'edit', run: renameScene }, { label: 'Apagar esta cena…', icon: 'trash', danger: true, run: deleteScene });
    return items;
  }
  function fileMenu() {
    const gm = isGM();
    return [
      gm ? { label: 'Exportar esta cena', icon: 'download', run: exportScene } : null,
      gm ? { label: 'Exportar todas as cenas', icon: 'download', run: exportAll } : null,
      gm ? { label: 'Importar cena…', icon: 'upload', run: importFile } : null,
      gm ? { label: 'Barras padrão dos tokens…', icon: 'sliders', run: () => barDefaultsBox(null) } : null,
      gm ? '-' : null,
      { label: 'Animar efeitos e clima', check: App.anim, run: () => { App.anim = !App.anim; Store.S.prefs.anim = App.anim; Persist.meta(); Render.request(); } },
      { label: 'Atalhos de teclado', icon: 'help', run: helpBox },
      gm ? { label: 'Rever o tutorial', icon: 'play', run: () => Tour.start() } : null,
    ];
  }
  function helpBox() {

        const b = r.t.bars.find(x => x.on && x.n === name);
        let res = '';
        if (!r.on) res = 'fica de fora';

        else if (a) { const q = barAfter(b, areaDelta(a, r.half)); res = `${fmt(b.v)} → ${fmt(q.v)}` + (q.x !== undefined ? ` · sobrevida ${fmt(barX(b))} → ${fmt(q.x)}` : ''); }

  function rollToast(res) {
    if (!res.length) return;
    const undo = { action: 'Desfazer', run: Tools.undo };
    if (res.length === 1) { const r = res[0]; toast(`${r.name}: iniciativa ${r.total} (${rollText(r.d, r.bonus)})`, undo); return; }
    const top = res.slice().sort((p, q) => q.total - p.total || q.bonus - p.bonus);
    toast('Iniciativa: ' + top.slice(0, 4).map(r => `${r.name} ${r.total}`).join(' · ') + (top.length > 4 ? ` +${top.length - 4}` : ''), undo);

  // Mudar o tamanho do quadrado reescala tudo o que está na cena.
  function resizeCell(n) {
    const sc = Store.scene(), k = n / sc.cell;
    if (!isFinite(k) || k === 1) return;
    Store.tx('Tamanho do quadrado', () => {
      for (const t of sc.tokens) Store.upd('tokens', t.id, { x: t.x * k, y: t.y * k });
      for (const s of sc.shapes) Store.upd('shapes', s.id, s.pts ? { pts: s.pts.map(v => v * k), sw: s.sw * k } : s.k === 'text' ? { x: s.x * k, y: s.y * k, fs: s.fs * k } : { x: s.x * k, y: s.y * k, w: s.w * k, h: s.h * k, sw: s.sw * k });
      for (const w of sc.walls) Store.upd('walls', w.id, { x1: w.x1 * k, y1: w.y1 * k, x2: w.x2 * k, y2: w.y2 * k });
      for (const l of sc.lights) Store.upd('lights', l.id, { x: l.x * k, y: l.y * k });
      for (const e of sc.effects) Store.upd('effects', e.id, { x: e.x * k, y: e.y * k });
      for (const op of sc.fogOps) { if (op.k === 'rect') Store.upd('fogOps', op.id, { x: op.x * k, y: op.y * k, w: op.w * k, h: op.h * k }); else if (op.pts) Store.upd('fogOps', op.id, { pts: op.pts.map(v => v * k), s: op.s * k }); }
      Store.scn({ cell: n, bg: Object.assign({}, sc.bg, { dx: sc.bg.dx * k, dy: sc.bg.dy * k }) });
    });
    setTimeout(Render.fit, 30);
  }

  /* ---- Aba Jogadores ---- */

      if (gm) items.push({ label: e.gm ? 'Mostrar aos jogadores' : 'Deixar só para o mestre', icon: e.gm ? 'eye' : 'eyeOff', run: () => Store.tx('Visibilidade do efeito', () => Store.upd('effects', e.id, { gm: !e.gm })) });
      items.push({ label: 'Duplicar', icon: 'copy', key: 'Ctrl+D', run: Act.duplicateSel }, '-', { label: 'Apagar', icon: 'trash', key: 'Del', danger: true, run: deleteSelToast });

  function editText(s) {
    promptBox('Editar texto', 'Texto', s.txt, { multiline: true, ok: 'Salvar' }).then(v => { if (v && v.trim()) Store.tx('Editar texto', () => Store.upd('shapes', s.id, { txt: v.trim() })); });

  /* ================= HUD do token =================
     Faixa fixa na base do mapa com as barras do token selecionado: fica sempre
     no mesmo lugar e não cobre os vizinhos do token. */
  function renderHud() {
    const toks = selOf('tokens');
    const hide = () => { el.hud.hidden = true; el.hud.replaceChildren(); };
    if (toks.length !== 1 || App.sel.length !== 1 || App.tool !== 'select') { hide(); return; }
    const t = toks[0], gm = isGM();
    const edit = gm || can('bars', t), canCond = gm || can('conds', t);
    const kids = [];
    for (const { b, i, mode } of barsShown(t)) {
      const dots = b.k === 'pts' && Math.round(b.m) >= 1 && Math.round(b.m) <= PIP_MAX;
      if (edit && dots) {
        kids.push(h('span', { class: 'hud-b', style: { '--c': b.c } }, h('span', { class: 'hud-n', text: b.n }), pips(t, b, i, true, 'hud-b'), h('span', { class: 'hud-m', text: `${fmt(b.v)}/${fmt(b.m)}` })));
      } else if (edit) {
        kids.push(h('label', { class: 'hud-b', style: { '--c': b.c }, title: `${b.n}: digite um valor, ou +5 e -8 para somar e subtrair` },
          h('span', { class: 'hud-n', text: b.n }),
          h('input', { id: 'hud-b' + i, class: 'hud-in', type: 'text', inputmode: 'decimal', value: b.v, autocomplete: 'off', 'aria-label': b.n,
            onfocus: e => e.target.select(),
            onkeydown: e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } else if (e.key === 'Escape') { e.target.value = b.v; e.target.blur(); } },
            onchange: e => { if (!Act.barSet(t, i, e.target.value)) e.target.value = b.v; } }),
          h('span', { class: 'hud-m', text: '/' + fmt(b.m) })));
      } else if (mode === 'num') {
        kids.push(h('span', { class: 'hud-b', style: { '--c': b.c } }, h('span', { class: 'hud-n', text: b.n }), dots ? pips(t, b, i, false) : null, h('span', { class: 'hud-v', text: `${fmt(b.v)}/${fmt(b.m)}` })));
      }
    }
    // Condições ativas: as que têm contador ganham + e − aqui mesmo; as outras abrem a janela de condições.
    const info = t.cinfo || {};
    const conds = t.conds.map(id => COND_BY_ID[id]).filter(Boolean).sort((p, q) => ((info[q.id] && info[q.id].n) ? 1 : 0) - ((info[p.id] && info[p.id].n) ? 1 : 0));
    for (const c of conds.slice(0, 6)) {
      const ci = info[c.id] || {}, n = ci.n || 0, dur = ci.d ? ` · ${ci.d} ${ci.d === 1 ? 'rodada' : 'rodadas'}` : '';
      const badge = h('span', { class: 'chip-i', style: { background: c.c } }, icon(c.i, 12));
      if (canCond && n) {
        kids.push(h('span', { class: 'hud-c', title: c.n + dur },
          h('button', { type: 'button', class: 'stp-b', id: `hud-c-${c.id}-minus`, title: n === 1 ? `${c.n}: tirar 1 (em zero, a condição sai)` : `${c.n}: tirar 1`, 'aria-label': `Tirar 1 de ${c.n}`, onclick: () => condStepToast(t, c, -1) }, icon('minus', 13)),
          badge, h('span', { class: 'stp-v', id: `hud-c-${c.id}-n`, text: String(n) }),
          h('button', { type: 'button', class: 'stp-b', id: `hud-c-${c.id}-plus`, title: `${c.n}: somar 1`, 'aria-label': `Somar 1 em ${c.n}`, onclick: () => condStepToast(t, c, 1) }, icon('plus', 13))));
      } else if (canCond) {
        kids.push(h('button', { type: 'button', class: 'hud-c one', id: `hud-c-${c.id}`, title: `${c.n}${dur}: abrir condições`, 'aria-label': `${c.n}${dur}`, onclick: () => condPicker([t]) }, badge));
      } else {
        kids.push(h('span', { class: 'hud-c ro', title: c.n + dur }, badge, n ? h('span', { class: 'stp-v', text: String(n) }) : null));
      }
    }
    if (conds.length > 6) kids.push(h('span', { class: 'hud-m', text: '+' + (conds.length - 6) }));
    if (canCond) kids.push(iconBtn('shield', 'Condições', () => condPicker([t]), { size: 16, cls: 'hud-i', id: 'hud-cond' }));
    if (can('target')) { const on = isTargeted([t]); kids.push(iconBtn('center', on ? 'Tirar a mira (A)' : 'Mirar: marca este token como alvo (A)', () => Act.targetToggle([t]), { size: 16, cls: 'hud-i', on, id: 'hud-mira' })); }
    if (gm) kids.push(iconBtn(t.hidden ? 'eyeOff' : 'eye', t.hidden ? 'Oculto dos jogadores (clique para mostrar)' : 'Visível aos jogadores (clique para ocultar)', () => Store.tx(t.hidden ? 'Mostrar token' : 'Ocultar token', () => Store.upd('tokens', t.id, { hidden: !t.hidden })), { size: 16, cls: 'hud-i', on: t.hidden, id: 'hud-hide' }));
    if (!kids.length) { hide(); return; }
    const a = document.activeElement, fid = a && a.id && el.hud.contains(a) ? a.id : null;
    el.hud.replaceChildren(h('span', { class: 'hud-who' }, tokenAvatar(t, 24), h('span', { class: 'hud-name', text: tokName(t) })), ...kids);
    el.hud.hidden = false;
    if (fid) { const n = document.getElementById(fid); if (n && !n.disabled) n.focus({ preventScroll: true }); }
  }

  /* ================= Faixa "vez de…" =================
     Aparece por alguns segundos quando a vez muda e lembra as condições de quem vai jogar.
     É só um lembrete: não altera nada. */
  function hideTurn() { clearTimeout(turnTimer); el.turnb.hidden = true; el.turnb.replaceChildren(); }
  function turnBanner() {
    const sc = Store.scene(), tn = sc.turn;
    const key = sc.id + '|' + (tn.on && tn.cur ? tn.cur + ':' + tn.round : '');
    const prev = turnKey;
    turnKey = key;
    if (prev === key) return;
    if (prev === null || prev.split('|')[0] !== sc.id || !tn.on || !tn.cur) { hideTurn(); return; }
    if (!isGM() && !can('turns')) { hideTurn(); return; }
    const e = tn.list.find(x => x.id === tn.cur);
    const t = e && e.token ? Store.get('tokens', e.token) : null;
    if (!e || (t && !tokShown(t, sc))) { hideTurn(); return; }     // o jogador não fica sabendo de quem ele não vê
    const info = t ? t.cinfo || {} : {};
    const conds = t ? t.conds.map(id => COND_BY_ID[id]).filter(Boolean) : [];
    el.turnb.replaceChildren();
    addKids(el.turnb, [
      t ? tokenAvatar(t, 26) : null,
      h('span', { class: 'turnb-t' }, 'Vez de ', h('strong', { text: turnLabel(e, t ? tokName(t) : e.name) })),
      conds.map(c => {
        const ci = info[c.id] || {};
        return h('span', { class: 'turnb-c' }, h('span', { class: 'chip-i', style: { background: c.c } }, icon(c.i, 12)),
          h('span', { text: c.n + (ci.n ? ' ' + ci.n : '') + (ci.d ? ` · ${ci.d} ${ci.d === 1 ? 'rodada' : 'rodadas'}` : '') }));
      }),
      h('button', { type: 'button', class: 'ib turnb-x', title: 'Fechar', 'aria-label': 'Fechar o aviso de vez', onclick: hideTurn }, icon('x', 14)),
    ]);
    el.turnb.hidden = false;
    clearTimeout(turnTimer);
    turnTimer = setTimeout(hideTurn, conds.length ? 7000 : 4000);
  }

  /* ================= Véu do mestre =================
     A opção fica guardada como preferência de quem está olhando (não entra no desfazer da cena).
     Enquanto o véu está ligado, uma legenda pequena no canto do mapa diz de quem é a visão mostrada. */
  function setVeil(on) {
    App.showVision = !!on; Store.S.prefs.showVision = App.showVision;
    Persist.meta(); Vision.invalidate(); Render.request(); refresh();
  }
  function renderVeil() {
    const v = veilState(Store.scene());
    el.veil.hidden = !v;
    if (!v) { el.veil.replaceChildren(); return; }
    const text = v.tok ? 'Véu: visão de ' + tokName(v.tok) : 'Véu: visão dos jogadores';
    const a = document.activeElement, had = a && a.id === 'veilOff';
    el.veil.replaceChildren(icon('eye', 15), h('span', { class: 'veilchip-t', id: 'veilText', text }),
      h('button', { type: 'button', class: 'ib veilchip-x', id: 'veilOff', title: 'Desligar o véu', 'aria-label': 'Desligar o véu', onclick: () => { setVeil(false); toast('Véu desligado.', { action: 'Desfazer', run: () => setVeil(true) }); } }, icon('x', 14)));
    el.veil.title = v.tok ? 'O que está escurecido, ' + tokName(v.tok) + ' não enxerga agora' : 'O que está escurecido, nenhum jogador enxerga agora';
    if (had) document.getElementById('veilOff').focus({ preventScroll: true });
  }

  /* ================= Rodapé do mapa ================= */
  function status() {
    const sc = Store.scene();
    if (!sc) return;
    const m = App.mouse;
    let txt = '';
    if (m.inside && m.x >= 0 && m.y >= 0 && m.x < sceneW(sc) && m.y < sceneH(sc)) txt = `Coluna ${Math.floor(m.x / sc.cell) + 1} · Linha ${Math.floor(m.y / sc.cell) + 1}`;
    const sv = saveState === 'mem' ? 'Sem salvamento neste navegador' : saveState === 'erro' ? 'Não foi possível salvar' : saveState === 'saving' ? 'Salvando…' : 'Salvo neste navegador';
    const full = (txt ? txt + '  ·  ' : '') + sv;
    if (full !== statusText) { statusText = full; el.status.textContent = full; el.status.classList.toggle('warn', saveState === 'mem' || saveState === 'erro'); }
    if (zoomLabel) { const zt = Math.round(App.view.z * 100) + '%'; if (zoomLabel.textContent !== zt) zoomLabel.textContent = zt; }
  }

  /* ================= Atualização geral ================= */
  function renderAll() {
    const sc = Store.scene();
    if (!sc) return;
    pruneSel();
    try { if (Vision.isDirty()) Vision.update(sc, App.viewer); }   // a faixa do jogador depende do que ele enxerga
    catch (err) { /* a visão fica pendente; quem avisa do problema é o desenho do mapa */ }
    renderTop(); renderBanner(); renderRail(); renderOpts(); renderSide(); renderHud(); renderVeil(); turnBanner(); status();
    if (modalEl && modalLive) modalLive();
    document.title = 'Cenas · Tiny Cats';
  }
  function refresh() {
    if (timer) return;
    timer = setTimeout(() => {
      timer = 0;
      if (pressing) { pending = true; return; }
      renderAll();
    }, 0);
  }

  return {
    refresh, renderAll, toast, modal, closeMenus, contextMenu, openTab, editText, status,
    prompt: promptBox, confirm: confirmBox, importImages, initCaps, setViewer, switchScene,
    modalOpen: () => !!modalEl || Tour.active(),
    closeModal, condPicker, barDefaultsBox, areaBox,
    frame() { if (zoomLabel) { const zt = Math.round(App.view.z * 100) + '%'; if (zoomLabel.textContent !== zt) zoomLabel.textContent = zt; } },
    setSave(s) { saveState = s; status(); },
    hint() { el.hint.textContent = Tools.hint(); },      // a linha de dica muda sem redesenhar o resto (cursor sobre um item travado)
  };
})();
/* ---------------------------------------------------------------
   10b. TOUR — tutorial de primeiro uso
   Um destaque por vez, com um texto curto. O mestre só lê e avança:
   nada precisa ser feito durante o passeio e a cena não muda. Abre
   sozinho na primeira vez que o mestre entra e fica no menu ⋯ para rever.
   --------------------------------------------------------------- */
const Tour = (() => {
  let root = null, hole = null, card = null, steps = [], at = 0, saved = null, tick = 0;
  const SEEN_KEY = 'tinycats-tour', SEEN_KEY_OLD = 'urgm-tour';       // marca de "já viu o tutorial" neste navegador

  const rectOf = sel => {
    const n = document.querySelector(sel);
    if (!n || n.hidden) return null;
    const r = n.getBoundingClientRect();
    return r.width > 4 && r.height > 4 ? r : null;
  };
  // O token na tela, com folga para as barras em cima e o nome embaixo.
  function tokenRect(id) {
    const t = Store.get('tokens', id), sc = Store.scene();
    if (!t) return null;
    const r = Render.cv.getBoundingClientRect(), z = App.view.z, s = t.size * sc.cell * z;
    const [sx, sy] = Render.toScreen(t.x, t.y);
    return { left: r.left + sx - s * 0.25, top: r.top + sy - s * 0.55, width: s * 1.5, height: s * 2.05 };
  }
  function pickToken() {
    const sc = Store.scene(), sel = selOf('tokens');
    return (sel.length === 1 && App.sel.length === 1 ? sel[0] : null) || sc.tokens.find(t => t.owner && !t.hidden) || sc.tokens.find(t => !t.hidden) || sc.tokens[0] || null;
  }

  function build() {
    const tok = pickToken(), id0 = tok ? tok.id : null, sc = Store.scene();
    // No passo das condições, de preferência um token que já tenha alguma ativa (melhor ainda com contador).
    const withCond = sc.tokens.find(t => !t.hidden && t.conds.some(c => t.cinfo && t.cinfo[c] && (t.cinfo[c].n || t.cinfo[c].d))) || sc.tokens.find(t => !t.hidden && t.conds.length);
    const idC = withCond ? withCond.id : id0;
    const selectTok = id => {
      Tools.set('select');
      if (id && Store.get('tokens', id)) {
        setSel([{ c: 'tokens', id }]);
        // traz o token para a tela se a câmera estiver longe dele
        const r = tokenRect(id), cv = Render.cv.getBoundingClientRect();
        if (r && (r.left < cv.left || r.top < cv.top || r.left + r.width > cv.right || r.top + r.height > cv.bottom - 90)) { const [cx, cy] = tokC(Store.get('tokens', id), Store.scene()); Render.centerOn(cx, cy); }
      }
    };
    const select = () => selectTok(id0), id = id0;
    const openSec = sid => { const d = document.getElementById(sid); if (d) { d.open = true; d.scrollIntoView({ block: 'nearest' }); } };
    return [
      {
        title: 'Bem-vindo à mesa de cenas',
        text: 'Em um minuto, o essencial para conduzir uma cena: mover, barras, condições, turnos e ver como jogador. Você só lê e avança; nada muda na cena.',
        next: 'Começar',
      },
      {
        title: 'Mover os tokens',
        text: 'Arraste um token para movê-lo; ele encaixa na grade. Para andar pelo mapa, segure espaço e arraste. A roda do mouse aproxima e afasta.',
        enter: select, target: () => (id ? tokenRect(id) : null) || rectOf('#stage'),
      },
      {
        title: 'Barras',
        text: 'Com um token selecionado, as barras dele aparecem nesta faixa. Digite o valor novo, ou -8 e +5 para tirar e devolver. Para criar outras barras, use "Adicionar barra" no painel.',
        enter: select, target: () => rectOf('#hud'), side: 'above',
      },
      {
        title: 'Condições',
        text: 'Aqui você marca o que está afetando o token. Cada condição ativa pode ter um contador, que só muda nos botões + e −, e uma duração em rodadas, que desconta sozinha.',
        enter: () => { selectTok(idC); UI.openTab('sel'); }, after: () => openSec('s-cond'), target: () => rectOf('#s-cond') || rectOf('#side'), side: 'left',
      },
      {
        title: 'Turnos',
        text: 'A ordem do combate fica nesta aba. "Próximo turno" passa a vez, avisa de quem é a vez e desconta as durações.',
        enter: () => { UI.openTab('turn'); }, target: () => rectOf('#side'), side: 'left',
      },
      {
        title: 'Ver como jogador',
        text: 'Troque para um jogador e confira o que ele enxerga e pode fazer. Para voltar, escolha Mestre. Este passeio fica guardado no menu ⋯, em "Rever o tutorial".',
        target: () => rectOf('.viewer'), side: 'below', next: 'Concluir',
      },
    ];
  }

  function layout() {
    if (!root) return;
    const st = steps[at], W = window.innerWidth, H = window.innerHeight, gap = 14, m = 12;
    const r0 = st.target ? st.target() : null;
    const cw = card.offsetWidth, chh = card.offsetHeight;
    if (!r0) {
      hole.className = 'tour-hole none';
      hole.style.cssText = '';
      card.style.left = Math.max(m, (W - cw) / 2) + 'px';
      card.style.top = Math.max(m, (H - chh) / 2) + 'px';
      return;
    }
    const pad = 6;
    const x0 = clamp(r0.left - pad, 4, W - 4), y0 = clamp(r0.top - pad, 4, H - 4);
    const x1 = clamp(r0.left + r0.width + pad, 4, W - 4), y1 = clamp(r0.top + r0.height + pad, 4, H - 4);
    hole.className = 'tour-hole';
    hole.style.left = x0 + 'px'; hole.style.top = y0 + 'px';
    hole.style.width = Math.max(0, x1 - x0) + 'px'; hole.style.height = Math.max(0, y1 - y0) + 'px';
    const fits = { below: H - y1 >= chh + gap + m, above: y0 >= chh + gap + m, left: x0 >= cw + gap + m, right: W - x1 >= cw + gap + m };
    const order = [st.side, 'below', 'above', 'right', 'left'].filter(Boolean);
    const side = order.find(s => fits[s]) || 'center';
    let x, y;
    if (side === 'below') { x = (x0 + x1) / 2 - cw / 2; y = y1 + gap; }
    else if (side === 'above') { x = (x0 + x1) / 2 - cw / 2; y = y0 - gap - chh; }
    else if (side === 'left') { x = x0 - gap - cw; y = y0; }
    else if (side === 'right') { x = x1 + gap; y = y0; }
    else { x = (W - cw) / 2; y = (H - chh) / 2; }
    card.style.left = clamp(x, m, Math.max(m, W - cw - m)) + 'px';
    card.style.top = clamp(y, m, Math.max(m, H - chh - m)) + 'px';
  }

  function show(k) {
    at = clamp(k, 0, steps.length - 1);
    const st = steps[at], last = at === steps.length - 1;
    if (st.enter) st.enter();
    UI.renderAll();
    if (st.after) st.after();
    // ev.detail é 0 quando o "clique" veio do teclado (Enter ou espaço)
    const go = h('button', { type: 'button', class: 'btn primary', id: 'tour-next', onclick: ev => (last ? finish(ev.detail === 0) : show(at + 1)) }, h('span', { text: st.next || 'Próximo' }));
    card.replaceChildren();
    addKids(card, [
      at > 0 ? h('div', { class: 'tour-n', text: `${at} de ${steps.length - 1}` }) : null,
      h('h2', { class: 'tour-t', id: 'tour-title', text: st.title }),
      h('p', { class: 'tour-p', text: st.text }),
      h('div', { class: 'tour-a' },
        last ? null : h('button', { type: 'button', class: 'tour-skip', id: 'tour-skip', text: 'Pular o tutorial', onclick: ev => finish(ev.detail === 0) }),
        h('span', { class: 'spacer' }),
        at > 0 ? h('button', { type: 'button', class: 'btn', id: 'tour-back', onclick: () => show(at - 1) }, h('span', { text: 'Voltar' })) : null,
        go),
    ]);
    layout();
    go.focus({ preventScroll: true });
    // o painel e o mapa podem acabar de se ajeitar um instante depois: mede de novo
    clearTimeout(tick);
    tick = setTimeout(layout, 260);
  }

  function onKey(e) {
    if (!root) return;
    e.stopPropagation();                         // nenhuma tecla chega aos atalhos do mapa enquanto o passeio está aberto
    if (e.key === 'Escape') { e.preventDefault(); finish(true); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); if (at < steps.length - 1 && !e.repeat) show(at + 1); return; }   // o último passo só fecha no botão
    if (e.key === 'ArrowLeft') { e.preventDefault(); if (at > 0 && !e.repeat) show(at - 1); return; }
    if (e.key === 'Tab') {                       // o foco fica dentro do cartão
      const f = Array.from(card.querySelectorAll('button'));
      if (!f.length) return;
      const i = f.indexOf(document.activeElement);
      e.preventDefault();
      f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
    }
  }

  function start() {
    if (root) return;
    UI.closeMenus(); UI.closeModal();
    if (!isGM()) UI.setViewer('gm');
    Tools.cancel();
    saved = { sel: App.sel.slice(), tab: App.tab, sideOpen: App.sideOpen, tool: App.tool, view: Object.assign({}, App.view) };
    steps = build();
    hole = h('div', { class: 'tour-hole none' });
    card = h('div', { class: 'tour-card', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'tour-title' });
    root = h('div', { class: 'tour', id: 'tour' }, hole, card);
    document.body.append(root);
    document.addEventListener('keydown', onKey, true);
    window.addEventListener('resize', layout);
    show(0);
  }

  function finish(byKey) {
    if (!root) return;
    clearTimeout(tick);
    document.removeEventListener('keydown', onKey, true);
    window.removeEventListener('resize', layout);
    root.remove(); root = hole = card = null;
    if (byKey === true) {
      // fechou pelo teclado com a tecla ainda apertada: as repetições dela não podem cair nos atalhos do mapa
      const eat = e => { if (e.repeat) { e.stopPropagation(); e.preventDefault(); } };
      const off = () => { document.removeEventListener('keydown', eat, true); document.removeEventListener('keyup', off, true); };
      document.addEventListener('keydown', eat, true);
      document.addEventListener('keyup', off, true);
    }
    // devolve a tela como estava
    App.tab = saved.tab; App.sideOpen = saved.sideOpen;
    Object.assign(App.view, saved.view);
    Tools.set(saved.tool);
    setSel(saved.sel.filter(s => Store.get(s.c, s.id)));
    saved = null;
    Store.S.prefs.tour = 1;
    Persist.meta();
    try { localStorage.setItem(SEEN_KEY, '1'); } catch (e) { /* sem armazenamento: o tutorial volta na próxima visita */ }
    UI.renderAll();
  }

  // Quem já viu o tutorial com o nome antigo da mesa não precisa ver de novo: a chave antiga continua valendo na leitura.
  const seen = () => { if (Store.S.prefs.tour) return true; try { return localStorage.getItem(SEEN_KEY) === '1' || localStorage.getItem(SEEN_KEY_OLD) === '1'; } catch (e) { return false; } };

  return { start, finish, seen, active: () => !!root, step: () => at };
})();

// Paredes da guarita da cena de exemplo, em quadrados: [x1, y1, x2, y2, tipo]
const SAMPLE_WALLS = [
  [17, 3, 25, 3], [25, 3, 25, 9], [17, 9, 20, 9], [20, 9, 21, 9, 'door'], [21, 9, 25, 9],
  [17, 3, 17, 6], [17, 7, 17, 9], [22, 3, 22, 6],
];

// Fundo desenhado na hora (grama, estrada, guarita), para a cena de exemplo não depender de arquivo.
function makeSampleBg(cols, rows, cell) {
  const w = cols * cell, hh = rows * cell;
  const c = document.createElement('canvas'); c.width = w; c.height = hh;
  const g = c.getContext('2d'), rnd = mulberry(11);
  g.fillStyle = '#4b5b40'; g.fillRect(0, 0, w, hh);
  const greens = ['#3d4c35', '#56693f', '#445637', '#5e6c46', '#39472f'];
  for (let i = 0; i < 520; i++) {
    const r = 30 + rnd() * 110;
    g.globalAlpha = 0.1 + rnd() * 0.12; g.fillStyle = greens[i % 5];
    g.beginPath(); g.ellipse(rnd() * w, rnd() * hh, r, r * (0.5 + rnd() * 0.6), rnd() * Math.PI, 0, TAU); g.fill();
  }
  g.globalAlpha = 0.32; g.lineWidth = 1.5; g.lineCap = 'round';
  for (let i = 0; i < 2600; i++) {
    const x = rnd() * w, y = rnd() * hh, a = -Math.PI / 2 + (rnd() - 0.5) * 0.9, l = 4 + rnd() * 6;
    g.strokeStyle = i % 2 ? '#6c7f4e' : '#33412b';
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  // Estrada de terra
  const road = () => { g.beginPath(); g.moveTo(-80, 14.6 * cell); g.bezierCurveTo(8 * cell, 15.6 * cell, 15 * cell, 8.6 * cell, w + 80, 10.2 * cell); };
  g.globalAlpha = 1;
  road(); g.strokeStyle = '#5c5140'; g.lineWidth = cell * 2.9; g.stroke();
  road(); g.strokeStyle = '#7a6950'; g.lineWidth = cell * 2.3; g.stroke();
  road(); g.globalAlpha = 0.45; g.strokeStyle = '#8c7a5d'; g.lineWidth = cell * 1.1; g.stroke();
  // Piso de pedra da guarita
  g.globalAlpha = 1; g.fillStyle = '#48443c'; g.fillRect(17 * cell, 3 * cell, 8 * cell, 6 * cell);
  for (let cy = 3; cy < 9; cy++) for (let cx = 17; cx < 25; cx++) {
    const s = 96 + Math.floor(rnd() * 28);
    g.fillStyle = `rgb(${s + 8},${s + 3},${s - 8})`;
    g.fillRect(cx * cell + 2, cy * cell + 2, cell - 4, cell - 4);
  }
  for (let i = 0; i < 14; i++) {
    g.globalAlpha = 0.2; g.fillStyle = '#4a5c3a';
    g.beginPath(); g.arc((17 + rnd() * 8) * cell, (3 + rnd() * 6) * cell, 14 + rnd() * 30, 0, TAU); g.fill();
  }
  // Muros
  g.globalAlpha = 1; g.lineCap = 'square';
  for (const [x1, y1, x2, y2, k] of SAMPLE_WALLS) {
    g.strokeStyle = k ? '#6d4b2a' : '#2b2824'; g.lineWidth = k ? 9 : 15;
    g.beginPath(); g.moveTo(x1 * cell, y1 * cell); g.lineTo(x2 * cell, y2 * cell); g.stroke();
    if (!k) { g.strokeStyle = '#5b554b'; g.lineWidth = 5; g.stroke(); }
  }
  // Árvores
  const trees = [[2.5, 3, 1.5], [5.2, 17.2, 1.3], [27.5, 4.2, 1.6], [27.2, 13.2, 1.4], [28.4, 16.6, 1.2], [1.6, 9.4, 1.1], [12.5, 2.2, 1.2], [13.6, 17.6, 1.5], [23, 16.4, 1.1], [8.4, 5.6, 1]];
  for (const [tx, ty, tr] of trees) {
    const x = tx * cell, y = ty * cell, r = tr * cell;
    g.globalAlpha = 0.28; g.fillStyle = '#000'; g.beginPath(); g.arc(x + r * 0.16, y + r * 0.2, r, 0, TAU); g.fill();
    for (let i = 0; i < 9; i++) {
      const a = rnd() * TAU, d = rnd() * r * 0.55;
      g.globalAlpha = 0.9; g.fillStyle = ['#2c4629', '#355432', '#3f6239'][i % 3];
      g.beginPath(); g.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, r * (0.42 + rnd() * 0.25), 0, TAU); g.fill();
    }
    g.globalAlpha = 0.5; g.fillStyle = '#56794a';
    g.beginPath(); g.arc(x - r * 0.2, y - r * 0.25, r * 0.3, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  return c;
}

// Monta a cena de exemplo. Na primeira visita ela é a cena inicial; depois, o mestre pode pedir outra pelo menu de cenas.
function buildSample() {
  const S = Store.S;
  const me = { id: 'jg_dalmo', name: 'Dalmo', color: PLAYER_COLORS[0] };
  if (!S.players.length) S.players.push(me);
  const taken = S.order.map(id => S.scenes[id].name);
  let name = 'Cena de exemplo';
  for (let k = 2; taken.includes(name); k++) name = `Cena de exemplo ${k}`;
  const sc = newScene(name);
  sc.sample = true;
  const c = sc.cell;
  try {
    const cv = makeSampleBg(sc.cols, sc.rows, c);
    const a = Assets.register(Assets.encode(cv, 'bg'), cv.width, cv.height, 'bg', 'Estrada e guarita (exemplo)');
    sc.bg.asset = a.id;
  } catch (e) { sc.bgColor = '#4b5b40'; }
  sc.light = 'penumbra';
  sc.fog.dynamic = true;

  for (const [x1, y1, x2, y2, k] of SAMPLE_WALLS) sc.walls.push({ id: uid('wl'), k: k || 'wall', x1: x1 * c, y1: y1 * c, x2: x2 * c, y2: y2 * c, open: false, locked: false });
  sc.lights.push({ id: uid('lz'), name: 'Fogueira', x: 19.5 * c, y: 5.5 * c, bright: 3, dim: 6, c: '#ff9d4d', on: true });
  sc.effects.push({ id: uid('fx'), fx: 'fogo', k: 'circ', x: 19.5 * c, y: 5.5 * c, r: 0.5, w: 1, ang: 60, dir: 0, pow: 1, token: null, gm: false, by: null, seed: 7 });

  const tok = (name, cx, cy, extra) => { const t = newToken(sc, cx * c, cy * c, Object.assign({ name }, extra)); sc.tokens.push(t); return t; };
  const bars = (v1, m1, v2, m2, v3, m3, n3) => [
    { n: 'Vida', c: BAR_DEFAULTS[0].c, v: v1, m: m1, on: true },
    { n: 'SP', c: BAR_DEFAULTS[1].c, v: v2 || 0, m: m2 || 10, on: !!m2 },
    { n: n3 || 'Energia', c: BAR_DEFAULTS[2].c, v: v3 || 0, m: m3 || 10, on: !!m3 },
  ].map(cleanBar);
  // Dain X mostra os dois estilos: três barras e um recurso em pontos.
  const dainBars = bars(62, 80, 24, 40, 20, 100, 'Fé').concat(cleanBar({ n: 'Poder divino', c: '#b07ad9', v: 3, m: 5, k: 'pts', on: true }));
  const dain = tok('Dain X', 9, 12, { owner: S.players[0].id, color: '#b9892f', barVis: 'num', bars: dainBars, auras: [{ id: uid('au'), k: 'circ', r: 1.5, c: '#f0cf6a', a: 0.16, ang: 60, dir: 0, pub: true }] });
  const astie = tok('Astie', 8, 13, { color: '#5f8fb8', bars: bars(38, 45, 30, 30) });
  const kairo = tok('Kairo', 10, 13, { color: '#6f9a62', bars: bars(51, 60, 12, 25), light: { on: true, bright: 4, dim: 8, c: '#ffc477' } });
  // Bandido: sangrando e com um contador de queimadura; Capitão: proteção que dura três rodadas.
  const b1 = tok('Bandido', 14, 10, { color: '#9c4a45', bars: bars(14, 22), conds: ['sangue', 'fogo'], cinfo: { fogo: { n: 2 } } });
  const b2 = tok('Bandida', 15, 12, { color: '#9c4a45', bars: bars(22, 22) });
  const chefe = tok('Capitão', 22, 6, { size: 2, color: '#7a3550', bars: bars(70, 70, 20, 20), conds: ['escudo'], cinfo: { escudo: { d: 3, d0: 3 } } });
  tok('Arqueira', 26, 11, { color: '#75606e', hidden: true, bars: bars(18, 18), notes: 'Só ataca quando alguém passar da porta.' });

  sc.effects.push({ id: uid('fx'), fx: 'gelo', k: 'cone', x: 0, y: 0, r: 5, w: 1, ang: 50, dir: 335, pow: 0.9, token: astie.id, gm: false, by: null, seed: 21 });
  sc.shapes.push({ id: uid('sh'), k: 'text', x: 17.1 * c, y: 1.9 * c, txt: 'Guarita em ruínas', fs: 34, s: '#f3ead2', sw: 0, f: null, a: 1, top: false, gm: false, lock: false, by: null });
  sc.shapes.push({ id: uid('sh'), k: 'line', pts: [12.2 * c, 11.6 * c, 19.9 * c, 9.9 * c], s: '#f2c14e', sw: 5, f: null, a: 0.85, arrow: true, top: false, gm: true, lock: false, by: null });

  const order = [[dain, 18], [chefe, 15], [astie, 14], [b1, 11], [kairo, 9], [b2, 7]];
  sc.turn = { on: true, round: 2, cur: null, list: order.map(([t, init]) => ({ id: uid('tn'), token: t.id, name: t.name, init })) };
  sc.turn.cur = sc.turn.list[0].id;
  normalizeScene(sc);                     // a cena de exemplo nasce com todos os campos do modelo atual

  Store.addScene(sc);
  S.current = sc.id;
  Persist.scene(sc.id);
  Persist.meta();
  App.sel = [{ c: 'tokens', id: dain.id }];
  return sc;
}

// Números de dano e cura: compara as barras de antes e de depois de cada alteração feita na mesa.
function barFloats(op, inv) {
  if (!inv || op.t !== 'upd' || op.c !== 'tokens' || !op.p.bars || !inv.p || !inv.p.bars) return;
  const t = Store.get('tokens', op.id), was = inv.p.bars, now = op.p.bars;
  if (!t || was.length !== now.length) return;
  now.forEach((b, i) => {
    const a = was[i];
    if (!a.on || !b.on || a.n !== b.n || a.m !== b.m) return;                    // só conta quando foi o valor que mudou
    if (barMode(t, b) !== 'num') return;                                         // quem não vê os números não vê o quanto mudou
    if (barX(a) !== barX(b)) floatDelta(t, Math.round((barX(b) - barX(a)) * 10) / 10, 'Sobrevida', SOBRE_COR);
    if (a.v !== b.v) floatDelta(t, Math.round((b.v - a.v) * 10) / 10, b.n);
  });
}

async function start(snap) {
  Render.readTheme();
  const had = await Persist.load();
  if (!had) buildSample();
  if (!Store.scene()) { const sc = newScene('Nova cena'); Store.addScene(sc); Store.S.current = sc.id; }
  App.anim = Store.S.prefs.anim !== false;
  App.showVision = !!Store.S.prefs.showVision;
  if (window.innerWidth < 900) App.sideOpen = false;

  Store.on('live', (op, inv) => { Vision.onOp(op); barFloats(op, inv); Render.request(); });
  Store.on('commit', e => { Persist.scene(e.sceneId); UI.refresh(); Render.request(); });
  Store.on('sel', () => { Vision.selChanged(); UI.refresh(); Render.request(); });
  Store.on('tool', () => UI.refresh());
  Store.on('viewer', () => UI.refresh());
  Store.on('meta', () => UI.refresh());
  Store.on('scene', () => { UI.refresh(); Render.request(); });
  Persist.onStatus(s => UI.setSave(s));
  UI.setSave(Persist.status());

  // Estado de tela de antes de uma atualização da página (quando o visualizador oferece).
  if (snap && typeof snap === 'object') {
    if (snap.scene && Store.S.scenes[snap.scene]) Store.S.current = snap.scene;
    if (snap.viewer && (snap.viewer === 'gm' || playerById(snap.viewer))) App.viewer = snap.viewer;
    if (snap.tab) App.tab = snap.tab;
    if (snap.tour) Store.S.prefs.tour = 1;      // já viu o tutorial antes desta atualização da página
  }

  const stage = $('#stage');
  Render.resize();
  Render.fit();
  if (snap && snap.view && isFinite(snap.view.z)) Object.assign(App.view, snap.view);
  UI.renderAll();
  UI.initCaps();
  let first = true;
  if (window.ResizeObserver) new ResizeObserver(() => { Render.resize(); if (first) { first = false; Render.fit(); UI.status(); } }).observe(stage);
  else window.addEventListener('resize', Render.resize);

  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', Render.readTheme);
  new MutationObserver(Render.readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { Render.request(); UI.refresh(); });

  const flush = () => { try { Vision.flushExplored(); Persist.flush(); } catch (e) { /* nada a fazer */ } };
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

  // Tutorial de primeiro uso: abre sozinho uma vez, quando quem entra é o mestre.
  // (Nos testes automáticos, com ?debug, só abre se o endereço também trouxer ?tour.)
  // Aberta pela casca do site (que já mostra a marca na barra de cima): a marca daqui some.
  if (/[?&]casca\b/.test(location.search)) document.documentElement.classList.add('na-casca');
  // Dentro do site, com uma mesa aberta: as rolagens daqui (iniciativa) também vão para a mesa ao vivo.
  // Token que os jogadores não veem, ou de nome escondido, sai marcado como oculto: a rolagem dele fica só com o mestre.
  Fichas.start(() => { try { UI.renderAll(); } catch (e) { /* ainda abrindo */ } });
  // A lista das cenas, para os outros sistemas do site (o Acampamento e o Mapa-múndi abrem uma cena pelo nome).
  const listar = () => { try { localStorage.setItem('tinycats:cenas:lista', JSON.stringify(Store.S.order.filter(id => Store.S.scenes[id]).map(id => ({ id, nome: Store.S.scenes[id].name })))); } catch (e) { /* sem armazenamento: os atalhos só não mostram a lista */ } };
  Store.on('meta', listar);
  Store.on('commit', e => { if (e.ops.some(op => op.t === 'scn' && op.p && 'name' in op.p)) listar(); });
  listar();
  // Outro sistema pediu uma cena: { cena: id } abre a que existe; { criar: { id, nome } } cria (uma vez) e abre.
  if (window.TC && window.TC.ponte && window.TC.ponte.aoIr) window.TC.ponte.aoIr(alvo => {
    if (!alvo || !isGM()) return;
    const pedido = alvo.criar && typeof alvo.criar.id === 'string' && /^[A-Za-z0-9_-]{1,60}$/.test(alvo.criar.id) ? alvo.criar : null;
    const id = pedido ? pedido.id : alvo.cena;
    if (pedido && !Store.S.scenes[id]) {
      const sc = newScene(String(pedido.nome || 'Acampamento').slice(0, 60));
      sc.id = id; sc.tone = 'noite'; sc.light = 'penumbra';
      Store.addScene(sc); Persist.scene(sc.id);
      UI.toast(`Cena "${sc.name}" criada. Monte o mapa do acampamento aqui.`);
    }
    if (typeof id === 'string' && Store.S.scenes[id] && Store.S.current !== id) UI.switchScene(id);
  });
  if (window.TC && window.TC.ponte && !Ext.roll) Ext.roll = r => {
    if (!window.TC.ponte.estado.mesa) return;
    const t = r.tokenId ? Store.get('tokens', r.tokenId) : null;
    // char: a ficha ligada ao token (a mesa ao vivo mostra a imagem do personagem ao lado de quem rolou)
    window.TC.ponte.publicar('cena', Object.assign({}, r, { oculto: !!(t && (t.hidden || t.showName === false)), char: (t && t.char) || null }));
  };
  const dbg = /[?&]debug\b/.test(location.search);
  if (isGM() && !Tour.seen() && (!dbg || /[?&]tour\b/.test(location.search))) setTimeout(() => { if (!UI.modalOpen()) Tour.start(); }, 700);
}

(function boot() {
  // Acesso para testes automáticos (só com ?debug no endereço). __tc é o nome de agora; __urgm, o que os testes antigos usam.
  if (/[?&]debug\b/.test(location.search)) window.__tc = window.__urgm = { Fichas, Store, App, Tools, Vision, Render, UI, Act, FX, Persist, Assets, Tour, Walls, Ext, can, tokShown, setSel, barsShown, tokensIn, auraShape, fxVisible, doorSpots, rollDie, applyLabel, newToken, newScene, barAfter, barX, cleanBar };
  const hot = window.claude && window.claude.hot;
  try {
    if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ view: Object.assign({}, App.view), viewer: App.viewer, tab: App.tab, scene: Store.S.current, tour: Tour.seen() }));
  } catch (e) { /* sem esse recurso, segue normal */ }
  let started = false;
  const go = snap => {
    if (started) return;
    started = true;
    start(snap || {}).catch(err => {
      // Algo impediu a mesa de abrir: mostra o motivo em vez de uma tela vazia.
      console.error(err);
      const box = document.createElement('div');
      box.className = 'fatal';
      box.textContent = 'Não consegui abrir a mesa: ' + (err && err.message ? err.message : 'erro desconhecido') + '. Recarregue a página; se continuar, me mande esta mensagem.';
      $('#stage').append(box);
    });
  };
  if (hot && typeof hot.ready === 'function') {
    try { hot.ready(go); } catch (e) { /* cai no início normal abaixo */ }
    setTimeout(() => go({}), 1500);
  } else go((hot && hot.data) || {});
})();
})();
</script>
