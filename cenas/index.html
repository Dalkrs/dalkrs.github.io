      gm ? sceneBtn : h('span', { class: 'scene-b flat' }, icon('map', 17), h('span', { class: 'scene-n', text: Nuvem.semCena() ? 'Sem cena' : sc.name })),
      air,
      h('div', { class: 'grp' },
        iconBtn('undo', 'Desfazer (Ctrl+Z)', Tools.undo, { disabled: !Store.canUndo(), id: 'undoBtn' }),
        iconBtn('redo', 'Refazer (Ctrl+Shift+Z)', Tools.redo, { disabled: !Store.canRedo(), id: 'redoBtn' })),
      h('span', { class: 'spacer' }),
      Nuvem.jogador() ? null : h('label', { class: 'viewer' }, h('span', { class: 'viewer-l', text: 'Vendo como' }),
        inSelect('viewerSel', App.viewer, [['gm', 'Mestre']].concat(Store.S.players.map(p => [p.id, p.name])), setViewer, { title: 'Testar a cena como o mestre ou como um jogador' })),
      h('div', { class: 'grp zoom' }, iconBtn('minus', 'Afastar (-)', () => zoomBy(1 / 1.25), { size: 16 }), zoomLabel, iconBtn('plus', 'Aproximar (+)', () => zoomBy(1.25), { size: 16 })),
      more,
      iconBtn('panel', App.sideOpen ? 'Esconder o painel' : 'Mostrar o painel', () => { App.sideOpen = !App.sideOpen; refresh(); }, { on: App.sideOpen, id: 'panelBtn' }),
    ].filter(Boolean));          // (o que não se aplica a quem está olhando fica de fora)
  }
  function sceneMenu() {
    const items = [{ head: 'Cenas' }], ar = Nuvem.noAr();
    for (const id of Store.S.order) { const s = Store.S.scenes[id]; items.push({ label: s.name, check: id === Store.S.current, key: id === ar ? 'no ar' : null, run: () => switchScene(id) }); }
    items.push('-', { label: 'Nova cena', icon: 'plus', run: newSceneFlow }, { label: 'Nova cena de exemplo', icon: 'map', run: sampleScene }, { label: 'Duplicar esta cena', icon: 'copy', run: duplicateScene },
      { label: 'Renomear', icon: 'edit', run: renameScene }, { label: 'Apagar esta cena…', icon: 'trash', danger: true, run: deleteScene });
    return items;
  }

  /* ---- No ar: a cena que os jogadores da mesa veem. Só muda quando o mestre manda, e dá para desfazer. ---- */
  function showToPlayers(id) {
    const antes = Nuvem.noAr(), sc = Store.S.scenes[id];
    if (!sc || !Nuvem.mostrar(id)) return;
    toast(`Os jogadores agora veem "${sc.name}".`, { action: 'Desfazer', run: () => { if (antes && Store.S.scenes[antes]) Nuvem.mostrar(antes); else Nuvem.esconder(); } });
    // a mesa ao vivo avisa: quem está em outra aba fica sabendo que há cena nova para ver
    try { window.TC.ponte.publicar('cena', { kind: 'aviso', titulo: 'Cena: ' + sc.name, resumo: 'O mestre mostrou esta cena aos jogadores. Ela está na aba Cenas.' }); } catch (e) { /* sem a casca, não há mesa ao vivo */ }
  }
  function hideFromPlayers() {
    const antes = Nuvem.noAr();
    if (!Nuvem.esconder()) return;
    toast('Os jogadores não veem mais nenhuma cena.', { action: 'Desfazer', run: () => { if (antes && Store.S.scenes[antes]) Nuvem.mostrar(antes); } });
  }
  function airMenu() {
    const cur = Store.S.current, ar = Nuvem.noAr(), outra = ar && ar !== cur && Store.S.scenes[ar];
    return [
      { head: ar === cur ? 'Os jogadores veem esta cena' : outra ? `Os jogadores veem "${outra.name}"` : 'Os jogadores não veem nenhuma cena' },
      ar === cur ? null : { label: 'Mostrar esta cena aos jogadores', icon: 'eye', run: () => showToPlayers(cur) },
      outra ? { label: 'Ir para a cena que está no ar', icon: 'map', run: () => switchScene(ar) } : null,
      ar ? { label: 'Tirar a cena do ar', icon: 'eyeOff', run: hideFromPlayers } : null,
    ];
  }

  /* ---- As cenas guardadas neste navegador (de antes da mesa): o mestre escolhe quais levar para a mesa. ---- */
  const offeredKey = () => 'tinycats:cenas:oferta:' + ((window.TC && window.TC.ponte && window.TC.ponte.estado.mesa) || {}).id;
  async function offerLocal() {
    if (!Nuvem.mestre()) return;
    const lista = await Nuvem.cenasDoNavegador();
    refresh();                                    // o painel passa a lembrar que há cenas neste navegador (ver emptySel)
    if (!lista.length || modalEl || Tour.active()) return;
    try { if (localStorage.getItem(offeredKey())) return; localStorage.setItem(offeredKey(), '1'); } catch (e) { /* sem armazenamento: oferece de novo na próxima vez */ }
    localScenesBox(lista, true);
  }
  // A mesa só tem a cena vazia do começo? (é quando vale lembrar o mestre das cenas que ele deixou no navegador)
  const onlyBlank = () => { const sc = Store.scene(); return Store.S.order.length === 1 && !sc.tokens.length && !sc.walls.length && !sc.shapes.length && !sc.bg.asset; };
  async function bringLocal() {
    const lista = await Nuvem.cenasDoNavegador();
    if (!lista.length) { toast('Este navegador não tem cenas guardadas fora da mesa.'); return; }
    localScenesBox(lista, false);
  }
  function localScenesBox(lista, primeira) {
    const marcadas = new Set(lista.filter(c => !c.exemplo).map(c => c.id));
    const linhas = lista.map(c => h('label', { class: 'pick' },
      h('input', { type: 'checkbox', id: 'lc-' + c.id, checked: marcadas.has(c.id), onchange: e => { if (e.target.checked) marcadas.add(c.id); else marcadas.delete(c.id); } }),
      h('span', { class: 'pick-n', text: c.nome }),
      h('span', { class: 'pick-s', text: (c.tokens === 1 ? '1 token' : c.tokens + ' tokens') + (c.fundo ? ' · com mapa' : '') + (c.exemplo ? ' · exemplo' : '') })));
    const andamento = h('p', { class: 'note', id: 'lc-status', role: 'status' });
    modal({
      title: primeira ? 'Trazer as suas cenas para esta mesa?' : 'Trazer cenas deste navegador', wide: true,
      text: (primeira ? 'Esta mesa ainda não tem cenas, e este navegador guarda as que você fez antes. ' : '') + 'Na mesa, as cenas e as imagens ficam salvas no banco: abrem em qualquer aparelho e os jogadores podem vê-las ao vivo. As cenas do navegador continuam onde estão.',
      body: [h('div', { class: 'picks' }, linhas), note('Os tokens de um jogador com o mesmo nome de um participante desta mesa continuam com ele; os outros passam a ser do mestre.'), andamento],
      actions: [
        { label: primeira ? 'Agora não' : 'Cancelar' },
        {
          label: 'Trazer as marcadas', kind: 'primary', keep: true, run: async () => {
            const ids = lista.map(c => c.id).filter(id => marcadas.has(id));
            if (!ids.length) { andamento.textContent = 'Marque pelo menos uma cena.'; return; }
            for (const b of modalEl.querySelectorAll('button, input')) b.disabled = true;
            andamento.textContent = 'Enviando as imagens e as cenas…';
            const vazia = primeira && Store.S.order.length === 1 ? Store.scene() : null;     // a "Nova cena" criada só para a mesa não abrir vazia
            let feitas = [];
            try { feitas = await Nuvem.trazer(ids, (n, total) => { andamento.textContent = `Enviando… ${n} de ${total}`; }); }
            catch (err) { closeModal(); toast('Não deu para trazer tudo: ' + ((err && err.message) || 'falha no envio') + ' O que já tinha subido ficou na mesa.', { long: true }); if (Store.S.order.length) refresh(); return; }
            closeModal();
            if (!feitas.length) { toast('Nenhuma cena foi trazida.'); return; }
            if (vazia && Store.S.scenes[vazia.id] && !vazia.tokens.length && !vazia.walls.length && !vazia.shapes.length && !vazia.bg.asset) { Store.removeScene(vazia.id); Persist.removeScene(vazia.id); }
            switchScene(feitas[0]);
            toast(feitas.length === 1 ? 'Cena trazida para a mesa. Os jogadores só a veem quando você a puser no ar.' : `${feitas.length} cenas trazidas para a mesa. Os jogadores só veem a que você puser no ar.`, { long: true });
          },
        },
      ],
    });
  }

        : Vision.out.noSource ? 'Você não tem um token com visão nesta cena; por isso a névoa cobre tudo.' : '';
      el.banner.hidden = !aviso;
      if (aviso) el.banner.replaceChildren(h('span', { class: 'dot', style: { background: viewerColor() } }), h('span', { class: 'banner-t', id: 'bannerText', text: aviso }));

    }
    const p = playerById(App.viewer);
    el.banner.hidden = false;
    el.banner.replaceChildren(

      case 'turn': body = tabTurn(); break;
      case 'fx': body = tabFx(); break;
      case 'scene': body = tabScene(); break;

  /* Token ligado à ficha de um personagem da mesa (só dentro do site, com mesa aberta; ver 07b-fichas.js). */
  function fichaBox(t) {
    const lista = Fichas.chars(), ligado = t.char ? Fichas.get(t.char) : null;
    // (a ficha ligada pode não chegar a quem olha: o mestre auxiliar sem a aba Fichas não recebe as escondidas)
    const escondida = Fichas.escondida(t);
    const out = [field('Personagem', inSelect('tk-char', t.char || '', [['', 'Sem ficha']].concat(lista.map(c => [c.id, c.nome || 'Sem nome'])).concat(t.char && !ligado ? [[t.char, escondida ? '(ficha escondida)' : '(ficha que saiu da mesa)']] : []),
      v => {
        const r = Fichas.link(t, v || null), c = v ? Fichas.get(v) : null;
        toast(c ? `O token agora segue a ficha de ${c.nome || 'sem nome'}: o nome e as barras vieram dela.` + (r.dono ? ` O dono do token passou a ser ${r.dono}, que é o dono da ficha.` : '') : `${t.name} não segue mais nenhuma ficha.`, { action: 'Desfazer', run: Tools.undo });
      }))];
    if (!t.char) { out.push(note(lista.length ? 'Ligado a uma ficha, o token passa a ter o nome do personagem, as barras dela (HP, SP…) no lugar das que tinha, e a iniciativa.' : 'Esta mesa ainda não tem fichas. Crie na aba Fichas.')); return out; }
    if (!ligado) {
      out.push(note(escondida ? 'Este token segue uma ficha que o mestre esconde dos jogadores, e ela só chega a quem mestra a aba Fichas. Deixe-o ligado: o dano e a cura que você der nas barras dele vão para a ficha mesmo assim.'
        : 'A ficha ligada não está mais na mesa. Escolha outra ou "Sem ficha".'));
      return out;
    }
    const itens = Fichas.rolaveis(t);
    if (!itens.some(x => x[0] === App.opt.fichaAtr)) App.opt.fichaAtr = itens[0][0];
    const fixa0 = Luta.fixaAtual(t), doTurno = Combate.fixaDoTurno(t);
    // um token ligado antes (ou que ganhou uma barra à mão) pode ter barras que não são da ficha: um clique acerta
    if (Fichas.foraDaFicha(t)) out.push(
      note('Este token tem barras que não vêm da ficha (ou falta alguma dela).'),
      h('div', { class: 'row' }, btn('Usar só as barras da ficha', () => { if (Fichas.usarBarras(t)) toast('O token ficou só com as barras da ficha.', { action: 'Desfazer', run: Tools.undo }); }, { id: 'tk-so-ficha' })));
    out.push(
      note('As barras ligadas à ficha (HP, SP…) e a iniciativa vêm dela. Dano e cura dados aqui no mapa voltam para a ficha. Dois cliques no token abrem a ficha.'),
      field('Rolar atributo', inSelect('tk-atr', App.opt.fichaAtr, itens.map(x => [x[0], `${x[1]} · ${x[2]}`]), v => { App.opt.fichaAtr = v; })),
      field('Fixando', inNum('tk-fixa', fixa0, v => { Luta.guardarFixa(t, v); }, { min: 0, step: 1, label: 'Quanto fixar', title: 'Regra da fixa: rola um dado de (atributo − fixa) lados e soma a fixa' })),
      doTurno ? note(`É o ${doTurno.k}º turno dele nesta rodada: a fixa anotada para esse turno é ${doTurno.v}.`) : null,
      h('div', { class: 'row' }, btn('Rolar', () => {
        const r = Fichas.rolar(t, App.opt.fichaAtr, Luta.fixaAtual(t));
        toast(r.ok ? `${t.name} · ${r.nome}: ${r.total}` + (r.die ? ` (${r.dieValue} no d${r.die}${r.fixa ? ' + ' + r.fixa : ''})` : ' (fixa total)') : r.error);
      }, { icon: 'die', id: 'tk-rolar' })));
    out.push(...bagResumo(t));
    return out;
  }

  /* A bolsa do personagem deste token: as poções, bombas, runas, munições e materiais da ficha dele.
     A poção que faz alguma coisa mostra antes o que vai acontecer ("Usar agora"); os outros itens só gastam uma
     unidade. Tudo avisa a mesa ao vivo e dá para desfazer. */
  function bagBox(t) {
    const tid = t.id, R = window.TC.rules;
    let pede = null;
    const body = h('div', { class: 'bag' });
    const doUse = (tk, it) => {
      pede = null;
      const r = Fichas.usar(tk, it.id);
      if (!r.ok) { toast(r.error); paint(); return; }
      toast(r.texto + '.', { action: 'Desfazer', run: () => { if (r.desfazer()) toast(`Desfeito: ${it.nome || 'o item'} voltou para a bolsa.`); if (modalEl && modalLive) modalLive(); } });
      paint();
    };
    const use = (tk, it) => {
      if (!Fichas.previaUso(tk, it.id).length) { doUse(tk, it); return; }      // nada é aplicado sozinho: um clique gasta e avisa
      pede = it.id; paint();
      const n = document.getElementById('bag-ok-' + it.id); if (n) n.focus();
    };
    function paint() {
      const tk = Store.get('tokens', tid), itens = tk ? Fichas.bolsa(tk) : null;
      const a = document.activeElement, fid = a && a.id && body.contains(a) ? a.id : null;
      body.replaceChildren();
      if (!itens) { addKids(body, [note('Este token não dá mais acesso a uma bolsa.')]); return; }
      if (!itens.length) { addKids(body, [note('A bolsa está vazia. Os itens são cadastrados na ficha do personagem, em Bolsas.')]); return; }
      addKids(body, R.BOLSAS.map(b => {
        const lista = itens.filter(x => x.t === b.t);
        if (!lista.length) return null;
        return h('div', { class: 'bag-g' }, h('div', { class: 'bag-h', text: b.nome }), lista.map(it => {
          const previa = pede === it.id && it.qtd > 0 ? Fichas.previaUso(tk, it.id) : null, resta = it.qtd - 1;
          return h('div', { class: 'bag-r' + (it.qtd ? '' : ' sem') },
            h('div', { class: 'bag-l' },
              h('span', { class: 'bag-n', text: it.nome || b.um }), h('span', { class: 'bag-q', title: 'Quantas há na bolsa', text: '×' + it.qtd }),
              btn('Usar', () => use(tk, it), { kind: 'small', id: 'bag-u-' + it.id, disabled: it.qtd < 1, title: it.qtd < 1 ? 'Não há nenhuma na bolsa' : it.t === 'pocao' ? 'Gasta uma e aplica o efeito (mostra antes o que vai acontecer)' : 'Gasta uma e avisa a mesa. Nada é aplicado sozinho.' })),
            it.nota ? h('div', { class: 'bag-d', text: it.nota }) : null,
            previa ? h('div', { class: 'bag-c' },
              h('span', { class: 'bag-ct' }, h('strong', { text: `Usar ${it.nome || 'a poção'}? ` }), previa.join(' · ') + ' · ' + (resta === 0 ? 'é a última' : resta === 1 ? 'sobra 1' : 'sobram ' + resta)),
              btn('Usar agora', () => doUse(tk, it), { kind: 'primary small', id: 'bag-ok-' + it.id }),
              btn('Cancelar', () => { pede = null; paint(); const n = document.getElementById('bag-u-' + it.id); if (n) n.focus(); }, { kind: 'small', id: 'bag-no' })) : null);
        }));
      }));
      if (fid) { const n = document.getElementById(fid); if (n && !n.disabled) n.focus({ preventScroll: true }); }
    }
    paint();
    modal({ title: 'Bolsa de ' + tokName(t), body, wide: true, focusPrimary: true, actions: [{ label: 'Fechar', kind: 'primary' }] });
    modalLive = paint;
  }
  // No painel do token: o que há na bolsa, em uma linha, e o botão que a abre.

  /* ---- Aba Turnos ---- */
  /* A iniciativa que alguém rolou pela telinha de dados da mesa ao vivo (App.iniRolls, por ficha) fica oferecida ao
     mestre por 15 minutos: num aviso, na hora, e num botão ao lado da entrada do token na ordem de turnos. Nada é
     anotado sozinho. Vale para a entrada que receberia o valor: a primeira sem iniciativa (ou a primeira). */
  const INI_OFFER_MS = 15 * 60 * 1000;
  function iniPending(t) {
    const r = t && t.char ? App.iniRolls.get(t.char) : null;
    if (!r) return null;
    if (Date.now() - r.at > INI_OFFER_MS) { App.iniRolls.delete(t.char); return null; }
    return r;
  }
  function iniOffer(t, e) {
    const r = iniPending(t);
    if (!r) return null;
    const es = Store.scene().turn.list.filter(x => x.token === t.id).sort((p, q) => (p.k || 1) - (q.k || 1));
    const alvo = es.find(x => x.init == null) || es[0];
    return alvo && alvo.id === e.id && e.init !== r.v ? r : null;
  }
  function noteIni(t) {
    const r = iniPending(t);
    if (!r) return;
    App.iniRolls.delete(t.char);
    Act.turnNote(t, r.v, r.d, r.b);
    toast(`Iniciativa de ${t.name} anotada: ${r.v}.`, { action: 'Desfazer', run: Tools.undo });
  }
  /* Chegou da mesa ao vivo uma iniciativa rolada pela telinha de dados. Só o mestre trata, e só quando a cena aberta
     tem um token ligado àquela ficha. Quem rolou tem de ser o dono da ficha, ou o próprio mestre. */
  function iniFromTable(l) {
    const s = l && l.dados && l.dados.sis;
    if (!isGM() || !Fichas.on() || !s || s.t !== 'ini' || !l.nova || typeof s.c !== 'string') return;
    const v = Math.round(Number(s.v)), d = Math.round(Number(s.d)), b = Math.round(Number(s.b));
    if (!isFinite(v) || Math.abs(v) > 999 || !(d >= 1 && d <= 20) || !isFinite(b) || d + b !== v) return;
    const ficha = Fichas.get(s.c), eu = window.TC && window.TC.ponte ? window.TC.ponte.estado.eu : null;
    if (!ficha || !(l.autor_id === eu || (ficha.dono_id && ficha.dono_id === l.autor_id))) return;
    const sc = Store.scene(), t = sc.tokens.find(x => x.char === s.c);
    if (!t) return;
    App.iniRolls.set(s.c, { v, d, b, nome: String(l.autor_nome || '').slice(0, 40) || 'Alguém', at: Date.now() });
    const naOrdem = sc.turn.list.some(e => e.token === t.id);
    if (window.innerWidth > 0) toast(`${ficha.nome || t.name} rolou iniciativa: ${v}.`, { action: naOrdem ? 'Anotar na ordem' : 'Pôr na ordem', run: () => noteIni(t), long: true });
    refresh();
  }
  // Aviso do que saiu numa rolagem de iniciativa: uma só, por extenso; várias, um resumo curto (as 4 maiores e "+N").
  function rollToast(res) {
    if (!res.length) return;
    const undo = { action: 'Desfazer', run: Tools.undo };
    if (res.length === 1) { const r = res[0]; toast(`${r.name}: iniciativa ${r.total} (${rollText(r.d, r.bonus)})`, undo); return; }
    const top = res.slice().sort((p, q) => q.total - p.total || q.bonus - p.bonus);
    toast('Iniciativa: ' + top.slice(0, 4).map(r => `${r.name} ${r.total}`).join(' · ') + (top.length > 4 ? ` +${top.length - 4}` : ''), undo);
  }

  // Mudar o tamanho do quadrado reescala tudo o que está na cena.
  function resizeCell(n) {
    const sc = Store.scene(), k = n / sc.cell;
    if (!isFinite(k) || k === 1) return;
    Store.tx('Tamanho do quadrado', () => {
      for (const t of sc.tokens) Store.upd('tokens', t.id, { x: t.x * k, y: t.y * k });
      for (const s of sc.shapes) Store.upd('shapes', s.id, s.pts ? { pts: s.pts.map(v => v * k), sw: s.sw * k } : s.k === 'text' ? { x: s.x * k, y: s.y * k, fs: s.fs * k } : { x: s.x * k, y: s.y * k, w: s.w * k, h: s.h * k, sw: s.sw * k });
      for (const w of sc.walls) Store.upd('walls', w.id, { x1: w.x1 * k, y1: w.y1 * k, x2: w.x2 * k, y2: w.y2 * k });
      for (const l of sc.lights) Store.upd('lights', l.id, { x: l.x * k, y: l.y * k });
      for (const e of sc.effects) Store.upd('effects', e.id, { x: e.x * k, y: e.y * k });
      for (const op of sc.fogOps) { if (op.k === 'rect') Store.upd('fogOps', op.id, { x: op.x * k, y: op.y * k, w: op.w * k, h: op.h * k }); else if (op.pts) Store.upd('fogOps', op.id, { pts: op.pts.map(v => v * k), s: op.s * k }); }
      Store.scn({ cell: n, bg: Object.assign({}, sc.bg, { dx: sc.bg.dx * k, dy: sc.bg.dy * k }) });
    });
    setTimeout(Render.fit, 30);
  }

      items.push({ label: s.top ? 'Pôr abaixo dos tokens' : 'Pôr acima dos tokens', icon: s.top ? 'back' : 'front', run: () => Store.tx('Camada do desenho', () => shapes.forEach(x => Store.upd('shapes', x.id, { top: !s.top }))) });

    } else if (hit && hit.c === 'effects') {

      if (gm) items.push({ label: 'Aplicar a quem está dentro…', icon: 'area', run: () => fxApply(e) });
      if (gm) items.push({ label: e.gm ? 'Mostrar aos jogadores' : 'Deixar só para o mestre', icon: e.gm ? 'eye' : 'eyeOff', run: () => Store.tx('Visibilidade do efeito', () => Store.upd('effects', e.id, { gm: !e.gm })) });
      items.push({ label: 'Duplicar', icon: 'copy', key: 'Ctrl+D', run: Act.duplicateSel }, '-', { label: 'Apagar', icon: 'trash', key: 'Del', danger: true, run: deleteSelToast });
    } else if (hit && hit.c === 'lights') {

        { label: 'Ver no painel', icon: 'sliders', run: () => openTab('sel') }, '-', { label: 'Remover', icon: 'trash', key: 'Del', danger: true, run: deleteSelToast });
    } else if (gm && App.tool === 'terrain' && Tools.hitTerrain(p)) {

        { label: 'Trazer para frente', icon: 'front', run: () => Act.toFront('shapes', [s.id], true) }, { label: 'Enviar para trás', icon: 'back', run: () => Act.toFront('shapes', [s.id], false) },
        '-', { label: 'Apagar a área', icon: 'trash', key: 'Del', danger: true, run: deleteSelToast });
    } else {

  }
  function editText(s) {
    promptBox('Editar texto', 'Texto', s.txt, { multiline: true, ok: 'Salvar' }).then(v => { if (v && v.trim()) Store.tx('Editar texto', () => Store.upd('shapes', s.id, { txt: v.trim() })); });
  }

  /* ================= HUD do token =================
     Faixa fixa na base do mapa com as barras do token selecionado: fica sempre
     no mesmo lugar e não cobre os vizinhos do token. */
  function renderHud() {
    const toks = selOf('tokens');
    const hide = () => { el.hud.hidden = true; el.hud.replaceChildren(); };
    if (toks.length !== 1 || App.sel.length !== 1 || App.tool !== 'select') { hide(); return; }
    const t = toks[0], gm = isGM();
    const edit = gm || can('bars', t), canCond = gm || can('conds', t);
    const kids = [];
    for (const { b, i, mode } of barsShown(t)) {
      const dots = b.k === 'pts' && Math.round(b.m) >= 1 && Math.round(b.m) <= PIP_MAX;
      if (edit && dots) {
        kids.push(h('span', { class: 'hud-b', style: { '--c': b.c } }, h('span', { class: 'hud-n', text: b.n }), pips(t, b, i, true, 'hud-b'), h('span', { class: 'hud-m' + (b.v < 0 ? ' neg' : ''), text: `${fmtV(b.v)}/${fmt(b.m)}` })));
      } else if (edit) {
        kids.push(h('label', { class: 'hud-b', style: { '--c': b.c }, title: `${b.n}: digite um valor, ou +5 e -8 para somar e subtrair` },
          h('span', { class: 'hud-n', text: b.n }),
          h('input', { id: 'hud-b' + i, class: 'hud-in' + (b.v < 0 ? ' neg' : ''), type: 'text', inputmode: 'decimal', value: b.v, autocomplete: 'off', 'aria-label': b.n,
            onfocus: e => e.target.select(),
            onkeydown: e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } else if (e.key === 'Escape') { e.target.value = b.v; e.target.blur(); } },
            onchange: e => { if (!Act.barSet(t, i, e.target.value)) e.target.value = b.v; } }),
          h('span', { class: 'hud-m', text: '/' + fmt(b.m) })));
      } else if (mode === 'num') {
        kids.push(h('span', { class: 'hud-b', style: { '--c': b.c } }, h('span', { class: 'hud-n', text: b.n }), dots ? pips(t, b, i, false) : null, h('span', { class: 'hud-v' + (b.v < 0 ? ' neg' : ''), text: `${fmtV(b.v)}/${fmt(b.m)}` })));
      }
    }
    // Condições ativas: as que têm contador ganham + e − aqui mesmo; as outras abrem a janela de condições.
    const info = t.cinfo || {};
    const conds = t.conds.map(id => COND_BY_ID[id]).filter(Boolean).sort((p, q) => ((info[q.id] && info[q.id].n) ? 1 : 0) - ((info[p.id] && info[p.id].n) ? 1 : 0));
    for (const c of conds.slice(0, 6)) {
      const ci = info[c.id] || {}, n = ci.n || 0, dur = ci.d ? ` · ${ci.d} ${ci.d === 1 ? 'rodada' : 'rodadas'}` : '';
      const badge = h('span', { class: 'chip-i', style: { background: c.c } }, icon(c.i, 12));
      if (canCond && n) {
        kids.push(h('span', { class: 'hud-c', title: c.n + dur },
          h('button', { type: 'button', class: 'stp-b', id: `hud-c-${c.id}-minus`, title: n === 1 ? `${c.n}: tirar 1 (em zero, a condição sai)` : `${c.n}: tirar 1`, 'aria-label': `Tirar 1 de ${c.n}`, onclick: () => condStepToast(t, c, -1) }, icon('minus', 13)),
          badge, h('span', { class: 'stp-v', id: `hud-c-${c.id}-n`, text: String(n) }),
          h('button', { type: 'button', class: 'stp-b', id: `hud-c-${c.id}-plus`, title: `${c.n}: somar 1`, 'aria-label': `Somar 1 em ${c.n}`, onclick: () => condStepToast(t, c, 1) }, icon('plus', 13))));
      } else if (canCond) {
        kids.push(h('button', { type: 'button', class: 'hud-c one', id: `hud-c-${c.id}`, title: `${c.n}${dur}: abrir condições`, 'aria-label': `${c.n}${dur}`, onclick: () => condPicker([t]) }, badge));
      } else {
        kids.push(h('span', { class: 'hud-c ro', title: c.n + dur }, badge, n ? h('span', { class: 'stp-v', text: String(n) }) : null));
      }
    }
    if (conds.length > 6) kids.push(h('span', { class: 'hud-m', text: '+' + (conds.length - 6) }));
    if (canCond) kids.push(iconBtn('shield', 'Condições', () => condPicker([t]), { size: 16, cls: 'hud-i', id: 'hud-cond' }));
    if (Fichas.podeBolsa(t) && (Fichas.bolsa(t) || []).some(x => x.qtd > 0)) kids.push(iconBtn('bag', 'Bolsa: poções e itens do personagem', () => bagBox(t), { size: 16, cls: 'hud-i', id: 'hud-bolsa' }));
    if (Luta.podeAtributos(t)) kids.push(iconBtn('die', 'Rolar atributo (F)', () => Luta.alternar(t), { size: 16, cls: 'hud-i', id: 'hud-rolar' }));
    if (can('target')) { const on = isTargeted([t]); kids.push(iconBtn('center', on ? 'Tirar a mira (A)' : 'Mirar: marca este token como alvo (A)', () => Act.targetToggle([t]), { size: 16, cls: 'hud-i', on, id: 'hud-mira' })); }
    if (gm) kids.push(iconBtn(t.hidden ? 'eyeOff' : 'eye', t.hidden ? 'Oculto dos jogadores (clique para mostrar)' : 'Visível aos jogadores (clique para ocultar)', () => Store.tx(t.hidden ? 'Mostrar token' : 'Ocultar token', () => Store.upd('tokens', t.id, { hidden: !t.hidden })), { size: 16, cls: 'hud-i', on: t.hidden, id: 'hud-hide' }));
    if (!kids.length) { hide(); return; }
    const a = document.activeElement, fid = a && a.id && el.hud.contains(a) ? a.id : null;
    el.hud.replaceChildren(h('span', { class: 'hud-who' }, tokenAvatar(t, 24), h('span', { class: 'hud-name', text: tokName(t) })), ...kids);
    el.hud.hidden = false;
    if (fid) { const n = document.getElementById(fid); if (n && !n.disabled) n.focus({ preventScroll: true }); }
  }

  /* ================= Faixa "vez de…" =================
     Aparece por alguns segundos quando a vez muda e lembra as condições de quem vai jogar.
     É só um lembrete: não altera nada. */
  function hideTurn() { clearTimeout(turnTimer); el.turnb.hidden = true; el.turnb.replaceChildren(); }
  function turnBanner() {
    const sc = Store.scene(), tn = sc.turn;
    const key = sc.id + '|' + (tn.on && tn.cur ? tn.cur + ':' + tn.round : '');
    const prev = turnKey;
    turnKey = key;
    if (prev === key) return;
    if (prev === null || prev.split('|')[0] !== sc.id || !tn.on || !tn.cur) { hideTurn(); return; }
    if (!isGM() && !can('turns')) { hideTurn(); return; }
    const e = tn.list.find(x => x.id === tn.cur);
    const t = e && e.token ? Store.get('tokens', e.token) : null;
    if (!e || (t && !tokShown(t, sc))) { hideTurn(); return; }     // o jogador não fica sabendo de quem ele não vê
    const info = t ? t.cinfo || {} : {};
    const conds = t ? t.conds.map(id => COND_BY_ID[id]).filter(Boolean) : [];
    el.turnb.replaceChildren();
    addKids(el.turnb, [
      t ? tokenAvatar(t, 26) : null,
      h('span', { class: 'turnb-t' }, 'Vez de ', h('strong', { text: turnLabel(e, t ? tokName(t) : e.name) })),
      conds.map(c => {
        const ci = info[c.id] || {};
        return h('span', { class: 'turnb-c' }, h('span', { class: 'chip-i', style: { background: c.c } }, icon(c.i, 12)),
          h('span', { text: c.n + (ci.n ? ' ' + ci.n : '') + (ci.d ? ` · ${ci.d} ${ci.d === 1 ? 'rodada' : 'rodadas'}` : '') }));
      }),
      h('button', { type: 'button', class: 'ib turnb-x', title: 'Fechar', 'aria-label': 'Fechar o aviso de vez', onclick: hideTurn }, icon('x', 14)),
    ]);
    el.turnb.hidden = false;
    clearTimeout(turnTimer);
    turnTimer = setTimeout(hideTurn, conds.length ? 7000 : 4000);
  }

  /* ================= Véu do mestre =================
     A opção fica guardada como preferência de quem está olhando (não entra no desfazer da cena).
     Enquanto o véu está ligado, uma legenda pequena no canto do mapa diz de quem é a visão mostrada. */
  function setVeil(on) {
    App.showVision = !!on; Store.S.prefs.showVision = App.showVision;
    Persist.meta(); Vision.invalidate(); Render.request(); refresh();
  }
  function renderVeil() {
    const v = veilState(Store.scene());
    el.veil.hidden = !v;
    if (!v) { el.veil.replaceChildren(); return; }
    const text = v.tok ? 'Véu: visão de ' + tokName(v.tok) : 'Véu: visão dos jogadores';
    const a = document.activeElement, had = a && a.id === 'veilOff';
    el.veil.replaceChildren(icon('eye', 15), h('span', { class: 'veilchip-t', id: 'veilText', text }),
      h('button', { type: 'button', class: 'ib veilchip-x', id: 'veilOff', title: 'Desligar o véu', 'aria-label': 'Desligar o véu', onclick: () => { setVeil(false); toast('Véu desligado.', { action: 'Desfazer', run: () => setVeil(true) }); } }, icon('x', 14)));
    el.veil.title = v.tok ? 'O que está escurecido, ' + tokName(v.tok) + ' não enxerga agora' : 'O que está escurecido, nenhum jogador enxerga agora';
    if (had) document.getElementById('veilOff').focus({ preventScroll: true });
  }

  /* ================= Rodapé do mapa ================= */
  function status() {
    const sc = Store.scene();
    if (!sc) return;
    const m = App.mouse;
    let txt = '';
    if (m.inside && m.x >= 0 && m.y >= 0 && m.x < sceneW(sc) && m.y < sceneH(sc)) txt = `Coluna ${Math.floor(m.x / sc.cell) + 1} · Linha ${Math.floor(m.y / sc.cell) + 1}`;
    // Terreno sob o cursor: o rodapé diz o que é, e o mapa também (a dica que aparece ao parar o mouse)
    let chao = '';
    if (txt && sc.shapes.length) { const ter = Combate.terrainAt(sc, m.x, m.y); if (ter && !Vision.covered(m.x, m.y)) chao = Combate.terText(ter, sc); }
    if (chao) txt += '  ·  ' + chao;
    if (Render.cv.title !== chao) Render.cv.title = chao;
    const sv = Nuvem.jogador() ? (saveState === 'saving' ? 'Enviando…' : saveState === 'espera' ? 'Esperando o mestre: o que você fez entra quando ele estiver na mesa' : 'Ao vivo com a mesa')
      : saveState === 'mem' ? 'Sem salvamento neste navegador' : saveState === 'erro' ? 'Não foi possível salvar' : saveState === 'saving' ? 'Salvando…' : Nuvem.mestre() ? 'Salvo na mesa' : 'Salvo neste navegador';
    const full = (txt ? txt + '  ·  ' : '') + sv;
    if (full !== statusText) { statusText = full; el.status.textContent = full; el.status.classList.toggle('warn', saveState === 'mem' || saveState === 'erro' || saveState === 'espera'); }
    if (zoomLabel) { const zt = Math.round(App.view.z * 100) + '%'; if (zoomLabel.textContent !== zt) zoomLabel.textContent = zt; }
  }

  /* ================= Atualização geral ================= */
  function renderAll() {
    const sc = Store.scene();
    if (!sc) return;
    pruneSel();
    try { if (Vision.isDirty()) Vision.update(sc, App.viewer); }   // a faixa do jogador depende do que ele enxerga
    catch (err) { /* a visão fica pendente; quem avisa do problema é o desenho do mapa */ }
    renderTop(); renderBanner(); renderRail(); renderOpts(); renderSide(); renderHud(); renderVeil(); turnBanner(); status();
    if (modalEl && modalLive) modalLive();

    document.title = 'Cenas · Tiny Cats';
  }
  function refresh() {
    if (timer) return;
    timer = setTimeout(() => {
      timer = 0;
      if (pressing) { pending = true; return; }
      renderAll();
    }, 0);
  }

  return {
    refresh, renderAll, toast, modal, closeMenus, contextMenu, openTab, editText, status,
    prompt: promptBox, confirm: confirmBox, importImages, initCaps, setViewer, switchScene, offerLocal,
    modalOpen: () => !!modalEl || Tour.active(),
    closeModal, condPicker, barDefaultsBox, areaBox, bagBox, iniFromTable,
    frame() { if (zoomLabel) { const zt = Math.round(App.view.z * 100) + '%'; if (zoomLabel.textContent !== zt) zoomLabel.textContent = zt; } },
    setSave(s) { saveState = s; status(); },
    hint: setHint,                                        // a linha de dica muda sem redesenhar o resto (cursor sobre um item travado)

    kit: { field, inText, inNum, inSelect, toggle, seg, btn, iconBtn, sec, note, tokenAvatar, stepper, deleteSelToast, layer: el.layer, live(fn) { modalLive = fn; }, card: () => modalEl },
  };
})();
/* ---------------------------------------------------------------
   10b. TOUR — tutorial de primeiro uso
   Um destaque por vez, com um texto curto. O mestre só lê e avança:
   nada precisa ser feito durante o passeio e a cena não muda. Abre
   sozinho na primeira vez que o mestre entra e fica no menu ⋯ para rever.
   --------------------------------------------------------------- */
const Tour = (() => {
  let root = null, hole = null, card = null, steps = [], at = 0, saved = null, tick = 0;
  const SEEN_KEY = 'tinycats-tour', SEEN_KEY_OLD = 'urgm-tour';       // marca de "já viu o tutorial" neste navegador

  const rectOf = sel => {
    const n = document.querySelector(sel);
    if (!n || n.hidden) return null;
    const r = n.getBoundingClientRect();
    return r.width > 4 && r.height > 4 ? r : null;
  };
  // O token na tela, com folga para as barras em cima e o nome embaixo.
  function tokenRect(id) {
    const t = Store.get('tokens', id), sc = Store.scene();
    if (!t) return null;
    const r = Render.cv.getBoundingClientRect(), z = App.view.z, s = t.size * sc.cell * z;
    const [sx, sy] = Render.toScreen(t.x, t.y);
    return { left: r.left + sx - s * 0.25, top: r.top + sy - s * 0.55, width: s * 1.5, height: s * 2.05 };
  }
  function pickToken() {
    const sc = Store.scene(), sel = selOf('tokens');
    return (sel.length === 1 && App.sel.length === 1 ? sel[0] : null) || sc.tokens.find(t => t.owner && !t.hidden) || sc.tokens.find(t => !t.hidden) || sc.tokens[0] || null;
  }

  function build() {
    const tok = pickToken(), id0 = tok ? tok.id : null, sc = Store.scene();
    // No passo das condições, de preferência um token que já tenha alguma ativa (melhor ainda com contador).
    const withCond = sc.tokens.find(t => !t.hidden && t.conds.some(c => t.cinfo && t.cinfo[c] && (t.cinfo[c].n || t.cinfo[c].d))) || sc.tokens.find(t => !t.hidden && t.conds.length);
    const idC = withCond ? withCond.id : id0;
    const selectTok = id => {
      Tools.set('select');
      if (id && Store.get('tokens', id)) {
        setSel([{ c: 'tokens', id }]);
        // traz o token para a tela se a câmera estiver longe dele
        const r = tokenRect(id), cv = Render.cv.getBoundingClientRect();
        if (r && (r.left < cv.left || r.top < cv.top || r.left + r.width > cv.right || r.top + r.height > cv.bottom - 90)) { const [cx, cy] = tokC(Store.get('tokens', id), Store.scene()); Render.centerOn(cx, cy); }
      }
    };
    const select = () => selectTok(id0), id = id0;
    const openSec = sid => { const d = document.getElementById(sid); if (d) { d.open = true; d.scrollIntoView({ block: 'nearest' }); } };
    return [
      {
        title: 'Bem-vindo à mesa de cenas',
        text: 'Em um minuto, o essencial para conduzir uma cena: mover, barras, condições, turnos e ver como jogador. Você só lê e avança; nada muda na cena.',
        next: 'Começar',
      },
      {
        title: 'Mover os tokens',
        text: 'Arraste um token para movê-lo; ele encaixa na grade. Para andar pelo mapa, segure espaço e arraste. A roda do mouse aproxima e afasta.',
        enter: select, target: () => (id ? tokenRect(id) : null) || rectOf('#stage'),
      },
      {
        title: 'Barras',
        text: 'Com um token selecionado, as barras dele aparecem nesta faixa. Digite o valor novo, ou -8 e +5 para tirar e devolver. Para criar outras barras, use "Adicionar barra" no painel.',
        enter: select, target: () => rectOf('#hud'), side: 'above',
      },
      {
        title: 'Condições',
        text: 'Aqui você marca o que está afetando o token. Cada condição ativa pode ter um contador, que só muda nos botões + e −, e uma duração em rodadas, que desconta sozinha.',
        enter: () => { selectTok(idC); UI.openTab('sel'); }, after: () => openSec('s-cond'), target: () => rectOf('#s-cond') || rectOf('#side'), side: 'left',
      },
      {
        title: 'Turnos',
        text: 'A ordem do combate fica nesta aba. "Próximo turno" passa a vez, avisa de quem é a vez e desconta as durações.',
        enter: () => { UI.openTab('turn'); }, target: () => rectOf('#side'), side: 'left',
      },
      {
        title: 'Ver como jogador',
        text: 'Troque para um jogador e confira o que ele enxerga e pode fazer. Para voltar, escolha Mestre. Este passeio fica guardado no menu ⋯, em "Rever o tutorial".',
        target: () => rectOf('.viewer'), side: 'below', next: 'Concluir',
      },
    ];
  }

  function layout() {
    if (!root) return;
    const st = steps[at], W = window.innerWidth, H = window.innerHeight, gap = 14, m = 12;
    const r0 = st.target ? st.target() : null;
    const cw = card.offsetWidth, chh = card.offsetHeight;
    if (!r0) {
      hole.className = 'tour-hole none';
      hole.style.cssText = '';
      card.style.left = Math.max(m, (W - cw) / 2) + 'px';
      card.style.top = Math.max(m, (H - chh) / 2) + 'px';
      return;
    }

  /* ================= Puxar o grupo =================

            h('span', { class: 'av', 'aria-hidden': 'true', style: Object.assign({ width: '26px', height: '26px', fontSize: '10px', backgroundColor: 'var(--hover)', color: 'var(--fg-2)', borderColor: x.dono ? x.dono.color : 'var(--line-strong)' }, img ? { backgroundImage: `url("${img}")` } : {}) }, img ? null : initials(x.nome)),

      title: 'Puxar o grupo', wide: true, focusPrimary: true,

      body: h('div', { class: 'area' },
        field('De onde', sel, 'stack'),
        h('div', { class: 'area-bar' }, conta, h('span', { class: 'spacer' }), btn('Todos', () => { marcarTodos(true); paint(); }, { kind: 'small' }), btn('Nenhum', () => { marcarTodos(false); paint(); }, { kind: 'small' })),
        ul,

  /* ================= Ataque com defesa =================
     O mestre diz o dano, a barra e quais defesas descontam (uma ou mais: elas se somam; nenhuma: o dano entra
     inteiro). Para cada alvo com ficha a janela mostra a defesa e o que vai sobrar na barra. Quem defende pode
     rolar a defesa com a regra da fixa: os jogadores recebem o pedido na mesa ao vivo e rolam de lá; o mestre vê
     quem já rolou, pode rolar por quem demorar (ou valer a defesa inteira) e só então aplica. O mínimo e o máximo
     valem depois do desconto. Token sem ficha: o mestre diz quanto de dano ele tomou. */
  let atq = null, atqRelogio = 0;
  const podeAtaque = () => isGM() && Fichas.on() && Combate.listaDefesas().length > 0;
  function encerrarPedido(fim) {
    const p = atq && atq.pedido;
    if (!p || p.fim) return;
    p.fim = fim;
    try { const P = ponte(); if (P && P.registro && P.registro.encerrar) P.registro.encerrar(p.id, fim); } catch (e) { console.error(e); }
  }
  function fecharAtaque(fim) {
    if (!atq) return;
    encerrarPedido(fim || 'cancelado');
    atq = null;
    clearInterval(atqRelogio); atqRelogio = 0;
  }
  function ataque(toks, pre) {
    if (!podeAtaque()) { toast('O ataque com defesa funciona dentro do site, com uma mesa aberta (ele usa as defesas das fichas).'); return; }
    const alvos = (toks || []).filter(Boolean);
    if (!alvos.length) { toast('Selecione no mapa quem recebe o ataque.'); return; }
    fecharPop(); fecharAtaque('cancelado');
    const o = pre || {}, P = ponte();
    const names = [];
    for (const t of alvos) for (const b of t.bars) if (b.on && !names.includes(b.n)) names.push(b.n);
    if (!names.length) { toast('Nenhum destes tokens tem uma barra em uso.'); return; }
    const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase();
    const barra0 = names.includes(o.barra) ? o.barra : names.find(n => norm(n) === 'hp') || names.find(n => norm(n) === 'vida') || names[0];
    const fora = new Set(o.fora || []);
    const defs = Combate.listaDefesas();
    const st = atq = {
      rows: alvos.map(t => ({ id: t.id, on: !fora.has(t.id), st: '', r: null, manual: null })),
      defs: new Set((App.opt.atqDefs || []).filter(k => defs.some(d => d.k === k))),
      modo: App.opt.atqModo === 'rolam' ? 'rolam' : 'nao',
      avisar: App.opt.atqAvisar == null ? !(P && P.estado && P.estado.segredo) : !!App.opt.atqAvisar,
      pedido: null, pedindo: false, card: null, cena: Store.S.current,
    };
    const dano0 = String(o.dano == null ? '' : o.dano).replace(/^[+-]/, '').trim();
    const inNome = h('input', { id: 'at-nome', class: 'in', type: 'text', maxlength: 40, placeholder: 'Ataque', autocomplete: 'off', 'aria-label': 'Nome do ataque (opcional)' });
    const inDano = h('input', { id: 'at-dano', class: 'in bar-v', type: 'text', inputmode: 'decimal', placeholder: '30', autocomplete: 'off', 'data-focus': '', value: /^\d+([.,]\d+)?$/.test(dano0) ? dano0 : '', 'aria-label': 'Dano do ataque' });
    const selBar = h('select', { id: 'at-barra', class: 'in' }, names.map(n => h('option', { value: n, text: n })));
    selBar.value = barra0;
    const inMin = h('input', { id: 'at-min', class: 'in num', type: 'number', min: 0, max: 99999, step: 1, value: App.opt.atqMin > 0 ? App.opt.atqMin : 0, 'aria-label': 'Dano mínimo, depois do desconto', title: 'Mesmo com a defesa alta, passa pelo menos isto' });
    const inMax = h('input', { id: 'at-max', class: 'in num', type: 'number', min: 0, max: 99999, step: 1, value: '', placeholder: '–', 'aria-label': 'Dano máximo, depois do desconto', title: 'Nunca passa mais que isto. Vazio: sem teto' });
    const chips = h('div', { class: 'chips atq-defs', id: 'at-defs', role: 'group', 'aria-label': 'Defesas que descontam' });
    const linhaModo = h('div', { class: 'atq-modo' }), lista = h('ul', { class: 'area-list atq-list', id: 'at-lista' }), conta = h('span', { class: 'area-count', id: 'at-conta' }), pedidoEl = h('div', { class: 'atq-ped', id: 'at-pedido' });
    const num = el => { const s = String(el.value || '').trim().replace(',', '.'); return /^\d+(\.\d+)?$/.test(s) ? Number(s) : null; };
    const dano = () => num(inDano);
    const minimo = () => Math.max(0, num(inMin) || 0);
    const maximo = () => { const v = num(inMax); return v == null ? null : Math.max(minimo(), v); };
    const chaves = () => defs.filter(d => st.defs.has(d.k)).map(d => d.k);
    const rolando = () => st.modo === 'rolam' && st.defs.size > 0;
    // tudo o que a janela precisa saber de uma linha, com a cena como está agora
    const ver = r => {
      const t = Store.get('tokens', r.id);
      if (!t) return null;
      const i = Combate.barraDe(t, selBar.value), b = i >= 0 ? t.bars[i] : null, def = Combate.defesaDe(t, chaves()), comFicha = def != null, d = dano();
      const dono = comFicha ? Fichas.donoQueJoga(t) : null;        // (quem rola a defesa: o jogador dono — se não está mestrando)
      let usada = 0, falta = false, como = '';
      if (comFicha && st.defs.size) {
        if (!rolando()) { usada = def; como = 'defesa ' + def; }
        else if (r.st === 'rolou') { usada = r.r.total; como = `rolou ${r.r.total} de ${def}` + (r.r.det ? ` (${r.r.det})` : '') + (r.r.por ? ` · ${r.r.por}` : ''); }
        else if (r.st === 'inteira') { usada = def; como = 'defesa inteira: ' + def; }
        else { falta = true; como = (st.pedido && !st.pedido.fim && dono && st.pedido.chars.has(t.char) ? `esperando ${dono.name}` : 'falta rolar') + ` · defesa ${def}`; }
      } else if (comFicha) como = 'sem desconto';
      const final = !comFicha ? (r.manual != null ? r.manual : d == null ? null : Combate.danoFinal(d, 0, minimo(), maximo())) : d == null || falta ? null : Combate.danoFinal(d, usada, minimo(), maximo());
      return { t, b, def, comFicha, dono, usada, falta, como, final };
    };
    const fixaDaDefesa = (t, def) => Math.min(fixaAtual(t), def);
    // o mestre rola a defesa de um alvo (dele mesmo, ou por um jogador que demorou)
    const rolarPor = r => {
      const v = ver(r);
      if (!v || !v.comFicha || !st.defs.size) return;
      const nomeDef = Combate.nomeDasDefesas(chaves());
      let res = { ok: true, atributo: 0, fixa: 0, die: 0, dieValue: 0, total: 0 };
      if (v.def >= 1) res = Combate.rolarFixa(v.def, fixaDaDefesa(v.t, v.def));
      if (!res.ok) { toast(res.error); return; }
      r.st = 'rolou'; r.r = { total: res.total, det: v.def >= 1 ? Combate.comoSaiu(res) : '', por: v.dono ? 'pelo mestre' : '' };
      if (Ext.roll && v.def >= 1) {
        try { Ext.roll({ kind: 'defesa', name: v.t.name, tokenId: v.t.id, defNome: nomeDef, atributo: res.atributo, fixa: res.fixa, d: res.dieValue, total: res.total, pedido: st.pedido && !st.pedido.fim && v.dono ? st.pedido.id : null, alvo: v.t.char || null }); }
        catch (e) { console.error(e); }
      }
    };
    const zerarRolagens = () => { for (const r of st.rows) { r.st = ''; r.r = null; } };
    const paint = () => {
      if (atq !== st) return;
      const a = document.activeElement, card = K.card(), fid = a && a.id && card && card.contains(a) && (lista.contains(a) || chips.contains(a) || linhaModo.contains(a) || pedidoEl.contains(a)) ? a.id : null;
      const travado = !!(st.pedido && !st.pedido.fim);
      const cs = [];
      defs.forEach((d, k) => {
        if (k > 0 && defs[k - 1].g !== d.g) cs.push(h('span', { class: 'atq-sep', 'aria-hidden': 'true' }));
        cs.push(h('button', { type: 'button', class: 'chip' + (st.defs.has(d.k) ? ' on' : ''), id: 'at-d-' + d.k, 'aria-pressed': String(st.defs.has(d.k)), disabled: travado, title: travado ? 'O pedido aos jogadores já foi feito com estas defesas' : (d.g === 'geral' ? 'Defesa ' : 'Defesa contra ') + d.n,
          onclick: () => { if (st.defs.has(d.k)) st.defs.delete(d.k); else st.defs.add(d.k); App.opt.atqDefs = [...st.defs]; zerarRolagens(); paint(); } }, d.n));
      });
      chips.replaceChildren(...cs);
      linhaModo.replaceChildren(...[

// Paredes da guarita da cena de exemplo, em quadrados: [x1, y1, x2, y2, tipo]
const SAMPLE_WALLS = [
  [17, 3, 25, 3], [25, 3, 25, 9], [17, 9, 20, 9], [20, 9, 21, 9, 'door'], [21, 9, 25, 9],
  [17, 3, 17, 6], [17, 7, 17, 9], [22, 3, 22, 6],
];

// Fundo desenhado na hora (grama, estrada, guarita), para a cena de exemplo não depender de arquivo.
function makeSampleBg(cols, rows, cell) {
  const w = cols * cell, hh = rows * cell;
  const c = document.createElement('canvas'); c.width = w; c.height = hh;
  const g = c.getContext('2d'), rnd = mulberry(11);
  g.fillStyle = '#4b5b40'; g.fillRect(0, 0, w, hh);
  const greens = ['#3d4c35', '#56693f', '#445637', '#5e6c46', '#39472f'];
  for (let i = 0; i < 520; i++) {
    const r = 30 + rnd() * 110;
    g.globalAlpha = 0.1 + rnd() * 0.12; g.fillStyle = greens[i % 5];
    g.beginPath(); g.ellipse(rnd() * w, rnd() * hh, r, r * (0.5 + rnd() * 0.6), rnd() * Math.PI, 0, TAU); g.fill();
  }
  g.globalAlpha = 0.32; g.lineWidth = 1.5; g.lineCap = 'round';
  for (let i = 0; i < 2600; i++) {
    const x = rnd() * w, y = rnd() * hh, a = -Math.PI / 2 + (rnd() - 0.5) * 0.9, l = 4 + rnd() * 6;
    g.strokeStyle = i % 2 ? '#6c7f4e' : '#33412b';
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  // Estrada de terra
  const road = () => { g.beginPath(); g.moveTo(-80, 14.6 * cell); g.bezierCurveTo(8 * cell, 15.6 * cell, 15 * cell, 8.6 * cell, w + 80, 10.2 * cell); };
  g.globalAlpha = 1;
  road(); g.strokeStyle = '#5c5140'; g.lineWidth = cell * 2.9; g.stroke();
  road(); g.strokeStyle = '#7a6950'; g.lineWidth = cell * 2.3; g.stroke();
  road(); g.globalAlpha = 0.45; g.strokeStyle = '#8c7a5d'; g.lineWidth = cell * 1.1; g.stroke();
  // Piso de pedra da guarita
  g.globalAlpha = 1; g.fillStyle = '#48443c'; g.fillRect(17 * cell, 3 * cell, 8 * cell, 6 * cell);
  for (let cy = 3; cy < 9; cy++) for (let cx = 17; cx < 25; cx++) {
    const s = 96 + Math.floor(rnd() * 28);
    g.fillStyle = `rgb(${s + 8},${s + 3},${s - 8})`;
    g.fillRect(cx * cell + 2, cy * cell + 2, cell - 4, cell - 4);
  }
  for (let i = 0; i < 14; i++) {
    g.globalAlpha = 0.2; g.fillStyle = '#4a5c3a';
    g.beginPath(); g.arc((17 + rnd() * 8) * cell, (3 + rnd() * 6) * cell, 14 + rnd() * 30, 0, TAU); g.fill();
  }
  // Muros
  g.globalAlpha = 1; g.lineCap = 'square';
  for (const [x1, y1, x2, y2, k] of SAMPLE_WALLS) {
    g.strokeStyle = k ? '#6d4b2a' : '#2b2824'; g.lineWidth = k ? 9 : 15;
    g.beginPath(); g.moveTo(x1 * cell, y1 * cell); g.lineTo(x2 * cell, y2 * cell); g.stroke();
    if (!k) { g.strokeStyle = '#5b554b'; g.lineWidth = 5; g.stroke(); }
  }
  // Árvores
  const trees = [[2.5, 3, 1.5], [5.2, 17.2, 1.3], [27.5, 4.2, 1.6], [27.2, 13.2, 1.4], [28.4, 16.6, 1.2], [1.6, 9.4, 1.1], [12.5, 2.2, 1.2], [13.6, 17.6, 1.5], [23, 16.4, 1.1], [8.4, 5.6, 1]];
  for (const [tx, ty, tr] of trees) {
    const x = tx * cell, y = ty * cell, r = tr * cell;
    g.globalAlpha = 0.28; g.fillStyle = '#000'; g.beginPath(); g.arc(x + r * 0.16, y + r * 0.2, r, 0, TAU); g.fill();
    for (let i = 0; i < 9; i++) {
      const a = rnd() * TAU, d = rnd() * r * 0.55;
      g.globalAlpha = 0.9; g.fillStyle = ['#2c4629', '#355432', '#3f6239'][i % 3];
      g.beginPath(); g.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, r * (0.42 + rnd() * 0.25), 0, TAU); g.fill();
    }
    g.globalAlpha = 0.5; g.fillStyle = '#56794a';
    g.beginPath(); g.arc(x - r * 0.2, y - r * 0.25, r * 0.3, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  return c;
}

// Monta a cena de exemplo. Na primeira visita (fora de uma mesa) ela é a cena inicial; depois, o mestre pode pedir
// outra pelo menu de cenas. Numa mesa, o fundo dela sobe para o banco como qualquer imagem — por isso é uma promessa.
async function buildSample() {
  const S = Store.S;
  // fora de uma mesa, o primeiro jogador de exemplo; numa mesa, os jogadores são os participantes dela
  if (!S.players.length && !Nuvem.on()) S.players.push({ id: 'jg_dalmo', name: 'Dalmo', color: PLAYER_COLORS[0] });
  const taken = S.order.map(id => S.scenes[id].name);
  let name = 'Cena de exemplo';
  for (let k = 2; taken.includes(name); k++) name = `Cena de exemplo ${k}`;
  const sc = newScene(name);
  sc.sample = true;
  const c = sc.cell;
  try {
    const cv = makeSampleBg(sc.cols, sc.rows, c);
    const a = await Assets.fromCanvas(cv, 'bg', 'Estrada e guarita (exemplo)');
    sc.bg.asset = a.id;
  } catch (e) { sc.bgColor = '#4b5b40'; }
  sc.light = 'penumbra';
  sc.fog.dynamic = true;

  for (const [x1, y1, x2, y2, k] of SAMPLE_WALLS) sc.walls.push({ id: uid('wl'), k: k || 'wall', x1: x1 * c, y1: y1 * c, x2: x2 * c, y2: y2 * c, open: false, locked: false });
  sc.lights.push({ id: uid('lz'), name: 'Fogueira', x: 19.5 * c, y: 5.5 * c, bright: 3, dim: 6, c: '#ff9d4d', on: true });
  sc.effects.push({ id: uid('fx'), fx: 'fogo', k: 'circ', x: 19.5 * c, y: 5.5 * c, r: 0.5, w: 1, ang: 60, dir: 0, pow: 1, token: null, gm: false, by: null, seed: 7 });

  const tok = (name, cx, cy, extra) => { const t = newToken(sc, cx * c, cy * c, Object.assign({ name }, extra)); sc.tokens.push(t); return t; };
  const bars = (v1, m1, v2, m2, v3, m3, n3) => [
    { n: 'Vida', c: BAR_DEFAULTS[0].c, v: v1, m: m1, on: true },
    { n: 'SP', c: BAR_DEFAULTS[1].c, v: v2 || 0, m: m2 || 10, on: !!m2 },
    { n: n3 || 'Energia', c: BAR_DEFAULTS[2].c, v: v3 || 0, m: m3 || 10, on: !!m3 },
  ].map(cleanBar);
  // Dain X mostra os dois estilos: três barras e um recurso em pontos.
  const dainBars = bars(62, 80, 24, 40, 20, 100, 'Fé').concat(cleanBar({ n: 'Poder divino', c: '#b07ad9', v: 3, m: 5, k: 'pts', on: true }));
  const dain = tok('Dain X', 9, 12, { owner: S.players.length ? S.players[0].id : null, color: '#b9892f', barVis: 'num', bars: dainBars, auras: [{ id: uid('au'), k: 'circ', r: 1.5, c: '#f0cf6a', a: 0.16, ang: 60, dir: 0, pub: true }] });
  const astie = tok('Astie', 8, 13, { color: '#5f8fb8', bars: bars(38, 45, 30, 30) });
  const kairo = tok('Kairo', 10, 13, { color: '#6f9a62', bars: bars(51, 60, 12, 25), light: { on: true, bright: 4, dim: 8, c: '#ffc477' } });
  // Bandido: sangrando e com um contador de queimadura; Capitão: proteção que dura três rodadas.
  const b1 = tok('Bandido', 14, 10, { color: '#9c4a45', bars: bars(14, 22), conds: ['sangue', 'fogo'], cinfo: { fogo: { n: 2 } } });
  const b2 = tok('Bandida', 15, 12, { color: '#9c4a45', bars: bars(22, 22) });
  const chefe = tok('Capitão', 22, 6, { size: 2, color: '#7a3550', bars: bars(70, 70, 20, 20), conds: ['escudo'], cinfo: { escudo: { d: 3, d0: 3 } } });
  tok('Arqueira', 26, 11, { color: '#75606e', hidden: true, bars: bars(18, 18), notes: 'Só ataca quando alguém passar da porta.' });

  sc.effects.push({ id: uid('fx'), fx: 'gelo', k: 'cone', x: 0, y: 0, r: 5, w: 1, ang: 50, dir: 335, pow: 0.9, token: astie.id, gm: false, by: null, seed: 21 });
  sc.shapes.push({ id: uid('sh'), k: 'text', x: 17.1 * c, y: 1.9 * c, txt: 'Guarita em ruínas', fs: 34, s: '#f3ead2', sw: 0, f: null, a: 1, top: false, gm: false, lock: false, by: null });
  sc.shapes.push({ id: uid('sh'), k: 'line', pts: [12.2 * c, 11.6 * c, 19.9 * c, 9.9 * c], s: '#f2c14e', sw: 5, f: null, a: 0.85, arrow: true, top: false, gm: true, lock: false, by: null });

  const order = [[dain, 18], [chefe, 15], [astie, 14], [b1, 11], [kairo, 9], [b2, 7]];
  sc.turn = { on: true, round: 2, cur: null, list: order.map(([t, init]) => ({ id: uid('tn'), token: t.id, name: t.name, init })) };
  sc.turn.cur = sc.turn.list[0].id;
  normalizeScene(sc);                     // a cena de exemplo nasce com todos os campos do modelo atual

  Store.addScene(sc);
  S.current = sc.id;
  Persist.scene(sc.id);
  Persist.meta();
  App.sel = [{ c: 'tokens', id: dain.id }];
  return sc;
}

// Números de dano e cura: compara as barras de antes e de depois de cada alteração feita na mesa.
function barFloats(op, inv) {
  if (!inv || op.t !== 'upd' || op.c !== 'tokens' || !op.p.bars || !inv.p || !inv.p.bars) return;
  const t = Store.get('tokens', op.id), was = inv.p.bars, now = op.p.bars;
  if (!t || was.length !== now.length) return;
  now.forEach((b, i) => {
    const a = was[i];
    if (!a.on || !b.on || a.n !== b.n || a.m !== b.m) return;                    // só conta quando foi o valor que mudou
    if (barMode(t, b) !== 'num') return;                                         // quem não vê os números não vê o quanto mudou
    if (barX(a) !== barX(b)) floatDelta(t, Math.round((barX(b) - barX(a)) * 10) / 10, 'Sobrevida', SOBRE_COR);
    if (a.v !== b.v) floatDelta(t, Math.round((b.v - a.v) * 10) / 10, b.n);
  });
}

/* A casca do site abre as Cenas do mestre também em segundo plano (ele está em outra aba): a página roda, mas não
   tem tamanho. O que só faz sentido à vista — o passeio de primeiro uso, a oferta de trazer cenas, fechar o painel
   numa tela estreita — espera o mestre vir para cá. */
const naTela = () => !(window.innerWidth === 0 || window.innerHeight === 0);
function aoAparecer(fn) {
  if (naTela()) { fn(); return; }
  const ver = () => { if (!naTela()) return; window.removeEventListener('resize', ver); fn(); };
  window.addEventListener('resize', ver);
}

async function start(snap) {
  Render.readTheme();
  await Nuvem.iniciar();                 // dentro do site, com uma mesa aberta, as cenas são as da mesa
  const had = await Persist.load();
  if (!had && !Nuvem.on()) await buildSample();
  // (numa mesa que ainda não tem cenas, o mestre começa com uma cena vazia; a de exemplo fica no menu de cenas)
  if (!Store.scene()) { const sc = newScene('Nova cena'); Store.addScene(sc); Store.S.current = sc.id; Persist.scene(sc.id); Persist.meta(); }
  App.anim = Store.S.prefs.anim !== false;
  App.showVision = !!Store.S.prefs.showVision;
  const nasceuEscondida = !naTela();
  if (!nasceuEscondida && window.innerWidth < 900) App.sideOpen = false;

  Store.on('live', (op, inv) => { Vision.onOp(op); barFloats(op, inv); Render.request(); });
  Store.on('commit', e => { Persist.scene(e.sceneId); UI.refresh(); Render.request(); });
  Store.on('sel', () => { Vision.selChanged(); UI.refresh(); Render.request(); });
  Store.on('tool', () => UI.refresh());
  Store.on('viewer', () => UI.refresh());
  Store.on('meta', () => UI.refresh());
  Store.on('scene', () => { UI.refresh(); Render.request(); });
  Persist.onStatus(s => UI.setSave(s));
  UI.setSave(Persist.status());

  // Estado de tela de antes de uma atualização da página (quando o visualizador oferece).
  if (snap && typeof snap === 'object') {
    if (snap.scene && Store.S.scenes[snap.scene]) Store.S.current = snap.scene;
    if (snap.viewer && (snap.viewer === 'gm' || playerById(snap.viewer)) && !Nuvem.jogador()) App.viewer = snap.viewer;
    if (snap.tab) App.tab = snap.tab;
    if (snap.tour) Store.S.prefs.tour = 1;      // já viu o tutorial antes desta atualização da página
  }

  const stage = $('#stage');
  Render.resize();
  Render.fit();
  if (snap && snap.view && isFinite(snap.view.z)) Object.assign(App.view, snap.view);
  UI.renderAll();
  UI.initCaps();
  let first = true;
  if (window.ResizeObserver) new ResizeObserver(() => { Render.resize(); if (first) { first = false; Render.fit(); UI.status(); } }).observe(stage);
  else window.addEventListener('resize', Render.resize);

  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', Render.readTheme);
  new MutationObserver(Render.readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { Render.request(); UI.refresh(); });

  const flush = () => { try { Vision.flushExplored(); Fichas.flush(); Persist.flush(); } catch (e) { /* nada a fazer */ } };
  window.addEventListener('pagehide', flush);
  if (window.TC && TC.ponte && TC.ponte.aoFechar) TC.ponte.aoFechar(flush);       // dentro do site: a casca avisa antes de fechar
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

  // Tutorial de primeiro uso: abre sozinho uma vez, quando quem entra é o mestre.
  // (Nos testes automáticos, com ?debug, só abre se o endereço também trouxer ?tour.)
  // Aberta pela casca do site (que já mostra a marca na barra de cima): a marca daqui some.
  if (/[?&]casca\b/.test(location.search)) document.documentElement.classList.add('na-casca');
  // Dentro do site, com uma mesa aberta: as rolagens daqui (iniciativa) também vão para a mesa ao vivo.
  // Token que os jogadores não veem, ou de nome escondido, sai marcado como oculto: a rolagem dele fica só com o mestre.
  Fichas.start(() => { try { UI.renderAll(); } catch (e) { /* ainda abrindo */ } });
  // A lista das cenas, para os outros sistemas do site (o Acampamento e o Mapa-múndi abrem uma cena pelo nome).
  // (numa mesa, eles leem a lista direto dos documentos da mesa; esta aqui é a das cenas deste navegador)
  const listar = () => { if (Nuvem.on()) return; try { localStorage.setItem('tinycats:cenas:lista', JSON.stringify(Store.S.order.filter(id => Store.S.scenes[id]).map(id => ({ id, nome: Store.S.scenes[id].name })))); } catch (e) { /* sem armazenamento: os atalhos só não mostram a lista */ } };
  Store.on('meta', listar);
  Store.on('commit', e => { if (e.ops.some(op => op.t === 'scn' && op.p && 'name' in op.p)) listar(); });
  listar();
  // Outro sistema pediu uma cena: { cena: id } abre a que existe; { criar: { id, nome } } cria (uma vez) e abre.
  if (window.TC && window.TC.ponte && window.TC.ponte.aoIr) window.TC.ponte.aoIr(alvo => {
    if (!alvo || !isGM()) return;
    const pedido = alvo.criar && typeof alvo.criar.id === 'string' && /^[A-Za-z0-9_-]{1,60}$/.test(alvo.criar.id) ? alvo.criar : null;
    const id = pedido ? pedido.id : alvo.cena;
    if (pedido && !Store.S.scenes[id]) {
      const sc = newScene(String(pedido.nome || 'Acampamento').slice(0, 60));
      sc.id = id; sc.tone = 'noite'; sc.light = 'penumbra';
      Store.addScene(sc); Persist.scene(sc.id);
      UI.toast(`Cena "${sc.name}" criada. Monte o mapa do acampamento aqui.`);
    }
    if (typeof id === 'string' && Store.S.scenes[id] && Store.S.current !== id) UI.switchScene(id);
  });
  if (window.TC && window.TC.ponte && !Ext.roll) Ext.roll = r => {
    if (!window.TC.ponte.estado.mesa) return;
    const t = r.tokenId ? Store.get('tokens', r.tokenId) : null;
    // char: a ficha ligada ao token (a mesa ao vivo mostra a imagem do personagem ao lado de quem rolou)
    // (numa disputa, basta um dos dois lados estar oculto — quem publica já marca: r.oculto)
    window.TC.ponte.publicar('cena', Object.assign({}, r, { oculto: !!r.oculto || !!(t && (t.hidden || t.showName === false)), char: (t && t.char) || null }));
  };
  // A iniciativa que alguém rolou pela telinha de dados da mesa ao vivo: o mestre pode anotá-la na ordem de turnos.
  // …e a defesa que um jogador rolou a pedido entra na janela do ataque que o mestre tem aberta.
  if (window.TC && window.TC.ponte && window.TC.ponte.registro) window.TC.ponte.registro.aoChegar(l => { try { UI.iniFromTable(l); } catch (e) { console.error(e); } try { Luta.daMesa(l); } catch (e) { console.error(e); } });
  const dbg = /[?&]debug\b/.test(location.search);
  if (isGM() && !Tour.seen() && (!dbg || /[?&]tour\b/.test(location.search))) aoAparecer(() => setTimeout(() => { if (!UI.modalOpen() && !Tour.seen()) Tour.start(); }, 700));
  // O mestre numa mesa: se este navegador guarda cenas de antes, a mesa oferece trazê-las (a janela, uma vez só,
  // quando a mesa ainda não tem cenas; depois disso, fica o lembrete no painel e o item no menu ⋯).
  if (Nuvem.mestre()) setTimeout(() => { if (!had) aoAparecer(() => UI.offerLocal()); else Nuvem.cenasDoNavegador().then(() => UI.refresh()); }, 900);
  // Aberta em segundo plano: quando o mestre vier para cá, a página se ajeita (e passa a transmitir a cena no ar).
  if (nasceuEscondida) aoAparecer(() => {
    if (window.innerWidth < 900) App.sideOpen = false;
    try { Render.resize(); UI.renderAll(); } catch (e) { console.error(e); }
    Nuvem.apareceu();
  });
}

(function boot() {
  // Acesso para testes automáticos (só com ?debug no endereço). __tc é o nome de agora; __urgm, o que os testes antigos usam.
  if (/[?&]debug\b/.test(location.search)) window.__tc = window.__urgm = { Combate, Luta, Fichas, Store, App, Tools, Vision, Render, UI, Act, FX, Persist, Assets, Tour, Walls, Ext, Nuvem, Proj, can, tokShown, setSel, barsShown, tokensIn, auraShape, fxVisible, doorSpots, rollDie, applyLabel, newToken, newScene, barAfter, barX, cleanBar, normalizeScene, cleanFixas, cleanTer, isTer, TERRENOS, selOf };
  const hot = window.claude && window.claude.hot;
  try {
    if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ view: Object.assign({}, App.view), viewer: App.viewer, tab: App.tab, scene: Store.S.current, tour: Tour.seen() }));
  } catch (e) { /* sem esse recurso, segue normal */ }
  let started = false;
  const go = snap => {
    if (started) return;
    started = true;
    start(snap || {}).catch(err => {
      // Algo impediu a mesa de abrir: mostra o motivo em vez de uma tela vazia.
      console.error(err);
      const box = document.createElement('div');
      box.className = 'fatal';
      box.textContent = 'Não consegui abrir a mesa: ' + (err && err.message ? err.message : 'erro desconhecido') + '. Recarregue a página; se continuar, me mande esta mensagem.';
      $('#stage').append(box);
    });
  };
  if (hot && typeof hot.ready === 'function') {
    try { hot.ready(go); } catch (e) { /* cai no início normal abaixo */ }
    setTimeout(() => go({}), 1500);
  } else go((hot && hot.data) || {});
})();
})();
</script>
