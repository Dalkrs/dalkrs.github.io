    }

    // 3) Escuridão (com os buracos de luz)
    if (lit) {
      const g = cDark.g;
      clear(cDark);
      const a = mode === 'penumbra' ? 0.46 : (gm ? 0.68 : 0.9);
      g.fillStyle = `rgba(6,8,16,${a})`;
      g.fillRect(0, 0, mw, mh);
      g.globalCompositeOperation = 'destination-out';
      g.drawImage(cLit, 0, 0);
      g.setTransform(M, 0, 0, M, 0, 0);
      for (const s of viewerSrc) {
        if (!s.dr) continue;
        g.save();
        if (s.poly) { polyPath(g, s.poly); g.clip(); }
        const gr = g.createRadialGradient(s.cx, s.cy, 0, s.cx, s.cy, s.dr);
        gr.addColorStop(0, 'rgba(0,0,0,0.72)'); gr.addColorStop(0.8, 'rgba(0,0,0,0.62)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = gr;
        g.fillRect(s.cx - s.dr, s.cy - s.dr, s.dr * 2, s.dr * 2);
        g.restore();
      }
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.globalCompositeOperation = 'source-over';
      out.dark = cDark; out.glow = cGlow;
    } else { out.dark = null; out.glow = null; }

    // 4) Névoa
    if (!fogOn) { out.fog = null; out.vis = null; }
    else if (gm) {
      out.vis = null;
      if (fog.manual) {
        const g = cFog.g;
        clear(cFog);
        if (fog.dynamic) {
          // revelado à força aparece num tom claro; escondido à força, num tom escuro
          const tg = cTmp.g;
          clear(cTmp);
          tg.fillStyle = 'rgba(150,235,180,0.16)'; tg.fillRect(0, 0, mw, mh);
          tg.globalCompositeOperation = 'destination-in'; tg.drawImage(cReveal, 0, 0);
          tg.globalCompositeOperation = 'source-over';
          g.drawImage(cTmp, 0, 0);
          g.globalAlpha = 0.5; g.drawImage(cHide, 0, 0); g.globalAlpha = 1;
        }
        else {
          g.fillStyle = 'rgba(6,8,14,0.5)'; g.fillRect(0, 0, mw, mh);
          g.globalCompositeOperation = 'destination-out'; g.drawImage(cReveal, 0, 0);
          g.globalCompositeOperation = 'source-over';
        }
        out.fog = cFog;
      } else out.fog = null;
    } else {
      const g = cFog.g;
      clear(cFog);
      g.fillStyle = FOG; g.fillRect(0, 0, mw, mh);
      g.globalCompositeOperation = 'destination-out';
      if (fog.dynamic && fog.explored) {
        const e = expl.get(vkey);
        if (e) { g.globalAlpha = 0.45; g.drawImage(e, 0, 0); g.globalAlpha = 1; }
      }
      g.drawImage(cVis, 0, 0);
      g.globalCompositeOperation = 'source-over';
      if (fog.manual && fog.dynamic) g.drawImage(cHide, 0, 0);
      out.fog = cFog; out.vis = cVis;
      out.noSource = fog.dynamic && nViewer === 0;
      const sg = cSample.g;
      sg.clearRect(0, 0, cSample.width, cSample.height);
      sg.drawImage(cVis, 0, 0, cSample.width, cSample.height);
    }
    // 5) Véu do mestre (quando ele pede): tudo o que nenhum jogador enxerga agora fica coberto por uma camada
    //    escura e translúcida; o que eles enxergam continua com o brilho normal. Vale a mesma conta da visão dos
    //    jogadores (paredes, portas, cortinas, escuridão, luzes, visão no escuro). Com um token selecionado
    //    sozinho, a conta é só a dele, tenha dono ou não.
    out.veil = null; out.veilOf = null;
    if (veil) {
      if (veil.tok) computeVis(sc, t => t === veil.tok, cTmp2, B, mode, false);
      else if (!groupReady) computeVis(sc, t => ownedBy(t, '*'), cTmp2, B, mode, false);
      if (!cVeil) cVeil = mk(mw, mh);
      const g = cVeil.g;
      clear(cVeil);
      g.fillStyle = veilColor; g.fillRect(0, 0, mw, mh);
      g.globalCompositeOperation = 'destination-out';
      g.drawImage(cTmp2, 0, 0);
      g.globalCompositeOperation = 'source-over';
      out.veil = cVeil; out.veilOf = veil.tok ? veil.tok.id : '*';
    }
    stats.ms = performance.now() - t0;
    return out;
  }

  // Quem está olhando enxerga este ponto do mapa?
  function canSee(x, y) {
    if (!out.vis) return true;
    const kx = cSample.width / mw, ky = cSample.height / mh;
    const px = Math.floor(x * M * kx), py = Math.floor(y * M * ky);
    if (px < 0 || py < 0 || px >= cSample.width || py >= cSample.height) return false;
    return cSample.g.getImageData(px, py, 1, 1).data[3] > 60;
  }

  function resetExplored(sc) {
    for (const c of expl.values()) clear(c);
    expl.clear();
    sc.explored = {};
    Persist.scene(sc.id);
    dirty = true;
  }

  // Decide, a partir de uma operação do Store, o que precisa ser refeito.
  function onOp(op) {
    if (op.t === 'scn') {
      // Só o que muda luz, névoa ou o tamanho da cena pede recálculo; turnos, miras e clima, não.
      const p = op.p || {};
      if ('light' in p || 'fog' in p || 'cols' in p || 'rows' in p || 'cell' in p) { dirty = true; staticStale = true; }
      return;
    }
    if (op.c === 'fogOps') { manualStale = true; dirty = true; return; }
    if (op.c === 'walls' || op.c === 'lights') { dirty = true; staticStale = true; return; }
    if (op.c === 'tokens') {
      if (op.t !== 'upd') { dirty = true; return; }
      const p = op.p;
      if ('x' in p || 'y' in p || 'size' in p || 'vis' in p || 'light' in p || 'owner' in p || 'hidden' in p) dirty = true;
    }
  }

  return {
    update, canSee, onOp, out, stats, resetExplored, flushExplored,
    isDirty: () => dirty,
    invalidate() { dirty = true; },
    // A seleção mudou: o véu do mestre pode passar a valer para outro token (ou voltar ao grupo). Só então refaz.
    selChanged() { const v = veilState(Store.scene()); if ((v ? (v.tok ? v.tok.id : '*') : null) !== out.veilOf) dirty = true; },
    setVeilColor(c) { if (c && c !== veilColor) { veilColor = c; dirty = true; } },
    previewOp(op) { if (cReveal) { paintOp(op); dirty = true; } },
    restoreManual() { manualStale = true; dirty = true; },
  };
})();
/* ---------------------------------------------------------------
   6. FX — biblioteca de efeitos de magia
   Cada efeito é uma área (círculo, quadrado, retângulo, cone ou linha)
   com uma animação procedural. A animação não guarda estado: tudo é calculado
   a partir do tempo e de uma semente, então qualquer computador que
   receba o mesmo efeito desenha a mesma coisa.
   --------------------------------------------------------------- */
const FX = (() => {
  const sprites = new Map();
  function sprite(color) {
    let s = sprites.get(color);
    if (!s) {
      s = document.createElement('canvas'); s.width = s.height = 64;
      const g = s.getContext('2d');
      const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, hexA(color, 1)); gr.addColorStop(0.35, hexA(color, 0.55)); gr.addColorStop(1, hexA(color, 0));
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
      sprites.set(color, s);
    }
    return s;
  }
  function blob(c, x, y, r, color, a) {
    if (a <= 0.01 || r <= 0.2) return;
    c.globalAlpha = a > 1 ? 1 : a;
    c.drawImage(sprite(color), x - r, y - r, r * 2, r * 2);
  }
  // Ruído determinístico em [0,1).
  function hsh(i, k, seed) {
    const v = Math.sin(i * 127.1 + k * 311.7 + seed * 74.7) * 43758.5453;
    return v - Math.floor(v);
  }
  const cnt = (g, per, min, max, pow) => clamp(Math.round(g.area * per * pow), min, max);

  /* Geometria de um efeito na cena. */
  function geom(e, sc) {
    const cell = sc.cell;
    let x = e.x, y = e.y, half = 0;
    if (e.token) {
      const t = sc.tokens.find(o => o.id === e.token);
      if (t) { half = t.size * cell / 2; x = t.x + half; y = t.y + half; }
    }
    let R = Math.max(cell * 0.25, (e.r || 0) * cell + half);
    const dir = rad(e.dir || 0);
    const cs = Math.cos(dir), sn = Math.sin(dir);
    const p = new Path2D();
    let cx = x, cy = y, inR = R, area, sample, hw = 0, hh = 0, hx = null, hy = null, lab = null;
    if (e.k === 'rect') {
      // Retângulo: largura (rw) e altura (rh) em quadrados, centrado em (x, y) e girado por dir. Preso a um
      // token, fica centrado nele; as medidas são as do próprio retângulo (não somam o tamanho do token).
      hw = Math.max(cell * 0.25, (e.rw > 0 ? e.rw : 1) * cell) / 2;
      hh = Math.max(cell * 0.25, (e.rh > 0 ? e.rh : 1) * cell) / 2;
      const pts = [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]].map(([a, b]) => [x + cs * a - sn * b, y + sn * a + cs * b]);
      p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < 4; i++) p.lineTo(pts[i][0], pts[i][1]); p.closePath();
      area = 4 * hw * hh;
      R = Math.max(hw, hh); inR = Math.min(hw, hh);
      hx = x + cs * hw; hy = y + sn * hw;                 // a alça fica no meio do lado "da frente"
      sample = (u, v) => { const a = (u * 2 - 1) * hw, b = (v * 2 - 1) * hh; return [x + cs * a - sn * b, y + sn * a + cs * b]; };
      // onde vai o rótulo de duração: no meio do lado que fica mais alto na tela, e o sentido "para dentro" a partir dali
      let top = null;
      for (const m of [[cs * hw, sn * hw], [-cs * hw, -sn * hw], [-sn * hh, cs * hh], [sn * hh, -cs * hh]]) if (!top || m[1] < top[1] - 1e-9) top = m;
      const tl = Math.hypot(top[0], top[1]) || 1;
      lab = { x: x + top[0], y: y + top[1], nx: -top[0] / tl, ny: -top[1] / tl };
    } else if (e.k === 'quad') {
      const pts = [[-R, -R], [R, -R], [R, R], [-R, R]].map(([a, b]) => [x + cs * a - sn * b, y + sn * a + cs * b]);
      p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < 4; i++) p.lineTo(pts[i][0], pts[i][1]); p.closePath();
      area = 4 * R * R;
      sample = (u, v) => { const a = (u * 2 - 1) * R, b = (v * 2 - 1) * R; return [x + cs * a - sn * b, y + sn * a + cs * b]; };
    } else if (e.k === 'cone') {
      const ang = rad(clamp(e.ang || 60, 10, 340));
      p.moveTo(x, y); p.arc(x, y, R, dir - ang / 2, dir + ang / 2); p.closePath();
      area = R * R * ang / 2;
      const s2 = Math.sin(Math.min(ang, Math.PI) / 2);
      inR = R * s2 / (1 + s2);
      cx = x + cs * (R - inR); cy = y + sn * (R - inR);
      sample = (u, v) => { const rr = R * Math.sqrt(u), a = dir + (v - 0.5) * ang; return [x + Math.cos(a) * rr, y + Math.sin(a) * rr]; };
    } else if (e.k === 'line') {
      const wd = Math.max(cell * 0.25, (e.w || 1) * cell), hw = wd / 2;
      p.moveTo(x + sn * hw, y - cs * hw); p.lineTo(x + cs * R + sn * hw, y + sn * R - cs * hw);
      p.lineTo(x + cs * R - sn * hw, y + sn * R + cs * hw); p.lineTo(x - sn * hw, y + cs * hw); p.closePath();
      area = R * wd;
      cx = x + cs * R / 2; cy = y + sn * R / 2; inR = Math.min(R, wd) / 2;
      sample = (u, v) => { const a = u * R, b = (v - 0.5) * wd; return [x + cs * a - sn * b, y + sn * a + cs * b]; };
    } else {
      p.arc(x, y, R, 0, TAU);
      area = Math.PI * R * R;
      sample = (u, v) => { const rr = R * Math.sqrt(u), a = v * TAU; return [x + Math.cos(a) * rr, y + Math.sin(a) * rr]; };
    }
    // hw/hh: meia largura e meia altura; lab: âncora do rótulo de duração (os dois só existem no retângulo)
    return {
      path: p, x, y, cx, cy, R, inR, half, cell, dir, cs, sn, area: area / (cell * cell), sample,
      hx: hx == null ? x + cs * R : hx, hy: hy == null ? y + sn * R : hy, hw, hh, lab, seed: 1,
    };
  }

  // Anel de runas usado por arcano, antimagia e luz sagrada.
  function runeRing(c, g, rot, color, alpha, sides, skip) {
    const r = g.inR * 0.86;
    if (r < g.cell * 0.2) return;
    c.save();
    c.translate(g.cx, g.cy); c.rotate(rot);
    c.globalAlpha = alpha; c.strokeStyle = color; c.lineWidth = Math.max(1, g.cell * 0.03);
    c.beginPath(); c.arc(0, 0, r, 0, TAU); c.stroke();
    c.beginPath(); c.arc(0, 0, r * 0.8, 0, TAU); c.stroke();
    c.beginPath();
    for (let i = 0; i < 24; i++) { const a = i / 24 * TAU; c.moveTo(Math.cos(a) * r * 0.8, Math.sin(a) * r * 0.8); c.lineTo(Math.cos(a) * r * (i % 3 ? 0.87 : 0.94), Math.sin(a) * r * (i % 3 ? 0.87 : 0.94)); }
    c.stroke();
    c.beginPath();
    for (let i = 0; i <= sides; i++) { const a = (i * skip / sides) * TAU - Math.PI / 2; const px = Math.cos(a) * r * 0.78, py = Math.sin(a) * r * 0.78; if (i) c.lineTo(px, py); else c.moveTo(px, py); }
    c.stroke();
    c.restore();
  }

  const P = {
    fogo: {
      n: 'Fogo', tint: '#ff6a1a', base: 0.22, edge: '#ffb14d', glow: true,
      draw(c, g, t, pow) {
        c.globalCompositeOperation = 'lighter';
        const n = cnt(g, 7, 10, 90, pow);
        for (let i = 0; i < n; i++) {
          const sp = 0.5 + hsh(i, 3, g.seed) * 0.6, ph = t * sp + hsh(i, 4, g.seed);
          const life = ph % 1, cyc = Math.floor(ph);
          const [x, y] = g.sample(hsh(i + cyc * 17, 1, g.seed), hsh(i + cyc * 17, 2, g.seed));
          const r = g.cell * (0.2 + hsh(i, 5, g.seed) * 0.3) * (1 - life * 0.55);
          blob(c, x + Math.sin(t * 3 + i) * g.cell * 0.05, y - life * g.cell * 0.3, r,
            life < 0.35 ? '#ffd98a' : life < 0.7 ? '#ff8a24' : '#d6330f', Math.sin(life * Math.PI) * 0.5 * pow);
        }
      },
    },
    gelo: {
      n: 'Gelo', tint: '#8fd4ff', base: 0.2, edge: '#d9f1ff',
      draw(c, g, t, pow) {
        const m = cnt(g, 1.2, 3, 16, pow);
        for (let i = 0; i < m; i++) {
          const [x, y] = g.sample(hsh(i, 11, g.seed), hsh(i, 12, g.seed));
          blob(c, x + Math.sin(t * 0.3 + i * 2) * g.cell * 0.3, y + Math.cos(t * 0.24 + i) * g.cell * 0.3, g.cell * (0.7 + hsh(i, 13, g.seed) * 0.6), '#e8f7ff', 0.16 * pow);

          const a = tw * tw * 0.8 * pow;

          const [x, y] = g.sample(hsh(i, 1, g.seed), hsh(i, 2, g.seed));

          c.moveTo(x - s * 0.5, y - s * 0.5); c.lineTo(x + s * 0.5, y + s * 0.5); c.moveTo(x + s * 0.5, y - s * 0.5); c.lineTo(x - s * 0.5, y + s * 0.5);
          c.stroke();
        }
      },
    },
    raio: {
      n: 'Raio', tint: '#6f8dff', base: 0.14, edge: '#b9cbff', glow: true,
      draw(c, g, t, pow) {
        c.globalCompositeOperation = 'lighter';
        c.lineCap = c.lineJoin = 'round';
        const fr = Math.floor(t * 7), k = clamp(Math.round(Math.sqrt(g.area) * 1.3 * pow) + 1, 2, 9);
        const fade = 1 - (t * 7 - fr) * 0.6;

          const b = g.sample(hsh(i, fr + 3, g.seed), hsh(i, fr + 4, g.seed));
          c.beginPath(); c.moveTo(a[0], a[1]);
          for (let s = 1; s < 6; s++) {
            const f = s / 6, j = g.cell * 0.45;
            c.lineTo(a[0] + (b[0] - a[0]) * f + (hsh(i * 7 + s, fr, g.seed) - 0.5) * j, a[1] + (b[1] - a[1]) * f + (hsh(i * 7 + s, fr + 9, g.seed) - 0.5) * j);
          }
          c.lineTo(b[0], b[1]);
          c.globalAlpha = 0.3 * pow * fade; c.strokeStyle = '#7aa2ff'; c.lineWidth = g.cell * 0.13; c.stroke();
          c.globalAlpha = 0.85 * pow * fade; c.strokeStyle = '#f0f5ff'; c.lineWidth = Math.max(0.8, g.cell * 0.035); c.stroke();
        }
      },
    },
    agua: {
      n: 'Água', tint: '#2f8fd6', base: 0.26, edge: '#9bd4ff',
      draw(c, g, t, pow) {
        const n = cnt(g, 0.9, 3, 14, pow);
        c.strokeStyle = '#d6efff';
        for (let i = 0; i < n; i++) {

/* Quem pode o quê. O mestre pode tudo; o jogador depende dos interruptores da cena. */
function can(what, obj) {
  const sc = Store.scene();
  if (isGM()) return what === 'moveToken' ? !obj.locked : true;
  const p = sc.perms, me = App.viewer;
  switch (what) {
    case 'moveToken': return p.mover && ownsTok(obj) && !obj.locked;
    case 'bars': return p.barras && ownsTok(obj);
    case 'conds': return p.condicoes && ownsTok(obj);
    case 'auras': return p.auras && ownsTok(obj);
    case 'draw': return !!p.desenhar;
    case 'fx': return !!p.efeitos;
    case 'ruler': return !!p.regua;
    case 'ping': return !!p.ping;
    case 'doors': return !!p.portas;
    case 'turns': return !!p.turnos;
    case 'target': return !!p.mira;
    case 'editShape': return p.desenhar && !!obj && obj.by === me;
    case 'editFx': return p.efeitos && !!obj && obj.by === me;
    default: return false;
  }

/* Véu do mestre: escurece no mapa o que nenhum jogador enxerga agora. Com exatamente um token selecionado
   (e que enxergue), passa a mostrar só o que ESSE token vê, tenha dono ou não. Devolve null quando não há
   véu: visão de jogador, opção desligada, ou cena sem visão por paredes (aí não há o que escurecer). */
function veilState(sc) {
  if (!sc || !isGM() || !App.showVision || !sc.fog.dynamic) return null;
  let tok = null;
  if (App.sel.length === 1 && App.sel[0].c === 'tokens') {
    const t = sc.tokens.find(x => x.id === App.sel[0].id);
    if (t && t.vis && t.vis.on) tok = t;
  }
  return { tok };
}

/* O que quem está olhando enxerga de cada coisa. */
function tokShown(t, sc) {
  if (isGM()) return true;
  if (t.hidden) return false;
  if (ownsTok(t)) return true;
  const [cx, cy] = tokC(t, sc);

// A porta aparece se quem olha enxerga algum dos dois lados dela.
function doorSeen(w, sc) {
  if (isGM() || !Vision.out.vis) return true;
  const mx = (w.x1 + w.x2) / 2, my = (w.y1 + w.y2) / 2;
  const len = Math.hypot(w.x2 - w.x1, w.y2 - w.y1) || 1, d = sc.cell * 0.18;
  const nx = -(w.y2 - w.y1) / len * d, ny = (w.x2 - w.x1) / len * d;

}
/* Ícones clicáveis das aberturas (porta, janela, cortina) que quem está olhando alcança: [{ w, x, y }].
   Em geral o ícone fica no meio da abertura. Quando dois cairiam no mesmo ponto (cortina sobre janela),
   eles se afastam ao longo do trecho, para os dois continuarem clicáveis e não se confundirem. */
function doorSpots(sc) {
  const gm = isGM(), out = [];
  for (const w of Walls.of(sc).openings) {
    if (w.secret && !gm) continue;                         // porta secreta: só o mestre alcança
    if (!doorSeen(w, sc)) continue;
    out.push({ w, x: (w.x1 + w.x2) / 2, y: (w.y1 + w.y2) / 2 });
  }
  const gap = 24 / App.view.z, gap2 = gap * gap;           // um ícone ocupa 22 px de tela
  const n = out.length, done = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    if (done[i]) continue;
    const xi = out[i].x, yi = out[i].y;
    let grp = null;
    for (let j = i + 1; j < n; j++) {
      if (done[j]) continue;
      const dx = out[j].x - xi;
      if (dx >= gap || dx <= -gap) continue;
      const dy = out[j].y - yi;
      if (dx * dx + dy * dy < gap2) (grp || (grp = [i])).push(j);
    }
    if (!grp) continue;
    // o grupo fica centrado onde estava, em fila ao longo do primeiro trecho, na ordem em que as aberturas foram criadas
    const w0 = out[i].w, L = Math.hypot(w0.x2 - w0.x1, w0.y2 - w0.y1) || 1, ux = (w0.x2 - w0.x1) / L, uy = (w0.y2 - w0.y1) / L;
    let mx = 0, my = 0;
    for (const j of grp) { mx += out[j].x; my += out[j].y; done[j] = 1; }
    mx /= grp.length; my /= grp.length;
    grp.forEach((j, q) => { const off = (q - (grp.length - 1) / 2) * gap; out[j].x = mx + ux * off; out[j].y = my + uy * off; });

}
