<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cenas · Tiny Cats</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze:wght@500;600;700&display=swap">
<style>
/* Layout: mesa em tela cheia. Trilho de ferramentas à esquerda, mapa no centro e
   painel contextual à direita; a barra do topo guarda a cena e quem está olhando. */
:root {
  color-scheme: dark;
  --table: #0d1017;            /* a mesa, atrás do mapa */
  --surface: #161a24;          /* barras e painéis */
  --raised: #1f2431;           /* campos e cartões */
  --hover: #283042;
  --line: #2b3243;
  --line-strong: #40495f;
  --fg: #e8eaf0;
  --fg-2: #a6aec0;
  --fg-3: #7d879c;
  --lamp: #e6ab4f;             /* acento: âmbar de lamparina */
  --lamp-ink: #edb960;         /* o acento quando é texto ou ícone */
  --lamp-soft: rgba(230, 171, 79, .16);
  --on-lamp: #1d1503;
  --danger: #f0786e;
  --scrim: rgba(5, 7, 12, .62);
  --veil: rgba(6, 9, 20, .52);  /* véu do mestre sobre o que os jogadores não veem */
  --sobre: #8fe3ff;             /* sobrevida, nos painéis (no mapa a cor é fixa: SOBRE_COR) */
  --shadow: 0 12px 34px rgba(0, 0, 0, .5);
  --ui: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --display: "Grenze", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --table: #c7ced9; --surface: #f2f4f8; --raised: #ffffff; --hover: #e3e8ef;
    --line: #d2d8e2; --line-strong: #aeb8c9;
    --fg: #1a1f2c; --fg-2: #4a5468; --fg-3: #68738a;
    --lamp: #e2a13a; --lamp-ink: #855605; --lamp-soft: rgba(196, 128, 16, .17); --on-lamp: #241a04;
    --danger: #b9342a;
    --scrim: rgba(30, 38, 54, .42);
    --veil: rgba(16, 24, 48, .5);
    --sobre: #1f7fa3;
    --shadow: 0 12px 34px rgba(40, 50, 72, .24);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --table: #c7ced9; --surface: #f2f4f8; --raised: #ffffff; --hover: #e3e8ef;
  --line: #d2d8e2; --line-strong: #aeb8c9;
  --fg: #1a1f2c; --fg-2: #4a5468; --fg-3: #68738a;
  --lamp: #e2a13a; --lamp-ink: #855605; --lamp-soft: rgba(196, 128, 16, .17); --on-lamp: #241a04;
  --danger: #b9342a;
  --scrim: rgba(30, 38, 54, .42);
  --veil: rgba(16, 24, 48, .5);
  --sobre: #1f7fa3;
  --shadow: 0 12px 34px rgba(40, 50, 72, .24);
}

*, *::before, *::after { box-sizing: border-box; }
/* Duas regras que o visualizador de artefatos dava de presente e que a página do site precisa trazer consigo:
   o que está com [hidden] some mesmo tendo display próprio (faixas, legenda, área de soltar imagem), e a mesa
   respeita o recorte da tela do celular. */
[hidden] { display: none !important; }
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--table); color: var(--fg);
  font: 14px/1.4 var(--ui);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.ic { display: block; flex: none; }

/* ---- Estrutura ---- */
.app { height: 100%; display: flex; flex-direction: column; min-width: 0; }
.top {
  flex: none; display: flex; align-items: center; gap: 10px; min-width: 0;
  padding: 7px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { font: 600 22px/1 var(--display); letter-spacing: .01em; color: var(--lamp-ink); white-space: nowrap; padding-right: 2px; }
.na-casca .brand { display: none; }
.scene-b {
  display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 300px;
  padding: 6px 10px; background: var(--raised); border: 1px solid var(--line); border-radius: 8px;
}
.scene-b:hover { background: var(--hover); }
.scene-b.flat { border-color: transparent; background: none; cursor: default; }
.scene-n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
/* Numa mesa: qual cena os jogadores estão vendo. Aceso quando é esta; em tom de aviso quando é outra. */
.air-b {
  display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 230px; flex: 0 1 auto;
  padding: 6px 9px; background: var(--raised); border: 1px solid var(--line); border-radius: 8px;
  color: var(--fg-2); font-weight: 600; font-size: 13px;
}
.air-b:hover { background: var(--hover); color: var(--fg); }
.air-b.on { border-color: var(--lamp); color: var(--lamp-ink); background: var(--lamp-soft); }
.air-b.other { border-style: dashed; border-color: var(--line-strong); }
.air-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grp { display: inline-flex; align-items: center; gap: 2px; }
.spacer { flex: 1 1 auto; min-width: 0; }
.viewer { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.viewer .in { width: auto; max-width: 160px; }
.viewer-l { color: var(--fg-2); font-size: 12.5px; white-space: nowrap; }
.zoom-l {
  min-width: 50px; padding: 6px 2px; background: none; border: 0; border-radius: 6px;
  font: 600 12.5px var(--mono); font-variant-numeric: tabular-nums; color: var(--fg-2);
}
.zoom-l:hover { background: var(--hover); color: var(--fg); }

.ib {
  display: inline-grid; place-items: center; flex: none; width: 32px; height: 32px; padding: 0;
  background: none; border: 0; border-radius: 7px; color: var(--fg-2);
}
.ib:hover:not(:disabled) { background: var(--hover); color: var(--fg); }
.ib:disabled { opacity: .35; cursor: default; }
.ib.on { color: var(--lamp-ink); background: var(--lamp-soft); }

.banner {
  flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
  padding: 7px 16px; background: var(--lamp-soft); border-bottom: 1px solid var(--line); font-size: 13px;
}
.banner .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.banner-t { flex: 1 1 240px; min-width: 0; }
.banner-w { color: var(--danger); font-weight: 600; }

.work { flex: 1 1 auto; min-height: 0; display: flex; position: relative; }
.rail {
  flex: none; width: 50px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 0; background: var(--surface); border-right: 1px solid var(--line);
  overflow-y: auto; scrollbar-width: none;
}
.rail::-webkit-scrollbar { display: none; }
.tool {
  display: grid; place-items: center; flex: none; width: 36px; height: 34px; padding: 0;
  background: none; border: 0; border-radius: 8px; color: var(--fg-2);
}
.tool:hover { background: var(--hover); color: var(--fg); }
.tool.on { background: var(--lamp); color: var(--on-lamp); }
.rail-sep { flex: none; width: 22px; height: 1px; margin: 3px 0; background: var(--line); }

.stage { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

/* ---- Sobre o mapa ---- */
.opts {
  position: absolute; left: 10px; top: 10px; width: fit-content; max-width: calc(100% - 20px);
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
  padding: 7px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--shadow); font-size: 13px; z-index: 2;
}
.o-g, .o-rg, .o-ck { display: inline-flex; align-items: center; gap: 7px; }
.o-ck { cursor: pointer; white-space: nowrap; }
.o-ck input { accent-color: var(--lamp); width: 15px; height: 15px; margin: 0; }
.o-l { color: var(--fg-2); font-size: 12.5px; white-space: nowrap; }
.o-val { min-width: 44px; font: 12px var(--mono); color: var(--fg-2); }
.o-u { color: var(--fg-3); font-size: 12.5px; }
.o-warn { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--lamp-ink); font-size: 12.5px; }
.opts .in { width: auto; }
.opts .in.num { width: 64px; }
.opts .rg { width: 96px; }

/* Base do mapa: avisos, faixa do token selecionado e a linha de dica + estado. */
.dock {
  position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 3;
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
}
/* A dica e o estado ficam numa faixa de altura fixa (a de uma dica em duas linhas; mais do que isso, a dica é
   cortada com reticências). O que aparece e some ali com o mouse — a dica de um item travado, "Coluna · Linha",
   "Salvando…" — não pode mudar essa altura: a faixa do token fica logo acima, e se ela andasse com o mouse em cima
   dela, o mouse sairia, a dica mudaria de novo, e a faixa ficaria subindo e descendo. */
.foot { align-self: stretch; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; min-height: 46px; }
.hintbox, .status {
  padding: 5px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  color: var(--fg-2); font-size: 12.5px;
}
.hintbox { flex: 0 1 auto; min-width: 0; max-width: 640px; }
.hintbox[hidden] { display: none; }
.hint { line-height: 17px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
.foot-r { flex: none; max-width: 100%; margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.status { flex: none; font: 12px var(--mono); white-space: nowrap; }
.status.warn { color: var(--lamp-ink); }

.fatal {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 9; max-width: min(460px, calc(100% - 32px));
  padding: 14px 16px; background: var(--surface); border: 1px solid var(--danger); border-radius: 10px; color: var(--fg); font-size: 13.5px;
}
.drop {
  position: absolute; inset: 12px; display: grid; place-items: center; pointer-events: none; z-index: 6;
  border: 2px dashed var(--lamp); border-radius: 14px; background: var(--scrim);
  color: var(--fg); font: 600 20px var(--display);
}
.toasts { display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 100%; }
.toasts.over { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 70; max-width: calc(100% - 32px); pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 12px; padding: 8px 14px; pointer-events: auto;
  background: var(--raised); border: 1px solid var(--line-strong); border-radius: 9px;
  box-shadow: var(--shadow); font-size: 13px;
}
.toast-a { padding: 2px 4px; background: none; border: 0; border-radius: 5px; color: var(--lamp-ink); font-weight: 700; white-space: nowrap; }

.hud {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 5px;
  max-width: 100%; padding: 5px 6px; pointer-events: auto;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 11px; box-shadow: var(--shadow);
}
.hud-who { display: inline-flex; align-items: center; gap: 7px; min-width: 0; max-width: 180px; padding: 0 6px 0 2px; }
.hud-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; font-size: 13px; }
.hud-b {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px;
  background: var(--raised); border: 1px solid var(--line); border-radius: 7px; font-size: 12.5px; white-space: nowrap;
}
.hud-b::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--c); flex: none; }
.hud-n { color: var(--fg-2); font-size: 11.5px; }
.hud-in {
  width: 44px; padding: 1px 4px; text-align: right; background: none;
  border: 1px solid var(--line-strong); border-radius: 5px; font: 600 13px var(--mono);
}
.hud-in:hover { border-color: var(--fg-3); }
.hud-in:focus { border-color: var(--lamp); outline: none; }
.hud-m, .hud-v { font: 12px var(--mono); color: var(--fg-2); }
.hud-i { width: 28px; height: 28px; }

/* ---- Painel lateral ---- */
.side {
  flex: none; width: 340px; min-height: 0; display: flex; flex-direction: column;
  background: var(--surface); border-left: 1px solid var(--line);
}
.tabs { flex: none; display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  padding: 7px 8px 8px; background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 6px 6px 0 0;
  color: var(--fg-2); font-size: 13px; font-weight: 600; white-space: nowrap;
}
.tab:hover { color: var(--fg); background: var(--hover); }
.tab.on { color: var(--lamp-ink); border-bottom-color: var(--lamp); }
.tab-body {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 14px 14px 22px;
  display: flex; flex-direction: column; gap: 12px;
  scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent;
}

.p-head { display: flex; align-items: center; gap: 12px; }
.p-head-t { min-width: 0; }
.p-title { margin: 0; font: 600 20px/1.15 var(--display); overflow-wrap: anywhere; text-wrap: balance; }
.p-sub { color: var(--fg-2); font-size: 12.5px; }
.muted { margin: 0; color: var(--fg-2); font-size: 13px; }
.note { margin: 0; color: var(--fg-3); font-size: 12px; line-height: 1.35; }
.callout { padding: 9px 11px; background: var(--lamp-soft); border: 1px solid var(--line-strong); border-radius: 9px; font-size: 12.5px; }
.callout .btn { margin-top: 6px; }
.empty { display: flex; flex-direction: column; gap: 6px; }

.sec { border-top: 1px solid var(--line); padding-top: 10px; }
.tab-body > .sec:first-child { border-top: 0; padding-top: 0; }
.sec > summary {
  display: flex; align-items: center; justify-content: space-between; padding: 2px 0; border-radius: 4px;
  cursor: pointer; list-style: none;
  color: var(--fg-2); font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
}
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary .ic { transition: transform .15s; }
.sec:not([open]) > summary .ic { transform: rotate(-90deg); }
.sec-body { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }

.field { display: grid; grid-template-columns: 104px minmax(0, 1fr); align-items: center; gap: 8px; }
.field.stack, .grid2 .field, .grid3 .field { grid-template-columns: minmax(0, 1fr); gap: 4px; }
.lb { color: var(--fg-2); font-size: 12.5px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.row.tight { flex-wrap: nowrap; }
.row > select.in { width: auto; flex: 1 1 120px; }

.in {
  width: 100%; min-width: 0; padding: 5px 8px;
  background: var(--raised); border: 1px solid var(--line); border-radius: 7px; color: var(--fg);
}
.in:hover { border-color: var(--line-strong); }
.in:focus-visible { outline: 2px solid var(--lamp); outline-offset: 0; border-color: transparent; }
.in.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.in.color { width: 38px; height: 28px; padding: 2px; flex: none; cursor: pointer; }
.in.area { resize: vertical; min-height: 60px; line-height: 1.35; }
.in.mono { font: 11.5px/1.4 var(--mono); }
.in::placeholder { color: var(--fg-3); }
.rg { width: 100%; margin: 0; accent-color: var(--lamp); }
.ck { accent-color: var(--lamp); width: 15px; height: 15px; margin: 0; flex: none; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 11px;
  background: var(--raised); border: 1px solid var(--line-strong); border-radius: 8px;
  color: var(--fg); font-size: 13px; font-weight: 600; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--hover); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--lamp); border-color: var(--lamp); color: var(--on-lamp); }
.btn.primary:hover:not(:disabled) { background: var(--lamp); filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.small { padding: 3px 9px; font-size: 12.5px; }

.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; max-width: 100%; padding: 2px; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; width: fit-content; }
.seg-b { padding: 3px 9px; background: none; border: 0; border-radius: 6px; color: var(--fg-2); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.seg-b:hover { color: var(--fg); }
.seg-b.on { background: var(--lamp); color: var(--on-lamp); }
.field.tight .seg-b { padding: 3px 6px; }       /* cinco opções numa linha só, na largura do painel */

.sw { position: relative; display: flex; align-items: center; gap: 9px; cursor: pointer; font-size: 13px; }
.sw input { position: absolute; left: 0; top: 50%; width: 32px; height: 18px; margin: -9px 0 0; opacity: 0; cursor: pointer; }
.sw-track { position: relative; flex: none; width: 32px; height: 18px; border-radius: 9px; background: var(--line-strong); transition: background .12s; }
.sw-track::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: transform .12s; }
.sw input:checked + .sw-track { background: var(--lamp); }
.sw input:checked + .sw-track::after { transform: translateX(14px); background: var(--on-lamp); }
.sw input:focus-visible + .sw-track { outline: 2px solid var(--lamp); outline-offset: 2px; }
.sw.off { opacity: .5; cursor: default; }

.av {
  display: inline-grid; place-items: center; flex: none; overflow: hidden;
  border: 2px solid; border-radius: 50%; background-size: cover; background-position: center; font-weight: 700;
}
.av.sq { border-radius: 22%; }
.stack-av { display: flex; flex: none; }
.stack-av .av + .av { margin-left: -10px; }

.bars { display: flex; flex-direction: column; gap: 6px; }
.bar-row { display: flex; align-items: center; gap: 6px; }
.bar-row .bar-n { flex: 1 1 auto; min-width: 0; }
.bar-n.ro { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-v, .bar-row .in.num { width: 58px; flex: none; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.bar-sl { color: var(--fg-3); }
.bar-m { min-width: 30px; font: 12.5px var(--mono); color: var(--fg-2); white-space: nowrap; }
.bar-dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.bar-row.off .bar-n, .bar-row.off .bar-v, .bar-row.off .in.num, .bar-row.off .bar-sl { opacity: .45; }
.bar-ro { display: flex; align-items: center; gap: 8px; }
.bar-ro .bar-n { flex: 0 0 76px; }
.meter { flex: 1 1 auto; height: 9px; overflow: hidden; background: var(--raised); border: 1px solid var(--line); border-radius: 5px; }
.meter-f { display: block; height: 100%; }
/* barra abaixo de zero: a parte negativa, riscada */
.meter-f.neg { background: repeating-linear-gradient(135deg, #ff5d73 0 3px, rgba(255, 93, 115, .25) 3px 6px); }
.bar-v.neg, .hud-in.neg, .hud-m.neg, .hud-v.neg, .bar-m.neg { color: #ff8a9a; }

.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 4px;
  background: var(--raised); border: 1px solid var(--line); border-radius: 999px; color: var(--fg-2); font-size: 12.5px;
}
.chip:hover:not(:disabled) { border-color: var(--line-strong); color: var(--fg); }
.chip.on { border-color: var(--lamp); background: var(--lamp-soft); color: var(--fg); }
.chip:disabled { cursor: default; }
.chip-i { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; color: #fff; }

.card { display: flex; flex-direction: column; gap: 8px; padding: 9px; border: 1px solid var(--line); border-radius: 9px; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.thumbs { display: flex; flex-wrap: wrap; gap: 5px; }
.thumb { width: 34px; height: 34px; padding: 0; border: 1px solid var(--line-strong); border-radius: 50%; background-color: var(--raised); background-size: cover; background-position: center; }
.thumb:hover { border-color: var(--lamp); }
.bg-prev { flex: none; width: 58px; height: 40px; border: 1px solid var(--line-strong); border-radius: 6px; background-size: cover; background-position: center; }

.turn-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.turn-head > div:first-child { min-width: 0; }
.round { font: 600 24px/1.1 var(--display); }
.turns, .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.turn { display: flex; align-items: center; gap: 4px; padding: 4px 4px 4px 5px; border: 1px solid var(--line); border-radius: 9px; }
.turn.cur { border-color: var(--lamp); background: var(--lamp-soft); }
.turn-m { display: flex; align-items: center; gap: 7px; flex: 1 1 auto; min-width: 0; padding: 2px; background: none; border: 0; border-radius: 6px; text-align: left; }
.turn-m:disabled { cursor: default; }
/* nome, marca "vez", número do turno ("· 2º turno") e detalhe da rolagem: numa linha quando cabem; quando não,
   quebram entre si, e nenhum espreme o nome */
.turn-t { display: flex; flex-wrap: wrap; align-items: baseline; gap: 1px 4px; flex: 1 1 auto; min-width: 0; line-height: 1.25; }
.turn-n { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.turn-t .turn-now { order: 1; align-self: center; }
.turn-k { order: 2; color: var(--fg-2); font-size: 11.5px; white-space: nowrap; }
.turn-r { order: 3; color: var(--fg-3); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.turn-d { width: 22px; height: 28px; }
/* a iniciativa que o jogador rolou pela mesa ao vivo: um clique anota */
.turn-mesa { display: inline-flex; align-items: center; gap: 2px; flex: none; height: 24px; padding: 0 7px 0 4px; border-radius: 999px; border: 1px solid var(--lamp); background: var(--lamp-soft); color: var(--lamp-ink); font: 600 12.5px var(--mono); }
.turn-mesa:hover { filter: brightness(1.08); }
.turn-now { flex: none; padding: 1px 7px; border-radius: 999px; background: var(--lamp); color: var(--on-lamp); font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.turn .in.num { width: 54px; flex: none; text-align: right; }
.turn-i { flex: none; width: 34px; text-align: right; font: 13px var(--mono); color: var(--fg-2); }
.turn-a { display: inline-flex; flex: none; }
.turn-a .ib { width: 22px; height: 28px; }

.fx-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
.fx-card {
  display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 4px 6px;
  background: var(--raised); border: 1px solid var(--line); border-radius: 10px;
  color: var(--fg-2); font-size: 12px; font-weight: 600; text-align: center; line-height: 1.2;
}
.fx-card:hover { border-color: var(--line-strong); color: var(--fg); }
.fx-card.on { border-color: var(--lamp); background: var(--lamp-soft); color: var(--fg); }
.fx-thumb { width: 56px; height: 56px; border-radius: 50%; background: #262c36; }
.fx-thumb.big { width: 44px; height: 44px; flex: none; }

.li { display: flex; align-items: center; gap: 6px; padding: 3px 4px 3px 6px; border: 1px solid var(--line); border-radius: 8px; }
.li.on { border-color: var(--lamp); }
.li-m { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; padding: 4px 2px; background: none; border: 0; border-radius: 5px; text-align: left; }
.li-m:disabled { cursor: default; }
.li-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.li-n { font-weight: 600; white-space: nowrap; }
.li-s { color: var(--fg-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* efeito com "Reaplicar": o botão vem numa segunda linha, alinhado com o nome */
.li.li2 { flex-direction: column; align-items: stretch; gap: 3px; padding-bottom: 5px; }
.li-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.li-x { display: flex; min-width: 0; padding-left: 20px; }
.btn.re { min-width: 0; max-width: 100%; }
.btn.re > span { overflow: hidden; text-overflow: ellipsis; }
.li.player .in:not(.color) { flex: 1 1 auto; }
.li.player .li-s { flex: none; }
.li.player .li-n { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; padding-left: 2px; }

/* ---- Menus e janelas ---- */
.menu {
  position: fixed; z-index: 50; min-width: 210px; max-width: min(320px, calc(100% - 16px)); max-height: calc(100% - 16px); overflow-y: auto;
  padding: 5px; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow);
}
.menu-h { padding: 5px 9px 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-3); font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.menu-i { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 9px; background: none; border: 0; border-radius: 6px; text-align: left; font-size: 13px; }
.menu-i:hover:not(:disabled), .menu-i:focus-visible { background: var(--hover); }
.menu-i:disabled { opacity: .4; cursor: default; }
.menu-i.danger { color: var(--danger); }
.menu-ck { display: inline-grid; place-items: center; flex: none; width: 16px; height: 16px; color: var(--lamp-ink); }
.menu-l { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-k { color: var(--fg-3); font: 11.5px var(--mono); }
.menu-sep { height: 1px; margin: 4px 6px; background: var(--line); }

.scrim { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: var(--scrim); }
.modal {
  width: min(430px, 100%); max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
  padding: 18px 20px 16px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: var(--shadow);
}
.modal.wide { width: min(580px, 100%); }
.modal-t { margin: 0; font: 600 23px/1.15 var(--display); text-wrap: balance; }
.modal-p { margin: 0; color: var(--fg-2); font-size: 13.5px; overflow-wrap: anywhere; }
.modal-a { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding-top: 4px; }
/* lista para marcar (as cenas do navegador que vão para a mesa) */
.picks { display: flex; flex-direction: column; gap: 4px; max-height: min(46vh, 340px); overflow-y: auto; padding: 2px; }
.pick { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); cursor: pointer; }
.pick input { flex: none; width: 16px; height: 16px; accent-color: var(--lamp); }
.pick-n { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-s { margin-left: auto; flex: none; color: var(--fg-3); font-size: 12px; white-space: nowrap; }
.keys { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 14px; margin: 0; font-size: 13px; }
.keys dt, .keys dd { margin: 0; }
.keys dd { color: var(--fg-2); }
kbd { padding: 1px 6px; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 5px; font: 12px var(--mono); white-space: nowrap; }

/* ---- Barras: opções e pontos ---- */
.bar-dot.pt { border-radius: 50%; }
.bar-more { width: 26px; height: 26px; }
.bar-pips { padding: 0 0 2px 16px; }
.bar-pips.full { padding-left: 37px; }
.bar-opt { display: flex; flex-direction: column; gap: 8px; margin: 0 0 6px 7px; padding: 4px 0 4px 12px; border-left: 2px solid var(--line-strong); }
/* Sobrevida: pontos por cima de uma barra */
.bar-xb.tem { color: var(--sobre); }
.bar-x { display: flex; align-items: center; gap: 8px; margin: -2px 0 2px 16px; padding: 3px 8px; border-left: 2px solid var(--sobre); font-size: 12.5px; color: var(--fg-2); }
.bar-x.full { margin-left: 37px; }
.bar-x .in.num { width: 58px; flex: none; text-align: right; font-family: var(--mono); }
.bar-x-l { font-weight: 600; color: var(--fg); }
.bar-x-n { color: var(--fg-3); }

.pips { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; vertical-align: middle; }
.pip { display: block; flex: none; width: 16px; height: 16px; padding: 0; border: 2px solid var(--c); border-radius: 50%; background: transparent; }
.pip.on { background: var(--c); }
button.pip:hover { outline: 2px solid var(--lamp); outline-offset: 1px; }
.hud .pip { width: 14px; height: 14px; }
.hud .pips { gap: 3px; flex-wrap: nowrap; }

/* ---- Condições ativas: contador e duração ---- */
.cact { display: grid; grid-template-columns: minmax(0, 1fr) auto 54px 24px; align-items: center; gap: 5px 8px; }
.cact.ro { grid-template-columns: minmax(0, 1fr) auto auto; }
.cact-h, .cact-r { display: contents; }
.cact-h > span { color: var(--fg-3); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-align: center; }
.cact-h > span:first-child { text-align: left; }
.cact-n { display: flex; align-items: center; gap: 7px; min-width: 0; }
.cact-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 600; }
.cact-x { width: 24px; height: 24px; }
.stp { display: inline-flex; align-items: center; gap: 1px; padding: 1px; background: var(--raised); border: 1px solid var(--line); border-radius: 7px; }
.field > .stp { justify-self: start; }
.loose { display: flex; flex-direction: column; gap: 10px; }
.stp-b { display: grid; place-items: center; flex: none; width: 24px; height: 24px; padding: 0; background: none; border: 0; border-radius: 5px; color: var(--fg-2); }
.stp-b:hover:not(:disabled) { background: var(--hover); color: var(--fg); }
.stp-b:disabled { opacity: .3; cursor: default; }
.stp-v { min-width: 22px; text-align: center; font: 600 13px var(--mono); font-variant-numeric: tabular-nums; }
.stp-v.ro { color: var(--fg-2); }
.in.cnt { width: 54px; padding: 4px; text-align: center; }
.opts .in.cnt { width: 52px; }
.cpick { display: flex; flex-direction: column; gap: 12px; }
/* ferimentos do personagem, no painel do token */
.ferl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.ferl-i { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; line-height: 1.35; color: var(--fg-2); }
.ferl-d { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #86754a; transform: translateY(-1px); }
.ferl-i.g2 .ferl-d { background: #b0792a; }
.ferl-i.g3 .ferl-d { background: #c2473d; }
/* a bolsa do personagem, aberta pelo token */
.bag { display: flex; flex-direction: column; gap: 14px; max-height: min(60vh, 520px); overflow: auto; padding-right: 2px; }
.bag-g { display: flex; flex-direction: column; gap: 6px; }
.bag-h { font: 600 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); }
.bag-r { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); }
.bag-r.sem .bag-n, .bag-r.sem .bag-q { color: var(--fg-3); }
.bag-l { display: flex; align-items: center; gap: 10px; }
.bag-n { flex: 1 1 auto; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.bag-q { flex: none; font: 600 13px var(--mono); color: var(--fg-2); }
.bag-d { color: var(--fg-2); font-size: 12.5px; line-height: 1.35; white-space: pre-wrap; overflow-wrap: anywhere; }
.bag-c { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--lamp); border-radius: 8px; background: color-mix(in srgb, var(--lamp) 12%, transparent); font-size: 13px; }
.bag-ct { flex: 1 1 220px; }

.hud-c { display: inline-flex; align-items: center; gap: 1px; padding: 2px; background: var(--raised); border: 1px solid var(--line); border-radius: 999px; }
.hud-c.one, .hud-c.ro { padding: 3px; }
.hud-c.one:hover { border-color: var(--fg-3); }
.hud-c .stp-b { width: 22px; height: 22px; border-radius: 50%; }
.hud-c .stp-v { min-width: 18px; padding: 0 1px 0 4px; }
.hud-c.ro .stp-v { padding: 0 6px 0 5px; }

/* ---- Legenda do véu do mestre: no canto de baixo do mapa, acima da linha de estado, enquanto o véu está ligado.
        Fica no fluxo da base do mapa, então nunca cobre as opções da ferramenta nem a faixa de vez. ---- */
.veilchip {
  max-width: 100%; display: flex; align-items: center; gap: 7px; padding: 2px 2px 2px 10px; pointer-events: auto;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px;
  color: var(--fg-2); font-size: 12.5px;
}
.veilchip > .ic { color: var(--lamp-ink); }
.veilchip-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.veilchip-x { width: 24px; height: 24px; border-radius: 50%; }

/* ---- Faixa "vez de…" ---- */
.turnb {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 2;
  width: max-content; max-width: calc(100% - 24px);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 9px; padding: 6px 6px 6px 10px;
  background: var(--surface); border: 1px solid var(--lamp); border-radius: 11px; box-shadow: var(--shadow); font-size: 13.5px;
}
.opts:not([hidden]) ~ .turnb { top: 60px; }
.turnb-t { white-space: nowrap; }
.turnb-c { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 3px; background: var(--raised); border: 1px solid var(--line); border-radius: 999px; color: var(--fg-2); font-size: 12.5px; white-space: nowrap; }
.turnb-x { width: 24px; height: 24px; }

/* ---- Janelas: barras padrão e aplicar em área ---- */
.bd, .area { display: flex; flex-direction: column; gap: 10px; }
.bd-list { display: grid; grid-template-columns: auto 38px minmax(0, 1fr) 66px auto 32px; align-items: center; gap: 6px; }
.bd-row { display: contents; }
.bd-row > :first-child { grid-column: 1; }      /* cada barra começa numa linha nova da grade */
.bd-h > span { color: var(--fg-3); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.bd-row .ck { justify-self: center; }
.bd-row .in.num { text-align: right; }
.bd-row .seg { justify-self: start; }
.bd-ck { align-self: flex-start; }
.area-top { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 10px; }
.area-top .bar-v { width: 100%; }
.area-bar { display: flex; align-items: center; gap: 6px; color: var(--fg-2); font-size: 12.5px; }
.area-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 236px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.area-row { display: flex; align-items: center; gap: 10px; padding: 4px 6px 4px 8px; border: 1px solid var(--line); border-radius: 9px; }
.area-row.off .area-who, .area-row.off .area-res { opacity: .5; }
.area-who { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; cursor: pointer; }
.area-n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.area-res { flex: none; font: 12.5px var(--mono); font-variant-numeric: tabular-nums; color: var(--fg-2); white-space: nowrap; }
.area-half { flex: none; width: 34px; height: 28px; padding: 0; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 7px; color: var(--fg-2); font-weight: 700; }
.area-half:hover:not(:disabled) { background: var(--hover); }
.area-half.on, .area-half.on:hover:not(:disabled) { background: var(--lamp); border-color: var(--lamp); color: var(--on-lamp); }
.area-half:disabled { opacity: .35; cursor: default; }

/* ---- Tutorial: um destaque por vez ---- */
.tour { position: fixed; inset: 0; z-index: 90; }
.tour-hole {
  position: absolute; border-radius: 12px; pointer-events: none;
  box-shadow: 0 0 0 200vmax var(--scrim); outline: 2px solid var(--lamp); outline-offset: 0;
  transition: left .2s ease, top .2s ease, width .2s ease, height .2s ease;
}
.tour-hole.none { left: 50%; top: 50%; width: 0; height: 0; outline-color: transparent; }
.tour-card {
  position: absolute; left: 12px; top: 12px; width: min(350px, calc(100% - 24px)); display: flex; flex-direction: column; gap: 9px;
  padding: 16px 18px 14px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: var(--shadow);
}
.tour-n { color: var(--fg-3); font: 12px var(--mono); }
.tour-t { margin: 0; font: 600 22px/1.15 var(--display); text-wrap: balance; }
.tour-p { margin: 0; color: var(--fg-2); font-size: 14px; line-height: 1.45; text-wrap: pretty; }
.tour-a { display: flex; align-items: center; gap: 8px; padding-top: 4px; }
.tour-skip { padding: 4px 2px; background: none; border: 0; border-radius: 5px; color: var(--fg-2); font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }
.tour-skip:hover { color: var(--fg); }

/* ---- Combate: a janelinha de atributos (F), a disputa (C), o ataque com defesa e o grupo ---- */
/* A janelinha fica ao lado do token e não empurra nada: é uma folha solta por cima do mapa. */
.pop {
  position: fixed; z-index: 45; width: 252px; max-width: calc(100% - 16px); display: flex; flex-direction: column; gap: 8px;
  padding: 10px; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow);
}
.pop:focus, .pop:focus-visible { outline: none; }      /* (o foco vai para a folha inteira ao abrir; a borda dela já a destaca) */
.pop-h { display: flex; align-items: center; gap: 8px; }
.pop-n { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.pop-f, .pop-v { display: flex; align-items: center; gap: 8px; }
.pop-f .in.num, .pop-v .in.num { width: 76px; flex: none; }
.pop-l { color: var(--fg-2); font-size: 12.5px; white-space: nowrap; }
.pop-c { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.pop-c .chip { padding: 2px 8px; font: 600 12px var(--mono); }
.pop-g { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.pop-b {
  display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; padding: 5px 2px 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: var(--fg);
}
.pop-b small { color: var(--fg-3); font-size: 10px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
.pop-b b { font: 600 14px var(--mono); font-variant-numeric: tabular-nums; }
.pop-b:hover:not(:disabled) { background: var(--hover); border-color: var(--lamp); }
.pop-b:disabled { opacity: .4; cursor: default; }
.pop-r { display: flex; align-items: baseline; flex-wrap: wrap; gap: 3px 8px; padding: 6px 9px; background: var(--lamp-soft); border-radius: 8px; font-size: 13px; }
.pop-r small { color: var(--fg-2); font: 12px var(--mono); }
.pop-r.erro { background: none; border: 1px solid var(--line-strong); color: var(--fg-2); }
.pop-tot { font: 700 20px/1 var(--mono); color: var(--lamp-ink); font-variant-numeric: tabular-nums; }

/* a fixa de cada turno, no painel do token */
.fixas { display: flex; flex-wrap: wrap; gap: 6px 10px; }
.fixa-t { display: inline-flex; align-items: center; gap: 5px; color: var(--fg-2); font-size: 12.5px; }

.dis { display: flex; flex-direction: column; gap: 12px; }
.dis-2 { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: start; }
.dis-l { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.dis-t { color: var(--fg-3); font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.dis-x { align-self: center; color: var(--fg-3); font: 600 20px var(--display); }
.dis-r { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; background: var(--lamp-soft); border: 1px solid var(--line-strong); border-radius: 10px; }
.dis-n { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font: 600 17px var(--mono); font-variant-numeric: tabular-nums; color: var(--fg-2); }
.dis-n .v { color: var(--fg); }
.dis-n .dis-x { align-self: auto; font-size: 15px; }
.dis-v { font-weight: 700; }
.dis-d { color: var(--fg-2); font: 12px var(--mono); }

.area.atq { display: flex; flex-direction: column; gap: 10px; }
.atq-top { display: grid; grid-template-columns: 96px minmax(0, 1fr) minmax(0, 1.2fr); gap: 10px; }
.atq-top .bar-v { width: 100%; }
.atq-defs { align-items: center; }
.atq-defs .chip { padding: 3px 9px; font-size: 12.5px; }
.atq-sep { width: 1px; height: 18px; margin: 0 3px; background: var(--line-strong); }
.atq-modo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.atq-mm { display: grid; grid-template-columns: 96px 96px minmax(0, 1fr); gap: 10px; align-items: end; }
.atq-ped { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.atq-list { max-height: 268px; }
.atq-row { flex-direction: column; align-items: stretch; gap: 4px; }
.atq-1 { display: flex; align-items: center; gap: 10px; min-width: 0; }

     7. Render ...... desenho no canvas
     8. Tools ....... ferramentas e gestos de mouse e teclado

    10. Tour ........ tutorial de primeiro uso
    11. Boot ........ cena de exemplo e inicialização

   da interface. A costura de sincronização é Store.on('commit'), que
   entrega a lista de operações de cada alteração (uma linha por objeto:
   tokens, shapes, walls, lights, effects, fogOps; e os campos da cena).

   O que mora onde, pensando nas tabelas:
     - cena ....... grade, luz, névoa, permissões, turn (ordem de turnos: cada

     - desenho .... k: free | line | rect | ell | poly | text; com ter = { t, h } é uma

     - parede ..... k: wall | door | window | veil; porta secreta = door + secret

// os valores que sobrariam na divisão (sem isso, alguns números sairiam um nada mais que os outros).
// Sem crypto, cai no Math.random.
function rollDie(n) {
  n = Math.max(1, Math.floor(n) || 1);
  const c = typeof crypto !== 'undefined' && crypto && typeof crypto.getRandomValues === 'function' ? crypto : null;
  if (c) {
    try {
      const lim = Math.floor(4294967296 / n) * n, buf = new Uint32Array(1);

  return 1 + Math.floor(Math.random() * n);

function icon(name, size = 18) {
  const def = ICONS[name] || ICONS.help;
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('class', 'ic');
  const p = document.createElementNS(SVGNS, 'path');
  p.setAttribute('d', def.d || def);
  if (def.fill) { p.setAttribute('fill', 'currentColor'); p.setAttribute('stroke', 'none'); }
  else {
    p.setAttribute('fill', 'none'); p.setAttribute('stroke', 'currentColor');
    p.setAttribute('stroke-width', name === 'more' ? '2.6' : '1.8');
    p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round');
  }
  svg.append(p);
  return svg;
}
const iconPaths = {};
function iconPath(name) {
  if (!iconPaths[name]) { const def = ICONS[name]; iconPaths[name] = new Path2D(def.d || def); }

}

// Barras de fábrica de um token novo. O mestre pode trocar essa lista em "Barras padrão";
// cada token pode ter até MAX_BARS barras, em estilo barra ('bar') ou pontos ('pts').
const MAX_BARS = 8;
const BAR_DEFAULTS = [
  { n: 'Vida', c: '#d6524b', v: 10, m: 10, k: 'bar', on: true, vis: '' },
  { n: 'SP', c: '#4a9be0', v: 10, m: 10, k: 'bar', on: false, vis: '' },

const BAR_COLORS = ['#d6524b', '#4a9be0', '#e2b23e', '#6fbf73', '#b07ad9', '#e58a4e', '#4fc3c0', '#d96aa0'];
function cleanBar(b) {
  const o = b || {}, lo = barLo(o);
  return cleanBarRef({
    n: String(o.n == null ? 'Barra' : o.n).slice(0, 24) || 'Barra',
    c: /^#[0-9a-f]{6}$/i.test(o.c || '') ? o.c : BAR_COLORS[0],
    v: Math.max(-lo, Number(o.v) || 0), m: Math.max(0, Number(o.m) || 0),
    k: o.k === 'pts' ? 'pts' : 'bar',
    on: o.on !== false,
    vis: ['num', 'bar', 'none'].includes(o.vis) ? o.vis : '',     // '' = segue a regra do token
  }, o);
}
// Barra ligada a um recurso da ficha do personagem (HP, SP…): guarda de qual recurso ela é.
// Sobrevida (x): pontos por cima da barra, que absorvem o dano antes dela. Só fica guardada quando há alguma.
// Piso (lo): até quanto abaixo de zero a barra pode ir (a barra comum para em zero). Começo (st): onde a barra
// começa — é para lá que a cura total a leva, em vez do máximo. Os dois só ficam guardados quando existem.
const cleanBarRef = (b, o) => {
  if (o && typeof o.ref === 'string' && o.ref) b.ref = o.ref.slice(0, 64);
  if (o && Number(o.x) > 0) b.x = Math.round(Number(o.x) * 10) / 10;
  if (barLo(o) > 0) b.lo = barLo(o);
  if (o && o.st != null && o.st !== '' && isFinite(Number(o.st))) b.st = Math.min(b.m, Math.max(-(b.lo || 0), Math.round(Number(o.st) * 10) / 10));
  return b;
};
const barX = b => Math.max(0, Number(b && b.x) || 0);
const barLo = b => { const n = Math.round((Number(b && b.lo) || 0) * 10) / 10; return n > 0 ? Math.min(n, 999999) : 0; };
// Para onde a "cura total" leva a barra: o começo dela, ou o máximo quando ela não tem um.
const barFull = b => (b && b.st != null && isFinite(Number(b.st)) ? Number(b.st) : b.m);
const NEG_COR = '#ff5d73';                  // a cor da parte negativa de uma barra (riscada), no mapa e nos painéis
const fmtV = v => fmt(v).replace('-', '−');   // valor de barra, com o sinal de menos de verdade
// Quanto do piso uma barra negativa já gastou (0 a 1); 0 quando ela não está abaixo de zero.
const barNeg = b => (b && b.v < 0 && barLo(b) > 0 ? clamp(-b.v / barLo(b), 0, 1) : 0);
const SOBRE_COR = '#8fe3ff';                // a cor da sobrevida, no mapa e nos painéis
function barDefaults() {
  const p = typeof Store !== 'undefined' ? Store.S.prefs.barDefaults : null;
  return (Array.isArray(p) && p.length ? p : BAR_DEFAULTS).slice(0, MAX_BARS).map(cleanBar);
}

// Dano e cura em área. O que foi digitado: "12" ou "-12" tira, "+8" devolve; vazio vale 0 e texto inválido, null.
function areaAmount(text) {
  const s = String(text || '').trim().replace(/\s+/g, '').replace(',', '.');
  if (!s) return 0;
  if (!/^[+-]?\d+(\.\d+)?$/.test(s)) return null;
  return s[0] === '+' ? Number(s) : -Math.abs(Number(s));
}

/* Configuração de "aplicar em área" guardada num efeito, para o botão Reaplicar: a barra (pelo nome), o valor
   como foi digitado ("8", "-8", "+5"), a condição (com contador e rodadas) e quem ficou de fora (ids de token).
   O ½ da janela não entra: é de cada vez (quem resistiu daquela vez). Devolve null se não há o que reaplicar. */
function cleanApply(o) {
  if (!o || typeof o !== 'object') return null;
  const int = v => Math.max(0, Math.round(Number(v) || 0));
  const cond = o.cond && o.cond.id ? { id: String(o.cond.id), n: int(o.cond.n), d: int(o.cond.d) } : null;
  let amt = String(o.amt == null ? '' : o.amt).trim();
  if (!areaAmount(amt)) amt = '';                 // zero, ou algo que não é número: não há valor a reaplicar
  if (!amt && !cond) return null;
  return { bar: String(o.bar || ''), amt, cond, skip: Array.isArray(o.skip) ? o.skip.map(String) : [] };
}

function newToken(scene, x, y, extra) {

// Completa campos que possam faltar em dados importados de versões antigas.
function normalizeScene(sc) {
  const base = newScene(sc.name);
  for (const k in base) if (sc[k] === undefined) sc[k] = base[k];
  for (const k of ['bg', 'grid', 'fog', 'perms', 'turn', 'weather']) sc[k] = Object.assign({}, base[k], sc[k]);
  if (!Array.isArray(sc.turn.list)) sc.turn.list = [];
  // Entradas da ordem de turnos: as antigas ganham k = 1 (um turno por rodada) e os campos da rolagem;
  // as avulsas (sem token), o bônus próprio e o grupo.
  sc.turn.list = sc.turn.list.filter(e => e && typeof e === 'object');
  for (const e of sc.turn.list) {
    if (!e.id) e.id = uid('tn');
    if (e.init === undefined || (e.init !== null && !isFinite(e.init))) e.init = null;
    e.k = e.k >= 1 ? Math.floor(e.k) : 1;
    // o detalhe da rolagem só vale enquanto fecha com a iniciativa (dado + bônus); senão, é um valor digitado
    e.roll = e.roll && isFinite(e.roll.d) && isFinite(e.roll.b) && Number(e.roll.d) + Number(e.roll.b) === e.init ? { d: Number(e.roll.d), b: Number(e.roll.b) } : null;
    if (!e.token) { e.token = null; e.bonus = clampIni(e.bonus); e.grp = e.grp || null; }
  }
  if (!Array.isArray(sc.targets)) sc.targets = [];
  if (!TONES.some(x => x.id === sc.tone)) sc.tone = 'dia';
  for (const w of sc.walls) {
    if (!(w.k === 'door' && w.secret) && !['wall', 'door', 'window', 'veil'].includes(w.k)) w.k = 'wall';
    w.open = !!w.open; w.locked = !!w.locked; w.secret = w.k === 'door' && !!w.secret;     // janela e cortina também abrem e trancam
  }
  for (const e of sc.effects) {
    // retângulo: largura e altura próprias. Nos efeitos antigos, a caixa do tamanho que eles já tinham.
    const side = Math.max(0.5, 2 * (Number(e.r) || 1));
    if (!(e.rw > 0)) e.rw = side;
    if (!(e.rh > 0)) e.rh = side;
    e.apply = cleanApply(e.apply);
  }
  // terreno: o tipo tem de ser um dos que existem; senão, o desenho fica sendo um desenho comum
  for (const s of sc.shapes) if (s && s.ter !== undefined) { const c = cleanTer(s.ter); if (c) s.ter = c; else delete s.ter; }
  for (const t of sc.tokens) {
    const d = newToken({ tokens: [] }, t.x || 0, t.y || 0, { name: t.name });
    for (const k in d) if (t[k] === undefined) t[k] = d[k];
    t.vis = Object.assign({}, d.vis, t.vis);
    t.light = Object.assign({}, d.light, t.light);
    t.bars = (Array.isArray(t.bars) ? t.bars : barDefaults()).slice(0, MAX_BARS).map(cleanBar);
    if (!t.cinfo || typeof t.cinfo !== 'object') t.cinfo = {};
    t.ini = clampIni(t.ini); t.turns = clampTurns(t.turns);
    t.fixas = cleanFixas(t.fixas);
    t.char = typeof t.char === 'string' && t.char ? t.char : null;      // personagem da mesa ligado a este token
  }
  return sc;
}
/* ---------------------------------------------------------------
   2. STORE — estado + operações
   Toda alteração de cena passa por uma operação:
     { t:'add', c, v, i? }   inclui um objeto na coleção c
     { t:'del', c, id }      remove
     { t:'upd', c, id, p }   altera campos do objeto (p = patch raso)
     { t:'scn', p }          altera campos da própria cena
     { t:'ord', c, ids }     reordena a coleção
   Cada gesto do usuário é uma transação (begin/commit) e vira um passo
   de desfazer. Store.on('commit') recebe as operações já aplicadas:
   é ali que entra o envio para o Supabase.
   --------------------------------------------------------------- */
const Store = (() => {
  const S = { scenes: {}, order: [], current: null, players: [], assets: {}, prefs: {} };
  const hist = new Map();           // id da cena → { undo: [], redo: [] }
  const subs = {};
  let tx = null;
  const MAX_UNDO = 120;

  const on = (ev, fn) => { (subs[ev] = subs[ev] || []).push(fn); };
  const emit = (ev, a, b) => { for (const fn of subs[ev] || []) fn(a, b); };

  const scene = () => S.scenes[S.current];
  const get = (c, id) => { const sc = scene(); return sc && sc[c] ? sc[c].find(o => o.id === id) : undefined; };
  const H = () => { let x = hist.get(S.current); if (!x) { x = { undo: [], redo: [] }; hist.set(S.current, x); } return x; };

  // Aplica a operação (na cena aberta, ou na cena `em`) e devolve a operação inversa.
  function raw(op, em) {
    const sc = em || scene();
    switch (op.t) {
      case 'add': {
        const arr = sc[op.c];
        const i = op.i == null ? arr.length : clamp(op.i, 0, arr.length);
        arr.splice(i, 0, op.v);
        return { t: 'del', c: op.c, id: op.v.id };
      }
      case 'del': {
        const arr = sc[op.c];
        const i = arr.findIndex(o => o.id === op.id);
        if (i < 0) return null;
        const [v] = arr.splice(i, 1);
        return { t: 'add', c: op.c, v, i };
      }
      case 'upd': {
        const o = sc[op.c].find(x => x.id === op.id);
        if (!o) return null;
        const prev = {};
        for (const k in op.p) { prev[k] = o[k]; o[k] = op.p[k]; }
        return { t: 'upd', c: op.c, id: op.id, p: prev };
      }
      case 'scn': {
        const prev = {};
        for (const k in op.p) { prev[k] = sc[k]; sc[k] = op.p[k]; }
        return { t: 'scn', p: prev };
      }
      case 'ord': {
        const arr = sc[op.c];
        const prev = arr.map(o => o.id);
        const byId = new Map(arr.map(o => [o.id, o]));
        const next = op.ids.map(id => byId.get(id)).filter(Boolean);
        for (const o of arr) if (!op.ids.includes(o.id)) next.push(o);
        arr.length = 0; arr.push(...next);
        return { t: 'ord', c: op.c, ids: prev };
      }
    }
    return null;
  }

  function begin(label) {
    if (!tx) tx = { label: label || '', fwd: [], inv: [], idx: new Map(), scene: S.current };
    return tx;
  }
  const inTx = () => !!tx;

  function push(op) {
    const auto = !tx;
    if (auto) begin(op.label);
    // Junta alterações repetidas do mesmo objeto (arrastar gera centenas delas).
    const key = op.t === 'upd' ? op.c + ':' + op.id : op.t === 'scn' ? 'scn' : null;
    const merged = key && tx.idx.get(key);
    const inv = raw(op);
    if (inv) {
      if (merged) {
        for (const k in op.p) {
          if (!(k in merged.inv.p)) merged.inv.p[k] = inv.p[k];
          merged.fwd.p[k] = op.p[k];
        }
      } else {
        const f = op.t === 'upd' || op.t === 'scn' ? Object.assign({}, op, { p: Object.assign({}, op.p) }) : op;
        tx.fwd.push(f);
        tx.inv.unshift(inv);
        if (key) tx.idx.set(key, { fwd: f, inv });
        else tx.idx.clear();
      }
      emit('live', op, inv);         // quem escuta recebe também o estado anterior (inv)
    }
    if (auto) commit();
    return !!inv;
  }

  function commit() {
    if (!tx) return;
    const t = tx; tx = null;
    if (!t.fwd.length) return;
    const hh = H();
    hh.undo.push({ label: t.label, fwd: t.fwd, inv: t.inv });
    if (hh.undo.length > MAX_UNDO) hh.undo.shift();
    hh.redo.length = 0;
    emit('commit', { sceneId: S.current, label: t.label, ops: t.fwd, inv: t.inv });     // inv: como cada coisa estava antes
  }

  function cancel() {
    if (!tx) return;
    const t = tx; tx = null;
    for (const op of t.inv) { raw(op); emit('live', op); }
    emit('commit', { sceneId: S.current, label: '', ops: [] });
  }

  function undo() {
    if (tx) commit();
    const hh = H(); const e = hh.undo.pop();
    if (!e) return null;
    for (const op of e.inv) { raw(op); emit('live', op); }
    hh.redo.push(e);
    emit('commit', { sceneId: S.current, label: e.label, ops: e.inv, inv: e.fwd });
    return e;
  }
  function redo() {
    if (tx) commit();
    const hh = H(); const e = hh.redo.pop();
    if (!e) return null;
    for (const op of e.fwd) { raw(op); emit('live', op); }
    hh.undo.push(e);
    emit('commit', { sceneId: S.current, label: e.label, ops: e.fwd, inv: e.inv });
    return e;
  }

  return {
    S, on, emit, scene, get, begin, commit, cancel, inTx, undo, redo,
    canUndo: () => H().undo.length > 0,
    canRedo: () => H().redo.length > 0,
    add: (c, v, i) => push({ t: 'add', c, v, i }),
    del: (c, id) => push({ t: 'del', c, id }),
    upd: (c, id, p) => push({ t: 'upd', c, id, p }),
    scn: p => push({ t: 'scn', p }),
    ord: (c, ids) => push({ t: 'ord', c, ids }),
    // Operação que veio de fora (a ficha do personagem, outro aparelho): vale na hora e avisa a tela, mas não entra no desfazer.
    remote(op) {
      if (tx) commit();
      const inv = raw(op);
      if (!inv) return false;
      emit('live', op, inv);
      emit('commit', { sceneId: S.current, label: '', ops: [op], inv: [inv], remote: true });
      return true;
    },
    /* Várias operações de fora de uma vez, numa cena qualquer da mesa (a que os jogadores estão vendo pode não ser a
       que o mestre tem aberta). Na cena aberta, a tela acompanha cada uma; nas outras, só o estado muda. Avisa uma
       vez no fim. Devolve quantas valeram. */
    remoteIn(sceneId, ops) {
      const sc = S.scenes[sceneId];
      if (!sc || !ops.length) return 0;
      const aqui = sceneId === S.current, done = [], invs = [];
      if (aqui && tx) commit();
      for (const op of ops) {
        const inv = raw(op, sc);
        if (!inv) continue;
        done.push(op); invs.unshift(inv);
        if (aqui) emit('live', op, inv);
      }
      if (done.length) emit('commit', { sceneId, label: '', ops: done, inv: invs, remote: true });
      return done.length;
    },
    // Agrupa várias operações num único passo de desfazer.
    tx(label, fn) { const own = !tx; begin(label); try { fn(); } finally { if (own) commit(); } },

    /* Operações fora do desfazer: cenas, jogadores e preferências. */
    setCurrent(id) { if (tx) commit(); if (S.scenes[id]) { S.current = id; emit('scene', id); } },
    addScene(sc) { S.scenes[sc.id] = sc; S.order.push(sc.id); emit('meta', { scene: sc.id }); },
    removeScene(id) {
      delete S.scenes[id]; hist.delete(id);
      S.order = S.order.filter(x => x !== id);
      emit('meta', { removed: id });
    },
    meta(info) { emit('meta', info || {}); },
  };
})();
/* ---------------------------------------------------------------
   3. GEO — geometria pura
   --------------------------------------------------------------- */
const Geo = (() => {
  // Os dois segmentos se cruzam?
  function segHit(ax, ay, bx, by, cx, cy, dx, dy) {
    const rx = bx - ax, ry = by - ay, sx = dx - cx, sy = dy - cy;
    const den = rx * sy - ry * sx;
    if (Math.abs(den) < 1e-9) return false;
    const t = ((cx - ax) * sy - (cy - ay) * sx) / den;
    const u = ((cx - ax) * ry - (cy - ay) * rx) / den;
    return t > 1e-6 && t < 1 - 1e-6 && u >= 0 && u <= 1;
  }

  function distSeg(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const l2 = dx * dx + dy * dy;
    let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
    t = clamp(t, 0, 1);
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  }

  function distPolyline(px, py, pts, closed) {
    let best = Infinity;
    const n = pts.length / 2;
    if (n === 1) return Math.hypot(px - pts[0], py - pts[1]);
    for (let i = 0; i < n - 1; i++) best = Math.min(best, distSeg(px, py, pts[i * 2], pts[i * 2 + 1], pts[i * 2 + 2], pts[i * 2 + 3]));
    if (closed && n > 2) best = Math.min(best, distSeg(px, py, pts[(n - 1) * 2], pts[(n - 1) * 2 + 1], pts[0], pts[1]));
    return best;
  }

  function inPoly(px, py, pts) {
    let inside = false;
    const n = pts.length / 2;
    for (let i = 0, j = n - 1; i < n; j = i++) {
      const xi = pts[i * 2], yi = pts[i * 2 + 1], xj = pts[j * 2], yj = pts[j * 2 + 1];
      if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }

  function bboxPts(pts) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (let i = 0; i < pts.length; i += 2) {
      if (pts[i] < x0) x0 = pts[i]; if (pts[i] > x1) x1 = pts[i];
      if (pts[i + 1] < y0) y0 = pts[i + 1]; if (pts[i + 1] > y1) y1 = pts[i + 1];
    }
    return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }

  // Simplificação de traço (Ramer–Douglas–Peucker).
  function simplify(pts, eps) {
    const n = pts.length / 2;
    if (n < 3) return pts.slice();
    const keep = new Uint8Array(n); keep[0] = keep[n - 1] = 1;
    const stack = [[0, n - 1]];
    while (stack.length) {
      const [a, b] = stack.pop();
      let far = -1, fd = eps;
      for (let i = a + 1; i < b; i++) {
        const d = distSeg(pts[i * 2], pts[i * 2 + 1], pts[a * 2], pts[a * 2 + 1], pts[b * 2], pts[b * 2 + 1]);
        if (d > fd) { fd = d; far = i; }
      }
      if (far > 0) { keep[far] = 1; stack.push([a, far], [far, b]); }
    }
    const out = [];
    for (let i = 0; i < n; i++) if (keep[i]) out.push(Math.round(pts[i * 2] * 10) / 10, Math.round(pts[i * 2 + 1] * 10) / 10);
    return out;
  }

  /* Polígono de visão a partir de (px,py).
     segs: lista plana [x1,y1,x2,y2, ...] das paredes que bloqueiam.
     A caixa (x0,y0)-(x1,y1) limita o alcance e precisa conter a origem. */
  function visPoly(px, py, segs, x0, y0, x1, y1) {
    const S = [x0, y0, x1, y0, x1, y0, x1, y1, x1, y1, x0, y1, x0, y1, x0, y0];
    for (let i = 0; i < segs.length; i += 4) {
      const ax = segs[i], ay = segs[i + 1], bx = segs[i + 2], by = segs[i + 3];
      if (Math.max(ax, bx) < x0 || Math.min(ax, bx) > x1 || Math.max(ay, by) < y0 || Math.min(ay, by) > y1) continue;
      S.push(ax, ay, bx, by);
    }
    const seen = new Set();
    const ang = [];
    for (let i = 0; i < S.length; i += 2) {
      const key = Math.round(S[i] * 4) + ',' + Math.round(S[i + 1] * 4);
      if (seen.has(key)) continue;
      seen.add(key);
      const a = Math.atan2(S[i + 1] - py, S[i] - px);
      ang.push(a - 1e-4, a, a + 1e-4);
    }
    ang.sort((a, b) => a - b);
    const out = new Array(ang.length * 2);
    const ns = S.length;
    for (let k = 0; k < ang.length; k++) {
      const dx = Math.cos(ang[k]), dy = Math.sin(ang[k]);
      let best = Infinity;
      for (let i = 0; i < ns; i += 4) {
        const ax = S[i], ay = S[i + 1];
        const sx = S[i + 2] - ax, sy = S[i + 3] - ay;
        const den = dx * sy - dy * sx;
        if (den > -1e-12 && den < 1e-12) continue;
        const qx = ax - px, qy = ay - py;
        const t = (qx * sy - qy * sx) / den;
        if (t <= 1e-7 || t >= best) continue;
        const u = (qx * dy - qy * dx) / den;
        if (u < -1e-9 || u > 1 + 1e-9) continue;
        best = t;
      }
      if (best === Infinity) best = 0;
      out[k * 2] = px + dx * best;
      out[k * 2 + 1] = py + dy * best;
    }
    return out;
  }

  return { segHit, distSeg, distPolyline, inPoly, bboxPts, simplify, visPoly };
})();
/* ---------------------------------------------------------------
   3b. WALLS — as paredes como elas valem na hora
   Os dados salvos nunca mudam aqui. O que este módulo responde é
   "o que barra o quê agora", a partir de duas regras:
     - abertura (porta, porta secreta, janela, cortina) desenhada em
       cima de uma parede comum tira aquele trecho da parede enquanto
       existir: para a visão, para a passagem e para o traço da parede.
       Apagou a abertura, a parede volta inteira;
     - aberturas empilhadas (cortina sobre janela) não se cortam: cada
       uma vale pela própria regra, e o trecho barra se QUALQUER uma
       delas barrar.
   O resultado fica guardado por cena e é refeito quando alguma parede
   muda: o módulo escuta as operações do Store. Quem mexer nos dados
   por fora do Store chama Walls.invalidate().
   --------------------------------------------------------------- */
const Walls = (() => {
  let ver = 0, builds = 0, cache = null;
  Store.on('live', op => { if (op.c === 'walls') ver++; });

  // Tolerâncias, proporcionais ao quadrado (os números valem para o quadrado padrão de 64 px):
  // a abertura conta como "em cima" da parede se estiver alinhada com ela a até 4 px
  // e as duas se sobrepuserem de verdade por mais de 2 px ao longo da parede.
  const tolOf = cell => Math.max(1.5, cell / 16);
  const minOf = cell => Math.max(1, cell / 32);

  // Trechos [de, até, ponta, ponta], em distância ao longo da parede, que alguma abertura cobre. As duas "pontas"
  // são as pontas da própria abertura quando caem dentro da parede (null quando a abertura passa do fim dela):
  // é nelas que o resto da parede vai terminar (ver remnants).
  function cuts(w, L, ux, uy, openings, tol, min) {
    const out = [];
    // caixa da parede, com a folga da tolerância: abertura que nem chega perto sai sem fazer conta
    const x0 = (w.x1 < w.x2 ? w.x1 : w.x2) - tol, x1 = (w.x1 > w.x2 ? w.x1 : w.x2) + tol;
    const y0 = (w.y1 < w.y2 ? w.y1 : w.y2) - tol, y1 = (w.y1 > w.y2 ? w.y1 : w.y2) + tol;
    for (const o of openings) {
      if ((o.x1 < x0 && o.x2 < x0) || (o.x1 > x1 && o.x2 > x1) || (o.y1 < y0 && o.y2 < y0) || (o.y1 > y1 && o.y2 > y1)) continue;
      const ax = o.x1 - w.x1, ay = o.y1 - w.y1, bx = o.x2 - w.x1, by = o.y2 - w.y1;
      const a = ax * ux + ay * uy, b = bx * ux + by * uy;          // as pontas da abertura, ao longo da parede
      const lo = Math.max(0, Math.min(a, b)), hi = Math.min(L, Math.max(a, b));
      if (hi - lo <= min) continue;                                // só encosta na ponta, cruza ou está longe
      const pa = ax * uy - ay * ux, pb = bx * uy - by * ux;        // afastamento de cada ponta em relação à linha da parede
      const off = s => pa + (pb - pa) * (s - a) / (b - a);         // … e em qualquer ponto do trecho comum
      if (Math.abs(off(lo)) > tol || Math.abs(off(hi)) > tol) continue;
      const p1 = [o.x1, o.y1], p2 = [o.x2, o.y2], first = a <= b ? p1 : p2, last = a <= b ? p2 : p1;
      out.push([lo, hi, Math.min(a, b) > 0 ? first : null, Math.max(a, b) < L ? last : null]);
    }
    return out;
  }

  // O que sobra de uma parede comum depois de tirar os trechos cobertos: lista de [x1, y1, x2, y2].
  // Onde uma abertura corta, o resto termina NA PONTA DA ABERTURA, e não no ponto da linha da parede em frente a
  // ela: a abertura pode estar até uns 4 px fora da linha, e sem isso sobraria entre as duas uma fresta por onde
  // a visão (e um token) passaria com a porta fechada.
  function remnants(w, openings, tol, min) {
    const dx = w.x2 - w.x1, dy = w.y2 - w.y1, L = Math.hypot(dx, dy);
    const whole = [[w.x1, w.y1, w.x2, w.y2]];
    if (L < 1e-6 || !openings.length) return whole;
    const ux = dx / L, uy = dy / L;
    const cs = cuts(w, L, ux, uy, openings, tol, min);
    if (!cs.length) return whole;
    cs.sort((p, q) => p[0] - q[0]);
    const at = s => (s <= 0 ? [w.x1, w.y1] : s >= L ? [w.x2, w.y2] : [w.x1 + ux * s, w.y1 + uy * s]);
    const out = [];
    const piece = (s, e, ps, pe) => { if (e - s > tol) { const p = ps || at(s), q = pe || at(e); out.push([p[0], p[1], q[0], q[1]]); } };   // sobra menor que a tolerância não é parede
    let from = 0, fromPt = null;          // onde começa o próximo resto, e a ponta da abertura que cortou ali (se foi uma)
    for (const [lo, hi, pLo, pHi] of cs) {
      if (lo > from) piece(from, lo, fromPt, pLo);
      if (hi > from) { from = hi; fromPt = pHi; }
    }
    piece(from, L, fromPt, null);
    return out;
  }

  function build(sc) {
    const cell = sc.cell || 64, tol = tolOf(cell), min = minOf(cell);
    const openings = sc.walls.filter(isOpening);
    const d = {
      stamp: ++builds,          // muda a cada reconstrução: serve de chave para quem guarda algo derivado
      sight: [],                // [x1, y1, x2, y2, …] que barram a visão de qualquer um: restos de parede e portas fechadas
      curtains: [],             // cortinas fechadas: barram a visão, menos a de quem está encostado nelas
      sightAll: null,           // sight + todas as cortinas fechadas (luzes, e quem não está perto de nenhuma)
      move: [],                 // o que barra a passagem: restos de parede, portas e janelas fechadas
      pieces: new Map(),        // parede comum → os trechos dela que sobraram (para desenhar e para o clique)
      openings,
    };
    for (const w of sc.walls) {
      if (isOpening(w)) {
        if (wallBlocksMove(w)) d.move.push(w.x1, w.y1, w.x2, w.y2);
        if (wallBlocksSight(w)) { if (w.k === 'veil') d.curtains.push(w); else d.sight.push(w.x1, w.y1, w.x2, w.y2); }
        continue;
      }
      const pcs = remnants(w, openings, tol, min);
      d.pieces.set(w.id, pcs);

   as cenas e as imagens (em Store.S.assets, como data URL). Se o IndexedDB não estiver disponível, a mesa
   funciona só em memória e avisa.
   Com uma mesa aberta no site, quem guarda é o banco (ver 7d. NUVEM): as cenas viram documentos da mesa e
   cada imagem vira um arquivo no Storage (em Store.S.assets fica o endereço dela). Persist e Assets são a

function makeDB(name) {
  let db = null;
  function open() {
    return new Promise(res => {
      try {
        const rq = indexedDB.open(name, 1);
        rq.onupgradeneeded = () => { rq.result.createObjectStore('kv'); };
        rq.onsuccess = () => { db = rq.result; res(true); };
        rq.onerror = () => res(false);
        rq.onblocked = () => res(false);
      } catch (e) { res(false); }
    });
  }
  // Tudo o que está guardado; com um prefixo, só as chaves que começam por ele.
  function all(prefix) {
    return new Promise(res => {
      try {
        const st = db.transaction('kv', 'readonly').objectStore('kv');
        const out = new Map();
        const rq = prefix ? st.openCursor(IDBKeyRange.bound(prefix, prefix + '\uffff')) : st.openCursor();
        rq.onsuccess = () => { const c = rq.result; if (c) { out.set(c.key, c.value); c.continue(); } else res(out); };
        rq.onerror = () => res(new Map());
      } catch (e) { res(new Map()); }
    });
  }
  function write(puts, dels) {
    return new Promise(res => {
      try {
        const t = db.transaction('kv', 'readwrite');
        const st = t.objectStore('kv');
        for (const [k, v] of puts) st.put(v, k);
        for (const k of dels) st.delete(k);
        t.oncomplete = () => res(true);
        t.onerror = () => res(false);
        t.onabort = () => res(false);
      } catch (e) { res(false); }
    });
  }
  return { open, all, write, ready: () => !!db };
}

const Persist = (() => {
  const S = Store.S;
  let status = 'mem';                 // mem | ok | saving | erro
  const dScenes = new Set(), dAssets = new Set(), removed = new Set();
  let dMeta = false, onStatus = () => {};

  function setStatus(s) { if (status !== s) { status = s; onStatus(s); } }

  async function load() {
    const ok = await DB.open();
    if (!ok) { setStatus('mem'); return false; }
    setStatus('ok');
    const m = await DB.all();
    const meta = m.get('meta');
    if (!meta || !Array.isArray(meta.order)) return false;
    for (const [k, v] of m) {
      if (k.startsWith('asset:')) S.assets[v.id] = v;
      else if (k.startsWith('scene:')) S.scenes[v.id] = normalizeScene(v);
    }
    S.order = meta.order.filter(id => S.scenes[id]);
    for (const id in S.scenes) if (!S.order.includes(id)) S.order.push(id);
    S.players = Array.isArray(meta.players) ? meta.players : [];
    S.prefs = meta.prefs || {};
    S.current = S.scenes[meta.current] ? meta.current : S.order[0] || null;
    // Remove imagens que nenhuma cena usa mais.
    const used = new Set();
    for (const id in S.scenes) {
      const sc = S.scenes[id];
      if (sc.bg && sc.bg.asset) used.add(sc.bg.asset);
      for (const t of sc.tokens) if (t.img) used.add(t.img);
    }
    for (const id in S.assets) if (!used.has(id)) { delete S.assets[id]; removed.add('asset:' + id); }
    if (removed.size) save();

  }

  async function flush() {
    if (!DB.ready()) return;
    if (!dMeta && !dScenes.size && !dAssets.size && !removed.size) return;
    setStatus('saving');
    const puts = [];
    for (const id of dAssets) if (S.assets[id]) puts.push(['asset:' + id, S.assets[id]]);
    for (const id of dScenes) if (S.scenes[id]) puts.push(['scene:' + id, S.scenes[id]]);
    if (dMeta) puts.push(['meta', { v: 1, order: S.order, current: S.current, players: S.players, prefs: S.prefs }]);
    const dels = Array.from(removed);
    dScenes.clear(); dAssets.clear(); removed.clear(); dMeta = false;

  return {

    flush: () => (Nuvem.on() ? Nuvem.descarregar() : flush()),
    status: () => (Nuvem.on() ? Nuvem.estado() : status),
    onStatus(fn) { onStatus = fn; Nuvem.aoEstado(fn); },
    scene(id) { if (Nuvem.on()) { Nuvem.cena(id); return; } if (id) { dScenes.add(id); dMeta = true; save(); } },
    // O que cada um já explorou do mapa: na mesa, fica no aparelho de cada um (não vai para o banco).
    explored(id) { if (Nuvem.on()) { Nuvem.explorado(id); return; } if (id) { dScenes.add(id); dMeta = true; save(); } },
    asset(id) { if (Nuvem.on()) return; dAssets.add(id); save(); },
    meta() { if (Nuvem.on()) { Nuvem.meta(); return; } dMeta = true; save(); },
    removeScene(id) { if (Nuvem.on()) { Nuvem.tirarCena(id); return; } removed.add('scene:' + id); dMeta = true; save(); },
  };
})();

const Assets = (() => {
  const S = Store.S;
  const imgs = new Map();

  // Devolve a imagem pronta para desenhar, ou null enquanto carrega.
  function img(id) {
    if (!id) return null;

      const a = S.assets[id];
      if (!a) return null;
      im = new Image();
      im.decoding = 'async';
      if (/^https?:/.test(a.url)) im.crossOrigin = 'anonymous';      // imagem que vem do banco: sem isto o canvas fica "sujo" e não exporta
      im.onload = () => { im.ok = true; Render.request(); };
      im.src = a.url;
      imgs.set(id, im);
    }
    return im.ok ? im : null;
  }

  function decode(src) {
    return new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(new Error('Não consegui abrir essa imagem.'));
      im.src = src;
    });
  }

  function encode(cv, kind) {
    let url = '';
    try { url = cv.toDataURL('image/webp', 0.86); } catch (e) { url = ''; }
    if (!url.startsWith('data:image/webp')) url = kind === 'bg' ? cv.toDataURL('image/jpeg', 0.86) : cv.toDataURL('image/png');
    return url;
  }

  function register(url, w, hh, kind, name) {
    const id = 'img_' + hashStr(url).toString(36) + url.length.toString(36);
    if (!S.assets[id]) { S.assets[id] = { id, url, w, h: hh, kind, name: name || '' }; Persist.asset(id); }
    return S.assets[id];
  }

  // Guarda o que está num canvas: neste navegador (data URL) ou, com uma mesa aberta, no banco (arquivo no Storage).
  // É sempre uma promessa; na mesa, pode falhar (sem internet, por exemplo) e quem chamou avisa.
  async function fromCanvas(cv, kind, name) {
    if (Nuvem.on()) return Nuvem.guardarImagem(cv, kind, name);
    return register(encode(cv, kind), cv.width, cv.height, kind, name);
  }

  // Lê um arquivo de imagem, reduz se for grande demais e guarda.
  async function fromFile(file, kind) {

  }

  // Guarda uma imagem que veio num arquivo de cena: embutida (data URL) ou já guardada no banco de uma mesa
  // (endereço do Storage). Na mesa, a embutida sobe para o banco (promessa); fora, fica aqui, na hora.

  }

})();

    if (manualStale) { rebuildManual(sc); manualStale = false; }

    const cell = sc.cell, W = sc.cols * cell, H = sc.rows * cell;
    const gm = viewer === 'gm';
    const mode = sc.light, fog = sc.fog;
    const fogOn = fog.dynamic || fog.manual;
    const lit = mode !== 'claro';
    const segs = segsOf(sc);
    const B = [-cell, -cell, W + cell, H + cell];
    out.w = mw / M; out.h = mh / M;
    out.noSource = false;
    viewerSrc = [];
    const veil = gm ? veilState(sc) : null;
    let groupReady = false;                // a visão de todos os jogadores já está em cTmp2?

    // 1) Onde a luz chega. As luzes fixas só são refeitas quando paredes ou luzes mudam;
    //    as que os tokens carregam são refeitas a cada movimento.
    if (lit) {
      if (staticStale) {
        clear(cLitS); clear(cGlowS);
        for (const L of fixedLights(sc)) paintLight(L, segs, cLitS, cGlowS);
        staticStale = false;
      }
      clear(cLit); clear(cGlow);
      cLit.g.drawImage(cLitS, 0, 0); cGlow.g.drawImage(cGlowS, 0, 0);
      for (const L of tokenLights(sc)) paintLight(L, segs, cLit, cGlow);
    }

    // 2) O que cada jogador (ou o grupo) enxerga
    const vkey = gm ? null : (fog.shared ? '*' : viewer);
    let nViewer = 0;
    if (fog.dynamic) {
      // (o jogador de verdade, na mesa, só precisa da própria visão; o mestre calcula a de todos, para o "Vendo como")
      const keys = fog.shared ? ['*'] : Nuvem.jogador() ? [viewer] : Store.S.players.map(p => p.id);
      for (const key of keys) {
        const isViewer = key === vkey;
        if (!isViewer && !fog.explored) continue;
        const target = isViewer ? cVis : cTmp2;
        const n = computeVis(sc, t => ownedBy(t, key), target, B, mode, isViewer);
        if (isViewer) nViewer = n;
        groupReady = !isViewer && key === '*';
        if (fog.explored) {
          let e = expl.get(key);
          if (!e) { e = mk(mw, mh); expl.set(key, e); }
          e.g.drawImage(target, 0, 0);
          e.touched = true;
        }
      }
      if (fog.explored) saveExplored();
    } else if (!gm) {
      if (fog.manual) { clear(cVis); cVis.g.drawImage(cReveal, 0, 0); }
      for (const t of sc.tokens) {
        if (!t.vis || !t.vis.on || !ownedBy(t, vkey) || !(t.vis.dark > 0)) continue;
        const half = t.size * cell / 2;
        viewerSrc.push({ poly: null, cx: t.x + half, cy: t.y + half, dr: t.vis.dark * cell + half });
      }
    }

    // 3) Escuridão (com os buracos de luz)
    if (lit) {
      const g = cDark.g;
      clear(cDark);
      const a = mode === 'penumbra' ? 0.46 : (gm ? 0.68 : 0.9);
      g.fillStyle = `rgba(6,8,16,${a})`;
      g.fillRect(0, 0, mw, mh);
      g.globalCompositeOperation = 'destination-out';
      g.drawImage(cLit, 0, 0);
      g.setTransform(M, 0, 0, M, 0, 0);
      for (const s of viewerSrc) {
        if (!s.dr) continue;
        g.save();
        if (s.poly) { polyPath(g, s.poly); g.clip(); }
        const gr = g.createRadialGradient(s.cx, s.cy, 0, s.cx, s.cy, s.dr);

      g.globalCompositeOperation = 'source-over';

    // 4) Névoa
    if (!fogOn) { out.fog = null; out.vis = null; }
