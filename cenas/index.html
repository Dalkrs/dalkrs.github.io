const barMode = (t, b) => (isGM() || ownsTok(t) ? 'num' : (b && b.vis) || t.barVis);
// Barras de um token que aparecem para quem está olhando, com o índice original.
const barsShown = t => t.bars.map((b, i) => ({ b, i, mode: barMode(t, b) })).filter(x => x.b.on && x.b.m > 0 && x.mode !== 'none');
const shapeShown = s => isGM() || !s.gm;
const fxShown = e => isGM() || !e.gm;
// Efeito que quem está olhando pode ver: o jogador não vê (no mapa, na lista, nem pelo rótulo de duração)
// o efeito marcado como "só do mestre" nem o que está preso a um token oculto.
function fxVisible(e) {
  if (!fxShown(e)) return false;
  if (isGM() || !e.token) return true;
  const tk = Store.get('tokens', e.token);
  return !(tk && tk.hidden);
}

/* ---- Formas ---- */
const measureCtx = document.createElement('canvas').getContext('2d');
function textSize(s) {
  measureCtx.font = `600 ${s.fs}px ${FONT_UI}`;
  const lines = String(s.txt || '').split('\n');
  let w = 0;
  for (const l of lines) w = Math.max(w, measureCtx.measureText(l).width);
  return { w, h: lines.length * s.fs * 1.25 };
}
function shapeBBox(s) {
  if (s.k === 'rect' || s.k === 'ell') return { x: s.x, y: s.y, w: s.w, h: s.h };
  if (s.k === 'text') { const m = textSize(s); return { x: s.x, y: s.y, w: m.w, h: m.h }; }
  return Geo.bboxPts(s.pts);
}
function hitShape(s, x, y, tol) {
  const half = (s.sw || 0) / 2 + tol;
  switch (s.k) {
    case 'rect': {
      if (x < s.x - half || x > s.x + s.w + half || y < s.y - half || y > s.y + s.h + half) return false;
      if (s.f) return true;
      return !(x > s.x + half && x < s.x + s.w - half && y > s.y + half && y < s.y + s.h - half);
    }
    case 'ell': {
      const rx = s.w / 2, ry = s.h / 2, cx = s.x + rx, cy = s.y + ry;
      if (Math.hypot((x - cx) / (rx + half), (y - cy) / (ry + half)) > 1) return false;
      if (s.f || rx <= half || ry <= half) return true;
      return Math.hypot((x - cx) / (rx - half), (y - cy) / (ry - half)) >= 1;
    }
    case 'text': {
      const b = shapeBBox(s);
      return x >= b.x - tol && x <= b.x + b.w + tol && y >= b.y - tol && y <= b.y + b.h + tol;
    }
    case 'poly':
      if (s.f && Geo.inPoly(x, y, s.pts)) return true;
      return Geo.distPolyline(x, y, s.pts, true) <= half;
    default:
      return Geo.distPolyline(x, y, s.pts, false) <= half;
  }
}
// Patch para mover uma forma a partir do estado original s0.
function shapeMoved(s0, dx, dy) {
  if (s0.pts) return { pts: s0.pts.map((v, i) => v + (i % 2 ? dy : dx)) };
  return { x: s0.x + dx, y: s0.y + dy };
}
// Patch para encaixar a forma numa nova caixa.
function shapeScaled(s0, b0, b1) {
  if (s0.k === 'rect' || s0.k === 'ell') return { x: b1.x, y: b1.y, w: b1.w, h: b1.h };
  const sx = b0.w > 0.01 ? b1.w / b0.w : 1, sy = b0.h > 0.01 ? b1.h / b0.h : 1;
  return { pts: s0.pts.map((v, i) => (i % 2 ? b1.y + (v - b0.y) * sy : b1.x + (v - b0.x) * sx)) };
}

/* ---- Áreas: quem está dentro de uma aura ou de um efeito ---- */
const areaCtx = document.createElement('canvas').getContext('2d');
function auraShape(t, a, sc) {
  const [cx, cy, half] = tokC(t, sc);
  const R = a.r * sc.cell + half, p = new Path2D();
  if (a.k === 'quad') p.rect(cx - R, cy - R, R * 2, R * 2);
  else if (a.k === 'cone') {
    const d = rad(a.dir || 0), w = rad(clamp(a.ang || 60, 10, 340)) / 2;
    p.moveTo(cx, cy); p.arc(cx, cy, R, d - w, d + w); p.closePath();
  } else p.arc(cx, cy, R, 0, TAU);
  return p;
}
function tokensIn(path, sc) {
  return sc.tokens.filter(t => { const [cx, cy] = tokC(t, sc); return areaCtx.isPointInPath(path, cx, cy); });
}

// Número de dano ou cura que sobe do token quando uma barra muda: o nome da barra e o quanto, com sinal
// ("Vida −8", "Fé +2"). Vale para qualquer caminho que mexa numa barra, porque nasce da própria alteração.
function floatDelta(t, delta, tag, color) {
  if (!delta) return;
  App.floats.push({ id: t.id, text: (tag ? tag + ' ' : '') + (delta > 0 ? '+' : '−') + fmt(Math.abs(delta)), c: color || (delta > 0 ? '#86e8ad' : '#ff8f80'), t0: performance.now() });
  if (App.floats.length > 30) App.floats.shift();
  Render.request();
}

// O que uma aplicação guardada num efeito vai fazer, por extenso: "−8 Vida", "+5 Vida + Abençoado", "Queimando".
function applyLabel(a) {
  const parts = [], amt = a ? areaAmount(a.amt) : null;
  if (amt) parts.push((amt > 0 ? '+' : '−') + fmt(Math.abs(amt)) + ' ' + a.bar);
  if (a && a.cond && a.cond.id) parts.push((COND_BY_ID[a.cond.id] || {}).n || a.cond.id);
  return parts.join(' + ');
}
// Valor da barra depois de aplicar amt (metade arredonda para baixo). Nunca passa do máximo nem fica negativo.
// Uma barra com um remendo por cima; a sobrevida zerada sai do objeto (não fica guardada à toa).
function barWith(b, p) { const o = Object.assign({}, b, p); if (!(o.x > 0)) delete o.x; return o; }
/* Uma variação numa barra. O dano (delta negativo) gasta primeiro a sobrevida; a cura não mexe nela.
   Devolve o remendo { v } ou { v, x }. */
function barAfter(b, delta) {
  let x = barX(b), d = delta;
  if (d < 0 && x > 0) { const usa = Math.min(x, -d); x = Math.round((x - usa) * 10) / 10; d += usa; }
  const p = { v: clamp(Math.round((b.v + d) * 10) / 10, 0, Math.max(b.m, b.v)) };
  if (x !== barX(b)) p.x = x;
  return p;
}
const areaDelta = (amt, half) => (half ? Math.sign(amt) * Math.floor(Math.abs(amt) / 2) : amt);
function areaNext(b, amt, half) { return barAfter(b, areaDelta(amt, half)).v; }

/* ---- Seleção ---- */
const selHas = (c, id) => App.sel.some(s => s.c === c && s.id === id);
function setSel(list) { App.sel = list; Store.emit('sel'); }
function selOf(c) { const out = []; for (const s of App.sel) if (s.c === c) { const o = Store.get(c, s.id); if (o) out.push(o); } return out; }
// Tira da seleção o que não existe mais (apagado, desfeito, efeito que acabou). Encolher também é mudar a seleção:
// quem depende dela fica sabendo (o véu do mestre troca de "visão de Fulano" para "visão dos jogadores", e vice-versa).
function pruneSel() {
  const n = App.sel.length;
  App.sel = App.sel.filter(s => Store.get(s.c, s.id));
  if (n === App.sel.length) return false;
  Store.emit('sel');
  return true;
}

/* ---- Grade ---- */
function snapTok(sc, x, y, size, free) {
  const st = size < 1 ? sc.cell / 2 : sc.cell;
  const nx = free ? x : snapTo(x, st), ny = free ? y : snapTo(y, st);
  return [clamp(nx, 0, Math.max(0, sceneW(sc) - size * sc.cell)), clamp(ny, 0, Math.max(0, sceneH(sc) - size * sc.cell))];
}
function snapPt(sc, x, y, free, step) {
  if (free) return [x, y];
  const st = sc.cell * (step || 0.5);
  return [snapTo(x, st), snapTo(y, st)];
}
function gridDist(sc, ax, ay, bx, by) {
  const dx = Math.abs(bx - ax) / sc.cell, dy = Math.abs(by - ay) / sc.cell;
  return sc.grid.diag === 'eucl' ? Math.hypot(dx, dy) : Math.max(dx, dy);
}
const distLabel = (sc, q) => `${fmt(q)} q · ${fmt(q * sc.grid.unit)} ${sc.grid.unitName}`;

// Interpreta o que foi digitado numa barra: "12" define, "+5" e "-8" somam.
function parseBar(text, cur, max) {
  const s = String(text).trim().replace(/\s+/g, '').replace(',', '.');
  if (/^[+-]\d+(\.\d+)?$/.test(s)) return clamp(Math.round((cur + Number(s)) * 10) / 10, 0, Math.max(max, cur));
  if (/^\d+(\.\d+)?$/.test(s)) return Number(s);
  return null;
}

/* ---- Ordem de turnos: apoio ----
   Cada entrada: { id, token | null, name, init, roll, k } e, nas avulsas (sem token), { bonus, grp }.
     k ...... qual dos turnos daquele combatente na rodada (1, 2…): um chefe com "turnos por rodada" 2 tem duas
              entradas, k = 1 e k = 2, cada uma com a própria iniciativa;
     roll ... { d, b } da última rolagem (dado e bônus), para mostrar "17 (12 + 5)"; null se o valor foi digitado;
     grp .... o que une as entradas de um mesmo combatente avulso. */
const turnEntry = (t, k) => ({ id: uid('tn'), token: t.id, name: t.name, init: null, roll: null, k });
const turnGroup = e => (e.token ? 't:' + e.token : e.grp ? 'g:' + e.grp : 'e:' + e.id);
// Rótulo de uma entrada: o nome puro no primeiro turno; "Nome · 2º turno" nos outros.
const turnLabel = (e, name) => ((e.k || 1) > 1 ? `${name} · ${e.k}º turno` : name);
const turnName = e => { const t = e.token ? Store.get('tokens', e.token) : null; return turnLabel(e, t ? tokName(t) : e.name); };
// Bônus de iniciativa de uma entrada: o do token dela, ou o da própria entrada avulsa.
function turnBonus(e) {
  if (!e.token) return clampIni(e.bonus);
  const t = Store.get('tokens', e.token);
  return t ? clampIni(t.ini) : 0;
}
const rollText = (d, b) => `${d} ${b < 0 ? '−' : '+'} ${Math.abs(b)}`;        // "12 + 5", "12 − 2"
// Ordena por iniciativa, a maior primeiro; quem não tem fica no fim. Empate: maior bônus; depois, a ordem em que já estavam.
function turnSort(list) {
  const rows = list.map((e, i) => ({ e, i, v: e.init == null || !isFinite(e.init) ? -Infinity : Number(e.init), b: turnBonus(e) }));
  rows.sort((p, q) => (p.v === q.v ? 0 : q.v - p.v) || (q.b - p.b) || (p.i - q.i));
  for (let i = 0; i < rows.length; i++) list[i] = rows[i].e;
  return list;
}
// Renumera os turnos de cada combatente (1º, 2º…), mantendo a ordem em que já estavam numerados.
function turnRenumber(list) {
  const groups = new Map();
  for (const e of list) { const g = turnGroup(e); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(e); }
  for (const g of groups.values()) { g.sort((p, q) => (p.k || 1) - (q.k || 1)); g.forEach((e, i) => { e.k = i + 1; }); }
}
// Se a entrada de quem estava jogando saiu da ordem, a vez passa para a seguinte (ou para a primeira, se era a última).
function turnKeepCur(tn, before) {
  if (tn.list.some(e => e.id === tn.cur)) return;
  const i = before.findIndex(e => e.id === tn.cur);
  let next = null;
  for (let j = i + 1; i >= 0 && j < before.length && !next; j++) next = tn.list.find(e => e.id === before[j].id) || null;
  tn.cur = next ? next.id : tn.list.length ? tn.list[0].id : null;
}

/* ---- Ações usadas por ferramentas, menus e painéis ---- */
const Act = {
  barSet(t, i, text) {
    const b = t.bars[i];
    const s = String(text).trim().replace(/\s+/g, '').replace(',', '.');
    let p;
    if (/^[+-]\d+(\.\d+)?$/.test(s)) p = barAfter(b, Number(s));           // "+5" e "-8": o dano gasta primeiro a sobrevida
    else { const v = parseBar(text, b.v, b.m); if (v == null) return false; p = { v }; }
    if (p.v === b.v && p.x === undefined) return false;
    Store.tx('Alterar ' + b.n, () => Store.upd('tokens', t.id, { bars: t.bars.map((x, j) => (j === i ? barWith(x, p) : x)) }));
    return true;
  },
  // Sobrevida de uma barra: pontos por cima dela, que absorvem o dano primeiro. Zero tira.
  barExtra(t, i, value) {
    const b = t.bars[i]; if (!b) return false;
    const x = Math.max(0, Math.round((Number(value) || 0) * 10) / 10);
    if (x === barX(b)) return false;
    Store.tx('Sobrevida de ' + b.n, () => Store.upd('tokens', t.id, { bars: t.bars.map((o, j) => (j === i ? barWith(o, { x }) : o)) }));
    return true;
  },
  // Cura total: enche todas as barras em uso de cada token. Devolve quantos tokens mudaram.
  fullHeal(tokens) {
    let n = 0;
    Store.tx('Cura total', () => {
      for (const t of tokens) {
        let mudou = false;
        const bars = t.bars.map(b => { if (!b.on || !(b.m > 0) || b.v >= b.m) return b; mudou = true; return Object.assign({}, b, { v: b.m }); });
        if (mudou) { Store.upd('tokens', t.id, { bars }); n++; }
      }
    });
    return n;
  },
  barPatch(t, i, patch) {
    Store.tx('Alterar barra', () => Store.upd('tokens', t.id, { bars: t.bars.map((x, j) => (j === i ? Object.assign({}, x, patch) : x)) }));
  },
  barAdd(t) {
    if (t.bars.length >= MAX_BARS) return false;
    const used = t.bars.map(b => b.c);
    const c = BAR_COLORS.find(x => !used.includes(x)) || BAR_COLORS[t.bars.length % BAR_COLORS.length];
    Store.tx('Adicionar barra', () => Store.upd('tokens', t.id, { bars: t.bars.concat({ n: 'Barra ' + (t.bars.length + 1), c, v: 10, m: 10, k: 'bar', on: true, vis: '' }) }));
    return true;
  },
  barDel(t, i) {
    Store.tx('Remover barra', () => Store.upd('tokens', t.id, { bars: t.bars.filter((_, j) => j !== i) }));
  },

  condToggle(tokens, id) {
    const allOn = tokens.every(t => t.conds.includes(id));
    Store.tx('Condição', () => {
      for (const t of tokens) {
        const has = t.conds.includes(id);
        if (allOn && has) {
          const info = Object.assign({}, t.cinfo); delete info[id];
          Store.upd('tokens', t.id, { conds: t.conds.filter(c => c !== id), cinfo: info });
        } else if (!allOn && !has) Store.upd('tokens', t.id, { conds: t.conds.concat(id) });
      }
    });
  },
  // Contador (n, manual) e duração (d rodadas) de uma condição ativa. Valor vazio ou zero apaga o campo.
  condSet(t, id, patch, label) {
    const info = Object.assign({}, t.cinfo);
    const cur = Object.assign({}, info[id], patch);
    for (const k of ['n', 'd', 'd0']) if (!(cur[k] > 0)) delete cur[k];
    if (Object.keys(cur).length) info[id] = cur; else delete info[id];
    Store.tx(label || 'Condição', () => Store.upd('tokens', t.id, { cinfo: info }));
  },
  // + e − do contador. Descer de 1 encerra a condição; sem contador, − não faz nada.
  condStep(t, id, delta) {
    const cur = (t.cinfo || {})[id] || {};
    const n = (cur.n || 0) + delta;
    if (n <= 0) {
      if (!cur.n) return 'none';
      Act.condToggle([t], id);
      return 'removed';
    }
    Act.condSet(t, id, { n }, 'Contador de condição');
    return 'ok';
  },

  // Dano, cura e condição em vários tokens de uma vez. rows: [{ t, half }]; text: "12" ou "-12" tira, "+8" devolve.
  // keep: { id, skip } → guarda no efeito `id`, no mesmo passo de desfazer, a configuração usada (para o Reaplicar).
  areaApply(rows, barName, text, cond, keep, label) {
    const amt = areaAmount(text);
    if (amt == null) return -1;
    let n = 0;
    Store.tx(label || 'Aplicar em área', () => {
      // (se desta vez não há o que reaplicar, o que o efeito já tinha guardado fica como está)
      const cfg = keep && Store.get('effects', keep.id) ? cleanApply({ bar: barName, amt: text, cond, skip: keep.skip }) : null;
      if (cfg) Store.upd('effects', keep.id, { apply: cfg });
      for (const r of rows) {
        const t = r.t, p = {};
        if (amt) {
          const i = t.bars.findIndex(b => b.on && b.n === barName);
          if (i >= 0) {
            const q = barAfter(t.bars[i], areaDelta(amt, r.half));
            if (q.v !== t.bars[i].v || q.x !== undefined) p.bars = t.bars.map((x, j) => (j === i ? barWith(x, q) : x));
          }
        }
        if (cond && cond.id) {
          if (!t.conds.includes(cond.id)) p.conds = t.conds.concat(cond.id);
          if (cond.n > 0 || cond.d > 0) {
            const info = Object.assign({}, t.cinfo), cur = Object.assign({}, info[cond.id]);
            if (cond.n > 0) cur.n = (cur.n || 0) + cond.n;
            if (cond.d > 0) { cur.d = cond.d; cur.d0 = cond.d; }
            info[cond.id] = cur; p.cinfo = info;
          }
        }
        if (Object.keys(p).length) { Store.upd('tokens', t.id, p); n++; }
      }
    });
    return n;
  },

  /* Reaplica, num passo de desfazer, o que este efeito aplicou da última vez (e.apply) em quem está dentro da
     área AGORA, menos quem tinha ficado de fora. Devolve { inside, n }: quantos estão dentro e quantos mudaram;
     ou null se o efeito não tem nada guardado. */
  fxReapply(e) {
    const a = e && e.apply, sc = Store.scene();
    if (!a || areaAmount(a.amt) == null) return null;
    const skip = new Set(a.skip || []);
    const rows = tokensIn(FX.geom(e, sc).path, sc).filter(t => !skip.has(t.id)).map(t => ({ t, half: false }));
    if (!rows.length) return { inside: 0, n: 0 };
    return { inside: rows.length, n: Act.areaApply(rows, a.bar, a.amt, a.cond, null, 'Reaplicar em área') };
  },

  // Mira: liga ou desliga o alvo de quem está olhando em cada token.
  targetToggle(tokens) {
    if (!can('target') || !tokens.length) return;
    const sc = Store.scene(), me = App.viewer, list = sc.targets.slice();
    const all = tokens.every(t => list.some(x => x.by === me && x.t === t.id));
    for (const t of tokens) {
      const i = list.findIndex(x => x.by === me && x.t === t.id);
      if (all && i >= 0) list.splice(i, 1);
      else if (!all && i < 0) list.push({ by: me, t: t.id });
    }
    Store.tx(all ? 'Tirar a mira' : 'Mirar', () => Store.scn({ targets: list }));
  },

  deleteSel() {
    const sc = Store.scene();
    const list = App.sel.filter(s => {
      const o = Store.get(s.c, s.id);
      if (!o) return false;
      if (isGM()) return true;
      return (s.c === 'shapes' && can('editShape', o)) || (s.c === 'effects' && can('editFx', o));
    });
    if (!list.length) return 0;
    Store.tx('Apagar', () => {
      for (const s of list) {
        if (s.c === 'tokens') {
          for (const e of sc.effects.filter(e => e.token === s.id)) Store.del('effects', e.id);
          if (sc.targets.some(x => x.t === s.id)) Store.scn({ targets: sc.targets.filter(x => x.t !== s.id) });
          if (sc.turn.list.some(e => e.token === s.id)) {
            const tn = clone(sc.turn), before = tn.list.slice();
            tn.list = tn.list.filter(e => e.token !== s.id);       // todas as entradas dele (um chefe tem mais de uma)
            turnKeepCur(tn, before);
            Store.scn({ turn: tn });
          }
        }
        Store.del(s.c, s.id);
      }
    });
    setSel([]);
    return list.length;
  },

  // Cópias com ids novos, deslocadas (dx, dy).
  cloneItems(items, dx, dy) {
    const sc = Store.scene(), made = [];
    const map = new Map();
    Store.tx('Duplicar', () => {
      for (const it of items) {
        if (it.c === 'effects') continue;
        const o = clone(it.o);
        o.id = uid(it.c.slice(0, 2));
        if (o.pts) o.pts = o.pts.map((v, i) => v + (i % 2 ? dy : dx));
        else if (it.c === 'walls') { o.x1 += dx; o.y1 += dy; o.x2 += dx; o.y2 += dy; }
        else { o.x += dx; o.y += dy; }
        if (it.c === 'tokens') {
          [o.x, o.y] = snapTok(sc, o.x, o.y, o.size, false);
          for (const a of o.auras) a.id = uid('au');
        }
        if (it.c === 'shapes') o.by = authorId();
        map.set(it.o.id, o.id);
        Store.add(it.c, o);
        made.push({ c: it.c, id: o.id });
      }
      for (const it of items) {
        if (it.c !== 'effects') continue;
        const o = clone(it.o);
        o.id = uid('fx'); o.seed = 1 + Math.floor(Math.random() * 999);
        o.by = authorId();
        if (o.token) { if (map.has(o.token)) o.token = map.get(o.token); else if (!Store.get('tokens', o.token)) o.token = null; }
        if (!o.token || !map.has(it.o.token)) { o.x += dx; o.y += dy; }
        Store.add('effects', o);
        made.push({ c: 'effects', id: o.id });
      }
    });
    return made;
  },
  selItems() {
    const out = [];
    for (const s of App.sel) {
      const o = Store.get(s.c, s.id);
      if (!o) continue;
      if (!isGM() && !((s.c === 'shapes' && can('editShape', o)) || (s.c === 'effects' && can('editFx', o)))) continue;
      out.push({ c: s.c, o });
    }
    return out;
  },
  duplicateSel() {
    const items = Act.selItems();
    if (!items.length) return;
    const c = Store.scene().cell;
    setSel(Act.cloneItems(items, c, c));
  },
  copySel() {
    const items = Act.selItems();
    if (!items.length) return 0;
    App.clip = items.map(it => ({ c: it.c, o: clone(it.o) }));
    return items.length;
  },
  pasteAt(x, y) {
    if (!App.clip.length) return 0;
    const sc = Store.scene();
    // Ancora o grupo no primeiro item copiado.
    const a = App.clip[0].o;
    const ax = a.pts ? a.pts[0] : a.x1 != null ? a.x1 : a.x, ay = a.pts ? a.pts[1] : a.y1 != null ? a.y1 : a.y;
    const items = App.clip.filter(it => isGM() || it.c === 'shapes' || it.c === 'effects');
    if (!items.length) return 0;
    // Token cai no quadrado sob o cursor; o resto, com o primeiro ponto no cursor.
    const cell = sc.cell, tok = App.clip[0].c === 'tokens';
    const dx = tok ? Math.floor(x / cell) * cell - ax : x - ax, dy = tok ? Math.floor(y / cell) * cell - ay : y - ay;
    setSel(Act.cloneItems(items, dx, dy));
    return items.length;
  },

  toFront(c, ids, front) {
    const arr = Store.scene()[c];
    const move = arr.filter(o => ids.includes(o.id)).map(o => o.id);
    const rest = arr.filter(o => !ids.includes(o.id)).map(o => o.id);
    Store.tx(front ? 'Trazer para frente' : 'Enviar para trás', () => Store.ord(c, front ? rest.concat(move) : move.concat(rest)));
  },

  // Abre ou fecha uma abertura (porta, janela ou cortina) pelo ícone dela no mapa. O mestre pode sempre;
  // o jogador precisa da permissão da cena, e a abertura não pode estar trancada.
  toggleDoor(w) {
    const nm = OPENING_NAMES[w.k] || OPENING_NAMES.door;
    if (!isGM()) {
      if (!can('doors')) { UI.toast(`O mestre não liberou abrir ${nm[1]} nesta cena.`); return; }
      if (w.locked) { UI.toast('Está trancada.'); return; }
    }
    if (w.secret) {
      // Porta secreta está sempre fechada: abrir é revelar, e ela vira uma porta comum.
      Store.tx('Revelar porta secreta', () => Store.upd('walls', w.id, { secret: false, open: true }));
      UI.toast('Porta secreta revelada e aberta.', { action: 'Desfazer', run: Tools.undo });
      return;
    }
    const open = !w.open;
    Store.tx((open ? 'Abrir ' : 'Fechar ') + nm[0], () => Store.upd('walls', w.id, { open }));
    UI.toast(nm[0][0].toUpperCase() + nm[0].slice(1) + (open ? ' aberta' : ' fechada'), { action: 'Desfazer', run: Tools.undo });
  },

  ping(x, y) {
    if (!can('ping')) return;
    App.pings.push({ x, y, t0: performance.now(), c: viewerColor(), n: viewerName() });
    if (App.pings.length > 8) App.pings.shift();
    Render.request();
  },

  /* ---- Ordem de turnos ---- */
  // Põe os tokens na ordem: uma entrada para cada turno que o token tem na rodada. Quem já está só ganha as que faltam.
  // Devolve quantos tokens ganharam entrada.
  turnAdd(tokens) {
    const sc = Store.scene(), tn = clone(sc.turn);
    let n = 0;
    for (const t of tokens) {
      const want = clampTurns(t.turns), have = tn.list.filter(e => e.token === t.id).length;
      if (have >= want) continue;
      for (let k = have + 1; k <= want; k++) tn.list.push(turnEntry(t, k));
      n++;
    }
    if (!n) return 0;
    turnRenumber(tn.list);
    if (!tn.cur && tn.list.length) tn.cur = tn.list[0].id;
    Store.tx('Adicionar aos turnos', () => Store.scn({ turn: tn }));
    return n;
  },
  // Entrada avulsa (sem token no mapa): nome, bônus de iniciativa e quantos turnos tem por rodada.
  turnLoose(name, bonus, turns) {
    const n = clampTurns(turns), grp = uid('gr'), b = clampIni(bonus);
    Act.turnPatch(x => { for (let k = 1; k <= n; k++) x.list.push({ id: uid('tn'), token: null, name, init: null, roll: null, k, bonus: b, grp }); }, 'Adicionar aos turnos');
    return n;
  },
  turnPatch(fn, label) {
    const tn = clone(Store.scene().turn), before = tn.list.slice();
    fn(tn);
    turnKeepCur(tn, before);
    Store.tx(label || 'Ordem de turnos', () => Store.scn({ turn: tn }));
  },
  // Tira UMA entrada da ordem. Se era um dos vários turnos de um token, o "turnos por rodada" dele desce junto
  // (no mesmo passo de desfazer) e os que sobram são renumerados. Devolve o token cujo número mudou, ou null.
  turnRemove(id) {
    const sc = Store.scene(), e = sc.turn.list.find(x => x.id === id);
    if (!e) return null;
    const tn = clone(sc.turn), before = tn.list.slice();
    tn.list = tn.list.filter(x => x.id !== id);
    turnRenumber(tn.list); turnKeepCur(tn, before);
    const left = e.token ? tn.list.filter(x => x.token === e.token).length : 0;
    const t = e.token && left >= 1 ? Store.get('tokens', e.token) : null;
    const lower = t && clampTurns(t.turns) !== left ? t : null;
    Store.tx('Tirar dos turnos', () => {
      if (lower) Store.upd('tokens', lower.id, { turns: left });
      Store.scn({ turn: tn });
    });
    return lower;
  },
  // Turnos por rodada de um token (1 a 4). Se ele já está na ordem, as entradas acompanham no mesmo passo de
  // desfazer: as novas entram no fim, sem iniciativa; ao diminuir, saem primeiro as de número mais alto.
  tokenTurns(t, n) {
    n = clampTurns(n);
    const sc = Store.scene(), have = sc.turn.list.filter(e => e.token === t.id);
    if (n === t.turns && (!have.length || have.length === n)) return false;
    Store.tx('Turnos por rodada', () => {
      Store.upd('tokens', t.id, { turns: n });
      if (!have.length || have.length === n) return;
      const tn = clone(sc.turn), before = tn.list.slice();
      if (have.length < n) for (let k = have.length + 1; k <= n; k++) tn.list.push(turnEntry(t, k));
      else {
        const drop = new Set(have.slice().sort((p, q) => (q.k || 1) - (p.k || 1)).slice(0, have.length - n).map(e => e.id));
        tn.list = tn.list.filter(e => !drop.has(e.id));
      }
      turnRenumber(tn.list); turnKeepCur(tn, before);
      Store.scn({ turn: tn });
    });
    return true;
  },
  /* Rola a iniciativa (1d20 + bônus) das entradas pedidas e reordena a lista, a maior primeiro. Tudo num passo
     de desfazer. A vez é guardada pelo id da entrada, então reordenar não muda de quem é a vez.
     Devolve o que saiu: [{ id, name, tokenId, d, bonus, total }], na ordem em que as entradas estavam. */
  turnRoll(ids) {
    const sc = Store.scene(), tn = clone(sc.turn), want = new Set(ids), out = [];
    for (const e of tn.list) {
      if (!want.has(e.id)) continue;
      const b = turnBonus(e), d = rollDie(20);
      e.init = d + b; e.roll = { d, b };
      out.push({ id: e.id, name: turnName(e), tokenId: e.token || null, d, bonus: b, total: d + b });
    }
    if (!out.length) return out;
    turnSort(tn.list);
    Store.tx('Rolar iniciativa', () => Store.scn({ turn: tn }));
    if (Ext.roll) {
      for (const r of out) {
        try { Ext.roll({ kind: 'iniciativa', name: r.name, tokenId: r.tokenId, d: r.d, bonus: r.bonus, total: r.total }); }
        catch (err) { console.error(err); }               // um erro de quem escuta não pode travar a mesa
      }
    }
    return out;
  },
  /* Passa a vez. Ao avançar, desconta as durações (no mesmo passo de desfazer):
     - condição com duração: perde uma rodada quando o próprio token termina a vez
       (ou na virada da rodada, se ele não estiver na ordem). Quem tem mais de um turno
       por rodada desconta uma vez só: ao terminar o primeiro deles (k = 1);
     - efeito com duração: perde uma rodada quando a vez volta para quem estava jogando
       quando ele foi criado (ou na virada da rodada, se foi criado fora de combate).
     Voltar a vez e avançar de novo não desconta duas vezes: turn.back conta quantos passos
     o mestre recuou, e só o passo que vai além do ponto mais adiantado desconta.
     As miras somem a cada troca de vez. Devolve a lista do que acabou. */
  turnStep(d) {
    const sc = Store.scene(), tn = clone(sc.turn), ended = [];
    if (!tn.list.length) return ended;
    if (!tn.on) {
      // Combate parado: o primeiro "próximo turno" só começa o combate, na vez de quem já estava marcado.
      tn.on = true; tn.back = 0;
      if (!tn.list.some(e => e.id === tn.cur)) tn.cur = tn.list[0].id;
      Store.tx('Iniciar combate', () => Store.scn({ turn: tn }));
      return ended;
    }
    let i = tn.list.findIndex(e => e.id === tn.cur);
    const from = i, fromRound = tn.round;
    const leaving = i >= 0 ? tn.list[i] : null;
    let wrapped = false, fresh = false;
    i += d;
    if (i >= tn.list.length) { i = 0; tn.round++; wrapped = true; }
    else if (i < 0) { if (tn.round > 1) { tn.round--; i = tn.list.length - 1; } else i = 0; }
    tn.cur = tn.list[i].id;
    if (d < 0 && i === from && tn.round === fromRound) return ended;     // já está no começo: nada a voltar
    if (d > 0) { if (tn.back > 0) tn.back--; else fresh = true; }
    else tn.back = (tn.back || 0) + 1;
    Store.tx(d > 0 ? 'Próximo turno' : 'Turno anterior', () => {
      const p = { turn: tn };
      if (sc.targets.length) p.targets = [];
      Store.scn(p);
      if (fresh) {
        // o turno "principal" de cada token na ordem: o de menor k (é k = 1, salvo dados estranhos)
        const firstK = new Map();
        for (const e of tn.list) if (e.token) firstK.set(e.token, Math.min(firstK.has(e.token) ? firstK.get(e.token) : Infinity, e.k || 1));
        for (const t of sc.tokens.slice()) {
          const info = t.cinfo || {};
          const ids = t.conds.filter(id => info[id] && info[id].d > 0);
          if (!ids.length) continue;
          if (!(firstK.has(t.id) ? leaving && leaving.token === t.id && (leaving.k || 1) === firstK.get(t.id) : wrapped)) continue;
          const next = Object.assign({}, info);
          let conds = t.conds;
          for (const id of ids) {
            if (info[id].d - 1 <= 0) { delete next[id]; conds = conds.filter(c => c !== id); ended.push(`${(COND_BY_ID[id] || {}).n || id} em ${t.name}`); }
            else next[id] = Object.assign({}, info[id], { d: info[id].d - 1 });
          }
          Store.upd('tokens', t.id, { cinfo: next, conds });
        }
        for (const e of sc.effects.slice()) {
          if (!(e.dur > 0)) continue;
          const anchored = !!e.at && tn.list.some(x => x.id === e.at);
          if (!(anchored ? tn.cur === e.at : wrapped)) continue;
          if (e.dur - 1 <= 0) { Store.del('effects', e.id); ended.push(`efeito ${(FX.P[e.fx] || FX.P.fogo).n}`); }
          else Store.upd('effects', e.id, { dur: e.dur - 1 });
        }
      }
    });
    return ended;
  },
};
/* ---------------------------------------------------------------
   7b. FICHAS — o token ligado à ficha do personagem
   Só existe dentro do site, com uma mesa aberta (a ponte entrega os personagens da mesa).
   O token aponta para um personagem (t.char). A ficha manda: cada recurso dela (HP, SP…) vira uma
   barra do token, com o máximo calculado pelas fórmulas e o valor atual (e a sobrevida) anotados na ficha;
   o bônus de iniciativa vem da fórmula de iniciativa da ficha, quando ela tem uma; e a imagem do
   personagem vira a imagem do token (a não ser que o mestre escolha outra para este token).
   Na volta, mexer numa dessas barras no mapa (dano, cura, área, reaplicar, desfazer) grava o valor
   atual na ficha. Também dá para rolar um atributo da ficha direto do token, com a regra da fixa.
   --------------------------------------------------------------- */
const Fichas = (() => {
  let P = null, D = null, on = false, applying = false;
  const R = () => window.TC.rules;
  const ROLAVEIS = ['FOR', 'DES', 'VIT', 'CAN', 'AGI', 'ESQ', 'FUR', 'PER', 'DFF', 'DFM'];
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase();
  const cfg = () => { const d = D && D.pegar('fichas:cfg'); return (d && d.dados && d.dados.v) || R().cfgPadrao(); };
  const get = id => (P && id ? P.pegar(id) : null);
  const chars = () => (P ? P.todas().slice().sort((a, b) => String(a.nome || '').localeCompare(String(b.nome || ''), 'pt-BR')) : []);
  const pcDe = l => Object.assign({}, l.ficha || {}, { id: l.id, nome: l.nome });
  // a imagem do personagem, quando está guardada no banco (endereço https)
  const imagemDe = l => (l && l.ficha && typeof l.ficha.img === 'string' && /^https:\/\//.test(l.ficha.img) ? l.ficha.img : null);
  // bônus dos nódulos escolhidos na árvore (a biblioteca da mesa, quando existe)
  const bib = () => { const d = D && D.pegar('arvore:biblioteca'); return d && d.dados && Array.isArray(d.dados.arvores) ? d.dados : null; };
  const extra = l => ({ arvore: R().bonusDaArvore(l.skills, bib()) });
  const resumo = l => R().resumo(pcDe(l), cfg(), extra(l), l.estado || {});

  // As barras do token, atualizadas pela ficha. Devolve null se nada muda.
  function barrasDe(t, r) {
    const bars = t.bars.map(b => Object.assign({}, b));
    let mudou = false;
    for (const rec of r.recursos) {
      if (rec.max == null || !isFinite(rec.max)) continue;
      let b = bars.find(x => x.ref === rec.id) || bars.find(x => !x.ref && norm(x.n) === norm(rec.nome));
      if (!b) {
        if (bars.length >= MAX_BARS) continue;
        b = cleanBar({ n: rec.nome, c: BAR_COLORS[bars.length % BAR_COLORS.length], v: rec.atual, m: rec.max, k: 'bar', on: true, vis: '' });
        bars.push(b); mudou = true;
      }
      const nome = String(rec.nome || 'Barra').slice(0, 24);
      if (b.ref !== rec.id) { b.ref = rec.id; mudou = true; }
      if (b.n !== nome) { b.n = nome; mudou = true; }
      if (b.m !== rec.max) { b.m = rec.max; mudou = true; }
      if (b.v !== rec.atual) { b.v = rec.atual; mudou = true; }
      const sx = Math.max(0, Number(rec.sobre) || 0);
      if (barX(b) !== sx) { if (sx > 0) b.x = sx; else delete b.x; mudou = true; }
    }
    for (const b of bars) if (b.ref && !r.recursos.some(x => x.id === b.ref)) { delete b.ref; mudou = true; }   // recurso saiu da ficha: vira barra comum
    return mudou ? bars : null;
  }
  // ficha → token (não entra no desfazer: quem manda é a ficha)
  function syncToken(t) {
    const l = get(t.char);
    if (!l) return false;
    const r = resumo(l), p = {};
    const bars = barrasDe(t, r);
    if (bars) p.bars = bars;
    if (String((l.ficha && l.ficha.ini) || '').trim() !== '' && clampIni(r.ini) !== t.ini) p.ini = clampIni(r.ini);
    // a imagem da ficha vai para o token (imgChar marca que a imagem dele é a da ficha; uma escolhida à mão fica)
    const url = imagemDe(l);
    if (url) {
      const a = Assets.register(url, 0, 0, 'token', l.nome || '');
      if (t.img !== a.id && (!t.img || t.imgChar)) { p.img = a.id; p.imgChar = true; }
      else if (t.img === a.id && !t.imgChar) p.imgChar = true;
    } else if (t.imgChar) { p.img = null; p.imgChar = false; }
    if (!Object.keys(p).length) return false;
    applying = true;
    try { Store.remote({ t: 'upd', c: 'tokens', id: t.id, p }); } finally { applying = false; }
    return true;
  }
  function syncAll(charId) {
    if (!on) return;
    let n = 0;
    for (const t of Store.scene().tokens.slice()) if (t.char && (!charId || t.char === charId) && syncToken(t)) n++;
    return n;
  }
  // token → ficha: o valor atual das barras ligadas
  function onLive(op) {
    if (!on || applying || op.t !== 'upd' || op.c !== 'tokens' || !op.p || !op.p.bars) return;
    const t = Store.get('tokens', op.id);
    if (!t || !t.char) return;
    const l = get(t.char);
    if (!l) return;
    const rec = Object.assign({}, (l.estado && l.estado.rec) || {}), sob = Object.assign({}, (l.estado && l.estado.sob) || {});
    let mudou = false;
    for (const b of t.bars) {
      if (!b.ref) continue;
      if (isFinite(b.v) && rec[b.ref] !== b.v) { rec[b.ref] = b.v; mudou = true; }
      const x = barX(b);
      if ((Number(sob[b.ref]) || 0) !== x) { if (x > 0) sob[b.ref] = x; else delete sob[b.ref]; mudou = true; }
    }
    if (!mudou) return;
    P.gravar(t.char, { estado: Object.assign({}, l.estado || {}, { rec, sob }) });
    syncAll(t.char);            // outro token do mesmo personagem nesta cena acompanha
  }
  function link(t, charId) {
    if (!charId) {
      // desligado, o token fica com o que tinha: as barras viram barras comuns e a imagem passa a ser dele
      Store.tx('Desligar da ficha', () => Store.upd('tokens', t.id, { char: null, imgChar: false, bars: t.bars.map(b => { const o = Object.assign({}, b); delete o.ref; return o; }) }));
      return;
    }
    Store.tx('Ligar à ficha', () => Store.upd('tokens', t.id, { char: charId }));
    const now = Store.get('tokens', t.id);
    if (now) syncToken(now);
  }
  // O que dá para rolar pela ficha deste token: [chave, nome, valor]
  function rolaveis(t) {
    const l = get(t.char);
    if (!l) return [];
    const pc = pcDe(l), c = R().calcular(pc, cfg(), extra(l)), fonte = (pc.rol && pc.rol.fonte) || 'total';
    return ROLAVEIS.map(k => [k, R().NOMES[k] || k, Math.max(0, Math.round(R().valorDoAtributo(c, k, fonte) || 0))]);
  }
  const fixaPadrao = t => { const l = get(t.char); return l && l.ficha && l.ficha.rol ? Math.max(0, Math.round(+l.ficha.rol.fixa || 0)) : 0; };
  // Rola um atributo da ficha com a regra da fixa: um dado de (atributo − fixa) lados, mais a fixa.
  function rolar(t, chave, fixa) {
    const item = rolaveis(t).find(x => x[0] === chave);
    if (!item) return { ok: false, error: 'Este token não está ligado a uma ficha.' };
    const valor = item[2];
    if (valor < 1) return { ok: false, error: item[1] + ' está em 0: não há o que rolar.' };
    const r = window.TC.dice.rollFixa(valor, Math.min(Math.max(0, Math.round(+fixa || 0)), valor));
    if (!r.ok) return r;
    if (Ext.roll) { try { Ext.roll({ kind: 'atributo', name: t.name, tokenId: t.id, attr: chave, attrNome: item[1], atributo: r.atributo, fixa: r.fixa, d: r.dieValue, total: r.total }); } catch (e) { console.error(e); } }
    return Object.assign({ nome: item[1] }, r);
  }

  async function start(refresh) {
    const T = window.TC;
    if (!T || !T.ponte || !T.dados || !T.rules || !T.dice) return false;
    const st = await T.ponte.pronta;
    if (!T.dados.disponivel() || st.papel !== 'mestre') return false;      // por enquanto, só o mestre liga token a ficha
    try {
      P = T.dados.col('personagens'); D = T.dados.col('documentos');
      await Promise.all([P.pronta, D.pronta]);
    } catch (e) { console.error(e); return false; }
    on = true;
    Store.on('live', onLive);
    Store.on('scene', () => syncAll());
    P.aoMudar(l => { if (!l.apagado) syncAll(l.id); refresh(); });
    D.aoMudar(l => { if (l.id === 'fichas:cfg' || l.id === 'arvore:biblioteca') { syncAll(); refresh(); } });
    syncAll();
    refresh();
    return true;
  }
  return { start, on: () => on, chars, get, link, syncAll, rolaveis, fixaPadrao, rolar, imagemDe };
})();
/* ---------------------------------------------------------------
   8. RENDER — desenho da cena no canvas
   Ordem das camadas: fundo, grade, desenhos de baixo, efeitos sem brilho,
   luz e escuridão, auras, efeitos luminosos, tokens, desenhos de cima,
   névoa, véu do mestre e, por fim, o que é só da interface (paredes do
   mestre, portas, seleção, régua, pings).
   --------------------------------------------------------------- */
const Render = (() => {
  const cv = $('#cv'), stage = $('#stage');
  const ctx = cv.getContext('2d');
  const live = document.createElement('canvas'), lctx = live.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  let dpr = 1, cw = 0, ch = 0, need = true, raf = 0, last = 0, tNow = 0, broke = false;
  let theme = { table: '#0d1017', lamp: '#e6ab4f' };
  const stats = { ms: 0, frames: 0 };       // tempo médio de desenho, para acompanhar desempenho

  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    theme = {
      table: cs.getPropertyValue('--table').trim() || '#0d1017',
      lamp: cs.getPropertyValue('--lamp').trim() || '#e6ab4f',
    };
    Vision.setVeilColor(cs.getPropertyValue('--veil').trim());      // o véu do mestre acompanha o tema
    request();
  }

  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cw = stage.clientWidth; ch = stage.clientHeight;
    const w = Math.max(1, Math.round(cw * dpr)), hh = Math.max(1, Math.round(ch * dpr));
    if (cv.width !== w || cv.height !== hh) { cv.width = w; cv.height = hh; live.width = w; live.height = hh; }
    request();
  }

  function request() { need = true; if (!raf) raf = requestAnimationFrame(frame); }

  const motion = () => App.anim && !reduce.matches;
  function animating() {
    if (App.pings.length || App.floats.length) return true;
    const sc = Store.scene();
    return !!sc && motion() && (sc.effects.length > 0 || !!(sc.weather && sc.weather.k));
  }
  function frame(ts) {
    raf = 0;
    const anim = animating();
    if (need || (anim && ts - last > 30)) {
      need = false; last = ts; tNow = ts / 1000;
      const t0 = performance.now();
      try { draw(ts); broke = false; }
      catch (err) {
        // Um erro no meio do desenho não pode deixar o mapa pela metade (sem a névoa, por exemplo):
        // zera o estado do canvas, cobre tudo e avisa uma vez só.
        cv.width = cv.width; live.width = live.width;
        ctx.fillStyle = theme.table; ctx.fillRect(0, 0, cv.width, cv.height);
        stats.fail = (stats.fail || 0) + 1;
        if (!broke) { broke = true; console.error(err); UI.toast('Não consegui desenhar o mapa. Recarregue a página; se continuar, me avise.'); }
      }
      stats.ms = stats.ms * 0.9 + (performance.now() - t0) * 0.1; stats.frames++;
    }
    if (anim || need) raf = requestAnimationFrame(frame);
  }

  function setWorld(c) {
    const v = App.view, k = dpr * v.z;
    c.setTransform(k, 0, 0, k, -v.x * k, -v.y * k);
  }

  /* ---- Câmera ---- */
  const toScreen = (x, y) => [(x - App.view.x) * App.view.z, (y - App.view.y) * App.view.z];
  function zoomAt(sx, sy, z) {
    const v = App.view;
    z = clamp(z, 0.1, 4);
    const wx = v.x + sx / v.z, wy = v.y + sy / v.z;
    v.z = z; v.x = wx - sx / z; v.y = wy - sy / z;
    request();
  }
  function fit() {
    const sc = Store.scene();
    if (!sc || cw < 10) return;
    const W = sceneW(sc), H = sceneH(sc), pad = sc.cell * 1.2;
    const z = clamp(Math.min(cw / (W + pad * 2), ch / (H + pad * 2)), 0.1, 4);
    App.view.z = z; App.view.x = W / 2 - cw / (2 * z); App.view.y = H / 2 - ch / (2 * z);
    request();
  }
  function centerOn(x, y) {
    App.view.x = x - cw / (2 * App.view.z); App.view.y = y - ch / (2 * App.view.z);
    request();
  }

  /* ---- Peças de desenho ---- */
  function rr(c, x, y, w, hh, r) {
    c.beginPath();
    if (c.roundRect) c.roundRect(x, y, w, hh, Math.min(r, w / 2, hh / 2));
    else c.rect(x, y, w, hh);
  }
  function tokPath(c, shape, cx, cy, r) {
    if (shape === 'quad') rr(c, cx - r, cy - r, r * 2, r * 2, r * 0.22);
    else { c.beginPath(); c.arc(cx, cy, r, 0, TAU); }
  }

  // Etiqueta de texto em tamanho fixo de tela.
  function label(c, text, x, y, px, opt) {
    const o = opt || {};
    const fs = (o.size || 12.5) * px;
    c.font = `600 ${fs}px ${FONT_UI}`;
    const w = c.measureText(text).width, padX = fs * 0.55, hh = fs * 1.6;
    const bx = o.align === 'left' ? x : x - w / 2 - padX;
    c.fillStyle = o.bg || 'rgba(14,17,25,0.88)';
    rr(c, bx, y - hh / 2, w + padX * 2, hh, hh * 0.35); c.fill();
    if (o.stroke) { c.strokeStyle = o.stroke; c.lineWidth = 1.2 * px; c.stroke(); }
    c.fillStyle = o.color || '#f2f4f8';
    c.textAlign = 'left'; c.textBaseline = 'middle';
    c.fillText(text, bx + padX, y + fs * 0.04);
  }

  function drawGrid(sc, px) {
    const g = sc.grid, cell = sc.cell, v = App.view;
    if (!g.on || cell * v.z < 5) return;
    const x0 = clamp(Math.floor(v.x / cell), 0, sc.cols), x1 = clamp(Math.ceil((v.x + cw / v.z) / cell), 0, sc.cols);
    const y0 = clamp(Math.floor(v.y / cell), 0, sc.rows), y1 = clamp(Math.ceil((v.y + ch / v.z) / cell), 0, sc.rows);
    ctx.beginPath();
    for (let i = x0; i <= x1; i++) { ctx.moveTo(i * cell, y0 * cell); ctx.lineTo(i * cell, y1 * cell); }
    for (let j = y0; j <= y1; j++) { ctx.moveTo(x0 * cell, j * cell); ctx.lineTo(x1 * cell, j * cell); }
    ctx.strokeStyle = hexA(g.color, g.alpha);
    ctx.lineWidth = Math.max(1, px);
    ctx.stroke();
  }

  function drawShape(c, s) {
    c.save();
    c.globalAlpha *= s.a == null ? 1 : s.a;
    c.lineWidth = s.sw || 0; c.lineJoin = c.lineCap = 'round';
    c.strokeStyle = s.s; if (s.f) c.fillStyle = s.f;
    switch (s.k) {
      case 'rect':
        if (s.f) c.fillRect(s.x, s.y, s.w, s.h);
        if (s.sw > 0) c.strokeRect(s.x, s.y, s.w, s.h);
        break;
      case 'ell':
        c.beginPath(); c.ellipse(s.x + s.w / 2, s.y + s.h / 2, Math.abs(s.w / 2), Math.abs(s.h / 2), 0, 0, TAU);
        if (s.f) c.fill();
        if (s.sw > 0) c.stroke();
        break;
      case 'poly': {
        const p = s.pts;
        c.beginPath(); c.moveTo(p[0], p[1]);
        for (let i = 2; i < p.length; i += 2) c.lineTo(p[i], p[i + 1]);
        c.closePath();
        if (s.f) c.fill();
        if (s.sw > 0) c.stroke();
        break;
      }
      case 'line': {
        const p = s.pts;
        c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(p[2], p[3]); c.stroke();
        if (s.arrow) {
          const a = Math.atan2(p[3] - p[1], p[2] - p[0]), L = Math.max(14, s.sw * 3.4);
          c.beginPath();
          c.moveTo(p[2] - Math.cos(a - 0.45) * L, p[3] - Math.sin(a - 0.45) * L);
          c.lineTo(p[2], p[3]);
          c.lineTo(p[2] - Math.cos(a + 0.45) * L, p[3] - Math.sin(a + 0.45) * L);
          c.stroke();
        }
        break;
      }
      case 'text': {
        const lines = String(s.txt || '').split('\n');
        c.font = `600 ${s.fs}px ${FONT_UI}`;
        c.textAlign = 'left'; c.textBaseline = 'top';
        c.lineWidth = s.fs * 0.16; c.strokeStyle = inkOn(s.s) === '#ffffff' ? 'rgba(255,255,255,0.55)' : 'rgba(0,0,0,0.6)';
        c.fillStyle = s.s;
        lines.forEach((l, i) => { const y = s.y + i * s.fs * 1.25 + s.fs * 0.12; c.strokeText(l, s.x, y); c.fillText(l, s.x, y); });
        break;
      }
      default: {
        const p = s.pts, n = p.length / 2;
        c.beginPath(); c.moveTo(p[0], p[1]);
        if (n < 3) { c.lineTo(p[n * 2 - 2] + 0.01, p[n * 2 - 1]); }
        else {
          for (let i = 1; i < n - 1; i++) {
            const mx = (p[i * 2] + p[i * 2 + 2]) / 2, my = (p[i * 2 + 1] + p[i * 2 + 3]) / 2;
            c.quadraticCurveTo(p[i * 2], p[i * 2 + 1], mx, my);
          }
          c.lineTo(p[n * 2 - 2], p[n * 2 - 1]);
        }
        c.stroke();
      }
    }
    c.restore();
  }

  function drawAura(c, t, a, sc, px) {
    const p = auraShape(t, a, sc);
    c.save();
    if (t.hidden) c.globalAlpha = 0.5;
    c.fillStyle = hexA(a.c, a.a); c.fill(p);
    c.strokeStyle = hexA(a.c, Math.min(1, a.a * 2 + 0.3)); c.lineWidth = 2 * px; c.stroke(p);
    c.restore();
  }

  function drawTokenBody(c, t, sc, px) {
    const s = t.size * sc.cell, cx = t.x + s / 2, cy = t.y + s / 2, r = s / 2 - s * 0.05;
    const dead = t.conds.includes('morto');
    c.save();
    if (t.hidden) c.globalAlpha = 0.5;
    c.fillStyle = 'rgba(0,0,0,0.38)';
    tokPath(c, t.shape, cx, cy + s * 0.04, r * 1.03); c.fill();
    c.save();
    tokPath(c, t.shape, cx, cy, r); c.clip();
    const im = Assets.img(t.img);
    const fill = dead ? '#565b68' : t.color;
    c.fillStyle = fill; c.fillRect(cx - r, cy - r, r * 2, r * 2);
    if (im) {
      const k = Math.max(2 * r / im.naturalWidth, 2 * r / im.naturalHeight);
      const w = im.naturalWidth * k, hh = im.naturalHeight * k;
      if (dead && 'filter' in c) c.filter = 'grayscale(1) brightness(0.8)';
      c.drawImage(im, cx - w / 2, cy - hh / 2, w, hh);
      if (dead && 'filter' in c) c.filter = 'none';
    } else {
      c.fillStyle = inkOn(fill);
      c.font = `700 ${s * 0.36}px ${FONT_UI}`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(initials(t.name), cx, cy + s * 0.02);
    }
    c.restore();
    const owner = t.owner && t.owner !== '*' ? playerById(t.owner) : null;
    const lw = Math.max(2 * px, s * 0.05);
    tokPath(c, t.shape, cx, cy, r);
    c.lineWidth = lw + 2 * px; c.strokeStyle = 'rgba(0,0,0,0.6)'; c.stroke();
    c.lineWidth = lw; c.strokeStyle = owner ? owner.color : (im ? '#e3ded2' : inkOn(fill) === '#ffffff' ? hexA('#ffffff', 0.85) : hexA('#15181f', 0.8)); c.stroke();
    // Sobrevida: um aro claro por fora do token (o "sobre-efeito"), para quem pode ver as barras dele
    if (barsShown(t).some(x => barX(x.b) > 0)) {
      c.save();
      tokPath(c, t.shape, cx, cy, r + lw * 1.5);
      c.lineWidth = Math.max(1.5 * px, lw * 0.7); c.strokeStyle = hexA(SOBRE_COR, 0.9);
      c.shadowColor = SOBRE_COR; c.shadowBlur = 10 * px;
      c.stroke();
      c.restore();
    }
    if (dead) {
      c.strokeStyle = 'rgba(214,52,46,0.85)'; c.lineWidth = s * 0.09; c.lineCap = 'round';
      const k = r * 0.6;
      c.beginPath(); c.moveTo(cx - k, cy - k); c.lineTo(cx + k, cy + k); c.moveTo(cx + k, cy - k); c.lineTo(cx - k, cy + k); c.stroke();
    }
    c.restore();
  }

  function badge(c, x, y, d, color, iconName, px) {
    c.fillStyle = color; c.beginPath(); c.arc(x, y, d / 2, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(8,10,16,0.85)'; c.lineWidth = 1.2 * px; c.stroke();
    const def = ICONS[iconName];
    if (!def) return;
    const k = d * 0.62 / 24;
    c.save();
    c.translate(x - 12 * k, y - 12 * k); c.scale(k, k);
    if (def.fill) { c.fillStyle = '#ffffff'; c.fill(iconPath(iconName)); }
    else { c.strokeStyle = '#ffffff'; c.lineWidth = 2.6; c.lineCap = c.lineJoin = 'round'; c.stroke(iconPath(iconName)); }
    c.restore();
  }

  function drawTokenTop(c, t, sc, px) {
    const z = App.view.z, s = t.size * sc.cell, sp = s * z;
    if (sp < 16) return;
    const cx = t.x + s / 2;
    c.save();
    if (t.hidden) c.globalAlpha = 0.6;

    // Condições, numa fileira na base do token; as que têm contador vêm primeiro
    const info = t.cinfo || {};
    const conds = t.conds.filter(id => COND_BY_ID[id]).sort((p, q) => ((info[q] && info[q].n) ? 1 : 0) - ((info[p] && info[p].n) ? 1 : 0));
    if (conds.length) {
      const d = clamp(s * 0.3, 13 * px, 26 * px), step = d * 1.06;
      const max = Math.max(1, Math.floor((s + d * 0.5) / step));
      const show = conds.length > max ? conds.slice(0, Math.max(1, max - 1)) : conds;
      const extra = conds.length - show.length;
      const n = show.length + (extra ? 1 : 0);
      let x = cx - (n * step) / 2 + step / 2;
      const y = t.y + s - d * 0.4;
      for (const id of show) {
        const cd = COND_BY_ID[id], ci = info[id] || {};
        badge(c, x, y, d, cd.c, cd.i, px);
        if (ci.d > 0) {                       // duração: arco do que ainda falta
          c.beginPath(); c.arc(x, y, d / 2 + 1.6 * px, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(ci.d / (ci.d0 || ci.d), 0.08, 1));
          c.strokeStyle = '#ffffff'; c.lineWidth = 1.6 * px; c.lineCap = 'round'; c.stroke();
        }
        if (ci.n > 0) {                       // contador: número no canto do marcador
          const r = d * 0.32, nx = x + d * 0.36, ny = y - d * 0.36;
          c.beginPath(); c.arc(nx, ny, r, 0, TAU); c.fillStyle = '#10131b'; c.fill();
          c.strokeStyle = '#ffffff'; c.lineWidth = 1 * px; c.stroke();
          c.fillStyle = '#ffffff'; c.font = `700 ${r * (ci.n > 9 ? 1.05 : 1.4)}px ${FONT_UI}`; c.textAlign = 'center'; c.textBaseline = 'middle';
          c.fillText(ci.n > 99 ? '99+' : String(ci.n), nx, ny + r * 0.08);
        }
        x += step;
      }
      if (extra) {
        c.fillStyle = '#2c3140'; c.beginPath(); c.arc(x, y, d / 2, 0, TAU); c.fill();
        c.strokeStyle = 'rgba(8,10,16,0.85)'; c.lineWidth = 1.2 * px; c.stroke();
        c.fillStyle = '#fff'; c.font = `700 ${d * 0.5}px ${FONT_UI}`; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText('+' + extra, x, y + d * 0.03);
      }
    }

    // Barras e pontos, empilhados acima do token; afinam quando são muitos
    const rows = barsShown(t);
    if (rows.length) {
      const n = rows.length, gap = 1.5 * px, w = s * 0.94, x = cx - w / 2;
      let bh = clamp(s * 0.11, 5 * px, 13 * px);
      if (n > 3) bh = Math.max(3 * px, Math.min(bh, (s * 0.46) / n - gap));
      let y = t.y - 2 * px - n * (bh + gap);
      for (const { b, mode } of rows) {
        // Pontos: uma bolinha por ponto. Se não couberem com folga (token pequeno na tela), a barra comum assume.
        const m = Math.round(b.m), d = m >= 1 ? Math.min(bh, (w - (m - 1) * gap) / m) : 0;
        if (b.k === 'pts' && mode === 'num' && m >= 1 && m <= 12 && d >= 2 * px) {
          const x0 = cx - (m * d + (m - 1) * gap) / 2;
          for (let k = 0; k < m; k++) {
            const full = k < Math.round(b.v);
            c.beginPath(); c.arc(x0 + k * (d + gap) + d / 2, y + bh / 2, d / 2, 0, TAU);
            c.fillStyle = full ? b.c : 'rgba(10,12,18,0.82)'; c.fill();
            c.strokeStyle = full ? 'rgba(0,0,0,0.7)' : hexA(b.c, 0.95); c.lineWidth = 1 * px; c.stroke();
          }
        } else {
          c.fillStyle = 'rgba(10,12,18,0.82)'; rr(c, x, y, w, bh, bh * 0.3); c.fill();
          const f = clamp(b.v / b.m, 0, 1);
          if (f > 0) { c.fillStyle = b.c; rr(c, x, y, w * f, bh, bh * 0.3); c.fill(); }
          c.strokeStyle = 'rgba(0,0,0,0.7)'; c.lineWidth = 1 * px; rr(c, x, y, w, bh, bh * 0.3); c.stroke();
          if (mode === 'num' && bh * z >= 9) {
            c.font = `700 ${bh * 0.84}px ${FONT_UI}`; c.textAlign = 'center'; c.textBaseline = 'middle';
            c.lineWidth = bh * 0.22; c.strokeStyle = 'rgba(0,0,0,0.75)'; c.lineJoin = 'round';
            const tx = `${fmt(b.v)}/${fmt(b.m)}` + (barX(b) > 0 ? ` +${fmt(barX(b))}` : '');
            c.strokeText(tx, cx, y + bh * 0.54); c.fillStyle = '#fff'; c.fillText(tx, cx, y + bh * 0.54);
          }
        }
        // Sobrevida: uma barrinha clara por cima da barra, saindo um pouco para o alto (ela absorve o dano antes).
        if (barX(b) > 0) {
          const xw = Math.max(bh * 0.9, w * clamp(barX(b) / b.m, 0, 1)), xh = Math.max(2 * px, bh * 0.5), xy = y - xh * 0.45;
          c.fillStyle = SOBRE_COR; rr(c, x, xy, xw, xh, xh * 0.45); c.fill();
          c.strokeStyle = 'rgba(6,26,36,0.85)'; c.lineWidth = 1 * px; rr(c, x, xy, xw, xh, xh * 0.45); c.stroke();
        }
        y += bh + gap;
      }
    }

    // Nome
    if (sp >= 26) {
      const name = tokName(t);
      if (name) {
        const fs = clamp(s * 0.2, 11 * px, 15 * px);
        c.font = `600 ${fs}px ${FONT_UI}`;
        const w = c.measureText(name).width, padX = fs * 0.5, hh = fs * 1.5, y = t.y + s + fs * 0.3;
        c.fillStyle = 'rgba(12,14,20,0.74)'; rr(c, cx - w / 2 - padX, y, w + padX * 2, hh, hh * 0.35); c.fill();
        c.fillStyle = '#f4f5f8'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(name, cx, y + hh * 0.54);
      }
    }
    if (t.hidden && isGM()) badge(c, t.x + s * 0.14, t.y + s * 0.14, clamp(s * 0.3, 14 * px, 24 * px), '#3a4154', 'eyeOff', px);
    // Sobrevida: o escudo no canto do token, com o total (para quem vê os números)
    if (rows.some(r => barX(r.b) > 0)) {
      const d = clamp(s * 0.36, 16 * px, 30 * px), bx = t.x + s - d * 0.4, by = t.y + d * 0.42, k = d / 19;
      const tot = rows.reduce((a, r) => a + (r.mode === 'num' ? barX(r.b) : 0), 0);
      c.save();
      c.translate(bx - 12 * k, by - 12 * k); c.scale(k, k);
      const sh = iconPath('shield');
      c.fillStyle = '#1f7fa3'; c.fill(sh);
      c.lineJoin = 'round'; c.lineWidth = 2.4; c.strokeStyle = 'rgba(6,20,30,0.9)'; c.stroke(sh);
      c.lineWidth = 1; c.strokeStyle = SOBRE_COR; c.stroke(sh);
      c.restore();
      if (tot > 0 && d * z >= 15) {
        const tx = tot >= 1000 ? '999+' : fmt(tot, 0), fs = d * (tx.length > 2 ? 0.36 : 0.48);
        c.font = `800 ${fs}px ${FONT_UI}`; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillStyle = '#ffffff'; c.fillText(tx, bx, by - d * 0.02);
      }
    }
    c.restore();
  }

  // Ícone clicável de uma abertura, no ponto que doorSpots escolheu. O desenho diz sempre o tipo (porta, janela,
  // cortina) e o estado: aberta em verde, com o desenho aberto; fechada, em claro. Trancada (só o mestre vê): um
  // cadeado pequeno no canto, e o aro vermelho enquanto está fechada. Assim janela e cortina trancadas, uma em
  // cima da outra, continuam se distinguindo, e dá para ver se a trancada está aberta.
  const OPENING_ICONS = { door: ['door', 'doorOpen'], window: ['window', 'windowOpen'], veil: ['veil', 'veilOpen'] };
  function drawOpening(c, s, px, gm) {
    const w = s.w, r = 11 * px, lock = gm && w.locked, open = !!w.open && !w.secret;
    const col = w.secret ? '#e39bff' : open ? '#8fe0a8' : lock ? '#ff8c7e' : '#e9edf5';
    c.save();
    c.fillStyle = open ? 'rgba(17,38,29,0.95)' : 'rgba(18,21,30,0.94)'; c.beginPath(); c.arc(s.x, s.y, r, 0, TAU); c.fill();
    c.strokeStyle = col; c.lineWidth = 1.5 * px; c.stroke();
    const k = 13 * px / 24;
    c.translate(s.x - 12 * k, s.y - 12 * k); c.scale(k, k);
    c.lineWidth = 2; c.lineCap = c.lineJoin = 'round';
    c.stroke(iconPath((OPENING_ICONS[w.k] || OPENING_ICONS.door)[open ? 1 : 0]));
    c.restore();
    if (lock) badge(c, s.x + r * 0.8, s.y - r * 0.8, 12 * px, '#c2473d', 'lock', px);
  }

  /* O que muda de um instante para o outro (e some na névoa para os jogadores) é
     desenhado em dois níveis: os efeitos sem brilho ficam embaixo da escuridão;
     auras, efeitos luminosos e tokens ficam por cima dela, sempre legíveis. */
  function drawFx(c, sc, px, t, glow) {
    const gm = isGM();
    for (const e of sc.effects) {
      if (!fxVisible(e) || !!(FX.P[e.fx] || FX.P.fogo).glow !== glow) continue;
      const g = FX.geom(e, sc);
      FX.draw(c, e, g, t, px);
      if (e.gm) badge(c, g.cx, g.cy, 18 * px, '#3a4154', 'eyeOff', px);
    }
  }
  function drawUpper(c, sc, px, t) {
    const gm = isGM();
    for (const tk of sc.tokens) {
      if (!gm && tk.hidden) continue;
      for (const a of tk.auras) { if (!a.pub && !gm && !ownsTok(tk)) continue; drawAura(c, tk, a, sc, px); }
    }
    drawFx(c, sc, px, t, true);
    for (const tk of sc.tokens) if (gm || !tk.hidden) drawTokenBody(c, tk, sc, px);
    for (const tk of sc.tokens) if (gm || !tk.hidden) drawTokenTop(c, tk, sc, px);
  }

  function drawWalls(sc, px) {
    const active = App.tool === 'wall', pieces = Walls.of(sc).pieces;
    ctx.save();
    ctx.lineCap = 'round';
    for (const w of sc.walls) {
      const sel = selHas('walls', w.id), door = w.k === 'door';
      ctx.globalAlpha = active || sel ? 1 : 0.5;
      // parede: âmbar; porta: azul (tracejada se aberta); secreta: lilás; janela: ciano pontilhado; cortina: roxo tracejado curto.
      // Janela e cortina abertas ficam com o mesmo traço, mais espaçado.
      const open = wallOpen(w);
      ctx.setLineDash(door ? (open ? [6 * px, 6 * px] : []) : w.k === 'window' ? [2 * px, (open ? 11 : 5) * px] : w.k === 'veil' ? (open ? [9 * px, 11 * px] : [9 * px, 4 * px, 2 * px, 4 * px]) : []);
      // Parede comum: só os trechos que sobraram dela (onde há uma abertura por cima, o traço é o da abertura).
      const pcs = pieces.get(w.id);
      ctx.beginPath();
      if (pcs) for (const q of pcs) { ctx.moveTo(q[0], q[1]); ctx.lineTo(q[2], q[3]); }
      else { ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); }
      ctx.strokeStyle = 'rgba(0,0,0,0.65)'; ctx.lineWidth = 5.5 * px; ctx.stroke();
      ctx.strokeStyle = sel ? '#ffffff' : door ? (w.secret ? '#e39bff' : w.locked ? '#ff8c7e' : '#7fd1ff') : w.k === 'window' ? '#8fe9ff' : w.k === 'veil' ? '#b79bff' : '#f0c26a';
      ctx.lineWidth = 2.6 * px; ctx.stroke();
      if (active || sel) {
        ctx.setLineDash([]);
        ctx.fillStyle = sel ? '#ffffff' : '#f0c26a';
        for (const [x, y] of [[w.x1, w.y1], [w.x2, w.y2]]) { ctx.beginPath(); ctx.arc(x, y, (sel ? 5 : 3.2) * px, 0, TAU); ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 1 * px; ctx.stroke(); }
      }
    }
    ctx.restore();
  }

  function drawLights(sc, px) {
    for (const l of sc.lights) {
      const sel = selHas('lights', l.id);
      if (sel || App.tool === 'light') {
        ctx.save();
        ctx.strokeStyle = hexA(l.c, 0.9); ctx.lineWidth = 1.4 * px;
        ctx.setLineDash([7 * px, 6 * px]); ctx.beginPath(); ctx.arc(l.x, l.y, l.dim * sc.cell, 0, TAU); ctx.stroke();
        ctx.setLineDash([2 * px, 5 * px]); ctx.beginPath(); ctx.arc(l.x, l.y, l.bright * sc.cell, 0, TAU); ctx.stroke();
        ctx.restore();
      }
      ctx.save();
      const r = 11 * px;
      ctx.fillStyle = l.on ? l.c : '#566074';
      ctx.beginPath(); ctx.arc(l.x, l.y, r, 0, TAU); ctx.fill();
      ctx.strokeStyle = sel ? '#ffffff' : 'rgba(10,12,18,0.85)'; ctx.lineWidth = (sel ? 2.2 : 1.4) * px; ctx.stroke();
      const k = 14 * px / 24;
      ctx.translate(l.x - 12 * k, l.y - 12 * k); ctx.scale(k, k);
      ctx.strokeStyle = '#1b1608'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.stroke(iconPath('light'));
      ctx.restore();
    }
  }

  function drawSelection(sc, px) {
    ctx.save();
    for (const s of App.sel) {
      const o = Store.get(s.c, s.id);
      if (!o) continue;
      ctx.setLineDash([]);
      if (s.c === 'tokens') {
        const [cx, cy, half] = tokC(o, sc);
        tokPath(ctx, o.shape, cx, cy, half + 1.5 * px);
        ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 4.5 * px; ctx.stroke();
        ctx.strokeStyle = theme.lamp; ctx.lineWidth = 2.2 * px; ctx.stroke();
      } else if (s.c === 'shapes') {
        const b = shapeBBox(o), m = (o.sw || 0) / 2 + 4 * px;
        ctx.setLineDash([6 * px, 4 * px]);
        ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 3 * px; ctx.strokeRect(b.x - m, b.y - m, b.w + m * 2, b.h + m * 2);
        ctx.strokeStyle = theme.lamp; ctx.lineWidth = 1.5 * px; ctx.strokeRect(b.x - m, b.y - m, b.w + m * 2, b.h + m * 2);
      } else if (s.c === 'effects') {
        const g = FX.geom(o, sc);
        ctx.setLineDash([7 * px, 5 * px]);
        ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 3.5 * px; ctx.stroke(g.path);
        ctx.strokeStyle = theme.lamp; ctx.lineWidth = 1.8 * px; ctx.stroke(g.path);
      }
    }
    ctx.setLineDash([]);
    for (const hd of Tools.handles()) {
      ctx.beginPath();
      if (hd.round) ctx.arc(hd.x, hd.y, 5.5 * px, 0, TAU); else ctx.rect(hd.x - 4.5 * px, hd.y - 4.5 * px, 9 * px, 9 * px);
      ctx.fillStyle = hd.round ? theme.lamp : '#ffffff'; ctx.fill();
      ctx.strokeStyle = 'rgba(8,10,16,0.9)'; ctx.lineWidth = 1.4 * px; ctx.stroke();
    }
    ctx.restore();
  }

  function drawTurnRing(sc, px) {
    const tn = sc.turn;
    if (!tn.on || !tn.cur) return;
    if (!isGM() && !can('turns')) return;
    const e = tn.list.find(x => x.id === tn.cur);
    const t = e && e.token ? Store.get('tokens', e.token) : null;
    if (!t || !tokShown(t, sc)) return;
    const [cx, cy, half] = tokC(t, sc);
    ctx.save();
    tokPath(ctx, t.shape, cx, cy, half + 6 * px);
    ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 5 * px; ctx.stroke();
    ctx.strokeStyle = theme.lamp; ctx.lineWidth = 2.5 * px; ctx.setLineDash([10 * px, 6 * px]); ctx.stroke();
    ctx.restore();
  }

  // Linha de medição com a distância total na ponta.
  function drawMeasure(pts, sc, px, color, extra) {
    if (!pts || pts.length < 4) return;
    ctx.save();
    ctx.lineCap = ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.strokeStyle = 'rgba(0,0,0,0.65)'; ctx.lineWidth = 5 * px; ctx.stroke();
    ctx.strokeStyle = color; ctx.lineWidth = 2.4 * px; ctx.setLineDash([9 * px, 6 * px]); ctx.stroke();
    ctx.setLineDash([]);
    let total = 0;
    for (let i = 0; i < pts.length; i += 2) {
      if (i) total += gridDist(sc, pts[i - 2], pts[i - 1], pts[i], pts[i + 1]);
      ctx.beginPath(); ctx.arc(pts[i], pts[i + 1], 4 * px, 0, TAU);
      ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 1.2 * px; ctx.stroke();
    }
    const n = pts.length;
    label(ctx, distLabel(sc, total) + (extra || ''), pts[n - 2], pts[n - 1] - 22 * px, px, { stroke: color });
    ctx.restore();
  }

  function drawPings(sc, px, now) {
    if (!App.pings.length) return;
    App.pings = App.pings.filter(p => now - p.t0 < 3200);
    const still = reduce.matches;
    ctx.save();
    for (const p of App.pings) {
      const age = (now - p.t0) / 1000;
      const out = age > 2.6 ? Math.max(0, (3.2 - age) / 0.6) : 1;
      for (let k = 0; k < 3; k++) {
        const f = still ? 0.3 + k * 0.3 : ((age * 0.8 - k * 0.3) % 1.1) / 1.1;
        if (f < 0) continue;
        const r = sc.cell * (0.2 + f * 1.25);
        ctx.globalAlpha = (1 - f) * out;
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU);
        ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 5 * px; ctx.stroke();
        ctx.strokeStyle = p.c; ctx.lineWidth = 2.6 * px; ctx.stroke();
      }
      ctx.globalAlpha = out;
      ctx.beginPath(); ctx.arc(p.x, p.y, 5 * px, 0, TAU); ctx.fillStyle = p.c; ctx.fill();
      label(ctx, p.n, p.x, p.y - sc.cell * 0.2 - 20 * px, px, { stroke: p.c });
    }
    ctx.restore();
  }

  // Miras: um retículo em volta do alvo, na cor de quem mira.
  function drawTargets(sc, px) {
    if (!sc.targets.length) return;
    const count = new Map();
    ctx.save();
    ctx.lineCap = 'round';
    for (const tg of sc.targets) {
      const t = Store.get('tokens', tg.t);
      if (!t || !tokShown(t, sc)) continue;
      const k = count.get(t.id) || 0;
      count.set(t.id, k + 1);
      const col = tg.by === 'gm' ? theme.lamp : (playerById(tg.by) || {}).color || '#ffffff';
      const [cx, cy, half] = tokC(t, sc), r = half + (8 + k * 6) * px;
      for (const top of [false, true]) {
        ctx.strokeStyle = top ? col : 'rgba(0,0,0,0.7)'; ctx.lineWidth = (top ? 2.4 : 4.8) * px;
        ctx.beginPath();
        for (let q = 0; q < 4; q++) {
          const a = q * Math.PI / 2;
          ctx.moveTo(cx + Math.cos(a - 0.5) * r, cy + Math.sin(a - 0.5) * r); ctx.arc(cx, cy, r, a - 0.5, a + 0.5);
          ctx.moveTo(cx + Math.cos(a) * (r - 6 * px), cy + Math.sin(a) * (r - 6 * px)); ctx.lineTo(cx + Math.cos(a) * (r + 6 * px), cy + Math.sin(a) * (r + 6 * px));
        }
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // Números de dano e cura subindo do token.
  function drawFloats(sc, px, now) {
    if (!App.floats.length) return;
    App.floats = App.floats.filter(f => now - f.t0 < 1500);
    const seen = new Map();
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    for (const f of App.floats) {
      const t = Store.get('tokens', f.id);
      if (!t || !tokShown(t, sc)) continue;
      const k = seen.get(f.id) || 0;
      seen.set(f.id, k + 1);
      const age = clamp((now - f.t0) / 1500, 0, 1), [cx, cy, half] = tokC(t, sc);
      const fs = clamp(sc.cell * 0.36, 16 * px, 28 * px);
      const y = cy - half * 0.15 - (reduce.matches ? 0 : age * sc.cell * 0.6) - k * fs * 1.05;
      ctx.globalAlpha = age < 0.7 ? 1 : (1 - age) / 0.3;
      ctx.font = `700 ${fs}px ${FONT_UI}`;
      ctx.lineWidth = fs * 0.24; ctx.strokeStyle = 'rgba(8,10,16,0.92)'; ctx.strokeText(f.text, cx, y);
      ctx.fillStyle = f.c; ctx.fillText(f.text, cx, y);
    }
    ctx.restore();
  }

  // Quantas rodadas ainda restam em cada efeito com duração.
  function drawDurations(sc, px) {
    const gm = isGM();
    for (const e of sc.effects) {
      if (!(e.dur > 0) || !fxVisible(e)) continue;
      const g = FX.geom(e, sc);
      // cone e linha: no meio da área; círculo e quadrado: por dentro, perto do topo; retângulo: por dentro,
      // junto do lado que fica mais alto na tela (vale também quando ele está girado)
      const mid = e.k === 'cone' || e.k === 'line';
      const lx = g.lab ? g.lab.x + g.lab.nx * 11 * px : mid ? g.cx : g.x;
      const ly = g.lab ? g.lab.y + g.lab.ny * 11 * px : mid ? g.cy : g.y - g.R + 11 * px;
      if (!gm && !Vision.canSee(lx, ly)) continue;
      label(ctx, e.dur === 1 ? '1 rodada' : e.dur + ' rodadas', lx, ly, px, { size: 10.5 });
    }
  }

  /* Clima sobre o mapa. As partículas não guardam estado: a posição de cada uma sai do
     tempo e de um sorteio fixo por ladrilho, então só se calculam as que estão na tela. */
  function drawWeather(sc, px, t) {
    const wz = sc.weather;
    if (!wz || !wz.k) return;
    const W = sceneW(sc), H = sceneH(sc), cell = sc.cell, T = cell * 10, v = App.view, h = FX.hsh;
    const pow = clamp(wz.pow || 0.6, 0.2, 1) * clamp(v.z * 1.6, 0.35, 1);
    const tx0 = Math.max(0, Math.floor(v.x / T)), tx1 = Math.min(Math.ceil(W / T) - 1, Math.floor((v.x + cw / v.z) / T));
    const ty0 = Math.max(0, Math.floor(v.y / T)), ty1 = Math.min(Math.ceil(H / T) - 1, Math.floor((v.y + ch / v.z) / T));
    const wrap = a => ((a % T) + T) % T;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    const each = (n, fn) => { for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) { const seed = tx * 37 + ty * 91 + 5; for (let i = 0; i < n; i++) fn(tx * T, ty * T, i, seed); } };
    if (wz.k === 'chuva') {
      const len = cell * 0.55;
      ctx.beginPath();
      each(Math.round(34 * pow), (ox, oy, i, s) => {
        const x = ox + wrap(h(i, 1, s) * T - t * T * 0.35), y = oy + wrap(h(i, 2, s) * T + t * T * (1.5 + h(i, 3, s) * 0.5));
        ctx.moveTo(x, y); ctx.lineTo(x - len * 0.22, y + len);
      });
      ctx.strokeStyle = 'rgba(196,220,255,0.5)'; ctx.lineWidth = Math.max(1.1 * px, cell * 0.018); ctx.lineCap = 'round'; ctx.stroke();
    } else if (wz.k === 'neve') {
      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      ctx.beginPath();
      each(Math.round(26 * pow), (ox, oy, i, s) => {
        const x = ox + wrap(h(i, 1, s) * T + Math.sin(t * 0.7 + i) * cell * 0.5 + t * cell * 0.3), y = oy + wrap(h(i, 2, s) * T + t * T * (0.09 + h(i, 3, s) * 0.06));
        const r = cell * (0.035 + h(i, 4, s) * 0.04);
        ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU);
      });
      ctx.fill();
    } else if (wz.k === 'neblina') {
      each(Math.max(2, Math.round(4 * pow)), (ox, oy, i, s) => {
        const x = ox + wrap(h(i, 1, s) * T + t * cell * (0.25 + h(i, 3, s) * 0.2)), y = oy + h(i, 2, s) * T + Math.sin(t * 0.2 + i * 2) * cell;
        FX.blob(ctx, x, y, cell * (3.2 + h(i, 4, s) * 2.5), '#e8eef2', 0.13 + 0.05 * Math.sin(t * 0.4 + i));
        FX.blob(ctx, x - T, y, cell * (3.2 + h(i, 4, s) * 2.5), '#e8eef2', 0.13 + 0.05 * Math.sin(t * 0.4 + i));
      });
    } else if (wz.k === 'cinzas') {
      ctx.fillStyle = 'rgba(40,40,46,0.75)';
      ctx.beginPath();
      each(Math.round(16 * pow), (ox, oy, i, s) => {
        const x = ox + wrap(h(i, 1, s) * T + Math.sin(t * 0.5 + i) * cell * 0.7), y = oy + wrap(h(i, 2, s) * T + t * T * (0.05 + h(i, 3, s) * 0.04));
        const r = cell * (0.03 + h(i, 4, s) * 0.035);
        ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU);
      });
      ctx.fill();
      ctx.globalCompositeOperation = 'lighter';
      each(Math.round(6 * pow), (ox, oy, i, s) => {
        const x = ox + wrap(h(i, 5, s) * T + Math.sin(t * 0.9 + i * 3) * cell * 0.6), y = oy + wrap(h(i, 6, s) * T - t * T * (0.06 + h(i, 7, s) * 0.05));
        FX.blob(ctx, x, y, cell * 0.11, '#ff8a3c', 0.5 + 0.4 * Math.sin(t * 3 + i));
      });
    } else if (wz.k === 'vagalumes') {
      ctx.globalCompositeOperation = 'lighter';
      each(Math.max(2, Math.round(7 * pow)), (ox, oy, i, s) => {
        const x = ox + h(i, 1, s) * T + Math.sin(t * (0.3 + h(i, 3, s) * 0.3) + i) * cell * 1.2, y = oy + h(i, 2, s) * T + Math.cos(t * (0.25 + h(i, 4, s) * 0.3) + i * 2) * cell * 1.2;
        const tw = Math.sin(t * (0.8 + h(i, 5, s)) + i * 1.7);
        FX.blob(ctx, x, y, cell * 0.2, '#dcff7a', tw > 0 ? tw * 0.85 : 0);
      });
    }
    ctx.restore();
  }

  /* ---- Quadro completo ---- */
  function draw(ts) {
    const sc = Store.scene();
    if (!sc || cw < 2) return;
    const z = App.view.z, px = 1 / z, W = sceneW(sc), H = sceneH(sc), gm = isGM();
    if (Vision.isDirty()) Vision.update(sc, App.viewer);
    const vo = Vision.out;
    const t = motion() ? tNow : 1.7;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = theme.table; ctx.fillRect(0, 0, cv.width, cv.height);
    setWorld(ctx);

    // Fundo e grade (recortados no retângulo da cena)
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 24 * dpr; ctx.shadowOffsetY = 6 * dpr;
    ctx.fillStyle = sc.bgColor; ctx.fillRect(0, 0, W, H);
    ctx.restore();
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    const bg = Assets.img(sc.bg.asset);
    if (bg) {
      if (sc.bg.stretch) ctx.drawImage(bg, 0, 0, W, H);
      else { const w = W * (sc.bg.scale || 1); ctx.drawImage(bg, sc.bg.dx || 0, sc.bg.dy || 0, w, w * bg.naturalHeight / bg.naturalWidth); }
    }
    drawGrid(sc, px);
    ctx.restore();

    for (const s of sc.shapes) if (!s.top && shapeShown(s)) { ctx.globalAlpha = s.gm ? 0.7 : 1; drawShape(ctx, s); }
    ctx.globalAlpha = 1;

    // Para os jogadores com névoa, cada nível vivo só aparece dentro do que eles enxergam.
    const masked = !gm && !!vo.vis;
    const layer = fn => {
      if (!masked) { fn(ctx); return; }
      lctx.setTransform(1, 0, 0, 1, 0, 0);
      lctx.globalCompositeOperation = 'source-over'; lctx.globalAlpha = 1;
      lctx.clearRect(0, 0, live.width, live.height);
      setWorld(lctx);
      fn(lctx);
      lctx.globalCompositeOperation = 'destination-in'; lctx.globalAlpha = 1;
      lctx.drawImage(vo.vis, 0, 0, vo.w, vo.h);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(live, 0, 0);
      setWorld(ctx);
    };
    if (sc.effects.some(e => !(FX.P[e.fx] || FX.P.fogo).glow)) layer(c => drawFx(c, sc, px, t, false));

    // Tom da hora do dia: colore o mapa, não os tokens
    const tone = TONES.find(x => x.id === sc.tone);
    if (tone && tone.tint) {
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = tone.tint; ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    // Luz e escuridão sobre o mapa
    if (vo.dark) {
      ctx.globalCompositeOperation = 'screen';
      ctx.drawImage(vo.glow, 0, 0, vo.w, vo.h);
      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(vo.dark, 0, 0, vo.w, vo.h);
    }

    // A neblina fica por baixo dos tokens, para eles continuarem legíveis; chuva, neve e afins caem por cima de tudo.
    const mist = sc.weather && sc.weather.k === 'neblina';
    if (mist) drawWeather(sc, px, t);

    layer(c => drawUpper(c, sc, px, t));

    for (const s of sc.shapes) if (s.top && shapeShown(s)) { ctx.globalAlpha = s.gm ? 0.7 : 1; drawShape(ctx, s); }
    ctx.globalAlpha = 1;

    if (!mist) drawWeather(sc, px, t);

    // Névoa
    if (vo.fog) ctx.drawImage(vo.fog, 0, 0, vo.w, vo.h);

    // Véu do mestre: por cima do mapa, dos desenhos, dos efeitos e dos tokens; por baixo de tudo o que é da interface.
    if (gm && vo.veil) { ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip(); ctx.drawImage(vo.veil, 0, 0, vo.w, vo.h); ctx.restore(); }

    // Interface sobre o mapa
    if (gm) { drawWalls(sc, px); drawLights(sc, px); }
    for (const s of doorSpots(sc)) drawOpening(ctx, s, px, gm);
    drawDurations(sc, px);
    drawTurnRing(sc, px);
    drawTargets(sc, px);
    drawSelection(sc, px);
    Tools.drawPreview(ctx, px, sc);
    drawFloats(sc, px, ts);
    drawPings(sc, px, ts);
    UI.frame();
  }

  return { request, resize, readTheme, fit, zoomAt, centerOn, toScreen, drawShape, drawMeasure, label, rr, size: () => [cw, ch], cv, stats };
})();
/* ---------------------------------------------------------------
   9. TOOLS — ferramentas e gestos de mouse e teclado
   --------------------------------------------------------------- */
const Tools = (() => {

  const T = {};

  let g = null;              // gesto em andamento
  let pan = null, rdown = null;
  let chain = null;          // parede sendo desenhada
  let poly = null;           // polígono sendo desenhado
  let ruler = null;          // medição na tela
  let ghost = null;          // posição do cursor para pré-visualizações
  let lastUp = null;         // último clique, para reconhecer clique duplo

  const KEYS = { v: 'select', h: 'pan', t: 'token', b: 'free', l: 'line', r: 'rect', o: 'ell', p: 'poly', x: 'text', w: 'wall', d: 'wall', i: 'light', n: 'fog', e: 'fx', m: 'ruler' };
  const LIST = [
    { id: 'select', n: 'Selecionar', k: 'V', i: 'select', grp: 0 },
    { id: 'pan', n: 'Mover a câmera', k: 'H', i: 'pan', grp: 0 },
    { id: 'token', n: 'Novo token', k: 'T', i: 'token', grp: 1, gm: true },
    { id: 'free', n: 'Desenho livre', k: 'B', i: 'pen', grp: 2, perm: 'draw' },
    { id: 'line', n: 'Linha', k: 'L', i: 'line', grp: 2, perm: 'draw' },
    { id: 'rect', n: 'Retângulo', k: 'R', i: 'rect', grp: 2, perm: 'draw' },
    { id: 'ell', n: 'Elipse', k: 'O', i: 'ell', grp: 2, perm: 'draw' },
    { id: 'poly', n: 'Polígono', k: 'P', i: 'poly', grp: 2, perm: 'draw' },
    { id: 'text', n: 'Texto', k: 'X', i: 'text', grp: 2, perm: 'draw' },
    { id: 'wall', n: 'Paredes e portas', k: 'W', i: 'wall', grp: 3, gm: true },
    { id: 'light', n: 'Luz', k: 'I', i: 'light', grp: 3, gm: true },
    { id: 'fog', n: 'Névoa manual', k: 'N', i: 'fog', grp: 3, gm: true },

  // A abertura (porta, janela, cortina) cujo ícone está sob o cursor: o mais próximo, entre os que quem olha alcança.

  /* ---- Alças do objeto selecionado ---- */
  function handles() {
    if (g && g.type !== 'handle') return [];
    if (App.sel.length !== 1) return [];
    const s = App.sel[0], o = Store.get(s.c, s.id), sc = Store.scene();
    if (!o) return [];
    const out = [], gm = isGM(), selTool = App.tool === 'select';
    if (s.c === 'shapes' && selTool) {
      if (!(gm || can('editShape', o)) || o.lock) return out;
      if (o.k === 'line') out.push({ kind: 'end', i: 0, x: o.pts[0], y: o.pts[1] }, { kind: 'end', i: 1, x: o.pts[2], y: o.pts[3] });
      else if (o.k !== 'text') {
        const b = shapeBBox(o), xs = [b.x, b.x + b.w / 2, b.x + b.w], ys = [b.y, b.y + b.h / 2, b.y + b.h];
        for (let j = 0; j < 3; j++) for (let i = 0; i < 3; i++) if (i !== 1 || j !== 1) out.push({ kind: 'box', hx: i, hy: j, x: xs[i], y: ys[j] });
      }
    } else if (s.c === 'effects' && selTool) {
      if (!(gm || can('editFx', o))) return out;
      const ge = FX.geom(o, sc);
      out.push({ kind: 'fx', x: ge.hx, y: ge.hy, round: true });
      // retângulo: a bolinha gira e muda a largura; o quadradinho do canto muda largura e altura
      if (o.k === 'rect') out.push({ kind: 'fxbox', x: ge.x + ge.cs * ge.hw - ge.sn * ge.hh, y: ge.y + ge.sn * ge.hw + ge.cs * ge.hh });
    } else if (s.c === 'tokens' && selTool) {
      if (!(gm || can('auras', o))) return out;

      o.auras.forEach((a, i) => {
        if (a.k !== 'cone') return;

    } else if (s.c === 'lights' && gm && (selTool || App.tool === 'light')) {

    } else if (s.c === 'walls' && gm && App.tool === 'wall') {

  }
  function hitHandle(p) {
    const r = 8 / App.view.z;
    for (const hd of handles()) if (Math.abs(p.x - hd.x) <= r && Math.abs(p.y - hd.y) <= r) return hd;
    return null;
  }
  function startHandle(hd) {
    const s = App.sel[0], o = Store.get(s.c, s.id);
    g = { type: 'handle', hd, c: s.c, id: s.id, o0: clone(o), b0: hd.kind === 'box' ? shapeBBox(o) : null, started: false };
  }
  function moveHandle(p, e) {
    const sc = Store.scene(), free = e.altKey, hd = g.hd, o0 = g.o0;
    if (!g.started) { Store.begin('Ajustar'); g.started = true; }
    const snapShape = App.opt.snap !== free;
    if (hd.kind === 'box') {
      const b0 = g.b0;
      let x0 = b0.x, y0 = b0.y, x1 = b0.x + b0.w, y1 = b0.y + b0.h;
      const [qx, qy] = snapPt(sc, p.x, p.y, !snapShape);
      if (hd.hx === 0) x0 = Math.min(qx, x1 - 2); else if (hd.hx === 2) x1 = Math.max(qx, x0 + 2);
      if (hd.hy === 0) y0 = Math.min(qy, y1 - 2); else if (hd.hy === 2) y1 = Math.max(qy, y0 + 2);
      Store.upd('shapes', g.id, shapeScaled(o0, b0, { x: x0, y: y0, w: x1 - x0, h: y1 - y0 }));
    } else if (hd.kind === 'end') {
      const [qx, qy] = snapPt(sc, p.x, p.y, !snapShape);

      pts[hd.i * 2] = qx; pts[hd.i * 2 + 1] = qy;
