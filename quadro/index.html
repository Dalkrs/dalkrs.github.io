<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="../tc/tema.js?v=1"></script>
<title>Quadro de pistas · Tiny Cats</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Grenze:wght@500;600;700&family=Special+Elite&family=Caveat:wght@500;700&display=swap">
<style>
/* O quadro de pistas (lote 143): o mural de cortiça de cada jogador, com cartões e fios. */
:root {
  color-scheme: dark;
  --table: #0d1017; --surface: #161a24; --raised: #1f2431; --hover: #283042;
  --line: #2b3243; --line-strong: #40495f;
  --fg: #e8eaf0; --fg-2: #a6aec0; --fg-3: #7d879c;
  --lamp: #e6ab4f; --lamp-ink: #edb960; --lamp-soft: rgba(230, 171, 79, .16); --on-lamp: #1d1503;
  --danger: #f0786e;
  --shadow: 0 12px 34px rgba(0, 0, 0, .5);
  --ui: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --display: "Grenze", "Iowan Old Style", Georgia, serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, Menlo, Consolas, monospace;
  --mao: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --typo: "Special Elite", "Courier New", ui-monospace, monospace;
}
:root:where([data-claro]) {
  color-scheme: light;
  --table: #c7ced9; --surface: #f2f4f8; --raised: #ffffff; --hover: #e3e8ef;
  --line: #d2d8e2; --line-strong: #aeb8c9;
  --fg: #1a1f2c; --fg-2: #4a5468; --fg-3: #68738a;
  --lamp: #e2a13a; --lamp-ink: #855605; --lamp-soft: rgba(196, 128, 16, .17); --on-lamp: #241a04;
  --danger: #b9342a; --shadow: 0 12px 34px rgba(40, 50, 72, .24);
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--table); color: var(--fg); font: 14px/1.4 var(--ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; min-width: 0; }
.top { flex: none; display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; position: relative; z-index: 3; }
.brand { font: 600 20px/1 var(--display); color: var(--lamp-ink); white-space: nowrap; }
.na-casca .brand { display: none; }
.grow { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raised); font-weight: 600; white-space: nowrap; font-size: 13px; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.pri { background: var(--lamp); border-color: var(--lamp); color: var(--on-lamp); }
.btn.on { background: var(--lamp-soft); border-color: var(--lamp); color: var(--lamp-ink); }
.btn.perigo { color: var(--danger); }
.in { height: 32px; padding: 0 9px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raised); min-width: 0; }
textarea.in { height: auto; padding: 7px 9px; resize: vertical; width: 100%; }
.sel-q { max-width: 260px; }
.dica { font-size: 12.5px; color: var(--fg-3); }
.fiodef { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 10px; }
.fiodef select { height: 28px; font-size: 12.5px; max-width: 220px; }
.palco { position: relative; flex: 1; overflow: hidden; background: #3b2a17; touch-action: none; cursor: grab; }
.palco.pan { cursor: grabbing; }
.board { position: absolute; left: 0; top: 0; transform-origin: 0 0; border-radius: 6px; box-shadow: inset 0 0 0 6px #6b4a26, inset 0 0 60px rgba(0,0,0,.45);
  background-color: #8a6440;
  background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,.07) 0 1px, transparent 2px), radial-gradient(circle at 70% 60%, rgba(0,0,0,.13) 0 1.2px, transparent 2px), radial-gradient(circle at 40% 80%, rgba(0,0,0,.09) 0 1px, transparent 2px);
  background-size: 7px 7px, 11px 11px, 5px 5px; }
:root:not([data-claro]) .board { background-color: #6f4f30; }
.board svg.fios { position: absolute; inset: 0; overflow: visible; z-index: 3; pointer-events: none; }
.board svg.fios .fio-h { pointer-events: stroke; }
.fio-h { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; pointer-events: stroke; }
.fio-txt { font: 700 17px/1 var(--mao); paint-order: stroke; stroke: rgba(30, 20, 10, .75); stroke-width: 3.5px; fill: #fff6df; pointer-events: none; }
.carta { position: absolute; width: 200px; padding: 18px 12px 10px; border-radius: 3px; background: #efe4c8; color: #2a2116; box-shadow: 0 6px 14px rgba(0,0,0,.35), 0 1px 0 rgba(0,0,0,.2); cursor: grab; user-select: none; touch-action: none; font-size: 13px; line-height: 1.4; }
.carta.arrastando { cursor: grabbing; z-index: 5; box-shadow: 0 14px 28px rgba(0,0,0,.45); }
.carta.escolhida { outline: 3px solid #e0403a; outline-offset: 3px; }
.carta .alfinete { position: absolute; top: 5px; left: 50%; width: 13px; height: 13px; margin-left: -6px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff8a80, #c62828 60%, #6d0f0f); box-shadow: 0 2px 2px rgba(0,0,0,.4); }
.carta .tipo { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: rgba(60, 40, 15, .65); }
.carta b { display: block; font: 600 16px/1.15 var(--display); margin: 2px 0; overflow-wrap: anywhere; }
.carta p { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 9.8em; overflow: hidden; }
.carta.nota p, .carta.nota b { font-family: var(--mao); font-size: 19px; line-height: 1.12; font-weight: 600; }
.carta.pista p { font-family: var(--typo); font-size: 12px; }
.carta img { display: block; width: 100%; max-height: 220px; object-fit: cover; border-radius: 2px; margin-top: 4px; background: #ccc; }
.carta.img { padding: 14px 8px 8px; background: #fbf8f1; }
.carta.descartado { filter: grayscale(.6); opacity: .82; }
.carta.descartado b { text-decoration: line-through; }
.carta .acoes { position: absolute; top: 2px; right: 3px; display: flex; gap: 1px; }
.carta .acoes button { border: 0; background: none; color: rgba(60, 40, 15, .7); font-size: 14px; line-height: 1; padding: 3px 4px; border-radius: 4px; }
.carta .acoes button:hover { background: rgba(0,0,0,.08); }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; z-index: 4; }
.zoom .btn { width: 34px; padding: 0; background: var(--surface); }
.vazio { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--fg); }
.vazio div { max-width: 460px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; box-shadow: var(--shadow); }
.vazio h2 { margin: 0 0 6px; font: 600 22px/1.1 var(--display); color: var(--lamp-ink); }
.vazio p { margin: 0 0 12px; color: var(--fg-2); }
.aviso-ligar { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 4; background: var(--surface); border: 1px solid var(--lamp); color: var(--fg); border-radius: 999px; padding: 6px 14px; font-size: 13px; box-shadow: var(--shadow); }
dialog { border: 1px solid var(--line-strong); border-radius: 14px; background: var(--surface); color: var(--fg); padding: 18px 20px; width: min(560px, 94vw); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(5, 8, 14, .55); }
dialog h2 { margin: 0 0 10px; font: 600 22px/1.1 var(--display); }
.f { display: grid; gap: 4px; margin: 0 0 10px; }
.f > span { font-size: 12px; font-weight: 700; color: var(--fg-3); }
.pe { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
.pe .esq { margin-right: auto; }
.abas-d { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
.abas-d button { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--raised); font-size: 13px; font-weight: 600; color: var(--fg-2); }
.abas-d button[aria-pressed="true"] { background: var(--lamp-soft); border-color: var(--lamp); color: var(--lamp-ink); }
.lista { display: grid; gap: 6px; max-height: 46vh; overflow: auto; }
.lista button { display: grid; gap: 2px; text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); }
.lista button:hover { border-color: var(--lamp); }
.lista button small { color: var(--fg-3); }
.cores { display: flex; gap: 6px; flex-wrap: wrap; }
.cores label { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 5px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; font-size: 12.5px; }
.cores label:has(input:checked) { border-color: var(--lamp); background: var(--lamp-soft); }
.cores input { position: absolute; opacity: 0; pointer-events: none; }
.cores i { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0,0,0,.35); }
.toasts { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: grid; gap: 6px; z-index: 50; }
.toast { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-radius: 10px; background: var(--raised); border: 1px solid var(--line-strong); box-shadow: var(--shadow); font-size: 13.5px; }
.toast button { border: 0; background: none; color: var(--lamp-ink); font-weight: 700; }
.legenda { position: absolute; left: 12px; top: 12px; z-index: 4; width: min(440px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow: auto; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; }
.legenda h3 { margin: 0 0 6px; font: 600 17px/1.1 var(--display); color: var(--lamp-ink); }
.legenda h3 + p { margin: 0 0 8px; font-size: 12.5px; color: var(--fg-3); }
.legenda ul { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 5px; }
.legenda li { display: grid; grid-template-columns: 70px 1fr; gap: 10px; align-items: center; font-size: 13px; }
.legenda li b { display: block; font-size: 12px; color: var(--fg-2); }
.legenda svg { display: block; width: 70px; height: 16px; background: #6f4f30; border-radius: 4px; }
.legenda .pe { margin-top: 4px; }
.leg-ed { display: grid; gap: 6px; max-height: 52vh; overflow: auto; }
.leg-ed label { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; font-size: 13px; }
.so-ver { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--lamp-soft); color: var(--lamp-ink); font-weight: 600; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="brand">Quadro de pistas</span>
    <select class="in sel-q" id="selQ" aria-label="Qual quadro"></select>
    <button type="button" class="btn" id="btNovoQ" title="Um quadro novo (ex.: um mistério, uma quest)">+ Quadro</button>
    <button type="button" class="btn" id="btRenomear">Renomear</button>
    <span class="so-ver" id="soVer" hidden>Só olhando</span>
    <button type="button" class="btn" id="btLegenda" aria-pressed="false" title="O que cada cor e cada fio quer dizer">Legenda</button>
    <span class="grow"></span>
    <span id="ferr" class="fiodef-w" style="display:contents">
      <button type="button" class="btn pri" id="btPregar">+ Pregar</button>
      <button type="button" class="btn" id="btLigar" aria-pressed="false" title="Clique num cartão e depois em outro para ligar os dois com um fio">Ligar com fio</button>
      <span class="fiodef" title="O próximo fio"><select id="fioCor" aria-label="A cor do fio"></select><select id="fioTex" aria-label="A textura do fio"></select></span>
    </span>
  </header>
  <div class="palco" id="palco">
    <div class="board" id="board"></div>
    <div class="aviso-ligar" id="avisoLigar" hidden></div>
    <aside class="legenda" id="legenda" hidden aria-label="Legenda"></aside>
    <div class="zoom"><button type="button" class="btn" id="zMenos" aria-label="Afastar">−</button><button type="button" class="btn" id="zAjustar" aria-label="Ver tudo" title="Ver tudo">⤢</button><button type="button" class="btn" id="zMais" aria-label="Aproximar">+</button></div>
    <div class="vazio" id="vazio" hidden></div>
  </div>
</div>
<dialog id="dlg"></dialog>
<div class="toasts" id="toasts"></div>
<script src="../tc/ponte.js?v=21"></script>
<script src="../tc/escudo.js?v=4"></script>
<script src="../tc/missoes.js?v=3"></script>
<script src="../tc/quadro.js?v=2"></script>
<script src="quadro.js?v=2"></script>
</body>
</html>
