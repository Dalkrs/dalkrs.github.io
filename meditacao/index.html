<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meditação · Tiny Cats</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Grenze:wght@500;600;700&display=swap">
<style>
/* Meditação: a cena (o lugar onde os personagens meditam) e, ao lado, o painel — a prática e os pilares de quem
   joga; quem medita, o treinamento e as receitas de quem mestra. As cores da interface são as das outras abas. */
:root {
  color-scheme: dark;
  --table: #0d1017; --surface: #161a24; --raised: #1f2431; --hover: #283042;
  --line: #2b3243; --line-strong: #40495f;
  --fg: #e8eaf0; --fg-2: #a6aec0; --fg-3: #8a93a8;
  --lamp: #e6ab4f; --lamp-ink: #edb960; --lamp-soft: rgba(230, 171, 79, .16); --on-lamp: #1d1503;
  --ok: #6fbf8f; --danger: #f0786e; --secret: #c4b2f2; --ouro: #f3d9a4;
  --shadow: 0 12px 34px rgba(0, 0, 0, .5);
  --ui: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --display: "Grenze", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --table: #c7ced9; --surface: #f2f4f8; --raised: #ffffff; --hover: #e3e8ef;
    --line: #d2d8e2; --line-strong: #aeb8c9;
    --fg: #1a1f2c; --fg-2: #4a5468; --fg-3: #5d6880;
    --lamp: #e2a13a; --lamp-ink: #855605; --lamp-soft: rgba(196, 128, 16, .17); --on-lamp: #241a04;
    --ok: #2f7a55; --danger: #b9342a; --secret: #5b3fb5; --ouro: #7a5410;
    --shadow: 0 12px 34px rgba(40, 50, 72, .24);
  }
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--table); color: var(--fg); font: 14px/1.4 var(--ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; min-width: 0; }

/* ---- barra de cima ---- */
.top { flex: none; display: flex; align-items: center; gap: 8px 10px; padding: 7px 12px; background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; flex-wrap: wrap; }
.brand { font: 600 20px/1 var(--display); color: var(--lamp-ink); white-space: nowrap; }
.na-casca .brand { display: none; }
.grow { flex: 1; }
.seg { display: inline-flex; padding: 2px; border-radius: 9px; border: 1px solid var(--line); background: var(--raised); flex-wrap: wrap; }
.seg button { height: 28px; padding: 0 10px; border: 0; border-radius: 7px; background: none; color: var(--fg-2); font-weight: 600; font-size: 13px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--lamp); color: var(--on-lamp); }
.rot { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg-2); font-weight: 600; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raised); font-weight: 600; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.pri { background: var(--lamp); border-color: var(--lamp); color: var(--on-lamp); }
.btn.pri:hover:not(:disabled) { background: var(--lamp); filter: brightness(1.08); }
.btn.per { color: var(--danger); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.btn.lg { height: 44px; font-size: 15px; padding: 0 16px; }
.ib { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--hover); color: var(--fg); flex: none; font-size: 17px; font-weight: 600; }
.ib:hover:not(:disabled) { border-color: var(--lamp); }
.ib:disabled { opacity: .4; cursor: default; }
.ib.leve { background: none; border-color: transparent; color: var(--fg-2); width: 30px; height: 30px; font-size: 15px; }
.ib.leve:hover:not(:disabled) { background: var(--hover); border-color: var(--line); color: var(--fg); }
.salvo { font: 12px var(--mono); color: var(--fg-3); white-space: nowrap; }
.in { width: 100%; min-width: 0; height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raised); }
textarea.in { height: auto; padding: 8px 10px; line-height: 1.45; resize: vertical; }
select.in { padding: 0 6px; width: auto; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--fg-2); }
.ajuda { font-size: 12px; color: var(--fg-3); margin: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chk { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--fg-2); cursor: pointer; }
.chk input { width: 17px; height: 17px; margin: 0; accent-color: var(--lamp); }

/* ---- área de trabalho: a cena e o painel ---- */
.work { flex: 1; min-height: 0; display: flex; }
.lado { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.painel { flex: 0 0 440px; min-height: 0; overflow: auto; background: var(--surface); border-left: 1px solid var(--line); padding: 16px 16px 70px; display: grid; align-content: start; gap: 18px; }
@media (max-width: 900px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .work { flex-direction: column; }
  .lado { flex: none; }
  .palco { height: 58vh; min-height: 300px; flex: none; }
  .painel { flex: none; border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
}
.sec { display: grid; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); }
.sec:first-child { border-top: 0; padding-top: 0; }
.sec > .cab { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.sec h2 { margin: 0; font: 600 21px/1.15 var(--display); color: var(--fg); }
.sec .cab small { font-size: 12px; color: var(--fg-3); }
.so-mestre { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--secret); }

/* ---- a cena ---- */
.palco { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; background: var(--ceu1, #070a14); isolation: isolate; }
.hora-manha { --ceu1: #7fb6e6; --ceu2: #b9dcf2; --ceu3: #f6e3bf; --astro: #fff6d8; --brilho: .55; --estrelas: 0; --longe: #7d93a8; --meio: #5c7488; --perto: #34434f; --chao: #5d6b4c; --mata: #2f5238; --pedra: #8a8578; --agua: #5f9cc4; --janela: .15; --nevoa: #eef3f7; --areia: #e2c48f; --vaga: 0; --tinta-noite: rgba(0, 0, 0, 0); --tinta: rgba(255, 238, 205, .08); }
.hora-tarde { --ceu1: #4f97d9; --ceu2: #9fcff0; --ceu3: #e9f1f5; --astro: #fffbe8; --brilho: .45; --estrelas: 0; --longe: #7f95ab; --meio: #5a7389; --perto: #33444f; --chao: #66734f; --mata: #2e5536; --pedra: #938d80; --agua: #4f93c4; --janela: .1; --nevoa: #f2f5f8; --areia: #e8cb94; --vaga: 0; --tinta-noite: rgba(0, 0, 0, 0); --tinta: rgba(0, 0, 0, 0); }
.hora-por { --ceu1: #2a1f44; --ceu2: #b4596a; --ceu3: #f4ae66; --astro: #ffd892; --brilho: .85; --estrelas: .15; --longe: #5a3d5e; --meio: #3a2a44; --perto: #221a2b; --chao: #3b2d36; --mata: #231a28; --pedra: #5b4a55; --agua: #7a5a78; --janela: .95; --nevoa: #f6d9c4; --areia: #c98f5a; --vaga: .25; --tinta-noite: rgba(60, 20, 40, .22); --tinta: rgba(255, 130, 80, .16); }
.hora-noite { --ceu1: #060a18; --ceu2: #121b3c; --ceu3: #253058; --astro: #f2efe0; --brilho: .35; --estrelas: 1; --longe: #1c2440; --meio: #141a30; --perto: #0c1020; --chao: #121826; --mata: #0a0f1c; --pedra: #2a3040; --agua: #1c2c4c; --janela: 1; --nevoa: #9fb0cc; --areia: #3b3a48; --vaga: 1; --tinta-noite: rgba(5, 10, 30, .62); --tinta: rgba(8, 16, 50, .52); }
.hora-madrugada { --ceu1: #151a3a; --ceu2: #3a3d6c; --ceu3: #c08aa0; --astro: #f6e7d8; --brilho: .45; --estrelas: .55; --longe: #3a3a5e; --meio: #2a2a48; --perto: #181a30; --chao: #22243a; --mata: #161a2a; --pedra: #45465e; --agua: #3a4a70; --janela: .8; --nevoa: #d9c6d6; --areia: #7a6a78; --vaga: .6; --tinta-noite: rgba(30, 25, 60, .45); --tinta: rgba(50, 40, 100, .34); }
.palco > .fundo { position: absolute; inset: 0; }
.palco > .fundo > svg, .palco > .fundo > img { display: block; width: 100%; height: 100%; }
.palco > .fundo > img { object-fit: cover; }
.palco > .tinta { position: absolute; inset: 0; background: var(--tinta); pointer-events: none; }
.estrelas circle { animation: piscar 4s ease-in-out infinite; }
.estrelas circle:nth-child(3n) { animation-delay: -1.3s; } .estrelas circle:nth-child(3n+1) { animation-delay: -2.6s; }
@keyframes piscar { 0%, 100% { opacity: .95; } 50% { opacity: .4; } }
.vagalume { animation: flutua 6s ease-in-out infinite; }
@keyframes flutua { 0%, 100% { transform: translate(0, 0); opacity: .9; } 50% { transform: translate(6px, -14px); opacity: .25; } }
.queda { animation: cair 1.6s linear infinite; stroke-dasharray: 40 30; }
@keyframes cair { from { stroke-dashoffset: 70; } to { stroke-dashoffset: 0; } }
.cristais { animation: luzir 5s ease-in-out infinite; }
@keyframes luzir { 0%, 100% { opacity: .85; } 50% { opacity: 1; filter: brightness(1.25); } }
@media (prefers-reduced-motion: reduce) { .estrelas circle, .vagalume, .queda, .cristais, .aura { animation: none !important; } }

/* o clima: por cima da cena (só enfeite: os cliques passam) */
.clima { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.clima i { position: absolute; top: -12%; display: block; }
.clima-chuva i, .clima-tempestade i { width: 2px; height: 46px; background: linear-gradient(to bottom, rgba(190, 210, 255, 0), rgba(190, 210, 255, .55)); transform: rotate(14deg); animation: chover var(--t, .8s) linear infinite; }
.clima-tempestade i { height: 60px; --t: .55s; }
@keyframes chover { from { transform: translate(0, 0) rotate(14deg); } to { transform: translate(-28vh, 125vh) rotate(14deg); } }
.clima-tempestade { background: rgba(10, 14, 30, .28); }
.clima-tempestade::after { content: ""; position: absolute; inset: 0; background: #eef3ff; opacity: 0; animation: relampago 9s linear infinite; }
@keyframes relampago { 0%, 91%, 93.5%, 96%, 100% { opacity: 0; } 92% { opacity: .38; } 95% { opacity: .22; } }
.clima-neve i { width: var(--d, 6px); height: var(--d, 6px); border-radius: 50%; background: rgba(250, 252, 255, .9); animation: nevar var(--t, 9s) linear infinite; }
@keyframes nevar { 0% { transform: translate(0, 0); } 50% { transform: translate(28px, 60vh); } 100% { transform: translate(-10px, 125vh); } }
.clima-nevoa { background: linear-gradient(to top, rgba(205, 212, 226, .32), rgba(205, 212, 226, 0) 62%); }
.clima-nevoa i { top: auto; bottom: var(--b, 10%); left: -60%; width: 120%; height: 34%; border-radius: 50%; background: radial-gradient(closest-side, rgba(218, 224, 236, .45), rgba(218, 224, 236, 0)); animation: nevoa var(--t, 46s) linear infinite; }
@keyframes nevoa { from { transform: translateX(0); } to { transform: translateX(110%); } }
.clima-vento i { top: var(--y, 50%); left: -6%; width: 12px; height: 7px; border-radius: 60% 0; background: var(--c, #b8873e); animation: ventar var(--t, 5s) linear infinite; }
@keyframes ventar { 0% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(60vw, -40px) rotate(260deg); } 100% { transform: translate(118vw, 20px) rotate(540deg); } }
.clima-nublado { background: rgba(110, 120, 140, .2); }
.clima-nublado i { top: var(--y, 8%); left: -40%; width: 46%; height: 22%; border-radius: 50%; background: radial-gradient(closest-side, rgba(225, 230, 240, .5), rgba(225, 230, 240, 0)); animation: nuvem var(--t, 70s) linear infinite; }
@keyframes nuvem { from { transform: translateX(0); } to { transform: translateX(320%); } }
.clima-sol { background: radial-gradient(ellipse at 70% 0%, rgba(255, 236, 180, .22), rgba(255, 236, 180, 0) 60%); }
.clima-calor { background: linear-gradient(to top, rgba(255, 140, 60, .2), rgba(255, 200, 120, .06)); }
.clima-calor::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: repeating-linear-gradient(to top, rgba(255, 220, 170, .07) 0 6px, rgba(255, 220, 170, 0) 6px 14px); animation: calor 3s ease-in-out infinite alternate; }
@keyframes calor { from { transform: translateY(0); } to { transform: translateY(-6px); } }
.clima-frio { background: radial-gradient(ellipse at center, rgba(190, 215, 255, 0) 52%, rgba(205, 228, 255, .38)), rgba(150, 190, 240, .1); }
@media (prefers-reduced-motion: reduce) { .clima i { animation: none; opacity: .5; } .clima-tempestade::after, .clima-calor::after { animation: none; } .clima-vento i, .clima-neve i { display: none; } }

/* quem está meditando */
.gente { position: absolute; inset: 0; pointer-events: none; }
.quem { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: auto; background: none; border: 0; padding: 0; color: #f6efe2; }
.quem .ret { position: relative; width: clamp(64px, 8vw, 104px); aspect-ratio: 1; border-radius: 50%; border: 3px solid #f1d8a8; background: #2b2438 center / cover no-repeat; display: grid; place-items: center; font: 600 34px/1 var(--display); color: #e8dcc4; }
.quem .ret img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.quem .aura { position: absolute; inset: -9px; border-radius: 50%; box-shadow: 0 0 0 6px rgba(155, 183, 201, .22), 0 0 36px rgba(155, 183, 201, .55); animation: respira 6s ease-in-out infinite; pointer-events: none; }
@keyframes respira { 0%, 100% { transform: scale(.96); opacity: .75; } 50% { transform: scale(1.04); opacity: 1; } }
.quem .nm { background: rgba(13, 16, 23, .84); border-radius: 999px; padding: 3px 11px; font-weight: 700; font-size: 13px; white-space: nowrap; }
.quem .st { font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 2px 9px; background: rgba(13, 16, 23, .8); color: #e8eaf0; white-space: nowrap; }
.quem .st.lib { color: #8fd6ab; }
.quem[aria-pressed="true"] .ret { border-color: var(--lamp); box-shadow: 0 0 0 3px var(--lamp); }
div.quem { cursor: default; }
.chips { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(13, 16, 23, .74); border: 1px solid rgba(255, 255, 255, .12); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: #eef0f5; }
.chip svg { flex: none; }
.vazio-cena { position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%); max-width: min(520px, 90%); text-align: center; background: rgba(13, 16, 23, .74); color: #eef0f5; border-radius: 10px; padding: 9px 14px; font-size: 13.5px; pointer-events: none; }

/* os ambientes (para quem mestra) */
.ambientes { flex: none; display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px; background: var(--surface); border-top: 1px solid var(--line); }
.amb { flex: none; width: 98px; display: grid; gap: 4px; align-content: start; padding: 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); color: var(--fg); font-size: 12px; font-weight: 600; text-align: center; line-height: 1.25; }
.amb[aria-pressed="true"] { border: 2px solid var(--lamp); padding: 3px; }
.amb .vista { display: block; border-radius: 6px; overflow: hidden; }
.amb .vista svg { display: block; width: 100%; height: 52px; }
.amb.img { place-items: center; align-content: center; border-style: dashed; color: var(--fg-2); }

/* o painel: quem medita, a prática, os pilares */
.cartao { display: grid; gap: 8px; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--raised); }
.cartao.sel { border-color: var(--lamp); }
.cartao .cab { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cartao .cab b { font-size: 15px; }
.cartao .cab small { color: var(--fg-3); font-size: 12.5px; }
.estado { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg-3); }
.estado.sim { color: var(--ok); }
.estado::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.tag { display: inline-flex; align-items: center; min-height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid var(--line-strong); color: var(--fg-2); white-space: nowrap; }
.tag.ok { color: var(--ok); border-color: var(--ok); background: rgba(111, 191, 143, .12); }
.tag.ouro { color: var(--on-lamp); background: var(--lamp); border-color: var(--lamp); }
.linha-ult { font-size: 12.5px; color: var(--fg-3); }
.retrato-p { width: 52px; height: 52px; border-radius: 50%; border: 2px solid #f1d8a8; background: #2b2438 center / cover no-repeat; flex: none; display: grid; place-items: center; font: 600 22px/1 var(--display); color: #e8dcc4; overflow: hidden; }
.retrato-p img { width: 100%; height: 100%; object-fit: cover; }
.pilares { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.pilar { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 0; color: var(--fg); }
.pilar .pedra { width: 100%; aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; background: rgba(255, 255, 255, .03); border: 2px dashed var(--line-strong); color: var(--ouro); }
.pilar.cheio .pedra { background: #2a2f40; border: 2px solid #8a6a2a; }
.pilar .coluna { width: 70%; height: 40px; border-radius: 3px 3px 6px 6px; background: #2f3647; border: 1px solid var(--line-strong); }
.pilar small { font-size: 11.5px; color: var(--fg-3); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pilar:disabled { cursor: default; }
.pilar.alvo .pedra { outline: 2px solid var(--lamp); outline-offset: 2px; }
.pilar .pedra img, .simb img { width: 28px; height: 28px; object-fit: cover; border-radius: 6px; }
.simbolos { display: grid; grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); gap: 6px; }
.simb { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 64px; padding: 6px 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); color: var(--fg); font-size: 12px; }
.simb svg { color: var(--ouro); }
.simb:hover:not(:disabled) { border-color: var(--lamp); }
.simb:disabled { opacity: .45; cursor: default; }
.simb.oculto { opacity: .45; border-style: dashed; }
.simb.escolhido { border: 2px solid var(--lamp); padding: 5px 3px; }
.simb.novo { border-style: dashed; color: var(--fg-2); font-weight: 600; }
.simb.novo small { text-align: center; }
.btn.mini { height: 24px; font-size: 11.5px; padding: 0 7px; }
.res { display: grid; gap: 5px; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); }
.res.achou { border-color: #8a6a2a; background: rgba(230, 171, 79, .1); }
.res.achou b { color: var(--lamp-ink); }
.res .txt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; line-height: 1.5; }
.receita { display: grid; gap: 6px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); }
.receita .cab { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.receita .seq { display: inline-flex; gap: 4px; color: var(--ouro); margin-left: auto; }
.receita .txt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; line-height: 1.5; }
.receita small { color: var(--fg-3); font-size: 12px; }
.reg { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.reg time { font: 12px var(--mono); color: var(--fg-3); }
.reg b { font-weight: 600; }
.reg .achou { color: var(--lamp-ink); }
.barra { display: grid; gap: 6px; }
.barra .cab { display: flex; align-items: center; gap: 8px; }
.barra .cab b { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barra .num { font: 13px var(--mono); }
.barra .trilho { height: 10px; border-radius: 999px; background: var(--hover); overflow: hidden; }
.barra .cheio { height: 100%; background: #9b8ae6; border-radius: 999px; transition: width .2s; }
.barra.completa .cheio { background: var(--lamp); }
.barra small { font-size: 12px; color: var(--fg-3); }
.vazio-p { font-size: 13px; color: var(--fg-3); margin: 0; }

/* receitas e símbolos (quem mestra) */
.tit { margin: 0; font: 600 24px/1.1 var(--display); color: var(--fg); }
.tit small { font: 600 14px var(--ui); color: var(--fg-3); }
.rec-work { flex: 1; min-height: 0; overflow: auto; display: flex; flex-wrap: wrap; align-content: flex-start; }
.rec-lista { flex: 999 1 520px; min-width: 0; padding: 18px; display: grid; gap: 10px; align-content: start; }
.rec-ed { flex: 1 1 400px; max-width: 600px; min-width: 0; padding: 18px; background: var(--surface); border-left: 1px solid var(--line); display: grid; gap: 14px; align-content: start; }
.rec-simb { flex: 1 1 100%; padding: 18px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
.receita.sel { border: 2px solid var(--lamp); padding: 10px 11px; }
.receita button.abrir { all: unset; cursor: pointer; display: grid; gap: 6px; }
.aviso-dup { font-size: 12.5px; color: var(--danger); }
fieldset.grupo { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px 12px; margin: 0; display: grid; gap: 8px; }
fieldset.grupo legend { padding: 0 6px; font-size: 12.5px; color: var(--fg-2); font-weight: 600; }
@media (max-width: 900px) { .rec-ed { border-left: 0; border-top: 1px solid var(--line); max-width: none; } }

/* ---- avisos e janelas ---- */
.toasts { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: grid; gap: 8px; z-index: 50; width: min(560px, calc(100vw - 24px)); }
.toast { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; background: var(--raised); border: 1px solid var(--line-strong); box-shadow: var(--shadow); font-size: 13.5px; }
.toast span { flex: 1; }
.toast button { border: 0; background: none; color: var(--lamp-ink); font-weight: 700; padding: 4px 6px; }
dialog.dl { border: 1px solid var(--line-strong); border-radius: 14px; background: var(--surface); color: var(--fg); padding: 18px; width: min(480px, calc(100vw - 24px)); box-shadow: var(--shadow); }
dialog.dl::backdrop { background: rgba(5, 7, 12, .55); }
dialog.dl h2 { margin: 0 0 8px; font: 600 21px/1.2 var(--display); color: var(--lamp-ink); }
dialog.dl p { margin: 0 0 12px; color: var(--fg-2); }
dialog.dl .pe { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
dialog.dl .lista-esc { display: grid; gap: 8px; max-height: 50vh; overflow: auto; }
dialog.dl #ns-des { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); max-height: 38vh; overflow: auto; }
.vazio { margin: 40px auto; max-width: 520px; text-align: center; color: var(--fg-2); }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top">
    <span class="brand">Meditação</span>
    <span id="barra" class="row" style="gap:8px 10px"></span>
    <span class="grow"></span>
    <span class="salvo" id="salvo" aria-live="polite"></span>
    <button type="button" class="btn sm" id="btDesfazer" disabled title="Desfazer (Ctrl+Z)">Desfazer</button>
  </header>
  <main class="work" id="work">
    <div class="lado" id="lado">
      <div class="palco hora-por" id="palco" aria-label="A cena da meditação"></div>
      <div class="ambientes" id="ambientes" hidden role="group" aria-label="Ambientes"></div>
    </div>
    <aside class="painel" id="painel" aria-label="Painel da meditação"></aside>
  </main>
  <main class="rec-work" id="receitas" hidden aria-label="Receitas e símbolos"></main>
</div>
<input type="file" id="arquivo" accept="image/png,image/jpeg,image/webp" hidden>
<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog class="dl" id="dlg"></dialog>
<script src="../tc/ponte.js?v=13"></script>
<script src="../jornal/nucleo.js?v=1"></script>
<script src="nucleo.js?v=1"></script>
<script src="desenhos.js?v=1"></script>
<script src="meditacao.js?v=1"></script>
</body>
</html>
