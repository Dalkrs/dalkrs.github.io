.band-sgrupo { grid-column: 1 / -1; font: 700 12px var(--ui); color: var(--fg-3); padding-top: 6px; }
.band-divam { display: inline-flex; }
.band-divam .div-am { border-radius: 3px; display: block; }
.band-esc.nenhum { grid-column: span 2; }
.band-img:not(:has(> button:not([hidden]))) { display: none; }
.mundo-dl .band-cla { padding: 8px 10px; border-radius: 9px; border: 1px dashed var(--line-strong); font-size: 13px; }
.band-nota { font-size: 12px; color: var(--fg-3); }
@media (max-width: 560px) {                                  /* no celular: a prévia menor, presa em cima enquanto rola */
  .band-previa { flex: 1 1 100%; min-height: 0; padding: 8px; position: sticky; top: 0; z-index: 2; }
  .band-previa svg, .band-previa img { width: 80px; height: 96px; }
}

/* ---- (lote 8, parte 6) a guerra: a aba, o exército, as unidades e a janela da batalha ---- */
.gu-tipo { display: grid; gap: 8px; padding: 9px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); }
.gu-tipo > .row .ib { flex: none; margin-bottom: 2px; }
/* (lote 12, parte 12d) as máquinas de cerco: os tipos na aba Guerra; quantas na unidade e na fortificação */
.gu-maq { display: grid; gap: 8px; padding: 9px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); }
.gu-maq > .row .ib { flex: none; margin-bottom: 2px; }
.gu-maqs { display: grid; gap: 4px; }
.gu-maqs > .row.gu-nums { flex-wrap: wrap; }
.gu-vant { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 6px; align-items: end; }
.gu-vant-tit { grid-column: 1 / -1; font-size: 12px; font-weight: 600; color: var(--fg-3); }
.gu-enc, .gu-hex { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 9px; border: 1px solid var(--line); background: var(--raised); }
.gu-enc .tx, .gu-hex .tx { flex: 1; min-width: 0; }
.gu-enc .tx b, .gu-hex .tx b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gu-enc .tx small, .gu-hex .tx small { color: var(--fg-3); }
.gu-hex-cor { width: 14px; height: 14px; border-radius: 4px; flex: none; }
.gu-hex-d { background: #7a6858; border: 1px solid #28201a; }
.gu-hex-c { background: #4a1c64; border: 1px solid #a05ad0; }
.gu-unid { border-radius: 10px; border: 1px solid var(--line); background: var(--raised); }
.gu-unid.aberta { border-color: var(--line-strong); }
.gu-unid-tit { display: grid; gap: 1px; width: 100%; padding: 8px 10px; border: 0; background: none; text-align: left; color: var(--fg); cursor: pointer; }
.gu-unid-tit b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gu-unid-tit small { color: var(--fg-3); font-size: 12px; }
.gu-unid-corpo { display: grid; gap: 8px; padding: 0 10px 10px; }
.gu-nums > .field { min-width: 56px; }
.gu-unid-corpo p.note.gu-hp { margin: -2px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }   /* (lote 12, parte 12c) o HP da unidade */
.gu-eqs { display: grid; gap: 6px; justify-items: start; }
.gu-eq { width: 100%; }
.gu-eq > .field:first-child { flex: 3; }
.gu-eq > .field { min-width: 52px; }
.gu-eq .ib { flex: none; margin-bottom: 2px; }
.gu-ficha { align-items: center; }
.gu-retrato { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1px solid var(--line-strong); flex: none; }
.note.aviso { color: var(--danger); }
dialog.mundo-dl.gb { width: min(720px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow: hidden; }
.gb-corpo { max-height: calc(100vh - 48px); overflow-y: auto; overscroll-behavior: contain; padding: 16px 18px 18px; display: grid; gap: 12px; }
.gb-topo { display: flex; align-items: baseline; gap: 10px; }
.gb-topo h2 { margin: 0; }
.gb-topo .note { flex: 1; min-width: 0; }
.gb-lados { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
.gb-x { font: 600 22px/1 var(--display); color: var(--danger); padding-bottom: 8px; }
.gb-sec { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.gb-sec > b { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3); font-weight: 600; }
.gb-tab { display: grid; gap: 3px; font-size: 13px; }
.gb-tab > div { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; padding: 4px 9px; border-radius: 7px; background: var(--raised); }
.gb-tab > div > span { color: var(--fg-2); }
.gb-tab > .gb-cab { background: none; font-size: 12px; }
.gb-tab > .gb-cab b { color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gb-tab3 > div { grid-template-columns: 1.6fr 1fr .8fr; }
.gb-tab > div.acaba span { color: var(--danger); }
.gb-bonus { display: grid; gap: 4px; }
.gb-bonus small, .gb-res small, .gb-mom small { color: var(--fg-3); }
.gb-chips { display: flex; flex-wrap: wrap; gap: 6px; }
/* (lote 18) o que o campo de batalha sugere: cada sugestão numa linha, com o Somar à direita */
.gb-campo-s { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px solid var(--line, rgba(255,255,255,.08)); }
.gb-campo-s.usada > span:first-child { opacity: .6; }
.gb-chip { height: auto; min-height: 28px; padding: 2px 4px 2px 10px; box-shadow: none; white-space: normal; }
.gb-chip .ib { width: 22px; height: 22px; }
.gb-chip.sem-x { padding-right: 10px; }
.gb-chip small { font-weight: 400; white-space: nowrap; }
.mundo-dl .gb-chip input.num { width: 58px; height: 24px; padding: 0 6px; border-radius: 6px; font: 600 13px var(--mono); }
/* (lote 9) os heróis: no exército, o nome, o bônus e Tirar numa linha (o sugerido embaixo); na batalha, dois lados de chips */
.gu-heroi { display: grid; grid-template-columns: minmax(0, 1fr) 74px auto; align-items: center; gap: 2px 8px; }
.gu-heroi > .in { height: 32px; }
.gu-heroi > .note { grid-column: 1 / -1; min-width: 0; }
.gu-heroi-nome { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gb-herois { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
.gb-herois-lado { display: grid; gap: 6px; align-content: start; min-width: 0; }
.gb-herois-lado > select { height: 32px; }
.gb-acao { display: flex; align-items: center; gap: 6px; }
.gb-acao.boa { color: var(--ok); }
.gb-acao .ib { width: 24px; height: 24px; flex: none; }
.gb-form { display: grid; grid-template-columns: 1fr 1fr 74px; gap: 8px; align-items: end; }
.gb-form > select, .gb-form > input { width: 100%; min-width: 0; height: 34px; }
.gb-form > .gb-f-tit { grid-column: 1 / -1; margin: 0; }
.gb-form > .gb-f-mom { grid-column: 1; }
.gb-form > .gb-f-txt { grid-column: 2 / 4; }
.gb-form-mom > .gb-f-txt { grid-column: 1 / -1; }
.gb-form > .gb-f-bts { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; }
.gb-form-mom { margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--line); }
.gb-f-campo { display: grid; gap: 3px; min-width: 0; }
.gb-f-campo > small { font-size: 12px; color: var(--fg-3); }
.mundo-dl .gb-f-campo > select, .mundo-dl .gb-f-campo > input { width: 100%; min-width: 0; }
.gb-form.gb-form-h { grid-template-columns: 1fr 1fr 96px; }
.gb-mom { display: grid; gap: 4px; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); }
.gb-mom.chave { border-color: var(--lamp); box-shadow: inset 3px 0 0 var(--lamp); }
.gb-mom-tit { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.gb-margem { font-weight: 600; color: var(--fg) !important; }
.gb-nota { display: flex; align-items: center; gap: 6px; font-style: italic; color: var(--fg-2); }
.gb-acoes { margin-top: 4px; }
.gb-acoes .gb-parar, .gb-res .gb-parar { flex: 0 1 190px; width: auto; height: 28px; font-size: 13px; }
.gb-fim { display: grid; gap: 8px; padding: 12px; border-radius: 12px; border: 1px solid var(--lamp); background: var(--lamp-soft); }
.gb-fim > b { font: 600 19px/1.2 var(--display); color: var(--lamp-ink); }
.gb-pe { justify-content: flex-end; }
.gb-radios { display: flex; flex-wrap: wrap; gap: 6px; }
.gb-radios label.op { padding: 7px 11px; }
.gb-pergunta { position: sticky; bottom: 0; display: grid; gap: 8px; padding: 12px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); box-shadow: var(--shadow); }
/* a ajuda da batalha: o "?" de cada parte e o painel ao lado (no celular, por cima da batalha) */
.aj-q { display: inline-grid; place-items: center; flex: none; width: 24px; height: 24px; margin: 0 0 0 2px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--fg-3); cursor: pointer; vertical-align: middle; }
.aj-q:hover, .aj-q:focus-visible { color: var(--lamp-ink); background: var(--lamp-soft); }
.gb-sec-tit { display: flex; align-items: center; gap: 2px; min-width: 0; }
.gb-sec-tit > b { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3); font-weight: 600; }
.gb-com-q, .gb-rot-q { display: inline-flex; align-items: center; gap: 2px; }
.gb-fim-tit { display: flex; align-items: center; gap: 4px; }
.gb-fim-tit > b { font: 600 19px/1.2 var(--display); color: var(--lamp-ink); }
.gb-corpo:focus { outline: none; }
dialog.mundo-dl.gb.com-ajuda { width: min(1180px, calc(100% - 24px)); }
dialog.mundo-dl.gb.com-ajuda[open] { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 420px); }
.gb-ajuda { display: grid; grid-template-rows: auto minmax(0, 1fr); max-height: calc(100vh - 48px); border-left: 1px solid var(--line); background: var(--surface); }
.gb-ajuda[hidden] { display: none; }
.aj-topo { display: flex; align-items: center; gap: 8px; padding: 14px 12px 10px 16px; border-bottom: 1px solid var(--line); }
.aj-topo b { flex: 1; font: 600 18px/1.2 var(--display); color: var(--fg); }
.aj-corpo { overflow-y: auto; overscroll-behavior: contain; padding: 12px 16px 20px; display: grid; gap: 14px; align-content: start; font-size: 13.5px; line-height: 1.5; color: var(--fg-2); }
.aj-corpo:focus { outline: none; }
.aj-corpo p { margin: 0; }
.aj-intro { display: grid; gap: 8px; }
.aj-indice { display: flex; flex-wrap: wrap; gap: 6px; }
.aj-sec { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.aj-sec h3 { margin: 0; font: 600 17px/1.25 var(--display); color: var(--fg); }
.aj-sub { display: grid; gap: 6px; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); }
.aj-sub h4 { margin: 0; font-size: 14px; color: var(--fg); }
.aj-ex { padding: 6px 9px; border-radius: 8px; background: var(--lamp-soft); color: var(--fg); }
.aj-ex b { color: var(--lamp-ink); }
.aj-conta summary { cursor: pointer; width: max-content; font-size: 12.5px; font-weight: 600; color: var(--fg-3); }
.aj-conta p { margin-top: 4px; font-family: var(--mono); font-size: 12px; line-height: 1.45; color: var(--fg-2); }
.aj-corpo ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.aj-alvo { animation: aj-marca 1.8s ease-out; }
@keyframes aj-marca { 0%, 45% { box-shadow: 0 0 0 2px var(--lamp); } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .aj-alvo { animation: none; box-shadow: 0 0 0 2px var(--lamp); } }
@media (max-width: 900px) { dialog.mundo-dl.gb.com-ajuda[open] { display: block; } .gb-ajuda { position: absolute; inset: 0; z-index: 3; max-height: none; border-left: 0; } }
@media (max-width: 560px) { .gb-lados, .gb-herois { grid-template-columns: 1fr; } .gb-x { display: none; } .gb-tab > div { grid-template-columns: 1.2fr 1fr 1fr; padding: 4px 6px; }
  .gb-form { grid-template-columns: 1fr 74px; } .gb-form > .gb-f-lado, .gb-form > .gb-f-mom, .gb-form > .gb-f-txt { grid-column: 1 / -1; }
  .gb-form.gb-form-h { grid-template-columns: 1fr 96px; } .gb-form-h > .gb-f-campo:first-of-type { grid-column: 1 / -1; } }

/* ---- tablet e celular ---- */
/* Até 900 px a barra inteira não cabe (tablet em pé, celular deitado): ela encolhe — sem a marca, com a data curta e
   o "Ver como jogador" no menu de mapas (painel.js usa o mesmo limite). O painel tem 280 px: as abas apertam. */
@media (max-width: 900px) {
  .top { gap: 6px; padding: 6px 8px; }
  .brand { display: none; }
  .pick { max-width: 34vw; padding: 0 9px; }
  .como-jogador #diaMenos, .como-jogador #diaMais, .como-jogador #tempoMais, .como-jogador #btDesfazer { display: none; }   /* desligados enquanto isso: abrem espaço para o chip */
  .cal b { padding: 0 4px; }
  .cal .tempo-mais span { display: none; }                 /* na tela estreita, só a ampulheta */
  .cal .tempo { font-size: 11.5px; padding-right: 4px; }
  .cal .tempo .t-longo { display: none; }
  .cal .tempo .t-curto { display: inline; }
  .cal .clima-hoje .c-nome { display: none; }              /* na tela estreita, só o desenho do clima */
  #dataTxt .dt-longa { display: none; }
  #dataTxt .dt-curta { display: inline; }
  #comoJogBox { display: none; }
  .como-jogador .como-chip { display: inline-flex; }
  .tabs { padding: 0 4px; }
  .tab .n { margin-left: 3px; }
}
/* (lote 11, parte 3a) no painel estreito (280 px, ou o do celular), os vãos das abas encolhem um pouco */
@media (max-width: 900px) { .tab { padding: 0 4px; } .tab[aria-selected="true"]::after { left: 4px; right: 4px; } }
@media (max-width: 600px) {
  .salvo:not(.ruim) { display: none; }
  .salvo.ruim { max-width: 90px; }
  .toasts { bottom: 100px; }
}
/* tema claro (tc/tema.js) */
:where(:root[data-claro]) dialog.mundo-dl::backdrop { background: rgba(40, 50, 72, .38); }
:where(:root[data-claro]) .ico.rumor { border-color: var(--fg-3); }

.row > .field.curto { flex: 0 0 72px; min-width: 0; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <span class="brand">Mapa-múndi</span>
    <button type="button" class="pick" id="btMapa" aria-haspopup="menu" title="Trocar de mapa, criar ou renomear"><span id="nomeMapa">Mapa</span><svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="cal" title="A data do mundo">
      <button type="button" class="ib" id="diaMenos" title="Voltar um dia" aria-label="Voltar um dia"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <b id="dataTxt">Dia 1</b>
      <span class="tempo" id="tempoTxt" hidden></span>
      <button type="button" class="clima-hoje" id="climaTxt" hidden></button>
      <button type="button" class="ib" id="diaMais" title="Próximo dia" aria-label="Próximo dia"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      <button type="button" class="btn sm tempo-mais" id="tempoMais" title="+1 tempo" aria-label="Passar 1 tempo"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10M7 21h10M8 3c0 4 3 5.5 4 9-1 3.5-4 5-4 9M16 3c0 4-3 5.5-4 9 1 3.5 4 5 4 9"/></svg><span>+1 tempo</span></button>
    </div>
    <span class="atalhos" id="atalhos" hidden>
      <button type="button" class="btn sm" id="irCenas" title="Vai para a aba Cenas (os mapas de batalha)">Cenas</button>
      <button type="button" class="btn sm" id="irAcamp" title="Vai para a aba Acampamento">Acampamento</button>
    </span>
    <span class="grow"></span>
    <span class="salvo" id="salvo" role="status"></span>
    <label class="sw" id="comoJogBox" title="Mostra o mapa como os jogadores veem: sem o que é só do mestre e com a névoa fechada"><input type="checkbox" id="comoJog"> Ver como jogador</label>
    <button type="button" class="ib" id="btDesfazer" title="Desfazer (Ctrl+Z)" aria-label="Desfazer" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button type="button" class="ib" id="btPainel" title="Mostrar ou esconder o painel" aria-label="Mostrar ou esconder o painel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
  </header>
  <div class="work">
    <nav class="rail" id="rail" aria-label="Ferramentas"></nav>
    <div class="palco" id="palco">
      <div class="mundo" id="mundo"></div>
      <div class="opts" id="opts"></div>
      <div class="dica" id="dica"></div>
      <div class="zoom">
        <button type="button" class="ib" id="zMenos" title="Afastar" aria-label="Afastar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <b id="zTxt">100%</b>
        <button type="button" class="ib" id="zMais" title="Aproximar" aria-label="Aproximar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
        <button type="button" class="ib" id="zCabe" title="Ver o mapa inteiro" aria-label="Ver o mapa inteiro"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="vazio" id="vazio" hidden></div>
    </div>
    <aside class="side" id="side">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="pane" id="pane"></div>
    </aside>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="arq" accept="image/png,image/jpeg,image/webp" hidden>
<noscript><p style="padding:20px">Ative o JavaScript do navegador para usar o mapa-múndi.</p></noscript>

<script src="../tc/tropas.js?v=5"></script>
<script src="../jornal/nucleo.js?v=2"></script>
<script src="nucleo.js?v=48"></script>
<script src="guerra.js?v=8"></script>
<script src="reino.js?v=14"></script>
<script src="corte.js?v=4"></script>
<script src="diplomacia.js?v=3"></script>
<script src="intrigas.js?v=2"></script>
<script src="campanha.js?v=5"></script>
<script src="camadas.js?v=4"></script>
<script src="tela.js?v=33"></script>
<script src="painel.js?v=54"></script>
<script src="guerra-painel.js?v=15"></script>
<script src="guerra-ajuda.js?v=6"></script>
<script src="reino-painel.js?v=16"></script>
<script src="corte-painel.js?v=6"></script>

<script src="intrigas-painel.js?v=2"></script>
<script src="mundo.js?v=19"></script>
</body>
