<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="../tc/tema.js?v=1"></script>
<title>Mapa-múndi · Tiny Cats</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Grenze:wght@500;600;700&family=IM+Fell+English:ital@0;1&family=Cinzel:wght@600;700&display=swap">
<style>
/* Mapa-múndi: a imagem do mundo no centro, com marcadores, grupos, regiões, eventos, rotas, facções e névoa por cima.
   Trilho de ferramentas à esquerda (só o mestre), painel à direita. Mesmas cores da mesa de cenas. */
:root {
  color-scheme: dark;
  --table: #0d1017; --surface: #161a24; --raised: #1f2431; --hover: #283042;
  --line: #2b3243; --line-strong: #40495f;
  --fg: #e8eaf0; --fg-2: #a6aec0; --fg-3: #7d879c;
  --lamp: #e6ab4f; --lamp-ink: #edb960; --lamp-soft: rgba(230, 171, 79, .16); --on-lamp: #1d1503;
  --ok: #6fbf8f; --danger: #f0786e; --secret: #b39cf0;
  --paper: #232a38; --ink-map: #f3ead2;
  --shadow: 0 12px 34px rgba(0, 0, 0, .5);
  --ui: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --display: "Grenze", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, Menlo, Consolas, monospace;
  --mapa: "Cinzel", "Grenze", Georgia, serif;           /* os nomes do mapa (lote 6) */
}
/* tema claro (tc/tema.js) */
:root:where([data-claro]) {
  color-scheme: light;
  --table: #c7ced9; --surface: #f2f4f8; --raised: #ffffff; --hover: #e3e8ef;
  --line: #d2d8e2; --line-strong: #aeb8c9;
  --fg: #1a1f2c; --fg-2: #4a5468; --fg-3: #68738a;
  --lamp: #e2a13a; --lamp-ink: #855605; --lamp-soft: rgba(196, 128, 16, .17); --on-lamp: #241a04;
  --ok: #2f7a55; --danger: #b9342a; --secret: #5b3fb5;
  --paper: #e9e2cf; --ink-map: #2a2418;
  --shadow: 0 12px 34px rgba(40, 50, 72, .24);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--table); color: var(--fg); font: 14px/1.4 var(--ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; min-width: 0; }

/* ---- barra de cima ---- */
.top { flex: none; display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { font: 600 20px/1 var(--display); color: var(--lamp-ink); white-space: nowrap; }
.na-casca .brand { display: none; }
.pick { display: flex; align-items: center; gap: 7px; height: 34px; max-width: 280px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raised); font-weight: 600; }
.pick span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick:hover { background: var(--hover); }
.cal { display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 9px; border: 1px solid var(--line); background: var(--raised); }
.cal b { padding: 0 10px; font-weight: 600; white-space: nowrap; }
/* (lote 7) o tempo de marcha de hoje, junto da data, e o "+1 tempo" que leva todos os grupos junto */
.cal .tempo { padding: 0 8px 0 0; color: var(--fg-2); font-size: 12.5px; white-space: nowrap; }
.cal .tempo-mais { display: inline-flex; align-items: center; gap: 5px; margin-left: 4px; white-space: nowrap; }
.cal .tempo .t-curto { display: none; }
/* (lote 7, parte 5c) o clima de hoje, junto da data (clicar abre a aba Hoje) */
.cal .clima-hoje { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 4px; border: 0; border-radius: 7px; background: none; color: var(--fg-2); font: inherit; font-size: 12.5px; white-space: nowrap; cursor: pointer; }
.cal .clima-hoje:hover { color: var(--fg); background: var(--table); }
.cal .clima-hoje svg { flex: none; }
.grow { flex: 1; }
.ib { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 7px; border: 1px solid transparent; background: none; color: var(--fg-2); }
.ib:hover:not(:disabled) { background: var(--hover); color: var(--fg); border-color: var(--line); }
.ib:disabled { opacity: .4; cursor: default; }
.sw { display: flex; align-items: center; gap: 7px; white-space: nowrap; color: var(--fg-2); font-size: 13px; }
.salvo { font: 12px var(--mono); color: var(--fg-3); white-space: nowrap; }
.salvo.ruim { color: var(--danger); }

/* ---- área de trabalho ---- */
.work { flex: 1; min-height: 0; display: flex; }
.rail { flex: none; width: 50px; padding: 8px 6px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; }
.tool { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 9px; border: 1px solid transparent; background: none; color: var(--fg-2); }
.tool:hover { background: var(--hover); color: var(--fg); }
.tool[aria-pressed="true"] { background: var(--lamp); color: var(--on-lamp); }
.rail hr { width: 100%; border: 0; border-top: 1px solid var(--line); margin: 3px 0; }
.palco { position: relative; flex: 1; min-width: 0; overflow: hidden; background: var(--table); touch-action: none; cursor: grab; }
.palco.t-m, .palco.t-g, .palco.t-r, .palco.t-e, .palco.t-t, .palco.t-f, .palco.t-h, .palco.t-p, .palco.t-n, .palco.t-d { cursor: crosshair; }
.palco.pan { cursor: grabbing; }
.mundo { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.mundo img { display: block; user-select: none; -webkit-user-drag: none; }
.mundo .papel { background: var(--paper); background-image: linear-gradient(rgba(127,127,127,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(127,127,127,.12) 1px, transparent 1px); background-size: 100px 100px; }
.mundo svg { position: absolute; left: 0; top: 0; overflow: visible; }
.mundo canvas.pintura, .mundo canvas.hex-desenho { position: absolute; left: 0; top: 0; pointer-events: none; }
.opts { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
.opts > * { pointer-events: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--fg-2); box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.chip[aria-pressed="true"] { background: var(--lamp); border-color: var(--lamp); color: var(--on-lamp); }
.chip input[type="range"] { width: 110px; }
.dica { position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 232px); padding: 7px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--fg-2); font-size: 13px; pointer-events: none; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); }
.zoom b { min-width: 46px; text-align: center; font: 600 12px var(--mono); color: var(--fg-2); }
/* (lote 8) as camadas: o botão na caixa do zoom (com um ponto quando há camada escondida ou travada) e a janelinha */
.zoom .sep { width: 1px; align-self: stretch; margin: 5px 2px; background: var(--line); }
.zoom .cam-bt { position: relative; }
.zoom .cam-bt.mexido { color: var(--lamp-ink); }
.zoom .cam-bt[aria-expanded="true"] { background: var(--lamp-soft); border-color: var(--lamp); color: var(--lamp-ink); }
.cam-ponto { position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--lamp); box-shadow: 0 0 0 2px var(--surface); }
.cam-pop { position: absolute; right: 10px; bottom: 54px; z-index: 6; width: 292px; max-width: calc(100% - 20px); max-height: calc(100% - 66px); overflow: auto; overscroll-behavior: contain; padding: 10px 10px 9px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); box-shadow: var(--shadow); cursor: default; touch-action: pan-y; }
.cam-topo { display: flex; align-items: center; gap: 8px; margin: 0 0 8px 2px; }
.cam-topo b { font: 600 17px/1.1 var(--display); color: var(--fg); }
.cam-topo span { flex: 1; font-size: 12px; color: var(--fg-3); }
.cam-atalhos { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 8px; }
.cam-atalhos .chip { height: 28px; box-shadow: none; cursor: pointer; }
.cam-atalhos .chip:hover:not([aria-pressed="true"]) { background: var(--hover); color: var(--fg); }
.cam-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.cam-li { display: grid; grid-template-columns: 32px minmax(0, 1fr) 32px; align-items: center; gap: 2px; min-height: 34px; border-radius: 8px; }
.cam-li:hover { background: var(--hover); }
.cam-nome { display: flex; align-items: baseline; gap: 8px; min-width: 0; padding: 7px 2px; font-weight: 600; color: var(--fg); cursor: pointer; user-select: none; }
.cam-nome > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cam-nome small { flex: none; margin-left: auto; font: 500 12px var(--mono); color: var(--fg-3); }
.cam-li.esc .cam-nome { color: var(--fg-3); font-weight: 500; }
.cam-li .cam-olho[aria-pressed="false"] { color: var(--fg-3); }
.cam-li .cam-trava[aria-pressed="false"] { color: var(--fg-3); opacity: .75; }
.cam-li .cam-trava[aria-pressed="true"] { color: var(--lamp-ink); background: var(--lamp-soft); border-color: var(--lamp); }
.cam-pe { display: flex; justify-content: flex-end; margin: 6px 0 0; }
.cam-nota { margin: 8px 2px 0; font-size: 12px; line-height: 1.35; color: var(--fg-3); }
/* (lote 10) o modo do mapa (na janelinha das camadas) e a legenda dele, no canto do mapa */
.cam-rot { display: block; margin: 2px 2px 5px; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); }
.cam-modos { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 10px; }
.cam-modos .chip { height: 28px; box-shadow: none; cursor: pointer; }
.cam-modos .chip:hover:not([aria-pressed="true"]) { background: var(--hover); color: var(--fg); }
.modo-leg { position: absolute; left: 10px; bottom: 52px; z-index: 5; display: grid; gap: 6px; width: max-content; max-width: min(330px, calc(100% - 20px)); padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); box-shadow: var(--shadow); font-size: 12.5px; color: var(--fg-2); cursor: default; }
.modo-leg p { margin: 0; }
.modo-leg-topo { display: flex; align-items: center; gap: 10px; }
.modo-leg-topo b { flex: 1; color: var(--fg); }
.modo-leg ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.modo-leg li { display: inline-flex; align-items: center; gap: 5px; }
.modo-leg li i { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line-strong); }
.modo-leg .grad { height: 10px; border-radius: 5px; background: linear-gradient(90deg, #4caf6a, #e6c34f, #e05a4f); }
.modo-leg .grad-n { display: flex; justify-content: space-between; margin-top: -3px; font-size: 11.5px; color: var(--fg-3); }
.modo-leg-rec { display: flex; align-items: center; gap: 8px; }
.modo-leg-rec .in { flex: 1; min-width: 0; height: 30px; }
/* o que está numa camada travada aparece, mas o clique passa por ele */
#mundo svg .obj.trava, #mundo svg .obj.trava * { pointer-events: none !important; }
.vazio { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; text-align: center; pointer-events: none; }
.vazio > div { max-width: 420px; padding: 22px; border-radius: 14px; border: 1px solid var(--line-strong); background: var(--surface); box-shadow: var(--shadow); pointer-events: auto; }
.vazio h2 { margin: 0 0 6px; font: 600 22px/1.15 var(--display); }
.vazio p { margin: 0 0 14px; color: var(--fg-2); }

/* ---- o que vai por cima do mapa ---- */
svg text { font-family: var(--ui); paint-order: stroke; stroke: rgba(10, 12, 18, .82); stroke-width: 3.2px; stroke-linejoin: round; fill: #f6efe0; pointer-events: none; user-select: none; }
/* os nomes do mapa (lote 6): letra de pedra (Cinzel), clara, com um contorno escuro grosso — nos dois temas, para ler
   bem sobre qualquer imagem. A régua e as siglas dos grupos continuam na letra do site. */
svg text.rotulo, svg text.nome-linha { font-family: var(--mapa); font-weight: 700; }
svg text.rotulo { fill: #f6efe0; stroke: rgba(10, 12, 18, .9); stroke-width: 3.8px; }
svg text.rotulo.regua-txt { font-family: var(--ui); fill: #fff3d6; }
.obj { cursor: pointer; }
.t-sel .obj { cursor: grab; }
.reg { fill-opacity: .2; fill-rule: evenodd; stroke-width: 2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.reg.semfac { fill: #9aa3b5; stroke: #c3cadb; stroke-dasharray: 6 5; }
.reg.subreg { fill-opacity: .16; stroke-width: 1.4; stroke-dasharray: 5 3; }     /* (lote 6) a região de dentro: borda mais fina */
.reg.m-terreno { fill-opacity: 0; }                                            /* (lote 10) os modos do mapa */
.reg.m-clima, .reg.m-perigo { fill-opacity: .4; stroke-opacity: .85; }
.reg.subreg.m-clima, .reg.subreg.m-perigo { fill-opacity: .32; }
.reg.m-economia { fill-opacity: .55; stroke-opacity: .85; }                      /* (lote 10, parte 2) a produção de um recurso */
.reg.m-economia.m-zero { fill-opacity: 0; }
.reg.oculto, .mar.oculto, .eve.oculto, .rot.oculto { opacity: .55; }
.reg-ocup { fill-opacity: .5; stroke: none; pointer-events: none; }               /* (lote 12, parte 12b) a ocupada: as listras de quem ocupa */
.cerco-anel { fill: none; stroke-width: 3; stroke-dasharray: 5 3; pointer-events: none; }   /* (lote 12, parte 12e) o lugar cercado */
.sel-anel { fill: none; stroke: var(--lamp); stroke-width: 2.5; vector-effect: non-scaling-stroke; stroke-dasharray: 5 4; pointer-events: none; }
.rot { fill: none; stroke: #f3ead2; stroke-width: 3; stroke-dasharray: 2 9; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.rot-fundo { fill: none; stroke: rgba(10,12,18,.55); stroke-width: 6; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.rot-hit, .fre-hit { fill: none; stroke: transparent; stroke-width: 18; vector-effect: non-scaling-stroke; }
.fre-a, .fre-b { fill: none; stroke-width: 5; stroke-linecap: round; vector-effect: non-scaling-stroke; stroke-dasharray: 12 12; }
/* (lote 8, parte 6) os hexágonos destruídos (cinzas e rachaduras) e corrompidos (roxo escuro, veios que brilham) */
.c-hexg { pointer-events: none; }
.hexg-d .hexg-fundo { fill: rgba(122, 104, 88, .62); stroke: rgba(40, 32, 26, .8); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.hexg-d .hexg-risco { fill: none; stroke: rgba(18, 14, 12, .85); stroke-linecap: round; stroke-linejoin: round; }
.hexg-c .hexg-fundo { fill: rgba(52, 20, 70, .58); stroke: rgba(150, 70, 200, .75); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.hexg-c .hexg-risco { fill: none; stroke: rgba(196, 120, 255, .75); stroke-linecap: round; stroke-linejoin: round; }
.hexg-c .hexg-brilho { fill: rgba(220, 160, 255, .8); }
.fre-b { stroke-dashoffset: 12; }
.eve-area { fill-opacity: .16; stroke-width: 2; vector-effect: non-scaling-stroke; stroke-dasharray: 3 6; }
.eve-pulso { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; opacity: 0; animation: pulso 3.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.eve-pulso.b { animation-delay: 1.6s; }
@keyframes pulso { 0% { transform: scale(.35); opacity: .7; } 100% { transform: scale(1); opacity: 0; } }
.frente-anda { animation: anda 1.6s linear infinite; }
@keyframes anda { to { stroke-dashoffset: -24; } }
@media (prefers-reduced-motion: reduce) { .eve-pulso, .frente-anda { animation: none; } .eve-pulso { opacity: .3; } }
/* (lote 7, parte 5a) o desenho dos eventos novos: devagar e leve (os meteoros riscando, os raios piscando, a neve caindo,
   a fumaça subindo, os vultos flutuando, o anel girando, a sombra do dragão passando, o brilho da festa) */
.eve-arte { pointer-events: none; }
.eve-anim { transform-box: fill-box; transform-origin: center; }
.eve-risca { stroke-dasharray: 16 84; animation: eve-risca 2.8s linear infinite; }
@keyframes eve-risca { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
.eve-raio { opacity: 0; animation: eve-raio 4.2s steps(1) infinite; }
@keyframes eve-raio { 0%, 84%, 100% { opacity: 0; } 85% { opacity: 1; } 88% { opacity: .15; } 90% { opacity: .9; } 93% { opacity: 0; } }
.eve-respira { animation: eve-respira 6s ease-in-out infinite; }
@keyframes eve-respira { 0%, 100% { opacity: .55; } 50% { opacity: .95; } }
.eve-neva { animation: eve-neva 5s linear infinite; }
@keyframes eve-neva { 0% { transform: translateY(-120%); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(380%); opacity: 0; } }
.eve-sobe { animation: eve-sobe 5.5s ease-out infinite; }
@keyframes eve-sobe { 0% { transform: translate(0, 0) scale(.6); opacity: 0; } 20% { opacity: .55; } 100% { transform: translate(30%, -260%) scale(1.5); opacity: 0; } }
.eve-flutua { animation: eve-flutua 7s ease-in-out infinite; }
@keyframes eve-flutua { 0%, 100% { transform: translate(0, 0); opacity: .2; } 50% { transform: translate(25%, -40%); opacity: .45; } }
.eve-gira { animation: eve-gira 40s linear infinite; }
@keyframes eve-gira { to { transform: rotate(360deg); } }
.eve-flui { stroke-dasharray: 6 10; animation: eve-flui 1.6s linear infinite; }
@keyframes eve-flui { to { stroke-dashoffset: -16; } }
.eve-brilha { animation: eve-brilha 3.6s ease-in-out infinite; }
@keyframes eve-brilha { 0%, 100% { opacity: .15; transform: scale(.7); } 50% { opacity: .9; transform: scale(1.1); } }
.eve-plana { opacity: 0; animation: eve-plana 11s ease-in-out infinite; }
@keyframes eve-plana { 0% { transform: translate(-90%, 20%); opacity: 0; } 20%, 80% { opacity: .35; } 100% { transform: translate(90%, -20%); opacity: 0; } }
.eve.inativo .eve-anim { animation: none; }
.eve.inativo .eve-raio, .eve.inativo .eve-plana { opacity: .4; }
@media (prefers-reduced-motion: reduce) { .eve-anim { animation: none !important; } .eve-raio, .eve-plana { opacity: .45; } }
.selo { stroke: rgba(10,12,18,.85); stroke-width: 1.5; }
.glifo { fill: none; stroke: #14171f; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.rumor .selo { fill: #2b3243; stroke: #f3ead2; stroke-dasharray: 3 3; }
.rumor .glifo { stroke: #f3ead2; }
.falso { opacity: .6; }
.falso .risco { stroke: var(--danger); stroke-width: 3; stroke-linecap: round; }
.grupo-base { stroke: #14171f; stroke-width: 2.5; }
.grupo-anel { fill: none; stroke: #fff; stroke-width: 2; opacity: .85; }
/* (lote 6) as bolinhas da travessia, em cima do grupo: vazias escuras com a borda na cor dele; cheias, na cor dele */
.bolinhas .bol { fill: rgba(10, 12, 18, .78); stroke-width: 1.5; }   /* (a cor do grupo vai no estilo de cada uma) */
.bolinhas .bol.feita { stroke: rgba(10, 12, 18, .85); stroke-width: 1.2; }
svg text.bol-conta { font-family: var(--ui); font-weight: 700; fill: #fff3d6; stroke: rgba(10, 12, 18, .9); stroke-width: 3px; paint-order: stroke; }
/* (lote 6) o selo de honra junto do grupo: o corpo na cor da honra (aço no 0, ouro no alto, escuro quando negativa) */
.honra .hon-fundo { fill: rgba(20, 23, 31, .86); stroke: #fff; stroke-width: 1.2; }
.honra .hon-aro { fill: none; stroke: #f0cb4c; }
.honra .hon-raios { fill: #f6d77a; opacity: .85; }
/* (lote 8) a honra de ±6 a ±10: a segunda volta de raios, as asas, as pedras, o halo e a estrela; a brasa e as correntes */
.honra .hon-raios2 { fill: #fff0b8; opacity: .8; }
.honra .hon-asa { fill: #fff6dc; stroke: #9a7a2a; stroke-width: .7; stroke-linejoin: round; }
.honra .hon-pedra { fill: #6fc3e8; stroke: #123142; stroke-width: .6; }
.honra .hon-halo { fill: none; stroke: #fff3c4; stroke-width: 1.2; opacity: .75; }
.honra .hon-estrela { fill: #fffbe8; stroke: #b48a1f; stroke-width: .7; stroke-linejoin: round; }
.honra .hon-brasa { fill: none; stroke: #6a1a12; stroke-width: 2.4; opacity: .85; }
.honra .hon-corrente { fill: none; stroke: #2b2724; stroke-width: 1.5; stroke-linecap: round; opacity: .9; }
.honra .hon-louro { fill: #8db255; stroke: #34501e; stroke-width: .6; }
.honra .hon-ico .hb { stroke: #1d1a16; stroke-width: 1.1; stroke-linejoin: round; }
.honra .hon-ico .hk { fill: #1d1a16; stroke: none; }
.honra .hon-ico .hd { fill: none; stroke: #1d1a16; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; opacity: .7; }
.honra .hon-ico .hg { fill: #9ea3a8; stroke: #1d1a16; stroke-width: .8; }
.honra.h-pos .hon-ico .hg { fill: #4f86c0; }
.honra.h3 .hon-ico .hg, .honra.h4 .hon-ico .hg, .honra.h5 .hon-ico .hg { fill: #d8463c; }
.honra.h-neg .hon-ico .hg { fill: #4a4540; }
.honra .hon-racha { fill: none; stroke: #0f0d0b; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.honra .hon-lasca { fill: rgba(20, 23, 31, .95); }
.honra .hon-num-fundo { fill: rgba(20, 23, 31, .9); stroke: #fff; stroke-width: .8; }
.honra.h-pos .hon-num-fundo { stroke: #f0cb4c; }
.honra.h-neg .hon-num-fundo { stroke: #8f8981; }
svg text.hon-num { font-family: var(--ui); font-weight: 700; fill: #fff3d6; }
.nevoa { fill: #05070c; }
.alca { fill: var(--lamp); stroke: #14171f; stroke-width: 1.5; vector-effect: non-scaling-stroke; cursor: move; }
.rasc { fill: rgba(230,171,79,.14); fill-rule: evenodd; stroke: var(--lamp); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-dasharray: 5 4; pointer-events: none; }
.regua { stroke: var(--lamp); stroke-width: 2.5; vector-effect: non-scaling-stroke; pointer-events: none; }
.pincel { fill: rgba(230,171,79,.12); stroke: var(--lamp); stroke-width: 1.5; vector-effect: non-scaling-stroke; pointer-events: none; }
/* a grade de hexágonos e o terreno de cada um (por baixo de tudo, sem pegar o clique) */
.c-hex { pointer-events: none; }
.grade-linha { stroke: var(--ink-map); stroke-linecap: round; }
.hex-custo text { font: 700 11px var(--mono); fill: #ffe2a8; }
.regua-hex { fill: rgba(230,171,79,.10); stroke: var(--lamp); stroke-width: 1; stroke-opacity: .8; vector-effect: non-scaling-stroke; pointer-events: none; }
.pincel-hex { fill: rgba(230,171,79,.08); stroke: var(--lamp); stroke-width: 1.5; vector-effect: non-scaling-stroke; pointer-events: none; }
.c-tra.hexes { opacity: .62; }
.hex-nada { fill: none; stroke: var(--ink-map); stroke-width: 1.5; stroke-dasharray: 3 4; stroke-opacity: .75; vector-effect: non-scaling-stroke; }
/* o desenho: carimbos, textos livres, rios, estradas e trilhas (crescem e encolhem com o mapa) */
.carimbo path { fill: none; stroke: #2a2118; stroke-width: 1.15; stroke-linejoin: round; stroke-linecap: round; }
.carimbo .cc { fill: currentColor; }
.carimbo .tc { stroke: currentColor; stroke-width: 1.5; }
.car.oculto, .txt.oculto, .lin.oculto, .zon.oculto { opacity: .55; }
.car.previa { opacity: .75; pointer-events: none; }
.car.car-junto { display: none; }                  /* (lote 29) com o zoom afastado, o carimbo que cairia em cima de outro sai da vista */
.car.previa.fantasma { opacity: .38; }
svg text.texto-livre { pointer-events: auto; paint-order: stroke; stroke-linejoin: round; user-select: none; cursor: inherit; }
.rio { stroke-width: 1.2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.lin-fundo { fill: none; stroke: rgba(246,239,224,.42); stroke-linecap: round; stroke-linejoin: round; }
.lin-traco { fill: none; stroke-linejoin: round; }
.lin-hit { fill: none; stroke: transparent; stroke-width: 16; vector-effect: non-scaling-stroke; }
.lin-guia { fill: none; stroke: none; }
svg text.nome-linha { letter-spacing: .06em; stroke: rgba(10, 12, 18, .88); paint-order: stroke; }
/* a zona de guerra: listras nas cores das duas facções; pulsa enquanto está ativa */
.zona { fill-opacity: .36; }
.zona-pulsa { animation: zona-pulsa 3s ease-in-out infinite; }
@keyframes zona-pulsa { 0%, 100% { fill-opacity: .24; } 50% { fill-opacity: .5; } }
.zona-borda { fill: none; stroke-width: 2.5; stroke-dasharray: 10 10; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.zona-borda.b { stroke-dashoffset: 10; }
.zon.inativa { opacity: .45; }
.zon.inativa .zona { fill-opacity: .14; }
.zona.zona-perigo { fill-opacity: 1; }
.zona-borda-perigo { stroke-dasharray: 4 6; stroke-width: 2; }
.zon-perigo.inativa .zona { fill-opacity: .4; }
/* (lote 7, parte 5c) o clima no painel: a linha de hoje e a tabela (mês a mês, e o ajuste da região) */
.clima-linha { display: flex; align-items: center; gap: 8px; margin: 2px 0 6px; }
.clima-linha small { color: var(--fg-2); }
.tabela-clima { display: grid; gap: 4px; margin: 4px 0 6px; }
.tc-linha { display: grid; grid-template-columns: 18px 1fr auto auto; align-items: center; gap: 8px; font-size: 13px; }
.tc-linha .in { width: 78px; }
.tc-linha select.in { width: 128px; }
svg.sem-pulso .zona-pulsa { animation: none; }
@media (prefers-reduced-motion: reduce) { .zona-pulsa { animation: none; fill-opacity: .4; } }
.chip .amostra { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line-strong); flex: none; }
.chip input.num { width: 62px; height: 24px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--raised); font: 600 13px var(--mono); }

/* ---- painel ---- */
.side { flex: none; width: 330px; display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-left: 1px solid var(--line); }
/* (lote 11, parte 3a) as abas em duas fileiras, por assunto (o mapa; a política): todas à vista, com a letra normal */
.tabs { flex: none; display: flex; flex-direction: column; padding: 0 4px; border-bottom: 1px solid var(--line); }
.tabs-fila { display: flex; }
.tabs-fila + .tabs-fila { border-top: 1px solid var(--line); }
.tab { position: relative; flex: 1 1 auto; height: 34px; padding: 0 6px; border: 0; background: none; color: var(--fg-2); font-weight: 600; font-size: 13px; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--lamp-ink); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: -1px; height: 2px; background: var(--lamp); border-radius: 2px; }
.pane { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.pane h3 { margin: 0; font: 600 19px/1.2 var(--display); }
.pane .sub { color: var(--fg-3); font-size: 12.5px; margin-top: -8px; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--fg-2); }
.in { width: 100%; min-width: 0; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raised); }
textarea.in { height: auto; min-height: 64px; padding: 8px 10px; resize: vertical; line-height: 1.4; }
.row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
.row > .field { flex: 1; min-width: 90px; }
.btn { height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raised); font-weight: 600; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.pri { background: var(--lamp); border-color: var(--lamp); color: var(--on-lamp); }
.btn.pri:hover:not(:disabled) { background: var(--lamp); filter: brightness(1.08); }
.btn.per { color: var(--danger); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 13px; }
.note { margin: 0; color: var(--fg-3); font-size: 12.5px; }
.sec { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.sec > b { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3); font-weight: 600; }
.sec.dobra { gap: 0; }
.sec.dobra[open] { gap: 10px; }
.sec.dobra > summary { display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none; padding: 2px 0; }
.sec.dobra > summary::-webkit-details-marker { display: none; }
.sec.dobra > summary::after { content: ""; flex: none; width: 7px; height: 7px; margin-left: auto; border-right: 2px solid var(--fg-3); border-bottom: 2px solid var(--fg-3); transform: rotate(-45deg); transition: transform .15s; }
.sec.dobra[open] > summary::after { transform: rotate(45deg); }
.sec.dobra > summary > b { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3); font-weight: 600; }
.sec.dobra > summary .sec-res { flex: 1 1 auto; min-width: 0; text-align: right; font-size: 12px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sec.dobra[open] > summary .sec-res { display: none; }
/* (lote 26) as abas de quem mestra em grupos, e o botão da Política com a lista */
.tabs[data-modo="grupos"] { flex-direction: row; align-items: stretch; gap: 2px; padding: 4px 6px 0; overflow: visible; }
.tabs-grupo { display: flex; flex-direction: column; min-width: 0; }
.tabs-grupo + .tabs-grupo { border-left: 1px solid var(--line); padding-left: 4px; }
.tabs-g { font-size: 10px; font-weight: 600; color: var(--fg-3); padding: 0 6px; letter-spacing: .02em; }
.tabs-gb { display: flex; position: relative; }
.tabs[data-modo="grupos"] .tab { flex: 0 0 auto; }
.tab-pol .pol-seta { margin-left: 4px; font-size: 10px; opacity: .7; }
.pol-lista { position: absolute; top: 100%; left: 0; z-index: 40; min-width: 180px; padding: 6px; display: flex; flex-direction: column; gap: 2px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.pol-lista[hidden] { display: none; }
.pol-lista .tab { height: 34px; text-align: left; padding: 0 10px; border-radius: 7px; }
.pol-lista .tab:hover { background: var(--hover); }
.pol-lista .tab[aria-selected="true"] { background: var(--lamp); color: var(--on-lamp); }
.pol-lista .tab[aria-selected="true"]::after { display: none; }
.rail-g { flex: none; align-self: center; font-size: 9.5px; font-weight: 600; color: var(--fg-3); margin: 2px 0 0; user-select: none; }
/* (lote 26) a sanfona da data */
.cal { position: relative; }
#dataTxt { cursor: pointer; }
.sanfona-data { position: absolute; top: calc(100% + 8px); left: 0; z-index: 60; width: 320px; max-width: calc(100vw - 24px); padding: 12px; display: flex; flex-direction: column; gap: 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 14px 34px rgba(0,0,0,.4); font-weight: 400; }
.sanfona-data .sf-cab { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.sanfona-data .sf-hoje { display: flex; flex-direction: column; min-width: 0; }
.sanfona-data .sf-rot { font-size: 11px; color: var(--fg-3); }
.sanfona-data b { padding: 0; }
.sanfona-data .sf-hoje b { font-size: 14.5px; white-space: normal; }
.sanfona-data .sf-cab .btn { flex: none; }
.sanfona-data .sf-titulo { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3); font-weight: 600; border-top: 1px solid var(--line); padding-top: 8px; }
.sanfona-data .sf-lista { display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; }
.sanfona-data .sf-lin { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px; row-gap: 1px; align-items: center; padding: 7px 10px; border-radius: 8px; background: var(--hover); border: 1px solid transparent; }
.sanfona-data .sf-lin .sf-nome { grid-column: 1; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sanfona-data .sf-lin .sf-dt { grid-column: 1; font-size: 12px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sanfona-data .sf-lin .sf-agora { grid-column: 2; grid-row: 1 / span 2; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; color: var(--lamp-ink); background: var(--lamp-soft); }
.sanfona-data .sf-lin.agora { border-color: var(--lamp); }
.sanfona-data .sf-pe { display: flex; justify-content: flex-end; }
/* (lote 26) a cor de cada grupo das abas: o nome do grupo, o traço da aba aberta e a faixa no alto do painel */
:root { --g-sessao: #5fb9a6; --g-politica: #d57f8f; --g-preparar: #8ba3e0; }
:root:where([data-claro]) { --g-sessao: #1f7a68; --g-politica: #a83c52; --g-preparar: #3d5bb0; }
.tabs-grupo[data-grupo="sessao"] { --gc: var(--g-sessao); }
.tabs-grupo[data-grupo="politica"] { --gc: var(--g-politica); }
.tabs-grupo[data-grupo="preparar"] { --gc: var(--g-preparar); }
.tabs[data-modo="grupos"] .tabs-g { color: var(--gc); display: flex; align-items: center; gap: 5px; }
.tabs[data-modo="grupos"] .tabs-g::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--gc); }
.tabs[data-modo="grupos"] .tabs-grupo .tab[aria-selected="true"] { color: var(--gc); }
.tabs[data-modo="grupos"] .tabs-grupo .tab[aria-selected="true"]::after { background: var(--gc); }
.tabs[data-modo="grupos"] .pol-lista .tab[aria-selected="true"] { background: var(--gc); color: var(--surface); }
.pane[data-grupo="sessao"] { --gc: var(--g-sessao); }
.pane[data-grupo="politica"] { --gc: var(--g-politica); }
.pane[data-grupo="preparar"] { --gc: var(--g-preparar); }
.pane[data-grupo]:not([data-grupo=""]) { box-shadow: inset 0 3px 0 var(--gc); }
.pane[data-grupo]:not([data-grupo=""]) h3 { color: var(--gc); }
.pane[data-grupo]:not([data-grupo=""]) .sec.dobra > summary::after { border-color: var(--gc); }
.tabs[data-modo="grupos"] .tabs-grupo { background: color-mix(in srgb, var(--gc) 9%, transparent); border-radius: 8px 8px 0 0; padding-top: 3px; }
.tabs[data-modo="grupos"] .tabs-grupo + .tabs-grupo { border-left: 0; padding-left: 0; margin-left: 3px; }
.tabs[data-modo="grupos"] .tabs-grupo:has(.tab[aria-selected="true"]) { background: color-mix(in srgb, var(--gc) 18%, transparent); }
.pane[data-grupo]:not([data-grupo=""]) { background: linear-gradient(color-mix(in srgb, var(--gc) 8%, transparent), transparent 140px); }
.pane[data-grupo]:not([data-grupo=""]) .sec.dobra > summary > b, .pane[data-grupo]:not([data-grupo=""]) .sec > b { color: var(--gc); }
.segredo { border-left: 3px solid var(--secret); padding-left: 9px; }
.grade { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.grade button { display: grid; place-items: center; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); color: var(--fg-2); }
.grade button[aria-pressed="true"] { border-color: var(--lamp); background: var(--lamp-soft); color: var(--lamp-ink); }
.li { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 9px; border: 1px solid var(--line); background: var(--raised); }
.li i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.li .tx { flex: 1; min-width: 0; }
.li .tx b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .tx small { color: var(--fg-3); }
.li.clic { cursor: pointer; }
.li.clic:hover { border-color: var(--line-strong); }
.rel { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.rel span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600; border: 1px solid var(--line-strong); }
.tag.guerra { color: var(--danger); border-color: var(--danger); }
.tag.alianca { color: var(--ok); border-color: var(--ok); }
.tag.tensao { color: var(--lamp-ink); border-color: var(--lamp); }
.publico { white-space: pre-wrap; margin: 0; }
.menu { position: fixed; z-index: 40; min-width: 230px; max-width: 320px; padding: 6px; border-radius: 11px; border: 1px solid var(--line-strong); background: var(--surface); box-shadow: var(--shadow); }
.menu button { display: block; width: 100%; text-align: left; padding: 8px 10px; border: 0; border-radius: 7px; background: none; font-weight: 600; }
.menu button:hover { background: var(--hover); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.toasts { position: fixed; z-index: 30; left: 12px; right: 12px; bottom: 16px; display: grid; gap: 6px; justify-items: center; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; max-width: min(560px, calc(100vw - 24px)); padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--raised); box-shadow: var(--shadow); }
.toast button { border: 0; background: none; color: var(--lamp-ink); font-weight: 700; padding: 0; }
.jogador .rail, .jogador #comoJogBox, .jogador #btDesfazer, .jogador #diaMenos, .jogador #diaMais, .jogador #tempoMais { display: none; }
@media (max-width: 900px) { .side { width: 280px; } .atalhos { display: none; } }
@media (max-width: 680px) { .side { position: absolute; right: 0; top: 0; bottom: 0; z-index: 5; width: min(300px, 86%); box-shadow: var(--shadow); } .work { position: relative; } .side.fechado { display: none; } }

/* ================= tela (tela.js): mapa, camadas do SVG, trilho, opções e dica ================= */
.palco { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.palco.t-ver .obj { cursor: pointer; }
/* sem mapa ou vendo como jogador as ferramentas de criar ficam desligadas: que pareçam desligadas */
.tool:disabled { opacity: .35; cursor: default; }
.tool:disabled:hover { background: none; color: var(--fg-2); }
.mundo.movendo { will-change: transform; }     /* só enquanto arrasta ou dá zoom: desliza sem repintar */
.mundo svg.camadas { transform-origin: 0 0; }
.c-nev, .c-rasc, .eve-pulso { pointer-events: none; }

/* rótulos (dentro dos grupos de tamanho fixo: 1 unidade = 1 px na tela) */
.rotulo { font-size: 13px; font-weight: 700; letter-spacing: .02em; }
.rotulo-reg { font-size: 12px; font-weight: 700; letter-spacing: .12em; }   /* nome de região: versal espaçado, como num mapa */
.rotulo-reg.rotulo-subreg { font-size: 10px; letter-spacing: .1em; }            /* (lote 6) o nome da região de dentro, menor */
.rotulo-linha { letter-spacing: .04em; }
.sigla { font-size: 11.5px; font-weight: 700; letter-spacing: .02em; }
.sigla.escura { fill: #14171f; stroke: none; }
/* (lote 7, parte 5b) os grupos do mundo: o desenho do tipo no token; a rota de quem anda, fina, ao selecionar, com as
   bandeirinhas das paradas e a seta do sentido; a prévia do traçado; o clique pedido pelo painel */
.gru-glifo { stroke: #fff; stroke-width: 2.1; }
.gru-glifo.escura { stroke: #14171f; }
.gru-mundo .grupo-anel { stroke-dasharray: 4 3; }
.sel-rota { fill: none; stroke: var(--lamp); stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-dasharray: 7 5; stroke-linecap: round; pointer-events: none; opacity: .9; }
.sel-rota.previa { stroke: #8fd18f; stroke-width: 2.4; stroke-dasharray: 3 5; }
.sel-rota-seta { fill: none; stroke: var(--lamp); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.parada { pointer-events: none; }
.parada-mastro { stroke: #14171f; stroke-width: 1.6; }
.parada-flamula { fill: var(--lamp); stroke: #14171f; stroke-width: 1; }
.parada-pe { fill: #14171f; }
.palco.pegando, .palco.pegando .obj { cursor: crosshair; }
.regua-txt { font-size: 13px; font-weight: 700; fill: #fff3d6; }
.alvo, .alca-alvo { fill: transparent; }
.alca-alvo { cursor: move; }

/* esconder dos jogadores: o mestre vê esmaecido (o grupo inteiro, uma vez só) */
.obj.oculto { opacity: .55; }
/* evento fora da data de hoje (só o mestre vê) */
.eve.inativo { opacity: .4; }
.eve.inativo .eve-area { stroke-dasharray: 2 7; }

/* (lote 9) a missão no ícone: "!" dourado (ativa), ✓ verde (concluída), ✕ cinza (falhou); a que só o mestre vê, tracejada */
.missao .mis-bola { fill: #f2c14e; stroke: #2b2410; stroke-width: 1.5; }
.missao .mis-sinal { fill: none; stroke: #2b2410; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
.missao .mis-ponto { fill: #2b2410; }
.missao.m-feita .mis-bola { fill: #3f9d5a; stroke: #f3ead2; }
.missao.m-feita .mis-sinal { stroke: #ffffff; }
.missao.m-falhou .mis-bola { fill: #8a92a6; stroke: #f3ead2; }
.missao.m-falhou .mis-sinal { stroke: #1d2230; }
.missao.so-mestre .mis-bola { stroke-dasharray: 3 2.2; }
.missao.perdida .mis-bola { fill: #c9ced9; }
/* a marca da missão no painel (as mesmas cores) */
.mis-ico { display: inline-grid; place-items: center; flex: none; width: 18px; height: 18px; border-radius: 50%; background: #f2c14e; color: #2b2410; }
.mis-ico.m-feita { background: #3f9d5a; color: #fff; }
.mis-ico.m-falhou { background: #8a92a6; color: #1d2230; }
.mis-linha { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin: 0 0 6px; }
.tag.ok { color: var(--ok); border-color: var(--ok); }

/* (lote 9) o descanso: o grupo dormindo ("zZ") e o ponto de descanso (a lua) — só o mestre vê */
.dorme .dorme-bola { fill: #26304a; stroke: #b9c7f0; stroke-width: 1.4; }
/* (lote 15) a força do exército (só o mestre): os soldados, e os selinhos dos magos e das máquinas de cerco */
.forca .forca-fundo { fill: rgba(16, 18, 25, .9); stroke: rgba(255, 243, 214, .55); stroke-width: .9; }
.forca .forca-magos .forca-fundo { fill: #3b2a6e; stroke: #b9a3ff; }
.forca .forca-maq .forca-fundo { fill: #4a3720; stroke: #e0b979; }
svg text.forca-n { font-family: var(--ui); font-weight: 800; fill: #fff3d6; stroke-width: 0; }
/* (lote 41) a veterania média do exército, em cima do token */
.veter .veter-fundo { fill: rgba(16, 18, 25, .92); stroke: #e6ab4f; stroke-width: .9; }
.veter .veter-div path { fill: none; stroke: #5b6378; stroke-width: 3.8; stroke-linecap: round; stroke-linejoin: round; }
.veter .veter-div path.on { stroke: #e6ab4f; }
.veter .veter-div path.estrela { fill: #f2c94c; stroke: #b07f1f; stroke-width: 1.6; }     /* (lote 56) a Lendária e a Mítica */
svg text.veter-n { font-family: var(--ui); font-weight: 800; fill: #edb960; stroke-width: 0; }
.forca .forca-ico { fill: #e3d8ff; stroke: none; }
.forca .forca-ico.roda { fill: none; stroke: #f3dcae; stroke-width: 1.2; }
.dorme .dorme-z { fill: #dfe6ff; font-weight: 800; stroke-width: 0; letter-spacing: -0.5px; }
.pdesc-selo .pdesc-bola { fill: #26304a; stroke: #f3ead2; stroke-width: 1.3; }
.pdesc-selo .pdesc-lua { fill: #f2d98a; stroke: none; }

/* marcador de boato */
.rumor-bola { fill: #2b3243; stroke: #f3ead2; stroke-width: 1.4; }
.interroga { font-size: 11px; font-weight: 700; fill: #f3ead2; stroke-width: 0; }

/* rotas: cada via com seu traço; o trecho já andado pelos grupos fica cheio */
.rot.via-estrada { stroke-dasharray: 9 6; }
.rot.via-selvagem { stroke-dasharray: 1 7; }
.rot.via-rio, .rot.via-mar, .rot-andado.via-rio, .rot-andado.via-mar { stroke: #9fd0f0; }
.rot-andado { fill: none; stroke: #f3ead2; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }

/* frente em combate: os dois lados andam juntos, meio passo um do outro (com a animação única lá de cima
   o lado B andava mais rápido que o A e os dois se cobriam) */
.fre-a.frente-anda { animation: anda-a 1.6s linear infinite; }
.fre-b.frente-anda { animation: anda-b 1.6s linear infinite; }
@keyframes anda-a { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -24; } }
@keyframes anda-b { from { stroke-dashoffset: 12; } to { stroke-dashoffset: -12; } }
@media (prefers-reduced-motion: reduce) { .fre-a.frente-anda, .fre-b.frente-anda { animation: none; } }

/* (lote 17) a zona de guerra automática (os hexágonos listrados, a borda e a linha do front), as viagens por mar, as setas
   de ofensiva, os recursos dos hexágonos (com o pincel) e a caneta */
.c-zag, .c-mlan, .c-setg, .c-hexr, .c-rab { pointer-events: none; }
.zag-hex { opacity: .3; }
.zag-borda { fill: none; stroke: rgba(196, 64, 52, .85); stroke-width: 2; stroke-dasharray: 7 5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.zag-front { stroke-width: 4.5; }
.mar-rota { fill: none; stroke: #9fd0f0; stroke-width: 2.2; stroke-dasharray: 3 7; stroke-linecap: round; vector-effect: non-scaling-stroke; opacity: .9; }
.rotulo.rotulo-mar { fill: #cfe6f7; }
.rot-mar { fill: none; stroke: #9fd0f0; stroke-width: 3.2; stroke-dasharray: 8 6; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.set-fundo { fill: none; stroke: rgba(10, 12, 18, .5); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.set-linha { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 16 8; vector-effect: non-scaling-stroke; }
.set-anda { animation: anda-seta 1.3s linear infinite; }
@keyframes anda-seta { to { stroke-dashoffset: -24; } }
.set-ponta { stroke: rgba(10, 12, 18, .65); stroke-width: 1.2; stroke-linejoin: round; }
.set-hit { fill: none; stroke: transparent; stroke-width: 18; vector-effect: non-scaling-stroke; }
.setg { opacity: .92; }
.camadas.quieto .set-anda { animation-play-state: paused; }
.camadas.sem-marcha .set-anda { animation: none; }
@media (prefers-reduced-motion: reduce) { .set-anda { animation: none; } }
.hexr-bola { stroke: rgba(10, 12, 18, .7); stroke-width: 1; }
.hexr-txt { fill: #f3ead2; font-family: var(--mono); font-weight: 600; paint-order: stroke; stroke: rgba(10, 12, 18, .85); stroke-width: 3px; }
.rab { fill: none; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.rab-some { animation: rab-some 8s linear forwards; }
@keyframes rab-some { 0%, 72% { opacity: 1; } 100% { opacity: 0; } }
.palco.t-w { cursor: crosshair; }
.chip.cores-caneta { gap: 5px; }
.cor-caneta { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .25); padding: 0; cursor: pointer; }
.cor-caneta[aria-pressed="true"] { border-color: var(--lamp); box-shadow: 0 0 0 2px var(--lamp-soft); }
.zoom .caneta-bt[aria-pressed="true"] { background: var(--lamp-soft); border-color: var(--lamp); color: var(--lamp-ink); }
.mar-li .tx { flex: 1; min-width: 0; }
.gd-nums { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }

/* rascunho, régua e alças */
.rasc.linha { fill: none; }
.rasc-ponto { fill: var(--lamp); stroke: #14171f; stroke-width: 1.5; }
.rasc-ponto.fecha { fill: #fff; stroke: var(--lamp); stroke-width: 2.5; }
.regua-ponta { fill: var(--lamp); stroke: #14171f; stroke-width: 1.5; }
.alca.meio { opacity: .7; }

/* opções da ferramenta (#opts) */
.chip select { height: 26px; border: 0; background: none; color: inherit; font-weight: 600; max-width: 150px; padding: 0 2px; cursor: pointer; }
.chip select option { background: var(--surface); color: var(--fg); }
.chip.pri { background: var(--lamp); border-color: var(--lamp); color: var(--on-lamp); }
.chip:disabled { opacity: .55; cursor: default; }
.chip svg { flex: none; }

/* menus da tela */
.menu button.per { color: var(--danger); }
.menu-icones { padding: 8px; }
.menu-icones .grade { width: 264px; }
.menu .grade button { display: grid; place-items: center; width: auto; padding: 0; border: 1px solid var(--line); }

/* tema claro: letra escura com halo claro lê melhor sobre o papel claro (e continua legível sobre a imagem) */
/* tema claro (tc/tema.js) */
:where(:root[data-claro]) svg text { fill: #1c1a16; stroke: rgba(250, 247, 238, .9); }      /* (os nomes do mapa ficam claros: a regra deles é mais específica) */
:where(:root[data-claro]) svg text.rotulo.regua-txt { fill: #4a2f00; stroke: rgba(250, 247, 238, .9); }
:where(:root[data-claro]) .reg.semfac { fill: #7d869a; stroke: #59627a; }        /* o cinza claro sumia no papel claro */
:where(:root[data-claro]) .regua-txt { fill: #4a2f00; }
:where(:root[data-claro]) .sigla { fill: #fff; stroke: rgba(20, 23, 31, .75); }
:where(:root[data-claro]) .sigla.escura { fill: #14171f; stroke: none; }
:where(:root[data-claro]) .interroga { fill: #f3ead2; stroke-width: 0; }


/* celular: a dica ocupa a largura toda, logo acima do zoom */
@media (max-width: 520px) {
  .dica { right: 10px; max-width: none; bottom: 58px; padding: 6px 10px; font-size: 12.5px; }
  .cam-pop { left: 10px; right: 10px; width: auto; max-width: none; }
  .modo-leg { bottom: 100px; }
}

/* traço do pincel de névoa enquanto pinta (a névoa de verdade muda ao soltar) */
.c-tra { fill: #e6ab4f; opacity: .38; pointer-events: none; }
.c-tra.cobre { fill: #05070c; opacity: .6; }

/* animações: em pausa enquanto a pessoa mexe no mapa; paradas de vez quando são muitas (tela.js decide) */
.camadas.quieto .eve-pulso, .camadas.quieto .frente-anda { animation-play-state: paused; }
.camadas.sem-pulso .eve-pulso { animation: none; opacity: .3; }
.camadas.sem-marcha .fre-a.frente-anda, .camadas.sem-marcha .fre-b.frente-anda { animation: none; }
.camadas.quieto .eve-anim { animation-play-state: paused; }
.camadas.sem-anima .eve-anim { animation: none; }
.camadas.sem-anima .eve-raio, .camadas.sem-anima .eve-plana { opacity: .45; }

/* ================= painel (painel.js): barra de cima, abas, formulários, menus, janelas ================= */
/* ---- barra de cima ---- */
.side.fechado { display: none; }                       /* recolhido também no computador (a regra do celular, lá em cima, só valia na gaveta) */
#btPainel { position: relative; }
#btDesfazer, #btPainel, .cal { flex: none; }            /* os botões da direita nunca saem da tela; o resto encolhe */
.pick, .salvo { min-width: 0; }
#btPainel.tem-sel::after { content: ""; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--lamp); }
#btMapa[aria-expanded="true"] { border-color: var(--lamp); }
#dataTxt[role="button"] { cursor: pointer; border-radius: 6px; }
#dataTxt[role="button"]:hover { background: var(--hover); }
#dataTxt .dt-curta { display: none; }
.atalhos { display: inline-flex; gap: 6px; }
.liga-bola { fill: #14171f; stroke: #f3ead2; stroke-width: 1.4; }
.liga-seta { fill: none; stroke: #f3ead2; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.como-chip { display: none; align-items: center; gap: 5px; height: 28px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--lamp); background: var(--lamp-soft); color: var(--lamp-ink); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.salvo { overflow: hidden; text-overflow: ellipsis; max-width: 220px; }

/* ---- abas ---- */
.tab { white-space: nowrap; }
.tabs { overflow-x: auto; scrollbar-width: none; }
.tab .n { display: inline-grid; place-items: center; min-width: 17px; height: 17px; margin-left: 4px; padding: 0 4px; border-radius: 9px; background: var(--lamp); color: var(--on-lamp); font-size: 11px; font-weight: 700; vertical-align: 1px; }
.pane > * { flex: none; }

/* ---- listas ---- */
.lista { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
button.li { width: 100%; text-align: left; color: inherit; font: inherit; }
.li.oculto .tx b { opacity: .7; }
.li.aberta { border-color: var(--lamp); }
.li .tag { flex: none; }
.li .tag.cam { border-style: dashed; color: var(--fg-3); font-weight: 500; }           /* (lote 8) a camada escondida ou travada neste aparelho */
.li.fora-cam .tx b { color: var(--fg-2); }
.li .tx small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .tx small.linha2 { color: var(--fg-2); }
.ico { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; color: #14171f; font-size: 10.5px; font-weight: 700; letter-spacing: .02em; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25); }
.ico svg { display: block; }
.ico.rumor { background: var(--raised); color: var(--fg); box-shadow: none; border: 1.5px dashed var(--fg-2); }
.ico.reg { border-radius: 6px; opacity: .9; }
.ico.reg.semcor { background: transparent; border: 1.5px dashed var(--fg-3); box-shadow: none; }
.ico.reg.sub { transform: scale(.82); }       /* (lote 6) a região de dentro, na lista em árvore */
.ico.linha { background: none; color: var(--fg-2); border-radius: 0; box-shadow: none; }
.gr { display: grid; grid-template-columns: minmax(0, 1fr); gap: 7px; }
.gr .row { padding-left: 4px; }
.fac-pub { display: grid; grid-template-columns: minmax(0, 1fr); gap: 7px; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--raised); }
/* (lote 10) a facção dos jogadores, a seção Província e o Livro do reino */
.tag.jog { color: var(--lamp-ink); border-color: var(--lamp); background: var(--lamp-soft); }
.prov-de { align-items: center; gap: 6px; }
.prov-de .note { flex: none; min-width: 0; }
.prov-subs { display: grid; gap: 3px; }
.prov-sub { min-height: 34px; }
.prov-sub .tx small { color: var(--fg-3); }
.prov-ter { display: grid; gap: 5px; }
.prov-ter b { font-size: 13px; color: var(--fg); }
.prov-ter ul, .livro-li { list-style: none; margin: 0; padding: 0; }
.prov-ter ul { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.prov-ter li { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--fg-2); }
.prov-ter li i, .livro-li i { flex: none; width: 11px; height: 11px; border-radius: 3px; border: 1px solid var(--line-strong); }
.prov-ter li i.sem, .livro-li i.sem { background: transparent; border-style: dashed; }
.livro-li { display: grid; grid-template-columns: 16px minmax(0, 1fr); align-items: center; gap: 2px 8px; padding: 7px 9px; border-radius: 9px; border: 1px solid var(--line); background: var(--raised); }
.livro-li > i, .livro-li > .fac-band { justify-self: center; }
.livro-li b { font-size: 13px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.livro-li small { grid-column: 2; font-size: 12px; color: var(--fg-3); }
/* (lote 10, parte 2) a economia: os recursos do mundo, os níveis, a produção da província e a tabela do terreno */
.eco-rot { display: block; margin-top: 2px; }
.eco-recs, .eco-nivs { display: grid; gap: 5px; }
.eco-rec { display: grid; grid-template-columns: 34px minmax(0, 1fr) 104px 32px; align-items: center; gap: 6px; }
.eco-rec .in { height: 32px; min-width: 0; }
.eco-rec input.cor { width: 34px; height: 32px; padding: 2px; }
.eco-niv { display: grid; grid-template-columns: minmax(0, 1fr) 64px auto 32px; align-items: center; gap: 6px; }
.eco-niv .in { height: 32px; min-width: 0; }
.livro-li .livro-prod, .livro-li .livro-est { color: var(--fg-2); }
.prov-prod, .prov-ass { display: grid; gap: 4px; }
.prod-li { display: grid; grid-template-columns: 11px minmax(0, 1fr); align-items: center; gap: 1px 8px; }
.prod-li i { width: 11px; height: 11px; border-radius: 3px; border: 1px solid var(--line-strong); }
.prod-li b { font-size: 13px; color: var(--fg); }
.prod-li small { grid-column: 2; font-size: 12px; color: var(--fg-3); }
.rec-linha.rec-mundo .rot { font-weight: 600; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
dialog.mundo-dl.eco-dl { width: min(880px, calc(100% - 24px)); }
.eco-tab-caixa { max-height: min(60vh, 520px); overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
.eco-tab { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
.eco-tab th, .eco-tab td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.eco-tab thead th { position: sticky; top: 0; z-index: 1; background: var(--surface); font-weight: 600; color: var(--fg-2); }
.eco-tab tbody th { position: sticky; left: 0; background: var(--surface); font-weight: 600; color: var(--fg); }
.eco-tab th i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 3px; border: 1px solid var(--line-strong); vertical-align: -1px; }
.eco-tab td .in { width: 72px; height: 30px; padding: 0 6px; text-align: right; font-family: var(--mono); }
.mundo-dl .eco-tab td input.in { width: 72px; height: 30px; padding: 0 6px; text-align: right; font-family: var(--mono); }
/* (lote 10, parte 3) as construções: no assentamento, no catálogo e nas janelas */
.cons-lista, .eco-cons { display: grid; gap: 6px; }
.cons-li { display: grid; grid-template-columns: 30px minmax(0, 1fr) 30px; align-items: start; gap: 2px 8px; padding: 8px 9px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); }
.cons-li.em-obra { border-style: dashed; border-color: var(--line-strong); }
.cons-li .ico { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--surface); color: var(--lamp-ink); }
.cons-li .tx { display: grid; gap: 2px; min-width: 0; }
.cons-li .tx b { font-size: 13px; color: var(--fg); }
.cons-li .tx small { font-size: 12px; color: var(--fg-3); }
.cons-li .tx small.cons-ef { color: var(--fg-2); font-style: italic; }
.cons-li .cons-acoes { gap: 6px; flex-wrap: wrap; margin-top: 3px; }
.cons-li .cons-acoes:empty { display: none; }
.cons-li > .ib { justify-self: end; }
.cons-obra { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-2); margin-top: 2px; }
.cons-obra .in { width: 64px; height: 28px; padding: 0 6px; }
.tag.obra { color: var(--lamp-ink); border-color: var(--lamp); border-style: dashed; }
.ob-det { display: grid; gap: 4px; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); }
.mundo-dl .ob-det p { font-size: 13px; color: var(--fg); }
.mundo-dl .ob-est { font-size: 13px; }
.mundo-dl .lin.ct-cab label:first-child { flex: 1 1 200px; }
.ct-cab .ct-ic { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line-strong); color: var(--lamp-ink); }
.mundo-dl .ct-exige .lin label:first-child, .mundo-dl .ct-exige .lin label:last-child { flex: 1 1 0; }
.ct-ters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.mundo-dl label.op.ct-ter { padding: 5px 9px; font-size: 12.5px; }
.ct-niveis { display: grid; gap: 10px; }
.mundo-dl fieldset.ct-nivel { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px 10px; }
.mundo-dl fieldset.ct-nivel legend { padding: 0 4px; }
.mundo-dl fieldset.ct-nivel .lin label { flex: 0 0 132px; }     /* (lote 12, parte 12c: a semana, a defesa e a cura, do mesmo tamanho) */
/* (lote 10, parte 4) a semana: o aviso na Economia do mundo e a prévia */
.sem-box { display: grid; gap: 3px; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); }
.sem-box b { font-size: 13px; color: var(--fg); }
.sem-box small { font-size: 12px; color: var(--fg-3); }
.sem-box.pend { border-color: var(--lamp); background: var(--lamp-soft); }
.sem-box.pend b { color: var(--lamp-ink); }
.sem-box .row { margin-top: 4px; }
.sem-fac { display: grid; gap: 6px; }
.sem-cab { display: flex; align-items: center; gap: 8px; }
.sem-cab i { flex: none; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line-strong); }
.sem-cab b { font-size: 14px; color: var(--fg); }
.sem-tab td.num, .sem-tab th.num { text-align: right; font-family: var(--mono); }
.sem-tab tr.falta td:last-child { color: var(--danger); font-weight: 700; }
.mundo-dl .sem-exe, .mundo-dl .sem-par { font-size: 12px; color: var(--fg-3); }
.mundo-dl .sem-par { color: var(--fg-2); }
.mundo-dl label.op.sem-cons { font-weight: 500; }
.sem-obras { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 3px; font-size: 13px; color: var(--fg-2); }
.sem-obras li.pronta { color: var(--ok); }
.sem-obras li.parada { color: var(--danger); }
/* (lote 10, parte 5) a população por estrato: no assentamento, na janela, os estratos e os lembretes da prévia */
.pop-cab { align-items: center; justify-content: space-between; }
.pop-cab b { font-size: 13px; color: var(--fg); }
.pop-barra { display: flex; height: 10px; border-radius: 5px; overflow: hidden; border: 1px solid var(--line-strong); background: var(--surface); }
.pop-barra span { display: block; height: 100%; min-width: 2px; }
.pop-lista { font-size: 12px; color: var(--fg-2); }
dialog.mundo-dl.pop-dl { width: min(560px, calc(100% - 24px)); }
.pop-dist { display: flex; flex-wrap: wrap; align-items: end; gap: 8px; }
.mundo-dl .pop-dist label { flex: 0 0 120px; }
.mundo-dl .pop-dist .note { flex: 1 1 220px; font-size: 12.5px; }
.pop-tab td.pop-prod { color: var(--fg-2); font-size: 12px; white-space: normal; }
.mundo-dl .pop-resumo { font-size: 13px; color: var(--fg); }
.eco-estrs { display: grid; gap: 6px; }
.cons-li.estr input.cor { width: 30px; height: 30px; padding: 2px; }
.sem-lemb { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 3px; font-size: 13px; color: var(--fg-2); }

.fac-pub > .li { padding: 0; border: 0; background: none; }

/* (lote 8) a bandeira do clã ligado à facção (na aba Facções; no mapa, .bandeira) */

/* ---- campos ---- */
.ajuda { font-size: 12px; color: var(--fg-3); }
.chk { display: flex; align-items: flex-start; gap: 9px; font-weight: 600; font-size: 13.5px; cursor: pointer; }
/* (lote 29) os personagens do grupo */
.pcs-grupo { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 12px; margin: 4px 0 2px; }
.field[data-k$=":pcs"] { margin: 12px 0 10px; }     /* (lote 29) "Personagens deste grupo": um respiro entre a cor e a rota */
.chk input { width: 17px; height: 17px; margin: 1px 0 0; flex: none; accent-color: var(--lamp); }
.chk small { display: block; font-weight: 400; font-size: 12px; color: var(--fg-3); }
.chk:has(input:disabled) { opacity: .55; cursor: default; }
input.cor { flex: none; width: 46px; height: 34px; padding: 2px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raised); cursor: pointer; }
.linha-cor { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.row > .field.cor-campo { flex: none; min-width: 0; }

.row .note { flex: 1; min-width: 140px; }
.in:disabled { opacity: .55; }
input[type="search"].in { padding-right: 6px; }
.grade button { padding: 0; }

.cores { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

.cores .cor-bt[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 2px var(--surface); }

.rel i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.rel select.in { flex: none; width: auto; height: 30px; padding: 0 6px; font-size: 13px; }

.rel.alianca select.in { color: var(--ok); border-color: var(--ok); }
.rel.tensao select.in { color: var(--lamp-ink); border-color: var(--lamp); }
.data-linha { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.data-linha b { flex-basis: 100%; font-weight: 600; }
.status { margin: 0; font-size: 13px; color: var(--fg-2); }
/* a aba Terreno: os tipos de terreno (cor, nome, custo, tirar) e as setas que encaixam a grade na imagem */
.ter-lista { display: grid; gap: 6px; }

/* (lote 6) as bolinhas da travessia, no painel: uma por tempo de marcha (as cheias já foram andadas) */

/* (lote 6) a honra no painel do grupo, o histórico (da honra e da facção) e os recursos da facção */

.honra-valor { display: inline-block; min-width: 2.6em; text-align: center; font-size: 15px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--raised); }

.sec-hist { display: grid; gap: 4px; }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; font-size: 13px; }

/* ---- menu de mapas ---- */

/* (lote 10) a bandeira própria da facção: a janela (o mesmo editor do brasão do Clã) */
dialog.mundo-dl.band-dl { width: min(720px, calc(100% - 24px)); }
.band-ed { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }

.band-esc:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.band-esc.cor, .band-esc.cor[aria-pressed="true"] { min-width: 34px; min-height: 34px; padding: 0; }
.band-esc.cor span, .band-am { width: 22px; height: 22px; border-radius: 6px; display: block; border: 1px solid rgba(0, 0, 0, .3); }
