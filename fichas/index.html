function ligarEventos(){
  const host=document.getElementById('eventos');
  const q=s=>host.querySelector(s);
  const mostrar=(r,expr)=>{
    q('#saidaExpr').innerHTML=`<div class="bigroll">${r.total}<small>${esc(expr)} → ${esc(r.detalhe)}</small></div>`;
  };
  const rodar=()=>{
    const expr=q('#expr').value; S.ultimaExpr=expr;
    let r; try{ r=rolarExpressao(expr); }catch(e){ toast(e.message); return; }
    mostrar(r,r.expr); logar({tipo:'livre', quem:'Mestre', det:r.expr+'  '+r.detalhe, total:r.total, dd:r.dd});
    renderRegistroSo();
  };
  q('#rolarExpr').onclick=rodar;
  q('#expr').onkeydown=e=>{if(e.key==='Enter')rodar()};
  host.querySelectorAll('[data-dado]').forEach(b=>b.onclick=()=>{q('#expr').value=b.dataset.dado; rodar()});
  q('#novaTab').onclick=()=>{S.tabelas.push({id:uid(),nome:'Nova tabela',itens:''}); save(); renderEventos()};
  host.querySelectorAll('[data-tabnome]').forEach(i=>i.oninput=e=>{
    const t=S.tabelas.find(x=>x.id===e.target.dataset.tabnome); if(t){t.nome=e.target.value; save();}});
  host.querySelectorAll('[data-tabitens]').forEach(i=>i.oninput=e=>{
    const t=S.tabelas.find(x=>x.id===e.target.dataset.tabitens); if(t){t.itens=e.target.value; save();}});
  host.querySelectorAll('[data-tabdel]').forEach(b=>b.onclick=()=>{
    if(confirm('Remover a tabela?')){S.tabelas=S.tabelas.filter(x=>x.id!==b.dataset.tabdel); save(); renderEventos();}});
  host.querySelectorAll('[data-tabroll]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.tabroll, t=S.tabelas.find(x=>x.id===id);
    const itens=(t.itens||'').split('\n').map(x=>x.trim()).filter(Boolean);
    if(!itens.length){toast('A tabela está vazia');return}
    const qtd=Math.max(1,+host.querySelector('[data-tabqtd="'+id+'"]').value||1);
    const semRep=host.querySelector('[data-tabrep="'+id+'"]').checked;
    const pool=[...itens], saiu=[];
    for(let i=0;i<qtd;i++){
      if(!pool.length) break;
      const idx=randInt(pool.length);
      saiu.push({txt:pool[idx], n:idx+1, de:itens.length, entre:pool.length});
      if(semRep) pool.splice(idx,1);
    }
    host.querySelector('[data-tabout="'+id+'"]').innerHTML=saiu.map(s=>
      `<div class="vlinha"><span class="p mono">${s.n}/${s.de}</span><span class="n" style="font-weight:500">${esc(s.txt)}</span></div>`).join('');
    logar({tipo:'tabela', quem:t.nome, det:saiu.map(s=>s.txt).join(' · '), total:null, dd:saiu.filter(s=>s.entre>=2).map(s=>[s.entre,s.n])});
    renderRegistroSo();
  });
}

/* =======================================================================
   ÁRVORES DE HABILIDADE — mesma regra do app de árvores do mestre:
   pais com regra E/OU, grupos exclusivos, graus com custo por pool.
   ======================================================================= */
const CAT_ARV=[{id:'raca',nome:'Raça'},{id:'classe',nome:'Classe'},{id:'escola',nome:'Escola'},{id:'outra',nome:'Outra'}];
const nomeCatArv = id => (CAT_ARV.find(c=>c.id===id)||CAT_ARV[3]).nome;
const ARV={porId:new Map(), arvDe:new Map(), filhos:new Map(), bib:null, base:null, pc:null, ramos:null};

function temBib(){ return !!(S.bib && (S.bib.arvores||[]).length); }
function normalizarBib(b){
  b.pools=Array.isArray(b.pools)?b.pools:[];
  b.naturezas=Array.isArray(b.naturezas)?b.naturezas:[];
  b.usos=Array.isArray(b.usos)?b.usos:[];
  b.tipos=b.tipos||{pequeno:{nome:'Pequeno',custo:1}};
  b.arvores=Array.isArray(b.arvores)?b.arvores:[];
  b.arvores.forEach(a=>{
    a.nodes=Array.isArray(a.nodes)?a.nodes:[];
    if(!CAT_ARV.some(c=>c.id===a.categoria)) a.categoria='outra';
    a.nodes.forEach(n=>{
      n.pais=Array.isArray(n.pais)?n.pais:[];
      n.usos=Array.isArray(n.usos)?n.usos:[];
      n.regra = n.regra==='ou' ? 'ou' : 'e';
      if(!Array.isArray(n.graus)||!n.graus.length) n.graus=[{custos:{},texto:''}];
      n.graus.forEach(g=>{ g.custos=g.custos||{}; g.texto=g.texto||''; });
    });
  });
  return b;
}
/* O índice das árvores é o do personagem pc (lote 6): a biblioteca da mesa só com o que ele alcança (a do mestre tem
   os caminhos trancados) mais os que o mestre abriu para ele (skills.ramos, uma cópia do ramo). Sem pc, a biblioteca
   de todos. arvPara(pc) refaz o índice só quando ele é de outro personagem (ou a biblioteca, ou os ramos, mudaram). */
function indexarArvores(pc){
  ARV.porId.clear(); ARV.arvDe.clear(); ARV.filhos.clear();
  const sk=pc?skillsDe(pc):null, ramos=(sk&&sk.ramos)||null;
  ARV.base=S.bib; ARV.pc=pc?pc.id:null; ARV.ramos=ramos;
  ARV.bib=S.bib;
  if(S.bib && pc && window.TC && TC.rules && TC.rules.bibComRamos && (ramos || TC.rules.temTranca(S.bib))){
    const com=TC.rules.bibComRamos(S.bib, {ramos:JSON.parse(JSON.stringify(ramos))});   // (uma cópia: arrumar não mexe nas skills)
    if(com!==S.bib) ARV.bib=normalizarBib(com);
  }
  if(!ARV.bib) return;
  (ARV.bib.arvores||[]).forEach(a=>(a.nodes||[]).forEach(n=>{
    ARV.porId.set(n.id,n); ARV.arvDe.set(n.id,a); ARV.filhos.set(n.id,[]);
  }));
  (ARV.bib.arvores||[]).forEach(a=>(a.nodes||[]).forEach(n=>{
    (n.pais||[]).forEach(pid=>{ if(ARV.arvDe.get(pid)===a) ARV.filhos.get(pid).push(n); });
  }));
}
function arvPara(pc){
  const sk=pc?skillsDe(pc):null, ramos=(sk&&sk.ramos)||null;
  if(ARV.base===S.bib && ARV.pc===(pc?pc.id:null) && ARV.ramos===ramos) return;
  indexarArvores(pc);
}
const skillsDe   = pc => (pc.skills || (pc.skills={arvores:[],pontos:{},alocados:{}}));
const arvoreDoNo = id => ARV.arvDe.get(id)||null;
const BIBX       = () => ARV.bib || S.bib;          // (a biblioteca do personagem do índice)
const arvPorId   = id => (BIBX()?.arvores||[]).find(a=>a.id===id)||null;
const poolArv    = id => (BIBX()?.pools||[]).find(x=>x.id===id)||null;
const natArv     = id => (BIBX()?.naturezas||[]).find(x=>x.id===id)||null;
const usoArv     = id => (BIBX()?.usos||[]).find(x=>x.id===id)||null;
const tipoArv    = n  => (BIBX()?.tipos||{})[n.tipo] || {nome:n.tipo||'Pequeno'};
const grupoEx    = n  => String(n.exclusivo||'').trim().toLowerCase();
const grausDe    = n  => (n.graus&&n.graus.length? n.graus : [{custos:{},texto:''}]);
const custoGrauArv = (n,k) => (grausDe(n)[k-1]&&grausDe(n)[k-1].custos) || {};

function equipadaArv(pc,id){ const a=arvoreDoNo(id); return !!a && skillsDe(pc).arvores.includes(a.id); }
function satisfeitoNo(n,conj){
  if(!(n.pais||[]).length) return true;
  return n.regra==='ou' ? n.pais.some(x=>conj.has(x)) : n.pais.every(x=>conj.has(x));
}
function fechadoPorNo(pc,n){
  const g=grupoEx(n); if(!g) return null;
  for(const id in skillsDe(pc).alocados){
    if(id===n.id) continue;
    const m=ARV.porId.get(id);
    if(m && grupoEx(m)===g) return m;
  }
  return null;
}
function gastosPool(pc,poolId){
  const al=skillsDe(pc).alocados; let soma=0;
  for(const id in al){
    const n=ARV.porId.get(id); if(!n) continue;
    const g=Math.min(al[id], grausDe(n).length);
    for(let k=0;k<g;k++) soma += (grausDe(n)[k].custos||{})[poolId]||0;
  }
  return soma;
}
const restantesPool = (pc,poolId) => (skillsDe(pc).pontos[poolId]||0) - gastosPool(pc,poolId);
function podePagarArv(pc,n,k){
  const c=custoGrauArv(n,k);
  return (BIBX().pools||[]).every(pl=>(c[pl.id]||0) <= restantesPool(pc,pl.id));
}
function faltamPools(pc,n,k){
  const c=custoGrauArv(n,k);
  return (BIBX().pools||[]).filter(pl=>(c[pl.id]||0) > restantesPool(pc,pl.id)).map(pl=>pl.nome);
}
function custoTextoArv(custos){
  const ps=(BIBX()?.pools||[]).filter(pl=>(custos||{})[pl.id]>0).map(pl=>pl.nome+' '+custos[pl.id]);
  return ps.length? ps.join(' · ') : 'sem custo';
}
function estadoDoNo(pc,n){
  const al=skillsDe(pc).alocados;
  if((al[n.id]||0)>0) return 'on';
  if(!equipadaArv(pc,n.id)) return 'bloq';
  if(fechadoPorNo(pc,n)) return 'fechado';
  if(!satisfeitoNo(n,new Set(Object.keys(al)))) return 'bloq';
  return podePagarArv(pc,n,1)? 'disp' : 'caro';
}
/* dos alocados, quais continuam ligados a uma raiz */
function sustentadosArv(conj){
  const ok=new Set([...conj].filter(id=>!ARV.porId.has(id)));
  let mudou=true;
  while(mudou){
    mudou=false;
    for(const id of conj){
      if(ok.has(id)) continue;
      const n=ARV.porId.get(id); if(!n) continue;
      if(satisfeitoNo(n,ok)){ ok.add(id); mudou=true; }
    }
  }
  return ok;
}
function podeSoltarNo(pc,id){
  const c=new Set(Object.keys(skillsDe(pc).alocados)); c.delete(id);
  return sustentadosArv(c).size===c.size;
}
function podarSkills(pc){
  arvPara(pc);
  const al=skillsDe(pc).alocados;
  for(const id of Object.keys(al)){
    const n=ARV.porId.get(id);
    if(!n) continue;                                  // ramo trancado: fica guardado
    if(!equipadaArv(pc,id)){ delete al[id]; continue; }
    if(al[id]>grausDe(n).length) al[id]=grausDe(n).length;
    if(al[id]<1) delete al[id];
  }
  const vistos=new Set();
  for(const id of Object.keys(al)){
    const n=ARV.porId.get(id); if(!n) continue;
    const g=grupoEx(n); if(!g) continue;
    if(vistos.has(g)) delete al[id]; else vistos.add(g);
  }
  const ok=sustentadosArv(new Set(Object.keys(al)));
  for(const id of Object.keys(al)) if(!ok.has(id)) delete al[id];
}
function exigenciaTexto(n){
  if(!(n.pais||[]).length) return '';
  const a=arvoreDoNo(n.id);
  const nomes=(n.pais||[]).map(pid=>{
    const m=ARV.porId.get(pid); if(!m) return 'um requisito que não veio no arquivo';
    const am=arvoreDoNo(pid);
    return am===a ? m.nome : m.nome+' ('+am.nome+')';
  });
  if(nomes.length===1) return 'Exige '+nomes[0]+'.';
  const lig = n.regra==='ou' ? ' ou ' : ' e ';
  return 'Exige '+nomes.slice(0,-1).join(', ')+lig+nomes[nomes.length-1]+'.';
}
/* pools que uma árvore realmente cobra */
function poolsDaArvore(a){
  const ps=new Set();
  (a.nodes||[]).forEach(n=>grausDe(n).forEach(g=>Object.keys(g.custos||{}).forEach(k=>{
    if((g.custos[k]||0)>0) ps.add(k);
  })));
  return [...ps];
}
function equiparArvore(pc,id,ligar){
  arvPara(pc);
  const sk=skillsDe(pc), a=arvPorId(id); if(!a) return;
  if(ligar){
    if(!sk.arvores.includes(id)) sk.arvores.push(id);
    poolsDaArvore(a).forEach(pid=>{                   // estreia a pool no valor padrão dela
      if(sk.pontos[pid]==null){ const pl=poolArv(pid); sk.pontos[pid]= pl&&pl.padrao!=null? +pl.padrao : 0; }
    });
  }else{
    sk.arvores=sk.arvores.filter(x=>x!==id);
  }
  podarSkills(pc); save(); renderFicha();
}
function pegarNo(pc,id){
  arvPara(pc);
  const n=ARV.porId.get(id); if(!n) return;
  const sk=skillsDe(pc), atual=sk.alocados[id]||0, prox=atual+1;
  if(prox>grausDe(n).length) return;
  if(atual===0){
    const e=estadoDoNo(pc,n);
    if(e==='fechado'){ const m=fechadoPorNo(pc,n); toast('Caminho fechado por “'+m.nome+'”'); return; }
    if(e==='bloq'){ toast(exigenciaTexto(n)||'Equipe a árvore primeiro'); return; }
  }
  if(!podePagarArv(pc,n,prox)){ toast('Faltam pontos: '+faltamPools(pc,n,prox).join(', ')); return; }
  sk.alocados[id]=prox; save(); renderFicha();
}
function soltarNo(pc,id){
  arvPara(pc);
  const sk=skillsDe(pc), atual=sk.alocados[id]||0;
  if(atual<=0) return;
  if(atual===1 && !podeSoltarNo(pc,id)){ toast('Outras skills dependem dessa'); return; }
  if(atual===1) delete sk.alocados[id]; else sk.alocados[id]=atual-1;
  save(); renderFicha();
}
/* lista hierárquica: cada nódulo embaixo do primeiro pai dentro da mesma árvore */
function linhasDaArvore(a){
  const dentro=new Set((a.nodes||[]).map(n=>n.id));
  const kids=new Map(); (a.nodes||[]).forEach(n=>kids.set(n.id,[]));
  const raizes=[];
  (a.nodes||[]).forEach(n=>{
    const pai=(n.pais||[]).filter(x=>dentro.has(x))[0];
    if(pai) kids.get(pai).push(n); else raizes.push(n);
  });
  const out=[], visto=new Set();
  const anda=(n,d)=>{
    if(visto.has(n.id)) return;
    visto.add(n.id); out.push({n,d});
    (kids.get(n.id)||[]).forEach(f=>anda(f,d+1));
  };
  raizes.forEach(r=>anda(r,0));
  (a.nodes||[]).forEach(n=>anda(n,0));               // sobras (ciclo ou pai de fora)
  return out;
}
/* as skills escolhidas, prontas para a tabela */
function skillsEscolhidas(pc){
  arvPara(pc);
  const al=skillsDe(pc).alocados, linhas=[];
  (BIBX()?.arvores||[]).forEach(a=>{
    if(!skillsDe(pc).arvores.includes(a.id)) return;
    (a.nodes||[]).forEach(n=>{
      const g=al[n.id]||0; if(g<=0) return;
      const custo={};
      for(let k=0;k<Math.min(g,grausDe(n).length);k++)
        Object.entries(grausDe(n)[k].custos||{}).forEach(([pid,v])=>{custo[pid]=(custo[pid]||0)+v});
      linhas.push({n, grau:g, arvore:a, custo, texto:(grausDe(n)[g-1]||{}).texto||'', uso:(grausDe(n)[g-1]||{}).uso||null});
    });
  });
  const pres=(BIBX()?.usos||[]).map(u=>u.id);
  linhas.sort((x,y)=>{
    const ux=pres.indexOf((x.n.usos||[])[0]||''), uy=pres.indexOf((y.n.usos||[])[0]||'');
    if(ux!==uy) return (ux<0?99:ux)-(uy<0?99:uy);
    return x.n.nome.localeCompare(y.n.nome,'pt-BR');
  });
  return linhas;
}

/* (lote 16) A aba Skills é um resumo: um cartão para cada coisa que o personagem aprendeu na árvore e para cada skill

const textoDoBonus=b=>b? Object.keys(b).map(k=>k+' '+(b[k]>=0?'+':'−')+Math.abs(b[k])).join(', ') : '';

/* (lote 16) As habilidades escritas à mão viram skills únicas (o que o mestre cria na Árvore, só para o personagem): a

const podeCriarUnicaNaFicha = pc => !FichasMesa.ativo() || (FichasMesa.mestre() && FichasMesa.podeEditar(pc));

}

            ${h.desc?`<span class="pudesc">${esc(String(h.desc).slice(0,160))}${String(h.desc).length>160?'…':''}</span>`:''}</span></label>`; }).join('')}</div>

/* =================== ROLAGEM RÁPIDA NA FICHA =================== */
/* Os bônus da rolagem rápida: +atributo (soma no atributo antes de rolar — muda o dado) e +resultado (soma no total).
   (lote 21) Ficam guardados para cada ficha, neste aparelho (não vão para a ficha), até a pessoa apagar (o × zera). */
const ROLMAIS_KEY='tinycats:rolmais';
let rolMais={pc:null, atr:0, res:0};
function rolMaisTodos(){ try{ const o=JSON.parse(localStorage.getItem(ROLMAIS_KEY)||'{}'); return o&&typeof o==='object'&&!Array.isArray(o)? o : {}; }catch(e){ return {}; } }
function rolMaisDe(pc){
  if(rolMais.pc!==pc.id){ const g=rolMaisTodos()[pc.id]||{}; rolMais={pc:pc.id, atr:Number.isFinite(+g.a)? +g.a||0 : 0, res:Number.isFinite(+g.r)? +g.r||0 : 0}; }
  return rolMais;
}
function rolMaisGuardar(){
  if(!rolMais.pc) return;
  const o=rolMaisTodos();
  if(rolMais.atr||rolMais.res) o[rolMais.pc]=Object.assign({}, rolMais.atr?{a:rolMais.atr}:{}, rolMais.res?{r:rolMais.res}:{}); else delete o[rolMais.pc];
  try{ localStorage.setItem(ROLMAIS_KEY, JSON.stringify(o)); }catch(e){}
}
const sinalMais=n=>(n<0?'−':'+')+Math.abs(n);
function rolarNaFicha(pc,k){
  const rol=pc.rol||(pc.rol={fixa:0,fonte:'total'}), m=rolMaisDe(pc);
  const valor0=valorDoAtributo(pc,k,rol.fonte), valor=Math.max(0,Math.round(valor0)+m.atr);
  const r=rolarFixa(valor, rol.fixa||0), total=r.total+m.res;
  const usouBase = ATRIBS.some(a=>a.k===k) && rol.fonte==='base';      // "base" só existe nos cinco atributos
  const esp = window.TC && TC.rules && TC.rules.DEFESAS_ESP ? TC.rules.DEFESAS_ESP.find(d=>d.k===k) : null;
  const rot = esp? 'Defesa contra '+esp.nome.toLowerCase() : k;
  const extra=(m.atr? ' · '+sinalMais(m.atr)+' no atributo ('+Math.round(valor0)+' → '+valor+')' : '')+(m.res? ' · '+sinalMais(m.res)+' no resultado' : '');
  pc.ultRol={k:rot, valor, base:usouBase, total, texto:r.texto+extra, dado:r.dado, bruto:r.bruto};
  logar({tipo:'fixa', quem:pc.nome, pc:pc.id,
    det:rot+' '+valor+(usouBase?' base':'')+' · '+r.texto+(r.dado?' → dado '+r.bruto:'')+extra,
    total, dd:ddDaFixa(r)});
  save(); renderFicha();
}

/* =================== DISPUTA DE ROLAGENS =================== */
function opcoesDeAtributo(k){
  return ATRIBS.map(a=>`<option value="${a.k}" ${k===a.k?'selected':''}>${a.k} · ${esc(a.nome)}</option>`).join('')
       + DERIV.map(d=>`<option value="${d.k}" ${k===d.k?'selected':''}>${d.k} · ${esc(d.nome)}</option>`).join('')
       + DEFESAS.map(d=>`<option value="${d.k}" ${k===d.k?'selected':''}>${d.rot} · ${esc(d.nome)}</option>`).join('');
}
function rotuloAtr(k){
  const a=ATRIBS.find(x=>x.k===k); if(a) return a.k;
  const d=DERIV.find(x=>x.k===k); if(d) return d.k;
  const f=DEFESAS.find(x=>x.k===k); return f? f.rot : k;
}
function abrirDisputa(pc){
  const outros=FichasMesa.emOrdem(S.personagens.filter(x=>x.id!==pc.id));      // (com campanhas: os da campanha em vista primeiro)
  const tem=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
  /* A memória da disputa mora na ficha (pc.disputa): o oponente escolhido por último e o que foi usado contra cada um.
     Ela é lida de novo a cada uso, nunca por uma referência guardada ao abrir a janela — se a ficha é atualizada por
     outra pessoa com a janela aberta (o mestre deu dano no token, por exemplo), o objeto antigo deixa de ser o da
     ficha, e o que fosse escrito nele não seria guardado. */
  const mem=()=>pc.disputa||(pc.disputa={});
  const meus=()=>{ const m=mem(); return (m.alvos && typeof m.alvos==='object') ? m.alvos : (m.alvos={}); };
  const gerais=()=>(S.alvos && typeof S.alvos==='object') ? S.alvos : (S.alvos={});
  const valeAlvo = id => id==='__avulso__' || outros.some(x=>x.id===id);
  const m0=mem();
  const est={
    atrA: m0.atrA||'FOR', fixaA: pc.rol?.fixa||0,
    alvo: valeAlvo(m0.alvoId) ? m0.alvoId : (valeAlvo(S.ultimoAlvo) ? S.ultimoAlvo : (outros[0]?.id||'__avulso__')),
    atrB: m0.atrB||'FOR', fixaB: m0.fixaB||0, valorB: m0.valorB||40,
    nomeB: typeof m0.nomeB==='string' ? m0.nomeB : '',      // o nome do NPC (um oponente sem ficha)
    res:null
  };
  if(!outros.length) est.alvo='__avulso__';
  /* Os dados de rolagem de um oponente (o atributo e a fixa dele; para o NPC sem ficha: nome, valor e fixa) valem
     para todas as fichas: o que foi usado por último contra ele, em qualquer uma, é o que aparece ao escolhê-lo em
     qualquer outra. Cada ficha guarda o que usou e quando (alvos[id].t); a mais recente de todas vence. O que foi
     guardado antes de existir a data conta como mais antigo — e, entre esses, vale o último usado nesta tela (S.alvos),
     depois o desta ficha. */
  const maisRecente = id => {
    let melhor=null;
    const ver = l => { if(l && typeof l==='object' && (!melhor || (+l.t||0) > (+melhor.t||0))) melhor=l; };
    if(tem(gerais(),id)) ver(gerais()[id]);
    if(tem(meus(),id)) ver(meus()[id]);
    S.personagens.forEach(p=>{ const al=p!==pc && p.disputa && p.disputa.alvos; if(al && typeof al==='object' && tem(al,id)) ver(al[id]); });
    return melhor;
  };
  // traz o que está guardado para o oponente escolhido; sem nada guardado, fica o que já estava na tela
  const carregarAlvo=()=>{
    const l = maisRecente(est.alvo);
    if(!l) return;
    if(l.atr) est.atrB=l.atr;
    if(l.fixa!=null) est.fixaB=Math.max(0,+l.fixa||0);
    if(l.valor!=null) est.valorB=Math.max(0,+l.valor||0);
    if(typeof l.nome==='string') est.nomeB=l.nome;
  };
  const guardarAlvo=()=>{
    const d = est.alvo==='__avulso__' ? {valor:est.valorB, fixa:est.fixaB, nome:est.nomeB} : {atr:est.atrB, fixa:est.fixaB};
    d.t=Date.now();
    meus()[est.alvo]=d; gerais()[est.alvo]=Object.assign({},d);
    const m=mem();
    m.alvoId=est.alvo; S.ultimoAlvo=est.alvo;
    m.atrB=est.atrB; m.fixaB=est.fixaB; m.valorB=est.valorB; m.nomeB=est.nomeB;
    save();
  };
  carregarAlvo();
  /* os valores são lidos na hora de rolar, nunca de uma cópia antiga da tela */
  const lados=()=>{
    const avulso = est.alvo==='__avulso__';
    const pcB = avulso? null : S.personagens.find(x=>x.id===est.alvo);
    return {avulso, pcB,
      vA: valorDoAtributo(pc, est.atrA, pc.rol?.fonte||'total'),
      vB: avulso? Math.max(0,+est.valorB||0) : valorDoAtributo(pcB, est.atrB, pcB.rol?.fonte||'total'),
      nomeB: avulso? (String(est.nomeB||'').trim().slice(0,40) || 'NPC') : pcB.nome};
  };
  const m=document.createElement('div'); m.className='modal';
  const fechar=()=>{ m.remove(); renderFicha(); };
  let desenhando=false;
  const desenhar=()=>{
    if(desenhando) return;                       // o redesenho tira o foco e dispara change de novo
    desenhando=true;
    const {avulso, pcB, vA, vB, nomeB} = lados();
    const r=est.res;
    const ganhaA = r && r.a.total>r.b.total, ganhaB = r && r.b.total>r.a.total;
    m.innerHTML=`<div class="sheet" style="max-width:720px">
      <div class="hd"><span class="eyebrow">Disputa de rolagens</span>
        <span class="hint" style="margin-left:6px">cada lado rola a sua fixa; quem tirar mais, vence</span>
        <button class="mini" id="disX" style="margin-left:auto">Fechar</button></div>
      <div class="bd">
        <div class="dislados">
          <div class="dislado ${ganhaA?'venceu':''}">
            <span class="disnome">${esc(pc.nome)}</span>
            <div class="discampos">
              <label><span>Atributo</span><select id="disAtrA">${opcoesDeAtributo(est.atrA)}</select></label>
              <label><span>Valor</span><span class="disval">${vA}</span></label>
              <label><span>Fixar</span><input type="number" min="0" id="disFixaA" value="${est.fixaA}"></label>
            </div>
            ${r? `<div class="disnum">${r.a.total}</div><div class="disdet">${esc(r.a.texto)}${r.a.dado?` · dado ${r.a.bruto}`:''}</div>`:''}
          </div>
          <div class="disvs">×</div>
          <div class="dislado ${ganhaB?'venceu':''}">
            <label style="display:block;margin-bottom:8px">
              <select id="disAlvo">
                ${FichasMesa.opcoesDePcs(outros, est.alvo)}
                <option value="__avulso__" ${avulso?'selected':''}>NPC (sem ficha)</option>
              </select></label>
            <div class="discampos">
              ${avulso
                ? `<label><span>Nome</span><input type="text" id="disNomeB" maxlength="40" value="${esc(est.nomeB||'')}" placeholder="NPC" style="width:120px"></label>
                   <label><span>Valor</span><input type="number" min="0" id="disValorB" value="${est.valorB}"></label>`
                : `<label><span>Atributo</span><select id="disAtrB">${opcoesDeAtributo(est.atrB)}</select></label>
                   <label><span>Valor</span><span class="disval">${vB}</span></label>`}
              <label><span>Fixar</span><input type="number" min="0" id="disFixaB" value="${est.fixaB}"></label>
            </div>
            ${r? `<div class="disnum">${r.b.total}</div><div class="disdet">${esc(r.b.texto)}${r.b.dado?` · dado ${r.b.bruto}`:''}</div>`:''}
          </div>
        </div>
        ${r? `<div class="disveredito">${
          r.a.total===r.b.total
            ? '<span class="emp">Empate em '+r.a.total+'.</span>'
            : `<strong>${esc(r.a.total>r.b.total? pc.nome : nomeB)}</strong> venceu <strong>${esc(r.a.total>r.b.total? nomeB : pc.nome)}</strong> por ${Math.abs(r.a.total-r.b.total)} (${Math.max(r.a.total,r.b.total)} × ${Math.min(r.a.total,r.b.total)}).`
        }</div>`:''}
        <div class="modalacts">
          <span class="hint">O resultado vai para o registro da Mesa.</span>
          <span style="margin-left:auto;display:flex;gap:8px">
            <button id="disFechar">Fechar</button>
            <button class="primary" id="disRolar">${r?'Rolar de novo':'Rolar disputa'}</button>
          </span>
        </div>
      </div></div>`;
    desenhando=false;
    m.querySelector('#disX').onclick=fechar;
    m.querySelector('#disFechar').onclick=fechar;
    /* números: só guardam o valor, sem redesenhar (senão o campo perde o foco a cada tecla) */
    const num=(id,fn)=>{ const e=m.querySelector(id); if(e) e.oninput=ev=>fn(Math.max(0,+ev.target.value||0)); };
    num('#disFixaA', v=>{est.fixaA=v; pc.rol.fixa=v; save();});   // é a mesma fixa do rolador da ficha
    num('#disFixaB', v=>{est.fixaB=v; guardarAlvo();});
    num('#disValorB', v=>{est.valorB=v; guardarAlvo();});
    const nb=m.querySelector('#disNomeB'); if(nb) nb.oninput=ev=>{ est.nomeB=ev.target.value.slice(0,40); guardarAlvo(); };
    /* seletores mudam a estrutura, então redesenham */
    const sel=(id,fn)=>{ const e=m.querySelector(id); if(e) e.onchange=ev=>{ fn(ev.target.value); est.res=null; desenhar(); }; };
    sel('#disAtrA', v=>{est.atrA=v; mem().atrA=v; save();});
    sel('#disAtrB', v=>{est.atrB=v; guardarAlvo();});
    sel('#disAlvo', v=>{est.alvo=v; carregarAlvo(); guardarAlvo();});
    m.querySelector('#disRolar').onclick=()=>{
      const {avulso, vA, vB, nomeB} = lados();
      guardarAlvo();                      // rolou contra este alvo: os dados dele ficam guardados para todos
      const ra=rolarFixa(vA, est.fixaA);
      const rb=rolarFixa(vB, est.fixaB);
      est.res={a:ra, b:rb};
      const rotB = avulso? 'valor '+vB : rotuloAtr(est.atrB)+' '+vB;
      // quem venceu vai dito por extenso (na mesa ao vivo, em destaque): "Dain venceu Goblin por 4 (32 × 28)"
      const empate = ra.total===rb.total, venceuA = ra.total>rb.total;
      const veredito = empate ? 'Empate em '+ra.total
        : (venceuA? pc.nome : nomeB)+' venceu '+(venceuA? nomeB : pc.nome)+' por '+Math.abs(ra.total-rb.total)+' ('+Math.max(ra.total,rb.total)+' × '+Math.min(ra.total,rb.total)+')';
      logar({tipo:'disputa', quem:'Disputa · '+pc.nome+' × '+nomeB, pc:pc.id,
        det:`${pc.nome}: ${rotuloAtr(est.atrA)} ${vA} (${ra.texto}${ra.dado?', dado '+ra.bruto:''}) = ${ra.total}`
           +`  ·  ${nomeB}: ${rotB} (${rb.texto}${rb.dado?', dado '+rb.bruto:''}) = ${rb.total}`,
        total:null, veredito, passou: empate? null : venceuA, dd:ddDaFixa(ra).concat(ddDaFixa(rb))});
      save(); desenhar();
    };
  };
  m.onclick=e=>{ if(e.target===m) fechar(); };
  document.body.appendChild(m); desenhar();
}

function textoTabelaSkills(pc){
  const linhas=skillsEscolhidas(pc), k=contasDe(pc), unicas=unicasDaFicha(pc);

function ligarSkills(pc,host){
  host.querySelectorAll('[data-skimport]').forEach(b=>b.onclick=()=>{

/* ---------- apagar dados (flush, com duas confirmações) ---------- */
/* Numa mesa com campanhas, "Personagens" apaga só as fichas da campanha em vista (as do mundo e as das outras
   campanhas ficam; as de uma campanha encerrada não se apagam). Sem campanhas, todas, como sempre. */
function fichasDoFlush(){
  const bs=FichasMesa.blocos();
  if(bs.length===1 && bs[0].unico) return S.personagens;
  const v=bs.find(b=>b.vista);
  return !v || v.encerrada || !v.camp ? [] : S.personagens.filter(p=>FichasMesa.blocoDe(p)===v.camp);
}
const campDoFlush=()=>{ const bs=FichasMesa.blocos(), v=bs.find(b=>b.vista); return bs.length===1 && bs[0].unico ? null : (v && v.camp ? v : {camp:'', nome:''}); };
const ALVOS_FLUSH=[
  {k:'personagens', rot:'Personagens',          conta:()=>fichasDoFlush().length,
   dsc:()=>{ const c=campDoFlush();
     if(c && c.encerrada) return `nenhuma ficha: a campanha ${esc(c.nome)} está encerrada, e as fichas dela não se apagam (para mexer nela, o mestre a reabre)`;
     return `${fichasDoFlush().length} ficha(s)${c? (c.camp? ' da campanha '+esc(c.nome) : ' (nenhuma: escolha no menu da mesa a campanha de onde apagar)') : ''} com atributos, equipamentos, poderes, habilidades e anotações — e também os grupos${c?' dela':' e tags'}`; }},
  {k:'situacoes',   rot:'Situações da Mesa',    conta:()=>(S.situacoes||[]).length,
   dsc:()=>`${(S.situacoes||[]).length} cena(s) montada(s) e seus participantes`},
  {k:'tabelas',     rot:'Tabelas de eventos',   conta:()=>(S.tabelas||[]).length,
   dsc:()=>`${(S.tabelas||[]).length} tabela(s) de sorteio`},
  {k:'log',         rot:'Registro de rolagens', conta:()=>(S.log||[]).length,
   dsc:()=>`${(S.log||[]).length} rolagem(ns) guardada(s) no histórico`},
  {k:'bib',         rot:'Árvores de habilidade', conta:()=>(S.bib?.arvores||[]).length,
   dsc:()=>temBib()? `biblioteca “${S.bib.nome||'sem nome'}” com ${(S.bib.arvores||[]).length} árvore(s) — a distribuição de cada personagem fica sem referência`
                   : 'nenhuma biblioteca carregada'},
  {k:'cfg',         rot:'Tabelas base',         conta:()=>1,
   dsc:()=>'níveis, multiplicadores de tier, percentuais e arredondamento voltam ao padrão'},
];
function abrirFlush(){
  const marcados=new Set();
  const m=document.createElement('div'); m.className='modal';
  const desenhar=()=>{
    m.innerHTML=`<div class="sheet risco" style="max-width:560px">
      <div class="hd"><span class="eyebrow">Apagar dados</span>
        <span class="hint" style="margin-left:6px">passo 1 de 2</span>
        <button class="mini" id="flushX" style="margin-left:auto">Cancelar</button></div>
      <div class="bd">
        <p style="margin:0 0 4px;font-size:14px">Escolha o que vai ser apagado. Nada acontece até você confirmar na próxima tela.</p>
        <div class="flushlist">
          ${ALVOS_FLUSH.map(a=>`<label class="flushitem ${marcados.has(a.k)?'marcado':''}">
            <input type="checkbox" data-alvo="${a.k}" ${marcados.has(a.k)?'checked':''}>
            <span><span class="rot">${a.rot}</span><span class="dsc">${a.dsc()}</span></span>
          </label>`).join('')}
        </div>
        <div class="modalacts">
          <button class="mini" id="flushTudo">Marcar tudo</button>
          <button class="mini" id="flushNada">Desmarcar</button>
          <button class="mini" id="flushBackup">Exportar backup antes</button>
          <span style="margin-left:auto;display:flex;gap:8px">
            <button id="flushCancel">Cancelar</button>
            <button class="apagar" id="flushNext" ${marcados.size?'':'disabled'}>Continuar</button>
          </span>
        </div>
      </div></div>`;
    m.querySelector('#flushX').onclick=fechar;
    m.querySelector('#flushCancel').onclick=fechar;
    m.querySelector('#flushTudo').onclick=()=>{ALVOS_FLUSH.forEach(a=>marcados.add(a.k));desenhar()};
    m.querySelector('#flushNada').onclick=()=>{marcados.clear();desenhar()};
    m.querySelector('#flushBackup').onclick=()=>exportar();
    m.querySelectorAll('[data-alvo]').forEach(i=>i.onchange=e=>{
      const k=e.target.dataset.alvo;
      e.target.checked? marcados.add(k) : marcados.delete(k);
      desenhar();
    });
    m.querySelector('#flushNext').onclick=()=>{ if(marcados.size) confirmarFlush([...marcados], fechar); };
  };
  const fechar=()=>m.remove();
  m.onclick=e=>{ if(e.target===m) fechar(); };
  document.body.appendChild(m); desenhar();
}
function confirmarFlush(chaves, fecharAnterior){
  const m=document.createElement('div'); m.className='modal';
  const itens=ALVOS_FLUSH.filter(a=>chaves.includes(a.k));
  m.innerHTML=`<div class="sheet risco" style="max-width:520px">
    <div class="hd"><span class="eyebrow">Confirmação final</span>
      <span class="hint" style="margin-left:6px">passo 2 de 2</span>
      <button class="mini" id="f2X" style="margin-left:auto">Cancelar</button></div>
    <div class="bd">
      <div class="avisobox">
        <h3>Isso não tem como desfazer</h3>
        <p style="margin:0;font-size:13.5px">Vai ser apagado do navegador, para sempre:</p>
        <ul>${itens.map(a=>`<li><strong>${a.rot}</strong> — ${a.dsc()}</li>`).join('')}</ul>
      </div>
      <p style="margin:0;font-size:13.5px">Para liberar o botão, escreva <strong>APAGAR</strong> no campo abaixo.</p>
      <div class="digite">
        <input id="f2Palavra" placeholder="APAGAR" autocomplete="off" spellcheck="false">
        <span class="hint" id="f2Dica">o botão continua travado até a palavra estar certa</span>
      </div>
      <div class="modalacts">
        <button class="mini" id="f2Backup">Exportar backup antes</button>
        <span style="margin-left:auto;display:flex;gap:8px">
          <button id="f2Cancel">Cancelar, não apagar</button>
          <button class="apagar" id="f2Go" disabled>Apagar definitivamente</button>
        </span>
      </div>
    </div></div>`;
  const fechar=()=>m.remove();
  m.onclick=e=>{ if(e.target===m) fechar(); };
  document.body.appendChild(m);
  const campo=m.querySelector('#f2Palavra'), botao=m.querySelector('#f2Go');
  campo.oninput=()=>{
    const certo = campo.value.trim().toUpperCase()==='APAGAR';
    botao.disabled=!certo;
    m.querySelector('#f2Dica').textContent = certo? 'pode apagar' : 'o botão continua travado até a palavra estar certa';
  };
  campo.onkeydown=e=>{ if(e.key==='Enter') e.preventDefault(); };   // nada de apagar sem clicar
  m.querySelector('#f2X').onclick=fechar;
  m.querySelector('#f2Cancel').onclick=fechar;
  m.querySelector('#f2Backup').onclick=()=>exportar();
  botao.onclick=()=>{
    if(campo.value.trim().toUpperCase()!=='APAGAR') return;
    executarFlush(chaves);
    fechar(); if(fecharAnterior) fecharAnterior();
  };
  setTimeout(()=>campo.focus(),30);
}
function executarFlush(chaves){
  const padrao=estadoPadrao();
  let semFichas=false;                                     // (pediu para apagar as fichas, e não havia nenhuma que pudesse sair)
  if(chaves.includes('personagens')){
    const c=campDoFlush(), saem=new Set(fichasDoFlush().map(p=>p.id));
    semFichas=!!c && !saem.size;
    if(!c){ S.personagens=[]; S.sel=null; S.grupos=[]; S.fechados=[]; S.filtroTags=[]; }
    else {                                                 // (com campanhas: só as fichas e os grupos da campanha em vista)
      S.personagens=S.personagens.filter(p=>!saem.has(p.id));
      if(saem.has(S.sel)) S.sel=S.personagens[0]?.id||null;
      if(c.camp && saem.size) porGrupos(c.camp, []);
      saem.forEach(id=>FichasMesa.esquecer(id));
    }
    (S.situacoes||[]).forEach(sit=>{                       // tira da Mesa quem deixou de existir
      sit.participantes=(sit.participantes||[]).filter(pt=>!pt.pcId || S.personagens.some(p=>p.id===pt.pcId));
    });
  }
  if(chaves.includes('situacoes')){ S.situacoes=[]; S.selSit=null; }
  if(chaves.includes('tabelas')) S.tabelas=[];
  if(chaves.includes('bib')){ S.bib=null; indexarArvores(); }
  if(chaves.includes('log'))     S.log=[];
  if(chaves.includes('cfg'))     S.cfg=padrao.cfg;
  migrar(); save(); render();
  toast(semFichas && chaves.length===1? 'Nenhuma ficha foi apagada.' : 'Dados apagados');
}

/* ---------- exportar / importar ---------- */
function exportar(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='tinycats-fichas-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Arquivo exportado');
}
function ehArquivoDeArvores(d){
  if(!d || typeof d!=='object') return false;
  if(d.formato==='urgm-skilltree-doc' || d.formato==='urgm-skilltree-pacote') return true;
  if(d.biblioteca && Array.isArray(d.biblioteca.arvores)) return true;
  return Array.isArray(d.arvores) && Array.isArray(d.pools);
}
function importarArvores(d){
  const b = (d.biblioteca && Array.isArray(d.biblioteca.arvores)) ? d.biblioteca : d;
  const bib = normalizarBib({
    nome: b.nome || 'Árvores de Habilidade',
    pools: b.pools || [], naturezas: b.naturezas || [], usos: b.usos || [],
    tipos: b.tipos || null, arvores: b.arvores || []
  });
  if(!bib.arvores.length){ toast('Esse arquivo não traz nenhuma árvore'); return; }
  S.bib=bib; indexarArvores();
  // o arquivo do mestre também guarda a distribuição dele — só traz se você mandar
  const vindos=Array.isArray(d.personagens)? d.personagens : [];
  const chave=t=>String(t||'').trim().toLowerCase();
  const pares=vindos.map(v=>({v, pc:S.personagens.find(p=>chave(p.nome)===chave(v.nome))})).filter(x=>x.pc);
  let trazidos=0;
  if(pares.length && confirm('O arquivo traz a distribuição de '+pares.length+' personagem(ns) com o mesmo nome ('
      +pares.map(x=>x.pc.nome).join(', ')+'). Trazer a alocação deles para cá? Isso substitui o que estiver na ficha.')){
    pares.forEach(({v,pc})=>{
      pc.skills=Object.assign({
        arvores:(v.arvores||[]).filter(id=>arvPorId(id)),
        pontos:Object.assign({}, v.pontos||{}),
        alocados:Object.assign({}, v.alocados||{})
      }, pc.skills&&pc.skills.ramos? {ramos:pc.skills.ramos} : null);       // (os caminhos que o mestre abriu ficam)
      trazidos++;
    });
  }
  S.personagens.forEach(podarSkills);
  if(S.abaFicha!=='skills'){ S.abaFicha='skills'; }
  save(); render();
  toast(bib.arvores.length+' árvore(s) carregada(s)'+(trazidos?' · alocação de '+trazidos+' personagem(ns)':''));
}
function importar(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const d=JSON.parse(fr.result);
      if(ehArquivoDeArvores(d)){ importarArvores(d); return; }
      if(!d.personagens) throw new Error('sem personagens');
      if(FichasMesa.trazer(d)) return;   // dentro de uma mesa: o arquivo só acrescenta, nada é substituído
      if(confirm('Substituir os dados atuais pelos do arquivo?')){
        S=d; migrar(); S.sel=S.personagens[0]?.id||null; save(); render(); toast('Dados importados');
      }
    }catch(e){ toast('Arquivo inválido: '+e.message); }
  };
  fr.readAsText(file);
}

/* ---------- tema: automático, claro ou escuro ---------- */
const TEMAS=[
  {k:'auto',  rot:'Tema: automático', icone:'◐'},
  {k:'claro', rot:'Tema: claro',      icone:'☀'},
  {k:'pedra', rot:'Tema: escuro',     icone:'☾'},
];
function temaEscolhido(){ return document.documentElement.getAttribute('data-tema-escolha')||'auto'; }
function aplicarTema(k){
  const mq=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)');
  const escuro = k==='pedra' || (k==='auto' && mq && mq.matches);
  document.documentElement.setAttribute('data-tema', escuro?'pedra':'claro');
  document.documentElement.setAttribute('data-tema-escolha', k);
  try{ localStorage.setItem('urgm_calc_tema', k); }catch(e){}
  const b=document.getElementById('btnTema');
  if(b){ const t=TEMAS.find(x=>x.k===k)||TEMAS[0]; b.textContent=t.icone+' '+t.rot.replace('Tema: ',''); b.title=t.rot; }
}
(function ligarTema(){
  aplicarTema(temaEscolhido());
  document.getElementById('btnTema').onclick=()=>{
    const i=TEMAS.findIndex(x=>x.k===temaEscolhido());
    aplicarTema(TEMAS[(i+1)%TEMAS.length].k);
  };
  const mq=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)');
  if(mq&&mq.addEventListener) mq.addEventListener('change',()=>{ if(temaEscolhido()==='auto') aplicarTema('auto'); });
})();

/* ---------- header que some ao descer e volta ao subir ---------- */
(function barraEsperta(){
  const bar=document.getElementById('topbar');
  let ultimo=window.scrollY, parado=null;
  const alturaVar=()=>document.documentElement.style.setProperty('--topH', bar.offsetHeight+'px');
  alturaVar(); window.addEventListener('resize',alturaVar);
  window.addEventListener('scroll',()=>{
    const y=Math.max(0,window.scrollY);
    if(y<=90){ bar.classList.remove('esconde'); ultimo=y; return; }   // perto do topo, sempre visível
    if(y>ultimo+8){ bar.classList.add('esconde'); ultimo=y; }          // descendo
    else if(y<ultimo-8){ bar.classList.remove('esconde'); ultimo=y; }  // subindo: volta na hora
    clearTimeout(parado);
    parado=setTimeout(()=>{ultimo=Math.max(0,window.scrollY)},140);    // solta a âncora quando para
  },{passive:true});
  window.mostrarBarra=()=>bar.classList.remove('esconde');
})();

/* ---------- bootstrap ---------- */
function render(){
  const aba=S.aba||'fichas';
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===aba));
  ['fichas','mesa','eventos'].forEach(t=>{document.getElementById('tab-'+t).hidden = (t!==aba)});
  if(aba==='fichas'){renderLista();renderFicha()}
  else if(aba==='mesa') renderMesa();
  else renderEventos();
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{
  S.aba=b.dataset.tab; save(); render();
  window.mostrarBarra&&window.mostrarBarra();
  window.scrollTo({top:0,behavior:'smooth'});
});
/* completa estados salvos por versões anteriores */
function migrar(){
  const p=estadoPadrao();
  if(!S.cfg) S.cfg=p.cfg;
  S.situacoes=S.situacoes||[];
  S.tabelas=S.tabelas||p.tabelas;
  S.log=S.log||[];
  S.aba=S.aba||'fichas';
  S.grupos=S.grupos||[];
  // (os grupos e as missões do grupo de cada campanha da mesa, e os blocos da lista que a pessoa deixou abertos)
  const mapaDe=k=>{ if(!S[k] || typeof S[k]!=='object' || Array.isArray(S[k])) S[k]={}; };
  mapaDe('gruposCamp'); mapaDe('missoesCamp');
  S.abertos=Array.isArray(S.abertos)? S.abertos : [];
  if(S.bib) normalizarBib(S.bib);
  S.skillsUI=S.skillsUI||{equipar:false, distribuir:true};
  S.skillsUI.distribuir = S.skillsUI.distribuir!==false;
  S.fechados=S.fechados||[];
  S.filtroTags=S.filtroTags||[];
  if(!S.selSit) S.selSit=S.situacoes[0]?.id||null;
  (S.personagens||[]).forEach(pc=>{
    pc.lado=pc.lado||'Aliado';
    pc.grupo=pc.grupo||'';
    pc.tags=Array.isArray(pc.tags)? pc.tags
      : (pc.tags? String(pc.tags).split(',').map(t=>t.trim()).filter(Boolean) : []);
    if(pc.poderes && !Array.isArray(pc.poderes)){          // formato antigo (contador único)
      const a=pc.poderes, nomes=(a.lista||'').split('\n').map(x=>x.trim()).filter(Boolean);
      pc.poderes = nomes.length
        ? nomes.map(n=>({id:uid(), nome:n, atual: nomes.length===1?(+a.atual||0):0, max: nomes.length===1?(+a.max||0):0}))
        : ((+a.max||0)||(+a.atual||0) ? [{id:uid(), nome:'Poder divino', atual:+a.atual||0, max:+a.max||0}] : []);
    }
    pc.poderes=pc.poderes||[];
    pc.estaque=pc.estaque||{a:'',b:''};
    /* fixa, fonte e a configuração da disputa ficam em cada ficha, para o mestre
       voltar num personagem no meio da batalha e achar tudo como deixou */
    pc.rol=pc.rol||{fixa:(+(S.rol||{}).fixa||0), fonte:((S.rol||{}).fonte==='base'?'base':'total')};
    pc.rol.fixa=Math.max(0,+pc.rol.fixa||0);
    pc.rol.fonte = pc.rol.fonte==='base' ? 'base' : 'total';
    pc.disputa=pc.disputa||Object.assign({atrA:'FOR', alvoId:'', atrB:'FOR', fixaB:0, valorB:40}, S.disputa||{});
    pc.defesas=pc.defesas||{DFF:0,DFM:0};
    ['DFF','DFM'].forEach(k=>{ if(pc.defesas[k]==null) pc.defesas[k]=0; });   // (o Bloqueio ausente vale 0: abrir a ficha não grava nada nela)
    pc.skills=pc.skills||{arvores:[],pontos:{},alocados:{}};
    pc.skills.arvores=Array.isArray(pc.skills.arvores)?pc.skills.arvores:[];
    pc.skills.pontos=pc.skills.pontos||{}; pc.skills.alocados=pc.skills.alocados||{};
    pc.habilidades=pc.habilidades||[];
    pc.habilidades.forEach(h=>{ if(!h.tipo) h.tipo = (h.ativa===false)?'Inativo':'Ativo'; delete h.ativa; });
    pc.itens=pc.itens||[]; pc.recursos=pc.recursos||[]; pc.tiers=pc.tiers||{FOR:'A',DES:'B',AGI:'C',VIT:'D',CAN:'E'};
    // (lote 7) um item com níveis: o espelho do nível de agora confere com a lista (o que confere fica o mesmo objeto)
    if(window.TC && TC.rules && TC.rules.espelharItem) pc.itens=pc.itens.map(it=>TC.rules.espelharItem(it));
    pc.itens.forEach(it=>{ it.bonus=it.bonus||{};
      DERIV.forEach(d=>{ if(it.bonus[d.k]==null) it.bonus[d.k]=0; });
      ['DFF','DFM'].forEach(k=>{ if(it.bonus[k]==null) it.bonus[k]=0; }); });   // (o Bloqueio ausente num item vale 0: a ficha não é regravada só por abrir)
  });
  indexarArvores();
  (S.personagens||[]).forEach(podarSkills);
}
document.getElementById('btnNew').onclick=()=>{
  const p=personagemPadrao('Novo personagem','','C',1);
  if(FichasMesa.ativo() && !FichasMesa.mestre()) FichasExtras.tornarLivre(p, true);
  S.personagens.push(FichasMesa.nascer(p)); S.sel=p.id; S.abaFicha='atributos'; save(); render();     // (a ficha nova abre em "Atributos": o "Quem é" vem logo)
  document.getElementById('f_nome')?.select();
};
document.getElementById('btnGrupo').onclick=()=>{
  // (com campanhas, o grupo novo é da que está em vista)
  const b=FichasMesa.blocos().find(x=>x.vista)||{camp:''};
  if(b.encerrada){ toast('Campanha encerrada: só consulta.'); return; }
  const g=prompt(b.camp? 'Nome do grupo (na campanha '+b.nome+'):' : 'Nome do grupo:','');
  if(!g||!g.trim()) return;
  fixarGrupos(); const l=gruposDe(b.camp); if(!l.includes(g.trim())) l.push(g.trim());
  save(); renderLista();
};
document.getElementById('busca').oninput=renderLista;
document.getElementById('btnCfg').onclick=abrirCfg;
document.getElementById('btnExport').onclick=exportar;
document.getElementById('btnImport').onclick=()=>document.getElementById('fileIn').click();
document.getElementById('btnFlush').onclick=abrirFlush;
document.getElementById('fileIn').onchange=e=>{if(e.target.files[0])importar(e.target.files[0])};

(async function init(){
  let saved;
  try{ saved=await loadState(); }
  catch(e){ FichasMesa.falhou(e); return; }
  if(saved && saved.personagens){ S=saved; }
  migrar();
  if(!S.sel) S.sel=S.personagens[0]?.id||null;
  render();
  FichasMesa.depoisDeAbrir();
  // outro sistema do site pediu para abrir uma ficha ("Abrir a ficha", no Acampamento)
  // (lote 7, parte 6) a busca rápida do site também pede um item: { pc, item } nos equipamentos, { pc, bolsa } na bolsa
  try{ if(window.TC && TC.ponte && TC.ponte.aoIr) TC.ponte.aoIr(a=>{
    if(!a || !a.pc) return;
    const pc=S.personagens.find(p=>p.id===a.pc);
    if(!pc){ toast('Esta ficha não está mais aqui (ou não chegou a este aparelho).'); return; }
    S.sel=a.pc; S.aba='fichas'; save(); render();
    if(a.item||a.bolsa){ if(!FichasExtras.mostrarItem(pc,a)){ window.scrollTo({top:0}); toast('Este item não está mais na ficha de '+(pc.nome||'quem o tinha')+'.'); } }
    else window.scrollTo({top:0});
  }); }catch(e){}
  // (lote 16) o guia da casca vai mostrar um lugar da ficha: antes, a aba da ficha em que ele fica
  try{ if(window.TC && TC.ponte && TC.ponte.aoMostrar) TC.ponte.aoMostrar(o=>{ if(o && o.sub) irParaAba(o.sub); }); }catch(e){}
})();
</script>
