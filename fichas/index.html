/* ---------- cálculo ---------- */
function ptsDoLevel(lvl){
  const t=S.cfg.niveis, row=t.find(r=>+r.lvl===+lvl);
  if(row) return +row.pts;
  if(!t.length) return 0;
  const last=t[t.length-1], first=t[0];
  if(+lvl>+last.lvl) return +last.pts;      // acima da tabela: trava no último
  return +first.pts;
}
function multTier(tier){
  const r=S.cfg.tiersPersonagem.find(x=>x.t===tier);
  return r? +r.m : 1;
}
function pctDe(pc,tier){
  const tab = pc.pctProprio || S.cfg.pct;
  const v = tab[tier];
  return v==null?0:+v;
}
function arred(n){
  if(n==null||isNaN(n))return n;
  switch(S.cfg.arredondar){
    case 'floor': return Math.floor(n);
    case 'ceil':  return Math.ceil(n);
    case 'round': return Math.round(n);
    default:      return Math.round(n*1000)/1000;
  }
}
function bonusItens(pc){
  const b={}; ATRIBS.forEach(a=>b[a.k]=0); DERIV.forEach(d=>b[d.k]=0); DEFESAS.forEach(d=>b[d.k]=0);
  (pc.itens||[]).forEach(it=>{ if(it.equipado!==false){
    ATRIBS.forEach(a=>{ b[a.k]+= (+it.bonus?.[a.k]||0); });
    DERIV.forEach(d=>{ b[d.k]+= (+it.bonus?.[d.k]||0); });
    DEFESAS.forEach(d=>{ b[d.k]+= (+it.bonus?.[d.k]||0); });
  }});
  return b;
}
function calcular(pc){
  // As contas são as das regras compartilhadas do site (conferidas contra as daqui): as mesmas, mais os bônus dos
  // nódulos escolhidos na árvore. O cálculo original, logo abaixo, fica de reserva se a biblioteca não carregar.
  if(window.TC && TC.rules && !calcular.semLib){
    try{ return TC.rules.calcular(pc, S.cfg, {arvore: TC.rules.bonusDaArvore(pc.skills, S.bib), temp: pc.estado && pc.estado.tmp, fer: pc.estado && pc.estado.fer}); }
    catch(e){ console.error(e); calcular.semLib=true; }
  }
  const mult=multTier(pc.tier);
  const total    = ptsDoLevel(pc.level)*mult;
  const totalAnt = ptsDoLevel(Math.max(1,(+pc.level)-1))*mult;
  const eq=bonusItens(pc);
  const base={},ant={},tot={};
  ATRIBS.forEach(a=>{
    const p=pctDe(pc,pc.tiers[a.k]);
    base[a.k]=arred(total*p);
    ant[a.k] =arred(totalAnt*p);
    tot[a.k] =base[a.k]+eq[a.k];
  });
  const def={};                                   // manual da ficha + equipamentos
  DEFESAS.forEach(d=>{ def[d.k]=(+((pc.defesas||{})[d.k])||0)+eq[d.k]; });
  const der={}, derAnt={};                       // sempre a partir dos valores BASE (o Embate usa também o Bloqueio)
  DERIV.forEach(d=>{ der[d.k]=d.calc(base,def)+eq[d.k]; derAnt[d.k]=d.calc(ant,def)+eq[d.k]; });
  const vars={LVL:+pc.level, NIVEL:+pc.level, MULT:mult, PTS:arred(total), TOTAL:arred(total)};
  DERIV.forEach(d=>{
    vars[d.k]=der[d.k]; vars[d.k+'_B']=d.calc(base,def); vars[d.k+'_EQ']=eq[d.k];
    d.aliases.forEach(al=>{vars[al]=der[d.k]});
  });
  DEFESAS.forEach(d=>{
    vars[d.k]=def[d.k]; vars[d.k+'_B']=+((pc.defesas||{})[d.k])||0; vars[d.k+'_EQ']=eq[d.k];
    d.aliases.forEach(al=>{vars[al]=def[d.k]});
  });
  ATRIBS.forEach(a=>{
    vars[a.k]=tot[a.k];               // com equipamento
    vars[a.k+'_B']=base[a.k];         // base, sem equipamento
    vars[a.k+'_EQ']=eq[a.k];          // só o bônus
    a.aliases.forEach(al=>{vars[al]=tot[a.k]; vars[al+'_B']=base[a.k]; vars[al+'_EQ']=eq[a.k];});
  });
  const recursos=(pc.recursos||[]).map(r=>{
    let val=null,err=null;
    try{ val=evalFormula(r.fml,vars); }catch(e){ err=e.message; }
    return {...r, val, err};
  });
  return {mult,total,totalAnt,base,ant,tot,eq,der,derAnt,def,vars,recursos};
}
function somaPercentuaisUsados(pc){
  return ATRIBS.reduce((s,a)=>s+pctDe(pc,pc.tiers[a.k]),0);
}

/* ---------- flor de atributos (5 pétalas = 5 atributos) ---------- */
function petala(cx,cy,ang,R,largura){
  const rad=a=>a*Math.PI/180;
  const px=(a,r)=>[cx+r*Math.sin(rad(a)), cy-r*Math.cos(rad(a))];
  const [tx,ty]=px(ang,R);
  const [c1x,c1y]=px(ang-largura,R*0.62);
  const [c2x,c2y]=px(ang+largura,R*0.62);
  return `M${cx} ${cy} C${c1x} ${c1y} ${tx} ${ty} ${tx} ${ty} C${tx} ${ty} ${c2x} ${c2y} ${cx} ${cy} Z`;
}
function florSVG(c){
  const W=300,H=300,cx=150,cy=152,R=104;
  const angs=[0,72,144,216,288];
  const maxv=Math.max(1,...ATRIBS.map(a=>Math.max(c.tot[a.k],c.base[a.k])));
  const esc=v=>R*Math.max(0.04,Math.min(1,v/(maxv*1.06)));
  const pt=(ang,r)=>[cx+r*Math.sin(ang*Math.PI/180), cy-r*Math.cos(ang*Math.PI/180)];
  const poly=(vals)=>vals.map((v,i)=>pt(angs[i],esc(v)).map(n=>n.toFixed(1)).join(',')).join(' ');
  const petalas=angs.map(a=>`<path d="${petala(cx,cy,a,R,34)}" fill="var(--flor-petala)" stroke="var(--flor-borda)" stroke-width="1"/>`).join('');
  const grid=[0.25,0.5,0.75,1].map(f=>`<polygon points="${angs.map(a=>pt(a,R*f).map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--radar)" stroke-width="1"/>`).join('');
  const eixos=angs.map(a=>{const[x,y]=pt(a,R);return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--radar)" stroke-width="1"/>`}).join('');
  const labels=angs.map((a,i)=>{
    const[x,y]=pt(a,R+22);
    const anchor = Math.abs(Math.sin(a*Math.PI/180))<0.2?'middle':(Math.sin(a*Math.PI/180)>0?'start':'end');
    return `<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${anchor}" font-family="IBM Plex Mono,monospace" font-size="11" fill="var(--ink-soft)">${ATRIBS[i].k}</text>
            <text x="${x.toFixed(1)}" y="${(y+17).toFixed(1)}" text-anchor="${anchor}" font-family="IBM Plex Mono,monospace" font-size="10.5" fill="var(--ink)" font-weight="600">${c.tot[ATRIBS[i].k]}</text>`;
  }).join('');
  const vb=ATRIBS.map(a=>c.base[a.k]), vt=ATRIBS.map(a=>c.tot[a.k]);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:320px" role="img" aria-label="Flor de atributos">
    ${petalas}${grid}${eixos}
    <polygon points="${poly(vt)}" fill="var(--radar-miolo)" stroke="var(--teal)" stroke-width="2.2"/>
    <polygon points="${poly(vb)}" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="5 4"/>
    ${labels}
  </svg>`;
}

/* ---------- render: elenco ---------- */
function renderLista(){
  const ul=document.getElementById('lista'); ul.innerHTML='';
  const tags=todasTags(), ft=S.filtroTags||[];
  const barra=document.getElementById('tagbar');
  barra.innerHTML = tags.length
    ? tags.map(t=>`<button class="tag ${ft.includes(t)?'on':''}" data-ftag="${esc(t)}">${esc(t)}</button>`).join('')
      + (ft.length?`<button class="tag limpar" data-ftag="__limpar__">limpar</button>`:'')
    : '<span class="hint" style="font-size:11px">Sem tags ainda — adicione na ficha.</span>';

  /* Com campanhas na mesa, a lista vem em blocos: o da campanha em vista (aberto, em cima), o do mundo e os das outras
     campanhas (recolhidos). Cada bloco tem os grupos dele. Sem campanhas, é um bloco só, sem nome: a lista de sempre. */
  const blocos=FichasMesa.blocos(), mestre=!FichasMesa.ativo()||FichasMesa.mestre(), comCamp=blocos.length>1 || !!blocos[0].nome;
  const organiza=FichasMesa.organiza();        // (passar ficha ou grupo de uma campanha para outra: só o mestre da mesa)
  /* (lote 16) Na mesa, o mestre vê cada grupo em dois blocos: os ativos em cima e, embaixo, "Inativos (n)", recolhido.
     Arrastar uma ficha de um bloco para o outro muda o ativo dela (o mesmo da caixinha "Personagem ativo"). */
  const divide=FichasMesa.ativo() && FichasMesa.mestre();
  let html='';
  blocos.forEach(b=>{
    const doBloco=b.unico? S.personagens : S.personagens.filter(p=>FichasMesa.blocoDe(p)===b.camp);
    const trancado=!!b.encerrada || b.camp==='?';      // (campanha encerrada: só consulta)
    /* Só o mestre da mesa passa ficha de um bloco para outro: para os outros, um bloco sem nenhuma ficha (que não seja o
       da campanha em vista) não diz nada, e não aparece. */
    if(comCamp && !organiza && !b.vista && !doBloco.length) return;
    // um bloco sem ninguém em que dá para soltar uma ficha: o da campanha em vista e, para o mestre da mesa, qualquer um aberto
    const soltarAqui=comCamp && !doBloco.length && (b.vista || (organiza && !trancado));
    const secoes=[...gruposOrdenados(b.camp), ''];
    let dentro='';
    secoes.forEach(g=>{
      const membros=doBloco.filter(p=>(p.grupo||'')===g && casaFiltro(p));
      const total=doBloco.filter(p=>(p.grupo||'')===g).length;
      if(g==='' && !total && !soltarAqui) return;        // "Sem grupo" só aparece se tiver alguém (ou para o bloco vazio ter onde soltar)
      if(filtroAtivo() && !membros.length) return;       // filtrando: esconde seção vazia
      const chave=chaveSec(b.camp,g), fechado=(S.fechados||[]).includes(chave);
      const ativos=divide? membros.filter(FichasMesa.ativoNaFicha) : membros, inativos=divide? membros.filter(p=>!FichasMesa.ativoNaFicha(p)) : [];
      const abertoIn=inativos.length>0 && (filtroAtivo() || (S.abertos||[]).includes(chave+'\u0002in'));
      dentro+=`<li class="sec" data-sec="${esc(g||SEM)}" data-camp="${esc(b.camp)}">
        <div class="sechd">
          <button class="caret" data-toggle="${esc(g||SEM)}">${fechado?'▸':'▾'}</button>
          <span class="secnome">${g?esc(g):'Sem grupo'}</span>
          <span class="cnt mono">${membros.length}${membros.length!==total?'/'+total:''}</span>
          ${g && !trancado?`<span class="secacts">
            <button class="mini" data-gmove="${esc(g)}|-1" title="Subir grupo">▲</button>
            <button class="mini" data-gmove="${esc(g)}|1" title="Descer grupo">▼</button>
            <button class="mini" data-gren="${esc(g)}" title="Renomear">✎</button>
            ${comCamp && organiza?`<button class="mini" data-gcamp="${esc(g)}" title="Passar o grupo para outra campanha…" aria-label="Passar o grupo ${esc(g)} para outra campanha">⇄</button>`:''}
            <button class="mini danger" data-gdel="${esc(g)}" title="Desfazer grupo">×</button>
          </span>`:''}
        </div>
        <ul class="secitens" data-lista="${esc(g||SEM)}" data-camp="${esc(b.camp)}" ${trancado?'data-trancado="1"':''} ${fechado?'hidden':''}>
          ${linhasComPets(ativos) || (trancado?'<li class="vazio hint">'+(inativos.length?'ninguém ativo':'ninguém aqui')+'</li>':'<li class="vazio hint">'+(inativos.length?'ninguém ativo: arraste alguém pra cá':'arraste alguém pra cá'+(comCamp && !b.camp && soltarAqui?': quem é do mundo aparece em todas as campanhas':''))+'</li>')}
        </ul>${divide?`
        <div class="inat${inativos.length?'':' zero'}" data-inat="${esc(g||SEM)}" ${fechado?'hidden':''}>
          <button class="inathd" data-inhd="${esc(g||SEM)}" aria-expanded="${abertoIn}" title="${inativos.length?(abertoIn?'Recolher':'Mostrar')+' quem está fora do grupo ativo. ':''}Arraste uma ficha para cá para tirá-la do grupo ativo (ao puxar o grupo na cena, ela vem desmarcada); arraste de volta para cima para ativá-la.">
            <span class="caret" aria-hidden="true">${abertoIn?'▾':'▸'}</span><span class="inatnome">Inativos</span><span class="cnt mono">${inativos.length}</span></button>
          <ul class="secitens inativas" data-lista="${esc(g||SEM)}" data-camp="${esc(b.camp)}" data-inativo="1" ${trancado?'data-trancado="1"':''} ${abertoIn?'':'hidden'}>${linhasComPets(inativos)}</ul>
        </div>`:''}</li>`;
    });
    if(!comCamp){ html+=dentro; return; }
    if(filtroAtivo() && !dentro) return;                 // filtrando: esconde o bloco sem ninguém
    // o bloco em vista começa aberto (dá para recolher); os outros começam recolhidos (dá para abrir)
    const kb=chaveBloco(b.camp), fechadoB = filtroAtivo()? false : b.vista ? (S.fechados||[]).includes(kb) : !(S.abertos||[]).includes(kb);
    html+=`<li class="bloco${b.vista?' vista':''}" data-bloco="${esc(b.camp)}">
      <div class="blocohd">
        <button class="caret" data-btoggle="${esc(b.camp)}" aria-expanded="${!fechadoB}" aria-label="${fechadoB?'Abrir':'Recolher'} ${esc(b.nome)}">${fechadoB?'▸':'▾'}</button>
        <span class="bloconome">${esc(b.nome)}</span>
        <span class="cnt mono">${doBloco.length}</span>
        ${b.encerrada?'<span class="blocotag">encerrada</span>':b.vista && b.camp?'<span class="blocotag vis">em vista</span>':''}
      </div>
      <ul class="blocoitens" ${fechadoB?'hidden':''}>${dentro || '<li class="vazio hint">'+(b.camp?'nenhuma ficha nesta campanha ainda':'nenhuma ficha do mundo: o que estiver aqui aparece em todas as campanhas')+'</li>'}</ul></li>`;
  });
  ul.innerHTML = html || '<li><div class="empty" style="padding:18px">Nada encontrado.</div></li>';
  ligarElenco();
}
/* As linhas de uma seção do elenco: cada pet logo embaixo do dono (quando os dois estão nela); o pet cujo dono não está
   ali aparece no lugar dele, com o "pet de …" dizendo de quem é. */
function linhasComPets(membros){
  const ids=new Set(membros.map(p=>p.id));
  return membros.filter(p=>!(p.petDe && ids.has(p.petDe))).map(p=>linhaElenco(p)+membros.filter(x=>x.petDe===p.id).map(x=>linhaElenco(x,true)).join('')).join('');
}
// a chave com que a tela lembra se uma seção (ou um bloco) está recolhida; as do mundo ficam como sempre foram
function chaveSec(camp,g){ return (camp? camp+'\u0001' : '')+(g||SEM); }
function chaveBloco(camp){ return 'bloco\u0001'+(camp||''); }
/* iniciativa da ficha: um número ou uma fórmula (as mesmas variáveis dos recursos) */
function iniciativaDe(pc){
  if(window.TC && TC.rules){ try{ return TC.rules.iniciativa(pc, S.cfg, {arvore: TC.rules.bonusDaArvore(pc.skills, S.bib), temp: pc.estado && pc.estado.tmp, fer: pc.estado && pc.estado.fer}); }catch(e){} }
  const n=parseInt(pc.ini,10); return {val: isFinite(n)? n : 0, err:null};
}
function iniTexto(pc){ const r=iniciativaDe(pc); return r.err? 'fórmula com erro' : (String(pc.ini||'').trim()===''? 'sem bônus' : '= '+(r.val>=0?'+':'−')+Math.abs(r.val)); }
/* valor atual de um recurso: o que foi anotado; sem anotação, está no começo da barra (cheia, se ela não tem "começa em") */
// (lote 8) o Limite de dano: só um número de consulta, que quem edita a ficha escreve (null: sem)
function limiteDeDano(pc){ const v=pc&&pc.limDano; return v!=null && isFinite(+v) && +v>=0 ? Math.round(+v*10)/10 : null; }
function temAtual(pc,r){ const rec=pc.estado&&pc.estado.rec; return !!rec && isFinite(rec[r.id]) && rec[r.id]!==null; }
/* (lote 8) A ferida permanente (marcada pelo mestre na cena, na condição do token): a ponta da barra apodrece. A cura —
   até a total — não passa do teto (o máximo menos o podre), até o mestre tirar a ferida. */
function podreDoRecurso(pc,r){
  const pd=pc.estado&&pc.estado.podre, v=pd&&typeof pd==='object'? +pd[r.id] : 0, max=arred(r.val);
  return v>0 && isFinite(v) && max>0 ? Math.round(Math.min(v,max)*10)/10 : 0;
}
function tetoDoRecurso(pc,r){ const piso=r.min<0? r.min : 0; return Math.max(piso, arred(r.val)-podreDoRecurso(pc,r)); }
function atualDoRecurso(pc,r){
  const v=temAtual(pc,r)? +pc.estado.rec[r.id] : (r.inicio!=null? r.inicio : arred(r.val));
  return podreDoRecurso(pc,r)>0 ? Math.min(v, tetoDoRecurso(pc,r)) : v;
}
/* As barrinhas embaixo da imagem do personagem: cada recurso (HP, SP…) com o valor atual, só para ver de relance.
   Mexer continua sendo no quadro dos recursos; as cores são as das barras dos tokens, na mesma ordem. */
const CORES_BARRINHA=['#d6524b','#4a9be0','#e2b23e','#6fbf73','#b07ad9','#e58a4e','#4fc3c0','#d96aa0'];
/* Chegou uma mudança da mesa enquanto alguém digita nesta ficha. A ficha inteira só é redesenhada quando a pessoa
   sai do campo (para não tirar o cursor de quem escreve), mas o que muda no meio do jogo — o valor das barras, a
   sobrevida, as moedas — aparece já, nos outros campos. */
function pintarAoVivo(){
  const host=document.getElementById('ficha'), pc=S.personagens.find(p=>p.id===S.sel);
  if(!host||!pc) return;
  const c=calcular(pc), foco=document.activeElement;
  host.querySelectorAll('[data-resatual]').forEach(i=>{
    const r=(c.recursos||[]).find(x=>x.id===i.dataset.resatual);
    if(i===foco||!r||r.err||r.val==null) return;
    const at=atualDoRecurso(pc,r), v=String(at);
    if(i.value!==v) i.value=v;
    const box=i.closest('.rsb'); if(box) box.classList.toggle('neg', at<0);
  });
  host.querySelectorAll('[data-ressob]').forEach(i=>{ if(i===foco) return; const v=String(FichasExtras.sobrevidaDe(pc,{id:i.dataset.ressob})); if(i.value!==v) i.value=v; });
  const lp=host.querySelector('#f_lapros');
  if(lp && lp!==foco){ const v=String(FichasExtras.laprosDe(pc)); if(lp.value!==v) lp.value=v; }
  pintarBarrinhas(host, pc);
  // (e os quadros em que a pessoa não está: relacionamentos, bônus temporários, corpo, ascensão, XP, missões)
  try{ FichasExtras.aoVivo(pc); FichasQuadros.aoVivo(pc); }catch(e){ console.error(e); }
}
/* a pata do pet (lote 6): no elenco, embaixo do dono, e no alto da ficha */
const PATA_SVG='<svg class="pata" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><ellipse cx="6" cy="10" rx="2.2" ry="2.8"/><ellipse cx="10" cy="5.6" rx="2.2" ry="2.8"/><ellipse cx="14.4" cy="5.6" rx="2.2" ry="2.8"/><ellipse cx="18.4" cy="10" rx="2.2" ry="2.8"/><path d="M12.2 11.2c3.2 0 6.1 3.9 6.1 6.4 0 1.9-1.6 2.6-3.1 2.6-1.3 0-2-.7-3-.7s-1.7.7-3 .7c-1.5 0-3.1-.7-3.1-2.6 0-2.5 2.9-6.4 6.1-6.4z"/></svg>';
function linhaElenco(p, embaixo){
  // (ficha de campanha encerrada — ou de uma campanha que não aparece aqui — não se arrasta: fica onde está)
  const fixa=FichasMesa.encerrada(p._camp) || FichasMesa.blocoDe(p)==='?';
  return `<li class="pcrow${p.petDe?' pet':''}${embaixo?' embaixo':''}" data-id="${p.id}">
    ${fixa? '<span class="grab fixo" aria-hidden="true"></span>' : `<span class="grab" data-grab="${p.id}" title="Arraste para reordenar ou mudar de grupo${FichasMesa.campanhas().length && FichasMesa.organiza()?' (ou de campanha)':''}">⠿</span>`}
    <button class="pc${p.id===S.sel?' on':''}" data-abrir="${p.id}">
      ${FichasExtras.miniatura(p)}
      <span class="pctx">
      <span class="nm">${esc(p.nome)}</span>
      <span class="mt">${p.petDe? PATA_SVG+' pet de '+esc(FichasMesa.nomeDoPetDe(p))+' · ' : FichasMesa.deJogador(p)? '' : 'Tier '+esc(p.tier)+' · '}Lvl ${p.level}${p.raca?' · '+esc(p.raca):''}${FichasMesa.nomeDoDono(p)?' · de '+esc(FichasMesa.nomeDoDono(p)):''}</span>
      <span class="linhatags">
        <span class="lado ${(p.lado||'Aliado').toLowerCase()}">${esc(p.lado||'Aliado')}</span>
        ${FichasMesa.ativo() && FichasMesa.mestre() && !FichasMesa.ativoNaFicha(p) ? '<span class="tag mini-tag inativo" title="Fora do grupo ativo: ao puxar o grupo na cena, vem desmarcado">inativo</span>' : ''}
        ${(p.tags||[]).slice(0,3).map(t=>`<span class="tag mini-tag">${esc(t)}</span>`).join('')}
        ${(p.tags||[]).length>3?`<span class="hint" style="font-size:10px">+${p.tags.length-3}</span>`:''}
      </span>
      </span>
    </button>${FichasMesa.htmlOlho(p)}</li>`;
}
function ligarElenco(){
  const ul=document.getElementById('lista');
  ul.querySelectorAll('[data-abrir]').forEach(b=>b.onclick=()=>{S.sel=b.dataset.abrir; save(); render()});
  FichasMesa.ligarOlhos(ul);
  // (cada seção é de um bloco: o grupo "Heróis" da campanha em vista não é o "Heróis" de outra)
  const campDe=b=>{ const s=b.closest('[data-camp]'); return s? s.dataset.camp||'' : ''; };
  const doGrupo=(camp,g)=>S.personagens.filter(p=>FichasMesa.blocoDe(p)===camp && (p.grupo||'')===g);
  ul.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{
    const g=chaveSec(campDe(b), b.dataset.toggle===SEM?'':b.dataset.toggle); S.fechados=S.fechados||[];
    S.fechados = S.fechados.includes(g)? S.fechados.filter(x=>x!==g) : [...S.fechados,g];
    save(); renderLista();
  });
  ul.querySelectorAll('[data-inhd]').forEach(b=>b.onclick=()=>{
    if(b.closest('.inat').classList.contains('zero') || filtroAtivo()) return;
    const k=chaveSec(campDe(b), b.dataset.inhd===SEM?'':b.dataset.inhd)+'\u0002in'; S.abertos=S.abertos||[];
    S.abertos = S.abertos.includes(k)? S.abertos.filter(x=>x!==k) : [...S.abertos,k];
    save(); renderLista();
  });
  ul.querySelectorAll('[data-btoggle]').forEach(b=>b.onclick=()=>{
    // o bloco em vista lembra se foi recolhido; os outros, se foram abertos
    const camp=b.dataset.btoggle, k=chaveBloco(camp), vista=b.closest('.bloco').classList.contains('vista'), campo=vista?'fechados':'abertos';
    S[campo]=S[campo]||[];
    S[campo] = S[campo].includes(k)? S[campo].filter(x=>x!==k) : [...S[campo],k];
    save(); renderLista();
  });
  ul.querySelectorAll('[data-gmove]').forEach(b=>b.onclick=()=>{
    const [g,d]=b.dataset.gmove.split('|'), camp=campDe(b); fixarGrupos();
    const l=gruposDe(camp), i=l.indexOf(g), j=i+ +d;
    if(i<0||j<0||j>=l.length) return;
    l.splice(j,0,l.splice(i,1)[0]); save(); renderLista();
  });
  ul.querySelectorAll('[data-gren]').forEach(b=>b.onclick=()=>{
    const g=b.dataset.gren, camp=campDe(b), novo=prompt('Novo nome do grupo:',g);
    if(!novo||novo===g) return;
    fixarGrupos();
    porGrupos(camp, gruposDe(camp).map(x=>x===g?novo:x).filter((x,i,a)=>a.indexOf(x)===i));
    doGrupo(camp,g).forEach(p=>{p.grupo=novo});
    S.fechados=(S.fechados||[]).map(x=>x===chaveSec(camp,g)?chaveSec(camp,novo):x);
    save(); render();
    // (lote 16) a caixinha do grupo vai junto com o nome novo
    FichasMesa.levarCaixa(camp||null, g, camp||null, novo).then(r=>{ if(r) render(); }, e=>toast('A caixinha do grupo não foi junto: '+e.message));
  });
  ul.querySelectorAll('[data-gdel]').forEach(b=>b.onclick=()=>{
    const g=b.dataset.gdel, camp=campDe(b), cx=FichasMesa.caixaDoGrupo(camp||null, g);
    if(!confirm('Desfazer o grupo "'+g+'"? Os personagens voltam para "Sem grupo".'+(cx&&cx.q? '\n\nA caixinha dele ('+cx.q+' lapros) fica guardada com o nome do grupo: se um grupo com esse nome voltar, ela volta junto.' : ''))) return;
    fixarGrupos();
    porGrupos(camp, gruposDe(camp).filter(x=>x!==g));
    doGrupo(camp,g).forEach(p=>{p.grupo=''});
    save(); render();
  });
  ul.querySelectorAll('[data-gcamp]').forEach(b=>b.onclick=()=>abrirPassarGrupo(campDe(b), b.dataset.gcamp));
  document.getElementById('tagbar').querySelectorAll('[data-ftag]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.ftag; S.filtroTags=S.filtroTags||[];
    if(t==='__limpar__') S.filtroTags=[];
    else S.filtroTags = S.filtroTags.includes(t)? S.filtroTags.filter(x=>x!==t) : [...S.filtroTags,t];
    save(); renderLista();
  });
  ul.querySelectorAll('[data-grab]').forEach(h=>h.onpointerdown=e=>iniciarArraste(e,h.closest('.pcrow')));
}

/* ---------- arrastar para reordenar / trocar de grupo ---------- */
let arrasto=null;
function iniciarArraste(e,li){
  if(!li) return;
  if(filtroAtivo()){ toast('Limpe a busca e as tags para reordenar'); return; }
  e.preventDefault();
  const r=li.getBoundingClientRect();
  const fantasma=li.cloneNode(true);
  fantasma.classList.add('fantasma');
  Object.assign(fantasma.style,{position:'fixed',left:r.left+'px',top:r.top+'px',
    width:r.width+'px',pointerEvents:'none',zIndex:80,margin:0});
  document.body.appendChild(fantasma);
  li.classList.add('arrastando');
  document.body.classList.add('arrastando-agora');
  arrasto={li,fantasma,dx:e.clientX-r.left,dy:e.clientY-r.top};
  window.addEventListener('pointermove',moverArraste);
  window.addEventListener('pointerup',soltarArraste,{once:true});
  window.addEventListener('pointercancel',soltarArraste,{once:true});
}
function moverArraste(e){
  if(!arrasto) return;
  arrasto.fantasma.style.left=(e.clientX-arrasto.dx)+'px';
  arrasto.fantasma.style.top =(e.clientY-arrasto.dy)+'px';
  const caixa=document.getElementById('lista');
  const rc=caixa.getBoundingClientRect();                 // rola sozinho perto das bordas
  if(e.clientY<rc.top+28) caixa.scrollTop-=8;
  else if(e.clientY>rc.bottom-28) caixa.scrollTop+=8;
  const alvo=document.elementFromPoint(e.clientX,e.clientY);
  if(!alvo||!alvo.closest) return;
  // (lote 16) em cima do "Inativos" de um grupo: a ficha vai para o fim da lista dos inativos dele (aberta ou não)
  const hd=alvo.closest('[data-inhd]');
  document.querySelectorAll('#lista .inathd.alvo').forEach(x=>{ if(x!==hd) x.classList.remove('alvo'); });
  if(hd){ const l=hd.parentNode.querySelector('[data-inativo]'); hd.classList.add('alvo'); if(l && arrasto.li.parentNode!==l) l.appendChild(arrasto.li); return; }
  const linha=alvo.closest('.pcrow:not(.fantasma)');
  if(linha && linha!==arrasto.li){
    const rr=linha.getBoundingClientRect();
    const depois=e.clientY>rr.top+rr.height/2;
    linha.parentNode.insertBefore(arrasto.li, depois? linha.nextSibling : linha);
    return;
  }
  const lista=alvo.closest('[data-lista]');
  if(lista && !lista.contains(arrasto.li)) lista.appendChild(arrasto.li);
}
function soltarArraste(){
  if(!arrasto) return;
  window.removeEventListener('pointermove',moverArraste);
  arrasto.fantasma.remove();
  arrasto.li.classList.remove('arrastando');
  document.body.classList.remove('arrastando-agora');
  const movido=arrasto.li.dataset.id;
  arrasto=null;
  document.querySelectorAll('#lista .inathd.alvo').forEach(x=>x.classList.remove('alvo'));
  const divide=FichasMesa.ativo() && FichasMesa.mestre();
  let trocouAtivo=null;          // (lote 16) a ficha arrastada passou de ativa para inativa, ou o contrário
  const mapa=new Map(S.personagens.map(p=>[p.id,p])), novos=[], antes=S.personagens.slice();
  let mudou=null, recusado=false;     // mudou: a ficha arrastada passou para outra campanha (dá para desfazer)
  document.querySelectorAll('#lista [data-lista]').forEach(ulSec=>{
    const g=ulSec.dataset.lista===SEM? '' : ulSec.dataset.lista, camp=ulSec.dataset.camp||'', trancado=!!ulSec.dataset.trancado;
    ulSec.querySelectorAll('.pcrow').forEach(li=>{
      const p=mapa.get(li.dataset.id);
      if(!p) return;
      const de=FichasMesa.blocoDe(p);
      /* Soltar numa seção de outro bloco passa a ficha para aquela campanha (ou para o mundo) — o que só o mestre da
         mesa faz. Não vale para a campanha encerrada — nem para tirar ficha dela, nem para pôr —, nem para o bloco das
         campanhas que não aparecem aqui. */
      if(de!==camp && !FichasMesa.organiza()){ if(p.id===movido) recusado='papel'; novos.push(p); mapa.delete(li.dataset.id); return; }
      if(de!==camp && (trancado || FichasMesa.encerrada(p._camp) || de==='?')){ if(p.id===movido) recusado=true; novos.push(p); mapa.delete(li.dataset.id); return; }
      if(de!==camp){ if(p.id===movido) mudou={pc:p, camp:p._camp||null, grupo:p.grupo||''}; p._camp=camp||null; }
      if(divide && p.id===movido){
        const quer=!ulSec.dataset.inativo;
        if(FichasMesa.ativoNaFicha(p)!==quer){
          if(trancado) recusado='encerrada';
          else { marcarAtivo(p,quer); trocouAtivo={pc:p, on:quer}; }
        }
      }
      p.grupo=g; novos.push(p); mapa.delete(li.dataset.id);
    });
  });
  mapa.forEach(p=>novos.push(p));      // quem estiver escondido mantém-se no fim
  // (os pets vão com o dono: na mesma campanha e no mesmo grupo, logo depois dele)
  const comPets=[], ja=new Set();
  for(const p of novos){
    if(ja.has(p.id) || (p.petDe && novos.some(d=>d.id===p.petDe && !d.petDe))) continue;
    comPets.push(p); ja.add(p.id);
    for(const x of novos) if(x.petDe===p.id && !ja.has(x.id)){
      if(FichasMesa.blocoDe(x)!==FichasMesa.blocoDe(p) && FichasMesa.organiza() && !FichasMesa.encerrada(x._camp) && !FichasMesa.encerrada(p._camp)) x._camp=p._camp;
      if(FichasMesa.blocoDe(x)===FichasMesa.blocoDe(p)) x.grupo=p.grupo;
      comPets.push(x); ja.add(x.id);
    }
  }
  for(const p of novos) if(!ja.has(p.id)) comPets.push(p);
  S.personagens=comPets; fixarGrupos(); save(); renderLista();
  if(recusado) toast(recusado==='papel'? 'Só o mestre da mesa passa fichas de uma campanha para outra.' : recusado==='encerrada'? 'Campanha encerrada: só para consulta.' : 'Campanha encerrada: as fichas dela não saem, e nenhuma entra.');
  if(trocouAtivo && !mudou){
    const {pc,on}=trocouAtivo;
    if(S.sel===pc.id){ const x=document.querySelector('#f_ativo'); if(x) x.checked=on; }
    FichasExtras.aviso(on? pc.nome+' está ativo: vem marcado ao puxar o grupo na cena.' : pc.nome+' ficou fora do grupo ativo: ao puxar o grupo na cena, vem desmarcado.', 'Desfazer', ()=>{
      marcarAtivo(pc,!on); save(); renderLista();
      if(S.sel===pc.id){ const x=document.querySelector('#f_ativo'); if(x) x.checked=!on; }
    });
  }
  if(mudou){
    const pc=mudou.pc;
    FichasMesa.garantirRelacoes(); save(); if(S.sel===pc.id) renderFicha();
    FichasExtras.aviso(pc.nome+' passou para '+(pc._camp? 'a campanha '+FichasMesa.nomeDaCampanha(pc._camp) : 'o mundo (aparece em todas as campanhas)')+'.', 'Desfazer', ()=>{
      pc._camp=mudou.camp; pc.grupo=mudou.grupo;
      if(trocouAtivo) marcarAtivo(pc,!trocouAtivo.on);
      S.personagens=antes.filter(p=>S.personagens.includes(p)).concat(S.personagens.filter(p=>!antes.includes(p)));
      fixarGrupos(); save(); render();
    }, 9000);
    FichasMesa.avisarDeFora([pc]);
  }
}
// (lote 16) ativo ou não: estado.ativo=false para quem está fora (sem o campo, está ativo)
function marcarAtivo(pc,on){ const est=Object.assign({}, pc.estado||{}); if(on) delete est.ativo; else est.ativo=false; pc.estado=est; }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const SEM='__sem__';
/* Os grupos de um bloco da lista, na ordem do mestre: os do mundo ficam em S.grupos; os de cada campanha, em
   S.gruposCamp[campanha]. (Sem campanhas, o bloco é um só — camp '' — e tudo é como sempre foi.) */
function gruposDe(camp){
  if(!camp) return (S.grupos=S.grupos||[]);
  if(camp==='?') return [];
  const m=(S.gruposCamp && typeof S.gruposCamp==='object' && !Array.isArray(S.gruposCamp))? S.gruposCamp : (S.gruposCamp={});
  return Array.isArray(m[camp])? m[camp] : (m[camp]=[]);
}
function porGrupos(camp,lista){ if(!camp) S.grupos=lista; else if(camp!=='?'){ gruposDe(camp); S.gruposCamp[camp]=lista; } }
function gruposOrdenados(camp){
  camp=camp||'';
  const nomes=[...gruposDe(camp)];
  S.personagens.forEach(p=>{ if(FichasMesa.blocoDe(p)!==camp) return; const g=p.grupo||''; if(g && !nomes.includes(g)) nomes.push(g); });
  return nomes;
}
function fixarGrupos(){ S.grupos=gruposOrdenados(''); FichasMesa.campanhas().forEach(c=>{ const l=gruposOrdenados(c.id); if(l.length || (S.gruposCamp||{})[c.id]) porGrupos(c.id,l); }); }
/* As opções do campo "Grupo" da ficha. Sem campanhas: "Sem grupo" e os grupos, como sempre (o valor é o nome do grupo).
   Com campanhas, o valor é "campanha/grupo", e quem mestra escolhe também o bloco — a campanha da ficha, o mundo ou
   outra campanha: escolher um grupo de outro bloco passa a ficha para lá. */
function opcoesDeGrupo(pc){
  const bloco=FichasMesa.blocoDe(pc), g0=pc.grupo||'';
  const ops=(camp,codigo)=>['', ...gruposOrdenados(camp)].map(g=>`<option value="${esc(codigo? camp+'/'+g : g)}" ${camp===bloco && g===g0?'selected':''}>${g?esc(g):'Sem grupo'}</option>`).join('');
  if(!FichasMesa.campanhas().length) return ops('',false);
  // quem não é o mestre da mesa — e a ficha de campanha encerrada, ou de uma campanha que não aparece aqui — só troca de grupo dentro do bloco
  if(!FichasMesa.organiza() || bloco==='?' || FichasMesa.encerrada(pc._camp)) return ops(bloco,true);
  return FichasMesa.blocos().filter(b=>b.camp!=='?' && (!b.encerrada || b.camp===bloco)).map(b=>`<optgroup label="${esc(b.nome)}">${ops(b.camp,true)}</optgroup>`).join('');
}
function lerOpcaoDeGrupo(v, bloco){
  const i=FichasMesa.campanhas().length? String(v).indexOf('/') : -1;
  return i<0? {camp:bloco||'', g:v} : {camp:v.slice(0,i), g:v.slice(i+1)};
}
// todos os grupos que têm alguém, para "adicionar o grupo inteiro" (com campanhas, em blocos: o da campanha em vista primeiro)
function opcoesDeGruposCheios(){
  const comCamp=FichasMesa.campanhas().length>0;
  return FichasMesa.blocos().map(b=>{
    const doBloco=b.unico? S.personagens : S.personagens.filter(p=>FichasMesa.blocoDe(p)===b.camp);
    const ops=gruposOrdenados(b.camp).map(g=>{ const n=doBloco.filter(p=>(p.grupo||'')===g).length; return n? `<option value="${esc(comCamp? b.camp+'/'+g : g)}">${esc(g)} (${n})</option>` : (comCamp? '' : `<option value="${esc(g)}">${esc(g)} (0)</option>`); }).join('');
    return !comCamp? ops : ops? `<optgroup label="${esc(b.nome)}">${ops}</optgroup>` : '';
  }).join('');
}
/* Passar um grupo inteiro para outra campanha (ou para o mundo): as fichas dele vão junto. Só o mestre da mesa. */
function abrirPassarGrupo(camp, g){
  if(!FichasMesa.organiza()){ toast('Só o mestre da mesa passa um grupo para outra campanha.'); return; }
  const fichas=S.personagens.filter(p=>FichasMesa.blocoDe(p)===camp && (p.grupo||'')===g);
  const destinos=FichasMesa.blocos().filter(b=>b.camp!==camp && b.camp!=='?' && !b.encerrada);
  if(!destinos.length){ toast('Não há outra campanha aberta para onde passar o grupo.'); return; }
  let escolhido=destinos[0].camp;
  const m=document.createElement('div'); m.className='modal';
  const fechar=()=>m.remove();
  const desenhar=()=>{
    const jaTem=gruposOrdenados(escolhido).includes(g);
    m.innerHTML=`<div class="sheet" style="max-width:520px">
      <div class="hd"><span class="eyebrow">Passar o grupo para outra campanha</span>
        <button class="mini" id="pgX" style="margin-left:auto">Cancelar</button></div>
      <div class="bd">
        <p style="margin:0 0 10px;font-size:14px">O grupo <strong>${esc(g)}</strong> (${fichas.length} ficha${fichas.length===1?'':'s'}) sai de <strong>${esc(camp? FichasMesa.nomeDaCampanha(camp) : 'Do mundo')}</strong> e vai para:</p>
        <div class="pgops" role="radiogroup" aria-label="Para onde vai o grupo">
          ${destinos.map(b=>`<label class="pgop"><input type="radio" name="pgdest" value="${esc(b.camp)}" ${b.camp===escolhido?'checked':''}> <span>${esc(b.camp? b.nome : 'Do mundo')}${b.camp?'':' <span class="hint">— aparece em todas as campanhas</span>'}</span></label>`).join('')}
        </div>
        <p class="hint" id="pgNota" style="margin:10px 0 0">${escolhido? 'Só quem participa dessa campanha passa a ver as fichas abertas desse grupo (o dono de cada ficha continua vendo a dele).' : 'Todos os jogadores da mesa passam a ver as fichas abertas desse grupo.'}${jaTem? ' Lá já existe um grupo com esse nome: as fichas se juntam a ele.' : ''}</p>
        <div class="modalacts">
          <span style="margin-left:auto;display:flex;gap:8px">
            <button id="pgCancel">Cancelar</button>
            <button class="primary" id="pgOk">Passar o grupo</button>
          </span>
        </div>
      </div></div>`;
    m.querySelector('#pgX').onclick=fechar; m.querySelector('#pgCancel').onclick=fechar;
    m.querySelectorAll('[name="pgdest"]').forEach(r=>r.onchange=()=>{ escolhido=r.value; desenhar(); const marcado=m.querySelector('[name="pgdest"]:checked'); if(marcado) marcado.focus(); });
    m.querySelector('#pgOk').onclick=()=>{ fechar(); passarGrupo(camp, g, escolhido); };
  };
  m.onclick=e=>{ if(e.target===m) fechar(); };
  document.body.appendChild(m); desenhar();
}
function passarGrupo(camp, g, para){
  const fichas=S.personagens.filter(p=>FichasMesa.blocoDe(p)===camp && (p.grupo||'')===g && !FichasMesa.encerrada(p._camp));
  fixarGrupos();
  const antes={origem:[...gruposDe(camp)], destino:[...gruposDe(para)]};
  fichas.forEach(p=>{ p._camp=para||null; });
  porGrupos(camp, gruposDe(camp).filter(x=>x!==g));
  const ld=gruposDe(para); if(!ld.includes(g)) ld.push(g);
  FichasMesa.garantirRelacoes(); save(); render();
  // (lote 16) a caixinha do grupo vai junto (somada à de lá, se já houver um grupo com esse nome)
  const cxLa=FichasMesa.caixaDoGrupo(para||null, g), laVazia=!cxLa||(!cxLa.q&&!cxLa.ext.length);
  FichasMesa.levarCaixa(camp||null, g, para||null, g).then(r=>{ if(r) render(); }, e=>toast('A caixinha do grupo não foi junto: '+e.message));
  FichasExtras.aviso('O grupo '+g+' passou para '+(para? 'a campanha '+FichasMesa.nomeDaCampanha(para) : 'o mundo (aparece em todas as campanhas)')+'.', 'Desfazer', ()=>{
    fichas.forEach(p=>{ p._camp=camp||null; });
    porGrupos(camp, antes.origem); porGrupos(para, antes.destino);
    save(); render();
    if(laVazia) FichasMesa.levarCaixa(para||null, g, camp||null, g).then(r=>{ if(r) render(); }, e=>toast('A caixinha do grupo não voltou: '+e.message));
    else toast('A caixinha do grupo ficou em '+(para? FichasMesa.nomeDaCampanha(para) : 'Do mundo')+', somada à de lá.');
  }, 12000);
  FichasMesa.avisarDeFora(fichas);
}
function todasTags(){
  const t=new Set(); S.personagens.forEach(p=>(p.tags||[]).forEach(x=>t.add(x)));
  return [...t].sort((a,b)=>a.localeCompare(b,'pt-BR'));
}
function filtroAtivo(){
  const q=(document.getElementById('busca')?.value||'').trim();
  return !!q || (S.filtroTags||[]).length>0;
}
function casaFiltro(p){
  const q=(document.getElementById('busca')?.value||'').toLowerCase().trim();
  const texto=(p.nome+' '+(p.raca||'')+' '+(p.grupo||'')+' '+(p.tags||[]).join(' ')).toLowerCase();
  if(q && !texto.includes(q)) return false;
  const ft=S.filtroTags||[];
  if(ft.length && !ft.some(t=>(p.tags||[]).includes(t))) return false;
  return true;
}

/* (lote 15) O Estaque escondido: o mestre marca, ficha por ficha, e quem não mestra deixa de ver a aba (o texto nem
   chega: mora com o mestre, no documento dos segredos — ver FichasMesa). A marca só aparece numa mesa, para o mestre,
   nas fichas que algum jogador vê: a de um jogador, ou a de um NPC aberta aos jogadores. */
const estaqueEscondido=pc=>!!(pc&&pc.estaqueOculto) && FichasMesa.ativo() && !FichasMesa.mestre();
/* (lote 16) A ficha em abas, com um resumo fixo no alto. O resumo (em todas as abas): o retrato, o nome, quem é em
   uma linha, as barras (o valor de agora se muda ali: os recursos, as barras especiais e a fadiga), os números (os
   atributos, os derivados e as defesas, com o equipamento), os lapros e a caixinha do grupo, os ferimentos abertos, a
   Sanidade e o Conforto. As abas: Atributos (quem é, a tabela, a flor e a rolagem, as barras e os recursos, o corpo e os
   bônus temporários) · Bolsas e itens · Social · Skills · Notas (o Estaque, as missões e as anotações). A aba aberta
   fica lembrada nesta tela (S.abaFicha); a de antes do lote 16 (as abas de baixo) abre em Atributos. */
const ABAS_FICHA=[['atributos','Atributos'],['bolsas','Bolsas e itens'],['social','Social'],['skills','Skills'],['notas','Notas']];
const abaDaFicha=pc=>{ const a=S.abaFicha; return ABAS_FICHA.some(x=>x[0]===a)? a : 'atributos'; };
function marcaDaAba(pc,k){
  if(k==='skills'){ const n=(pc.habilidades||[]).length+habsDaArvore(pc).length+unicasDaFicha(pc).length; return n||''; }
  if(k==='bolsas'){ const n=(pc.itens||[]).length; return n||''; }
  if(k==='notas'){ const n=FichasQuadros.contaAtivas(pc); return n? n : ((!estaqueEscondido(pc)&&(pc.estaque?.a||pc.estaque?.b))||(pc.notas||'').trim())? '•' : ''; }
  return '';
}
function htmlAbasFicha(pc,aba){
  return `<div class="abasficha" role="tablist" aria-label="Partes da ficha">${ABAS_FICHA.map(([k,rot])=>{ const mk=marcaDaAba(pc,k);
    return `<button type="button" role="tab" class="abf${aba===k?' on':''}" id="abaficha-${k}" data-abaficha="${k}" aria-selected="${aba===k}" aria-controls="abafichac-${k}">${rot}${mk!==''?`<span class="mk">${mk}</span>`:''}</button>`; }).join('')}</div>`;
}
// troca de aba sem redesenhar a ficha (quem está digitando noutra aba não perde nada)
function irParaAba(k, alvo){
  if(!ABAS_FICHA.some(x=>x[0]===k)) return;
  S.abaFicha=k; save();
  const host=document.getElementById('ficha'); if(!host) return;
  host.querySelectorAll('[data-abafichac]').forEach(el=>{ el.hidden = el.dataset.abafichac!==k; });
  host.querySelectorAll('[data-abaficha]').forEach(b=>{ const on=b.dataset.abaficha===k; b.classList.toggle('on',on); b.setAttribute('aria-selected',String(on)); });

/* (lote 16) A caixinha do grupo, na aba "Bolsas e itens": quanto o grupo guarda junto; pôr e pegar com os lapros desta
   ficha — a conta aparece antes, e dá para desfazer —; e o extrato (quem pôs, quem pegou, para quê). Quem mestra também

const CX={pc:null, q:'', nota:'', tudo:false, ocupada:false};      // o que foi digitado nesta ficha (um redesenho não perde) e se há um pedido no caminho
function caixaDaFicha(pc){ const g=pc&&!pc.petDe? FichasMesa.nomeDoGrupo(pc.grupo) : ''; return g? {g, cx:FichasMesa.caixaDoGrupo(pc._camp||null, g)} : null; }
function qtdCaixa(){ const t=String(CX.q||'').replace(/[\s.]/g,''); return /^\d{1,10}$/.test(t)? +t : null; }
// a conta, antes: o que acontece com a ficha e com a caixinha em cada botão (e por que um botão não vale)
function previaCaixa(pc,cx){
  const q=qtdCaixa(), lap=FichasExtras.laprosDe(pc), nome=esc(pc.nome||'A ficha');

  if(q==null||q<1) return '<span class="cxerro">Só um número inteiro, de 1 para cima.</span>';
  const por = lap>=q? `<b>Pôr ${q}:</b> ${nome} fica com ${lap-q} (tem ${lap}) · a caixinha, com ${cx.q+q}.` : `<b>Pôr ${q}:</b> <span class="cxerro">${nome} tem só ${lap}.</span>`;
  const pegar = cx.q>=q? `<b>Pegar ${q}:</b> a caixinha fica com ${cx.q-q} · ${nome}, com ${lap+q}.` : `<b>Pegar ${q}:</b> <span class="cxerro">a caixinha tem só ${cx.q}.</span>`;
  return `<span>${por}</span><span>${pegar}</span>`;
}
function linhaDoExtrato(e){
  const q=+e.q||0, dt=new Date(e.em), quando=isFinite(dt)? dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '';
  const quem=e.quem? esc(e.quem)+(q>0?' pôs ':' pegou ')+Math.abs(q) : (q>0?'Achado: +':'Despesa: −')+Math.abs(q);

}

function ligarCaixinha(host,pc){
  const box=host.querySelector('#painelCaixa'); if(!box) return;
  const d=caixaDaFicha(pc);
  const b=box.querySelector('[data-cxtudo]'); if(b) b.onclick=()=>{ CX.tudo=!CX.tudo; render(); };
  const iq=box.querySelector('#cx_q'), inota=box.querySelector('#cx_nota');
  if(!d||!iq) return;
  // a prévia e os botões acompanham o que se digita (sem redesenhar a ficha: o cursor fica no campo)
  const pintar=()=>{
    const cx=FichasMesa.caixaDoGrupo(pc._camp||null, d.g), q=qtdCaixa(), lap=FichasExtras.laprosDe(pc), nada=CX.ocupada||q==null||q<1;
    box.querySelector('#cxPrev').innerHTML=previaCaixa(pc,cx);
    const bt=k=>box.querySelector('[data-cx="'+k+'"]');
    if(bt('por')) bt('por').disabled=nada||lap<q;
    if(bt('pegar')) bt('pegar').disabled=nada||cx.q<q;
    if(bt('achado')) bt('achado').disabled=nada;
    if(bt('despesa')) bt('despesa').disabled=nada||cx.q<q;
  };
  iq.oninput=()=>{ CX.q=iq.value; pintar(); };
  iq.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); const p=box.querySelector('[data-cx="por"]'); if(p&&!p.disabled) p.focus(); } };
  if(inota) inota.oninput=()=>{ CX.nota=inota.value; };
  box.querySelectorAll('[data-cx]').forEach(bt=>bt.onclick=()=>{
    const q=qtdCaixa(); if(q==null||q<1||CX.ocupada) return;
    const k=bt.dataset.cx, comFicha=k==='por'||k==='pegar', delta=(k==='por'||k==='achado')? q : -q, nota=String(CX.nota||'').trim();
    const camp=pc._camp||null, g=d.g, alvo=comFicha? pc : null;
    CX.ocupada=true; pintar();
    FichasMesa.moverCaixa(alvo, camp, g, delta, nota).then(r=>{
      CX.ocupada=false; CX.q=''; CX.nota=''; render();
      const total=r&&r.caixa!=null? r.caixa : FichasMesa.caixaDoGrupo(camp,g).q;
      const txt = k==='por'? (pc.nome||'A ficha')+' pôs '+q+' lapros na caixinha do grupo (agora '+total+').'
        : k==='pegar'? (pc.nome||'A ficha')+' pegou '+q+' lapros da caixinha do grupo (ficou com '+total+').'
        : k==='achado'? 'A caixinha do grupo recebeu '+q+' lapros (agora '+total+').' : 'A caixinha do grupo pagou '+q+' lapros (ficou com '+total+').';
      FichasExtras.aviso(txt, 'Desfazer', ()=>{
        FichasMesa.moverCaixa(alvo, camp, g, -delta, 'desfeito').then(()=>render(), e=>{ toast('Não deu para desfazer: '+e.message); render(); });
      }, 9000);
    }, e=>{ CX.ocupada=false; render(); toast(e.message||'Não deu certo agora. Tente de novo.'); });
  });
}
/* (lote 16) O aniversário, no calendário do mundo (o do Mapa-múndi de onde o Jornal tira a data; sem mapa, os meses de

   guarda ficha.aniv = { d, m, a } — o que estiver escrito, mesmo pela metade; vale quando tem o dia e o mês. */
function calDaFicha(){ try{ return FichasMesa.calendario(); }catch(e){ return { meses:[], hoje:null, mapa:null }; } }
function anivDe(pc){ const a=pc&&pc.aniv; return a&&typeof a==='object'? a : null; }
function infoAniversario(pc, cal){
  const R=window.TC&&TC.rules, a=anivDe(pc); if(!a||!R||!R.anivOk) return '';
  const ok=R.anivOk(a, cal.meses);
  if(!ok) return a.d!=null&&a.m!=null&&cal.meses[a.m]? cal.meses[a.m].nome+' tem '+cal.meses[a.m].dias+' dias.' : '';
  const x=cal.hoje? R.aniversario(ok, cal.hoje, cal.meses) : null;
  if(!x) return ok.a!=null? 'nasceu no ano '+ok.a : '';
  const idade=x.idade==null? '' : (x.hoje? 'faz '+x.idade+(x.idade===1?' ano':' anos') : x.idade+(x.idade===1?' ano':' anos'));
  return [x.hoje? 'É hoje!' : x.faltam===1? 'É amanhã' : 'Faltam '+x.faltam+' dias', idade].filter(Boolean).join(' · ');

/* A regra de recuperação de cada barra especial (lote 6): o mestre escolhe — enche no descanso longo, em qualquer

const REC_ESPECIAL_LOCAL=[{k:'longo',nome:'Enche no descanso longo'},{k:'qualquer',nome:'Enche em qualquer descanso'},{k:'quantia',nome:'Recupera uma quantia'},{k:'manual',nome:'Só à mão'}];

/* A fadiga (lote 6): uma pilha de 5 (descansado) a 0 (esgotado), que vai descendo como a bateria do celular. Mora no

function nomeCruDoEspecial(pc,id){ const pw=(pc.poderes||[]).find(x=>x.id===id); return pw? String(pw.nome==null?'':pw.nome) : ''; }

/* ---------- eventos da ficha ---------- */
function ligarFicha(pc){
  const host=document.getElementById('ficha');
  // (o desenho não atrapalha o gesto que causou a mudança — o clique noutro lugar, o Tab —, e o cursor fica onde o gesto o deixou)
  const patch=(f)=>{f(); save(); FichasExtras.desenhar(render)};
  const patchLeve=(f)=>{f(); save(); /* sem re-render: não perde o foco */};

  host.querySelector('#f_nome').oninput=e=>{pc.nome=e.target.value; save(); renderLista()};
  host.querySelector('#f_raca').oninput=e=>{pc.raca=e.target.value; save(); renderLista()};
  host.querySelector('#f_lado').onchange=e=>{pc.lado=e.target.value; save(); renderLista()};
  FichasMesa.ligarDono(host, pc);
  FichasExtras.ligarRetrato(host, pc);
  FichasExtras.ligarLapros(host, pc);
  ligarCaixinha(host, pc);
  FichasExtras.ligarAtributos(host, pc);
  FichasExtras.ligarMente(host, pc);
  FichasExtras.ligarEfeitos(host, pc);
  FichasExtras.ligarSobrevida(host, pc);
  FichasExtras.ligarNovos(host, pc);
  FichasQuadros.ligar(host, pc);
  const fini=host.querySelector('#f_ini');
  if(fini) fini.oninput=e=>patchLeve(()=>{ pc.ini=e.target.value; const v=host.querySelector('#iniVal'); if(v) v.textContent=iniTexto(pc); });
  const bini=host.querySelector('#btnIni');
  if(bini) bini.onclick=()=>{
    const m=rolMaisDe(pc), r=iniciativaDe(pc), d=rolarDado(20), total=d+r.val+m.res;      // (1 a 20: rolarDado, não randInt, que conta do zero)
    const extra=m.res? ' · '+sinalMais(m.res)+' no resultado' : '';
    pc.ultRol={k:'INI', valor:r.val, base:false, total, texto:'1d20 '+(r.val<0?'− ':'+ ')+Math.abs(r.val)+extra, dado:20, bruto:d};
    logar({tipo:'livre', quem:pc.nome, pc:pc.id, det:'Iniciativa · 1d20 ('+d+') '+(r.val<0?'− ':'+ ')+Math.abs(r.val)+extra, total, dd:[[20,d]]});
    render();
  };
  // os bônus da rolagem (não vão para a ficha; lote 21: ficam neste aparelho, para esta ficha, até apagar)
  const rma=host.querySelector('#rolMaisA'), rmr=host.querySelector('#rolMaisR'), rmx=host.querySelector('#rolMaisX');
  const lerMais=el=>{ const n=Math.round(+String(el.value).replace(',','.')); return isFinite(n)? Math.max(-999,Math.min(999,n)) : 0; };
  const pintaX=()=>{ if(rmx) rmx.hidden=!rolMais.atr&&!rolMais.res; };
  if(rma) rma.oninput=()=>{ rolMaisDe(pc).atr=lerMais(rma); rma.classList.toggle('tem',!!rolMais.atr); rolMaisGuardar(); pintaX(); };
  if(rmr) rmr.oninput=()=>{ rolMaisDe(pc).res=lerMais(rmr); rmr.classList.toggle('tem',!!rolMais.res); rolMaisGuardar(); pintaX(); };
  if(rmx) rmx.onclick=()=>{ const m=rolMaisDe(pc); m.atr=0; m.res=0; rolMaisGuardar(); if(rma){ rma.value=''; rma.classList.remove('tem'); } if(rmr){ rmr.value=''; rmr.classList.remove('tem'); } pintaX(); if(rma) rma.focus(); };
  [rma,rmr].forEach(el=>{ if(el){ el.classList.toggle('tem',!!lerMais(el)); el.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); el.blur(); } }; } });
  // valor atual de cada recurso (HP, SP...): vazio = no começo da barra (cheia, se ela não tem um começo próprio)
  const encher=id=>patch(()=>{ if(pc.estado&&pc.estado.rec) delete pc.estado.rec[id]; });
  // (o botão de voltar ao começo aparece assim que há um valor anotado, sem redesenhar a ficha: quem está digitando não perde o campo)
  // (lote 16: o campo fica no resumo; o "Encher" e o resto da barra, no quadro dos recursos, na aba Atributos)
  const mostrarEncher=i=>{
    const id=i.dataset.resatual, box=host.querySelector('[data-resbox="'+CSS.escape(id)+'"]');
    const r=(calcular(pc).recursos||[]).find(x=>x.id===id); if(!r) return;
    const rsb=i.closest('.rsb'); if(rsb) rsb.classList.toggle('neg', atualDoRecurso(pc,r)<0);
    if(!box) return;
    box.classList.toggle('neg', atualDoRecurso(pc,r)<0);
    let b=box.querySelector('[data-rescheio]');
    if(!temAtual(pc,r)){ if(b) b.remove(); return; }
    if(b) return;
    b=document.createElement('button'); b.className='mini'; b.dataset.rescheio=id;
    const comeco=r.inicio!=null && r.inicio!==arred(r.val);
    b.textContent=comeco? 'Voltar a '+fmt(r.inicio).replace('-','−') : 'Encher';
    b.title=comeco? 'Voltar ao valor em que a barra começa' : 'Voltar ao máximo';
    b.onclick=()=>encher(id);
    box.querySelector('.de').after(b);
  };
  /* (lote 8) O valor atual só vale com Enter ou ao sair do campo (enquanto se digita, nada muda). Um número é o valor
     novo; -8 e +5 tiram e põem — o dano gasta primeiro a sobrevida, como na cena —; vazio volta ao começo da barra. A
     barra fica entre o piso dela e o máximo. Esc desfaz o que foi digitado. */
  const confirmarAtual=i=>{
    const id=i.dataset.resatual, r=(calcular(pc).recursos||[]).find(x=>x.id===id);
    if(!r||r.err||r.val==null) return;
    const txt=String(i.value).trim().replace(/\s+/g,'').replace(',','.'), antes=atualDoRecurso(pc,r);
    const est=pc.estado||(pc.estado={}), rec=est.rec||(est.rec={}), max=tetoDoRecurso(pc,r), piso=r.min<0? r.min : 0, pod=podreDoRecurso(pc,r);
    let novo=null, aviso='';
    // (lote 15) a porcentagem, sempre do máximo (arredonda para baixo): -10% tira 10% dele, +25% põe, 50% deixa na metade
    const pct=/^([+-]?)(\d+(?:\.\d+)?)%$/.exec(txt), q=pct&&r.max>0? Math.floor(r.max*Number(pct[2])/100+1e-9) : null;
    if(txt===''){ delete rec[id]; }
    else if(pct&&q==null){ i.value=String(antes); toast('Esta barra não tem máximo para tirar a porcentagem.'); return; }
    else if(pct&&!pct[1]) novo=q;
    else if(pct||/^[+-]\d+(\.\d+)?$/.test(txt)){
      let d=pct? (pct[1]==='-'? -q : q) : Number(txt);
      if(d<0){ const sob=FichasExtras.sobrevidaDe(pc,r); if(sob>0){ const usa=Math.min(sob,-d), sb=est.sob||(est.sob={}); if(sob-usa>0) sb[id]=Math.round((sob-usa)*10)/10; else delete sb[id]; d+=usa; } }
      novo=antes+d;
    }
    else if(isFinite(+txt)) novo=+txt;
    else { i.value=String(antes); toast('Digite um número, como 30, -8, +5 ou -10%.'); return; }
    if(novo!=null){
      if(novo<piso){ novo=piso; aviso=r.nome+' não desce de '+fmt(piso).replace('-','−')+'.'; }
      if(novo>max){ novo=max; if(pod) aviso=r.nome+' não passa de '+fmt(max)+': '+fmt(pod)+' estão apodrecidos (ferida permanente).'; }
      rec[id]=Math.round(novo*10)/10;
    }
    save(); pintarBarrinhas(host, pc); mostrarEncher(i);
    i.value=String(atualDoRecurso(pc,r)); i.dataset.antes=i.value;
    const sobEl=host.querySelector('[data-ressob="'+CSS.escape(id)+'"]');
    if(sobEl){ const v=FichasExtras.sobrevidaDe(pc,r); sobEl.value=String(v); const lb=sobEl.closest('.sobre'); if(lb) lb.classList.toggle('tem', v>0); }
    if(aviso) toast(aviso);
  };
  host.querySelectorAll('[data-resatual]').forEach(i=>{
    i.dataset.antes=i.value;
    i.onfocus=()=>{ i.dataset.antes=i.value; };
    i.onkeydown=e=>{
      if(e.key==='Enter'){ e.preventDefault(); i.blur(); }
      else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); i.value=i.dataset.antes||''; i.blur(); }
    };
    i.onchange=()=>confirmarAtual(i);
  });
  host.querySelectorAll('[data-rescheio]').forEach(b=>b.onclick=()=>encher(b.dataset.rescheio));
  // (lote 8) o mestre tira a ferida permanente de uma barra; o aviso traz o Desfazer
  host.querySelectorAll('[data-restirapodre]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.restirapodre, r=(calcular(pc).recursos||[]).find(x=>x.id===id), antes=r? podreDoRecurso(pc,r) : 0;
    if(!antes) return;
    patch(()=>{ const pd=Object.assign({}, pc.estado&&pc.estado.podre||{}); delete pd[id]; if(Object.keys(pd).length) pc.estado.podre=pd; else delete pc.estado.podre; });
    FichasExtras.aviso('A ferida permanente saiu de '+(r.nome||'barra')+': a cura volta a ir até o máximo.', 'Desfazer', ()=>patch(()=>{ pc.estado=pc.estado||{}; pc.estado.podre=Object.assign({}, pc.estado.podre||{}, {[id]:antes}); }));
  });
  const rfx=host.querySelector('#rolFixa');
  if(rfx) rfx.oninput=e=>patchLeve(()=>{pc.rol.fixa=Math.max(0,+e.target.value||0)});
  const rfo=host.querySelector('#rolFonte');
  if(rfo) rfo.onchange=e=>patch(()=>{pc.rol.fonte=e.target.value});
  host.querySelectorAll('[data-rolar]').forEach(b=>b.onclick=()=>rolarNaFicha(pc,b.dataset.rolar));
  const bdis=host.querySelector('#btnDisputa');
  if(bdis) bdis.onclick=()=>abrirDisputa(pc);
  host.querySelector('#f_grupo').onchange=e=>{
    const bloco=FichasMesa.blocoDe(pc);
    if(e.target.value==='__novo__'){
      // o grupo novo é do bloco em que a ficha está (a campanha dela, ou o mundo)
      const g=prompt('Nome do novo grupo:','');
      if(g && g.trim()){ fixarGrupos(); const l=gruposDe(bloco); if(!l.includes(g.trim())) l.push(g.trim()); pc.grupo=g.trim(); }
      save(); render(); return;
    }
    const alvo=lerOpcaoDeGrupo(e.target.value, bloco), pets=FichasMesa.petsDe(pc);      // (os pets vão junto)
    if(alvo.camp===bloco){ pc.grupo=alvo.g; pets.forEach(x=>{ if(FichasMesa.blocoDe(x)===bloco) x.grupo=alvo.g; }); save(); render(); return; }
    // escolheu um grupo de outro bloco: a ficha passa para aquela campanha (ou para o mundo) — dá para desfazer
    const antes={camp:pc._camp||null, grupo:pc.grupo||'', pets:pets.map(x=>[x, x._camp||null, x.grupo||''])};
    pc._camp=alvo.camp||null; pc.grupo=alvo.g;
    pets.forEach(x=>{ if(!FichasMesa.encerrada(x._camp)){ x._camp=pc._camp; x.grupo=alvo.g; } });
    FichasMesa.garantirRelacoes(); fixarGrupos(); save(); render();
    FichasExtras.aviso(pc.nome+(pets.length?(pets.length===1?' e o pet dele passaram':' e os pets dele passaram'):' passou')+' para '+(pc._camp? 'a campanha '+FichasMesa.nomeDaCampanha(pc._camp) : 'o mundo (aparece em todas as campanhas)')+'.', 'Desfazer', ()=>{ pc._camp=antes.camp; pc.grupo=antes.grupo; antes.pets.forEach(([x,c,g])=>{ x._camp=c; x.grupo=g; }); fixarGrupos(); save(); render(); }, 9000);
    FichasMesa.avisarDeFora([pc]);
  };
  host.querySelector('#f_tags').oninput=e=>{
    pc.tags=e.target.value.split(',').map(t=>t.trim()).filter(Boolean); save(); renderLista();
  };
  const ftier=host.querySelector('#f_tier');             // (ficha de jogador não mostra o tier)
  if(ftier) ftier.onchange=e=>patch(()=>pc.tier=e.target.value);
  host.querySelector('#f_level').onchange=e=>patch(()=>pc.level=+e.target.value);
  const nt=host.querySelector('#f_notas');
  if(nt) nt.oninput=e=>patchLeve(()=>pc.notas=e.target.value);
  // (lote 16) as abas da ficha, e os atalhos do resumo para a parte de uma aba (os ferimentos, a Sanidade…)
  host.querySelectorAll('[data-abaficha]').forEach(b=>b.onclick=()=>irParaAba(b.dataset.abaficha));
  host.querySelectorAll('[data-irpara]').forEach(b=>b.onclick=()=>{ const [k,alvo]=b.dataset.irpara.split('|'); irParaAba(k, alvo); });
  host.querySelector('#f_raca').addEventListener('input',()=>{ const m=host.querySelector('#rsmeta'); if(m) m.textContent=metaDaFicha(pc); });
  host.querySelector('#f_lado').addEventListener('change',()=>{ const m=host.querySelector('#rsmeta'); if(m) m.textContent=metaDaFicha(pc); });
  ligarSkills(pc,host);
  // (lote 16) o aniversário: o que estiver escrito fica (mesmo pela metade); vazio sai
  const anivCampo=()=>{
    const num=sel=>{ const el=host.querySelector(sel); if(!el) return null; const v=String(el.value).trim(); return v===''||!isFinite(+v)? null : Math.round(+v); };
    const o={}, d=num('#f_aniv_d'), m=num('#f_aniv_m'), a=num('#f_aniv_a');
    if(d!=null) o.d=Math.max(1,Math.min(99,d)); if(m!=null) o.m=Math.max(0,m); if(a!=null) o.a=a;
    patch(()=>{ if(Object.keys(o).length) pc.aniv=o; else delete pc.aniv; });
  };
  ['#f_aniv_d','#f_aniv_m','#f_aniv_a'].forEach(sl=>{ const el=host.querySelector(sl); if(el) el.onchange=anivCampo; });
  host.querySelectorAll('[data-est]').forEach(i=>i.oninput=e=>patchLeve(()=>{
    pc.estaque[e.target.dataset.est]=e.target.value;}));
  const eo=host.querySelector('#f_estoculto');
  if(eo) eo.onchange=e=>{ const on=e.target.checked; patch(()=>{ if(on) pc.estaqueOculto=true; else delete pc.estaqueOculto; }); toast(avisoEstaque(pc,on)); };
  host.querySelectorAll('[data-habunicas]').forEach(b=>b.onclick=()=>abrirPassarParaUnicas(pc));
  host.querySelectorAll('[data-habadd]').forEach(b=>b.onclick=()=>patch(()=>
    pc.habilidades.push({id:uid(), nome:'', desc:'', tipo:'Ativo'})));
  host.querySelectorAll('[data-habtipo]').forEach(sl=>sl.onchange=e=>patch(()=>{
    const h=pc.habilidades.find(x=>x.id===e.target.dataset.habtipo); if(h) h.tipo=e.target.value;}));
  host.querySelectorAll('[data-habdel]').forEach(b=>b.onclick=()=>patch(()=>{
    pc.habilidades=pc.habilidades.filter(x=>x.id!==b.dataset.habdel);}));
  host.querySelectorAll('[data-habnome]').forEach(i=>i.oninput=e=>{
    const h=pc.habilidades.find(x=>x.id===e.target.dataset.habnome); if(h){h.nome=e.target.value; save();}});
  host.querySelectorAll('[data-habdesc]').forEach(i=>i.oninput=e=>{
    const h=pc.habilidades.find(x=>x.id===e.target.dataset.habdesc); if(h){h.desc=e.target.value; save();}});

  host.querySelectorAll('[data-tier]').forEach(s=>s.onchange=e=>patch(()=>pc.tiers[e.target.dataset.tier]=e.target.value));
  host.querySelectorAll('[data-defesa]').forEach(i=>i.onchange=e=>patch(()=>{
    pc.defesas[e.target.dataset.defesa]=+e.target.value||0; }));
  /* (lote 8) o Limite de dano: um número de consulta (vazio: sem limite); não entra em conta nenhuma */
  host.querySelectorAll('[data-limdano]').forEach(i=>i.onchange=()=>{
    const txt=String(i.value).trim().replace(',','.'), v=txt===''? null : Number(txt);
    if(txt!=='' && !(isFinite(v) && v>=0)){ i.value=limiteDeDano(pc)==null?'':String(limiteDeDano(pc)); toast('O limite de dano é um número, como 30 (vazio: sem limite).'); return; }
    patch(()=>{ if(v==null) delete pc.limDano; else pc.limDano=Math.round(v*10)/10; });
  });
  host.querySelectorAll('[data-pct]').forEach(i=>i.onchange=e=>patch(()=>{pc.pctProprio[e.target.dataset.pct]=+e.target.value||0}));

  host.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='dup'){ const cp=JSON.parse(JSON.stringify(pc)); cp.id=uid(); cp.nome=pc.nome+' (cópia)';
      // (as barras ficam com o mesmo id: os itens e as poções da cópia apontam para elas. A cópia nasce com as barras no começo.)
      cp.itens.forEach(i=>i.id=uid()); if(cp.estado){ delete cp.estado.rec; delete cp.estado.sob; delete cp.estado.fer; delete cp.estado.mis; }   // (e sem os ferimentos e as missões do original)
      S.personagens.push(FichasMesa.nascer(cp)); S.sel=cp.id; save(); render(); toast('Personagem duplicado'); }
    if(a==='del'){
      // (os pets dele saem junto: um pet sem o dono não tem a quem seguir)
      const pets=FichasMesa.petsDe(pc);
      if(confirm('Excluir "'+pc.nome+'"?'+(pets.length? (pets.length===1? ' O pet dele ('+pets[0].nome+') também sai.' : ' Os '+pets.length+' pets dele também saem.') : '')+' Não tem como desfazer.')){
        const fora=new Set([pc.id].concat(pets.map(x=>x.id)));
        S.personagens=S.personagens.filter(p=>!fora.has(p.id)); S.sel=S.personagens[0]?.id||null; fora.forEach(id=>FichasMesa.esquecer(id)); save(); render(); toast(pets.length? 'Personagem e pets excluídos' : 'Personagem excluído'); } }
    /* Pet (lote 6): uma ficha suplementar do personagem — atributos à mão (distribuição livre, do zero), barras e
       habilidades, sem bolsa. Fica embaixo dele no elenco; quem controla o personagem controla o pet. */
    if(a==='addpet' && !pc.petDe && FichasMesa.podeEditar(pc)){
      const pet=personagemPadrao('Pet de '+(String(pc.nome||'').trim()||'personagem'));
      Object.assign(pet, {petDe:pc.id, grupo:pc.grupo||'', lado:pc.lado||'Aliado', _dono:pc._dono, _vis:pc._vis, _camp:pc._camp});
      FichasExtras.tornarLivre(pet, true);
      FichasMesa.nascer(pet);
      let i=S.personagens.indexOf(pc); while(i+1<S.personagens.length && S.personagens[i+1].petDe===pc.id) i++;
      S.personagens.splice(i+1,0,pet); S.sel=pet.id; save(); render();
      const n=document.getElementById('f_nome'); if(n){ n.focus(); n.select(); }
      const desfaz=!FichasMesa.ativo() || FichasMesa.mestre();      // (só quem exclui fichas desfaz: o jogador pede ao mestre)
      FichasExtras.aviso('Pet criado para '+(pc.nome||'o personagem')+': quem controla '+(pc.nome||'o personagem')+' controla o pet.', desfaz? 'Desfazer' : null, desfaz? ()=>{
        S.personagens=S.personagens.filter(p=>p!==pet); if(S.sel===pet.id) S.sel=pc.id; FichasMesa.esquecer(pet.id); save(); render();
      } : null);
    }
    if(a==='pct'){ patch(()=>{ pc.pctProprio = pc.pctProprio? null : {...S.cfg.pct}; }); }
    if(a==='pctoff'){ patch(()=>pc.pctProprio=null); }
    if(a==='addres'){ patch(()=>pc.recursos.push({id:uid(),nome:'Novo recurso',fml:''})); }
    if(a==='additem'){
      // (o cartão novo já vem aberto, com o cursor no nome; com o filtro de um tipo ligado, já vem daquele tipo)
      const it=FichasExtras.itemNovo(pc), id=it.id;
      pc.itens.push(it); save(); render();
      const n=document.querySelector('[data-itemnome="'+CSS.escape(id)+'"]'); if(n) n.focus(); }
  });

  /* As barras especiais: a lista (nome, limite) é da ficha; o valor de agora vai para o estado (ver especiaisDe). */
  const acharPd=id=>pc.poderes.find(x=>x.id===id);
  const valorPd=id=>{ const e=especiaisDe(pc).find(x=>x.id===id); return e? e.atual : 0; };
  host.querySelectorAll('[data-pdadd]').forEach(b=>b.onclick=()=>patch(()=>
    pc.poderes.push({id:uid(), nome:'', atual:0, max:1})));
  host.querySelectorAll('[data-pdall]').forEach(b=>b.onclick=()=>{
    const antes=especiaisDe(pc).map(e=>[e.id,e.atual]);
    patch(()=>pc.poderes.forEach(pw=>{ if(+pw.max>0) mudarEspecialNaFicha(pc, pw.id, +pw.max); }));
    FichasExtras.aviso('As barras especiais de '+(pc.nome||'quem joga')+' ficaram cheias.', 'Desfazer', ()=>patch(()=>antes.forEach(([id,v])=>mudarEspecialNaFicha(pc, id, v))));
  });
  host.querySelectorAll('[data-pdstep]').forEach(b=>b.onclick=()=>{
    const [id,d]=b.dataset.pdstep.split('|'); if(!acharPd(id))return;
    patch(()=>mudarEspecialNaFicha(pc, id, valorPd(id) + (+d)));
  });
  host.querySelectorAll('[data-pip]').forEach(b=>b.onclick=()=>{
    const [id,i]=b.dataset.pip.split('|'); if(!acharPd(id))return;
    const n=+i, a=valorPd(id);
    patch(()=>mudarEspecialNaFicha(pc, id, a===n? n-1 : n));   // clicar no último aceso devolve uma unidade
  });
  host.querySelectorAll('[data-pdnome]').forEach(i=>i.oninput=e=>{
    const pw=acharPd(e.target.dataset.pdnome); if(pw){pw.nome=e.target.value; save();}});
  host.querySelectorAll('[data-pdmax]').forEach(i=>i.onchange=e=>{
    const id=e.target.dataset.pdmax, pw=acharPd(id); if(!pw) return;
    const a=valorPd(id);
    patch(()=>{ pw.max=Math.max(0,Math.round(+e.target.value||0)); mudarEspecialNaFicha(pc, id, a); });   // (o valor fica dentro do limite novo)
  });
  // a regra de recuperação de cada barra (o mestre escolhe): 'longo' é o padrão e não fica anotado
  host.querySelectorAll('[data-pdrec]').forEach(s=>s.onchange=e=>{
    const pw=acharPd(e.target.dataset.pdrec); if(!pw) return;
    const v=e.target.value;
    if(v==='longo') delete pw.rec; else pw.rec=v;
    if(v==='quantia'){ if(pw.qc==null) pw.qc=1; if(pw.ql==null) pw.ql=2; }      // (a quantia fica escrita, para valer igual em todo lugar)
    save(); FichasExtras.desenhar(render, v==='quantia'? '[data-pdqc="'+pw.id+'"]' : '[data-pdrec="'+pw.id+'"]');
  });
  const quantia=(attr,campo)=>host.querySelectorAll('['+attr+']').forEach(i=>i.onchange=e=>{
    const pw=acharPd(e.target.getAttribute(attr)); if(!pw) return;
    pw[campo]=Math.max(0,Math.min(999,Math.round(+e.target.value||0))); e.target.value=pw[campo]; save();
  });
  quantia('data-pdqc','qc'); quantia('data-pdql','ql');
  // a fadiga: a pilha de 5 (descansado) a 0 (esgotado); o valor mora no estado
  host.querySelectorAll('[data-fadstep]').forEach(b=>b.onclick=()=>patch(()=>mudarFadigaNaFicha(pc, fadigaDe(pc)+(+b.dataset.fadstep))));
  host.querySelectorAll('[data-fadcel]').forEach(b=>b.onclick=()=>{
    const n=+b.dataset.fadcel, a=fadigaDe(pc);
    patch(()=>mudarFadigaNaFicha(pc, a===n? n-1 : n));        // clicar no último aceso apaga um (como nas bolinhas)
  });
  host.querySelectorAll('[data-fadusar]').forEach(b=>b.onclick=()=>patch(()=>mudarFadigaNaFicha(pc, 5)));
  host.querySelectorAll('[data-faddel]').forEach(b=>b.onclick=()=>{
    const antes=pc.estado? pc.estado.fad : undefined;
    patch(()=>{ const e=Object.assign({},pc.estado||{}); delete e.fad; pc.estado=e; });
    FichasExtras.aviso('A fadiga saiu da ficha de '+(pc.nome||'quem joga')+'.', 'Desfazer', ()=>patch(()=>mudarFadigaNaFicha(pc, antes==null? 5 : antes)));
  });
  host.querySelectorAll('[data-pddel]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.pddel, i=pc.poderes.findIndex(x=>x.id===id); if(i<0) return;
    const pw=pc.poderes[i], tinha=!!(pc.estado && pc.estado.pd && Object.prototype.hasOwnProperty.call(pc.estado.pd,id)), v=tinha? pc.estado.pd[id] : null;
    patch(()=>{
      pc.poderes=pc.poderes.filter(x=>x.id!==id);
      if(tinha){ const pd=Object.assign({},pc.estado.pd); delete pd[id]; pc.estado=Object.assign({},pc.estado,{pd}); }
    });
    // (sai sem perguntar, mas volta inteira pelo Desfazer: o nome, o limite e o valor de agora)
    FichasExtras.aviso('A barra especial '+(String(pw.nome||'').trim()||'sem nome')+' saiu da ficha.', 'Desfazer', ()=>patch(()=>{
      if(!Array.isArray(pc.poderes)) pc.poderes=[];
      if(pc.poderes.some(x=>x.id===id)) return;
      pc.poderes.splice(Math.min(i,pc.poderes.length),0,pw);
      if(tinha){ const pd=Object.assign({},(pc.estado&&pc.estado.pd)||{}); pd[id]=v; pc.estado=Object.assign({},pc.estado||{},{pd}); }
    }));
  });

  host.querySelectorAll('[data-resnome]').forEach(i=>i.oninput=e=>{
    const r=pc.recursos.find(x=>x.id===e.target.dataset.resnome); if(r){r.nome=e.target.value; save();}});
  host.querySelectorAll('[data-resfml]').forEach(i=>{
    i.oninput=e=>{ const r=pc.recursos.find(x=>x.id===e.target.dataset.resfml); if(!r)return;
      r.fml=e.target.value; save(); atualizaRecurso(e.target,r,pc); };
  });
  host.querySelectorAll('[data-resdel]').forEach(b=>b.onclick=()=>patch(()=>{
    pc.recursos=pc.recursos.filter(x=>x.id!==b.dataset.resdel)}));

  // o "pet de …" no alto da ficha do pet abre a ficha do dono
  host.querySelectorAll('[data-abrirpc]').forEach(b=>b.onclick=()=>{ if(!S.personagens.some(p=>p.id===b.dataset.abrirpc)) return; S.sel=b.dataset.abrirpc; save(); render(); });
  host.querySelectorAll('[data-copy]').forEach(c=>c.onclick=()=>{
    const t=c.dataset.copy;
    navigator.clipboard?.writeText(t).then(()=>toast('Copiado: '+t),()=>toast(t));
  });
}
/* atualiza o número de um recurso enquanto digita, sem re-renderizar tudo */
function atualizaRecurso(input,r,pc){
  const card=input.closest('.rescard');
  const c=calcular(pc);
  const alvo=c.recursos.find(x=>x.id===r.id);
  const val=card.querySelector('.val');
  const old=card.querySelector('.fmlerr'); if(old) old.remove();
  if(alvo.err){ val.className='val err'; val.textContent='erro';
    const d=document.createElement('div'); d.className='fmlerr'; d.textContent=alvo.err; card.appendChild(d);
  }else{ val.className='val'; val.textContent = alvo.val==null?'—':fmt(alvo.val); }
}

/* =========================== ABA MESA =========================== */
function novaSituacao(nome){
  return {id:uid(), nome:nome||'Nova situação', modo:'ranking', alvo:30, participantes:[]};
}
function valorDoAtributo(pc,atr,fonte){
  const c=calcular(pc);
  if(c.defEsp && Object.prototype.hasOwnProperty.call(c.defEsp,atr)) return c.defEsp[atr];   // defesa específica
  if(ehDefesa(atr))   return c.def[atr];          // defesa: manual + equipamento
  if(ehDerivado(atr)) return c.der[atr];          // derivados têm valor único
  return fonte==='base'? c.base[atr] : c.tot[atr];
}

function linhaParticipante(sit,pt){
  const pc=pt.pcId? S.personagens.find(p=>p.id===pt.pcId):null;
  const lado=(pt.lado||pc?.lado||'Neutro');
  const nome=pc? pc.nome : (pt.nome||'NPC');
  const res=pt.res;
  let meio;
  if(pt.tipo==='livre'){
    meio=`<td colspan="4"><input class="entrada" data-ptexpr="${pt.id}" value="${esc(pt.expr||'1d20')}" placeholder="1d20+3"></td>`;
  }else{
    const valor=pc? valorDoAtributo(pc,pt.atr,pt.fonte):0;
    const fixa=Math.min(pt.fixa||0,valor);
    const faces=valor-fixa;
    meio=`
      <td><select data-ptatr="${pt.id}">${ATRIBS.map(a=>`<option value="${a.k}" ${pt.atr===a.k?'selected':''}>${a.k}</option>`).join('')}
            ${DERIV.map(d=>`<option value="${d.k}" ${pt.atr===d.k?'selected':''}>${d.k}</option>`).join('')}</select></td>
      <td>${ehDerivado(pt.atr)
            ? `<span class="dado">${esc((DERIV.find(d=>d.k===pt.atr)||{}).nome||'')} (${valor})</span>`
            : `<select data-ptfonte="${pt.id}" style="width:auto">
            <option value="total" ${pt.fonte!=='base'?'selected':''}>c/ equip. (${valorDoAtributo(pc,pt.atr,'total')})</option>
            <option value="base" ${pt.fonte==='base'?'selected':''}>base (${valorDoAtributo(pc,pt.atr,'base')})</option>
          </select>`}</td>
      <td><input type="number" min="0" max="${valor}" data-ptfixa="${pt.id}" value="${fixa}"></td>
      <td class="dado">${faces>0?'1d'+faces+' + '+fixa:'fixo em '+valor}</td>`;
  }
  return `<tr>
    <td><span style="font-weight:500">${esc(nome)}</span>
        <span class="lado ${lado.toLowerCase()}">${esc(lado)}</span></td>
    ${meio}
    <td>${res?`<span class="tot">${res.total}<small>${esc(res.texto||'')}</small></span>`:'<span class="hint">—</span>'}</td>
    <td style="white-space:nowrap"><button class="mini" data-ptroll="${pt.id}">Rolar</button>
        <button class="mini danger" data-ptdel="${pt.id}">×</button></td>
  </tr>`;
}
function veredito(sit){
  const rolados=sit.participantes.filter(p=>p.res);
  if(!rolados.length) return '';
  const nomeDe=p=>p.pcId? (S.personagens.find(x=>x.id===p.pcId)?.nome||'?') : (p.nome||'NPC');
  if(sit.modo==='ranking'){
    const ord=[...rolados].sort((a,b)=>b.res.total-a.res.total);
    return `<div class="veredito"><h3>Ordem dos resultados</h3>
      ${ord.map((p,i)=>`<div class="vlinha"><span class="p">${i+1}º</span><span class="n">${esc(nomeDe(p))}</span>
        <span class="v">${p.res.total}</span></div>`).join('')}</div>`;
  }
  if(sit.modo==='alvo'){
    const alvo=+sit.alvo||0;
    return `<div class="veredito"><h3>Contra dificuldade ${alvo}</h3>
      ${rolados.map(p=>{const d=p.res.total-alvo;return `<div class="vlinha">
        <span class="p ${d>=0?'ok':'no'}">${d>=0?'✓':'✕'}</span><span class="n">${esc(nomeDe(p))}</span>
        <span class="v ${d>=0?'ok':'no'}">${p.res.total} <span style="color:var(--ink-soft);font-weight:400">(${d>=0?'+':''}${d})</span></span></div>`}).join('')}</div>`;
  }
  // duelo
  const lados={Aliado:[],Inimigo:[],Neutro:[]};
  rolados.forEach(p=>{const pc=p.pcId?S.personagens.find(x=>x.id===p.pcId):null;
    (lados[p.lado||pc?.lado||'Neutro']||lados.Neutro).push(p)});
  const melhor=arr=>arr.length?arr.reduce((a,b)=>a.res.total>=b.res.total?a:b):null;
  const ma=melhor(lados.Aliado), mi=melhor(lados.Inimigo);
  const soma=arr=>arr.reduce((s,p)=>s+p.res.total,0);
  let ver;
  if(!ma||!mi) ver='<div class="hint">Role ao menos um de cada lado para ter um vencedor.</div>';
  else if(ma.res.total===mi.res.total) ver='<div class="vlinha"><span class="n">Empate na melhor rolagem.</span></div>';
  else{
    const v=ma.res.total>mi.res.total?ma:mi;
    const pc=v.pcId?S.personagens.find(x=>x.id===v.pcId):null;
    ver=`<div class="vlinha"><span class="n">Melhor rolagem: <strong>${esc(nomeDe(v))}</strong>
      <span class="lado ${(v.lado||pc?.lado||'Neutro').toLowerCase()}">${esc(v.lado||pc?.lado||'Neutro')}</span></span>
      <span class="v">${v.res.total}</span></div>`;
  }
  return `<div class="veredito"><h3>Duelo</h3>${ver}
    <div class="vlinha" style="margin-top:6px"><span class="n ok">Aliados — melhor ${ma?ma.res.total:'—'} · soma ${soma(lados.Aliado)}</span></div>
    <div class="vlinha"><span class="n no">Inimigos — melhor ${mi?mi.res.total:'—'} · soma ${soma(lados.Inimigo)}</span></div></div>`;
}
function rolarParticipante(sit,pt){
  const pc=pt.pcId?S.personagens.find(p=>p.id===pt.pcId):null;
  const nome=pc?pc.nome:(pt.nome||'NPC');
  if(pt.tipo==='livre'){
    let r; try{ r=rolarExpressao(pt.expr); }catch(e){ toast(e.message); return; }
    pt.res={total:r.total, texto:r.expr+' → '+r.detalhe};
    logar({tipo:'livre', quem:nome, pc:pc?pc.id:undefined, det:r.expr+'  '+r.detalhe, total:r.total, sit:sit.nome, dd:r.dd});
  }else{
    if(!pc){ toast('Personagem não encontrado'); return; }
    const valor=valorDoAtributo(pc,pt.atr,pt.fonte);
    const r=rolarFixa(valor,pt.fixa||0);
    pt.res={total:r.total, texto:r.texto+(r.dado?' (dado '+r.bruto+')':'')};
    logar({tipo:'fixa', quem:nome, pc:pc.id,
      det:pt.atr+' '+valor+(!ehDerivado(pt.atr)&&pt.fonte==='base'?' base':'')+' · '+r.texto+(r.dado?' → dado '+r.bruto:''),
      total:r.total, sit:sit.nome, dd:ddDaFixa(r)});
  }
}
function ligarMesa(sit){
  const host=document.getElementById('mesa');
  const q=s=>host.querySelector(s);
  q('#novaSit').onclick=()=>{const s=novaSituacao(); S.situacoes.push(s); S.selSit=s.id; save(); renderMesa()};
  if(q('#selSit')) q('#selSit').onchange=e=>{S.selSit=e.target.value; save(); renderMesa()};
  ligarRegistro();
  if(!sit) return;

  q('#sitNome').oninput=e=>{sit.nome=e.target.value; save()};
  q('#sitModo').onchange=e=>{sit.modo=e.target.value; save(); renderMesa()};
  // (o que muda ao sair de um campo de número é desenhado sem atrapalhar o clique ou o Tab que tirou o cursor dali)
  if(q('#sitAlvo')) q('#sitAlvo').onchange=e=>{sit.alvo=+e.target.value||0; save(); FichasExtras.desenhar(renderMesa)};
  q('#delSit').onclick=()=>{ if(confirm('Excluir a situação "'+sit.nome+'"?')){
    S.situacoes=S.situacoes.filter(x=>x.id!==sit.id); S.selSit=S.situacoes[0]?.id||null; save(); renderMesa(); }};

  q('#btnAddPc').onclick=()=>{
    const id=q('#addPc').value; if(!id){toast('Escolha alguém do elenco');return}
    const pc=S.personagens.find(p=>p.id===id);
    sit.participantes.push({id:uid(), tipo:'atributo', pcId:id, lado:pc?.lado||'Aliado', atr:'FOR', fonte:'total', fixa:0, res:null});
    save(); renderMesa();
  };
  q('#btnAddGrupo').onclick=()=>{
    const v=q('#addGrupo').value; if(!v){toast('Escolha um grupo');return}
    const {camp,g}=lerOpcaoDeGrupo(v,'');       // (com campanhas, o grupo é o daquele bloco: "campanha/grupo")
    const membros=S.personagens.filter(p=>FichasMesa.blocoDe(p)===camp && (p.grupo||'')===g);
    if(!membros.length){toast('Esse grupo está vazio');return}
    let novos=0;
    membros.forEach(pc=>{
      if(sit.participantes.some(x=>x.pcId===pc.id)) return;      // não duplica quem já está na cena
      sit.participantes.push({id:uid(), tipo:'atributo', pcId:pc.id, lado:pc.lado||'Aliado',
        atr:'FOR', fonte:'total', fixa:0, res:null});
      novos++;
    });
    save(); renderMesa();
    toast(novos? novos+' participante'+(novos>1?'s':'')+' de "'+g+'"' : 'Todos já estavam na situação');
  };
  q('#btnAddLivre').onclick=()=>{
    const nome=prompt('Nome do NPC (ex.: Goblin 3, Armadilha):','Inimigo');
    if(nome===null) return;
    sit.participantes.push({id:uid(), tipo:'livre', pcId:null, nome:nome||'NPC', lado:'Inimigo', expr:'1d20', res:null});
    save(); renderMesa();
  };
  q('#rolarTodos').onclick=()=>{ sit.participantes.forEach(pt=>rolarParticipante(sit,pt)); save(); renderMesa(); };
  q('#limparRes').onclick=()=>{ sit.participantes.forEach(pt=>pt.res=null); save(); renderMesa(); };

  host.querySelectorAll('[data-ptroll]').forEach(b=>b.onclick=()=>{
    const pt=sit.participantes.find(x=>x.id===b.dataset.ptroll); if(pt){rolarParticipante(sit,pt); save(); renderMesa();}});
  host.querySelectorAll('[data-ptdel]').forEach(b=>b.onclick=()=>{
    sit.participantes=sit.participantes.filter(x=>x.id!==b.dataset.ptdel); save(); renderMesa();});
  host.querySelectorAll('[data-ptatr]').forEach(s=>s.onchange=e=>{
    const pt=sit.participantes.find(x=>x.id===e.target.dataset.ptatr); if(pt){pt.atr=e.target.value; save(); renderMesa();}});
  host.querySelectorAll('[data-ptfonte]').forEach(s=>s.onchange=e=>{
    const pt=sit.participantes.find(x=>x.id===e.target.dataset.ptfonte); if(pt){pt.fonte=e.target.value; save(); renderMesa();}});
  host.querySelectorAll('[data-ptfixa]').forEach(i=>i.onchange=e=>{
    const pt=sit.participantes.find(x=>x.id===e.target.dataset.ptfixa); if(pt){pt.fixa=Math.max(0,+e.target.value||0); save(); FichasExtras.desenhar(renderMesa);}});
  host.querySelectorAll('[data-ptexpr]').forEach(i=>i.oninput=e=>{
    const pt=sit.participantes.find(x=>x.id===e.target.dataset.ptexpr); if(pt){pt.expr=e.target.value; save();}});
}
