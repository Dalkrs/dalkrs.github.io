<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fichas · Tiny Cats</title>
<script>
/* aplica o tema antes de desenhar a página, para não piscar branco */
(function(){
  var t='auto';
  try{ t = localStorage.getItem('urgm_calc_tema') || 'auto'; }catch(e){}
  var escuro = t==='pedra' || (t==='auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-tema', escuro ? 'pedra' : 'claro');
  document.documentElement.setAttribute('data-tema-escolha', t);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root, :root[data-tema="claro"]{
  --ink:#111c2e; --ink-2:#2c3d57; --ink-soft:#6b7b95; --ink-fraco:#a9b5c7;
  --paper:#e7ecf2; --grid:rgba(17,28,46,.045);
  --panel:#fbfcfe; --campo:#fff; --campo-sut:#eef2f7; --zebra:#f6f8fb;
  --hover:#f0f4f9; --sel:#eaf0f7;
  --line:#c9d3e0; --line-2:#dde4ee; --linha-sut:#eef2f7;
  --forte:#111c2e; --forte-txt:#fff; --forte-hover:#23334f;
  --topo:#111c2e; --topo-txt:#fff; --topo-sub:#93a4c0; --topo-hover:#1a2739;
  --topo-borda:#3d4f6b; --topo-btn:#cdd8e8;
  --topo-perigo:#f0b3b5; --topo-perigo-borda:#6b3a3d; --topo-perigo-hover:#4a2326; --topo-perigo-b2:#9c4a4e;
  --brass:#9a7220; --brass-soft:#e8dcbe; --brass-fundo:#fdf9ee; --brass-ink:#7d5d19; --brass-luz:#d9bb6a;
  --teal:#1c6f6a; --teal-fundo:#eaf5f4; --teal-borda:#a9cfcc;
  --rubric:#9a2f33; --rubric-fundo:#fbeff0; --rubric-borda:#e0bfc0; --rubric-forte:#7e2427; --rubric-off:#e6cfd0;
  --flor-petala:#f2ecd9; --flor-borda:#e0d0a6; --radar:#dbe2ec; --radar-miolo:rgba(28,111,106,.16);
  --roxo:#6b4d8f; --roxo-fundo:#f3eef8; --roxo-borda:#d6c6e6;
  --a-for:#C0392B; --a-agi:#A87609; --a-vit:#2F7A55; --a-can:#6b4d8f; --a-des:#5d6e86;
  --a-for-f:#fbefed; --a-agi-f:#fbf4e3; --a-vit-f:#ecf6f1; --a-can-f:#f3eef8; --a-des-f:#eef1f5;
  --sombra:0 8px 22px rgba(17,28,46,.22);
  --r:4px;
  color-scheme:light;
}
/* modo escuro — pedra e ouro, a mesma paleta do app de árvores */
:root[data-tema="pedra"]{
  --ink:#E9E3D6; --ink-2:rgba(233,227,214,.76); --ink-soft:rgba(233,227,214,.52); --ink-fraco:rgba(233,227,214,.3);
  --paper:#0B0E13; --grid:rgba(233,227,214,.04);
  --panel:#111722; --campo:#19202C; --campo-sut:#1b2330; --zebra:#161d28;
  --hover:#1d2634; --sel:#232e40;
  --line:rgba(233,227,214,.18); --line-2:rgba(233,227,214,.14); --linha-sut:rgba(233,227,214,.09);
  --forte:#D9A441; --forte-txt:#0B0E13; --forte-hover:#e6b559;
  --topo:#070a0e; --topo-txt:#E9E3D6; --topo-sub:rgba(233,227,214,.5); --topo-hover:#161d28;
  --topo-borda:rgba(233,227,214,.22); --topo-btn:rgba(233,227,214,.82);
  --topo-perigo:#E79AA3; --topo-perigo-borda:rgba(231,154,163,.34); --topo-perigo-hover:#3b1c20; --topo-perigo-b2:#8C2F39;
  --brass:#D9A441; --brass-soft:rgba(217,164,65,.42); --brass-fundo:rgba(217,164,65,.1); --brass-ink:#E2C07C; --brass-luz:#D9A441;
  --teal:#6FBF9F; --teal-fundo:rgba(111,191,159,.13); --teal-borda:rgba(111,191,159,.42);
  --rubric:#E79AA3; --rubric-fundo:rgba(140,47,57,.2); --rubric-borda:rgba(231,154,163,.36); --rubric-forte:#8C2F39; --rubric-off:rgba(140,47,57,.45);
  --flor-petala:#1a212e; --flor-borda:rgba(217,164,65,.32); --radar:rgba(233,227,214,.13); --radar-miolo:rgba(111,191,159,.2);
  --roxo:#B07CC6; --roxo-fundo:rgba(176,124,198,.14); --roxo-borda:rgba(176,124,198,.4);
  --a-for:#E0705E; --a-agi:#E3B341; --a-vit:#6FBF9F; --a-can:#B07CC6; --a-des:#9FAFC4;
  --a-for-f:rgba(224,112,94,.13); --a-agi-f:rgba(227,179,65,.13); --a-vit-f:rgba(111,191,159,.13);
  --a-can-f:rgba(176,124,198,.13); --a-des-f:rgba(159,175,196,.13);
  --sombra:0 12px 32px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Inter Tight",-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:15px;line-height:1.5;
  background-image:linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:34px 100%;
  transition:background-color .18s,color .18s;
}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
.mono,input[type=number],.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}

/* ---------- topbar ---------- */
#topbar{position:sticky;top:0;z-index:30;transition:transform .24s ease;will-change:transform;
        box-shadow:0 1px 0 rgba(0,0,0,.2)}
#topbar.esconde{transform:translateY(-100%)}

header.top{
  background:var(--topo);color:var(--topo-txt);padding:14px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  border-bottom:3px solid var(--brass);
}
header.top .flor{flex:0 0 auto}
header.top h1{font-size:19px;color:var(--topo-txt);line-height:1.1}
header.top .sub{font-size:11.5px;color:var(--topo-sub);font-family:"IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
header.top .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- buttons / fields ---------- */
button{
  font-family:inherit;font-size:13px;cursor:pointer;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);
  border-radius:var(--r);padding:7px 11px;transition:.14s;
}
button:hover{border-color:var(--ink-2);background:var(--campo)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
button.ghost{background:transparent;color:var(--topo-btn);border-color:var(--topo-borda)}
button.ghost:hover{background:var(--topo-hover);color:var(--topo-txt);border-color:var(--topo-btn)}
button.primary{background:var(--forte);color:var(--forte-txt);border-color:var(--forte)}
button.primary:hover{background:var(--forte-hover);border-color:var(--forte-hover)}
button.danger{color:var(--rubric);border-color:var(--rubric-borda)}
button.danger:hover{background:var(--rubric-fundo);border-color:var(--rubric)}
button.mini{padding:3px 7px;font-size:11.5px}
input,select,textarea{
  font-family:inherit;font-size:14px;color:var(--ink);background:var(--campo);
  border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;width:100%;
}
textarea{resize:vertical}
label.f{display:block}
label.f > span{display:block;margin-bottom:3px}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px;display:grid;grid-template-columns:246px 1fr;gap:18px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.panel > .hd{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.panel > .bd{padding:12px}

/* ---------- sidebar ---------- */
.roster{position:sticky;top:calc(var(--topH, 96px) + 12px)}
.roster ul{list-style:none;margin:0;padding:0}
#lista{max-height:56vh;overflow:auto}
.roster button.pc{
  width:100%;text-align:left;border:0;border-left:3px solid transparent;background:transparent;
  border-radius:0;padding:7px 10px 7px 4px;display:block;
}
.roster button.pc:hover{background:var(--hover)}
.roster button.pc.on{background:var(--sel);border-left-color:var(--brass)}
.roster .nm{font-weight:500;font-size:14px;display:block;line-height:1.25}
.roster .mt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase}
.searchrow{padding:8px 10px;border-bottom:1px solid var(--line)}

/* blocos por campanha (só numa mesa com campanhas): o da campanha em vista, o do mundo e os das outras */
.bloco{border-bottom:1px solid var(--line)}
.bloco:last-child{border-bottom:0}
.blocohd{display:flex;align-items:center;gap:6px;padding:7px 8px;background:var(--campo);border-bottom:1px solid var(--line)}
.bloco.vista>.blocohd{box-shadow:inset 3px 0 0 var(--brass)}
.blocohd .caret{border:0;background:transparent;padding:0 2px;color:var(--ink-soft);font-size:11px;border-radius:0}
.blocohd .bloconome{font-weight:600;font-size:13px;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blocohd .cnt{font-size:10.5px;color:var(--ink-soft)}
.blocohd .blocotag{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--line);border-radius:10px;padding:1px 6px;white-space:nowrap}
.blocohd .blocotag.vis{color:var(--brass-ink);border-color:var(--brass-soft);background:var(--brass-fundo)}
.blocoitens{list-style:none;margin:0;padding:0}
.blocoitens>.vazio{display:block}
.grab.fixo{cursor:default;width:17px;padding:0}
.pgops{display:grid;gap:6px}
.pgop{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;font-size:14px}
.pgop input{width:auto;flex:none;margin:0;padding:0}      /* (os campos desta página ocupam a largura toda; a bolinha de escolher, não) */
.pgop:has(input:checked){border-color:var(--brass);background:var(--brass-fundo)}
/* seções por grupo */
.sec{border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sechd{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--campo-sut)}
.sechd .caret{border:0;background:transparent;padding:0 2px;color:var(--ink-soft);font-size:11px;border-radius:0}
.sechd .secnome{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.sechd .cnt{font-size:10.5px;color:var(--ink-soft)}
.sechd .secacts{margin-left:auto;display:flex;gap:2px;opacity:0;transition:.12s}
.sec:hover .sechd .secacts{opacity:1}
.sechd .secacts button{padding:1px 5px;font-size:10.5px;line-height:1.4}
.secitens{min-height:8px}
.pcrow{display:flex;align-items:stretch;border-bottom:1px solid var(--linha-sut)}
.pcrow:last-child{border-bottom:0}
.pcrow.arrastando{opacity:.35}
.pcrow.fantasma{background:var(--campo);border:1px solid var(--brass);box-shadow:var(--sombra);border-radius:var(--r);opacity:.96}
.grab{display:flex;align-items:center;padding:0 4px 0 6px;color:var(--ink-fraco);cursor:grab;
  touch-action:none;user-select:none;font-size:13px;letter-spacing:-2px}
.grab:hover{color:var(--brass)}
body.arrastando-agora{cursor:grabbing;user-select:none}
.vazio{padding:8px 12px;font-size:11.5px;font-style:italic}
.linhatags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;align-items:center}
.tagbar{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.tag{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.04em;padding:2px 6px;
  border:1px solid var(--line);border-radius:10px;background:var(--campo);color:var(--ink-2);line-height:1.5}
.tag.on{background:var(--forte);color:var(--forte-txt);border-color:var(--forte)}
.tag.limpar{color:var(--rubric);border-color:var(--rubric-borda)}
.mini-tag{border-color:var(--brass-soft);background:var(--brass-fundo);color:var(--brass-ink)}
.idcard2{display:grid;grid-template-columns:minmax(150px,.7fr) 1fr;gap:10px;margin-top:10px}
@media (max-width:900px){.idcard2{grid-template-columns:1fr}}

/* ---------- ficha ---------- */
.idcard{display:grid;grid-template-columns:1.5fr 1fr repeat(3,minmax(84px,.62fr));gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}

table.attr{width:100%;border-collapse:collapse;font-size:14px}
table.attr th{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:500;text-align:right;padding:0 6px 6px;border-bottom:1px solid var(--line)
}
table.attr th:first-child{text-align:left}
table.attr td{padding:7px 6px;border-bottom:1px solid var(--linha-sut);text-align:right;vertical-align:middle}
table.attr td:first-child{text-align:left}
table.attr tr:last-child td{border-bottom:0}
.aname{font-weight:500}
.tsel{width:62px;padding:3px 4px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;text-align:center}
.vbase{color:var(--ink-soft);font-size:13.5px}
.vequip{color:var(--teal);font-size:13px}
.vtot{font-weight:600;font-size:16px}
.delta{font-size:11.5px;font-family:"IBM Plex Mono",monospace}
.delta.up{color:var(--teal)}
.delta.zero{color:var(--ink-fraco)}
.pctnote{font-size:11.5px;color:var(--ink-soft);margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.warn{color:var(--rubric)}

/* flower */
.florwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-soft);font-family:"IBM Plex Mono",monospace}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}

/* recursos */
.res{display:grid;gap:10px}
.rescard{border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--campo)}
.rescard .top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.rescard .val{font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:600;margin-left:auto;line-height:1}
.rescard .val.err{font-size:13px;color:var(--rubric);font-weight:500}
.darv{margin-left:5px;font-size:10.5px;color:var(--teal);font-weight:500;white-space:nowrap}
.inirow{display:flex;align-items:end;gap:10px;margin-top:10px;flex-wrap:wrap}
.inirow .f{flex:1;min-width:150px}
.inirow .inival{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-soft);padding-bottom:7px;white-space:nowrap}
.rescard .atual{display:flex;align-items:center;gap:8px;margin:-2px 0 8px}
.rescard .atual input{width:84px;font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600}
.rescard .atual .de{color:var(--ink-soft);font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.rescard .atual{flex-wrap:wrap}
.rescard .atual .sobre{margin-left:auto;display:inline-flex;align-items:center;gap:8px}
.rescard .atual .sobre input{width:70px}
.rescard .atual .sobre.tem .eyebrow{color:var(--teal)}
/* dentro de uma mesa do site */
.idmesa{display:flex;flex-wrap:wrap;align-items:end;gap:14px;margin:0 0 12px;padding:10px 12px;border:1px dashed var(--brass-soft);border-radius:var(--r);background:var(--brass-fundo)}
.idmesa .f{min-width:220px}
.idmesa .chk{display:flex;align-items:center;gap:7px;padding-bottom:7px;font-size:13px;flex:1 1 240px}
.so-consulta{margin:0 0 12px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--campo-sut);color:var(--ink-2);font-size:13px}
.mesa-oferta{margin:0 0 10px;padding:10px;border:1px dashed var(--brass-soft);border-radius:var(--r);background:var(--brass-fundo);font-size:13px}
.mesa-oferta p{margin:0 0 8px}
.mesa-falha{margin:14px;padding:12px 14px;border:1px solid var(--rubric-borda);border-radius:var(--r);background:var(--rubric-fundo)}
.papel-jogador #btnCfg,.papel-jogador #btnFlush,.papel-jogador #btnImport,.papel-jogador #btnGrupo,.papel-jogador nav.tabs button[data-tab="mesa"],.papel-jogador .grab{display:none}
.rescard input.fml{font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.fmlerr{color:var(--rubric);font-size:11.5px;margin-top:4px;font-family:"IBM Plex Mono",monospace}
.vars{font-size:11.5px;color:var(--ink-soft);line-height:1.7}
.vars code{background:var(--campo-sut);border:1px solid var(--line-2);border-radius:3px;padding:1px 4px;font-family:"IBM Plex Mono",monospace;font-size:11px;cursor:pointer}
.vars code:hover{background:var(--brass-soft);border-color:var(--brass)}

/* itens */
table.items{width:100%;border-collapse:collapse;font-size:13.5px}
table.items th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;padding:0 4px 6px;border-bottom:1px solid var(--line)}
table.items td{padding:4px;border-bottom:1px solid var(--linha-sut)}
table.items input[type=number]{width:56px;padding:4px;text-align:right}
table.items input.inm{padding:4px 6px}
table.items td.c{text-align:center}
.off{opacity:.42}

/* ---- regras novas: abas do painel de atributos, defesas, opções das barras, itens, temporários e bolsas ---- */
.abasatr{display:inline-flex;gap:2px;margin:-9px 0 -10px -12px;align-self:stretch}
.abasatr .sub{border:0;border-radius:0;background:transparent;color:var(--ink-soft);padding:9px 12px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;border-bottom:2px solid transparent}
.abasatr .sub:hover{color:var(--ink);background:var(--hover)}
.abasatr .sub.on{color:var(--ink);border-bottom-color:var(--brass);background:var(--zebra)}
.abasatr .mk{color:var(--brass);font-size:10px;margin-left:5px;letter-spacing:0}
table.attr.defs td{padding-top:3px;padding-bottom:3px}
table.attr.defs tr.ini td{border-top:1px solid var(--line)}
table.attr.defs tr.zero .vtot{color:var(--ink-fraco)}
.defnome{display:inline-flex;align-items:center;gap:8px}
.defnome .icodef{flex:none;color:var(--brass)}
.defnome.t-golpe .icodef{color:var(--ink-soft)}
.defnome.t-mente .icodef{color:var(--teal)}
.dtmp{display:block;font-size:10.5px;color:var(--brass-ink);font-weight:500;white-space:nowrap}
.idcard3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
/* barra abaixo de zero: a parte negativa, riscada */
.barrinhas .bz.neg .bzv{color:var(--rubric);font-weight:600}
.barrinhas .bz.neg .bzt i{background:repeating-linear-gradient(135deg,var(--rubric) 0 3px,transparent 3px 6px)}
.rescard .atual.neg input[data-resatual]{color:var(--rubric);border-color:var(--rubric-borda)}
.resopc{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.resopc summary{cursor:pointer;font-size:11.5px;color:var(--ink-soft);display:flex;gap:10px;align-items:baseline;list-style:none}
.resopc summary::-webkit-details-marker{display:none}
.resopc summary::before{content:"▸";font-size:10px}
.resopc[open] summary::before{content:"▾"}
.resopc summary:hover .resopc-t{color:var(--ink)}
.resopc-r{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--brass-ink)}
.resopc-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:8px 0 6px}
.resopc .hint code{background:var(--campo-sut);border:1px solid var(--line-2);border-radius:3px;padding:0 4px;font-family:"IBM Plex Mono",monospace;font-size:11px}
label.f > span.pisoin{display:flex;align-items:center;gap:6px;margin:0}

/* o que um item soma além das dez colunas */

.itmais-s{width:auto;max-width:210px;padding:2px 6px;font-size:12px;color:var(--ink-soft)}

/* bônus temporários */
.tmplist{display:grid;gap:6px}
.tmprow{display:grid;grid-template-columns:auto minmax(110px,1.2fr) minmax(120px,1fr) 64px minmax(250px,1.4fr) auto;gap:8px;align-items:center}

.tmprow .tmpon{display:grid;place-items:center;padding:0 2px}
.tmprow .tmpon input{width:auto}
.tmprow .tmpv{text-align:right;font-family:"IBM Plex Mono",monospace;font-weight:600}
.tmprow .tmpdur{display:flex;gap:6px;align-items:center;min-width:0}
.tmprow .tmpdur .tmpmodo{width:auto;flex:none;max-width:130px}
.tmprow .tmpdur .tmpd{flex:1;min-width:0}
.tmprow .tmpate{font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
.tmprow .tmprod{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tmprow .tmprod b{min-width:76px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.tmprow .tmprod.fim b{color:var(--ink-soft)}
.tmprow .tmprod .step{width:26px;height:26px;padding:0;font-size:16px;line-height:1;border-radius:50%;flex:none}
/* (na tela estreita, cada bônus em três linhas: o nome; onde soma e quanto; como acaba) */
@media (max-width:820px){.tmplist{gap:10px}.tmprow{grid-template-columns:auto 1fr 74px auto;grid-template-areas:"on n n x" ". k v ." ". dur dur .";row-gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line-2)}.tmprow:last-child{border-bottom:0;padding-bottom:0}
  .tmprow .tmpon{grid-area:on}.tmprow .tmpn{grid-area:n}.tmprow [data-tmpk]{grid-area:k}.tmprow .tmpv{grid-area:v}.tmprow .tmpdur{grid-area:dur}.tmprow [data-tmpdel]{grid-area:x}}
/* bolsas */
.bollist{display:grid;gap:10px}
.bolrow{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--campo);display:grid;gap:7px}

.bolcab{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.bolqtd{display:inline-flex;align-items:center;gap:4px}

.bolfx{display:grid;grid-template-columns:minmax(120px,1fr) minmax(110px,.9fr) minmax(140px,1.1fr) 76px minmax(100px,.9fr);gap:8px;align-items:end}
.bolfx input.ruim{border-color:var(--rubric);color:var(--rubric)}

.bolconf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--brass);background:var(--brass-fundo);border-radius:var(--r);font-size:13px}

.bolrow textarea{min-height:30px;resize:vertical}

/* config / modal */
.modal{position:fixed;inset:0;background:rgba(4,6,10,.62);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:40}
.modal .sheet{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);max-width:860px;width:100%}
.modal .sheet .hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .sheet .bd{padding:14px}
.cfggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
table.cfg{width:100%;border-collapse:collapse;font-size:13.5px}
table.cfg th,table.cfg td{padding:3px 5px;text-align:right;border-bottom:1px solid var(--linha-sut)}
table.cfg th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:500}
table.cfg th:first-child,table.cfg td:first-child{text-align:left}
table.cfg input{width:78px;padding:3px 5px;text-align:right}
.lvlscroll{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);padding:6px}
.empty{padding:40px 16px;text-align:center;color:var(--ink-soft)}

/* ---------- abas ---------- */
nav.tabs{background:var(--topo);padding:0 18px;display:flex;gap:2px;border-bottom:1px solid var(--topo-hover)}
nav.tabs button{
  background:transparent;border:0;border-radius:0;color:var(--topo-sub);padding:9px 15px;
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
  border-bottom:2px solid transparent;
}
nav.tabs button:hover{color:var(--topo-txt);background:var(--topo-hover)}
nav.tabs button.on{color:var(--topo-txt);border-bottom-color:var(--brass);background:var(--topo-hover)}
.wrap.solo{grid-template-columns:1fr}

/* ---------- mesa ---------- */
.sitbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
table.roll{width:100%;border-collapse:collapse;font-size:13.5px}
table.roll th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;padding:0 5px 6px;border-bottom:1px solid var(--line);text-align:left}
table.roll td{padding:5px;border-bottom:1px solid var(--linha-sut);vertical-align:middle}
table.roll select,table.roll input{padding:4px 6px;font-size:13px}
table.roll input[type=number]{width:64px;text-align:right}
table.roll .dado{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
table.roll .tot{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600}
table.roll .tot small{font-size:11px;font-weight:400;color:var(--ink-soft);display:block;line-height:1.3}
.lado{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:3px;border:1px solid}
.lado.aliado{color:var(--teal);border-color:var(--teal-borda);background:var(--teal-fundo)}
.lado.inimigo{color:var(--rubric);border-color:var(--rubric-borda);background:var(--rubric-fundo)}
.lado.neutro{color:var(--ink-soft);border-color:var(--line);background:var(--campo-sut)}
.veredito{border:1px solid var(--brass);background:var(--brass-fundo);border-radius:var(--r);padding:11px 13px;margin-top:12px}

.vlinha{display:flex;gap:8px;align-items:baseline;padding:2px 0;font-size:13.5px}
.vlinha .p{font-family:"IBM Plex Mono",monospace;color:var(--ink-soft);width:24px}
.vlinha .n{flex:1}
.vlinha .v{font-family:"IBM Plex Mono",monospace;font-weight:600}
.ok{color:var(--teal)} .no{color:var(--rubric)}
.bigroll{font-family:"IBM Plex Mono",monospace;font-size:44px;font-weight:600;line-height:1}
.bigroll small{display:block;font-size:12px;font-weight:400;color:var(--ink-soft);letter-spacing:.04em}
.quick{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.log{max-height:320px;overflow:auto;font-size:12.5px}
.log .row{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--linha-sut);align-items:baseline}

.log .who{font-weight:500;min-width:110px}
.log .det{color:var(--ink-soft);font-family:"IBM Plex Mono",monospace;font-size:11.5px;flex:1}

.tab-ev{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media (max-width:900px){.tab-ev{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:2px;height:90px;margin-top:8px}
.bars div{flex:1;background:var(--teal);opacity:.75;border-radius:1px 1px 0 0}
.entrada{width:100%;font-family:"IBM Plex Mono",monospace;font-size:12.5px}

/* ---------- poderes divinos ---------- */

.rolfix{display:flex;align-items:center;gap:5px;margin-left:auto}

.rolbts{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px}

.rolsaida.c-for{border-color:var(--a-for);background:var(--a-for-f)}
.rolsaida.c-agi{border-color:var(--a-agi);background:var(--a-agi-f)}
.rolsaida.c-vit{border-color:var(--a-vit);background:var(--a-vit-f)}
.rolsaida.c-can{border-color:var(--a-can);background:var(--a-can-f)}
.rolsaida.c-des{border-color:var(--a-des);background:var(--a-des-f)}

<script>
/* =======================================================================
   CALCULADORA DE ATRIBUTOS — TINY CATS
   Um arquivo. Salva no navegador. Exporta/importa JSON.
   ======================================================================= */

/* ---------- atributos do sistema ---------- */
const ATRIBS = [
  {k:'FOR', nome:'Força',             aliases:['FORCA','FORÇA']},
  {k:'DES', nome:'Destreza',          aliases:['DESTREZA']},
  {k:'VIT', nome:'Vitalidade',        aliases:['VITALIDADE']},
  {k:'CAN', nome:'Canalização Mágica',aliases:['CANALIZACAO','CANALIZAÇÃO','CM','MAG']},
  {k:'AGI', nome:'Agilidade',         aliases:['AGILIDADE']},
];
/* Derivados: não recebem pontos. Somam atributos BASE (sem equipamento) mais o
   campo especial do próprio derivado nos equipamentos. Metades arredondam pra baixo. */
const DERIV = [
  {k:'ESQ', nome:'Esquiva',     desc:'AGI',           calc:b=>b.AGI,
   aliases:['ESQUIVA']},
  {k:'FUR', nome:'Furtividade', desc:'AGI + DES/2',   calc:b=>b.AGI+Math.floor(b.DES/2),
   aliases:['FURTIVIDADE']},
  {k:'PER', nome:'Percepção',   desc:'DES + CAN/2',   calc:b=>b.DES+Math.floor(b.CAN/2),
   aliases:['PERCEPCAO','PERCEPÇÃO']},
];
const ehDerivado = k => DERIV.some(d=>d.k===k);
/* Defesas: valor manual por personagem (varia por raça) + o que os equipamentos somam.
   Não entram na distribuição de pontos do level. */
const DEFESAS = [
  {k:'DFF', nome:'Defesa Física', rot:'DEF F', aliases:['DEFF','DEFESAFISICA']},
  {k:'DFM', nome:'Defesa Mágica', rot:'DEF M', aliases:['DEFM','DEFESAMAGICA']},
];
const ehDefesa = k => DEFESAS.some(d=>d.k===k);
/* cores dos cinco atributos principais, usadas na rolagem */
const COR_ATR = {FOR:'for', DES:'des', VIT:'vit', CAN:'can', AGI:'agi'};
const TIPOS_HAB = ['Ativo','Reativo','Passivo','Inativo'];
const TIERS_ATR = ['A','B','C','D','E'];

/* ---------- FORMULA ENGINE (parser próprio, sem eval) ---------- */
/* ##PARSER_START## */
function tokenize(src){
  const t=[]; let i=0;
  const isD=c=>c>='0'&&c<='9';
  const isA=c=>/[A-Za-zÀ-ÿ_]/.test(c);
  while(i<src.length){
    const c=src[i];
    if(c===' '||c==='\t'||c==='\n'){i++;continue}
    if(isD(c)||(c==='.'&&isD(src[i+1]))){
      let j=i; while(j<src.length&&(isD(src[j])||src[j]==='.'))j++;
      t.push({t:'num',v:parseFloat(src.slice(i,j))}); i=j; continue;
    }
    if(isA(c)){
      let j=i; while(j<src.length&&(isA(src[j])||isD(src[j])))j++;
      t.push({t:'id',v:src.slice(i,j)}); i=j; continue;
    }
    if('><=!'.includes(c)){
      const dois=src.slice(i,i+2);
      if(['>=','<=','==','!='].includes(dois)){t.push({t:'cmp',v:dois});i+=2;continue}
      if(c==='>'||c==='<'){t.push({t:'cmp',v:c});i++;continue}
      if(c==='='){t.push({t:'cmp',v:'=='});i++;continue}
      throw new Error('Use >, <, >=, <=, == ou !=');
    }
    if(';'===c){t.push({t:','});i++;continue}
    if('+-*/%^(),'.includes(c)){t.push({t:c});i++;continue}
    throw new Error('Caractere inválido: "'+c+'"');
  }
  return t;
}
const FUNCS={
  min:Math.min, max:Math.max, floor:Math.floor, ceil:Math.ceil,
  round:Math.round, abs:Math.abs, sqrt:Math.sqrt, pow:Math.pow,
  arredondar:Math.round, teto:Math.ceil, piso:Math.floor, raiz:Math.sqrt,
  se:(c,a,b)=>c?a:b
};
function evalFormula(src, vars){
  if(src==null||String(src).trim()==='') return null;
  const tk=tokenize(String(src)); let p=0;
  const peek=()=>tk[p], next=()=>tk[p++];
  function comparacao(){
    let v=expr();
    while(peek()&&peek().t==='cmp'){
      const o=next().v, r=expr();
      v = (o==='>'?v>r : o==='<'?v<r : o==='>='?v>=r : o==='<='?v<=r : o==='=='?v===r : v!==r) ? 1 : 0;
    }
    return v;
  }
  function expr(){
    let v=term();
    while(peek()&&(peek().t==='+'||peek().t==='-')){ const o=next().t; const r=term(); v = o==='+'? v+r : v-r; }
    return v;
  }
  function term(){
    let v=unary();
    while(peek()&&(peek().t==='*'||peek().t==='/'||peek().t==='%')){
      const o=next().t; const r=unary();
      if(o==='*')v=v*r; else if(o==='/'){ if(r===0) throw new Error('Divisão por zero'); v=v/r; } else { if(r===0) throw new Error('Divisão por zero'); v=v%r; }
    }
    return v;
  }
  function unary(){
    if(peek()&&peek().t==='-'){next();return -unary()}
    if(peek()&&peek().t==='+'){next();return unary()}
    return power();
  }
  function power(){
    const b=atom();
    if(peek()&&peek().t==='^'){next(); return Math.pow(b,unary())}
    return b;
  }
  function atom(){
    const tok=next();
    if(!tok) throw new Error('Fórmula incompleta');
    if(tok.t==='num') return tok.v;
    if(tok.t==='('){ const v=comparacao(); if(!peek()||next().t!==')') throw new Error('Falta fechar ")"'); return v; }
    if(tok.t==='id'){
      const nm=tok.v;
      if(peek()&&peek().t==='('){
        next();
        const f=FUNCS[nm.toLowerCase()];
        if(!f) throw new Error('Função desconhecida: '+nm);
        const args=[];
        if(peek()&&peek().t===')'){next()}
        else{
          for(;;){ args.push(comparacao()); const s=next(); if(!s) throw new Error('Falta fechar ")"'); if(s.t===')')break; if(s.t!==',') throw new Error('Esperado "," ou ")"'); }
        }
        return f.apply(null,args);
      }
      const key=nm.toUpperCase();
      if(key in vars) return vars[key];
      throw new Error('Variável desconhecida: '+nm);
    }
    throw new Error('Trecho inesperado na fórmula');
  }
  const out=comparacao();
  if(p<tk.length) throw new Error('Sobrou conteúdo depois da fórmula');
  if(!isFinite(out)) throw new Error('Resultado inválido');
  return out;
}
/* ##PARSER_END## */

/* ---------- ALEATORIEDADE ----------
   Usa crypto.getRandomValues (gerador criptográfico do navegador), com
   amostragem por rejeição para não distorcer as faces do dado. Nenhum
   Math.random em rolagem. Cada rolagem guarda o sorteio bruto no registro. */
function randInt(max){ // inteiro de 0 a max-1, uniforme
  if(max<=0) return 0;
  const cr = (window.crypto||window.msCrypto);
  const limite = Math.floor(4294967296/max)*max;   // corta o resto que enviesaria
  const buf=new Uint32Array(1);
  for(let i=0;i<64;i++){
    cr.getRandomValues(buf);
    if(buf[0]<limite) return buf[0]%max;
  }
  return buf[0]%max;
}
function rolarDado(faces){ return randInt(faces)+1 }
function rolarVarios(qtd,faces){ const r=[]; for(let i=0;i<qtd;i++) r.push(rolarDado(faces)); return r }

/* expressão livre: "2d6+1d8+5" / "d20-2" */
function rolarExpressao(txt){
  const s=String(txt||'').replace(/\s+/g,'').toLowerCase();
  if(!s) throw new Error('Escreva algo como 1d20+3');
  if(!/^[+-]?(\d*d\d+|\d+)([+-](\d*d\d+|\d+))*$/.test(s)) throw new Error('Formato inválido. Use 2d6+3, d20, 1d100-5…');
  const partes=s.match(/[+-]?(?:\d*d\d+|\d+)/g)||[];
  let total=0; const detalhe=[], dd=[];           // dd: [[lados, valor], …] — o que cada dado sorteou (para o auditor da mesa)
  partes.forEach(p=>{
    const sinal = p[0]==='-'? -1 : 1;
    const corpo = p.replace(/^[+-]/,'');
    if(corpo.includes('d')){
      const [q,f]=corpo.split('d');
      const qtd=q===''?1:parseInt(q,10), faces=parseInt(f,10);
      if(qtd<1||qtd>200) throw new Error('Quantidade de dados fora do razoável (1 a 200)');
      if(faces<2||faces>10000) throw new Error('Faces do dado fora do razoável (2 a 10000)');
      const rs=rolarVarios(qtd,faces);
      rs.forEach(r=>dd.push([faces,r]));
      total += sinal*rs.reduce((a,b)=>a+b,0);
      detalhe.push((sinal<0?'−':'')+qtd+'d'+faces+' ['+rs.join(', ')+']');
    }else{
      const v=parseInt(corpo,10); total+=sinal*v;
      detalhe.push((sinal<0?'−':'+')+v);
    }
  });
  return {total, detalhe:detalhe.join(' '), expr:s, dd};
}
/* o dado de uma rolagem com fixa, no mesmo formato (nada, quando a fixa é o atributo inteiro) */
const ddDaFixa = r => (r && r.dado>=2 ? [[r.dado, r.bruto]] : []);

/* fixa: atributo 60 fixando 20 → 1d40 + 20 */
function rolarFixa(valorAtributo, fixado){
  const v=Math.max(0,Math.round(+valorAtributo||0));
  const f=Math.min(v,Math.max(0,Math.round(+fixado||0)));
  const faces=v-f;
  if(faces<=0) return {dado:0, bruto:f, fixado:f, total:v, texto:'fixo em '+v};
  const bruto=rolarDado(faces);
  return {dado:faces, bruto, fixado:f, total:bruto+f, texto:'1d'+faces+' + '+f};
}

/* ---------- registro da mesa ---------- */
function logar(e){
  S.log = S.log||[];
  const reg = {id:uid(), ts:Date.now(), ...e};
  S.log.unshift(reg);
  if(S.log.length>300) S.log.length=300;
  save();
  // mesa ao vivo: com uma mesa aberta no site, a rolagem também aparece para a mesa (a casca decide se é aberta ou secreta)
  try{ if(window.TC && TC.ponte && TC.ponte.estado.mesa) TC.ponte.publicar('ficha', reg); }catch(err){}
}
function horaCurta(ts){
  const d=new Date(ts);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* ---------- estado padrão ---------- */
function tabelaNiveisPadrao(){
  const t=[]; for(let l=1;l<=50;l++) t.push({lvl:l, pts: l===50?445:45+(l-1)*8});
  return t;
}
function estadoPadrao(){
  return {
    v:1,
    cfg:{
      niveis:tabelaNiveisPadrao(),
      tiersPersonagem:[{t:'S',m:1.12},{t:'A',m:1.08},{t:'B',m:1.04},{t:'C',m:1.00},{t:'D',m:0.85},{t:'E',m:0.75}],
      pct:{A:0.30,B:0.26,C:0.22,D:0.17,E:0.05},
      arredondar:'floor'
    },
    personagens:[personagemPadrao('Dain X','Humano', 'S', 19, {FOR:'A',DES:'C',AGI:'D',VIT:'B',CAN:'E'})],
    situacoes:[],
    tabelas:[{id:uid(), nome:'Encontros na estrada', itens:'Caravana de mercadores nervosos\nPatrulha da Ordem dos Cruzados\nCorpo recente, sem ferimentos visíveis\nNeblina densa e silêncio absoluto\nNada acontece\nEmboscada'}],
    log:[],
    bib:null,
    sel:null, selSit:null, aba:'fichas'
  };
}
function uid(){return Math.random().toString(36).slice(2,10)}
function personagemPadrao(nome,raca,tier,level,tiers){
  return {
    id:uid(), nome:nome||'Novo personagem', raca:raca||'', lado:'Aliado', grupo:'', tags:[],
    tier:tier||'C', level:level||1,
    tiers: tiers||{FOR:'A',DES:'B',AGI:'C',VIT:'D',CAN:'E'},
    pctProprio:null,
    poderes:[],
    skills:{arvores:[], pontos:{}, alocados:{}},
    defesas:{DFF:0, DFM:0},
    rol:{fixa:0, fonte:'total'}, ultRol:null,
    disputa:{atrA:'FOR', alvoId:'', atrB:'FOR', fixaB:0, valorB:40},
    estaque:{a:'', b:''},
    habilidades:[],
    itens:[],
    recursos:[
      {id:uid(), nome:'HP', fml:'VIT*8 + LVL*5'},
      {id:uid(), nome:'SP', fml:'CAN*6 + LVL*3'}
    ],
    notas:''
  };
}
let S = estadoPadrao();

/* ---------- persistência ---------- */
let KEY='urgm_calc_atributos_v1';   // dentro de uma mesa do site, a chave passa a ser a da mesa (ver mesa.js)
async function loadState(){
  await FichasMesa.preparar();   // com uma mesa aberta no site, as fichas vêm dela
  try{
    if(window.storage && window.storage.get){
      const r=await window.storage.get(KEY);
      if(r && r.value) return JSON.parse(r.value);
    }
  }catch(e){/* chave ainda não existe */}
  try{
    const raw=localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
let saveT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    saveT=null;
    const data=JSON.stringify(S);
    try{ if(window.storage && window.storage.set){ await window.storage.set(KEY,data); } }catch(e){}
    try{ localStorage.setItem(KEY,data); }catch(e){}
  },350);
}
// Agora, sem esperar: a página vai fechar e a última mudança ainda estava na espera.
function saveJa(){
  if(!saveT) return;
  clearTimeout(saveT); saveT=null;
  const data=JSON.stringify(S);
  try{ if(window.storage && window.storage.set) window.storage.set(KEY,data); }catch(e){}
  try{ localStorage.setItem(KEY,data); }catch(e){}
}
addEventListener('pagehide', saveJa);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') saveJa(); });
if(window.TC && TC.ponte && TC.ponte.aoFechar) TC.ponte.aoFechar(saveJa);     // dentro do site: a casca avisa antes de fechar
function toast(msg){
  const d=document.createElement('div'); d.className='toast'; d.textContent=msg;
  document.body.appendChild(d); setTimeout(()=>d.remove(),2200);
}

/* ---------- cálculo ---------- */
function ptsDoLevel(lvl){
  const t=S.cfg.niveis, row=t.find(r=>+r.lvl===+lvl);
  if(row) return +row.pts;
  if(!t.length) return 0;
  const last=t[t.length-1], first=t[0];
  if(+lvl>+last.lvl) return +last.pts;      // acima da tabela: trava no último
  return +first.pts;
}
function multTier(tier){
  const r=S.cfg.tiersPersonagem.find(x=>x.t===tier);
  return r? +r.m : 1;
}
function pctDe(pc,tier){
  const tab = pc.pctProprio || S.cfg.pct;
  const v = tab[tier];
  return v==null?0:+v;
}
function arred(n){
  if(n==null||isNaN(n))return n;
  switch(S.cfg.arredondar){
    case 'floor': return Math.floor(n);
    case 'ceil':  return Math.ceil(n);
    case 'round': return Math.round(n);
    default:      return Math.round(n*1000)/1000;
  }
}
function bonusItens(pc){
  const b={}; ATRIBS.forEach(a=>b[a.k]=0); DERIV.forEach(d=>b[d.k]=0); DEFESAS.forEach(d=>b[d.k]=0);
  (pc.itens||[]).forEach(it=>{ if(it.equipado!==false){
    ATRIBS.forEach(a=>{ b[a.k]+= (+it.bonus?.[a.k]||0); });
    DERIV.forEach(d=>{ b[d.k]+= (+it.bonus?.[d.k]||0); });
    DEFESAS.forEach(d=>{ b[d.k]+= (+it.bonus?.[d.k]||0); });
  }});
  return b;
}
function calcular(pc){
  // As contas são as das regras compartilhadas do site (conferidas contra as daqui): as mesmas, mais os bônus dos
  // nódulos escolhidos na árvore. O cálculo original, logo abaixo, fica de reserva se a biblioteca não carregar.
  if(window.TC && TC.rules && !calcular.semLib){
    try{ return TC.rules.calcular(pc, S.cfg, {arvore: TC.rules.bonusDaArvore(pc.skills, S.bib), temp: pc.estado && pc.estado.tmp, fer: pc.estado && pc.estado.fer}); }
    catch(e){ console.error(e); calcular.semLib=true; }
  }
  const mult=multTier(pc.tier);
  const total    = ptsDoLevel(pc.level)*mult;
  const totalAnt = ptsDoLevel(Math.max(1,(+pc.level)-1))*mult;
  const eq=bonusItens(pc);
  const base={},ant={},tot={};
  ATRIBS.forEach(a=>{
    const p=pctDe(pc,pc.tiers[a.k]);
    base[a.k]=arred(total*p);
    ant[a.k] =arred(totalAnt*p);
    tot[a.k] =base[a.k]+eq[a.k];
  });
  const der={}, derAnt={};                       // sempre a partir dos valores BASE
  DERIV.forEach(d=>{ der[d.k]=d.calc(base)+eq[d.k]; derAnt[d.k]=d.calc(ant)+eq[d.k]; });
  const def={};                                   // manual da ficha + equipamentos
  DEFESAS.forEach(d=>{ def[d.k]=(+((pc.defesas||{})[d.k])||0)+eq[d.k]; });
  const vars={LVL:+pc.level, NIVEL:+pc.level, MULT:mult, PTS:arred(total), TOTAL:arred(total)};
  DERIV.forEach(d=>{
    vars[d.k]=der[d.k]; vars[d.k+'_B']=d.calc(base); vars[d.k+'_EQ']=eq[d.k];
    d.aliases.forEach(al=>{vars[al]=der[d.k]});
  });
  DEFESAS.forEach(d=>{
    vars[d.k]=def[d.k]; vars[d.k+'_B']=+((pc.defesas||{})[d.k])||0; vars[d.k+'_EQ']=eq[d.k];
    d.aliases.forEach(al=>{vars[al]=def[d.k]});
  });
  ATRIBS.forEach(a=>{
    vars[a.k]=tot[a.k];               // com equipamento
    vars[a.k+'_B']=base[a.k];         // base, sem equipamento
    vars[a.k+'_EQ']=eq[a.k];          // só o bônus
    a.aliases.forEach(al=>{vars[al]=tot[a.k]; vars[al+'_B']=base[a.k]; vars[al+'_EQ']=eq[a.k];});
  });
  const recursos=(pc.recursos||[]).map(r=>{
    let val=null,err=null;
    try{ val=evalFormula(r.fml,vars); }catch(e){ err=e.message; }
    return {...r, val, err};
  });
  return {mult,total,totalAnt,base,ant,tot,eq,der,derAnt,def,vars,recursos};
}
function somaPercentuaisUsados(pc){
  return ATRIBS.reduce((s,a)=>s+pctDe(pc,pc.tiers[a.k]),0);
}

/* ---------- flor de atributos (5 pétalas = 5 atributos) ---------- */
function petala(cx,cy,ang,R,largura){
  const rad=a=>a*Math.PI/180;
  const px=(a,r)=>[cx+r*Math.sin(rad(a)), cy-r*Math.cos(rad(a))];
  const [tx,ty]=px(ang,R);
  const [c1x,c1y]=px(ang-largura,R*0.62);
  const [c2x,c2y]=px(ang+largura,R*0.62);
  return `M${cx} ${cy} C${c1x} ${c1y} ${tx} ${ty} ${tx} ${ty} C${tx} ${ty} ${c2x} ${c2y} ${cx} ${cy} Z`;
}
function florSVG(c){
  const W=300,H=300,cx=150,cy=152,R=104;
  const angs=[0,72,144,216,288];
  const maxv=Math.max(1,...ATRIBS.map(a=>Math.max(c.tot[a.k],c.base[a.k])));
  const esc=v=>R*Math.max(0.04,Math.min(1,v/(maxv*1.06)));
  const pt=(ang,r)=>[cx+r*Math.sin(ang*Math.PI/180), cy-r*Math.cos(ang*Math.PI/180)];
  const poly=(vals)=>vals.map((v,i)=>pt(angs[i],esc(v)).map(n=>n.toFixed(1)).join(',')).join(' ');
  const petalas=angs.map(a=>`<path d="${petala(cx,cy,a,R,34)}" fill="var(--flor-petala)" stroke="var(--flor-borda)" stroke-width="1"/>`).join('');
  const grid=[0.25,0.5,0.75,1].map(f=>`<polygon points="${angs.map(a=>pt(a,R*f).map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--radar)" stroke-width="1"/>`).join('');
  const eixos=angs.map(a=>{const[x,y]=pt(a,R);return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--radar)" stroke-width="1"/>`}).join('');
  const labels=angs.map((a,i)=>{
    const[x,y]=pt(a,R+22);
    const anchor = Math.abs(Math.sin(a*Math.PI/180))<0.2?'middle':(Math.sin(a*Math.PI/180)>0?'start':'end');
    return `<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${anchor}" font-family="IBM Plex Mono,monospace" font-size="11" fill="var(--ink-soft)">${ATRIBS[i].k}</text>
            <text x="${x.toFixed(1)}" y="${(y+17).toFixed(1)}" text-anchor="${anchor}" font-family="IBM Plex Mono,monospace" font-size="10.5" fill="var(--ink)" font-weight="600">${c.tot[ATRIBS[i].k]}</text>`;
  }).join('');
  const vb=ATRIBS.map(a=>c.base[a.k]), vt=ATRIBS.map(a=>c.tot[a.k]);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:320px" role="img" aria-label="Flor de atributos">
    ${petalas}${grid}${eixos}
    <polygon points="${poly(vt)}" fill="var(--radar-miolo)" stroke="var(--teal)" stroke-width="2.2"/>
    <polygon points="${poly(vb)}" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="5 4"/>
    ${labels}
  </svg>`;
}

/* ---------- render: elenco ---------- */
function renderLista(){
  const ul=document.getElementById('lista'); ul.innerHTML='';
  const tags=todasTags(), ft=S.filtroTags||[];
  const barra=document.getElementById('tagbar');
  barra.innerHTML = tags.length
    ? tags.map(t=>`<button class="tag ${ft.includes(t)?'on':''}" data-ftag="${esc(t)}">${esc(t)}</button>`).join('')
      + (ft.length?`<button class="tag limpar" data-ftag="__limpar__">limpar</button>`:'')
    : '<span class="hint" style="font-size:11px">Sem tags ainda — adicione na ficha.</span>';

  /* Com campanhas na mesa, a lista vem em blocos: o da campanha em vista (aberto, em cima), o do mundo e os das outras
     campanhas (recolhidos). Cada bloco tem os grupos dele. Sem campanhas, é um bloco só, sem nome: a lista de sempre. */
  const blocos=FichasMesa.blocos(), mestre=!FichasMesa.ativo()||FichasMesa.mestre(), comCamp=blocos.length>1 || !!blocos[0].nome;
  const organiza=FichasMesa.organiza();        // (passar ficha ou grupo de uma campanha para outra: só o mestre da mesa)
  let html='';
  blocos.forEach(b=>{
    const doBloco=b.unico? S.personagens : S.personagens.filter(p=>FichasMesa.blocoDe(p)===b.camp);
    const trancado=!!b.encerrada || b.camp==='?';      // (campanha encerrada: só consulta)
    /* Só o mestre da mesa passa ficha de um bloco para outro: para os outros, um bloco sem nenhuma ficha (que não seja o
       da campanha em vista) não diz nada, e não aparece. */
    if(comCamp && !organiza && !b.vista && !doBloco.length) return;
    // um bloco sem ninguém em que dá para soltar uma ficha: o da campanha em vista e, para o mestre da mesa, qualquer um aberto
    const soltarAqui=comCamp && !doBloco.length && (b.vista || (organiza && !trancado));
    const secoes=[...gruposOrdenados(b.camp), ''];
    let dentro='';
    secoes.forEach(g=>{
      const membros=doBloco.filter(p=>(p.grupo||'')===g && casaFiltro(p));
      const total=doBloco.filter(p=>(p.grupo||'')===g).length;
      if(g==='' && !total && !soltarAqui) return;        // "Sem grupo" só aparece se tiver alguém (ou para o bloco vazio ter onde soltar)
      if(filtroAtivo() && !membros.length) return;       // filtrando: esconde seção vazia
      const chave=chaveSec(b.camp,g), fechado=(S.fechados||[]).includes(chave);
      dentro+=`<li class="sec" data-sec="${esc(g||SEM)}" data-camp="${esc(b.camp)}">
        <div class="sechd">
          <button class="caret" data-toggle="${esc(g||SEM)}">${fechado?'▸':'▾'}</button>
          <span class="secnome">${g?esc(g):'Sem grupo'}</span>
          <span class="cnt mono">${membros.length}${membros.length!==total?'/'+total:''}</span>
          ${g && !trancado?`<span class="secacts">
            <button class="mini" data-gmove="${esc(g)}|-1" title="Subir grupo">▲</button>
            <button class="mini" data-gmove="${esc(g)}|1" title="Descer grupo">▼</button>
            <button class="mini" data-gren="${esc(g)}" title="Renomear">✎</button>
            ${comCamp && organiza?`<button class="mini" data-gcamp="${esc(g)}" title="Passar o grupo para outra campanha…" aria-label="Passar o grupo ${esc(g)} para outra campanha">⇄</button>`:''}
            <button class="mini danger" data-gdel="${esc(g)}" title="Desfazer grupo">×</button>
          </span>`:''}
        </div>
        <ul class="secitens" data-lista="${esc(g||SEM)}" data-camp="${esc(b.camp)}" ${trancado?'data-trancado="1"':''} ${fechado?'hidden':''}>
          ${membros.map(p=>linhaElenco(p)).join('') || (trancado?'<li class="vazio hint">ninguém aqui</li>':'<li class="vazio hint">arraste alguém pra cá'+(comCamp && !b.camp && soltarAqui?': quem é do mundo aparece em todas as campanhas':'')+'</li>')}
        </ul></li>`;
    });
    if(!comCamp){ html+=dentro; return; }
    if(filtroAtivo() && !dentro) return;                 // filtrando: esconde o bloco sem ninguém
    // o bloco em vista começa aberto (dá para recolher); os outros começam recolhidos (dá para abrir)
    const kb=chaveBloco(b.camp), fechadoB = filtroAtivo()? false : b.vista ? (S.fechados||[]).includes(kb) : !(S.abertos||[]).includes(kb);
    html+=`<li class="bloco${b.vista?' vista':''}" data-bloco="${esc(b.camp)}">
      <div class="blocohd">
        <button class="caret" data-btoggle="${esc(b.camp)}" aria-expanded="${!fechadoB}" aria-label="${fechadoB?'Abrir':'Recolher'} ${esc(b.nome)}">${fechadoB?'▸':'▾'}</button>
        <span class="bloconome">${esc(b.nome)}</span>
        <span class="cnt mono">${doBloco.length}</span>
        ${b.encerrada?'<span class="blocotag">encerrada</span>':b.vista && b.camp?'<span class="blocotag vis">em vista</span>':''}
      </div>
      <ul class="blocoitens" ${fechadoB?'hidden':''}>${dentro || '<li class="vazio hint">'+(b.camp?'nenhuma ficha nesta campanha ainda':'nenhuma ficha do mundo: o que estiver aqui aparece em todas as campanhas')+'</li>'}</ul></li>`;
  });
  ul.innerHTML = html || '<li><div class="empty" style="padding:18px">Nada encontrado.</div></li>';
  ligarElenco();
}
// a chave com que a tela lembra se uma seção (ou um bloco) está recolhida; as do mundo ficam como sempre foram
function chaveSec(camp,g){ return (camp? camp+'\u0001' : '')+(g||SEM); }
function chaveBloco(camp){ return 'bloco\u0001'+(camp||''); }
/* iniciativa da ficha: um número ou uma fórmula (as mesmas variáveis dos recursos) */
function iniciativaDe(pc){
  if(window.TC && TC.rules){ try{ return TC.rules.iniciativa(pc, S.cfg, {arvore: TC.rules.bonusDaArvore(pc.skills, S.bib), temp: pc.estado && pc.estado.tmp, fer: pc.estado && pc.estado.fer}); }catch(e){} }
  const n=parseInt(pc.ini,10); return {val: isFinite(n)? n : 0, err:null};
}
function iniTexto(pc){ const r=iniciativaDe(pc); return r.err? 'fórmula com erro' : (String(pc.ini||'').trim()===''? 'sem bônus' : '= '+(r.val>=0?'+':'−')+Math.abs(r.val)); }
/* valor atual de um recurso: o que foi anotado; sem anotação, está no começo da barra (cheia, se ela não tem "começa em") */
function temAtual(pc,r){ const rec=pc.estado&&pc.estado.rec; return !!rec && isFinite(rec[r.id]) && rec[r.id]!==null; }
function atualDoRecurso(pc,r){ return temAtual(pc,r)? +pc.estado.rec[r.id] : (r.inicio!=null? r.inicio : arred(r.val)); }
/* As barrinhas embaixo da imagem do personagem: cada recurso (HP, SP…) com o valor atual, só para ver de relance.
   Mexer continua sendo no quadro dos recursos; as cores são as das barras dos tokens, na mesma ordem. */
const CORES_BARRINHA=['#d6524b','#4a9be0','#e2b23e','#6fbf73','#b07ad9','#e58a4e','#4fc3c0','#d96aa0'];
function htmlBarrinhas(pc, c){
  const rs=((c||calcular(pc)).recursos||[]).filter(r=>!r.err && r.val!=null && isFinite(r.val) && arred(r.val)>0);
  if(!rs.length) return '';
  return `<div class="barrinhas" id="barrinhas" role="group" aria-label="Recursos do personagem">${rs.map((r,i)=>{
    // abaixo de zero (na barra que pode ficar negativa), a barrinha mostra a parte negativa, riscada
    const max=arred(r.val), at=atualDoRecurso(pc,r), neg=at<0 && r.min<0;
    const pct=neg? Math.min(100,at/r.min*100) : Math.max(0,Math.min(100,at/max*100));
    return `<div class="bz${neg?' neg':''}" data-bz="${r.id}" title="${esc(r.nome)}: ${fmt(at).replace('-','−')} de ${fmt(max)}${neg?' (pode ir até '+fmt(r.min).replace('-','−')+')':''}">
      <span class="bzn">${esc(r.nome)}</span><span class="bzv">${fmt(at).replace('-','−')}/${fmt(max)}</span>
      <span class="bzt"><i style="width:${pct.toFixed(1)}%;${neg?'':'background:'+CORES_BARRINHA[i%CORES_BARRINHA.length]}"></i></span></div>`;
  }).join('')}</div>`;
}
// (depois de mexer num valor atual sem redesenhar a ficha inteira)
function pintarBarrinhas(host, pc){
  const el=host.querySelector('#barrinhas'); if(!el) return;

/* Chegou uma mudança da mesa enquanto alguém digita nesta ficha. A ficha inteira só é redesenhada quando a pessoa

  const doGrupo=(camp,g)=>S.personagens.filter(p=>FichasMesa.blocoDe(p)===camp && (p.grupo||'')===g);
  ul.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{
    const g=chaveSec(campDe(b), b.dataset.toggle===SEM?'':b.dataset.toggle); S.fechados=S.fechados||[];

    S[campo]=S[campo]||[];

    const [g,d]=b.dataset.gmove.split('|'), camp=campDe(b); fixarGrupos();

    l.splice(j,0,l.splice(i,1)[0]); save(); renderLista();

  ul.querySelectorAll('[data-gren]').forEach(b=>b.onclick=()=>{

    doGrupo(camp,g).forEach(p=>{p.grupo=novo});
    S.fechados=(S.fechados||[]).map(x=>x===chaveSec(camp,g)?chaveSec(camp,novo):x);
    save(); render();
  });
  ul.querySelectorAll('[data-gdel]').forEach(b=>b.onclick=()=>{
    const g=b.dataset.gdel, camp=campDe(b);

  ul.querySelectorAll('[data-gcamp]').forEach(b=>b.onclick=()=>abrirPassarGrupo(campDe(b), b.dataset.gcamp));
  document.getElementById('tagbar').querySelectorAll('[data-ftag]').forEach(b=>b.onclick=()=>{

    save(); renderLista();
  });
  ul.querySelectorAll('[data-grab]').forEach(h=>h.onpointerdown=e=>iniciarArraste(e,h.closest('.pcrow')));
}

/* ---------- arrastar para reordenar / trocar de grupo ---------- */
let arrasto=null;
function iniciarArraste(e,li){
  if(!li) return;
  if(filtroAtivo()){ toast('Limpe a busca e as tags para reordenar'); return; }
  e.preventDefault();
  const r=li.getBoundingClientRect();
  const fantasma=li.cloneNode(true);
  fantasma.classList.add('fantasma');
  Object.assign(fantasma.style,{position:'fixed',left:r.left+'px',top:r.top+'px',
    width:r.width+'px',pointerEvents:'none',zIndex:80,margin:0});
  document.body.appendChild(fantasma);
  li.classList.add('arrastando');
  document.body.classList.add('arrastando-agora');
  arrasto={li,fantasma,dx:e.clientX-r.left,dy:e.clientY-r.top};
  window.addEventListener('pointermove',moverArraste);
  window.addEventListener('pointerup',soltarArraste,{once:true});
  window.addEventListener('pointercancel',soltarArraste,{once:true});
}
function moverArraste(e){
  if(!arrasto) return;
  arrasto.fantasma.style.left=(e.clientX-arrasto.dx)+'px';
  arrasto.fantasma.style.top =(e.clientY-arrasto.dy)+'px';
  const caixa=document.getElementById('lista');
  const rc=caixa.getBoundingClientRect();                 // rola sozinho perto das bordas
  if(e.clientY<rc.top+28) caixa.scrollTop-=8;
  else if(e.clientY>rc.bottom-28) caixa.scrollTop+=8;
  const alvo=document.elementFromPoint(e.clientX,e.clientY);
  if(!alvo||!alvo.closest) return;
  const linha=alvo.closest('.pcrow:not(.fantasma)');
  if(linha && linha!==arrasto.li){
    const rr=linha.getBoundingClientRect();
    const depois=e.clientY>rr.top+rr.height/2;
    linha.parentNode.insertBefore(arrasto.li, depois? linha.nextSibling : linha);
    return;
  }
  const lista=alvo.closest('[data-lista]');
  if(lista && !lista.contains(arrasto.li)) lista.appendChild(arrasto.li);
}
function soltarArraste(){
  if(!arrasto) return;
  window.removeEventListener('pointermove',moverArraste);
  arrasto.fantasma.remove();
  arrasto.li.classList.remove('arrastando');
  document.body.classList.remove('arrastando-agora');
  const movido=arrasto.li.dataset.id;
  arrasto=null;
  const mapa=new Map(S.personagens.map(p=>[p.id,p])), novos=[], antes=S.personagens.slice();
  let mudou=null, recusado=false;     // mudou: a ficha arrastada passou para outra campanha (dá para desfazer)
  document.querySelectorAll('#lista [data-lista]').forEach(ulSec=>{
    const g=ulSec.dataset.lista===SEM? '' : ulSec.dataset.lista, camp=ulSec.dataset.camp||'', trancado=!!ulSec.dataset.trancado;
    ulSec.querySelectorAll('.pcrow').forEach(li=>{
      const p=mapa.get(li.dataset.id);
      if(!p) return;
      const de=FichasMesa.blocoDe(p);
      /* Soltar numa seção de outro bloco passa a ficha para aquela campanha (ou para o mundo) — o que só o mestre da
         mesa faz. Não vale para a campanha encerrada — nem para tirar ficha dela, nem para pôr —, nem para o bloco das
         campanhas que não aparecem aqui. */
      if(de!==camp && !FichasMesa.organiza()){ if(p.id===movido) recusado='papel'; novos.push(p); mapa.delete(li.dataset.id); return; }
      if(de!==camp && (trancado || FichasMesa.encerrada(p._camp) || de==='?')){ if(p.id===movido) recusado=true; novos.push(p); mapa.delete(li.dataset.id); return; }
      if(de!==camp){ if(p.id===movido) mudou={pc:p, camp:p._camp||null, grupo:p.grupo||''}; p._camp=camp||null; }
      p.grupo=g; novos.push(p); mapa.delete(li.dataset.id);
    });
  });
  mapa.forEach(p=>novos.push(p));      // quem estiver escondido mantém-se no fim
  S.personagens=novos; fixarGrupos(); save(); renderLista();
  if(recusado) toast(recusado==='papel'? 'Só o mestre da mesa passa fichas de uma campanha para outra.' : 'Campanha encerrada: as fichas dela não saem, e nenhuma entra.');
  if(mudou){
    const pc=mudou.pc;
    FichasMesa.garantirRelacoes(); save(); if(S.sel===pc.id) renderFicha();
    FichasExtras.aviso(pc.nome+' passou para '+(pc._camp? 'a campanha '+FichasMesa.nomeDaCampanha(pc._camp) : 'o mundo (aparece em todas as campanhas)')+'.', 'Desfazer', ()=>{
      pc._camp=mudou.camp; pc.grupo=mudou.grupo;
      S.personagens=antes.filter(p=>S.personagens.includes(p)).concat(S.personagens.filter(p=>!antes.includes(p)));
      fixarGrupos(); save(); render();
    }, 9000);
    FichasMesa.avisarDeFora([pc]);
  }
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const SEM='__sem__';
/* Os grupos de um bloco da lista, na ordem do mestre: os do mundo ficam em S.grupos; os de cada campanha, em
   S.gruposCamp[campanha]. (Sem campanhas, o bloco é um só — camp '' — e tudo é como sempre foi.) */
function gruposDe(camp){
  if(!camp) return (S.grupos=S.grupos||[]);
  if(camp==='?') return [];
  const m=(S.gruposCamp && typeof S.gruposCamp==='object' && !Array.isArray(S.gruposCamp))? S.gruposCamp : (S.gruposCamp={});
  return Array.isArray(m[camp])? m[camp] : (m[camp]=[]);
}
function porGrupos(camp,lista){ if(!camp) S.grupos=lista; else if(camp!=='?'){ gruposDe(camp); S.gruposCamp[camp]=lista; } }
function gruposOrdenados(camp){
  camp=camp||'';
  const nomes=[...gruposDe(camp)];
  S.personagens.forEach(p=>{ if(FichasMesa.blocoDe(p)!==camp) return; const g=p.grupo||''; if(g && !nomes.includes(g)) nomes.push(g); });
  return nomes;
}
function fixarGrupos(){ S.grupos=gruposOrdenados(''); FichasMesa.campanhas().forEach(c=>{ const l=gruposOrdenados(c.id); if(l.length || (S.gruposCamp||{})[c.id]) porGrupos(c.id,l); }); }
/* As opções do campo "Grupo" da ficha. Sem campanhas: "Sem grupo" e os grupos, como sempre (o valor é o nome do grupo).
   Com campanhas, o valor é "campanha/grupo", e quem mestra escolhe também o bloco — a campanha da ficha, o mundo ou
   outra campanha: escolher um grupo de outro bloco passa a ficha para lá. */
function opcoesDeGrupo(pc){
  const bloco=FichasMesa.blocoDe(pc), g0=pc.grupo||'';
  const ops=(camp,codigo)=>['', ...gruposOrdenados(camp)].map(g=>`<option value="${esc(codigo? camp+'/'+g : g)}" ${camp===bloco && g===g0?'selected':''}>${g?esc(g):'Sem grupo'}</option>`).join('');
  if(!FichasMesa.campanhas().length) return ops('',false);
  // quem não é o mestre da mesa — e a ficha de campanha encerrada, ou de uma campanha que não aparece aqui — só troca de grupo dentro do bloco
  if(!FichasMesa.organiza() || bloco==='?' || FichasMesa.encerrada(pc._camp)) return ops(bloco,true);
  return FichasMesa.blocos().filter(b=>b.camp!=='?' && (!b.encerrada || b.camp===bloco)).map(b=>`<optgroup label="${esc(b.nome)}">${ops(b.camp,true)}</optgroup>`).join('');
}
function lerOpcaoDeGrupo(v, bloco){
  const i=FichasMesa.campanhas().length? String(v).indexOf('/') : -1;
  return i<0? {camp:bloco||'', g:v} : {camp:v.slice(0,i), g:v.slice(i+1)};
}
// todos os grupos que têm alguém, para "adicionar o grupo inteiro" (com campanhas, em blocos: o da campanha em vista primeiro)
function opcoesDeGruposCheios(){
  const comCamp=FichasMesa.campanhas().length>0;
  return FichasMesa.blocos().map(b=>{
    const doBloco=b.unico? S.personagens : S.personagens.filter(p=>FichasMesa.blocoDe(p)===b.camp);
    const ops=gruposOrdenados(b.camp).map(g=>{ const n=doBloco.filter(p=>(p.grupo||'')===g).length; return n? `<option value="${esc(comCamp? b.camp+'/'+g : g)}">${esc(g)} (${n})</option>` : (comCamp? '' : `<option value="${esc(g)}">${esc(g)} (0)</option>`); }).join('');
    return !comCamp? ops : ops? `<optgroup label="${esc(b.nome)}">${ops}</optgroup>` : '';
  }).join('');
}
/* Passar um grupo inteiro para outra campanha (ou para o mundo): as fichas dele vão junto. Só o mestre da mesa. */
function abrirPassarGrupo(camp, g){
  if(!FichasMesa.organiza()){ toast('Só o mestre da mesa passa um grupo para outra campanha.'); return; }
  const fichas=S.personagens.filter(p=>FichasMesa.blocoDe(p)===camp && (p.grupo||'')===g);
  const destinos=FichasMesa.blocos().filter(b=>b.camp!==camp && b.camp!=='?' && !b.encerrada);
  if(!destinos.length){ toast('Não há outra campanha aberta para onde passar o grupo.'); return; }
  let escolhido=destinos[0].camp;
  const m=document.createElement('div'); m.className='modal';
  const fechar=()=>m.remove();
  const desenhar=()=>{
    const jaTem=gruposOrdenados(escolhido).includes(g);
    m.innerHTML=`<div class="sheet" style="max-width:520px">
      <div class="hd"><span class="eyebrow">Passar o grupo para outra campanha</span>

        <div class="pgops" role="radiogroup" aria-label="Para onde vai o grupo">
          ${destinos.map(b=>`<label class="pgop"><input type="radio" name="pgdest" value="${esc(b.camp)}" ${b.camp===escolhido?'checked':''}> <span>${esc(b.camp? b.nome : 'Do mundo')}${b.camp?'':' <span class="hint">— aparece em todas as campanhas</span>'}</span></label>`).join('')}
        </div>
        <p class="hint" id="pgNota" style="margin:10px 0 0">${escolhido? 'Só quem participa dessa campanha passa a ver as fichas abertas desse grupo (o dono de cada ficha continua vendo a dele).' : 'Todos os jogadores da mesa passam a ver as fichas abertas desse grupo.'}${jaTem? ' Lá já existe um grupo com esse nome: as fichas se juntam a ele.' : ''}</p>
        <div class="modalacts">
          <span style="margin-left:auto;display:flex;gap:8px">
            <button id="pgCancel">Cancelar</button>
            <button class="primary" id="pgOk">Passar o grupo</button>
          </span>
        </div>
      </div></div>`;
    m.querySelector('#pgX').onclick=fechar; m.querySelector('#pgCancel').onclick=fechar;
    m.querySelectorAll('[name="pgdest"]').forEach(r=>r.onchange=()=>{ escolhido=r.value; desenhar(); const marcado=m.querySelector('[name="pgdest"]:checked'); if(marcado) marcado.focus(); });
    m.querySelector('#pgOk').onclick=()=>{ fechar(); passarGrupo(camp, g, escolhido); };
  };
  m.onclick=e=>{ if(e.target===m) fechar(); };
  document.body.appendChild(m); desenhar();
}
function passarGrupo(camp, g, para){
  const fichas=S.personagens.filter(p=>FichasMesa.blocoDe(p)===camp && (p.grupo||'')===g && !FichasMesa.encerrada(p._camp));
  fixarGrupos();
  const antes={origem:[...gruposDe(camp)], destino:[...gruposDe(para)]};
  fichas.forEach(p=>{ p._camp=para||null; });
  porGrupos(camp, gruposDe(camp).filter(x=>x!==g));
  const ld=gruposDe(para); if(!ld.includes(g)) ld.push(g);
  FichasMesa.garantirRelacoes(); save(); render();
  FichasExtras.aviso('O grupo '+g+' passou para '+(para? 'a campanha '+FichasMesa.nomeDaCampanha(para) : 'o mundo (aparece em todas as campanhas)')+'.', 'Desfazer', ()=>{
    fichas.forEach(p=>{ p._camp=camp||null; });
    porGrupos(camp, antes.origem); porGrupos(para, antes.destino);
    save(); render();
  }, 12000);
  FichasMesa.avisarDeFora(fichas);
}
function todasTags(){
  const t=new Set(); S.personagens.forEach(p=>(p.tags||[]).forEach(x=>t.add(x)));
  return [...t].sort((a,b)=>a.localeCompare(b,'pt-BR'));
}
function filtroAtivo(){
  const q=(document.getElementById('busca')?.value||'').trim();
  return !!q || (S.filtroTags||[]).length>0;
}
function casaFiltro(p){
  const q=(document.getElementById('busca')?.value||'').toLowerCase().trim();
  const texto=(p.nome+' '+(p.raca||'')+' '+(p.grupo||'')+' '+(p.tags||[]).join(' ')).toLowerCase();
  if(q && !texto.includes(q)) return false;
  const ft=S.filtroTags||[];
  if(ft.length && !ft.some(t=>(p.tags||[]).includes(t))) return false;
  return true;
}

         ['skills','Skills', Object.keys(skillsDe(pc).alocados).length||''],
         ['habs','Passivas e Habilidades', ((pc.habilidades||[]).length + habsDaArvore(pc).length)||''],
         ['missoes','Missões', FichasQuadros.contaAtivas(pc)||''],
         ['notas','Anotações gerais', (pc.notas||'').trim()?'•':'']

          ${mk!==''?`<span class="mk">${mk}</span>`:''}</button>`).join('')}
    </div>
    <div class="bd">
      ${sub0==='estaque'?`
        <div class="colunas">
          <textarea class="entrada" rows="10" data-est="a" placeholder="Dificuldade de Visão - 0/100&#10;Sangramento - 2 turnos">${esc(pc.estaque.a||'')}</textarea>
          <textarea class="entrada" rows="10" data-est="b" placeholder="Segunda coluna">${esc(pc.estaque.b||'')}</textarea>
        </div>`
      : sub0==='skills'? blocoSkills(pc)
      : sub0==='missoes'? FichasQuadros.blocoMissoes(pc)
      : sub0==='habs'?`
        <div class="sitbar" style="margin-bottom:10px">
          <span class="hint">${TIPOS_HAB.map(t=>{const n=(pc.habilidades||[]).filter(h=>(h.tipo||'Ativo')===t).length;
            return n?`${n} ${t.toLowerCase()}${n>1?'s':''}`:''}).filter(Boolean).join(' · ')||'nenhuma habilidade'}</span>
          <button class="mini primary" style="margin-left:auto" data-habadd="1">+ Habilidade</button>
        </div>
        ${(pc.habilidades||[]).length? (pc.habilidades||[]).map(h=>{const tp=h.tipo||'Ativo';return `
          <div class="habrow ${tp==='Inativo'?'off':''}">
            <select class="tipohab t-${tp.toLowerCase()}" data-habtipo="${h.id}">
              ${TIPOS_HAB.map(t=>`<option ${tp===t?'selected':''}>${t}</option>`).join('')}
            </select>
            <input class="inm habnome" data-habnome="${h.id}" value="${esc(h.nome||'')}" placeholder="Nome da passiva ou habilidade">
            <button class="mini danger" data-habdel="${h.id}">×</button>
            <textarea rows="2" data-habdesc="${h.id}" placeholder="O que faz, custo, condição de uso…">${esc(h.desc||'')}</textarea>
          </div>`}).join('')
        : '<div class="hint">Nenhuma habilidade cadastrada. As inativas continuam na ficha, só ficam apagadas.</div>'}
        ${htmlHabsDaArvore(pc)}
        ${FichasExtras.htmlEfeitosEquipados(pc)}`
      :`<textarea id="f_notas" rows="8" placeholder="O que mudou no último level up, dívidas, promessas, o que o personagem sabe e o que não sabe…">${esc(pc.notas||'')}</textarea>`}
    </div>
  </div>
  `;
  ligarFicha(pc);
}
function pips(pw){
  const max=+pw.max||0;
  if(max<=0) return '<span class="hint">Sem limite definido — use − e +.</span>';
  if(max>24) return '<span class="hint">Limite alto demais para desenhar os círculos.</span>';
  let h='';
  for(let i=1;i<=max;i++) h+=`<button class="pip ${i<=pw.atual?'on':''}" data-pip="${pw.id}|${i}" title="${i} de ${max}"></button>`;
  return h;
}
function arredTxt(n){return (Math.round(n*100)/100)}
function fmt(n){ const r=Math.round(n*100)/100; return String(r) }

/* ---------- eventos da ficha ---------- */
function ligarFicha(pc){
  const host=document.getElementById('ficha');
  // (o desenho não atrapalha o gesto que causou a mudança — o clique noutro lugar, o Tab —, e o cursor fica onde o gesto o deixou)
  const patch=(f)=>{f(); save(); FichasExtras.desenhar(render)};
  const patchLeve=(f)=>{f(); save(); /* sem re-render: não perde o foco */};

  host.querySelector('#f_nome').oninput=e=>{pc.nome=e.target.value; save(); renderLista()};
  host.querySelector('#f_raca').oninput=e=>{pc.raca=e.target.value; save(); renderLista()};
  host.querySelector('#f_lado').onchange=e=>{pc.lado=e.target.value; save(); renderLista()};
  FichasMesa.ligarDono(host, pc);
  FichasExtras.ligarRetrato(host, pc);
  FichasExtras.ligarLapros(host, pc);
  FichasExtras.ligarAtributos(host, pc);
  FichasExtras.ligarMente(host, pc);
  FichasExtras.ligarEfeitos(host, pc);
  FichasExtras.ligarSobrevida(host, pc);
  FichasExtras.ligarNovos(host, pc);
  FichasQuadros.ligar(host, pc);
  const fini=host.querySelector('#f_ini');
  if(fini) fini.oninput=e=>patchLeve(()=>{ pc.ini=e.target.value; const v=host.querySelector('#iniVal'); if(v) v.textContent=iniTexto(pc); });
  const bini=host.querySelector('#btnIni');
  if(bini) bini.onclick=()=>{
    const r=iniciativaDe(pc), d=rolarDado(20), total=d+r.val;      // (1 a 20: rolarDado, não randInt, que conta do zero)
    pc.ultRol={k:'INI', valor:r.val, base:false, total, texto:'1d20 '+(r.val<0?'− ':'+ ')+Math.abs(r.val), dado:20, bruto:d};
    logar({tipo:'livre', quem:pc.nome, pc:pc.id, det:'Iniciativa · 1d20 ('+d+') '+(r.val<0?'− ':'+ ')+Math.abs(r.val), total, dd:[[20,d]]});
    render();
  };
  // valor atual de cada recurso (HP, SP...): vazio = no começo da barra (cheia, se ela não tem um começo próprio)
  const encher=id=>patch(()=>{ if(pc.estado&&pc.estado.rec) delete pc.estado.rec[id]; });
  // (o botão de voltar ao começo aparece assim que há um valor anotado, sem redesenhar a ficha: quem está digitando não perde o campo)
  const mostrarEncher=i=>{
    const box=i.closest('.atual'), id=i.dataset.resatual;
    if(!box) return;
    const r=(calcular(pc).recursos||[]).find(x=>x.id===id); if(!r) return;
    box.classList.toggle('neg', atualDoRecurso(pc,r)<0);
    let b=box.querySelector('[data-rescheio]');
    if(!temAtual(pc,r)){ if(b) b.remove(); return; }
    if(b) return;
    b=document.createElement('button'); b.className='mini'; b.dataset.rescheio=id;
    const comeco=r.inicio!=null && r.inicio!==arred(r.val);
    b.textContent=comeco? 'Voltar a '+fmt(r.inicio).replace('-','−') : 'Encher';
    b.title=comeco? 'Voltar ao valor em que a barra começa' : 'Voltar ao máximo';
    b.onclick=()=>encher(id);
    box.querySelector('.de').after(b);
  };
  host.querySelectorAll('[data-resatual]').forEach(i=>i.oninput=e=>patchLeve(()=>{
    const est=pc.estado||(pc.estado={}); const rec=est.rec||(est.rec={});
    const v=e.target.value.trim(); if(v===''||!isFinite(+v)) delete rec[i.dataset.resatual]; else rec[i.dataset.resatual]=+v;
    pintarBarrinhas(host, pc); mostrarEncher(i);
  }));
  // (ao sair do campo: um valor abaixo do que a barra aguenta fica no piso dela)
  host.querySelectorAll('[data-resatual]').forEach(i=>i.onchange=()=>{
    const r=(calcular(pc).recursos||[]).find(x=>x.id===i.dataset.resatual), rec=pc.estado&&pc.estado.rec, v=rec? rec[i.dataset.resatual] : null;
    if(!r||v==null||!isFinite(v)) return;
    const piso=r.min<0? r.min : 0;
    if(v<piso){ rec[r.id]=piso; i.value=piso; save(); pintarBarrinhas(host, pc); mostrarEncher(i); toast(r.nome+' não desce de '+fmt(piso).replace('-','−')+'.'); }
  });
  host.querySelectorAll('[data-rescheio]').forEach(b=>b.onclick=()=>encher(b.dataset.rescheio));
  const rfx=host.querySelector('#rolFixa');
  if(rfx) rfx.oninput=e=>patchLeve(()=>{pc.rol.fixa=Math.max(0,+e.target.value||0)});
  const rfo=host.querySelector('#rolFonte');
  if(rfo) rfo.onchange=e=>patch(()=>{pc.rol.fonte=e.target.value});
  host.querySelectorAll('[data-rolar]').forEach(b=>b.onclick=()=>rolarNaFicha(pc,b.dataset.rolar));
  const bdis=host.querySelector('#btnDisputa');
  if(bdis) bdis.onclick=()=>abrirDisputa(pc);
  host.querySelector('#f_grupo').onchange=e=>{
    const bloco=FichasMesa.blocoDe(pc);
    if(e.target.value==='__novo__'){
      // o grupo novo é do bloco em que a ficha está (a campanha dela, ou o mundo)
      const g=prompt('Nome do novo grupo:','');
      if(g && g.trim()){ fixarGrupos(); const l=gruposDe(bloco); if(!l.includes(g.trim())) l.push(g.trim()); pc.grupo=g.trim(); }
      save(); render(); return;
    }
    const alvo=lerOpcaoDeGrupo(e.target.value, bloco);
    if(alvo.camp===bloco){ pc.grupo=alvo.g; save(); render(); return; }
    // escolheu um grupo de outro bloco: a ficha passa para aquela campanha (ou para o mundo) — dá para desfazer
    const antes={camp:pc._camp||null, grupo:pc.grupo||''};
    pc._camp=alvo.camp||null; pc.grupo=alvo.g;
    FichasMesa.garantirRelacoes(); fixarGrupos(); save(); render();
    FichasExtras.aviso(pc.nome+' passou para '+(pc._camp? 'a campanha '+FichasMesa.nomeDaCampanha(pc._camp) : 'o mundo (aparece em todas as campanhas)')+'.', 'Desfazer', ()=>{ pc._camp=antes.camp; pc.grupo=antes.grupo; fixarGrupos(); save(); render(); }, 9000);
    FichasMesa.avisarDeFora([pc]);
  };
  host.querySelector('#f_tags').oninput=e=>{
    pc.tags=e.target.value.split(',').map(t=>t.trim()).filter(Boolean); save(); renderLista();
  };
  const ftier=host.querySelector('#f_tier');             // (ficha de jogador não mostra o tier)
  if(ftier) ftier.onchange=e=>patch(()=>pc.tier=e.target.value);
  host.querySelector('#f_level').onchange=e=>patch(()=>pc.level=+e.target.value);
  const nt=host.querySelector('#f_notas');
  if(nt) nt.oninput=e=>patchLeve(()=>pc.notas=e.target.value);
  host.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{S.abaFicha=b.dataset.sub; save(); renderFicha()});
  if((S.abaFicha||'estaque')==='skills') ligarSkills(pc,host);
  host.querySelectorAll('[data-est]').forEach(i=>i.oninput=e=>patchLeve(()=>{
    pc.estaque[e.target.dataset.est]=e.target.value;}));
  host.querySelectorAll('[data-habadd]').forEach(b=>b.onclick=()=>patch(()=>
    pc.habilidades.push({id:uid(), nome:'', desc:'', tipo:'Ativo'})));
  host.querySelectorAll('[data-habtipo]').forEach(sl=>sl.onchange=e=>patch(()=>{
    const h=pc.habilidades.find(x=>x.id===e.target.dataset.habtipo); if(h) h.tipo=e.target.value;}));
  host.querySelectorAll('[data-habdel]').forEach(b=>b.onclick=()=>patch(()=>{
    pc.habilidades=pc.habilidades.filter(x=>x.id!==b.dataset.habdel);}));
  host.querySelectorAll('[data-habnome]').forEach(i=>i.oninput=e=>{
    const h=pc.habilidades.find(x=>x.id===e.target.dataset.habnome); if(h){h.nome=e.target.value; save();}});
  host.querySelectorAll('[data-habdesc]').forEach(i=>i.oninput=e=>{
    const h=pc.habilidades.find(x=>x.id===e.target.dataset.habdesc); if(h){h.desc=e.target.value; save();}});

  host.querySelectorAll('[data-tier]').forEach(s=>s.onchange=e=>patch(()=>pc.tiers[e.target.dataset.tier]=e.target.value));
  host.querySelectorAll('[data-defesa]').forEach(i=>i.onchange=e=>patch(()=>{
    pc.defesas[e.target.dataset.defesa]=+e.target.value||0; }));
  host.querySelectorAll('[data-pct]').forEach(i=>i.onchange=e=>patch(()=>{pc.pctProprio[e.target.dataset.pct]=+e.target.value||0}));

  host.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='dup'){ const cp=JSON.parse(JSON.stringify(pc)); cp.id=uid(); cp.nome=pc.nome+' (cópia)';
      // (as barras ficam com o mesmo id: os itens e as poções da cópia apontam para elas. A cópia nasce com as barras no começo.)
      cp.itens.forEach(i=>i.id=uid()); if(cp.estado){ delete cp.estado.rec; delete cp.estado.sob; delete cp.estado.fer; delete cp.estado.mis; }   // (e sem os ferimentos e as missões do original)
      S.personagens.push(FichasMesa.nascer(cp)); S.sel=cp.id; save(); render(); toast('Personagem duplicado'); }
    if(a==='del'){ if(confirm('Excluir "'+pc.nome+'"? Não tem como desfazer.')){
        S.personagens=S.personagens.filter(p=>p.id!==pc.id); S.sel=S.personagens[0]?.id||null; FichasMesa.esquecer(pc.id); save(); render(); toast('Personagem excluído'); } }
    if(a==='pct'){ patch(()=>{ pc.pctProprio = pc.pctProprio? null : {...S.cfg.pct}; }); }
    if(a==='pctoff'){ patch(()=>pc.pctProprio=null); }
    if(a==='addres'){ patch(()=>pc.recursos.push({id:uid(),nome:'Novo recurso',fml:''})); }
    if(a==='additem'){ const b0={}; ATRIBS.forEach(x=>b0[x.k]=0);
      patch(()=>pc.itens.push({id:uid(),nome:'',equipado:true,bonus:b0})); }
  });

  const acharPd=id=>pc.poderes.find(x=>x.id===id);
  const limitar=pw=>{ pw.atual=Math.max(0, pw.max>0? Math.min(pw.atual,+pw.max) : pw.atual); };
  host.querySelectorAll('[data-pdadd]').forEach(b=>b.onclick=()=>patch(()=>
    pc.poderes.push({id:uid(), nome:'', atual:0, max:1})));
  host.querySelectorAll('[data-pdall]').forEach(b=>b.onclick=()=>patch(()=>
    pc.poderes.forEach(pw=>{ if(pw.max>0) pw.atual=+pw.max; })));
  host.querySelectorAll('[data-pdstep]').forEach(b=>b.onclick=()=>{
    const [id,d]=b.dataset.pdstep.split('|'); const pw=acharPd(id); if(!pw)return;
    pw.atual+= +d; limitar(pw); patch(()=>{});
  });
  host.querySelectorAll('[data-pip]').forEach(b=>b.onclick=()=>{
    const [id,i]=b.dataset.pip.split('|'); const pw=acharPd(id); if(!pw)return;
    const n=+i;
    pw.atual = (pw.atual===n)? n-1 : n;   // clicar no último aceso devolve uma unidade
    limitar(pw); patch(()=>{});
  });
  host.querySelectorAll('[data-pdnome]').forEach(i=>i.oninput=e=>{
    const pw=acharPd(e.target.dataset.pdnome); if(pw){pw.nome=e.target.value; save();}});
  host.querySelectorAll('[data-pdmax]').forEach(i=>i.onchange=e=>{
    const pw=acharPd(e.target.dataset.pdmax); if(pw){pw.max=Math.max(0,+e.target.value||0); limitar(pw); patch(()=>{});}});
  host.querySelectorAll('[data-pddel]').forEach(b=>b.onclick=()=>patch(()=>{
    pc.poderes=pc.poderes.filter(x=>x.id!==b.dataset.pddel)}));

  host.querySelectorAll('[data-resnome]').forEach(i=>i.oninput=e=>{
    const r=pc.recursos.find(x=>x.id===e.target.dataset.resnome); if(r){r.nome=e.target.value; save();}});
  host.querySelectorAll('[data-resfml]').forEach(i=>{
    i.oninput=e=>{ const r=pc.recursos.find(x=>x.id===e.target.dataset.resfml); if(!r)return;
      r.fml=e.target.value; save(); atualizaRecurso(e.target,r,pc); };
  });
  host.querySelectorAll('[data-resdel]').forEach(b=>b.onclick=()=>patch(()=>{
    pc.recursos=pc.recursos.filter(x=>x.id!==b.dataset.resdel)}));

  host.querySelectorAll('[data-itemon]').forEach(i=>i.onchange=e=>patch(()=>{
    const it=pc.itens.find(x=>x.id===e.target.dataset.itemon); if(it) it.equipado=e.target.checked;}));
  host.querySelectorAll('[data-itemnome]').forEach(i=>i.oninput=e=>{
    const it=pc.itens.find(x=>x.id===e.target.dataset.itemnome); if(it){it.nome=e.target.value; save();}});
  host.querySelectorAll('[data-itembon]').forEach(i=>i.onchange=e=>{
    const [id,k]=e.target.dataset.itembon.split('|');
    patch(()=>{const it=pc.itens.find(x=>x.id===id); if(it){it.bonus=it.bonus||{}; it.bonus[k]=+e.target.value||0;}});
  });
  host.querySelectorAll('[data-itemdel]').forEach(b=>b.onclick=()=>patch(()=>{
    pc.itens=pc.itens.filter(x=>x.id!==b.dataset.itemdel)}));

  host.querySelectorAll('[data-copy]').forEach(c=>c.onclick=()=>{
    const t=c.dataset.copy;
    navigator.clipboard?.writeText(t).then(()=>toast('Copiado: '+t),()=>toast(t));
  });
}
/* atualiza o número de um recurso enquanto digita, sem re-renderizar tudo */
function atualizaRecurso(input,r,pc){
  const card=input.closest('.rescard');
  const c=calcular(pc);
  const alvo=c.recursos.find(x=>x.id===r.id);
  const val=card.querySelector('.val');
  const old=card.querySelector('.fmlerr'); if(old) old.remove();
  if(alvo.err){ val.className='val err'; val.textContent='erro';
    const d=document.createElement('div'); d.className='fmlerr'; d.textContent=alvo.err; card.appendChild(d);
  }else{ val.className='val'; val.textContent = alvo.val==null?'—':fmt(alvo.val); }
}

function novaSituacao(nome){
  return {id:uid(), nome:nome||'Nova situação', modo:'ranking', alvo:30, participantes:[]};
}
function valorDoAtributo(pc,atr,fonte){
  const c=calcular(pc);
  if(c.defEsp && Object.prototype.hasOwnProperty.call(c.defEsp,atr)) return c.defEsp[atr];   // defesa específica
  if(ehDefesa(atr))   return c.def[atr];          // defesa: manual + equipamento
  if(ehDerivado(atr)) return c.der[atr];          // derivados têm valor único
  return fonte==='base'? c.base[atr] : c.tot[atr];
}
