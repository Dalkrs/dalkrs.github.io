<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fichas · Tiny Cats</title>
<script>
/* aplica o tema antes de desenhar a página, para não piscar branco */
(function(){
  var t='auto';
  try{ t = localStorage.getItem('urgm_calc_tema') || 'auto'; }catch(e){}
  var escuro = t==='pedra' || (t==='auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-tema', escuro ? 'pedra' : 'claro');
  document.documentElement.setAttribute('data-tema-escolha', t);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root, :root[data-tema="claro"]{
  --ink:#111c2e; --ink-2:#2c3d57; --ink-soft:#6b7b95; --ink-fraco:#a9b5c7;
  --paper:#e7ecf2; --grid:rgba(17,28,46,.045);
  --panel:#fbfcfe; --campo:#fff; --campo-sut:#eef2f7; --zebra:#f6f8fb;
  --hover:#f0f4f9; --sel:#eaf0f7;
  --line:#c9d3e0; --line-2:#dde4ee; --linha-sut:#eef2f7;
  --forte:#111c2e; --forte-txt:#fff; --forte-hover:#23334f;
  --topo:#111c2e; --topo-txt:#fff; --topo-sub:#93a4c0; --topo-hover:#1a2739;
  --topo-borda:#3d4f6b; --topo-btn:#cdd8e8;
  --topo-perigo:#f0b3b5; --topo-perigo-borda:#6b3a3d; --topo-perigo-hover:#4a2326; --topo-perigo-b2:#9c4a4e;
  --brass:#9a7220; --brass-soft:#e8dcbe; --brass-fundo:#fdf9ee; --brass-ink:#7d5d19; --brass-luz:#d9bb6a;
  --teal:#1c6f6a; --teal-fundo:#eaf5f4; --teal-borda:#a9cfcc;
  --rubric:#9a2f33; --rubric-fundo:#fbeff0; --rubric-borda:#e0bfc0; --rubric-forte:#7e2427; --rubric-off:#e6cfd0;
  --flor-petala:#f2ecd9; --flor-borda:#e0d0a6; --radar:#dbe2ec; --radar-miolo:rgba(28,111,106,.16);
  --roxo:#6b4d8f; --roxo-fundo:#f3eef8; --roxo-borda:#d6c6e6;
  --a-for:#C0392B; --a-agi:#A87609; --a-vit:#2F7A55; --a-can:#6b4d8f; --a-des:#5d6e86;
  --a-for-f:#fbefed; --a-agi-f:#fbf4e3; --a-vit-f:#ecf6f1; --a-can-f:#f3eef8; --a-des-f:#eef1f5;
  --sombra:0 8px 22px rgba(17,28,46,.22);
  --r:4px;
  color-scheme:light;
}
/* modo escuro — pedra e ouro, a mesma paleta do app de árvores */
:root[data-tema="pedra"]{
  --ink:#E9E3D6; --ink-2:rgba(233,227,214,.76); --ink-soft:rgba(233,227,214,.52); --ink-fraco:rgba(233,227,214,.3);
  --paper:#0B0E13; --grid:rgba(233,227,214,.04);
  --panel:#111722; --campo:#19202C; --campo-sut:#1b2330; --zebra:#161d28;
  --hover:#1d2634; --sel:#232e40;
  --line:rgba(233,227,214,.18); --line-2:rgba(233,227,214,.14); --linha-sut:rgba(233,227,214,.09);
  --forte:#D9A441; --forte-txt:#0B0E13; --forte-hover:#e6b559;
  --topo:#070a0e; --topo-txt:#E9E3D6; --topo-sub:rgba(233,227,214,.5); --topo-hover:#161d28;
  --topo-borda:rgba(233,227,214,.22); --topo-btn:rgba(233,227,214,.82);
  --topo-perigo:#E79AA3; --topo-perigo-borda:rgba(231,154,163,.34); --topo-perigo-hover:#3b1c20; --topo-perigo-b2:#8C2F39;
  --brass:#D9A441; --brass-soft:rgba(217,164,65,.42); --brass-fundo:rgba(217,164,65,.1); --brass-ink:#E2C07C; --brass-luz:#D9A441;
  --teal:#6FBF9F; --teal-fundo:rgba(111,191,159,.13); --teal-borda:rgba(111,191,159,.42);
  --rubric:#E79AA3; --rubric-fundo:rgba(140,47,57,.2); --rubric-borda:rgba(231,154,163,.36); --rubric-forte:#8C2F39; --rubric-off:rgba(140,47,57,.45);
  --flor-petala:#1a212e; --flor-borda:rgba(217,164,65,.32); --radar:rgba(233,227,214,.13); --radar-miolo:rgba(111,191,159,.2);
  --roxo:#B07CC6; --roxo-fundo:rgba(176,124,198,.14); --roxo-borda:rgba(176,124,198,.4);
  --a-for:#E0705E; --a-agi:#E3B341; --a-vit:#6FBF9F; --a-can:#B07CC6; --a-des:#9FAFC4;
  --a-for-f:rgba(224,112,94,.13); --a-agi-f:rgba(227,179,65,.13); --a-vit-f:rgba(111,191,159,.13);
  --a-can-f:rgba(176,124,198,.13); --a-des-f:rgba(159,175,196,.13);
  --sombra:0 12px 32px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Inter Tight",-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:15px;line-height:1.5;
  background-image:linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:34px 100%;
  transition:background-color .18s,color .18s;
}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
.mono,input[type=number],.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}

/* ---------- topbar ---------- */
#topbar{position:sticky;top:0;z-index:30;transition:transform .24s ease;will-change:transform;
        box-shadow:0 1px 0 rgba(0,0,0,.2)}
#topbar.esconde{transform:translateY(-100%)}

header.top{
  background:var(--topo);color:var(--topo-txt);padding:14px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  border-bottom:3px solid var(--brass);
}
header.top .flor{flex:0 0 auto}
header.top h1{font-size:19px;color:var(--topo-txt);line-height:1.1}
header.top .sub{font-size:11.5px;color:var(--topo-sub);font-family:"IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
header.top .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- buttons / fields ---------- */
button{
  font-family:inherit;font-size:13px;cursor:pointer;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);
  border-radius:var(--r);padding:7px 11px;transition:.14s;
}
button:hover{border-color:var(--ink-2);background:var(--campo)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
button.ghost{background:transparent;color:var(--topo-btn);border-color:var(--topo-borda)}
button.ghost:hover{background:var(--topo-hover);color:var(--topo-txt);border-color:var(--topo-btn)}
button.primary{background:var(--forte);color:var(--forte-txt);border-color:var(--forte)}
button.primary:hover{background:var(--forte-hover);border-color:var(--forte-hover)}
button.danger{color:var(--rubric);border-color:var(--rubric-borda)}
button.danger:hover{background:var(--rubric-fundo);border-color:var(--rubric)}
button.mini{padding:3px 7px;font-size:11.5px}
input,select,textarea{
  font-family:inherit;font-size:14px;color:var(--ink);background:var(--campo);
  border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;width:100%;
}
textarea{resize:vertical}
label.f{display:block}
label.f > span{display:block;margin-bottom:3px}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px;display:grid;grid-template-columns:246px 1fr;gap:18px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.panel > .hd{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.panel > .bd{padding:12px}

/* ---------- sidebar ---------- */
.roster{position:sticky;top:calc(var(--topH, 96px) + 12px)}
.roster ul{list-style:none;margin:0;padding:0}
#lista{max-height:56vh;overflow:auto}
.roster button.pc{
  width:100%;text-align:left;border:0;border-left:3px solid transparent;background:transparent;
  border-radius:0;padding:7px 10px 7px 4px;display:block;
}
.roster button.pc:hover{background:var(--hover)}
.roster button.pc.on{background:var(--sel);border-left-color:var(--brass)}
.roster .nm{font-weight:500;font-size:14px;display:block;line-height:1.25}
.roster .mt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase}
.searchrow{padding:8px 10px;border-bottom:1px solid var(--line)}

/* blocos por campanha (só numa mesa com campanhas): o da campanha em vista, o do mundo e os das outras */
.bloco{border-bottom:1px solid var(--line)}
.bloco:last-child{border-bottom:0}
.blocohd{display:flex;align-items:center;gap:6px;padding:7px 8px;background:var(--campo);border-bottom:1px solid var(--line)}
.bloco.vista>.blocohd{box-shadow:inset 3px 0 0 var(--brass)}
.blocohd .caret{border:0;background:transparent;padding:0 2px;color:var(--ink-soft);font-size:11px;border-radius:0}
.blocohd .bloconome{font-weight:600;font-size:13px;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blocohd .cnt{font-size:10.5px;color:var(--ink-soft)}
.blocohd .blocotag{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--line);border-radius:10px;padding:1px 6px;white-space:nowrap}
.blocohd .blocotag.vis{color:var(--brass-ink);border-color:var(--brass-soft);background:var(--brass-fundo)}
.blocoitens{list-style:none;margin:0;padding:0}
.blocoitens>.vazio{display:block}
.grab.fixo{cursor:default;width:17px;padding:0}
.pgops{display:grid;gap:6px}
.pgop{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;font-size:14px}
.pgop input{width:auto;flex:none;margin:0;padding:0}      /* (os campos desta página ocupam a largura toda; a bolinha de escolher, não) */
.pgop:has(input:checked){border-color:var(--brass);background:var(--brass-fundo)}
/* seções por grupo */
.sec{border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sechd{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--campo-sut)}
.sechd .caret{border:0;background:transparent;padding:0 2px;color:var(--ink-soft);font-size:11px;border-radius:0}
.sechd .secnome{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.sechd .cnt{font-size:10.5px;color:var(--ink-soft)}
.sechd .secacts{margin-left:auto;display:flex;gap:2px;opacity:0;transition:.12s}
.sec:hover .sechd .secacts{opacity:1}
.sechd .secacts button{padding:1px 5px;font-size:10.5px;line-height:1.4}
.secitens{min-height:8px}
/* (lote 16) os inativos de cada grupo, embaixo, recolhidos */
.inat{border-top:1px dashed var(--linha-sut)}
.inathd{display:flex;align-items:center;gap:6px;width:100%;border:0;border-radius:0;background:transparent;padding:3px 8px 3px 26px;text-align:left;color:var(--ink-soft);cursor:pointer}
.inathd .caret{font-size:10px;width:10px}
.inathd .inatnome{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-style:italic}
.inathd .cnt{font-size:10px}
.inathd:hover{color:var(--ink-2);background:var(--campo-sut)}
.inat.zero .inathd{cursor:default;opacity:.6}
.inat.zero .inathd .caret{visibility:hidden}
.inathd.alvo{background:var(--brass-fundo);color:var(--brass-ink);outline:1px dashed var(--brass);outline-offset:-2px;opacity:1}
.secitens.inativas{background:var(--zebra)}
.secitens.inativas .pcrow{opacity:.85}
.pcrow{display:flex;align-items:stretch;border-bottom:1px solid var(--linha-sut)}
.pcrow:last-child{border-bottom:0}
.pcrow.arrastando{opacity:.35}
.pcrow.fantasma{background:var(--campo);border:1px solid var(--brass);box-shadow:var(--sombra);border-radius:var(--r);opacity:.96}
.grab{display:flex;align-items:center;padding:0 4px 0 6px;color:var(--ink-fraco);cursor:grab;
  touch-action:none;user-select:none;font-size:13px;letter-spacing:-2px}
.grab:hover{color:var(--brass)}
body.arrastando-agora{cursor:grabbing;user-select:none}
.vazio{padding:8px 12px;font-size:11.5px;font-style:italic}
.linhatags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;align-items:center}
.tagbar{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.tag{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.04em;padding:2px 6px;
  border:1px solid var(--line);border-radius:10px;background:var(--campo);color:var(--ink-2);line-height:1.5}
.tag.on{background:var(--forte);color:var(--forte-txt);border-color:var(--forte)}
.tag.limpar{color:var(--rubric);border-color:var(--rubric-borda)}
.mini-tag{border-color:var(--brass-soft);background:var(--brass-fundo);color:var(--brass-ink)}
.mini-tag.inativo{border-color:var(--line);background:var(--campo-sut);color:var(--ink-soft);font-style:italic}
.idcard2{display:grid;grid-template-columns:minmax(150px,.7fr) 1fr;gap:10px;margin-top:10px}
@media (max-width:900px){.idcard2{grid-template-columns:1fr}}

/* ---------- ficha ---------- */
.idcard{display:grid;grid-template-columns:1.5fr 1fr repeat(3,minmax(84px,.62fr));gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}

table.attr{width:100%;border-collapse:collapse;font-size:14px}
table.attr th{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:500;text-align:right;padding:0 6px 6px;border-bottom:1px solid var(--line)
}
table.attr th:first-child{text-align:left}
table.attr td{padding:7px 6px;border-bottom:1px solid var(--linha-sut);text-align:right;vertical-align:middle}
table.attr td:first-child{text-align:left}
table.attr tr:last-child td{border-bottom:0}
.aname{font-weight:500}
.tsel{width:62px;padding:3px 4px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;text-align:center}
.vbase{color:var(--ink-soft);font-size:13.5px}
.vequip{color:var(--teal);font-size:13px}
.vtot{font-weight:600;font-size:16px}
.delta{font-size:11.5px;font-family:"IBM Plex Mono",monospace}
.delta.up{color:var(--teal)}
.delta.zero{color:var(--ink-fraco)}
.pctnote{font-size:11.5px;color:var(--ink-soft);margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.warn{color:var(--rubric)}

/* flower */
.florwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-soft);font-family:"IBM Plex Mono",monospace}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}

/* recursos */
.res{display:grid;gap:10px}
.rescard{border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--campo)}
.rescard .top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.rescard .val{font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:600;margin-left:auto;line-height:1}
.rescard .val.err{font-size:13px;color:var(--rubric);font-weight:500}
.darv{margin-left:5px;font-size:10.5px;color:var(--teal);font-weight:500;white-space:nowrap}
.inirow{display:flex;align-items:end;gap:10px;margin-top:10px;flex-wrap:wrap}
.inirow .f{flex:1;min-width:150px}
.inirow .inival{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-soft);padding-bottom:7px;white-space:nowrap}
.rescard .atual{display:flex;align-items:center;gap:8px;margin:-2px 0 8px}
.rescard .atual input{width:84px;font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600}
.rescard .atual .de{color:var(--ink-soft);font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.rescard .atual{flex-wrap:wrap}
.rescard .atual .sobre{margin-left:auto;display:inline-flex;align-items:center;gap:8px}
.rescard .atual .sobre input{width:70px}
.rescard .atual .sobre.tem .eyebrow{color:var(--teal)}
/* dentro de uma mesa do site */
.idmesa{display:flex;flex-wrap:wrap;align-items:end;gap:14px;margin:0 0 12px;padding:10px 12px;border:1px dashed var(--brass-soft);border-radius:var(--r);background:var(--brass-fundo)}
.idmesa .f{min-width:220px}
.idmesa .chk{display:flex;align-items:center;gap:7px;padding-bottom:7px;font-size:13px;flex:1 1 240px}
.so-consulta{margin:0 0 12px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--campo-sut);color:var(--ink-2);font-size:13px}
.mesa-oferta{margin:0 0 10px;padding:10px;border:1px dashed var(--brass-soft);border-radius:var(--r);background:var(--brass-fundo);font-size:13px}
.mesa-oferta p{margin:0 0 8px}
.mesa-falha{margin:14px;padding:12px 14px;border:1px solid var(--rubric-borda);border-radius:var(--r);background:var(--rubric-fundo)}
.papel-jogador #btnCfg,.papel-jogador #btnFlush,.papel-jogador #btnImport,.papel-jogador #btnGrupo,.papel-jogador nav.tabs button[data-tab="mesa"],.papel-jogador .grab{display:none}
.rescard input.fml{font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.fmlerr{color:var(--rubric);font-size:11.5px;margin-top:4px;font-family:"IBM Plex Mono",monospace}
.vars{font-size:11.5px;color:var(--ink-soft);line-height:1.7}
.vars code{background:var(--campo-sut);border:1px solid var(--line-2);border-radius:3px;padding:1px 4px;font-family:"IBM Plex Mono",monospace;font-size:11px;cursor:pointer}
.vars code:hover{background:var(--brass-soft);border-color:var(--brass)}

/* itens: os equipamentos em cartões (lote 6) — a chave, o nome, só os bônus que o item tem; "Editar" abre os números */
/* o pet (lote 6): no elenco, logo embaixo do dono, recuado e com a pata; no alto da ficha, "pet de …" */
.pcrow.pet .pata,.petde .pata{color:var(--brass);vertical-align:-1px}
.pcrow.embaixo{margin-left:18px;position:relative}
.pcrow.embaixo::before{content:"";position:absolute;left:-9px;top:-4px;height:22px;width:8px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);border-bottom-left-radius:5px}
.petde{display:inline-flex;align-items:center;gap:5px;margin-left:10px;font-size:12px;color:var(--ink-soft)}
.linkbtn{border:0;background:transparent;padding:0;color:var(--teal);font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.linkbtn:hover{color:var(--ink)}
.petcontrola{display:block;padding:6px 0}
.itcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.itcard{border:1px solid var(--line);border-radius:6px;background:var(--campo);padding:8px 10px 9px;display:grid;gap:6px;min-width:0}
.itcard.aberto{grid-column:1/-1}
.itcard.guardado{background:var(--zebra)}
.itcard.guardado .itnome,.itcard.guardado .itbon,.itcard.guardado .itfxv,.itcard.guardado .ittroca{opacity:.55}
.itcard.rel{border-color:var(--brass);background:linear-gradient(180deg,var(--brass-fundo),var(--campo) 75%);box-shadow:inset 0 0 0 1px var(--brass-soft)}
.itcard.rel.guardado{background:var(--brass-fundo)}
.ittopo{display:flex;align-items:center;gap:8px;min-width:0}
.itnome{flex:1;min-width:70px;font-weight:600;border-color:transparent;background:transparent;padding:4px 6px}
.itnome:hover{border-color:var(--line-2)}
.itnome:focus{border-color:var(--line);background:var(--campo)}
.itbts{display:flex;gap:4px;margin-left:auto;flex:none}
.itchave{position:relative;display:inline-flex;flex:none;cursor:pointer}
.itchave input{position:absolute;inset:0;z-index:1;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.itsw{width:30px;height:17px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;pointer-events:none}
.itsw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--campo);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.itchave input:checked + .itsw{background:var(--teal)}
.itchave input:checked + .itsw::after{transform:translateX(13px)}
.itchave input:focus-visible + .itsw{outline:2px solid var(--teal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.itsw,.itsw::after{transition:none}}
.itrel{display:inline-flex;align-items:center;gap:4px;flex:none;color:var(--brass-ink);font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.itrel .icorel{color:var(--brass)}
.ittroca{display:inline-flex;align-items:center;gap:4px;flex:0 1 auto;min-width:0;max-width:150px;padding:1px 7px;border:1px solid var(--line-2);border-radius:999px;font-size:11px;color:var(--ink-2);background:var(--campo-sut);white-space:nowrap}
.ittroca span{overflow:hidden;text-overflow:ellipsis}
.ittroca svg{flex:none}
.itbon{display:flex;flex-wrap:wrap;gap:3px 6px;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:12px;padding-left:38px}
.itb{color:var(--teal);font-weight:600;white-space:nowrap}
.itb.neg{color:var(--rubric)}
.itsep{color:var(--ink-fraco)}
.itfxv{font-size:12.5px;color:var(--ink-2);white-space:pre-wrap;border-top:1px dashed var(--line-2);padding-top:5px}
.ited{display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:9px}
.itgrupos{display:flex;flex-wrap:wrap;gap:10px 22px}
.itgrupo{display:grid;gap:4px;align-content:start}
.itnums{display:flex;flex-wrap:wrap;gap:6px}
.itn{display:grid;gap:2px;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;color:var(--ink-soft)}
.itn input{width:60px;padding:4px;text-align:right}
.itn.der input{border-color:var(--brass-soft);background:var(--brass-fundo)}
.itn.def input{border-color:var(--teal-borda);background:var(--teal-fundo)}
.ited textarea{width:100%;min-height:30px;height:30px;resize:none;overflow:hidden;padding:5px 8px;font-size:12.5px;line-height:1.4;color:var(--ink-2);background:var(--campo-sut);border-color:var(--line-2)}
.itopc{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:end}
.itopc .chk{display:inline-flex;align-items:center;gap:7px;font-size:13px;padding-bottom:8px}
.itopc .chk input{width:auto;margin:0}
.ittrocaf{min-width:210px}
.itreqf{min-width:230px}
.itreqf > select{width:100%}
.itreq{max-width:220px}
/* (lote 7) o "Só funciona com…" numa linha só dele (com vários itens, o nome do cartão não fica espremido) */
.itreqlinha{display:flex;padding-left:38px;min-width:0}
.itreqlinha .itreq{max-width:100%}
.itcard.comalca .itbon,.itcard.comalca .itreqlinha{padding-left:64px}
.itreq.falta{border-color:var(--rubric);color:var(--rubric)}
.itcard.semfx .itbon,.itcard.semfx .itfxv{opacity:.55}
.ittotal{display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid var(--line-2);font-family:"IBM Plex Mono",monospace;font-size:12px}
.ittotal .eyebrow{margin-right:4px}
.itdobro{margin-top:6px;color:var(--brass-ink)}
/* (lote 7) os equipamentos por tipo: os filtros, as seções, a alça de arrastar e os níveis */
.itacoes{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.itfiltros{display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center;margin-bottom:12px}
.itf{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border:1px solid var(--line-2);border-radius:999px;background:var(--campo-sut);color:var(--ink-2);font-size:12px;line-height:1.5}
.itf:hover{border-color:var(--line);color:var(--ink)}
.itf.on{background:var(--teal-fundo);border-color:var(--teal-borda);color:var(--ink);font-weight:600}
.itf .mk{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-soft);font-weight:500}
.itfsep{width:1px;height:18px;background:var(--line-2);margin:0 2px}
.itbusca{flex:1 1 150px;max-width:230px;padding:4px 9px;font-size:12.5px}
.itsec + .itsec{margin-top:12px}
.itsech{display:flex;align-items:baseline;gap:8px;width:100%;padding:4px 4px 6px;margin:0 0 8px;border:0;border-bottom:1px solid var(--line-2);border-radius:0;background:transparent;color:var(--ink);text-align:left;font-weight:400}
.itsech:hover{background:var(--hover)}
.itseta{width:12px;flex:none;color:var(--ink-soft);font-size:11px}
.itsecn{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.itsecq{font-size:12px;color:var(--ink-soft)}
.itsec.fechada:not(.filtrando) .itcards{display:none}
.itsec.fechada:not(.filtrando) .itsech{margin-bottom:0}
.itsec.filtrando .itseta{visibility:hidden}
.itsec.alvo .itsech{background:var(--teal-fundo)}
.itarr{flex:none;display:inline-flex;align-items:center;justify-content:center;width:18px;height:24px;padding:0;border:0;border-radius:4px;background:transparent;color:var(--ink-fraco);cursor:grab;touch-action:none}
.itarr:hover{color:var(--ink-2);background:var(--hover)}
.itarr:active{cursor:grabbing}
.itcard.arrastando{opacity:.45;outline:2px dashed var(--teal-borda);outline-offset:2px}
.itlinha{position:fixed;z-index:60;background:var(--teal);border-radius:2px;pointer-events:none}
.itnv{display:inline-flex;align-items:center;flex:none;border:1px solid var(--brass-soft);border-radius:999px;background:var(--brass-fundo);padding:0 1px;font-family:"IBM Plex Mono",monospace;font-size:11px}
.itnv b{padding:0 3px;color:var(--brass-ink);font-weight:600;white-space:nowrap}
.itnvb{border:0;background:transparent;padding:1px 6px;color:var(--brass-ink);font-size:11px;line-height:1.4;border-radius:999px}
.itnvb:hover:not(:disabled){background:var(--hover)}
.itnvb:disabled{opacity:.3;cursor:default}
.itcab{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end}
.ittipof{min-width:170px}
.itnvbloco{display:grid;gap:6px}
.itniveis{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.itnvaba{display:inline-flex;align-items:baseline;gap:4px;padding:3px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--campo-sut);font-size:12px;color:var(--ink-2)}
.itnvaba.on{border-color:var(--brass);background:var(--brass-fundo);color:var(--ink);font-weight:600}
.itagora{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);font-weight:600}
.itnvacoes{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.itreqs{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 5px}
.itreqc.fora{border-color:var(--line-2);background:var(--campo-sut)}
.itreqnv{padding:1px 4px;font-size:11.5px;border-radius:6px;max-width:140px}
.itjanela .sheet .bd{display:grid;gap:4px}
.itsepls{display:grid;gap:6px;max-height:min(60vh,520px);overflow:auto;padding:2px}
.itsepl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.itsepn{flex:1 1 200px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.itsepl select{flex:0 1 190px}
.ittiposl{display:grid;gap:6px;margin-bottom:10px}
.ittipol{display:flex;align-items:center;gap:8px}
.ittipol input{flex:1;min-width:0}
.ittipon{display:flex;gap:8px;align-items:center}
.ittipon input{flex:1;min-width:0}
.itjerro{color:var(--rubric)}
.off{opacity:.42}

/* ---- regras novas: abas do painel de atributos, defesas, opções das barras, itens, temporários e bolsas ---- */
.abasatr{display:inline-flex;gap:2px;margin:-9px 0 -10px -12px;align-self:stretch}
.abasatr .sub{border:0;border-radius:0;background:transparent;color:var(--ink-soft);padding:9px 12px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;border-bottom:2px solid transparent}
.abasatr .sub:hover{color:var(--ink);background:var(--hover)}
.abasatr .sub.on{color:var(--ink);border-bottom-color:var(--brass);background:var(--zebra)}
.abasatr .mk{color:var(--brass);font-size:10px;margin-left:5px;letter-spacing:0}
table.attr.defs td{padding-top:3px;padding-bottom:3px}
table.attr.defs tr.ini td{border-top:1px solid var(--line)}
table.attr.defs tr.zero .vtot{color:var(--ink-fraco)}
.defnome{display:inline-flex;align-items:center;gap:8px}
.defnome .icodef{flex:none;color:var(--brass)}
.defnome.t-golpe .icodef{color:var(--ink-soft)}
.defnome.t-mente .icodef{color:var(--teal)}
.dtmp{display:block;font-size:10.5px;color:var(--brass-ink);font-weight:500;white-space:nowrap}
.idcard3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
/* barra abaixo de zero: a parte negativa, riscada */
.barrinhas .bz.neg .bzv{color:var(--rubric);font-weight:600}
.barrinhas .bz.neg .bzt i{background:repeating-linear-gradient(135deg,var(--rubric) 0 3px,transparent 3px 6px)}
.rescard .atual.neg input[data-resatual]{color:var(--rubric);border-color:var(--rubric-borda)}
.resopc{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.resopc summary{cursor:pointer;font-size:11.5px;color:var(--ink-soft);display:flex;gap:10px;align-items:baseline;list-style:none}
.resopc summary::-webkit-details-marker{display:none}
.resopc summary::before{content:"▸";font-size:10px}
.resopc[open] summary::before{content:"▾"}
.resopc summary:hover .resopc-t{color:var(--ink)}
.resopc-r{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--brass-ink)}
.resopc-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:8px 0 6px}
.resopc .hint code{background:var(--campo-sut);border:1px solid var(--line-2);border-radius:3px;padding:0 4px;font-family:"IBM Plex Mono",monospace;font-size:11px}
label.f > span.pisoin{display:flex;align-items:center;gap:6px;margin:0}
.pisoin b{font-family:"IBM Plex Mono",monospace;color:var(--ink-soft)}
.pisoin input{flex:1;min-width:0}
/* o que um item soma além das dez colunas */
.itmais{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 5px}
.chipb{display:inline-flex;align-items:center;gap:5px;padding:2px 3px 2px 8px;border:1px solid var(--teal-borda);background:var(--teal-fundo);border-radius:999px;font-size:12px}
.chipb.rec{border-color:var(--brass-soft);background:var(--brass-fundo)}
.chipb b{font-weight:600;white-space:nowrap}
.chipb input[type=number]{width:52px;padding:2px 4px;border-radius:6px}
.chipb .chipx{border:0;background:transparent;color:var(--ink-soft);padding:0 6px;font-size:14px;line-height:1;border-radius:999px}
.chipb .chipx:hover{color:var(--rubric);background:var(--rubric-fundo)}
.itmais-s{width:auto;max-width:210px;padding:2px 6px;font-size:12px;color:var(--ink-soft)}
.itextras{margin-top:8px}
/* bônus temporários */
.tmplist{display:grid;gap:6px}
.tmprow{display:grid;grid-template-columns:auto minmax(110px,1.2fr) minmax(120px,1fr) 64px minmax(250px,1.4fr) auto;gap:8px;align-items:center}
.tmprow.off > :not(.tmpon):not(button){opacity:.45}
.tmprow .tmpon{display:grid;place-items:center;padding:0 2px}
.tmprow .tmpon input{width:auto}
.tmprow .tmpv{text-align:right;font-family:"IBM Plex Mono",monospace;font-weight:600}
.tmprow .tmpdur{display:flex;gap:6px;align-items:center;min-width:0}
.tmprow .tmpdur .tmpmodo{width:auto;flex:none;max-width:130px}
.tmprow .tmpdur .tmpd{flex:1;min-width:0}
.tmprow .tmpate{font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
.tmprow .tmprod{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tmprow .tmprod b{min-width:76px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.tmprow .tmprod.fim b{color:var(--ink-soft)}
.tmprow .tmprod .step{width:26px;height:26px;padding:0;font-size:16px;line-height:1;border-radius:50%;flex:none}
/* (na tela estreita, cada bônus em três linhas: o nome; onde soma e quanto; como acaba) */
@media (max-width:820px){.tmplist{gap:10px}.tmprow{grid-template-columns:auto 1fr 74px auto;grid-template-areas:"on n n x" ". k v ." ". dur dur .";row-gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line-2)}.tmprow:last-child{border-bottom:0;padding-bottom:0}
  .tmprow .tmpon{grid-area:on}.tmprow .tmpn{grid-area:n}.tmprow [data-tmpk]{grid-area:k}.tmprow .tmpv{grid-area:v}.tmprow .tmpdur{grid-area:dur}.tmprow [data-tmpdel]{grid-area:x}}
/* bolsas */
.bollist{display:grid;gap:10px}
.bolrow{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--campo);display:grid;gap:7px}
.bolrow.sem .bolnome{color:var(--ink-soft)}
.bolcab{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bolcab .bolnome{flex:1 1 180px;min-width:0;font-weight:500}
.bolqtd{display:inline-flex;align-items:center;gap:4px}
.bolqtd input{width:64px;text-align:center;font-family:"IBM Plex Mono",monospace;font-weight:600}
.bolfx{display:grid;grid-template-columns:minmax(120px,1fr) minmax(110px,.9fr) minmax(140px,1.1fr) 76px minmax(100px,.9fr);gap:8px;align-items:end}
.bolfx input.ruim{border-color:var(--rubric);color:var(--rubric)}
@media (max-width:820px){.bolfx{grid-template-columns:1fr 1fr}}
/* os efeitos de uma poção (lote 5): uma linha por efeito — o tipo, onde e quanto, e o × */
.bolfxs{display:grid;gap:6px}
.fxrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fxrow .fxk{flex:0 0 74px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.fxrow select{flex:1 1 150px;width:auto;min-width:0}
.fxrow input{flex:0 1 120px;width:auto;min-width:0}
.fxrow input.fxn{flex:0 0 70px}
.fxrow input.inm{flex:1 1 110px}
.fxrow input.ruim{border-color:var(--rubric);color:var(--rubric)}
.fxrow .hint{font-size:11.5px;white-space:nowrap}
.fxrow .mini.danger{flex:none;margin-left:auto}
.fxrow .fmlerr{flex-basis:100%;margin-left:80px}
.bolfxs .fxadd{justify-self:start;width:auto;max-width:100%;font-size:12.5px}
@media (max-width:560px){.fxrow .fxk{flex-basis:100%}.fxrow .fmlerr{margin-left:0}}
.bolconf select{width:auto;max-width:100%;padding:2px 6px;font-size:12.5px}
.bolconf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--brass);background:var(--brass-fundo);border-radius:var(--r);font-size:13px}
.bolconf span{flex:1 1 240px}
.bolrow textarea{min-height:30px;resize:vertical}
/* (lote 7, parte 6) o item que a busca rápida pediu: marcado por um instante */
.itcard.achado,.bolrow.achado{outline:2px solid var(--brass);outline-offset:2px}

/* config / modal */
.modal{position:fixed;inset:0;background:rgba(4,6,10,.62);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:40}
.modal .sheet{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);max-width:860px;width:100%}
.modal .sheet .hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .sheet .bd{padding:14px}
.cfggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
table.cfg{width:100%;border-collapse:collapse;font-size:13.5px}
table.cfg th,table.cfg td{padding:3px 5px;text-align:right;border-bottom:1px solid var(--linha-sut)}
table.cfg th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:500}
table.cfg th:first-child,table.cfg td:first-child{text-align:left}
table.cfg input{width:78px;padding:3px 5px;text-align:right}
.lvlscroll{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);padding:6px}
.empty{padding:40px 16px;text-align:center;color:var(--ink-soft)}

/* ---------- abas ---------- */
nav.tabs{background:var(--topo);padding:0 18px;display:flex;gap:2px;border-bottom:1px solid var(--topo-hover)}
nav.tabs button{
  background:transparent;border:0;border-radius:0;color:var(--topo-sub);padding:9px 15px;
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
  border-bottom:2px solid transparent;
}
nav.tabs button:hover{color:var(--topo-txt);background:var(--topo-hover)}
nav.tabs button.on{color:var(--topo-txt);border-bottom-color:var(--brass);background:var(--topo-hover)}
.wrap.solo{grid-template-columns:1fr}

/* ---------- mesa ---------- */
.sitbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
table.roll{width:100%;border-collapse:collapse;font-size:13.5px}
table.roll th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;padding:0 5px 6px;border-bottom:1px solid var(--line);text-align:left}
table.roll td{padding:5px;border-bottom:1px solid var(--linha-sut);vertical-align:middle}
table.roll select,table.roll input{padding:4px 6px;font-size:13px}
table.roll input[type=number]{width:64px;text-align:right}
table.roll .dado{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
table.roll .tot{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600}
table.roll .tot small{font-size:11px;font-weight:400;color:var(--ink-soft);display:block;line-height:1.3}
.lado{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:3px;border:1px solid}
.lado.aliado{color:var(--teal);border-color:var(--teal-borda);background:var(--teal-fundo)}
.lado.inimigo{color:var(--rubric);border-color:var(--rubric-borda);background:var(--rubric-fundo)}
.lado.neutro{color:var(--ink-soft);border-color:var(--line);background:var(--campo-sut)}
.veredito{border:1px solid var(--brass);background:var(--brass-fundo);border-radius:var(--r);padding:11px 13px;margin-top:12px}
.veredito h3{font-size:16px;margin-bottom:6px}
.vlinha{display:flex;gap:8px;align-items:baseline;padding:2px 0;font-size:13.5px}
.vlinha .p{font-family:"IBM Plex Mono",monospace;color:var(--ink-soft);width:24px}
.vlinha .n{flex:1}
.vlinha .v{font-family:"IBM Plex Mono",monospace;font-weight:600}
.ok{color:var(--teal)} .no{color:var(--rubric)}
.bigroll{font-family:"IBM Plex Mono",monospace;font-size:44px;font-weight:600;line-height:1}
.bigroll small{display:block;font-size:12px;font-weight:400;color:var(--ink-soft);letter-spacing:.04em}
.quick{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.log{max-height:320px;overflow:auto;font-size:12.5px}
.log .row{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--linha-sut);align-items:baseline}
.log .ts{font-family:"IBM Plex Mono",monospace;color:var(--ink-fraco);font-size:10.5px}
.log .who{font-weight:500;min-width:110px}
.log .det{color:var(--ink-soft);font-family:"IBM Plex Mono",monospace;font-size:11.5px;flex:1}
.log .tt{font-family:"IBM Plex Mono",monospace;font-weight:600}
.tab-ev{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media (max-width:900px){.tab-ev{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:2px;height:90px;margin-top:8px}
.bars div{flex:1;background:var(--teal);opacity:.75;border-radius:1px 1px 0 0}
.entrada{width:100%;font-family:"IBM Plex Mono",monospace;font-size:12.5px}

/* ---------- barras especiais (os antigos poderes divinos): o CSS está mais abaixo (.pdlist) ---------- */
/* ---------- rolagem rápida na ficha ---------- */
.rolbox{border-top:1px solid var(--line);padding:11px 12px 12px}
.rolhd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.rolfix{display:flex;align-items:center;gap:5px;margin-left:auto}
.rolfix input{width:62px;padding:3px 6px;text-align:right;font-family:"IBM Plex Mono",monospace}
.rolhd select{width:auto;padding:3px 6px;font-size:12px}
.skbarra{display:inline-flex;gap:1px;margin-left:6px;font-size:10.5px;vertical-align:1px}.skbarra .mbs{color:#3f9d5b}.skbarra .mbg{color:#c9473d}
.rolmais{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-2px 0 8px;font-size:12px;color:var(--ink-soft)}
.rolmais .eyebrow{margin-right:auto}
.rolmais label{display:flex;align-items:center;gap:5px}
.rolmais input{width:54px;padding:3px 6px;text-align:right;font-family:"IBM Plex Mono",monospace}
.rolmais input.tem{border-color:var(--brass);background:var(--brass-fundo)}
.rolbts{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px}
.atrbt{flex:1 1 60px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 4px;line-height:1.15}
.atrbt b{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;color:var(--ink-soft);font-weight:500}
.atrbt span{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600}
.atrbt:hover{border-color:var(--brass);background:var(--brass-fundo)}
.atrbt:hover b{color:var(--brass-ink)}
.atrbt.der span{color:var(--ink-2)}
.rolsaida{display:flex;align-items:center;gap:10px;margin-top:9px;padding:8px 10px;
  border:1px solid var(--brass);background:var(--brass-fundo);border-radius:var(--r)}
.rolsaida.vazia{border-style:dashed;border-color:var(--line);background:transparent;
  color:var(--ink-soft);font-size:12.5px;justify-content:center;padding:10px}
.rolnum{font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:600;line-height:1}
.roldet{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-soft);line-height:1.45}
.roldet strong{color:var(--ink);font-weight:600}

/* cores dos cinco atributos na rolagem */
.atrbt.c-for b,.rolsaida.c-for .rolnum{color:var(--a-for)}
.atrbt.c-agi b,.rolsaida.c-agi .rolnum{color:var(--a-agi)}
.atrbt.c-vit b,.rolsaida.c-vit .rolnum{color:var(--a-vit)}
.atrbt.c-can b,.rolsaida.c-can .rolnum{color:var(--a-can)}
.atrbt.c-des b,.rolsaida.c-des .rolnum{color:var(--a-des)}
.atrbt.c-for{border-left:3px solid var(--a-for)}
.atrbt.c-agi{border-left:3px solid var(--a-agi)}
.atrbt.c-vit{border-left:3px solid var(--a-vit)}
.atrbt.c-can{border-left:3px solid var(--a-can)}
.atrbt.c-des{border-left:3px solid var(--a-des)}
.atrbt.c-for:hover{background:var(--a-for-f);border-color:var(--a-for)}
.atrbt.c-agi:hover{background:var(--a-agi-f);border-color:var(--a-agi)}
.atrbt.c-vit:hover{background:var(--a-vit-f);border-color:var(--a-vit)}
.atrbt.c-can:hover{background:var(--a-can-f);border-color:var(--a-can)}
.atrbt.c-des:hover{background:var(--a-des-f);border-color:var(--a-des)}
.atrbt.c-for:hover b,.atrbt.c-agi:hover b,.atrbt.c-vit:hover b,.atrbt.c-can:hover b,.atrbt.c-des:hover b{color:inherit}
.rolsaida.c-for{border-color:var(--a-for);background:var(--a-for-f)}
.rolsaida.c-agi{border-color:var(--a-agi);background:var(--a-agi-f)}
.rolsaida.c-vit{border-color:var(--a-vit);background:var(--a-vit-f)}
.rolsaida.c-can{border-color:var(--a-can);background:var(--a-can-f)}
.rolsaida.c-des{border-color:var(--a-des);background:var(--a-des-f)}
.atrbt.disputar{flex:1 1 100%;flex-direction:row;justify-content:center;gap:7px;
  border-style:dashed;border-color:var(--brass);color:var(--brass-ink)}
.atrbt.disputar b{font-size:14px;color:var(--brass)}
.atrbt.disputar span{font-size:12.5px;font-family:inherit;font-weight:500}
.atrbt.disputar:hover{background:var(--brass-fundo);border-style:solid}
table.attr tr.defesa td{background:var(--zebra)}
table.attr tr.especial td{background:var(--zebra);border-top:1px dashed var(--line)}
input.defbase{width:62px;padding:3px 6px;text-align:right;font-family:"IBM Plex Mono",monospace}

/* ---------- disputa de rolagens ---------- */
.dislados{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start}
.dislado{border:1px solid var(--line);border-radius:var(--r);padding:11px;background:var(--campo)}
.dislado.venceu{border-color:var(--teal);background:var(--teal-fundo)}
.disnome{font-weight:600;font-size:15px;margin-bottom:8px;display:block}
.discampos{display:grid;gap:7px}
.discampos label{display:flex;align-items:center;gap:6px;justify-content:space-between}
.discampos label > span{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft)}
.discampos select,.discampos input{width:auto;flex:1;max-width:160px;padding:4px 7px}
.disvs{font-family:"Fraunces",Georgia,serif;font-size:20px;color:var(--ink-soft);align-self:center;padding-top:28px}
.disval{font-family:"IBM Plex Mono",monospace;font-size:15px;color:var(--ink);font-weight:600}
.disnum{font-family:"IBM Plex Mono",monospace;font-size:34px;font-weight:600;line-height:1;margin-top:9px}
.disdet{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-soft);margin-top:3px}
.disveredito{margin-top:14px;padding:11px 13px;border:1px solid var(--brass);background:var(--brass-fundo);
  border-radius:var(--r);text-align:center}
.disveredito strong{font-size:16px}
.disveredito .emp{color:var(--ink-soft)}

/* ---------- aba Skills ---------- */
.semarv{text-align:center;padding:26px 16px;max-width:520px;margin:0 auto}
.semarv h3{font-size:18px;margin-bottom:6px}
.semarv p{color:var(--ink-soft);font-size:13.5px;margin:0 0 14px}
.poolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.poolcard{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:var(--r);
  padding:7px 10px;background:var(--campo)}
.pooldot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.18) inset}
.poolnome{font-weight:500;font-size:13.5px}
.poolcard input{width:62px;padding:3px 6px;text-align:right;font-family:"IBM Plex Mono",monospace}
.poolconta{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-soft)}
.poolconta strong{color:var(--ink);font-size:13px}
.poolconta.warn strong{color:var(--rubric)}

.skbloco{border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;background:var(--panel)}
.skbloco:last-child{margin-bottom:0}
.skhd{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-radius:0;
  background:var(--campo-sut);padding:8px 11px;border-bottom:1px solid var(--line)}
.skhd:hover{background:var(--hover)}
.skhd.estatico{cursor:default;background:var(--campo-sut)}
.skhd .caret{color:var(--ink-soft);font-size:10px}
.skcorpo{padding:11px}
.skcat{margin-bottom:10px}
.skchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.skchip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r);
  padding:5px 9px;background:var(--campo);cursor:pointer;font-size:13.5px}
.skchip:hover{border-color:var(--ink-2)}
.skchip.on{border-color:var(--brass);background:var(--brass-fundo)}
.skchip input{width:auto;flex:0 0 auto}
.skchip small{display:block;font-size:10.5px;color:var(--ink-soft);font-family:"IBM Plex Mono",monospace}
.skarv{margin-bottom:16px}
.skarv:last-child{margin-bottom:0}
.skarvhd{display:flex;align-items:center;gap:8px;padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.skarvnome{font-family:"Fraunces",Georgia,serif;font-size:15px;font-weight:600}

.skno{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--linha-sut)}
.skno:last-child{border-bottom:0}
.sknobt{flex:0 0 auto;width:26px;height:26px;padding:0;border-radius:50%;font-family:"IBM Plex Mono",monospace;
  font-size:12px;font-weight:600;line-height:1;border:1.5px solid var(--line);background:var(--campo);color:var(--ink-soft)}
.st-disp .sknobt{border-color:var(--brass);color:var(--brass)}
.st-disp .sknobt:hover{background:var(--brass);color:var(--forte-txt)}
.st-on .sknobt{border-color:var(--teal);background:var(--teal);color:var(--panel)}
.st-caro .sknobt{border-style:dashed;border-color:var(--rubric-borda);color:var(--rubric)}
.sknobt:disabled{opacity:.4;cursor:not-allowed}
.sknocorpo{min-width:0;flex:1}
.sknolinha{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sknome{font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:5px}
.st-bloq .sknome,.st-fechado .sknome{color:var(--ink-soft)}
.skdot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.2) inset}
.sktipo,.skestado,.skcusto{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.skcusto{color:var(--brass-ink)}
.st-on .skestado{color:var(--teal)}
.st-caro .skestado{color:var(--rubric)}
.skuso{font-family:"IBM Plex Mono",monospace;font-size:10px;padding:1px 5px;border-radius:9px;
  border:1px solid var(--line);color:var(--ink-2);background:var(--campo-sut)}
.u-ativa{color:var(--teal);border-color:var(--teal-borda);background:var(--teal-fundo)}
.u-reacao{color:var(--brass-ink);border-color:var(--brass-soft);background:var(--brass-fundo)}
.u-postura{color:var(--roxo);border-color:var(--roxo-borda);background:var(--roxo-fundo)}
.sknodesc{font-size:12.5px;color:var(--ink-soft);margin-top:2px;line-height:1.45}
.sknograu{font-size:12px;color:var(--teal);margin-top:2px;font-weight:500}
.sknotrava{font-size:11.5px;color:var(--ink-fraco);margin-top:2px;font-style:italic}

table.sktab{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
table.sktab th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:500;text-align:left;padding:0 6px 6px;border-bottom:1px solid var(--line)}
table.sktab td{padding:6px;border-bottom:1px solid var(--linha-sut);vertical-align:top}
table.sktab tr.skdesc td{padding:0 6px 7px;font-size:12.5px;color:var(--ink-soft);border-bottom:1px solid var(--linha-sut)}
table.sktab tr.skdesc strong{color:var(--teal);font-weight:500}
.sknat{display:inline-flex;align-items:center;gap:5px;font-size:12.5px}

/* ---------- apagar dados (flush) ---------- */
button.ghost.perigo{color:var(--topo-perigo);border-color:var(--topo-perigo-borda)}
button.ghost.perigo:hover{background:var(--topo-perigo-hover);color:#fff;border-color:var(--topo-perigo-b2)}
.sheet.risco{border-color:var(--rubric);border-top:3px solid var(--rubric)}
.flushlist{display:grid;gap:2px;margin:10px 0}
.flushitem{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--campo);cursor:pointer}
.flushitem:hover{border-color:var(--ink-2)}
.flushitem input{width:auto;margin-top:2px;flex:0 0 auto}
.flushitem.marcado{border-color:var(--rubric);background:var(--rubric-fundo)}
.flushitem .rot{font-weight:500;font-size:14px;display:block}
.flushitem .dsc{font-size:12px;color:var(--ink-soft)}
.avisobox{border:1px solid var(--rubric);background:var(--rubric-fundo);border-radius:var(--r);padding:12px 14px;margin:12px 0}
.avisobox h3{font-size:16px;color:var(--rubric);margin-bottom:6px}
.avisobox ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.avisobox li{margin:2px 0}
.digite{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.digite input{max-width:190px;font-family:"IBM Plex Mono",monospace;letter-spacing:.18em;text-transform:uppercase;font-size:15px}
button.apagar{background:var(--rubric);color:#fff;border-color:var(--rubric)}
:root[data-tema="pedra"] button.apagar{color:#1a0e11}
button.apagar:hover:not(:disabled){background:var(--rubric-forte);border-color:var(--rubric-forte);color:#fff}
button.apagar:disabled{background:var(--rubric-off);border-color:var(--rubric-borda);color:var(--panel);cursor:not-allowed}
.modalacts{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}

/* ---------- (lote 16) o resumo fixo no alto da ficha e as abas ---------- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.resumo .rscorpo{display:grid;gap:10px;align-content:start}
.rsnome{display:flex;align-items:flex-end;gap:6px 14px;flex-wrap:wrap}
.rsnome label.f{flex:0 1 340px;min-width:180px}
.rsnome #f_nome{font-size:17px;font-weight:600}
.rsmeta{font-size:13px;color:var(--ink-2);padding-bottom:9px}
.rsbarras{display:flex;flex-wrap:wrap;gap:8px;width:auto;margin:0}
.rsb{display:grid;grid-template-columns:auto auto;align-items:center;gap:4px 8px;padding:6px 10px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--campo-sut);min-width:150px}
.rsb .rsbl{display:flex;align-items:center;gap:6px;grid-column:1/-1}
.rsb .rsbn{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;white-space:nowrap}
.rsb input[data-resatual]{width:72px;padding:4px 6px;font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;text-align:right}
.rsb .rsbm{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
.rsb .rsx{justify-self:start;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--teal);border:1px solid var(--teal-borda);background:var(--teal-fundo);border-radius:9px;padding:0 6px}
.rsb .bz{grid-column:1/-1;display:block}
.rsb .bzt{display:block;height:6px;border-radius:3px;background:var(--campo);border:1px solid var(--line);overflow:hidden;position:relative}
.rsb .bzt i{display:block;height:100%;border-radius:2px}
.rsb .bzt b.podre{position:absolute;top:0;right:0;bottom:0;background:repeating-linear-gradient(135deg,#6b7a35 0 2px,#3b3020 2px 4px);border-left:1px solid #2a2216}
.rsb.neg input[data-resatual]{color:var(--rubric);border-color:var(--rubric-borda)}
.rsb .bz.neg .bzt i{background:repeating-linear-gradient(135deg,var(--rubric) 0 3px,transparent 3px 6px)}
.rsb.rsesp,.rsb.rsfad{grid-template-columns:auto auto auto;row-gap:6px}
.rsb .pdctl{gap:6px}
.rsb .pdctl .step{width:26px;height:26px;font-size:15px}
.rsb .pdval{font-size:17px;min-width:44px}
.rsb .pips{grid-column:1/-1;gap:5px}
.rsb .pip{width:15px;height:15px}
.rsb.rsfad .bateria{grid-column:auto;margin:0}
.rsb.rsfad .bateria .cel{width:18px;height:12px}
.rsb.rsfad .fadfaixa{grid-column:1/-1;font-size:11.5px;color:var(--ink-2)}
.rsnums{display:flex;flex-wrap:wrap;gap:6px 14px}
.rsgrupo{display:inline-flex;flex-wrap:wrap;gap:4px}
.rsn{display:inline-flex;align-items:baseline;gap:5px;padding:2px 8px;border:1px solid var(--line-2);border-radius:999px;background:var(--campo);font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--ink)}
.rsn b{font-size:9.5px;letter-spacing:.08em;color:var(--ink-soft);font-weight:600}
.rsestado{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 12px}
.rsestado .lapros{width:150px}
.rschip{padding:4px 10px;border-radius:999px;font-size:12.5px;background:var(--campo);border:1px solid var(--line);color:var(--ink-2);margin-bottom:2px}
.rschip b{font-family:"IBM Plex Mono",monospace;margin-left:3px;color:var(--ink)}
.rschip.ruim{border-color:var(--rubric-borda);background:var(--rubric-fundo);color:var(--rubric)}
.rschip:hover{border-color:var(--ink-2)}
.abasficha{display:flex;flex-wrap:wrap;gap:2px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.abasficha .abf{border:0;border-radius:0;background:transparent;color:var(--ink-soft);padding:9px 14px 8px;border-bottom:2px solid transparent;margin-bottom:-1px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.abasficha .abf:hover{color:var(--ink);background:var(--hover)}
.abasficha .abf.on{color:var(--ink);border-bottom-color:var(--brass);background:var(--zebra);font-weight:600}
.abasficha .mk{color:var(--brass);font-size:10px;margin-left:5px}
.idcardq{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.aniv{display:grid;gap:4px;margin-top:10px}
.anivlin{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.anivlin .anivd{width:74px}.anivlin select{width:auto;min-width:140px}.anivlin .aniva{width:160px}
.anivinfo{color:var(--ink-2)}
.rschip.cxchip{display:inline-flex;align-items:center;gap:4px}
.rschip.cxchip svg{color:var(--brass)}
/* (lote 16) a caixinha do grupo */
.caixa .hd{display:flex;align-items:center;gap:8px}
.caixa .cxg{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-soft);letter-spacing:.04em}
.caixa .cxtot{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-2)}
.caixa .cxtot svg{color:var(--brass)}
.caixa .cxtot b{font-family:"IBM Plex Mono",monospace;font-size:16px;color:var(--ink)}
.cxacao{display:grid;grid-template-columns:110px minmax(140px,1fr);gap:8px 10px;align-items:end}
.cxacao .cxq input{font-family:"IBM Plex Mono",monospace;font-weight:600}
.cxacao .cxnota i{font-style:normal;color:var(--ink-fraco);text-transform:none;letter-spacing:0}
.cxbts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cxbts button:disabled{opacity:.4;cursor:not-allowed}
.cxbts .cxsep{width:1px;height:18px;background:var(--line);margin:0 4px}
.cxprev{display:flex;flex-direction:column;gap:2px;min-height:38px;margin-top:8px;font-size:12.5px;color:var(--ink-2)}
.cxprev .cxerro,.cxerro{color:var(--rubric)}
.cxexthd{display:flex;align-items:center;gap:8px;margin:12px 0 4px}
.cxexthd .linkbtn{margin-left:auto;font-size:12px}
.cxext{list-style:none;margin:0;padding:0;border-top:1px solid var(--linha-sut)}
.cxext li{display:grid;grid-template-columns:92px 1fr auto;gap:8px;padding:4px 2px;border-bottom:1px solid var(--linha-sut);font-size:12.5px;align-items:baseline}
.cxext .cxquando{font-size:11px;color:var(--ink-soft)}
.cxext .cxsaldo{font-size:12px;color:var(--ink-soft)}
.cxext li.entra .cxoque{color:var(--ink)}
.cxext li.sai .cxoque{color:var(--ink-2)}
.cxext .cxnotatxt{color:var(--ink-soft);font-style:italic}
.rschip.festa{border-color:var(--brass-luz);background:var(--brass-fundo);color:var(--brass-ink)}
.fadcfg{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:0 0 10px;margin:0 0 10px;border-bottom:1px solid var(--linha-sut)}
.pdrow .pdvalcfg{font-size:15px;min-width:auto;color:var(--ink-2)}
@media (max-width:700px){ .rsb{min-width:0;flex:1 1 140px} .abasficha .abf{padding:8px 9px;letter-spacing:.06em} }

/* ---------- abas internas da ficha ---------- */
.subtabs{gap:2px;flex-wrap:wrap}
.subtabs .sub{border:0;border-radius:0;background:transparent;color:var(--ink-soft);
  padding:4px 10px;border-bottom:2px solid transparent;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.subtabs .sub:hover{color:var(--ink);background:var(--hover)}
.subtabs .sub.on{color:var(--ink);border-bottom-color:var(--brass);background:var(--zebra)}

<script>
/* =======================================================================
   CALCULADORA DE ATRIBUTOS — TINY CATS
   Um arquivo. Salva no navegador. Exporta/importa JSON.
   ======================================================================= */

/* ---------- atributos do sistema ---------- */
const ATRIBS = [
  {k:'FOR', nome:'Força',             aliases:['FORCA','FORÇA']},
  {k:'DES', nome:'Destreza',          aliases:['DESTREZA']},
  {k:'VIT', nome:'Vitalidade',        aliases:['VITALIDADE']},
  {k:'CAN', nome:'Canalização Mágica',aliases:['CANALIZACAO','CANALIZAÇÃO','CM','MAG']},
  {k:'AGI', nome:'Agilidade',         aliases:['AGILIDADE']},
];
/* Derivados: não recebem pontos. Somam atributos BASE (sem equipamento) mais o
   campo especial do próprio derivado nos equipamentos. Metades arredondam pra baixo. */
const DERIV = [
  {k:'ESQ', nome:'Esquiva',     desc:'AGI',           calc:b=>b.AGI,
   aliases:['ESQUIVA']},
  {k:'FUR', nome:'Furtividade', desc:'AGI + DES/2',   calc:b=>b.AGI+Math.floor(b.DES/2),
   aliases:['FURTIVIDADE']},
  {k:'PER', nome:'Percepção',   desc:'DES + CAN/2',   calc:b=>b.DES+Math.floor(b.CAN/2),
   aliases:['PERCEPCAO','PERCEPÇÃO']},
  // o Embate: a metade da Vitalidade base (para baixo) + o Bloqueio inteiro (d: as defesas já calculadas)
  {k:'EMB', nome:'Embate',      desc:'VIT/2 + BLOQ',  calc:(b,d)=>Math.floor(b.VIT/2)+((d&&d.BLQ)||0),
   aliases:['EMBATE']},
];
const ehDerivado = k => DERIV.some(d=>d.k===k);
/* Defesas: valor manual por personagem (varia por raça) + o que os equipamentos somam.
   Não entram na distribuição de pontos do level. */
const DEFESAS = [
  {k:'DFF', nome:'Defesa Física', rot:'DEF F', aliases:['DEFF','DEFESAFISICA']},
  {k:'DFM', nome:'Defesa Mágica', rot:'DEF M', aliases:['DEFM','DEFESAMAGICA']},
  {k:'BLQ', nome:'Bloqueio',      rot:'BLOQ',  aliases:['BLOQUEIO','BLOQ']},       // valor próprio + itens; rola como a Esquiva
];
const ehDefesa = k => DEFESAS.some(d=>d.k===k);
/* cores dos cinco atributos principais, usadas na rolagem */
const COR_ATR = {FOR:'for', DES:'des', VIT:'vit', CAN:'can', AGI:'agi'};
const TIPOS_HAB = ['Ativo','Reativo','Passivo','Inativo'];
const TIERS_ATR = ['A','B','C','D','E'];

/* ---------- FORMULA ENGINE (parser próprio, sem eval) ---------- */
/* ##PARSER_START## */
function tokenize(src){
  const t=[]; let i=0;
  const isD=c=>c>='0'&&c<='9';
  const isA=c=>/[A-Za-zÀ-ÿ_]/.test(c);
  while(i<src.length){
    const c=src[i];
    if(c===' '||c==='\t'||c==='\n'){i++;continue}
    if(isD(c)||(c==='.'&&isD(src[i+1]))){
      let j=i; while(j<src.length&&(isD(src[j])||src[j]==='.'))j++;
      t.push({t:'num',v:parseFloat(src.slice(i,j))}); i=j; continue;
    }
    if(isA(c)){
      let j=i; while(j<src.length&&(isA(src[j])||isD(src[j])))j++;
      t.push({t:'id',v:src.slice(i,j)}); i=j; continue;
    }
    if('><=!'.includes(c)){
      const dois=src.slice(i,i+2);
      if(['>=','<=','==','!='].includes(dois)){t.push({t:'cmp',v:dois});i+=2;continue}
      if(c==='>'||c==='<'){t.push({t:'cmp',v:c});i++;continue}
      if(c==='='){t.push({t:'cmp',v:'=='});i++;continue}
      throw new Error('Use >, <, >=, <=, == ou !=');
    }
    if(';'===c){t.push({t:','});i++;continue}
    if('+-*/%^(),'.includes(c)){t.push({t:c});i++;continue}
    throw new Error('Caractere inválido: "'+c+'"');
  }
  return t;
}
const FUNCS={
  min:Math.min, max:Math.max, floor:Math.floor, ceil:Math.ceil,
  round:Math.round, abs:Math.abs, sqrt:Math.sqrt, pow:Math.pow,
  arredondar:Math.round, teto:Math.ceil, piso:Math.floor, raiz:Math.sqrt,
  se:(c,a,b)=>c?a:b
};
function evalFormula(src, vars){
  if(src==null||String(src).trim()==='') return null;
  const tk=tokenize(String(src)); let p=0;
  const peek=()=>tk[p], next=()=>tk[p++];
  function comparacao(){
    let v=expr();
    while(peek()&&peek().t==='cmp'){
      const o=next().v, r=expr();
      v = (o==='>'?v>r : o==='<'?v<r : o==='>='?v>=r : o==='<='?v<=r : o==='=='?v===r : v!==r) ? 1 : 0;
    }
    return v;
  }
  function expr(){
    let v=term();
    while(peek()&&(peek().t==='+'||peek().t==='-')){ const o=next().t; const r=term(); v = o==='+'? v+r : v-r; }
    return v;
  }
  function term(){
    let v=unary();
    while(peek()&&(peek().t==='*'||peek().t==='/'||peek().t==='%')){
      const o=next().t; const r=unary();
      if(o==='*')v=v*r; else if(o==='/'){ if(r===0) throw new Error('Divisão por zero'); v=v/r; } else { if(r===0) throw new Error('Divisão por zero'); v=v%r; }
    }
    return v;
  }
  function unary(){
    if(peek()&&peek().t==='-'){next();return -unary()}
    if(peek()&&peek().t==='+'){next();return unary()}
    return power();
  }
  function power(){
    const b=atom();
    if(peek()&&peek().t==='^'){next(); return Math.pow(b,unary())}
    return b;
  }
  function atom(){
    const tok=next();
    if(!tok) throw new Error('Fórmula incompleta');
    if(tok.t==='num') return tok.v;
    if(tok.t==='('){ const v=comparacao(); if(!peek()||next().t!==')') throw new Error('Falta fechar ")"'); return v; }
    if(tok.t==='id'){
      const nm=tok.v;
      if(peek()&&peek().t==='('){
        next();
        const f=FUNCS[nm.toLowerCase()];
        if(!f) throw new Error('Função desconhecida: '+nm);
        const args=[];
        if(peek()&&peek().t===')'){next()}
        else{
          for(;;){ args.push(comparacao()); const s=next(); if(!s) throw new Error('Falta fechar ")"'); if(s.t===')')break; if(s.t!==',') throw new Error('Esperado "," ou ")"'); }
        }
        return f.apply(null,args);
      }
      const key=nm.toUpperCase();
      if(key in vars) return vars[key];
      throw new Error('Variável desconhecida: '+nm);
    }
    throw new Error('Trecho inesperado na fórmula');
  }
  const out=comparacao();
  if(p<tk.length) throw new Error('Sobrou conteúdo depois da fórmula');
  if(!isFinite(out)) throw new Error('Resultado inválido');
  return out;
}
/* ##PARSER_END## */

/* ---------- ALEATORIEDADE ----------
   Usa crypto.getRandomValues (gerador criptográfico do navegador), com
   amostragem por rejeição para não distorcer as faces do dado. Nenhum
   Math.random em rolagem. Cada rolagem guarda o sorteio bruto no registro. */
function randInt(max){ // inteiro de 0 a max-1, uniforme
  if(max<=0) return 0;
  const cr = (window.crypto||window.msCrypto);
  const limite = Math.floor(4294967296/max)*max;   // corta o resto que enviesaria
  const buf=new Uint32Array(1);
  for(let i=0;i<64;i++){
    cr.getRandomValues(buf);
    if(buf[0]<limite) return buf[0]%max;
  }
  return buf[0]%max;
}
function rolarDado(faces){ return randInt(faces)+1 }
function rolarVarios(qtd,faces){ const r=[]; for(let i=0;i<qtd;i++) r.push(rolarDado(faces)); return r }

/* expressão livre: "2d6+1d8+5" / "d20-2" */
function rolarExpressao(txt){
  const s=String(txt||'').replace(/\s+/g,'').toLowerCase();
  if(!s) throw new Error('Escreva algo como 1d20+3');
  if(!/^[+-]?(\d*d\d+|\d+)([+-](\d*d\d+|\d+))*$/.test(s)) throw new Error('Formato inválido. Use 2d6+3, d20, 1d100-5…');
  const partes=s.match(/[+-]?(?:\d*d\d+|\d+)/g)||[];
  let total=0; const detalhe=[], dd=[];           // dd: [[lados, valor], …] — o que cada dado sorteou (para o auditor da mesa)
  partes.forEach(p=>{
    const sinal = p[0]==='-'? -1 : 1;
    const corpo = p.replace(/^[+-]/,'');
    if(corpo.includes('d')){
      const [q,f]=corpo.split('d');
      const qtd=q===''?1:parseInt(q,10), faces=parseInt(f,10);
      if(qtd<1||qtd>200) throw new Error('Quantidade de dados fora do razoável (1 a 200)');
      if(faces<2||faces>10000) throw new Error('Faces do dado fora do razoável (2 a 10000)');
      const rs=rolarVarios(qtd,faces);
      rs.forEach(r=>dd.push([faces,r]));
      total += sinal*rs.reduce((a,b)=>a+b,0);
      detalhe.push((sinal<0?'−':'')+qtd+'d'+faces+' ['+rs.join(', ')+']');
    }else{
      const v=parseInt(corpo,10); total+=sinal*v;
      detalhe.push((sinal<0?'−':'+')+v);
    }
  });
  return {total, detalhe:detalhe.join(' '), expr:s, dd};
}
/* o dado de uma rolagem com fixa, no mesmo formato (nada, quando a fixa é o atributo inteiro) */
const ddDaFixa = r => (r && r.dado>=2 ? [[r.dado, r.bruto]] : []);

/* fixa: atributo 60 fixando 20 → 1d40 + 20 */
function rolarFixa(valorAtributo, fixado){
  const v=Math.max(0,Math.round(+valorAtributo||0));
  const f=Math.min(v,Math.max(0,Math.round(+fixado||0)));
  const faces=v-f;
  if(faces<=0) return {dado:0, bruto:f, fixado:f, total:v, texto:'fixo em '+v};
  const bruto=rolarDado(faces);
  return {dado:faces, bruto, fixado:f, total:bruto+f, texto:'1d'+faces+' + '+f};
}

/* ---------- registro da mesa ---------- */
function logar(e){
  S.log = S.log||[];
  const reg = {id:uid(), ts:Date.now(), ...e};
  S.log.unshift(reg);
  if(S.log.length>300) S.log.length=300;
  save();
  // mesa ao vivo: com uma mesa aberta no site, a rolagem também aparece para a mesa (a casca decide se é aberta ou secreta)
  try{ if(window.TC && TC.ponte && TC.ponte.estado.mesa) TC.ponte.publicar('ficha', reg); }catch(err){}
}
function horaCurta(ts){
  const d=new Date(ts);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* ---------- estado padrão ---------- */
function tabelaNiveisPadrao(){
  const t=[]; for(let l=1;l<=50;l++) t.push({lvl:l, pts: l===50?445:45+(l-1)*8});
  return t;
}
function estadoPadrao(){
  return {
    v:1,
    cfg:{
      niveis:tabelaNiveisPadrao(),
      tiersPersonagem:[{t:'S',m:1.12},{t:'A',m:1.08},{t:'B',m:1.04},{t:'C',m:1.00},{t:'D',m:0.85},{t:'E',m:0.75}],
      pct:{A:0.30,B:0.26,C:0.22,D:0.17,E:0.05},
      arredondar:'floor'
    },
    personagens:[personagemPadrao('Dain X','Humano', 'S', 19, {FOR:'A',DES:'C',AGI:'D',VIT:'B',CAN:'E'})],
    situacoes:[],
    tabelas:[{id:uid(), nome:'Encontros na estrada', itens:'Caravana de mercadores nervosos\nPatrulha da Ordem dos Cruzados\nCorpo recente, sem ferimentos visíveis\nNeblina densa e silêncio absoluto\nNada acontece\nEmboscada'}],
    log:[],
    bib:null,
    sel:null, selSit:null, aba:'fichas'
  };
}
function uid(){return Math.random().toString(36).slice(2,10)}
function personagemPadrao(nome,raca,tier,level,tiers){
  return {
    id:uid(), nome:nome||'Novo personagem', raca:raca||'', lado:'Aliado', grupo:'', tags:[],
    tier:tier||'C', level:level||1,
    tiers: tiers||{FOR:'A',DES:'B',AGI:'C',VIT:'D',CAN:'E'},
    pctProprio:null,
    poderes:[],
    skills:{arvores:[], pontos:{}, alocados:{}},
    defesas:{DFF:0, DFM:0, BLQ:0},
    rol:{fixa:0, fonte:'total'}, ultRol:null,
    disputa:{atrA:'FOR', alvoId:'', atrB:'FOR', fixaB:0, valorB:40},
    estaque:{a:'', b:''},
    habilidades:[],
    itens:[],
    recursos:[
      {id:uid(), nome:'HP', fml:'VIT*8 + LVL*5'},
      {id:uid(), nome:'SP', fml:'CAN*6 + LVL*3'}
    ],
    notas:''
  };
}
let S = estadoPadrao();

/* ---------- persistência ---------- */
let KEY='urgm_calc_atributos_v1';   // dentro de uma mesa do site, a chave passa a ser a da mesa (ver mesa.js)
async function loadState(){
  await FichasMesa.preparar();   // com uma mesa aberta no site, as fichas vêm dela
  try{
    if(window.storage && window.storage.get){
      const r=await window.storage.get(KEY);
      if(r && r.value) return JSON.parse(r.value);
    }
  }catch(e){/* chave ainda não existe */}
  try{
    const raw=localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
let saveT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    saveT=null;
    const data=JSON.stringify(S);
    try{ if(window.storage && window.storage.set){ await window.storage.set(KEY,data); } }catch(e){}
    try{ localStorage.setItem(KEY,data); }catch(e){}

}

  clearTimeout(saveT); saveT=null;
  const data=JSON.stringify(S);
  try{ if(window.storage && window.storage.set) window.storage.set(KEY,data); }catch(e){}

}

document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') saveJa(); });
