}

/* ============================================================
   HISTÓRICO — desfazer / refazer
   Guarda o documento inteiro ANTES de cada mudança.
   ============================================================ */
const PILHA_MAX = 40, PILHA_SALVA = 6;
let pilhaDesfazer = [], pilhaRefazer = [], ultimoRegistro = {chave:null, t:0};

function instantaneo(){
  return {doc:JSON.stringify(doc), sel:selecionado,
          vista:{arvoreMestre:ui.arvoreMestre, personagem:ui.personagem}};
}
// chave opcional: junta edições seguidas do mesmo campo num passo só
function registrar(rotulo, chave){
  const agora = Date.now();
  if(chave && ultimoRegistro.chave===chave && agora-ultimoRegistro.t < 2000){ ultimoRegistro.t = agora; return; }
  ultimoRegistro = {chave:chave||null, t:agora};
  pilhaDesfazer.push({rotulo, estado:instantaneo()});
  if(pilhaDesfazer.length > PILHA_MAX) pilhaDesfazer.shift();
  pilhaRefazer.length = 0;
  atualizarHistorico();
}
function aplicarEstado(e){
  doc = ArvoreMesa.restringir(JSON.parse(e.doc)); normalizarDoc();
  if(e.vista){ ui.arvoreMestre = e.vista.arvoreMestre; ui.personagem = e.vista.personagem; }
  indexar(); garantirSelecoes();
  selecionado = (e.sel && porId.has(e.sel)) ? e.sel : null;
  salvar(); pintarTudo();
}
function desfazer(){
  if(!pilhaDesfazer.length) return aviso('Nada para desfazer.');
  const passo = pilhaDesfazer.pop();
  pilhaRefazer.push({rotulo:passo.rotulo, estado:instantaneo()});
  if(pilhaRefazer.length > PILHA_MAX) pilhaRefazer.shift();
  ultimoRegistro = {chave:null, t:0};
  aplicarEstado(passo.estado); atualizarHistorico();
  aviso('Desfeito: ' + passo.rotulo, 'ok');
}
function refazer(){
  if(!pilhaRefazer.length) return aviso('Nada para refazer.');
  const passo = pilhaRefazer.pop();
  pilhaDesfazer.push({rotulo:passo.rotulo, estado:instantaneo()});
  ultimoRegistro = {chave:null, t:0};
  aplicarEstado(passo.estado); atualizarHistorico();
  aviso('Refeito: ' + passo.rotulo, 'ok');
}
function atualizarHistorico(){
  const d = $('#btDesfazer'), r = $('#btRefazer'); if(!d || !r) return;
  d.disabled = !pilhaDesfazer.length; r.disabled = !pilhaRefazer.length;
  d.title = pilhaDesfazer.length ? 'Desfazer: ' + pilhaDesfazer[pilhaDesfazer.length-1].rotulo + ' (Ctrl+Z)' : 'Nada para desfazer';
  r.title = pilhaRefazer.length ? 'Refazer: ' + pilhaRefazer[pilhaRefazer.length-1].rotulo + ' (Ctrl+Shift+Z)' : 'Nada para refazer';
}
// o histórico é grande; se não couber no navegador, guarda menos passos
function salvarHistorico(){
  let n = Math.min(PILHA_SALVA, pilhaDesfazer.length);
  for(;;){
    try{ localStorage.setItem(CHAVE_HIST, JSON.stringify(pilhaDesfazer.slice(-n))); return; }
    catch(e){
      if(n<=0){ try{ localStorage.removeItem(CHAVE_HIST); }catch(_){} return; }
      n = n>1 ? Math.floor(n/2) : 0;
    }
  }
}

/* ============================================================
   ESCOLAS SECRETAS — cofres com senha (AES-GCM + PBKDF2)
   O conteúdo secreto sai do pacote para jogadores e vai num
   cofre. Sem a senha não há nome, nó nem contagem visível.
   ============================================================ */
const codif = new TextEncoder(), decodif = new TextDecoder();
function b64(bytes){
  let s = '';
  for(let i=0; i<bytes.length; i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000));
  return btoa(s);
}
function deB64(str){ const s = atob(str); const u = new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i] = s.charCodeAt(i); return u; }
const criptoOk = () => !!(window.crypto && crypto.subtle);

// senha falada na mesa: ignora maiúsculas, acentos e espaços sobrando
async function derivar(senha, salt){
  const base = await crypto.subtle.importKey('raw', codif.encode(norm(senha)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'},
                                 base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function trancar(obj, senha){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const k = await derivar(senha, salt);
  const dados = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, k, codif.encode(JSON.stringify(obj))));
  return {salt:b64(salt), iv:b64(iv), dados:b64(dados)};
}
async function abrirCofre(cofre, senha){
  try{
    const k = await derivar(senha, deB64(cofre.salt));
    const bytes = await crypto.subtle.decrypt({name:'AES-GCM', iv:deB64(cofre.iv)}, k, deB64(cofre.dados));
    return JSON.parse(decodif.decode(bytes));
  }catch(e){ return null; }
}

/* ---------- pacote para jogadores ---------- */
function semSenhas(a){
  a.senha = '';
  a.nodes.forEach(n=>{ if(n.escola) n.escola.senha = ''; });
  return a;
}
async function montarPacote(){
  indexar();
  const b = clone(bib());
  const fora = [], unidades = [];
  // 1) ramos secretos (os mais internos primeiro)
  for(const a of b.arvores){
    const entradas = a.nodes.filter(n=>n.escola && n.escola.secreta)
      .map(n=>({n, membros:membrosDaEscola(n.id)}))
      .sort((x,y)=>x.membros.length - y.membros.length);
    for(const {n, membros} of entradas){
      const presentes = new Set(a.nodes.map(x=>x.id));
      const ids = membros.filter(id=>presentes.has(id));
      if(!ids.length) continue;
      const nodes = a.nodes.filter(x=>ids.includes(x.id)).map(x=>{ const c = clone(x); if(c.escola) c.escola.senha = ''; return c; });
      a.nodes = a.nodes.filter(x=>!ids.includes(x.id));
      if(!n.escola.senha.trim()){ fora.push(`escola “${n.escola.nome}” (sem senha)`); continue; }
      // escola secreta dentro de outra escola secreta: só abre depois da de fora
      const dentro = entradas.filter(o=>o.n!==n && o.membros.includes(n.id)).sort((x,y)=>x.membros.length - y.membros.length)[0];
      unidades.push({id:n.id, senha:n.escola.senha, nodes, conteudo:{tipo:'ramo', arvore:a.id, dentro: dentro ? dentro.n.id : null, nodes}});
    }
  }
  // 2) árvores secretas
  const visiveis = [];
  for(const a of b.arvores){
    if(!a.secreta){ visiveis.push(semSenhas(a)); continue; }
    if(!a.senha.trim()){ fora.push(`árvore “${a.nome}” (sem senha)`); continue; }
    const arv = semSenhas(clone(a));
    unidades.push({id:a.id, senha:a.senha, nodes:arv.nodes, conteudo:{tipo:'arvore', arvore:arv}});
  }
  // 3) tipos de ponto, naturezas e usos que só aparecem em segredo viajam dentro do segredo
  const usa = nodes => {
    const s = {pool:new Set(), nat:new Set(), uso:new Set()};
    nodes.forEach(n=>{ n.graus.forEach(g=>Object.keys(g.custos).forEach(k=>s.pool.add(k))); if(n.natureza) s.nat.add(n.natureza); n.usos.forEach(u=>s.uso.add(u)); });
    return s;
  };
  const vis = usa(visiveis.flatMap(a=>a.nodes)), seg = usa(unidades.flatMap(u=>u.nodes));
  const publico = (id, t) => vis[t].has(id) || !seg[t].has(id);
  const pools = b.pools.filter(p=>publico(p.id, 'pool'));
  if(!pools.length) pools.push(b.pools[0]);
  const naturezas = b.naturezas.filter(t=>publico(t.id, 'nat'));
  const usos = b.usos.filter(u=>publico(u.id, 'uso'));
  const cofres = [...b.cofres];                 // cofres que este navegador recebeu e não abriu
  for(const u of unidades){
    const s = usa(u.nodes);
    u.conteudo.defs = {
      pools: b.pools.filter(p=>s.pool.has(p.id) && !pools.includes(p)),
      naturezas: b.naturezas.filter(t=>s.nat.has(t.id) && !naturezas.includes(t)),
      usos: b.usos.filter(x=>s.uso.has(x.id) && !usos.includes(x))
    };
    cofres.push(Object.assign({id:u.id}, await trancar(u.conteudo, u.senha)));
  }
  return {
    pacote:{formato:FORMATO+'-pacote', versao:4, nome:b.nome, pools, naturezas, usos, tipos:b.tipos, arvores:visiveis, cofres},
    fora
  };
}

/* ---------- abrir escolas no navegador do jogador ---------- */
function aplicarCofre(cofre, conteudo){
  const b = bib();
  if(!conteudo || typeof conteudo!=='object') return false;
  let host = null;
  if(conteudo.tipo==='ramo'){
    host = b.arvores.find(a=>a.id===conteudo.arvore);
    if(!host || !Array.isArray(conteudo.nodes)) return false;                        // a árvore que recebe o ramo ainda está trancada
    if(conteudo.dentro && !host.nodes.some(n=>n.id===conteudo.dentro)) return false; // a escola de fora ainda está trancada
  }else if(conteudo.tipo!=='arvore' || !conteudo.arvore || typeof conteudo.arvore!=='object') return false;
  const d = conteudo.defs || {};
  (Array.isArray(d.pools) ? d.pools : []).forEach(p=>{ if(p && !b.pools.some(x=>x.id===p.id)) b.pools.push(p); });
  (Array.isArray(d.naturezas) ? d.naturezas : []).forEach(t=>{ if(t && !b.naturezas.some(x=>x.id===t.id)) b.naturezas.push(t); });
  (Array.isArray(d.usos) ? d.usos : []).forEach(u=>{ if(u && !b.usos.some(x=>x.id===u.id)) b.usos.push(u); });
  if(conteudo.tipo==='arvore'){
    if(!b.arvores.some(a=>a.id===conteudo.arvore.id)) b.arvores.push(conteudo.arvore);
  }else{
    const ids = new Set(host.nodes.map(n=>n.id));
    conteudo.nodes.forEach(n=>{ if(n && !ids.has(n.id)) host.nodes.push(n); });
  }
  b.cofres = b.cofres.filter(c=>c!==cofre);
  normalizarBiblioteca(b);
  doc.personagens.forEach(p=>normalizarPersonagem(p, b));
  return true;
}
// tenta as senhas guardadas neste navegador (útil quando chega um pacote novo)
async function reabrirGuardadas(){
  if(!criptoOk()) return [];
  const abertas = [];
  let progresso = true;
  while(progresso){
    progresso = false;
    for(const c of [...bib().cofres]){
      const s = senhas[c.id]; if(!s) continue;
      const conteudo = await abrirCofre(c, s);
      if(conteudo && aplicarCofre(c, conteudo)){ progresso = true; abertas.push(nomeDoConteudo(conteudo)); }
    }
  }
  return abertas;
}
function nomeDoConteudo(c){
  if(c.tipo==='arvore') return c.arvore.nome;
  const e = (c.nodes||[]).find(n=>n.escola);
  return e ? e.escola.nome : 'escola';
}
async function destrancarComSenha(senha){
  if(!criptoOk()) throw new Error('Este navegador não oferece criptografia nesta página.');
  const abertas = []; const pendentes = [];
  for(const c of [...bib().cofres]){
    const conteudo = await abrirCofre(c, senha);
    if(!conteudo) continue;
    senhas[c.id] = norm(senha);
    if(aplicarCofre(c, conteudo)) abertas.push({nome:nomeDoConteudo(conteudo), conteudo});
    else pendentes.push(nomeDoConteudo(conteudo));
  }
  if(abertas.length){ (await reabrirGuardadas()).forEach(n=>abertas.push({nome:n, conteudo:null})); }
  return {abertas, pendentes};
}

/* ============================================================
   GRAFO — índice global, requisitos, escolas e layout
   ============================================================ */
const porId = new Map();       // id -> nó (todas as árvores)
const arvDe = new Map();       // id do nó -> árvore
const filhosDe = new Map();    // id -> filhos na MESMA árvore
const dependentes = new Map(); // id -> nós de qualquer árvore que exigem este
let reqCache = new Map(), membrosCache = new Map(), altCache = new Map();

function indexar(){
  porId.clear(); arvDe.clear(); filhosDe.clear(); dependentes.clear();
  reqCache = new Map(); membrosCache = new Map(); altCache = new Map();
  for(const a of bib().arvores) for(const n of a.nodes){ porId.set(n.id, n); arvDe.set(n.id, a); filhosDe.set(n.id, []); dependentes.set(n.id, []); }
  for(const a of bib().arvores) for(const n of a.nodes){
    for(const pid of n.pais){
      if(!porId.has(pid)) continue;
      dependentes.get(pid).push(n);
      if(arvDe.get(pid)===a) filhosDe.get(pid).push(n);
    }
  }
}
const filhos = id => filhosDe.get(id) || [];
function paisNaArvore(n){ const a = arvDe.get(n.id); return n.pais.filter(pid=>porId.has(pid) && arvDe.get(pid)===a); }
function paisFora(n){ const a = arvDe.get(n.id); return n.pais.filter(pid=>!porId.has(pid) || arvDe.get(pid)!==a); }

// "anc" está acima de "id"? (inclui requisitos de outras árvores) — evita ciclos
function ehAncestral(anc, id, visto){
  visto = visto || new Set();
  const n = porId.get(id); if(!n) return false;
  for(const pid of n.pais){
    if(pid===anc) return true;
    if(!visto.has(pid)){ visto.add(pid); if(ehAncestral(anc, pid, visto)) return true; }
  }
  return false;
}

/* req(id): nós que TODO caminho até "id" obriga a pegar.
   Com E entram todos os requisitos; com OU, só o que é comum a todas as opções. */
function req(id, pilha){
  if(reqCache.has(id)) return reqCache.get(id);
  pilha = pilha || new Set();
  const n = porId.get(id);
  if(!n || pilha.has(id)) return new Set([id]);
  pilha.add(id);
  let r;
  if(!n.pais.length) r = new Set();
  else if(n.regra==='ou'){
    r = null;
    for(const pid of n.pais){
      const s = porId.has(pid) ? req(pid, pilha) : new Set();
      r = r ? new Set([...r].filter(x=>s.has(x))) : new Set(s);
    }
  }else{
    r = new Set();
    for(const pid of n.pais){ if(porId.has(pid)) for(const x of req(pid, pilha)) r.add(x); else r.add(pid); }
  }
  pilha.delete(id);
  r.add(id);
  reqCache.set(id, r);
  return r;
}

/* alternativas(id): cada jeito de chegar até "id", resumido pelos caminhos exclusivos
   que ele obriga a escolher ({grupo: nó}). Lista vazia = impossível de liberar.
   Quando há opções demais, o cálculo desiste e trata como possível (nunca acusa à toa). */
const LIMITE_ALT = 64;
function alternativas(id, pilha){
  if(altCache.has(id)) return altCache.get(id);
  const n = porId.get(id);
  if(!n) return [{}];
  pilha = pilha || new Set();
  if(pilha.has(id)) return [{}];
  pilha.add(id);
  const g = grupoEx(n);
  const proprio = g ? {[g]:id} : {};
  const juntar = (a, b) => { const r = Object.assign({}, a); for(const k in b){ if(k in r && r[k]!==b[k]) return null; r[k] = b[k]; } return r; };
  let res, estourou = false;
  if(!n.pais.length) res = [proprio];
  else if(n.regra==='ou'){
    res = [];
    for(const pid of n.pais){
      for(const alt of alternativas(pid, pilha)){ const j = juntar(proprio, alt); if(j) res.push(j); }
      if(res.length>LIMITE_ALT){ estourou = true; break; }
    }
  }else{
    res = [proprio];
    for(const pid of n.pais){
      const altsP = alternativas(pid, pilha), novo = [];
      for(const a of res) for(const b of altsP){ const j = juntar(a, b); if(j) novo.push(j); }
      res = novo;
      if(!res.length) break;
      if(res.length>LIMITE_ALT){ estourou = true; break; }
    }
  }
  if(estourou) res = [proprio];
  const vistos = new Set();
  res = res.filter(r=>{ const k = Object.keys(r).sort().map(x=>x+'='+r[x]).join('|'); if(vistos.has(k)) return false; vistos.add(k); return true; });
  pilha.delete(id);
  altCache.set(id, res);
  return res;
}

/* escola-ramo: o nó de entrada e tudo que só existe através dele */
function membrosDaEscola(eid){
  if(membrosCache.has(eid)) return membrosCache.get(eid);
  const a = arvDe.get(eid); if(!a) return [];
  const m = a.nodes.filter(n=>n.id===eid || req(n.id).has(eid)).map(n=>n.id);
  membrosCache.set(eid, m);
  return m;
}
function escolaDoNo(id){
  const a = arvDe.get(id); if(!a) return null;
  let melhor = null, tam = Infinity;
  for(const e of a.nodes){
    if(!e.escola) continue;
    const m = membrosDaEscola(e.id);
    if(m.includes(id) && m.length < tam){ melhor = e; tam = m.length; }
  }
  return melhor;
}
// o segredo (árvore ou escola-ramo) que esconde este nó, se houver
function segredoDe(id){
  const a = arvDe.get(id); if(!a) return null;
  if(a.secreta) return {tipo:'arvore', nome:a.nome};
  for(const e of a.nodes){
    if(e.escola && e.escola.secreta && membrosDaEscola(e.id).includes(id)) return {tipo:'ramo', nome:e.escola.nome};
  }
  return null;
}

/* ---------- layout radial por árvore ---------- */
const ANEL = 150;
// largura máxima do leque de filhos por profundidade: a raiz espalha em 360°
const LEQUE = [Math.PI*2, 1.90, 1.35, 1.10, 0.95, 0.85, 0.78, 0.72];
let pos = new Map();            // id -> {x, y, prof, principal}
let unicaRaiz = false;

function raioDe(n){ return (bib().tipos[n.tipo] || bib().tipos.pequeno).raio; }

function calcularLayout(a){
  pos = new Map();
  if(!a || !a.nodes.length) return pos;
  const meta = new Map(a.nodes.map(n=>[n.id, {prof:null, principal:null}]));
  const raizes = a.nodes.filter(n=>!paisNaArvore(n).length);
  const fila = [...raizes];
  raizes.forEach(r=>{ meta.get(r.id).prof = 0; });
  for(let i=0; i<fila.length; i++){
    const cur = fila[i];
    for(const c of filhos(cur.id)){
      const m = meta.get(c.id);
      if(m.prof!==null) continue;
      m.prof = meta.get(cur.id).prof + 1; m.principal = cur.id; fila.push(c);
    }
  }
  // nós presos em ciclo (dados tortos) aparecem como raízes soltas
  a.nodes.forEach(n=>{ const m = meta.get(n.id); if(m.prof===null){ m.prof = 0; m.principal = null; } });
  const primarios = new Map(a.nodes.map(n=>[n.id, []]));
  a.nodes.forEach(n=>{ const m = meta.get(n.id); if(m.principal) primarios.get(m.principal).push(n); });
  const rs = a.nodes.filter(n=>meta.get(n.id).principal===null);

  const pesos = new Map();
  const peso = n => {
    if(pesos.has(n.id)) return pesos.get(n.id);
    pesos.set(n.id, 1);
    const k = primarios.get(n.id);
    const v = k.length ? k.reduce((s,c)=>s+peso(c), 0) : 1;
    pesos.set(n.id, v); return v;
  };
  const fatia = n => Math.pow(peso(n), 0.55);
  unicaRaiz = rs.length===1;
  const raio = prof => (unicaRaiz ? prof : prof+1) * ANEL * (1 + Math.max(0, prof-2)*0.05);

  const colocar = (n, a0, a1, prof) => {
    const s = semente(n.id);
    const meio = (a0+a1)/2;
    const ang = meio + (a1-a0)*(s-.5)*0.10;
    const r = raio(prof) + (prof>0 ? (s-.5)*18 : 0);
    pos.set(n.id, {x:Math.cos(ang)*r, y:Math.sin(ang)*r, prof, principal:meta.get(n.id).principal});
    const k = primarios.get(n.id);
    if(!k.length) return;
    const larg = Math.min(a1-a0, LEQUE[Math.min(prof, LEQUE.length-1)]);
    const tot = k.reduce((acc,c)=>acc+fatia(c), 0) || 1;
    let ai = meio - larg/2;
    for(const c of k){ const f = larg*fatia(c)/tot; colocar(c, ai, ai+f, prof+1); ai += f; }
  };
  if(unicaRaiz) colocar(rs[0], -Math.PI/2, Math.PI*1.5, 0);
  else{
    const tot = rs.reduce((s,r)=>s+fatia(r), 0) || 1;
    let ai = -Math.PI/2;
    for(const r of rs){ const f = Math.PI*2*fatia(r)/tot; colocar(r, ai, ai+f, 0); ai += f; }
  }
  return pos;
}
// nós de uma árvore que nenhum caminho alcança a partir das raízes (ciclos)
function nosEmCiclo(a){
  const alcancados = new Set();
  const fila = a.nodes.filter(n=>!paisNaArvore(n).length);
  fila.forEach(n=>alcancados.add(n.id));
  for(let i=0; i<fila.length; i++) for(const c of filhos(fila[i].id)) if(!alcancados.has(c.id)){ alcancados.add(c.id); fila.push(c); }
  return a.nodes.filter(n=>!alcancados.has(n.id));
}

/* ============================================================
   REGRAS DE ALOCAÇÃO (por personagem)
   alocados = {idDoNó: grau}. Ids desconhecidos (escola ainda
   trancada neste navegador) ficam guardados sem contar.
   ============================================================ */
const conjuntoAlocado = p => new Set(Object.keys(p.alocados));
const grupoEx = n => norm(n.exclusivo);
function equipado(p, id){ const a = arvDe.get(id); return !!a && p.arvores.includes(a.id); }
function satisfeito(n, conj){
  if(!n.pais.length) return true;
  return n.regra==='ou' ? n.pais.some(x=>conj.has(x)) : n.pais.every(x=>conj.has(x));
}
function fechadoPor(p, n){
  const g = grupoEx(n); if(!g) return null;
  for(const id in p.alocados){
    if(id===n.id) continue;
    const m = porId.get(id);
    if(m && grupoEx(m)===g) return m;
  }
  return null;
}
const custoGrau = (n, k) => (n.graus[k-1] && n.graus[k-1].custos) || {};
function gastos(p, poolId){
  let s = 0;
  for(const id in p.alocados){
    const n = porId.get(id); if(!n) continue;
    const g = Math.min(p.alocados[id], n.graus.length);
    for(let k=0; k<g; k++) s += n.graus[k].custos[poolId] || 0;
  }
  return s;
}
const restantes = (p, poolId) => (p.pontos[poolId] || 0) - gastos(p, poolId);
function podePagarGrau(p, n, k){ const c = custoGrau(n, k); return bib().pools.every(pl=>(c[pl.id]||0) <= restantes(p, pl.id)); }
function faltaTexto(p, n, k){
  const c = custoGrau(n, k);
  const f = bib().pools.filter(pl=>(c[pl.id]||0) > restantes(p, pl.id));
  return f.length ? 'Faltam pontos: ' + f.map(x=>x.nome).join(', ') + '.' : '';
}
function custoTexto(custos){
  const partes = bib().pools.filter(pl=>custos[pl.id]>0).map(pl=>`${pl.nome}: ${custos[pl.id]}`);
  return partes.length ? partes.join(' · ') : 'sem custo';
}
function estadoNo(p, n){
  if((p.alocados[n.id]||0) > 0) return 'on';
  if(!equipado(p, n.id)) return 'bloq';
  if(fechadoPor(p, n)) return 'fechado';
  if(!satisfeito(n, conjuntoAlocado(p))) return 'bloq';
  return podePagarGrau(p, n, 1) ? 'disp' : 'caro';
}
// dos alocados, quais continuam presos a alguma raiz (ponto fixo por causa do OU)
function sustentados(conj){
  const ok = new Set([...conj].filter(id=>!porId.has(id)));
  let mudou = true;
  while(mudou){
    mudou = false;
    for(const id of conj){
      if(ok.has(id)) continue;
      const n = porId.get(id); if(!n) continue;
      if(satisfeito(n, ok)){ ok.add(id); mudou = true; }
    }
  }
  return ok;
}
function podeSoltar(p, id){ const c = conjuntoAlocado(p); c.delete(id); return sustentados(c).size === c.size; }
function podarPersonagem(p){
  for(const id of Object.keys(p.alocados)){
    const n = porId.get(id);
    if(!n) continue;
    if(!equipado(p, id)){ delete p.alocados[id]; continue; }
    if(p.alocados[id] > n.graus.length) p.alocados[id] = n.graus.length;
  }
  const vistos = new Set();
  for(const id of Object.keys(p.alocados)){
    const n = porId.get(id); if(!n) continue;
    const g = grupoEx(n); if(!g) continue;
    if(vistos.has(g)) delete p.alocados[id]; else vistos.add(g);
  }
  const ok = sustentados(conjuntoAlocado(p));
  for(const id of Object.keys(p.alocados)) if(!ok.has(id)) delete p.alocados[id];
}
function podarTodos(){ indexar(); doc.personagens.forEach(podarPersonagem); }

// "Exige Corpo e Mente." — com a árvore de origem quando vem de fora
function exigencia(n){
  if(!n.pais.length) return '';
  const a = arvDe.get(n.id);
  const nomes = n.pais.map(pid=>{
    const m = porId.get(pid);
    if(!m) return 'um requisito desconhecido';
    const am = arvDe.get(pid);
    return am===a ? m.nome : `${m.nome} (${nomeCat(am.categoria)} · ${am.nome})`;
  });
  if(nomes.length===1) return 'Exige ' + nomes[0] + '.';
  const lig = n.regra==='ou' ? ' ou ' : ' e ';
  return 'Exige ' + nomes.slice(0,-1).join(', ') + lig + nomes[nomes.length-1] + '.';
}
function colegasExclusivos(n){
  const g = grupoEx(n); if(!g) return [];
  const out = [];
  for(const [id, m] of porId) if(id!==n.id && grupoEx(m)===g) out.push(m);
  return out;
}

/* ---------- alocar / soltar ---------- */
const dormentes = p => Object.keys(p.alocados).filter(id=>!porId.has(id));
async function podeSoltarComTrancados(p){
  if(!dormentes(p).length) return true;
  return confirmar('Soltar nódulo', 'Este personagem tem nódulos numa escola que está trancada neste navegador. Se algum deles depender do que você vai soltar, ele será solto quando a escola abrir. Soltar mesmo assim?', 'Soltar', true);
}
async function subirGrau(id){
  const p = personagemAtual(); const n = porId.get(id); if(!p || !n) return;
  const g = p.alocados[id] || 0, max = n.graus.length;
  if(g===0){
    const est = estadoNo(p, n);
    if(est==='bloq') return aviso(!equipado(p, id) ? 'Esta árvore não está equipada.' : (exigencia(n) || 'Este nódulo ainda não está liberado.'));
    if(est==='fechado') return aviso('Caminho fechado: você já escolheu “' + fechadoPor(p, n).nome + '”.');
    if(est==='caro') return aviso(faltaTexto(p, n, 1));
    registrar('alocar ' + n.nome);
    p.alocados[id] = 1;
    if(max>1) aviso(`${n.nome}: grau 1 de ${max}`, 'ok');
  }else if(g<max){
    if(!podePagarGrau(p, n, g+1)) return aviso(faltaTexto(p, n, g+1));
    registrar('subir grau de ' + n.nome);
    p.alocados[id] = g+1;
    aviso(`${n.nome}: grau ${g+1} de ${max}`, 'ok');
  }else{
    // já aprendido até o fim: o clique não desfaz nada (era fácil esquecer uma habilidade sem querer).
    // Desfazer é só com o botão direito ou pelo botão do painel.
    return aviso(max>1 ? `${n.nome} já está no grau máximo. Para descer um grau, use o botão direito.`
                       : `${n.nome} já está aprendida. Para esquecer, use o botão direito.`);
  }
  salvar(); desenhar(); pintarPainel(); pintarAbas();
}
async function descerGrau(id){
  const p = personagemAtual(); const n = porId.get(id); if(!p || !n) return;
  const g = p.alocados[id] || 0; if(!g) return;
  if(g>1){
    registrar('descer grau de ' + n.nome);
    p.alocados[id] = g-1;
    aviso(`${n.nome}: grau ${g-1} de ${n.graus.length}`, 'ok');
  }else{
    if(!podeSoltar(p, id)) return aviso('Solte primeiro os nódulos que dependem deste.');
    if(!(await podeSoltarComTrancados(p))) return;
    registrar('soltar ' + n.nome);
    delete p.alocados[id];
  }
  salvar(); desenhar(); pintarPainel(); pintarAbas();
}

/* ============================================================
   DESENHO — dois temas: tinta sobre papel / pedra e ouro
   ============================================================ */
const COR_T = {tinta:'#1F1B16', papel:'#ECE4D0', papelNo:'#F3EDDF', verm:'#B23A2E'};
const COR_P = {ouro:'#E3B55E', ouroEsc:'#C99A45', ouroClaro:'#F6E2AE', bronze:'#8A7447', bronzeClaro:'#B39258',
               encaixe:'#1B1813', fundoEnc:'#0F0E0B', canal:'#4B4334', glifoOn:'#F1D9A2', glifoOff:'#7A6B52', verm:'#E0766A'};
const temaAtual = () => document.documentElement.getAttribute('data-tema')==='tinta' ? 'tinta' : 'pedra';
function temaResolvido(){
  if(ui.tema==='tinta' || ui.tema==='pedra') return ui.tema;
  return (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'tinta' : 'pedra';
}

/* ---------- cor ---------- */
function rgb(h){ h = String(h||'').replace('#',''); if(h.length===3) h = h.split('').map(c=>c+c).join(''); const v = parseInt(h,16); return isNaN(v) ? [128,128,128] : [(v>>16)&255,(v>>8)&255,v&255]; }
function mix(a, b, t){ const x = rgb(a), y = rgb(b); return '#' + x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join(''); }
function claro(h){ const [r,g,b] = rgb(h); return (0.299*r + 0.587*g + 0.114*b)/255 > .6; }

/* ---------- formas ---------- */
function poli(r, n, rot){ const p = []; for(let k=0;k<n;k++){ const a = rot + 2*Math.PI*k/n; p.push(`${f1(Math.cos(a)*r)},${f1(Math.sin(a)*r)}`); } return p.join(' '); }
function estrelaP(ro, ri, n, rot){
  rot = rot ?? -Math.PI/2; const p = [];
  for(let k=0;k<2*n;k++){ const r = k%2 ? ri : ro, a = rot + Math.PI*k/n; p.push(`${f1(Math.cos(a)*r)},${f1(Math.sin(a)*r)}`); }
  return p.join(' ');
}
function lotusD(r, n){
  n = n || 8; let d = '';
  const pt = (a, rr) => [Math.cos(a)*rr, Math.sin(a)*rr];
  for(let k=0;k<n;k++){
    const a0 = 2*Math.PI*k/n - Math.PI/2 - Math.PI/n, a1 = a0 + 2*Math.PI/n, am = (a0+a1)/2;
    const b0 = pt(a0, r*.66), tip = pt(am, r*1.2), b1 = pt(a1, r*.66);
    const c0 = pt(a0+(am-a0)*.2, r*1.04), c1 = pt(a1-(a1-am)*.2, r*1.04);
    d += (k===0 ? `M${f1(b0[0])},${f1(b0[1])}` : '') +
         ` Q${f1(c0[0])},${f1(c0[1])} ${f1(tip[0])},${f1(tip[1])} Q${f1(c1[0])},${f1(c1[1])} ${f1(b1[0])},${f1(b1[1])}`;
  }
  return d + ' Z';
}
const escudoD = r => `M${f1(-r*.86)},${f1(-r*.8)} L${f1(r*.86)},${f1(-r*.8)} Q${f1(r*.95)},${f1(r*.32)} 0,${f1(r*1.05)} Q${f1(-r*.95)},${f1(r*.32)} ${f1(-r*.86)},${f1(-r*.8)} Z`;
const laminaD = r => `M0,${f1(-r*1.12)} Q${f1(r*1.2)},0 0,${f1(r*1.12)} Q${f1(-r*1.2)},0 0,${f1(-r*1.12)} Z`;
function formaEl(forma, r, attrs){
  switch(forma){
    case 'losango':  return el('polygon', Object.assign({points:poli(r*1.14, 4, -Math.PI/2)}, attrs));
    case 'hexagono': return el('polygon', Object.assign({points:poli(r*1.07, 6, -Math.PI/2)}, attrs));
    case 'octogono': return el('polygon', Object.assign({points:poli(r*1.05, 8, Math.PI/8)}, attrs));
    case 'lotus':    return el('path', Object.assign({d:lotusD(r)}, attrs));
    case 'selo':     return el('rect', Object.assign({x:f1(-r*.9), y:f1(-r*.9), width:f1(r*1.8), height:f1(r*1.8), rx:f1(Math.max(2, r*.18))}, attrs));
    case 'escudo':   return el('path', Object.assign({d:escudoD(r)}, attrs));
    case 'lamina':   return el('path', Object.assign({d:laminaD(r)}, attrs));
    case 'estrela':  return el('polygon', Object.assign({points:estrelaP(r*1.15, r*.62, 8)}, attrs));
    default:         return el('circle', Object.assign({r:f1(r)}, attrs));
  }
}
function iconeForma(forma){   // miniatura para os botões do editor
  const s = document.createElementNS(SVGNS, 'svg'); s.setAttribute('viewBox', '-16 -16 32 32');
  s.appendChild(formaEl(forma, 10.5, {fill:'none', stroke:'currentColor', 'stroke-width':1.6}));
  return s.outerHTML;
}
// mancha de aquarela: contorno irregular, sempre igual para o mesmo nó
function blobD(cx, cy, r, chave){
  const n = 8, pts = [];
  for(let k=0;k<n;k++){
    const a = 2*Math.PI*k/n + (semente(chave+'a'+k)-.5)*.36;
    const rr = r*(1 + (semente(chave+'r'+k)-.5)*.4);
    pts.push([cx+Math.cos(a)*rr, cy+Math.sin(a)*rr]);
  }
  const m = (p,q) => [(p[0]+q[0])/2, (p[1]+q[1])/2];
  let s = m(pts[0], pts[1]); let d = `M${Math.round(s[0])},${Math.round(s[1])}`;
  for(let i=0;i<n;i++){ const p1 = pts[(i+1)%n], p2 = pts[(i+2)%n], e = m(p1, p2); d += ` Q${Math.round(p1[0])},${Math.round(p1[1])} ${Math.round(e[0])},${Math.round(e[1])}`; }
  return d + ' Z';
}
// pincelada: faixa que afina do pai para o filho
function traco(x1,y1,w1,x2,y2,w2,curva){
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1;
  const nx=-dy/L, ny=dx/L;
  const mx=(x1+x2)/2+nx*curva, my=(y1+y2)/2+ny*curva, wm=(w1+w2)/2*1.08;
  const p=(x,y)=>`${f1(x)},${f1(y)}`;
  return `M${p(x1+nx*w1,y1+ny*w1)} Q${p(mx+nx*wm,my+ny*wm)} ${p(x2+nx*w2,y2+ny*w2)}`
       + ` L${p(x2-nx*w2,y2-ny*w2)} Q${p(mx-nx*wm,my-ny*wm)} ${p(x1-nx*w1,y1-ny*w1)} Z`;
}
function glifoEl(txt, r, cor, op){
  const t = el('text', {class:'glifo', y:f1(r*.04), fill:cor, opacity:op, 'font-size':f1(Math.max(10, r*(txt.length>1 ? .78 : 1.08)))});
  t.textContent = txt; return t;
}

/* ---------- câmera ---------- */
let cam = {x:0, y:0, k:1};
function aplicarCam(){ $('#camara').setAttribute('transform', `translate(${f1(cam.x)},${f1(cam.y)}) scale(${cam.k.toFixed(3)})`); }
function centralizar(){
  const t = $('#tela').getBoundingClientRect();
  if(!pos.size){ cam = {x:t.width/2, y:t.height/2, k:1}; return aplicarCam(); }
  let x0=1e9, y0=1e9, x1=-1e9, y1=-1e9;
  pos.forEach((q,id)=>{ const n = porId.get(id); const r = (n ? raioDe(n) : 10) + 44;
    x0=Math.min(x0,q.x-r); y0=Math.min(y0,q.y-r); x1=Math.max(x1,q.x+r); y1=Math.max(y1,q.y+r); });
  extrasLimite.forEach(e=>{ x0=Math.min(x0,e.x0); y0=Math.min(y0,e.y0); x1=Math.max(x1,e.x1); y1=Math.max(y1,e.y1); });
  const k = Math.min(t.width/(x1-x0||1), (t.height-60)/(y1-y0||1), 1.6) * 0.9;
  cam.k = Math.max(.12, k);
  cam.x = t.width/2 - ((x0+x1)/2)*cam.k;
  cam.y = t.height/2 + 18 - ((y0+y1)/2)*cam.k;
  aplicarCam();
}
function zoomPara(k, cx, cy){
  const t = $('#tela').getBoundingClientRect();
  cx = cx ?? t.width/2; cy = cy ?? t.height/2;
  const novo = Math.min(2.6, Math.max(.12, k));
  cam.x = cx - (cx-cam.x)*(novo/cam.k);
  cam.y = cy - (cy-cam.y)*(novo/cam.k);
  cam.k = novo; aplicarCam();
}
function focarNo(id){
  const q = pos.get(id); if(!q) return;
  const t = $('#tela').getBoundingClientRect();
  cam.x = t.width/2 - q.x*cam.k; cam.y = t.height/2 - q.y*cam.k; aplicarCam();
}

/* ---------- desenho principal ---------- */
let raioProf = p => (p+1)*ANEL;
let extrasLimite = [];   // nomes de escola, para caber na hora de centralizar
function desenhar(){
  indexar();
  const a = arvoreVisivel();
  const g = {f:$('#fundoCam'), te:$('#territorios'), au:$('#auras'), tr:$('#tracos'), no:$('#nos')};
  for(const k in g) g[k].textContent = '';
  $('#defsDin').textContent = '';
  atualizarMarca(a);
  pintarFiltroNat(a);
  if(!a || !a.nodes.length){ pos = new Map(); mostrarVazio(a); esconderDica(); return; }
  $('#nada').classList.remove('on');
  calcularLayout(a);
  raioProf = p => (unicaRaiz ? p : p+1) * ANEL * (1 + Math.max(0, p-2)*0.05);
  const tema = temaAtual();
  const jogador = ui.modo==='jogador';
  const p = jogador ? personagemAtual() : null;
  const est = new Map(a.nodes.map(n=>[n.id, jogador ? estadoNo(p, n) : 'mestre']));
  const busca = norm(filtro);
  const bate = n => (!busca || norm(n.nome).includes(busca) || norm(n.desc).includes(busca))
                    && (!filtroNat.size || filtroNat.has(n.natureza));

  desenharFundo(g.f, a, tema);
  extrasLimite = [];
  for(const n of a.nodes) if(n.escola) desenharTerritorio(g.te, n, tema);
  for(const n of a.nodes) desenharAura(g.au, n, est.get(n.id), tema, bate(n));
  for(const n of a.nodes){
    const q = pos.get(n.id);
    for(const pid of paisNaArvore(n)) if(pid!==q.principal) ligacaoExtra(g.tr, pid, n, est, tema);
  }
  for(const n of a.nodes){ const q = pos.get(n.id); if(q.principal) desenharAresta(g.tr, q.principal, n, est, tema); }
  for(const n of a.nodes) desenharNo(g.no, n, est.get(n.id), tema, p, bate(n), busca);
  revalidarPaire();
}

function desenharFundo(g, a, tema){
  let maxP = 0; pos.forEach(q=>{ if(q.prof>maxP) maxP = q.prof; });
  const ini = unicaRaiz ? 1 : 0;
  if(tema==='tinta'){
    for(let k=ini;k<=maxP;k++) g.appendChild(el('circle', {r:f1(raioProf(k)), fill:'none', stroke:'rgba(31,27,22,.08)', 'stroke-width':1, 'stroke-dasharray':'2 7'}));
    return;
  }
  for(let k=ini;k<=maxP;k++){
    const R = raioProf(k);
    g.appendChild(el('circle', {r:f1(R), fill:'none', stroke:'#27251F', 'stroke-width':1}));
    for(let i=0;i<24;i++){
      const an = i*Math.PI/12, r2 = R + (i%2 ? 3 : 6);
      g.appendChild(el('line', {x1:f1(Math.cos(an)*R), y1:f1(Math.sin(an)*R), x2:f1(Math.cos(an)*r2), y2:f1(Math.sin(an)*r2), stroke:'#34312A', 'stroke-width':1}));
    }
  }
  let x0=1e9, y0=1e9, x1=-1e9, y1=-1e9;
  pos.forEach(q=>{ x0=Math.min(x0,q.x); y0=Math.min(y0,q.y); x1=Math.max(x1,q.x); y1=Math.max(y1,q.y); });
  x0-=260; y0-=260; x1+=260; y1+=260;
  const qtd = Math.min(280, Math.round((x1-x0)*(y1-y0)/9000));
  for(let i=0;i<qtd;i++){
    const s = k => semente(a.id+'e'+i+k);
    g.appendChild(el('circle', {cx:f1(x0+s('x')*(x1-x0)), cy:f1(y0+s('y')*(y1-y0)), r:f1(.5+s('r')*1), fill:'#D6CDB5', opacity:f1(.12+s('o')*.35)}));
  }
}

function desenharTerritorio(g, entrada, tema){
  const membros = membrosDaEscola(entrada.id).filter(id=>pos.has(id));
  if(!membros.length) return;
  const cor = entrada.escola.cor || COR_ESCOLA;
  const conj = new Set(membros);
  const grp = el('g', {opacity: tema==='tinta' ? .1 : .13});
  for(const id of membros){
    const q = pos.get(id), n = porId.get(id);
    grp.appendChild(el('circle', {cx:f1(q.x), cy:f1(q.y), r:f1(raioDe(n)+30), fill:cor}));
    if(q.principal && conj.has(q.principal)){
      const s = pos.get(q.principal);
      grp.appendChild(el('line', {x1:f1(s.x), y1:f1(s.y), x2:f1(q.x), y2:f1(q.y), stroke:cor, 'stroke-width':54, 'stroke-linecap':'round'}));
    }
  }
  g.appendChild(grp);
  // o nome fica além do nó mais distante do centro, na direção do ramo
  let longe = null, dmax = -1;
  membros.forEach(id=>{ const q = pos.get(id), d = Math.hypot(q.x, q.y); if(d>dmax){ dmax = d; longe = {q, n:porId.get(id)}; } });
  const tam = tema==='tinta' ? 30 : 24;
  const L = Math.hypot(longe.q.x, longe.q.y);
  const ux = L>1 ? longe.q.x/L : 0, uy = L>1 ? longe.q.y/L : -1;
  const dist = raioDe(longe.n) + 40;
  const tx = longe.q.x + ux*dist, ty = longe.q.y + uy*dist + tam*.35;
  const anc = ux > .35 ? 'start' : ux < -.35 ? 'end' : 'middle';
  const t = el('text', {class:'nomeesc', x:f1(tx), y:f1(ty), fill:cor, opacity: tema==='tinta' ? .72 : .62, 'font-size':tam, 'text-anchor':anc});
  t.textContent = entrada.escola.nome;
  g.appendChild(t);
  const w = entrada.escola.nome.length*tam*.52;
  const x0 = anc==='start' ? tx : anc==='end' ? tx - w : tx - w/2;
  extrasLimite.push({x0, y0:ty - tam, x1:x0 + w + 30, y1:ty + 6});
  if(entrada.escola.secreta && ui.modo==='mestre'){
    let wr = 0; try{ wr = t.getComputedTextLength(); }catch(e){}
    if(!wr) wr = w;
    const fim = anc==='start' ? tx + wr : anc==='end' ? tx : tx + wr/2;
    seloSecreto(g, fim + 16, ty - tam*.34, tema);
  }
}
function seloSecreto(g, x, y, tema){
  const s = 18;
  g.appendChild(el('rect', {x:f1(x-s/2), y:f1(y-s/2), width:s, height:s, rx:2.5,
    fill: tema==='tinta' ? COR_T.verm : 'none', stroke: tema==='tinta' ? 'none' : COR_P.ouro, 'stroke-width':1.2}));
  const t = el('text', {class:'glifo', x:f1(x), y:f1(y+.5), fill: tema==='tinta' ? '#F3E9D6' : COR_P.ouro, 'font-size':13});
  t.textContent = '秘'; g.appendChild(t);
}

// um degradê radial por cor de natureza (criado sob demanda a cada desenho)
function gradAura(cor){
  const id = 'aura' + cor.replace(/[^0-9a-f]/gi, '');
  const defs = $('#defsDin');
  if(!defs.querySelector('#' + id)){
    const g = el('radialGradient', {id});
    [[0,.72],[.36,.44],[.66,.15],[1,0]].forEach(([o, op])=>g.appendChild(el('stop', {offset:o, 'stop-color':cor, 'stop-opacity':op})));
    defs.appendChild(g);
  }
  return `url(#${id})`;
}
function desenharAura(g, n, e, tema, bate){
  const q = pos.get(n.id), r = raioDe(n), nat = naturezaPorId(n.natureza);
  const grp = el('g', {transform:`translate(${f1(q.x)},${f1(q.y)})`, opacity: bate ? 1 : .15});
  if(tema==='tinta'){
    if(!nat) return;
    const [o1, o2] = (e==='on'||e==='mestre') ? [.22,.2] : e==='disp' ? [.15,.13] : e==='caro' ? [.12,.1] : e==='bloq' ? [.08,.07] : [.05,.04];
    grp.appendChild(el('path', {d:blobD(0, 0, Math.max(r*2.05, r+15), n.id+'a'), fill:nat.cor, opacity:o1}));
    grp.appendChild(el('path', {d:blobD(1.5, -1, Math.max(r*1.45, r+8), n.id+'b'), fill:nat.cor, opacity:o2}));
  }else{
    // pedra: brilho em degradê (forte em todos, mais forte no alocado) + anel nítido
    const cor = nat ? nat.cor : COR_P.ouro;
    const ra = r + (n.tipo==='keystone' ? 16 : 6);
    const rg = n.tipo==='keystone' ? r*2.1 + 26 : r*2.4 + 16;
    const brilho = nat
      ? {on:1, mestre:.85, disp:.62, caro:.5, bloq:.42, fechado:.14}[e]
      : {on:.9, disp:.28, caro:.2}[e] || 0;
    if(brilho) grp.appendChild(el('circle', {r:f1(e==='on' ? rg*1.08 : rg), fill:gradAura(cor), opacity:brilho}));
    if(e==='on') grp.appendChild(el('circle', {r:ra, fill:'none', stroke:cor, 'stroke-width':1.8, opacity: nat ? .9 : .6}));
    else if(e==='mestre'){ if(nat) grp.appendChild(el('circle', {r:ra, fill:'none', stroke:cor, 'stroke-width':1.3, opacity:.65})); }
    else if(e==='disp') grp.appendChild(el('circle', {r:ra, fill:'none', stroke:cor, 'stroke-width':1.6, 'stroke-dasharray':'3 3'}));
    else if(e==='caro') grp.appendChild(el('circle', {r:ra, fill:'none', stroke:cor, 'stroke-width':1.3, 'stroke-dasharray':'1 3', opacity:.8}));
    else if(nat) grp.appendChild(el('circle', {r:ra, fill:'none', stroke:cor, 'stroke-width':1.1, opacity: e==='fechado' ? .2 : .5}));
  }
  if(grp.childNodes.length) g.appendChild(grp);
}

function desenharAresta(g, pid, n, est, tema){
  const a = pos.get(pid), b = pos.get(n.id), pn = porId.get(pid);
  const ep = est.get(pid), eb = est.get(n.id);
  const ligado = ep==='on' && eb==='on';
  const perto = eb==='disp' || eb==='caro';
  const L = Math.hypot(b.x-a.x, b.y-a.y) || 1;
  const curva = (semente(n.id+'t')-.5)*L*0.12;
  if(tema==='tinta'){
    const d = traco(a.x, a.y, Math.max(3.4, raioDe(pn)*.32), b.x, b.y, Math.max(1.8, raioDe(n)*.24), curva);
    const op = ligado ? .9 : eb==='mestre' ? .62 : perto ? .28 : .13;
    g.appendChild(el('path', {d, fill:COR_T.tinta, opacity:op}));
    return;
  }
  const nx = -(b.y-a.y)/L, ny = (b.x-a.x)/L;
  const mx = (a.x+b.x)/2 + nx*curva, my = (a.y+b.y)/2 + ny*curva;
  const cam_ = (k) => `M${f1(a.x+nx*k)},${f1(a.y+ny*k)} Q${f1(mx+nx*k)},${f1(my+ny*k)} ${f1(b.x+nx*k)},${f1(b.y+ny*k)}`;
  if(ligado){
    g.appendChild(el('path', {d:cam_(0), fill:'none', stroke:COR_P.ouro, 'stroke-width':12, opacity:.08, 'stroke-linecap':'round'}));
    g.appendChild(el('path', {d:cam_(0), fill:'none', stroke:COR_P.ouroEsc, 'stroke-width':5, 'stroke-linecap':'round'}));
    g.appendChild(el('path', {d:cam_(0), fill:'none', stroke:COR_P.ouroClaro, 'stroke-width':1.4, 'stroke-linecap':'round'}));
  }else if(eb==='mestre'){
    g.appendChild(el('path', {d:cam_(0), fill:'none', stroke:COR_P.bronze, 'stroke-width':2.4, 'stroke-linecap':'round', opacity:.9}));
  }else{
    const s = perto ? 2.1 : 1.8, cor = perto ? '#6B5D44' : COR_P.canal;
    for(const k of [-s, s]) g.appendChild(el('path', {d:cam_(k), fill:'none', stroke:cor, 'stroke-width':1}));
  }
}
function ligacaoExtra(g, pid, n, est, tema){
  const a = pos.get(pid), b = pos.get(n.id); if(!a || !b) return;
  const ligado = est.get(pid)==='on' && est.get(n.id)==='on';
  const dx = b.x-a.x, dy = b.y-a.y, L = Math.hypot(dx,dy) || 1;
  const lado = semente(n.id+pid) > .5 ? 1 : -1;
  const cx = (a.x+b.x)/2 + (-dy/L)*L*0.15*lado, cy = (a.y+b.y)/2 + (dx/L)*L*0.15*lado;
  const cor = tema==='tinta' ? (ligado ? COR_T.tinta : 'rgba(31,27,22,.32)') : (ligado ? COR_P.ouro : 'rgba(233,227,214,.24)');
  g.appendChild(el('path', {d:`M${f1(a.x)},${f1(a.y)} Q${f1(cx)},${f1(cy)} ${f1(b.x)},${f1(b.y)}`, fill:'none', stroke:cor,
    'stroke-width': ligado ? 2.2 : 1.4, 'stroke-dasharray':'7 6', 'stroke-linecap':'round'}));
}

function desenharNo(g, n, e, tema, p, bate, busca){
  const q = pos.get(n.id), r = raioDe(n), nat = naturezaPorId(n.natureza);
  const grp = el('g', {class:'no'+(bate ? '' : ' apagado'), transform:`translate(${f1(q.x)},${f1(q.y)})`});
  grp.dataset.id = n.id;
  const on = e==='on' || e==='mestre';
  if(tema==='tinta') noTinta(grp, n, e, r, on); else noPedra(grp, n, e, r, nat, on);
  selos(grp, n, r, tema);
  // regra de liberação quando há mais de um requisito
  if(n.pais.length>1){
    const t = el('text', {class:'regra-txt', y:f1(-(r + (n.tipo==='keystone' ? 22 : 13)))});
    t.setAttribute('fill', n.regra==='ou' ? (tema==='tinta' ? '#2F7A55' : '#4E8C7D') : (tema==='tinta' ? COR_T.verm : COR_P.ouro));
    t.textContent = n.regra==='ou' ? 'OU' : 'E'; grp.appendChild(t);
  }
  // graus: bolinhas embaixo
  const ext = n.tipo==='keystone' ? 13 : 3;
  let yRot = r + ext + 14;
  const G = n.graus.length;
  if(G>1){
    const g0 = p ? Math.min(p.alocados[n.id]||0, G) : 0;
    const esp = 7, x0 = -(G-1)*esp/2, yp = r + ext + 6;
    const cor = tema==='tinta' ? COR_T.tinta : COR_P.ouro;
    for(let k=0;k<G;k++){
      const cheio = k < g0;
      grp.appendChild(el('circle', {cx:f1(x0+k*esp), cy:f1(yp), r:2.4, fill: cheio ? cor : (tema==='tinta' ? COR_T.papelNo : COR_P.encaixe),
        stroke:cor, 'stroke-width':1.1, opacity: (cheio || e==='mestre' || e==='disp') ? 1 : .55}));
    }
    yRot = yp + 15;
  }
  if(selecionado===n.id){
    grp.appendChild(el('circle', {r:r + (n.tipo==='keystone' ? 17 : 11), fill:'none',
      stroke: tema==='tinta' ? COR_T.verm : COR_P.ouro, 'stroke-width':1.5, 'stroke-dasharray':'3 4'}));
  }
  if(n.tipo!=='pequeno' || cam.k>.85 || busca){
    const t = el('text', {class:'rotulo' + (n.tipo==='keystone' ? ' forte' : ''), y:f1(yRot)});
    t.textContent = n.nome; grp.appendChild(t);
  }
  grp.appendChild(el('circle', {r:Math.max(r+8, 18), class:'toque'}));
  g.appendChild(grp);
}
function noTinta(grp, n, e, r, on){
  const T = COR_T, base = n.cor || T.tinta;
  const opOrn = on ? 1 : (e==='disp' || e==='caro') ? .55 : .28;
  if(n.tipo==='keystone'){
    for(let i=0;i<8;i++){
      const a = -Math.PI/2 + Math.PI/8 + i*Math.PI/4;
      for(const off of [-3.1, 3.1]){
        const tx = -Math.sin(a)*off, ty = Math.cos(a)*off;
        grp.appendChild(el('line', {x1:f1(Math.cos(a)*(r+6)+tx), y1:f1(Math.sin(a)*(r+6)+ty), x2:f1(Math.cos(a)*(r+12)+tx), y2:f1(Math.sin(a)*(r+12)+ty),
          stroke:base, 'stroke-width':2.1, 'stroke-linecap':'round', opacity:opOrn}));
      }
    }
  }else if(n.tipo==='notavel'){
    grp.appendChild(el('circle', {r:r+5, fill:'none', stroke:base, 'stroke-width':1, opacity: on ? .45 : .22}));
  }
  let at;
  if(on) at = {fill:base};
  else if(e==='disp') at = {fill:T.papelNo, stroke:base, 'stroke-width':1.6, 'stroke-dasharray':'3.5 2.5'};
  else if(e==='caro') at = {fill:T.papelNo, stroke:T.tinta, 'stroke-width':1.4, 'stroke-dasharray':'1 3', 'stroke-opacity':.55};
  else at = {fill:T.papelNo, stroke:T.tinta, 'stroke-width':1.1, 'stroke-opacity': e==='fechado' ? .2 : .32};
  grp.appendChild(formaEl(n.forma, r, at));
  if(n.glifo){
    const cor = on ? (claro(base) ? T.tinta : T.papel) : T.tinta;
    grp.appendChild(glifoEl(n.glifo, r, cor, on ? 1 : (e==='disp' || e==='caro') ? .62 : .3));
  }
  if(e==='fechado') grp.appendChild(el('line', {x1:f1(-r*1.05), y1:f1(r*1.05), x2:f1(r*1.05), y2:f1(-r*1.05), stroke:T.verm, 'stroke-width':1.8, 'stroke-linecap':'round', opacity:.8}));
}
function noPedra(grp, n, e, r, nat, on){
  const P = COR_P;
  const moldura = e==='on' ? P.ouro : e==='mestre' ? (n.cor || P.ouro) : e==='disp' ? P.bronzeClaro : P.bronze;
  if(n.tipo==='keystone'){
    grp.appendChild(el('polygon', {points:estrelaP(r+11, r+4, 12), fill:'#2A2214', stroke: on ? P.ouro : P.bronze, 'stroke-width':1.2, opacity: on ? 1 : .8}));
  }
  grp.appendChild(formaEl(n.forma, r+2.5, {fill:P.encaixe, stroke:moldura, 'stroke-width':2.2}));
  const interno = !on ? P.fundoEnc
    : n.cor ? mix(n.cor, '#000000', e==='on' ? .2 : .35)
    : nat ? mix(nat.cor, '#000000', .66) : '#3A2E18';
  grp.appendChild(formaEl(n.forma, Math.max(3, r-2), {fill:interno}));
  if(n.glifo){
    const cor = on ? (claro(interno) ? '#1B1813' : P.glifoOn) : P.glifoOff;
    grp.appendChild(glifoEl(n.glifo, r, cor, 1));
  }else if(r<=12 && e==='on'){
    grp.appendChild(el('circle', {r:f1(r*.42), fill: nat ? nat.cor : P.ouro}));
  }
  if(e==='fechado') grp.appendChild(el('line', {x1:f1(-r*1.05), y1:f1(r*1.05), x2:f1(r*1.05), y2:f1(-r*1.05), stroke:P.verm, 'stroke-width':1.8, 'stroke-linecap':'round', opacity:.85}));
}
// selinhos: tipo de uso (sup. dir.), caminho exclusivo (sup. esq.), requisito de outra árvore (inf. esq.)
function selos(grp, n, r, tema){
  const fundo = tema==='tinta' ? COR_T.papelNo : COR_P.encaixe;
  // vários tipos de uso viram um selo só: "At·Re"
  const siglas = usosDe(n).map(u=>u.sigla).filter(Boolean).join('·');
  if(siglas && (n.tipo!=='pequeno' || cam.k>.7)){
    const w = Math.max(16, siglas.length*5.9 + 8), x0 = r*.62 - 2, y = -r*.8 - 4;
    grp.appendChild(el('rect', {x:f1(x0), y:f1(y-6.5), width:f1(w), height:13, rx:3, fill:fundo,
      stroke: tema==='tinta' ? 'rgba(31,27,22,.55)' : COR_P.bronze, 'stroke-width':.8}));
    const t = el('text', {class:'sigla', x:f1(x0 + w/2), y:f1(y+.5), fill: tema==='tinta' ? COR_T.tinta : COR_P.glifoOn});
    t.textContent = siglas; grp.appendChild(t);
  }
  if(n.exclusivo){
    const x = -r*.8 - 5, y = -r*.8 - 4, cor = tema==='tinta' ? COR_T.verm : COR_P.verm;
    grp.appendChild(el('circle', {cx:f1(x), cy:f1(y), r:5.6, fill:fundo, stroke:cor, 'stroke-width':1.2}));
    grp.appendChild(el('line', {x1:f1(x-3.3), y1:f1(y+3.3), x2:f1(x+3.3), y2:f1(y-3.3), stroke:cor, 'stroke-width':1.2}));
  }
  if(paisFora(n).length){
    const x = -r*.8 - 5, y = r*.8 + 4, cor = tema==='tinta' ? COR_T.tinta : COR_P.ouro;
    grp.appendChild(el('circle', {cx:f1(x), cy:f1(y), r:5.6, fill:fundo, stroke:cor, 'stroke-width':1}));
    grp.appendChild(el('path', {d:`M${f1(x-2.2)},${f1(y+2.2)} L${f1(x+2.3)},${f1(y-2.3)} M${f1(x-.5)},${f1(y-2.3)} L${f1(x+2.3)},${f1(y-2.3)} L${f1(x+2.3)},${f1(y+.5)}`,
      fill:'none', stroke:cor, 'stroke-width':1.1, 'stroke-linecap':'round', 'stroke-linejoin':'round'}));
  }
}

function gerarPapel(){
  let s = '<svg xmlns="http://www.w3.org/2000/svg" width="520" height="460">';
  for(let i=0;i<14;i++){
    const r = k => semente('fibra'+i+k);
    const x = r('x')*470, y = r('y')*460, L = 14 + r('l')*46, ang = (r('a')-.5)*.5;
    s += `<line x1="${f1(x)}" y1="${f1(y)}" x2="${f1(x+Math.cos(ang)*L)}" y2="${f1(y+Math.sin(ang)*L)}" stroke="#8a7a5a" stroke-opacity="${(.05+r('o')*.07).toFixed(3)}" stroke-width=".6" stroke-linecap="round"/>`;
  }
  s += '</svg>';
  document.documentElement.style.setProperty('--fibras', `url("data:image/svg+xml,${encodeURIComponent(s)}")`);
  const m = $('#montanhas'); m.textContent = '';
  const serra = (base, amp, chave, op) => {
    let x = 0, d = 'M0,190 L0,' + base; let i = 0;
    while(x < 1000){ x += 30 + semente(chave+'w'+i)*50; d += ` L${f1(Math.min(x,1000))},${f1(base - semente(chave+'h'+i)*amp)}`; i++; }
    d += ' L1000,190 Z';
    m.appendChild(el('path', {d, fill:'#1F1B16', opacity:op}));
  };
  serra(118, 62, 'longe', .04); serra(152, 36, 'perto', .06);
}

async function novaArvore(){
  const r = await dialogo({titulo:'Nova árvore', campos:[
      {nome:'nome', rotulo:'Nome', valor:'', dica:'Ex.: Humano, Monge, Escola da Garça Branca'},
      {nome:'cat', rotulo:'Categoria', tipo:'chips', valor:'classe', opcoes:CATEGORIAS.map(c=>({valor:c.id, rotulo:c.nome}))}],
    botoes:[{rotulo:'Cancelar', valor:null}, {rotulo:'Criar árvore', valor:true, classe:'ouro', validar:v=>v.nome.trim() ? '' : 'Dê um nome à árvore.'}]});
  if(!r) return;
  registrar('nova árvore');
  const raiz = noNovo('keystone', {nome:'Origem', graus:[{custos:{}, texto:''}]});
  const a = {id:novoId('a'), nome:r.nome.trim(), categoria:r.cat, secreta:false, senha:'', nodes:[raiz]};
  bib().arvores.push(a); ui.arvoreMestre = a.id; selecionado = raiz.id;
  salvar(); pintarTudo(); centralizar();
}
async function renomearArvore(){
  const a = arvoreVisivel(); if(!a) return;
  const r = await dialogo({titulo:'Renomear árvore', campos:[
      {nome:'nome', rotulo:'Nome', valor:a.nome},
      {nome:'cat', rotulo:'Categoria', tipo:'chips', valor:a.categoria, opcoes:CATEGORIAS.map(c=>({valor:c.id, rotulo:c.nome}))}],
    botoes:[{rotulo:'Cancelar', valor:null}, {rotulo:'Salvar', valor:true, classe:'ouro', validar:v=>v.nome.trim() ? '' : 'Dê um nome à árvore.'}]});
  if(!r) return;
  const nome = r.nome.trim(), cat = CATEGORIAS.some(c=>c.id===r.cat) ? r.cat : a.categoria;
  const mudouNome = nome!==a.nome, mudouCat = cat!==a.categoria;
  if(!mudouNome && !mudouCat) return;
  registrar(mudouNome && mudouCat ? 'renomear árvore e mudar a categoria' : mudouCat ? 'categoria da árvore' : 'renomear árvore');
  a.nome = nome; a.categoria = cat; salvar(); pintarTudo();
}
function duplicarArvore(){
  const a = arvoreVisivel(); if(!a) return;
  registrar('duplicar árvore');
  const c = clone(a); c.id = novoId('a'); c.nome = a.nome + ' (cópia)';
  const mapa = {}; c.nodes.forEach(n=>{ mapa[n.id] = novoId(); });
  c.nodes.forEach(n=>{ n.id = mapa[n.id]; n.pais = n.pais.map(x=>mapa[x] || x); });
  const lista = bib().arvores; lista.splice(lista.indexOf(a)+1, 0, c);
  ui.arvoreMestre = c.id; selecionado = null; salvar(); pintarTudo(); centralizar();
}
async function excluirArvore(){
  const a = arvoreVisivel(); if(!a) return;
  const usam = doc.personagens.filter(p=>p.arvores.includes(a.id));
  const ok = await confirmar('Excluir árvore', `Excluir “${esc(a.nome)}” com ${plural(a.nodes.length,'nódulo','nódulos')}?` +
    (usam.length ? ` Ela está equipada em ${plural(usam.length,'personagem','personagens')}.` : '') + ' Dá para desfazer com Ctrl+Z.', 'Excluir árvore', true);
  if(!ok) return;
  registrar('excluir árvore ' + a.nome);
  const ids = new Set(a.nodes.map(n=>n.id));
  const orfaos = bib().arvores.filter(x=>x!==a).flatMap(x=>x.nodes).filter(n=>n.pais.some(pid=>ids.has(pid)));
  bib().arvores = bib().arvores.filter(x=>x!==a);
  doc.personagens.forEach(p=>{ p.arvores = p.arvores.filter(id=>id!==a.id); ids.forEach(id=>{ delete p.alocados[id]; }); });
  selecionado = null; podarTodos(); garantirSelecoes(); salvar(); pintarTudo(); centralizar();
  if(orfaos.length) aviso(`${plural(orfaos.length,'nódulo de outra árvore exigia','nódulos de outras árvores exigiam')} algo desta; a checagem aponta ${orfaos.length===1 ? 'qual' : 'quais'}.`, 'err', 6000);
}

async function abrirEquipar(){

async function desequipar(id){
  const p = personagemAtual(); const a = arvorePorId(id); if(!p || !a) return;
  const gastosNela = Object.keys(p.alocados).filter(x=>arvDe.get(x)===a).length;
  if(gastosNela){
    const ok = await confirmar('Tirar árvore', `Tirar “${esc(a.nome)}” de ${esc(p.nome)}? Os ${plural(gastosNela,'nódulo alocado','nódulos alocados')} nela voltam a ficar livres.`, 'Tirar árvore', true);
    if(!ok) return;
  }
  if(!(await podeSoltarComTrancados(p))) return;
  registrar('tirar ' + a.nome);
  p.arvores = p.arvores.filter(x=>x!==id); podarPersonagem(p); garantirSelecoes();
  selecionado = null; salvar(); pintarTudo(); centralizar();
}
// põe a árvore `id` antes de `antesDe` (null = no fim). Árvores ainda trancadas não aparecem e ficam no fim da lista.
function reordenarEquipada(id, antesDe, peloTeclado){
  const p = personagemAtual(); if(!p) return;
  const vis = p.arvores.filter(x=>arvorePorId(x));
  if(!vis.includes(id) || id===antesDe) return;
  const nova = vis.filter(x=>x!==id);
  const i = antesDe==null ? nova.length : nova.indexOf(antesDe);
  if(i<0) return;
  nova.splice(i, 0, id);
  if(nova.every((x,k)=>x===vis[k])) return;
  registrar('mudar a ordem das árvores', peloTeclado ? 'ordem' + p.id : null);
  p.arvores = nova.concat(p.arvores.filter(x=>!arvorePorId(x)));
  salvar(); pintarSeletor(); pintarPainel();
}

function pintarPainel(){
  const pn = $('#painel'); const rolagem = pn.scrollTop;
  pn.innerHTML = ui.modo==='mestre' ? painelMestre() : painelJogador();
  ui.modo==='mestre' ? ligarMestre() : ligarJogador();
  pn.querySelectorAll('details[data-chave]').forEach(d=>d.addEventListener('toggle', ()=>{ ui.abertos[d.dataset.chave] = d.open; salvar(); }));
  pn.scrollTop = rolagem;
}

function ligarMestre(){
  const a = arvoreVisivel();
  const on = (sel, ev, fn) => { const e = $(sel); if(e) e.addEventListener(ev, fn); };
  on('#btNovaArvore2', 'click', novaArvore);
  on('#btNovo', 'click', ()=>criarNo(selecionado));
  on('#btNovaRaiz', 'click', ()=>criarNo(null));
  on('#btTexto', 'click', abrirTexto);
  on('#btChecar', 'click', ()=>abrirChecagem(false));
  ligarGlobais();
  if(!a) return;

  // árvore
  on('#aNome', 'input', e=>{ registrar('renomear árvore', 'anome'+a.id); a.nome = e.target.value; salvar(); pintarAbas(); atualizarMarca(a); });
  on('#aNome', 'change', e=>{ if(!e.target.value.trim()){ a.nome = 'Árvore'; salvar(); pintarAbas(); pintarPainel(); } });
  $$('[data-cat]').forEach(b=>b.onclick = ()=>{ registrar('categoria da árvore'); a.categoria = b.dataset.cat; salvar(); pintarAbas(); desenhar(); pintarPainel(); });
  on('#aSecreta', 'change', e=>{ registrar(e.target.checked ? 'tornar árvore secreta' : 'tirar segredo da árvore'); a.secreta = e.target.checked; salvar(); pintarAbas(); desenhar(); pintarPainel(); if(a.secreta) setTimeout(()=>$('#aSenha')?.focus(), 30); });
  on('#aSenha', 'input', e=>{ registrar('senha da árvore', 'asenha'+a.id); a.senha = e.target.value; salvar(); });

  const n = noSelecionadoNa(a); if(!n) return;
  const muda = (rot, chave, fn, opts) => { registrar(rot, chave); fn(); if(opts?.podar) podarTodos(); salvar(); if(!opts?.semDesenho) desenhar(); if(opts?.painel) pintarPainel(); };
  on('#eNome', 'input', e=>muda('renomear nódulo', 'nome'+n.id, ()=>{ n.nome = e.target.value; }));
  on('#eNome', 'change', e=>{ if(!e.target.value.trim()){ n.nome = 'Sem nome'; salvar(); desenhar(); pintarPainel(); } });
  on('#eGlifo', 'input', e=>muda('glifo', 'glifo'+n.id, ()=>{ n.glifo = [...e.target.value].slice(0,2).join(''); }));
  on('#eTipo', 'change', e=>muda('mudar tamanho', null, ()=>{
    const antigo = bib().tipos[n.tipo], novo = bib().tipos[e.target.value], p0 = bib().pools[0].id;
    const c = n.graus[0].custos;
    const eraPadrao = n.graus.length===1 && Object.keys(c).every(k=>k===p0) && (c[p0]||0)===antigo.custo;
    if(eraPadrao) n.graus[0].custos = novo.custo>0 ? {[p0]:novo.custo} : {};
    if(n.forma===antigo.forma) n.forma = novo.forma;
    n.tipo = e.target.value;
  }, {painel:true}));
  $$('[data-forma]').forEach(b=>b.onclick = ()=>muda('mudar forma', null, ()=>{ n.forma = b.dataset.forma; }, {painel:true}));
  $$('.paleta [data-cor]:not(.esc-cor)').forEach(b=>b.onclick = ()=>muda('mudar cor', 'cor'+n.id, ()=>{ n.cor = b.dataset.cor; }, {painel:true}));
  on('#corLivre', 'input', e=>muda('mudar cor', 'cor'+n.id, ()=>{ n.cor = e.target.value; }));
  $$('[data-nat]').forEach(b=>{ if(b.closest('#painel')) b.onclick = ()=>muda('mudar natureza', null, ()=>{ n.natureza = b.dataset.nat; }, {painel:true}); });
  $$('[data-uso]').forEach(b=>b.onclick = ()=>muda('mudar tipo de uso', null, ()=>{
    const id = b.dataset.uso;
    if(!id) n.usos = [];
    else{ const tem = n.usos.includes(id); n.usos = bib().usos.map(u=>u.id).filter(x=>x===id ? !tem : n.usos.includes(x)); }
  }, {painel:true}));
  on('#grauMais', 'click', ()=>muda('mais um grau', null, ()=>{
    const ult = n.graus[n.graus.length-1]; n.graus.push({custos:clone(ult.custos), texto:''});
  }, {painel:true, podar:true}));
  on('#grauMenos', 'click', ()=>muda('menos um grau', null, ()=>{ n.graus.pop(); }, {painel:true, podar:true}));
  $$('.gcusto').forEach(i=>i.onchange = e=>muda('mudar custo', 'custo'+n.id+i.dataset.g+i.dataset.pool, ()=>{
    const v = Math.max(0, Math.floor(+e.target.value || 0)); const g = n.graus[+i.dataset.g];
    if(v>0) g.custos[i.dataset.pool] = v; else delete g.custos[i.dataset.pool];
    e.target.value = v;
  }, {semDesenho:true}));
  $$('.gtexto').forEach(t=>t.oninput = e=>muda('texto do grau', 'gtexto'+n.id+t.dataset.g, ()=>{ n.graus[+t.dataset.g].texto = e.target.value; }, {semDesenho:true}));
  $$('.gbonus').forEach(t=>t.onchange = e=>{ muda('bônus do grau', 'gbonus'+n.id+t.dataset.g, ()=>{ const g = n.graus[+t.dataset.g], b = bonusLer(e.target.value); if(b) g.bonus = b; else delete g.bonus; }, {semDesenho:true}); e.target.value = bonusTexto(n.graus[+t.dataset.g].bonus); });
  on('#addPre', 'change', e=>{
    const alvo = e.target.value; if(!alvo) return;
    if(alvo===n.id || ehAncestral(n.id, alvo)){ pintarPainel(); return aviso('Isso criaria uma dependência circular.'); }
    muda('adicionar pré-requisito', null, ()=>{ if(!n.pais.includes(alvo)) n.pais.push(alvo); }, {painel:true, podar:true});
  });
  $$('.pre-x').forEach(b=>b.onclick = ()=>{
    const pid = b.closest('.pre').dataset.pid;
    muda('remover pré-requisito', null, ()=>{ n.pais = n.pais.filter(x=>x!==pid); }, {painel:true, podar:true});
  });
  $$('[data-regra]').forEach(b=>b.onclick = ()=>muda('regra ' + (b.dataset.regra==='ou' ? 'OU' : 'E'), null, ()=>{ n.regra = b.dataset.regra; }, {painel:true, podar:true}));
  on('#eExcl', 'change', e=>muda('caminho exclusivo', null, ()=>{ n.exclusivo = e.target.value.trim(); }, {painel:true, podar:true}));
  on('#eEscola', 'change', e=>muda(e.target.checked ? 'abrir escola' : 'tirar escola', null, ()=>{

  on('#eEscNome', 'input', e=>muda('nome da escola', 'escnome'+n.id, ()=>{ n.escola.nome = e.target.value; }));
  $$('.esc-cor').forEach(b=>b.onclick = ()=>muda('cor da escola', 'esccor'+n.id, ()=>{ n.escola.cor = b.dataset.cor; }, {painel:true}));
  on('#eEscSecreta', 'change', e=>{
    muda(e.target.checked ? 'tornar escola secreta' : 'tirar segredo da escola', null, ()=>{ n.escola.secreta = e.target.checked; }, {painel:true});
    if(e.target.checked) setTimeout(()=>$('#eEscSenha')?.focus(), 30);
  });
  on('#eEscSenha', 'input', e=>muda('senha da escola', 'escsenha'+n.id, ()=>{ n.escola.senha = e.target.value; }, {semDesenho:true}));
  on('#eDesc', 'input', e=>muda('editar descrição', 'desc'+n.id, ()=>{ n.desc = e.target.value; }, {semDesenho:true}));
  on('#btDuplicar', 'click', ()=>{
    registrar('duplicar nódulo');
    const c = clone(n); c.id = novoId(); c.nome = n.nome + ' (cópia)'; c.escola = null;
    a.nodes.push(c); selecionado = c.id; salvar(); pintarTudo();
  });
  on('#btExcluir', 'click', ()=>{
    registrar('excluir ' + n.nome);
    // quem dependia deste nó herda os requisitos dele
    (dependentes.get(n.id) || []).forEach(c=>{
      c.pais = [...new Set(c.pais.filter(x=>x!==n.id).concat(n.pais))].filter(x=>x!==c.id);
    });
    removerNos([n.id]);
  });
  on('#btExcluirRamo', 'click', async ()=>{
    const ids = a.nodes.filter(m=>m.id===n.id || req(m.id).has(n.id)).map(m=>m.id);
    if(ids.length>1){
      const ok = await confirmar('Excluir ramificação', `Excluir “${esc(n.nome)}” e ${plural(ids.length-1,'nódulo que só existe','nódulos que só existem')} através dele? Dá para desfazer com Ctrl+Z.`, 'Excluir', true);
      if(!ok) return;
    }
    registrar('excluir ramificação de ' + n.nome);
    removerNos(ids, n);
  });
}
function removerNos(ids, herdarDe){
  const s = new Set(ids);
  if(herdarDe) bib().arvores.forEach(a=>a.nodes.forEach(o=>{
    if(s.has(o.id) || !o.pais.some(x=>s.has(x))) return;
    o.pais = [...new Set(o.pais.filter(x=>!s.has(x)).concat(herdarDe.pais.filter(x=>!s.has(x))))].filter(x=>x!==o.id);
  }));
  bib().arvores.forEach(a=>{
    a.nodes = a.nodes.filter(o=>!s.has(o.id));
    a.nodes.forEach(o=>{ o.pais = o.pais.filter(x=>!s.has(x)); });
  });
  doc.personagens.forEach(p=>ids.forEach(id=>{ delete p.alocados[id]; }));
  podarTodos(); selecionado = null; salvar(); pintarTudo();
}
function criarNo(paiId){
  const a = arvoreVisivel(); if(!a) return;
  registrar('criar nódulo');
  let n;
  if(!paiId && !a.nodes.length) n = noNovo('keystone', {nome:'Origem', graus:[{custos:{}, texto:''}]});
  else n = noNovo('pequeno', {pais: paiId ? [paiId] : []});
  a.nodes.push(n); selecionado = n.id;
  salvar(); pintarTudo();
  const campo = $('#eNome'); if(campo){ campo.focus(); campo.select(); }
}

/* ---------- jogador ---------- */
function painelJogador(){
  const p = personagemAtual(); if(!p) return '';
  const a = arvoreVisivel();
  const n = noSelecionadoNa(a);
  const usados = new Set();
  p.arvores.map(arvorePorId).filter(Boolean).forEach(x=>x.nodes.forEach(m=>m.graus.forEach(g=>Object.keys(g.custos).forEach(k=>usados.add(k)))));
  const pools = bib().pools.filter(pl=>!usados.size || usados.has(pl.id) || gastos(p, pl.id)>0);
  const carteira = pools.map(pl=>{
    const g = gastos(p, pl.id), r = restantes(p, pl.id), tot = p.pontos[pl.id] || 0;
    return `<div class="bolsa"><div class="bolsa-topo"><i style="background:${esc(pl.cor)}"></i><span>${esc(pl.nome)}</span>
        <em style="color:${r<0 ? 'var(--perigo)' : 'var(--texto)'}">${r}</em></div>
      <div class="bolsa-barra"><span style="width:${tot>0 ? Math.min(100, Math.max(0, g/tot*100)) : 0}%;background:${esc(pl.cor)}"></span></div>
      <div class="bolsa-pe"><label for="tot_${esc(pl.id)}">Gastos ${g} de</label>
        <input class="campo pool-total" id="tot_${esc(pl.id)}" data-pool="${esc(pl.id)}" type="number" min="0" step="1" value="${tot}"></div></div>`;
  }).join('');

  let detalhe = '';
  if(n){
    const G = n.graus.length, g0 = Math.min(p.alocados[n.id] || 0, G);
    const est = estadoNo(p, n);
    const nat = naturezaPorId(n.natureza), nomesUso = usosDe(n).map(u=>esc(u.nome)).join(', ');
    const esc0 = escolaDoNo(n.id), col = colegasExclusivos(n), fech = fechadoPor(p, n);
    const podeSubir = g0<G && (g0===0 ? est==='disp' : podePagarGrau(p, n, g0+1));
    const txtEstado = g0>0 ? (G>1 ? `Grau ${g0} de ${G}` : 'Alocado')
      : est==='disp' ? 'Disponível' : est==='caro' ? faltaTexto(p, n, 1) : est==='fechado' ? `Fechado por “${fech.nome}”` : 'Bloqueado';
    detalhe = `<div class="bloco"><h2>${esc(n.nome)}</h2>
      <p class="info">${[esc(bib().tipos[n.tipo]?.nome || ''), nat ? `<span style="color:${esc(nat.cor)}">●</span> ${esc(nat.nome)}` : '', nomesUso].filter(Boolean).join(' · ')}</p>
      ${n.desc ? `<p class="info" style="color:var(--texto)">${esc(n.desc)}</p>` : ''}
      ${G>1 ? `<ul class="graus-lista">${n.graus.map((g,i)=>`<li class="${i<g0 ? 'feito' : ''}"><b>${i<g0 ? '✓' : (i+1) + 'º'}</b><span>${esc(custoTexto(g.custos))}${g.texto ? ' — ' + esc(g.texto) : ''}${g.bonus ? ' · na ficha: ' + esc(bonusTexto(g.bonus)) : ''}</span></li>`).join('')}</ul>`
             : `<p class="info">Custo: ${esc(custoTexto(n.graus[0].custos))}</p>`}
      ${n.pais.length ? `<p class="info acento">${esc(exigencia(n))}</p>` : ''}
      ${col.length ? `<p class="info">Caminho exclusivo com ${col.map(m=>'“'+esc(m.nome)+'”').join(', ')}.</p>` : ''}
      ${esc0 ? `<p class="info">Escola: ${esc(esc0.escola.nome)}</p>` : ''}
      <p class="info" style="font-weight:600">${esc(txtEstado)}</p>
      <div class="acoes" style="margin-top:10px">
        ${(G>1 || g0===0) ? `<button class="btn ouro" id="btSubir" ${podeSubir ? '' : 'disabled'}>${g0===0 ? 'Alocar' : g0<G ? 'Subir para o ' + (g0+1) + 'º grau' : 'Grau máximo'}</button>` : ''}
        <button class="btn perigo" id="btDescer" ${g0>0 ? '' : 'disabled'}>${g0>1 ? 'Descer grau' : 'Soltar'}</button>
      </div></div>`;
  }

  const conta = new Map();
  for(const id in p.alocados){ const m = porId.get(id); if(m && m.natureza) conta.set(m.natureza, (conta.get(m.natureza) || 0) + 1); }
  const natHtml = bib().naturezas.length ? `<div class="bloco"><h2>Por natureza</h2>${conta.size
    ? `<div class="natcont">${bib().naturezas.filter(t=>conta.has(t.id)).map(t=>`<span><i style="background:${esc(t.cor)}"></i>${esc(t.nome)} <b>${conta.get(t.id)}</b></span>`).join('')}</div>`
    : '<p class="vazio">Nada alocado ainda.</p>'}</div>` : '';

  const nesta = a ? a.nodes.filter(m=>p.alocados[m.id]) : [];
  const caminho = `<div class="bloco"><h2>${a ? 'Nesta árvore · ' + nesta.length : 'Caminho'}</h2>${nesta.length
    ? `<ul class="pilha">${nesta.map(m=>{ const g = p.alocados[m.id], G = m.graus.length;
        return `<li data-id="${esc(m.id)}"><i style="background:${esc(corDoNo(m))}"></i>${esc(m.nome)}<span class="fim">${G>1 ? g + '/' + G : ''}</span></li>`; }).join('')}</ul>`
    : `<p class="vazio">Clique num nódulo liberado para aprender. As raízes estão sempre liberadas; só o botão direito desce o grau ou esquece.</p>`}</div>`;

  const eq = p.arvores.map(arvorePorId).filter(Boolean);
  const movel = eq.length>1;
  const equipadas = `<div class="bloco"><h2>Árvores equipadas</h2>
    ${eq.length ? `<div id="listaEq">${eq.map(x=>`<div class="pre eqp${movel ? ' movel' : ''}" data-id="${esc(x.id)}">
      ${movel ? `<div class="alca" tabindex="0" role="button" title="Arraste para mudar a ordem" aria-label="Mudar a ordem de ${esc(x.nome)}: arraste, ou Alt e as setas">${ICONE_ALCA}</div>` : ''}
      <i style="background:${x===a ? 'var(--acento)' : 'var(--linha-forte)'}"></i><span>${esc(x.nome)}</span><em>${esc(nomeCat(x.categoria))}</em>
      <button class="btn mini desequipar" data-id="${esc(x.id)}" title="Tirar do personagem" aria-label="Tirar ${esc(x.nome)}">×</button></div>`).join('')}</div>`
      : '<p class="vazio" style="margin-bottom:8px">Nenhuma árvore equipada.</p>'}
    ${movel ? '<p class="nota" style="margin:2px 0 10px">Arraste para mudar a ordem. Os botões em cima da árvore seguem a mesma.</p>' : ''}
    <div class="acoes"><button class="btn" id="btEquipar">+ Equipar árvore</button></div></div>`;

  return `<div class="bloco"><h2>${esc(p.nome)}</h2>${carteira}
      <div class="acoes" style="margin-top:4px">
        <button class="btn perigo" id="btZerar" ${nesta.length ? '' : 'disabled'}>Zerar esta árvore</button>
        <button class="btn" id="btDestrancar">Destrancar escola</button>
      </div></div>` + detalhe + natHtml + caminho + equipadas;
}

async function abrirDestrancar(){
  const r = await dialogo({titulo:'Destrancar escola', texto:'Digite a senha que o mestre passou na mesa.',
    campos:[{nome:'senha', rotulo:'Senha', valor:'', tipo:'senha'}],
    botoes:[{rotulo:'Cancelar', valor:null}, {rotulo:'Destrancar', valor:true, classe:'ouro', validar:v=>v.senha.trim() ? '' : 'Digite a senha.'}]});
  if(!r) return;
  if(!bib().cofres.length) return aviso('Essa senha não abriu nenhuma escola.', 'err');
  aviso('Conferindo a senha…');
  const antes = instantaneo();
  let res;
  try{ res = await destrancarComSenha(r.senha); }catch(e){ return aviso(e.message, 'err'); }
  if(!res.abertas.length && !res.pendentes.length) return aviso('Essa senha não abriu nenhuma escola.', 'err');
  if(!res.abertas.length){ salvar(); return aviso('Senha certa, mas essa escola fica dentro de outra ainda trancada. Ela abre junto quando a outra abrir.', 'ok', 6000); }
  pilhaDesfazer.push({rotulo:'destrancar escola', estado:antes}); pilhaRefazer.length = 0; ultimoRegistro = {chave:null, t:0};
  const antesAloc = doc.personagens.map(p=>Object.keys(p.alocados));
  podarTodos(); garantirSelecoes(); salvar(); pintarTudo();
  const soltos = doc.personagens.flatMap((p,i)=>antesAloc[i].filter(id=>!p.alocados[id]).map(id=>porId.get(id)?.nome || id));
  const nomes = res.abertas.map(x=>x.nome);
  aviso('Destrancada: ' + nomes.join(', ') + '.' + (soltos.length ? ` Soltos por falta de requisito: ${soltos.join(', ')}.` : ''), soltos.length ? 'err' : 'ok', soltos.length ? 8000 : 5000);
  // se abriu uma árvore inteira, oferece equipar
  const p = personagemAtual();
  const nova = res.abertas.map(x=>x.conteudo).find(c=>c && c.tipo==='arvore');
  if(nova && p && !p.arvores.includes(nova.arvore.id)){
    const ok = await confirmar('Escola destrancada', `“${esc(nova.arvore.nome)}” apareceu na biblioteca. Equipar em ${esc(p.nome)} agora?`, 'Equipar');
    if(ok){ registrar('equipar ' + nova.arvore.nome); p.arvores.push(nova.arvore.id); p.arvoreAtual = nova.arvore.id; salvar(); pintarTudo(); centralizar(); }
  }
}

/* ============================================================
   CRIAR POR TEXTO — lista recuada vira árvore
   "Nome [etiquetas] | descrição", um nódulo por linha
   ============================================================ */
const TIPO_ALIAS = {pequena:'pequeno', notavel:'notavel', media:'notavel', medio:'notavel', chave:'keystone', 'pedra angular':'keystone', grande:'keystone'};
let rascunhoTexto = '';

function unico(lista){ return lista.length===1 ? lista[0] : null; }
function custoPadrao(tipo){
  const b = bib(), c = (b.tipos[tipo] || b.tipos.pequeno).custo;
  return c>0 ? {[b.pools[0].id]:c} : {};
}
function interpretarTexto(txt){
  const b = bib(), itens = [], pilha = [];
  String(txt || '').split(/\r?\n/).forEach((bruta, i)=>{
    if(!bruta.trim() || /^\s*(#|\/\/)/.test(bruta)) return;
    const recuo = bruta.match(/^[\t ]*/)[0].replace(/\t/g, '  ').length;
    let resto = bruta.trim().replace(/^[-*•·]\s+/, '');
    let desc = '';
    const barra = resto.indexOf('|');
    if(barra>=0){ desc = resto.slice(barra+1).trim(); resto = resto.slice(0, barra).trim(); }
    let etqs = [];
    const m = resto.match(/\[([^\]]*)\]\s*$/);
    if(m){ etqs = m[1].split(/[,;]/).map(s=>s.trim()).filter(Boolean); resto = resto.slice(0, m.index).trim(); }
    const item = {linha:i+1, nome:resto || 'Sem nome', desc, tipo:null, forma:null, natureza:'', usos:[], glifo:'',
                  exclusivo:'', escola:null, custos:null, graus:1, avisos:[], pai:null, nivel:0};
    if(!resto) item.avisos.push('linha sem nome');
    while(pilha.length && pilha[pilha.length-1].recuo >= recuo) pilha.pop();
    item.pai = pilha.length ? pilha[pilha.length-1].item : null;
    item.nivel = pilha.length;
    pilha.push({recuo, item});
    etqs.forEach(t=>interpretarEtiqueta(item, t, b));
    itens.push(item);
  });
  return itens;
}
function interpretarEtiqueta(item, bruto, b){
  const t = norm(bruto);
  let m;
  if((m = t.match(/^graus?\s*[:=]?\s*(\d+)$/)) || (m = t.match(/^(\d+)\s*graus?$/))){
    const v = +m[1];
    if(v<1 || v>MAX_GRAUS) item.avisos.push(`graus vão de 1 a ${MAX_GRAUS}`);
    item.graus = Math.min(MAX_GRAUS, Math.max(1, v)); return;
  }
  if((m = t.match(/^(\d+)\s*(.*)$/))){
    const v = +m[1], nomePool = m[2].trim();
    const pool = !nomePool ? b.pools[0]
      : (b.pools.find(p=>norm(p.nome)===nomePool) || unico(b.pools.filter(p=>norm(p.nome).includes(nomePool))) || unico(b.pools.filter(p=>nomePool.includes(norm(p.nome)))));
    if(!pool){ item.avisos.push(`tipo de ponto “${bruto.replace(/^\s*\d+\s*/, '')}” não existe`); return; }
    item.custos = item.custos || {};
    item.custos[pool.id] = (item.custos[pool.id] || 0) + v;
    return;
  }
  if((m = bruto.match(/^\s*(?:exclusivo|excl|x)\s*[:=]\s*(.+)$/i)) || (m = bruto.match(/^\s*exclusivo\s+(.+)$/i))){ item.exclusivo = m[1].trim(); return; }
  if((m = bruto.match(/^\s*glifo\s*[:=]?\s*(.+)$/i))){ item.glifo = [...m[1].trim()].slice(0,2).join(''); return; }
  if((m = bruto.match(/^\s*escola\s*[:=]\s*(.+)$/i))){ item.escola = Object.assign(item.escola || {}, {nome:m[1].trim()}); return; }
  if(t==='escola'){ item.escola = item.escola || {}; return; }
  if(t==='secreta' || t==='secreto'){ item.escola = Object.assign(item.escola || {}, {secreta:true}); return; }
  const nat = b.naturezas.find(x=>norm(x.nome)===t) || (t.length>=4 ? unico(b.naturezas.filter(x=>norm(x.nome).startsWith(t))) : null);
  if(nat){ item.natureza = nat.id; return; }
  const uso = b.usos.find(x=>norm(x.nome)===t || norm(x.sigla)===t);
  if(uso){ if(!item.usos.includes(uso.id)) item.usos.push(uso.id); return; }
  const tipo = Object.keys(b.tipos).find(k=>k===t || norm(b.tipos[k].nome)===t) || TIPO_ALIAS[t];
  if(tipo && b.tipos[tipo]){ item.tipo = tipo; return; }
  const forma = FORMAS.find(f=>f.id===t || norm(f.nome)===t);
  if(forma){ item.forma = forma.id; return; }
  if([...bruto.trim()].length<=2 && /[^\x00-\x7F]/.test(bruto)){ item.glifo = bruto.trim(); return; }
  item.avisos.push(`não entendi “${bruto.trim()}”`);
}
function previaHtml(itens){
  if(!itens.length) return '<p class="vazio">A prévia aparece aqui enquanto você digita.</p>';
  const b = bib();
  return itens.map(it=>{
    const tipo = it.tipo || 'pequeno', etq = [];
    if(tipo!=='pequeno') etq.push(esc(b.tipos[tipo].nome));
    if(it.forma) etq.push(esc(FORMAS.find(f=>f.id===it.forma).nome));
    const nat = naturezaPorId(it.natureza); if(nat) etq.push(`<i style="background:${esc(nat.cor)}"></i>${esc(nat.nome)}`);
    it.usos.forEach(id=>{ const u = usoPorId(id); if(u) etq.push(esc(u.nome)); });
    etq.push(esc(custoTexto(it.custos || custoPadrao(tipo))) + (it.custos ? '' : ' (padrão)'));
    if(it.graus>1) etq.push(it.graus + ' graus');
    if(it.glifo) etq.push('glifo ' + esc(it.glifo));
    if(it.exclusivo) etq.push('exclusivo: ' + esc(it.exclusivo));
    if(it.escola) etq.push('escola' + (it.escola.secreta ? ' secreta' : ''));
    return `<div class="pl" style="padding-left:${it.nivel*18}px">${it.nivel ? '<span style="color:var(--texto-3)">└</span>' : ''}
      <span class="nm">${esc(it.nome)}</span>${etq.map(e=>`<span class="etq">${e}</span>`).join('')}</div>
      ${it.desc ? `<div style="padding:0 0 2px ${it.nivel*18+14}px;color:var(--texto-3);font-size:12px">${esc(it.desc)}</div>` : ''}`;
  }).join('');
}

function aplicarTexto(itens, destino, novaNome, novaCat){
  registrar('criar por texto');
  let a = arvoreVisivel(), paiBase = null;
  if(destino==='nova' || !a){
    a = {id:novoId('a'), nome:novaNome || 'Nova árvore', categoria:novaCat || 'classe', secreta:false, senha:'', nodes:[]};
    bib().arvores.push(a); ui.arvoreMestre = a.id;
  }else if(destino==='abaixo'){
    const sel = noSelecionadoNa(a); paiBase = sel ? sel.id : null;
  }
  const mapa = new Map();
  itens.forEach(it=>{
    const tipo = it.tipo || 'pequeno';
    const custos = it.custos || custoPadrao(tipo);
    const n = noNovo(tipo, {
      nome:it.nome, desc:it.desc, natureza:it.natureza, usos:bib().usos.map(u=>u.id).filter(x=>it.usos.includes(x)), glifo:it.glifo, exclusivo:it.exclusivo,
      forma:it.forma || bib().tipos[tipo].forma,
      pais: it.pai ? [mapa.get(it.pai).id] : (paiBase ? [paiBase] : []),
      graus: Array.from({length:it.graus}, ()=>({custos:clone(custos), texto:''})),
      escola: it.escola ? {nome:it.escola.nome || it.nome, cor:COR_ESCOLA, secreta:!!it.escola.secreta, senha:''} : null
    });
    mapa.set(it, n); a.nodes.push(n);
  });
  rascunhoTexto = '';
  selecionado = mapa.get(itens[0]).id;
  if(ui.modo!=='mestre') ui.modo = 'mestre';
  podarTodos(); salvar(); fecharModal(); pintarTudo(); centralizar();
  aviso(`${plural(itens.length,'nódulo criado','nódulos criados')} em “${a.nome}”.`, 'ok');
}

function fecharModal(){ $('#veu').classList.remove('on'); }
const modalAberto = () => $('#veu').classList.contains('on');

function dialogo(o){
  return new Promise(resolve=>{
    const v = $('#veuDlg'), m = $('#dlg');
    m.className = 'modal ' + (o.largura || 'estreito');
    const campos = o.campos || [];
    const campoHtml = (c, i) => c.tipo==='chips'
      ? `<div class="grupo"><span class="rot">${esc(c.rotulo)}</span><div class="chips" data-campo="${i}" data-valor="${esc(c.valor)}">
          ${c.opcoes.map(op=>`<button type="button" class="chip" data-v="${esc(op.valor)}" aria-pressed="${op.valor===c.valor}">${esc(op.rotulo)}</button>`).join('')}</div></div>`
      : `<div class="grupo"><label class="rot" for="dlgc${i}">${esc(c.rotulo)}</label>
          <input id="dlgc${i}" class="campo" data-campo="${i}" value="${esc(c.valor || '')}" ${c.tipo==='senha' ? 'autocomplete="off" spellcheck="false"' : ''} ${c.dica ? `placeholder="${esc(c.dica)}"` : ''}></div>`;
    m.innerHTML = `<h2>${esc(o.titulo)}</h2>${o.texto ? `<p class="sub">${o.texto}</p>` : ''}${campos.map(campoHtml).join('')}${o.html || ''}
      <div class="aviso-linha err" id="dlgErro"></div>
      <div class="rodape">${(o.botoes || []).map((b,i)=>`<button type="button" class="btn ${b.classe || ''}" data-b="${i}">${esc(b.rotulo)}</button>`).join('')}</div>`;
    let feito = false;
    const fim = valor => {
      if(feito) return; feito = true;
      v.classList.remove('on'); v.onclick = null;
      document.removeEventListener('keydown', tecla, true);
      resolve(valor);
    };
    const coletar = () => { const out = {}; campos.forEach((c,i)=>{ const e = m.querySelector(`[data-campo="${i}"]`); out[c.nome] = c.tipo==='chips' ? e.dataset.valor : e.value; }); return out; };
    m.querySelectorAll('.chips[data-campo]').forEach(cx=>cx.querySelectorAll('[data-v]').forEach(b=>b.onclick = ()=>{
      cx.dataset.valor = b.dataset.v; cx.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed', x===b));
    }));
    m.querySelectorAll('[data-b]').forEach(bt=>bt.onclick = ()=>{
      const b = o.botoes[+bt.dataset.b];
      if(b.valor===null || b.valor===false) return fim(null);
      const vals = coletar();
      if(b.validar){ const erro = b.validar(vals); if(erro){ m.querySelector('#dlgErro').textContent = erro; return; } }
      fim(campos.length ? vals : b.valor);
    });
    m.querySelectorAll('input').forEach(i=>i.addEventListener('input', ()=>{ m.querySelector('#dlgErro').textContent = ''; }));
    const tecla = e => {
      if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); fim(null); }
      else if(e.key==='Enter' && e.target.tagName==='INPUT'){ e.preventDefault(); const pri = m.querySelector('.rodape .btn.ouro'); if(pri) pri.click(); }
    };
    document.addEventListener('keydown', tecla, true);
    v.onclick = e => { if(e.target===v) fim(null); };
    v.classList.add('on');
    if(o.aoMontar) o.aoMontar(m, fim);
    setTimeout(()=>{
      const f = m.querySelector('input.campo');
      if(f){ f.focus(); f.select(); }
      else{ const pri = m.querySelector('.rodape .btn.ouro') || m.querySelector('.rodape .btn'); if(pri) pri.focus({preventScroll:true}); m.scrollTop = 0; }
    }, 30);
  });
}

}
