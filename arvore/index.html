<!DOCTYPE html>
<html lang="pt-BR" data-tema="pedra">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Árvore de Habilidades · Tiny Cats</title>
<script>
/* aplica o tema antes de desenhar a página, para não piscar */
(function(){
  var t = 'auto';
  try{ var u = JSON.parse(localStorage.getItem('urgm.arvore.ui.v4')); if(u && u.tema) t = u.tema; }catch(e){}
  if(t!=='tinta' && t!=='pedra') t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'tinta' : 'pedra';
  document.documentElement.setAttribute('data-tema', t);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=JetBrains+Mono:wght@400;600&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
/* ================= tokens ================= */
:root, [data-tema="pedra"]{
  --fundo:#0B0E13; --fundo-2:#111722; --fundo-3:#19202C; --tela:#101318;
  --linha:rgba(233,227,214,.13); --linha-forte:rgba(233,227,214,.3);
  --texto:#E9E3D6; --texto-2:rgba(233,227,214,.62); --texto-3:rgba(233,227,214,.38);
  --acento:#D9A441; --acento-fundo:rgba(217,164,65,.13); --acento-borda:rgba(217,164,65,.5);
  --perigo:#E79AA3; --perigo-fundo:rgba(140,47,57,.18); --perigo-borda:rgba(140,47,57,.7);
  --ok:#6FBF9F; --campo:rgba(11,14,19,.55); --campo-borda:rgba(233,227,214,.13);
  --dica-fundo:rgba(9,12,17,.97); --sombra:0 12px 32px rgba(0,0,0,.6);
  --titulo:'Fraunces',Georgia,serif; --glifo:'Ma Shan Zheng','Noto Serif CJK SC','Songti SC','SimSun',serif;
  --veu:rgba(6,8,12,.78);
  color-scheme:dark;
}
[data-tema="tinta"]{
  --fundo:#E2D8C2; --fundo-2:#EBE3CF; --fundo-3:#F3EDDF; --tela:#ECE4D0;
  --linha:rgba(31,27,22,.15); --linha-forte:rgba(31,27,22,.34);
  --texto:#1F1B16; --texto-2:rgba(31,27,22,.68); --texto-3:rgba(31,27,22,.46);
  --acento:#B23A2E; --acento-fundo:rgba(178,58,46,.09); --acento-borda:rgba(178,58,46,.5);
  --perigo:#7E2437; --perigo-fundo:rgba(126,36,55,.1); --perigo-borda:rgba(126,36,55,.55);
  --ok:#2F7A55; --campo:rgba(255,252,244,.7); --campo-borda:rgba(31,27,22,.18);
  --dica-fundo:rgba(246,241,229,.98); --sombra:0 12px 30px rgba(60,45,25,.22);
  --titulo:'Cormorant Garamond',Georgia,serif;
  --veu:rgba(40,32,22,.45);
  color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--fundo);color:var(--texto);overflow:hidden;
  font:400 14px/1.5 'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
}
[data-tema="pedra"] body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(62% 52% at 22% 12%, rgba(78,140,125,.10), transparent 70%),
    radial-gradient(58% 48% at 82% 88%, rgba(140,47,57,.09), transparent 70%);
}
#app{position:relative;z-index:1;display:grid;grid-template-rows:auto auto 1fr;height:100%;overflow:hidden}
#app > *{min-width:0}

/* ================= topo ================= */
#topo{
  display:flex;align-items:center;gap:12px;padding:0 16px;height:58px;
  border-bottom:1px solid var(--linha);background:var(--fundo);
}
.selo{
  width:26px;height:26px;flex:none;border-radius:4px;display:grid;place-items:center;
  font:18px/1 var(--glifo);
}
[data-tema="pedra"] .selo{border:1px solid var(--acento-borda);border-radius:50%;color:var(--acento);font-size:15px}
[data-tema="tinta"] .selo{background:var(--acento);color:#F3E9D6}
#nomeBib{
  background:transparent;border:1px solid transparent;color:var(--texto);
  font:600 19px/1 var(--titulo);padding:6px 8px;border-radius:3px;min-width:120px;max-width:300px;
}
#nomeBib:hover:not([readonly]){border-color:var(--linha)}
#nomeBib:focus{outline:none;border-color:var(--acento-borda);background:var(--campo)}
.espaco{flex:1}
#busca{width:170px}
.seg{display:flex;border:1px solid var(--linha);border-radius:3px;overflow:hidden;flex:none}
.seg button{
  appearance:none;background:transparent;border:0;color:var(--texto-2);cursor:pointer;
  padding:8px 12px;font:600 11px/1 'Barlow';letter-spacing:.1em;text-transform:uppercase;transition:.15s;
}
.seg button[aria-pressed="true"]{background:var(--acento-fundo);color:var(--acento)}
.seg button:hover{color:var(--texto)}
.historico{display:flex;gap:6px;flex:none}
.curto{display:none}

/* ================= botões e campos ================= */
.btn{
  appearance:none;border:1px solid var(--linha);background:transparent;color:var(--texto);
  padding:8px 12px;border-radius:3px;cursor:pointer;transition:.15s;
  font:600 11px/1 'Barlow';letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;
}
.btn:hover{background:var(--acento-fundo);border-color:var(--linha-forte)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ouro{border-color:var(--acento-borda);color:var(--acento);background:var(--acento-fundo)}
.btn.perigo:hover{border-color:var(--perigo-borda);color:var(--perigo);background:var(--perigo-fundo)}
.btn.mini{padding:5px 8px;font-size:10px}
.btn.ico{padding:0;width:34px;height:34px;display:grid;place-items:center;font-size:16px;line-height:1;letter-spacing:0}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}

.campo{
  width:100%;background:var(--campo);border:1px solid var(--campo-borda);color:var(--texto);
  padding:8px 10px;border-radius:3px;font:400 13px 'Barlow';
}
.campo:focus{outline:none;border-color:var(--acento-borda);box-shadow:0 0 0 3px var(--acento-fundo)}
textarea.campo{resize:vertical;min-height:64px;line-height:1.45}
select.campo{cursor:pointer}
label.rot, .rot{display:block;font:600 10px/1.35 'Barlow';letter-spacing:.13em;text-transform:uppercase;color:var(--texto-3);margin:0 0 6px}
.nota{color:var(--texto-3);font-size:12.5px;line-height:1.55;margin:6px 0 0}
.vazio{color:var(--texto-3);font-style:italic;font-size:13px;line-height:1.6;margin:0}

/* ================= abas ================= */
#abas{
  display:flex;align-items:center;gap:8px;padding:7px 12px;min-height:46px;overflow:hidden;
  border-bottom:1px solid var(--linha);background:var(--fundo-2);
}
#abas > .btn{flex:none}
#listaAbas{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px;flex:1 1 auto;min-width:0}
#listaAbas::-webkit-scrollbar{height:5px}
#listaAbas::-webkit-scrollbar-thumb{background:var(--linha);border-radius:3px}
.aba{
  appearance:none;border:1px solid var(--linha);background:transparent;color:var(--texto-2);
  padding:7px 12px;border-radius:3px;cursor:pointer;white-space:nowrap;transition:.15s;
  font:500 13px/1 'Barlow';display:flex;align-items:center;gap:7px;
}
.aba:hover{color:var(--texto);border-color:var(--linha-forte)}
.aba[aria-selected="true"]{background:var(--acento-fundo);border-color:var(--acento-borda);color:var(--acento);font-weight:600}
.aba small{font:600 9px/1 'Barlow';letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.aba b{font:600 10px 'JetBrains Mono',monospace;opacity:.7}
.aba .lacre{font:13px/1 var(--glifo);color:var(--acento)}

/* ================= palco ================= */
#palco{display:grid;grid-template-columns:340px 1fr;min-height:0}
#painel{border-right:1px solid var(--linha);background:var(--fundo-2);overflow-y:auto;overscroll-behavior:contain;padding:16px}
#painel::-webkit-scrollbar{width:8px}
#painel::-webkit-scrollbar-thumb{background:var(--linha);border-radius:4px}
.bloco{margin-bottom:20px}
.bloco > h2, details.bloco > summary{
  font:600 11px/1 'Barlow';letter-spacing:.16em;text-transform:uppercase;color:var(--texto-3);
  margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--linha);
}
details.bloco > summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.bloco > summary::-webkit-details-marker{display:none}
details.bloco > summary::after{content:'+';font-size:13px;line-height:.8}
details.bloco[open] > summary::after{content:'−'}
.grupo{margin-bottom:12px}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acoes{display:flex;gap:8px;flex-wrap:wrap}

/* paleta, formas e escolhas */
.paleta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tinta{width:22px;height:22px;border-radius:50%;border:1px solid var(--linha-forte);cursor:pointer;padding:0;transition:.12s;position:relative}
.tinta:hover{transform:scale(1.14)}
.tinta[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fundo-2),0 0 0 3px var(--acento)}
.tinta.auto{background:conic-gradient(var(--texto) 0 50%, var(--acento) 0 100%)}
input[type=color].livre{width:26px;height:22px;padding:0;border:1px solid var(--linha);background:none;border-radius:3px;cursor:pointer}
.formas{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.formas button{
  appearance:none;border:1px solid var(--linha);background:transparent;border-radius:3px;padding:3px;cursor:pointer;
  color:var(--texto-2);aspect-ratio:1;display:grid;place-items:center;
}
.formas button[aria-pressed="true"]{border-color:var(--acento-borda);color:var(--acento);background:var(--acento-fundo)}
.formas svg{width:100%;height:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  appearance:none;border:1px solid var(--linha);background:transparent;color:var(--texto-2);border-radius:999px;
  padding:5px 10px;font:500 12px/1 'Barlow';cursor:pointer;display:inline-flex;align-items:center;gap:6px;
}
.chip i{width:9px;height:9px;border-radius:50%;flex:none}
.chip[aria-pressed="true"]{border-color:var(--acento-borda);color:var(--texto);background:var(--acento-fundo)}
.chip:hover{border-color:var(--linha-forte)}

/* graus */
.grau{border:1px solid var(--linha);border-radius:3px;padding:8px;margin-bottom:8px;background:var(--campo)}
.grau-topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.grau-topo span{font:600 10px 'Barlow';letter-spacing:.12em;text-transform:uppercase;color:var(--texto-3)}
.passo{display:flex;align-items:center;gap:6px}
.passo b{font:600 14px 'JetBrains Mono';min-width:18px;text-align:center}
.passo .btn{width:28px;height:28px;padding:0;font-size:14px;letter-spacing:0}

/* moedas / tipos de ponto */
.moeda{display:grid;grid-template-columns:12px 1fr 64px;gap:8px;align-items:center;margin-bottom:6px}
.moeda i{width:10px;height:10px;border-radius:50%}
.moeda span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.moeda input{padding:5px 7px;text-align:center;font-family:'JetBrains Mono',monospace}
.lista-ed{display:grid;gap:6px;align-items:center;margin-bottom:6px}
.lista-ed.pool{grid-template-columns:26px 1fr 58px 28px}
.lista-ed.nat{grid-template-columns:26px 1fr 28px}
.lista-ed.uso{grid-template-columns:1fr 52px 28px}
.lista-ed input[type=color]{width:26px;height:30px;padding:0;border:1px solid var(--linha);background:none;border-radius:3px;cursor:pointer}
.lista-ed .btn{padding:0;height:30px;font-size:14px;letter-spacing:0}

/* pré-requisitos */
.pre{display:flex;align-items:center;gap:8px;padding:5px 6px;margin-bottom:5px;border:1px solid var(--linha);border-radius:3px;background:var(--campo);font-size:13px}
.pre i{width:9px;height:9px;border-radius:50%;flex:none}
.pre span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pre em{font-style:normal;font-size:11px;color:var(--texto-3)}
.regra{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.regra .btn{padding:8px 6px;font-size:10px}
/* árvores equipadas: arrastar para mudar a ordem */
.eqp{user-select:none;-webkit-user-select:none}
.eqp.movel{cursor:grab}
.eqp .alca{flex:none;display:grid;place-items:center;width:16px;height:22px;margin:-3px -3px -3px -2px;border-radius:2px;
  color:var(--texto-3);cursor:grab;touch-action:none;-webkit-touch-callout:none}
.eqp .alca:hover{color:var(--texto)}
.eqp .alca svg{width:8px;height:12px;fill:currentColor}
@media (pointer:coarse){ .eqp .alca{width:30px;height:32px;margin:-6px -6px -6px -4px} }
#seletor .arv[data-id]{touch-action:none;-webkit-touch-callout:none}
.levantada{opacity:.32}
.arv.levantada{border-style:dashed}
.fantasma-ordem{position:fixed;z-index:75;pointer-events:none;margin:0!important;box-shadow:var(--sombra)}
.fantasma-ordem.pre{background:var(--fundo-3);border-color:var(--acento-borda)}
.marca-ordem{position:fixed;z-index:76;pointer-events:none;display:none;border-radius:2px;background:var(--acento)}
.marca-ordem.on{display:block}
.marca-ordem::before,.marca-ordem::after{content:'';position:absolute;width:7px;height:7px;border-radius:50%;background:inherit;box-shadow:inherit}
.marca-ordem.y::before{left:-4px;top:-2px} .marca-ordem.y::after{right:-4px;top:-2px}
.marca-ordem.x::before{top:-4px;left:-2px} .marca-ordem.x::after{bottom:-4px;left:-2px}
[data-tema="pedra"] .marca-ordem{box-shadow:0 0 10px rgba(217,164,65,.75)}
body.ordenando, body.ordenando *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
.caixa{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin:4px 0}
.caixa input{accent-color:var(--acento);width:15px;height:15px}
.recuo{border-left:2px solid var(--acento-borda);padding-left:10px;margin-top:8px}

/* carteira do jogador */
.bolsa{border:1px solid var(--linha);border-radius:3px;padding:9px 10px;margin-bottom:9px;background:var(--campo)}
.bolsa-topo{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bolsa-topo i{width:10px;height:10px;border-radius:50%;flex:none}
.bolsa-topo span{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bolsa-topo em{font:600 19px/1 'JetBrains Mono',monospace;font-style:normal}
.bolsa-barra{height:3px;background:var(--linha);border-radius:2px;overflow:hidden}
.bolsa-barra span{display:block;height:100%;transition:width .18s}
.bolsa-pe{display:flex;align-items:center;gap:8px;margin-top:8px}
.bolsa-pe label{font:600 9px/1 'Barlow';letter-spacing:.1em;text-transform:uppercase;color:var(--texto-3);white-space:nowrap}
.bolsa-pe input{width:70px;padding:5px 7px;text-align:center;font-family:'JetBrains Mono',monospace}
.natcont{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.natcont span{display:inline-flex;align-items:center;gap:6px}
.natcont i{width:9px;height:9px;border-radius:50%}
.natcont b{font:600 13px 'JetBrains Mono'}
.pilha{list-style:none;margin:0;padding:0;max-height:260px;overflow-y:auto}
.pilha li{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--linha);cursor:pointer;font-size:13px}
.pilha li:hover{background:var(--acento-fundo)}
.pilha i{width:9px;height:9px;border-radius:50%;flex:none}
.pilha .fim{margin-left:auto;display:flex;gap:6px;flex:none;font:600 11px 'JetBrains Mono';color:var(--texto-3)}
.graus-lista{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px}
.graus-lista li{display:grid;grid-template-columns:18px 1fr;gap:6px;padding:4px 0;border-bottom:1px dashed var(--linha);color:var(--texto-2)}
.graus-lista li.feito{color:var(--texto)}
.graus-lista li b{font:600 11px 'JetBrains Mono';color:var(--acento)}
.info{font-size:12.5px;color:var(--texto-2);margin:0 0 8px;line-height:1.5}
.info.acento{color:var(--acento)}

/* ================= tela ================= */
#tela{position:relative;min-width:0;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--tela)}
[data-tema="tinta"] #tela{background-image:var(--fibras)}
#tela.arrastando{cursor:grabbing}
#svg{width:100%;height:100%;display:block;position:relative;z-index:1}
#montanhas{position:absolute;left:0;right:0;bottom:0;width:100%;height:190px;pointer-events:none;z-index:0;display:none}
[data-tema="tinta"] #montanhas{display:block}
#marca{
  position:absolute;left:18px;bottom:50px;z-index:0;pointer-events:none;max-width:70%;
  color:var(--texto);opacity:.13;
}
#marca small{display:block;font:600 11px/1 'Barlow';letter-spacing:.3em;text-transform:uppercase;margin-bottom:6px}
#marca b{display:block;font:600 44px/1 var(--titulo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topoTela{position:absolute;left:14px;right:14px;top:12px;z-index:3;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
#topoTela > *{pointer-events:auto}
#seletor{display:flex;gap:6px;flex-wrap:wrap}
.arv{
  appearance:none;border:1px solid var(--linha);background:var(--fundo-2);color:var(--texto-2);border-radius:3px;
  padding:6px 10px;font:500 12.5px/1.1 'Barlow';cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}
.arv small{font:600 8.5px/1 'Barlow';letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.arv[aria-selected="true"]{border-color:var(--acento-borda);color:var(--acento);background:var(--fundo-3)}
.arv.mais{justify-content:center;flex-direction:row;font-weight:600}
#filtroNat{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#filtroNat .chip{background:var(--fundo-2)}
#zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:3}
#zoom .btn{width:34px;height:34px;padding:0;font-size:15px;display:grid;place-items:center;background:var(--fundo-2)}
#dica{
  position:absolute;left:14px;bottom:14px;z-index:3;font:400 11.5px 'Barlow';color:var(--texto-3);
  background:var(--fundo-2);border:1px solid var(--linha);border-radius:3px;padding:6px 10px;pointer-events:none;max-width:calc(100% - 90px);
}
#nada{position:absolute;inset:0;display:none;place-content:center;text-align:center;gap:14px;pointer-events:none;z-index:2;padding:20px}
#nada.on{display:grid}
#nada p{font:400 18px/1.55 var(--titulo);color:var(--texto-2);margin:0;max-width:360px}
#nada .btn{pointer-events:auto;justify-self:center}

/* nós (svg) */
.no{cursor:pointer}
.no .toque{fill:transparent}
.rotulo{font:600 11px 'Barlow';text-anchor:middle;pointer-events:none;paint-order:stroke;stroke-width:3.5px;stroke-linejoin:round}
.rotulo.forte{font-size:12.5px}
[data-tema="pedra"] .rotulo{fill:rgba(233,227,214,.68);stroke:#101318}
[data-tema="pedra"] .rotulo.forte{fill:#EFE7D6}
[data-tema="tinta"] .rotulo{fill:rgba(31,27,22,.72);stroke:#ECE4D0;font-family:'Cormorant Garamond',serif;font-size:13px;font-weight:700}
[data-tema="tinta"] .rotulo.forte{fill:#1F1B16;font-size:15px}
.glifo{font-family:var(--glifo);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.regra-txt{font:600 9px 'JetBrains Mono',monospace;text-anchor:middle;letter-spacing:.1em;pointer-events:none;paint-order:stroke;stroke-width:3px;stroke-linejoin:round}
[data-tema="pedra"] .regra-txt{stroke:#101318}
[data-tema="tinta"] .regra-txt{stroke:#ECE4D0}
.sigla{font:700 8.5px 'Barlow';text-anchor:middle;dominant-baseline:central;pointer-events:none;letter-spacing:.02em}
.nomeesc{pointer-events:none;font-family:var(--titulo);font-weight:600;letter-spacing:.04em}
.no.apagado{opacity:.16}

/* ================= tooltip ================= */
#dica2{
  position:fixed;left:0;top:0;z-index:60;pointer-events:none;opacity:0;transition:opacity .12s;
  max-width:290px;background:var(--dica-fundo);border:1px solid var(--linha-forte);

<script>
'use strict';
/* ============================================================
   ÁRVORES DE HABILIDADE
   Biblioteca de árvores (mestre) + personagens (jogador).
   Arquivo único; os dados ficam no localStorage do navegador.
   ============================================================ */

// dentro de uma mesa do site, estas chaves passam a ser as da mesa (ver mesa.js)
let CHAVE_DOC    = 'urgm.arvore.v4';
let CHAVE_UI     = 'urgm.arvore.ui.v4';
let CHAVE_HIST   = 'urgm.arvore.historico.v4';
let CHAVE_SENHAS = 'urgm.arvore.senhas.v4';
const ANTIGAS = {doc3:'urgm.arvore.doc.v3', arv1:'urgm.arvore.v1', build1:'urgm.arvore.build.v1', ui1:'urgm.arvore.ui.v1'};
const FORMATO = 'urgm-skilltree';

const TINTAS = ['#D9A441','#4E8C7D','#8C2F39','#9BB7C9','#B07CC6','#C9743E',
                '#6E8CD9','#7FB069','#D96A8F','#8E8E8E','#4FA3A5','#1F1B16'];

const TIPOS_PADRAO = {
  pequeno : {nome:'Pequeno' , raio:10, custo:1, forma:'circulo'},
  notavel : {nome:'Notável' , raio:18, custo:2, forma:'circulo'},
  keystone: {nome:'Keystone', raio:27, custo:4, forma:'hexagono'}
};
const NATUREZAS_PADRAO = [
  {id:'forca',       nome:'Força',       cor:'#D0463A'},
  {id:'canalizacao', nome:'Canalização', cor:'#3F7FD6'},
  {id:'hibrida',     nome:'Híbrida',     cor:'#3FA366'}
];
const USOS_PADRAO = [
  {id:'passiva', nome:'Passiva', sigla:'Pa'},
  {id:'ativa',   nome:'Ativa',   sigla:'At'},
  {id:'reacao',  nome:'Reação',  sigla:'Re'},
  {id:'postura', nome:'Postura', sigla:'Po'}
];
const CATEGORIAS = [
  {id:'raca', nome:'Raça'}, {id:'classe', nome:'Classe'}, {id:'escola', nome:'Escola'}, {id:'outra', nome:'Outra'}
];
const FORMAS = [
  {id:'circulo', nome:'Círculo'}, {id:'losango', nome:'Losango'}, {id:'hexagono', nome:'Hexágono'},
  {id:'octogono', nome:'Octógono'}, {id:'lotus', nome:'Lótus'}, {id:'selo', nome:'Selo'},
  {id:'escudo', nome:'Escudo'}, {id:'lamina', nome:'Lâmina'}, {id:'estrela', nome:'Estrela'}
];
const MAX_GRAUS = 5;
const COR_ESCOLA = '#B23A2E';

/* ---------- utilidades ---------- */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const SVGNS = 'http://www.w3.org/2000/svg';
function el(t, a){
  const n = document.createElementNS(SVGNS, t);
  if(a) for(const k in a) if(a[k]!==undefined && a[k]!==null) n.setAttribute(k, a[k]);
  return n;
}
const novoId = (p='n') => p + Math.random().toString(36).slice(2,9) + Math.random().toString(36).slice(2,4);
const f1 = n => Math.round(n*10)/10;
function semente(str){ let h=2166136261; for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);} return (h>>>0)/4294967295; }
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const clone = o => JSON.parse(JSON.stringify(o));
// ids e cores vêm de arquivos de outras pessoas: só aceita o formato que o próprio app gera
const ID_OK = /^[\w-]{1,48}$/, COR_OK = /^#[0-9a-f]{3,8}$/i;
const idOk = x => typeof x==='string' && ID_OK.test(x);
const corOk = (c, pad) => (typeof c==='string' && COR_OK.test(c)) ? c : pad;
const soObjetos = l => Array.isArray(l) ? l.filter(x=>x && typeof x==='object' && !Array.isArray(x)) : [];
function idUnico(x, pref, vistos){
  let id = idOk(x) && !vistos.has(x) ? x : novoId(pref);
  while(vistos.has(id)) id = novoId(pref);
  vistos.add(id); return id;
}
const nomeCat = id => (CATEGORIAS.find(c=>c.id===id) || CATEGORIAS[3]).nome;

/* ---------- estado ----------
   doc  = biblioteca + personagens (é o que vai para o histórico e para os arquivos)
   ui   = preferências e seleção deste navegador                                    */
let doc, ui, senhas = {};
let selecionado = null, pairado = null, filtro = '';
const filtroNat = new Set();
let migrado = false, danificado = false;

const bib = () => doc.biblioteca;
function arvorePorId(id){ return bib().arvores.find(a=>a.id===id) || null; }
function personagemAtual(){ return doc.personagens.find(p=>p.id===ui.personagem) || doc.personagens[0] || null; }
function poolPorId(id){ return bib().pools.find(p=>p.id===id) || null; }
function naturezaPorId(id){ return bib().naturezas.find(n=>n.id===id) || null; }
function usoPorId(id){ return bib().usos.find(u=>u.id===id) || null; }
// tipos de uso de um nódulo, na ordem da biblioteca
function usosDe(n){ return bib().usos.filter(u=>n.usos.includes(u.id)); }

/* a árvore que aparece na tela agora */
function arvoreVisivel(){
  if(ui.modo==='mestre') return arvorePorId(ui.arvoreMestre) || bib().arvores[0] || null;
  const p = personagemAtual(); if(!p) return null;
  const eq = p.arvores.map(arvorePorId).filter(Boolean);
  return eq.find(a=>a.id===p.arvoreAtual) || eq[0] || null;
}
function garantirSelecoes(){
  if(!doc.personagens.length) doc.personagens.push(ArvoreMesa.personagemInicial() || personagemNovo('Personagem 1', bib()));
  if(!arvorePorId(ui.arvoreMestre)) ui.arvoreMestre = bib().arvores[0]?.id || null;
  if(!doc.personagens.some(p=>p.id===ui.personagem)) ui.personagem = doc.personagens[0].id;
  doc.personagens.forEach(p=>{
    const eq = p.arvores.filter(id=>arvorePorId(id));
    if(!eq.includes(p.arvoreAtual)) p.arvoreAtual = eq[0] || null;
  });
  if(selecionado && !porId.has(selecionado)) selecionado = null;
}

/* ---------- moldes ---------- */
function noNovo(tipo, extra){
  const b = bib(); const t = b.tipos[tipo] || b.tipos.pequeno;
  const p0 = b.pools[0]?.id;
  return Object.assign({
    id:novoId(), pais:[], regra:'e', nome:'Novo nódulo', tipo: b.tipos[tipo] ? tipo : 'pequeno',
    forma:t.forma||'circulo', glifo:'', cor:'', natureza:'', usos:[], desc:'', exclusivo:'', escola:null,
    graus:[{custos:(p0 && t.custo>0) ? {[p0]:t.custo} : {}, texto:''}]
  }, extra||{});
}
function bibliotecaInicial(){
  const tipos = clone(TIPOS_PADRAO);
  const mk = (tipo, extra) => Object.assign({
    id:novoId(), pais:[], regra:'e', nome:'', tipo, forma:tipos[tipo].forma, glifo:'', cor:'',
    natureza:'', usos:[], desc:'', exclusivo:'', escola:null,
    graus:[{custos: tipos[tipo].custo>0 ? {p1:tipos[tipo].custo} : {}, texto:''}]
  }, extra);
  const raiz = mk('keystone', {nome:'Origem', desc:'Ponto de partida da árvore.', glifo:'道', graus:[{custos:{}, texto:''}]});
  const ramos = [
    mk('notavel', {nome:'Corpo',    pais:[raiz.id], natureza:'forca',       usos:['passiva'], glifo:'力', desc:'Técnicas externas, do corpo.'}),
    mk('notavel', {nome:'Mente',    pais:[raiz.id], natureza:'canalizacao', usos:['ativa'],   glifo:'气', desc:'Técnicas internas, do qi.'}),
    mk('notavel', {nome:'Espírito', pais:[raiz.id], natureza:'hibrida',     usos:['postura'], glifo:'合', desc:'Corpo e qi cultivados juntos.'})
  ];
  return {
    nome:'Árvores de Habilidade',
    pools:[{id:'p1', nome:'Pontos', cor:'#D9A441', padrao:20}],
    naturezas:clone(NATUREZAS_PADRAO), usos:clone(USOS_PADRAO), tipos,
    arvores:[{id:novoId('a'), nome:'Árvore de exemplo', categoria:'classe', secreta:false, senha:'', nodes:[raiz, ...ramos]}],
    cofres:[]
  };
}
function personagemNovo(nome, b){
  const pontos = {}; b.pools.forEach(p=>{ pontos[p.id] = p.padrao; });
  return {id:novoId('c'), nome:nome||'Personagem', arvores:[], arvoreAtual:null, pontos, alocados:{}, ordemLivre:true};
}
function docInicial(){
  const b = bibliotecaInicial();
  const p = personagemNovo('Personagem 1', b);
  p.arvores = [b.arvores[0].id]; p.arvoreAtual = b.arvores[0].id;
  return {formato:FORMATO+'-doc', versao:4, biblioteca:b, personagens:[p]};
}

/* ---------- normalização (aceita dados antigos e arquivos tortos) ---------- */
function normalizarBiblioteca(b){
  b.nome = String(b.nome || 'Árvores de Habilidade');
  const tiposOrig = (b.tipos && typeof b.tipos==='object') ? b.tipos : {};
  b.tipos = {};
  for(const k in TIPOS_PADRAO){
    const t = Object.assign({}, TIPOS_PADRAO[k], (tiposOrig[k] && typeof tiposOrig[k]==='object') ? tiposOrig[k] : {});
    b.tipos[k] = {nome:String(t.nome || k), raio:Math.min(60, Math.max(4, +t.raio || 10)), custo:Math.max(0, Math.floor(+t.custo || 0)),
                  forma: FORMAS.some(f=>f.id===t.forma) ? t.forma : TIPOS_PADRAO[k].forma};
  }
  const vistos = new Set();
  b.pools = soObjetos(b.pools);
  if(!b.pools.length) b.pools = [{id:'p1', nome:'Pontos', cor:'#D9A441', padrao:20}];
  b.pools.forEach((p,i)=>{
    p.id = idUnico(p.id, 'p', vistos); p.nome = String(p.nome || 'Pontos');
    p.cor = corOk(p.cor, TINTAS[i%TINTAS.length]);
    p.padrao = Number.isFinite(+p.padrao) ? Math.max(0, Math.floor(+p.padrao)) : 20;
  });
  b.naturezas = Array.isArray(b.naturezas) ? soObjetos(b.naturezas) : clone(NATUREZAS_PADRAO);
  b.naturezas.forEach((n,i)=>{ n.id = idUnico(n.id, 't', vistos); n.nome = String(n.nome || 'Natureza'); n.cor = corOk(n.cor, TINTAS[i%TINTAS.length]); });
  b.usos = Array.isArray(b.usos) ? soObjetos(b.usos) : clone(USOS_PADRAO);
  b.usos.forEach(u=>{ u.id = idUnico(u.id, 'u', vistos); u.nome = String(u.nome || 'Uso'); u.sigla = String(u.sigla || u.nome.slice(0,2)).slice(0,3); });
  b.arvores = soObjetos(b.arvores);
  b.cofres = soObjetos(b.cofres).filter(c=>idOk(c.id) && typeof c.salt==='string' && typeof c.iv==='string' && typeof c.dados==='string');
  const ids = {
    pool:new Set(b.pools.map(p=>p.id)), nat:new Set(b.naturezas.map(n=>n.id)), uso:new Set(b.usos.map(u=>u.id)), nos:new Set()
  };
  const vistasA = new Set();
  b.arvores.forEach(a=>normalizarArvore(a, b, ids, vistasA));
}
function normalizarArvore(a, b, ids, vistasA){
  a.id = idUnico(a.id, 'a', vistasA || new Set()); a.nome = String(a.nome || 'Árvore');
  if(!CATEGORIAS.some(c=>c.id===a.categoria)) a.categoria = 'outra';
  a.secreta = !!a.secreta; a.senha = String(a.senha || '');
  a.nodes = soObjetos(a.nodes);
  a.nodes.forEach(n=>normalizarNo(n, b, ids));
}
function normalizarNo(n, b, ids){
  n.id = idUnico(n.id, 'n', ids.nos);
  if(!Array.isArray(n.pais)) n.pais = n.pai ? [n.pai] : [];
  delete n.pai;
  n.pais = [...new Set(n.pais.filter(x=>idOk(x) && x!==n.id))];
  n.regra = n.regra==='ou' ? 'ou' : 'e';
  if(!b.tipos[n.tipo]) n.tipo = 'pequeno';
  if(!FORMAS.some(f=>f.id===n.forma)) n.forma = b.tipos[n.tipo].forma || 'circulo';
  n.nome = String(n.nome ?? '').trim() || 'Sem nome';
  n.glifo = [...String(n.glifo||'')].slice(0,2).join('');
  n.cor = corOk(n.cor, '');
  n.natureza = ids.nat.has(n.natureza) ? n.natureza : '';
  // aceita o formato anterior, de um tipo de uso só
  const usosOrig = Array.isArray(n.usos) ? n.usos : (n.uso ? [n.uso] : []);
  n.usos = [...new Set(usosOrig.filter(x=>ids.uso.has(x)))];
  delete n.uso;
  n.desc = String(n.desc || '');
  n.exclusivo = String(n.exclusivo || '').trim();
  if(!Array.isArray(n.graus) || !n.graus.length){
    let c = n.custos;
    if(!c || typeof c!=='object'){
      const v = Number.isFinite(+n.custo) ? +n.custo : (b.tipos[n.tipo]?.custo ?? 1);
      c = v>0 ? {[b.pools[0].id]:v} : {};
    }
    n.graus = [{custos:c, texto:''}];
  }
  delete n.custos; delete n.custo; delete n.efeitos;           // efeitos de atributo saíram do sistema
  n.graus = soObjetos(n.graus).slice(0, MAX_GRAUS);
  if(!n.graus.length) n.graus = [{custos:{}, texto:''}];
  n.graus = n.graus.map(g=>{
    const custos = {};
    const orig = (g && g.custos) || {};
    for(const k in orig){ const v = Math.floor(+orig[k]); if(ids.pool.has(k) && v>0) custos[k] = v; }
    const limpo = {custos, texto:String((g && g.texto) || '')};
    const bn = bonusLimpo(g && g.bonus); if(bn) limpo.bonus = bn;      // bônus que o grau dá na ficha (FOR +2, HP +10…)
    return limpo;
  });
  if(n.escola && typeof n.escola==='object'){
    n.escola = {nome:String(n.escola.nome || n.nome), cor:corOk(n.escola.cor, COR_ESCOLA),
                secreta:!!n.escola.secreta, senha:String(n.escola.senha || '')};
  }else n.escola = null;
  for(const k of Object.keys(n)) if(k.startsWith('_')) delete n[k];
}
/* Bônus que um grau dá na ficha do personagem. No editor é um texto ("FOR +2, HP +10"); guardado, um mapa {FOR:2, HP:10}.
   Siglas de atributo (FOR DES VIT CAN AGI ESQ FUR PER DFF DFM) somam no atributo; qualquer outro nome é o de um recurso da ficha (HP, SP…). */
const SIGLAS_BONUS = ['FOR','DES','VIT','CAN','AGI','ESQ','FUR','PER','DFF','DFM'];
function bonusLimpo(b){
  if(!b || typeof b!=='object' || Array.isArray(b)) return null;
  const o = {};
  for(const k in b){ const v = +b[k], nome = String(k).trim().slice(0, 30); if(nome && Number.isFinite(v) && v!==0) o[nome] = v; }
  return Object.keys(o).length ? o : null;
}
function bonusTexto(b){ return b ? Object.keys(b).map(k=>k + ' ' + (b[k]>=0 ? '+' : '−') + Math.abs(b[k])).join(', ') : ''; }
function bonusLer(t){
  const o = {};
  String(t || '').split(/[,;\n]+/).forEach(parte=>{
    const m = /^\s*(.+?)\s*([+\-−])?\s*(\d+(?:[.,]\d+)?)\s*$/.exec(parte);
    if(!m) return;
    const nome = m[1].trim().replace(/\s+/g, ' ').slice(0, 30), v = (m[2]==='-' || m[2]==='−' ? -1 : 1) * parseFloat(m[3].replace(',', '.'));
    if(nome && Number.isFinite(v) && v!==0) o[SIGLAS_BONUS.includes(nome.toUpperCase()) ? nome.toUpperCase() : nome] = v;
  });
  return Object.keys(o).length ? o : null;
}
function normalizarPersonagem(p, b, vistos){
  p.id = vistos ? idUnico(p.id, 'c', vistos) : (idOk(p.id) ? p.id : novoId('c'));
  p.nome = String(p.nome || 'Personagem');
  p.arvores = Array.isArray(p.arvores) ? [...new Set(p.arvores.filter(idOk))] : [];
  const pts = (p.pontos && typeof p.pontos==='object' && !Array.isArray(p.pontos)) ? p.pontos : {};
  p.pontos = {};
  for(const k in pts) if(idOk(k) && Number.isFinite(+pts[k])) p.pontos[k] = Math.max(0, Math.floor(+pts[k]));   // tipos ainda trancados ficam guardados
  b.pools.forEach(pl=>{ if(!(pl.id in p.pontos)) p.pontos[pl.id] = pl.padrao; });
  let al = p.alocados;
  if(Array.isArray(al)){ const m = {}; al.forEach(id=>{ m[id] = 1; }); al = m; }
  if(!al || typeof al!=='object') al = {};
  p.alocados = {};
  for(const k of Object.keys(al)){
    const g = Math.floor(+al[k]);
    if(idOk(k) && g>=1) p.alocados[k] = Math.min(g, MAX_GRAUS);
  }
  if(!idOk(p.arvoreAtual)) p.arvoreAtual = null;
  // antes as árvores equipadas apareciam sempre por categoria; agora vale a ordem do jogador.
  // Quem vem de antes começa na ordem em que já aparecia na tela.
  if(p.ordemLivre!==true){ ordenarPorCategoria(p, b); p.ordemLivre = true; }
}
function ordenarPorCategoria(p, b){
  const pos = id => { const a = b.arvores.find(x=>x.id===id); return a ? CATEGORIAS.findIndex(c=>c.id===a.categoria) : CATEGORIAS.length; };
  p.arvores = p.arvores.map((id,i)=>({id, i, k:pos(id)})).sort((x,y)=>x.k-y.k || x.i-y.i).map(x=>x.id);
}
// normaliza um documento; lança erro se não der para aproveitar
function normalizarObjDoc(d){
  if(!d || typeof d!=='object' || !d.biblioteca || typeof d.biblioteca!=='object') throw new Error('o arquivo não tem uma biblioteca válida');
  normalizarBiblioteca(d.biblioteca);
  d.personagens = soObjetos(d.personagens);
  const vistos = new Set();
  d.personagens.forEach(p=>normalizarPersonagem(p, d.biblioteca, vistos));
  d.formato = FORMATO+'-doc'; d.versao = 4;
  delete d.fichas; delete d.atual;
  return d;
}
function normalizarDoc(){
  if(!doc || typeof doc!=='object' || !doc.biblioteca) doc = docInicial();
  normalizarObjDoc(doc);
}

/* ---------- migração do formato anterior (abas com uma árvore cada) ---------- */
function migrarV3(v3){
  const b = {nome:'Árvores de Habilidade', pools:[], naturezas:clone(NATUREZAS_PADRAO), usos:clone(USOS_PADRAO),
             tipos:null, arvores:[], cofres:[]};
  const personagens = [];
  const vistos = new Set();
  const corPadraoAntiga = {pequeno:'#9bb7c9', notavel:'#4e8c7d', keystone:'#d9a441'};
  soObjetos(v3.fichas).forEach((f,i)=>{
    const a = (f && f.arvore) || {}; const bd = (f && f.build) || {};
    if(!b.tipos && a.tipos) b.tipos = clone(a.tipos);
    const poolsA = (Array.isArray(a.pools) && a.pools.length) ? a.pools
                 : [{id:'p1', nome:'Pontos', cor:'#D9A441', padrao: Number.isFinite(+a.pontosPadrao) ? +a.pontosPadrao : 20}];
    const mapaPool = {}, usadosAqui = new Set();
    poolsA.forEach(p=>{
      let ex = b.pools.find(x=>norm(x.nome)===norm(p.nome) && !usadosAqui.has(x.id));
      if(!ex){ ex = {id: (!idOk(p.id) || b.pools.some(x=>x.id===p.id)) ? novoId('p') : p.id, nome:p.nome||'Pontos', cor:p.cor, padrao:p.padrao}; b.pools.push(ex); }
      usadosAqui.add(ex.id); mapaPool[p.id] = ex.id;
    });
    const tiposA = (a.tipos && typeof a.tipos==='object') ? a.tipos : {};
    const nodesA = soObjetos(a.nodes);
    const mapaNo = {};
    nodesA.forEach(n=>{ const id = vistos.has(n.id) ? novoId() : n.id; mapaNo[n.id] = id; vistos.add(id); });
    const nodes = nodesA.map(n=>{
      let src = n.custos;
      if(!src || typeof src!=='object'){
        // formato de uma árvore só: custo numérico; sem custo, valia o padrão do tipo
        const v = (typeof n.custo==='number' && isFinite(n.custo)) ? n.custo
                : ((tiposA[n.tipo] && tiposA[n.tipo].custo) ?? TIPOS_PADRAO[n.tipo]?.custo ?? 1);
        src = v>0 ? {[poolsA[0].id]:v} : {};
      }
      const custos = {}; for(const k in src){ if(mapaPool[k]) custos[mapaPool[k]] = src[k]; }
      const pais = Array.isArray(n.pais) ? n.pais : (n.pai ? [n.pai] : []);
      const cor = (n.cor && n.cor.toLowerCase()!==corPadraoAntiga[n.tipo]) ? n.cor : '';
      return {id:mapaNo[n.id], pais:pais.map(x=>mapaNo[x]||x), regra:n.regra, nome:n.nome, tipo:n.tipo,
              forma: n.tipo==='keystone' ? 'hexagono' : 'circulo', glifo:'', cor,
              natureza:'', usos:[], desc:n.desc||'', exclusivo:'', escola:null, graus:[{custos, texto:''}]};
    });
    const arv = {id:novoId('a'), nome: a.nome || (f && f.nome) || ('Árvore '+(i+1)), categoria:'outra', secreta:false, senha:'', nodes};
    b.arvores.push(arv);
    const pontos = {};
    if(bd.pontos && typeof bd.pontos==='object'){ for(const k in bd.pontos){ if(mapaPool[k]) pontos[mapaPool[k]] = bd.pontos[k]; } }
    else if(Number.isFinite(+bd.pontos)) pontos[mapaPool[poolsA[0].id]] = +bd.pontos;
    const alocados = {};
    (Array.isArray(bd.alocados) ? bd.alocados : []).forEach(id=>{ alocados[mapaNo[id] || id] = 1; });
    personagens.push({id:novoId('c'), nome:(f && f.nome) || arv.nome, arvores:[arv.id], arvoreAtual:arv.id, pontos, alocados});
  });
  return {biblioteca:b, personagens};
}

/* ---------- persistência ---------- */
let pendente, avisouFalha = false, sujo = false;
function salvar(){ sujo = true; clearTimeout(pendente); pendente = setTimeout(salvarJa, 250); }
function salvarJa(){

  try{

  ArvoreMesa.depoisDeSalvar();      // dentro de uma mesa do site: manda para ela o que mudou

function lerJSON(chave){ try{ return JSON.parse(localStorage.getItem(chave)); }catch(e){ return null; } }

function carregar(){

        d = {biblioteca:m.biblioteca, personagens:m.personagens}; migrado = true;
      }
    }
  }
  try{ doc = d; normalizarDoc(); }
  catch(e){
    console.warn('Dados salvos danificados:', e);
    try{ const cru = localStorage.getItem(CHAVE_DOC); if(cru) localStorage.setItem(CHAVE_DOC + '.danificado', cru); }catch(_){}
    doc = docInicial(); normalizarDoc(); danificado = true;
  }

  senhas = lerJSON(CHAVE_SENHAS) || {};
