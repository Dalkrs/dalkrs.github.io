/* ============================================================
   CHECAGEM — o que parece deslize antes de chegar no jogador
   ============================================================ */
function checar(){
  indexar();
  const out = [];
  const add = (nivel, a, n, texto) => out.push({nivel, arvore:a ? a.id : null, no:n ? n.id : null, texto,
    onde: a ? `${nomeCat(a.categoria)} · ${a.nome}` + (n ? ` · ${n.nome}` : '') : ''});
  const grupos = new Map();
  for(const a of bib().arvores){
    if(!a.nodes.length) add('aviso', a, null, 'A árvore está vazia.');
    if(a.secreta && !a.senha.trim()) add('erro', a, null, 'Árvore secreta sem senha: vai ficar de fora do pacote para jogadores.');
    const emCiclo = new Set(nosEmCiclo(a).map(n=>n.id));
    const nomes = new Map(), semTexto = [], semCusto = [];
    for(const n of a.nodes){
      const k = norm(n.nome); nomes.set(k, (nomes.get(k) || []).concat(n));
      if(emCiclo.has(n.id)){ add('erro', a, n, `“${n.nome}” está num ciclo de requisitos e nunca vai liberar.`); continue; }
      if(n.pais.some(pid=>!porId.has(pid))) add('aviso', a, n, `“${n.nome}” tem um requisito que não existe mais.`);
      if(n.pais.length && n.graus.every(g=>!Object.keys(g.custos).length)) semCusto.push(n);
      const temTexto = n.desc.trim() || (n.graus.length>1 && n.graus.some(g=>g.texto.trim()));
      if(!temTexto) semTexto.push(n);
      if(n.graus.length>1) n.graus.forEach((g,i)=>{ if(!g.texto.trim()) add('aviso', a, n, `“${n.nome}”: o grau ${i+1} está sem texto.`); });
      if(n.escola && n.escola.secreta && !n.escola.senha.trim()) add('erro', a, n, `A escola “${n.escola.nome}” é secreta mas não tem senha: vai ficar de fora do pacote.`);
      if(n.exclusivo){ const g = grupoEx(n); grupos.set(g, (grupos.get(g) || []).concat(n)); }
      // todo caminho até ele obriga a pegar dois nódulos que se excluem
      if(!alternativas(n.id).length){
        const vistos = new Map(); let par = null;
        for(const id of req(n.id)){
          const m = porId.get(id); if(!m || !m.exclusivo) continue;
          const g = grupoEx(m);
          if(vistos.has(g) && vistos.get(g)!==id){ par = [porId.get(vistos.get(g)), m]; break; }
          vistos.set(g, id);
        }
        add('erro', a, n, par
          ? `“${n.nome}” nunca vai liberar: exige “${par[0].nome}” e “${par[1].nome}”, que são caminhos exclusivos.`
          : `“${n.nome}” nunca vai liberar: todo caminho até ele passa por caminhos exclusivos que se fecham.`);
      }
      // nó visível que depende de segredo deixa rastro para o jogador
      if(!segredoDe(n.id)){
        const pid = n.pais.find(x=>porId.has(x) && segredoDe(x));
        if(pid) add('aviso', a, n, `“${n.nome}” fica visível, mas exige “${porId.get(pid).nome}”, que é secreto: o jogador vai ver um requisito misterioso.`);
      }
    }
    nomes.forEach(lista=>{ if(lista.length>1) add('aviso', a, lista[1], `Há ${lista.length} nódulos chamados “${lista[0].nome}” nesta árvore.`); });
    const agrupar = (lista, um, varios) => {
      if(!lista.length) return;
      if(lista.length===1) return add('aviso', a, lista[0], `“${lista[0].nome}” ${um}.`);
      const nomesL = lista.slice(0, 4).map(n=>`“${n.nome}”`).join(', ') + (lista.length>4 ? ` e mais ${lista.length-4}` : '');
      add('aviso', a, lista[0], `${lista.length} nódulos ${varios}: ${nomesL}.`);
    };
    agrupar(semTexto, 'está sem descrição', 'sem descrição');
    agrupar(semCusto, 'não custa nada', 'que não custam nada');
  }
  grupos.forEach(lista=>{
    if(lista.length===1) add('aviso', arvDe.get(lista[0].id), lista[0], `O caminho exclusivo “${lista[0].exclusivo}” só tem “${lista[0].nome}”: não fecha nada.`);
  });
  return out.sort((x,y)=>(x.nivel==='erro' ? 0 : 1) - (y.nivel==='erro' ? 0 : 1));
}
function problemasHtml(lista){
  if(!lista.length) return '<p class="info" style="color:var(--ok);font-weight:600">Tudo certo: nenhum problema encontrado.</p>';
  return `<ul class="problemas">${lista.map((pb,i)=>`<li class="${pb.nivel}" data-i="${i}" tabindex="0">
    <span class="tag">${pb.nivel==='erro' ? 'Erro' : 'Aviso'}</span><div>${esc(pb.texto)}<small>${esc(pb.onde)}</small></div></li>`).join('')}</ul>`;
}
async function abrirChecagem(paraExportar){
  const lista = checar();
  const erros = lista.filter(p=>p.nivel==='erro').length, avisos = lista.length - erros;
  const resumo = lista.length ? `${plural(erros,'erro','erros')} e ${plural(avisos,'aviso','avisos')}. ` : '';
  const r = await dialogo({
    titulo: paraExportar ? 'Antes de exportar' : 'Checagem da biblioteca', largura:'largo',
    texto: resumo + (lista.length ? (paraExportar ? 'Clique num item para ir até ele, ou exporte assim mesmo.' : 'Clique num item para ir até ele.') : ''),
    html: problemasHtml(lista),
    botoes: paraExportar ? [{rotulo:'Voltar e corrigir', valor:null}, {rotulo:'Exportar assim mesmo', valor:true, classe:'ouro'}]
                         : [{rotulo:'Fechar', valor:null, classe:'ouro'}],
    aoMontar:(m, fim)=>m.querySelectorAll('.problemas li').forEach(li=>{
      const ir = () => { fim(null); irPara(lista[+li.dataset.i]); };
      li.onclick = ir; li.onkeydown = e=>{ if(e.key==='Enter') ir(); };
    })
  });
  return r===true;
}
function irPara(pb){
  if(!pb || !pb.arvore) return;
  fecharModal();
  ui.modo = 'mestre'; ui.arvoreMestre = pb.arvore; selecionado = pb.no || null;

async function importar(obj){
  if(!obj || typeof obj!=='object') throw new Error('Este arquivo não tem o formato esperado.');
  const f = obj.formato || '';
  if(f===FORMATO+'-pacote') return importarPacote(obj);
  if(f===FORMATO+'-doc' && obj.biblioteca) return importarBackup(obj);
  if(f===FORMATO+'-personagem' && obj.personagem) return importarPersonagem(obj);
  // formatos das versões anteriores
  if(f===FORMATO+'-doc' && obj.doc && Array.isArray(obj.doc.fichas)) return importarAntigo(migrarV3(obj.doc), true);
  if((f===FORMATO+'-ficha' || f===FORMATO+'-build') && obj.arvore)
    return importarAntigo(migrarV3({fichas:[{nome:obj.nome || obj.arvore.nome, arvore:obj.arvore, build:obj.build || {}}]}), true);
  if(Array.isArray(obj.nodes)) return importarAntigo(migrarV3({fichas:[{nome:obj.nome, arvore:obj, build:{}}]}), false);
  throw new Error('Não reconheci o formato deste arquivo.');
}
async function importarPacote(pk){
  const b = bib();
  const doMestre = b.arvores.some(a=>(a.secreta && a.senha) || a.nodes.some(n=>n.escola && n.escola.secreta && n.escola.senha));
  const texto = doMestre
    ? 'Esta biblioteca tem escolas secretas com senha — parece ser a biblioteca do mestre. O pacote vai trocá-la por uma versão com os segredos trancados. Se tiver dúvida, baixe um backup antes.'
    : `A biblioteca deste navegador será trocada pela do pacote (${plural((pk.arvores || []).length,'árvore','árvores')}). Os personagens continuam.`;
  const nova = clone({nome:pk.nome, pools:pk.pools, naturezas:pk.naturezas, usos:pk.usos, tipos:pk.tipos,
                      arvores:Array.isArray(pk.arvores) ? pk.arvores : [], cofres:Array.isArray(pk.cofres) ? pk.cofres : []});
  try{ normalizarBiblioteca(nova); }catch(e){ throw new Error('O pacote tem dados inválidos: ' + e.message); }
  if(!(await confirmar('Carregar pacote', esc(texto), 'Carregar pacote', doMestre))) return null;
  registrar('carregar pacote');
  doc.biblioteca = nova;
  const reabertas = await reabrirGuardadas();
  normalizarDoc(); podarTodos(); garantirSelecoes(); selecionado = null;
  salvar(); pintarTudo(); centralizar();
  return `Pacote carregado: ${plural(bib().arvores.length,'árvore','árvores')}.` + (reabertas.length ? ` Reabertas com senhas já usadas aqui: ${reabertas.join(', ')}.` : '');

async function importarBackup(obj){

function importarPersonagem(obj){

function importarAntigo(m, comPersonagens){
  try{ normalizarBiblioteca(m.biblioteca); }catch(e){ throw new Error('O arquivo antigo tem dados inválidos: ' + e.message); }
  registrar('importar arquivo antigo');
  const mapas = fundirBiblioteca(bib(), m.biblioteca);
  const novas = Object.values(mapas.arvores);
  let nPers = 0;
  if(comPersonagens){
    m.personagens.forEach(p=>{
      const pontos = {}; for(const k in p.pontos) if(mapas.pools[k]) pontos[mapas.pools[k]] = p.pontos[k];
      const alocados = {}; for(const k in p.alocados) alocados[mapas.nos[k] || k] = p.alocados[k];
      const arvores = p.arvores.map(id=>mapas.arvores[id] || id);
      doc.personagens.push({id:novoId('c'), nome:p.nome, arvores, arvoreAtual:arvores[0] || null, pontos, alocados});
      nPers++;
    });
  }else if(ui.modo==='jogador'){
    const p = personagemAtual();
    if(p){ novas.forEach(id=>{ if(!p.arvores.includes(id)) p.arvores.push(id); }); p.arvoreAtual = novas[0] || p.arvoreAtual; }
  }
  if(ui.modo==='mestre' && novas.length) ui.arvoreMestre = novas[0];
  if(ui.modo==='jogador' && nPers) ui.personagem = doc.personagens[doc.personagens.length - nPers].id;
  normalizarDoc(); podarTodos(); garantirSelecoes(); selecionado = null;
  salvar(); pintarTudo(); centralizar();
  return `Arquivo da versão anterior importado: ${plural(novas.length,'árvore','árvores')}` + (nPers ? ` e ${plural(nPers,'personagem','personagens')}` : '') + '.';
}
// junta árvores de outra biblioteca nesta, trocando ids repetidos
function fundirBiblioteca(dest, orig){
  normalizarBiblioteca(orig);
  const mapas = {pools:{}, nat:{}, uso:{}, nos:{}, arvores:{}};
  const juntarLista = (origem, destino, mapa, pref) => {
    const usados = new Set();
    origem.forEach(x=>{
      let ex = destino.find(y=>norm(y.nome)===norm(x.nome) && !usados.has(y.id));
      if(!ex){ ex = Object.assign({}, x, {id: destino.some(y=>y.id===x.id) ? novoId(pref) : x.id}); destino.push(ex); }
      usados.add(ex.id); mapa[x.id] = ex.id;
    });
  };
  juntarLista(orig.pools, dest.pools, mapas.pools, 'p');
  juntarLista(orig.naturezas, dest.naturezas, mapas.nat, 't');
  juntarLista(orig.usos, dest.usos, mapas.uso, 'u');
  const existentes = new Set(); dest.arvores.forEach(a=>a.nodes.forEach(n=>existentes.add(n.id)));
  orig.arvores.forEach(a=>{
    const c = clone(a);
    c.id = dest.arvores.some(x=>x.id===a.id) ? novoId('a') : a.id; mapas.arvores[a.id] = c.id;
    c.nodes.forEach(n=>{ const id = existentes.has(n.id) ? novoId() : n.id; mapas.nos[n.id] = id; existentes.add(id); });
    c.nodes.forEach(n=>{
      n.id = mapas.nos[n.id]; n.natureza = mapas.nat[n.natureza] || ''; n.usos = [...new Set(n.usos.map(x=>mapas.uso[x]).filter(Boolean))];
      n.graus.forEach(g=>{ const nc = {}; for(const k in g.custos) if(mapas.pools[k]) nc[mapas.pools[k]] = g.custos[k]; g.custos = nc; });
    });
    c.nodes.forEach(n=>{ n.pais = n.pais.map(x=>mapas.nos[x] || x); });
    dest.arvores.push(c);
  });
  normalizarBiblioteca(dest);
  return mapas;
}

function mostrarDica(n){
  if(!n) return;
  const t = bib().tipos[n.tipo] || {}, nat = naturezaPorId(n.natureza), nomesUso = usosDe(n).map(u=>u.nome).join(', ');
  const G = n.graus.length, jog = ui.modo==='jogador', p = jog ? personagemAtual() : null;
  const g0 = p ? Math.min(p.alocados[n.id] || 0, G) : 0;
  const meta = [t.nome, nat ? nat.nome : '', nomesUso, G===1 ? custoTexto(n.graus[0].custos) : G + ' graus'].filter(Boolean).join(' · ');
  const esc0 = escolaDoNo(n.id), col = colegasExclusivos(n);
  let estado = '';
  if(jog && p){
    const e = estadoNo(p, n);
    const [txt, cor] = g0>0 ? [G>1 ? `Grau ${g0} de ${G}` : 'Alocado', 'var(--acento)']
      : e==='disp' ? ['Disponível', 'var(--ok)'] : e==='caro' ? [faltaTexto(p, n, 1), 'var(--perigo)']
      : e==='fechado' ? [`Fechado por “${fechadoPor(p, n).nome}”`, 'var(--perigo)'] : ['Bloqueado', 'var(--texto-3)'];
    estado = `<div class="estado" style="color:${esc(cor)}">${esc(txt)}</div>`;
  }
  $('#dica2').innerHTML = `<h3 style="color:${nat ? nat.cor : 'var(--texto)'}">${esc(n.nome)}</h3>
    <div class="meta">${esc(meta)}</div>
    ${n.desc ? `<p>${esc(n.desc)}</p>` : ''}
    ${G>1 ? `<ul class="gr">${n.graus.map((g,i)=>`<li style="opacity:${!jog || i<=g0 ? 1 : .55}"><b>${i<g0 ? '✓' : (i+1) + 'º'}</b>${esc(custoTexto(g.custos))}${g.texto ? ' — ' + esc(g.texto) : ''}${g.bonus ? ' · na ficha: ' + esc(bonusTexto(g.bonus)) : ''}</li>`).join('')}</ul>` : ''}
    ${(n.pais.length>1 || paisFora(n).length) ? `<p class="exige">${esc(exigencia(n))}</p>` : ''}
    ${col.length ? `<p>Caminho exclusivo com ${col.map(m=>'“' + esc(m.nome) + '”').join(', ')}.</p>` : ''}
    ${esc0 ? `<p>Escola: ${esc(esc0.escola.nome)}${esc0.escola.secreta && !jog ? ' · secreta' : ''}</p>` : ''}
    ${estado}`;
  $('#dica2').classList.add('on');
}
function posicionarDica(x, y){
  const d = $('#dica2'), r = d.getBoundingClientRect();

  if(py + r.height > innerHeight - 8) py = Math.max(8, y - r.height - 16);
  d.style.transform = `translate(${Math.max(8, px)}px,${py}px)`;
}

/* ---------- tela: arrastar, clicar, rolar ---------- */
let arrasto = null, moveu = false, ultimoPtr = null;
function noEmPonto(x, y){
  const alvo = document.elementFromPoint(x, y);
  const g = alvo && alvo.closest ? alvo.closest('.no') : null;
  return g ? g.dataset.id : null;
}
function atualizarPaire(x, y, forcar){
  const id = noEmPonto(x, y);
  if(id!==pairado || forcar){ pairado = id; if(id) mostrarDica(porId.get(id)); else esconderDica(); }
  if(pairado) posicionarDica(x, y);
}
function revalidarPaire(){ if(ultimoPtr) atualizarPaire(ultimoPtr.x, ultimoPtr.y, true); }

function ligarTela(){
  const tela = $('#tela');
  tela.addEventListener('pointerdown', ev=>{
    if(ev.button!==0) return;
    if(ev.target.closest('#topoTela, #zoom, #nada .btn')) return;
    arrasto = {x:ev.clientX, y:ev.clientY, cx:cam.x, cy:cam.y, id:ev.pointerId}; moveu = false;
  });
  tela.addEventListener('pointermove', ev=>{
    if(ordenando) return;                       // arrastando um botão de árvore: nada de dica nem de mover a tela
    const toque = ev.pointerType==='touch';
    if(!toque) ultimoPtr = {x:ev.clientX, y:ev.clientY};
    if(arrasto){
      const dx = ev.clientX-arrasto.x, dy = ev.clientY-arrasto.y;
      if(!moveu && (Math.abs(dx)>3 || Math.abs(dy)>3)){
        moveu = true; esconderDica(); tela.classList.add('arrastando');
        try{ tela.setPointerCapture(arrasto.id); }catch(e){}
      }
      if(moveu){ cam.x = arrasto.cx+dx; cam.y = arrasto.cy+dy; aplicarCam(); return; }
    }
    if(!toque) atualizarPaire(ev.clientX, ev.clientY);
  });
  const encerrar = () => {
    if(!arrasto) return;
    tela.classList.remove('arrastando');
    try{ tela.releasePointerCapture(arrasto.id); }catch(e){}
    arrasto = null;
  };
  tela.addEventListener('pointerup', ev=>{
    const tinha = !!arrasto, arrastou = moveu;
    encerrar();
    if(!tinha || arrastou || ev.button!==0) return;
    const id = noEmPonto(ev.clientX, ev.clientY);
    if(id){
      selecionado = id;
      if(ui.modo==='jogador') subirGrau(id);
      desenhar(); pintarPainel();
    }else if(selecionado){ selecionado = null; desenhar(); pintarPainel(); }
  });
  tela.addEventListener('pointercancel', encerrar);
  tela.addEventListener('pointerleave', ()=>{ ultimoPtr = null; esconderDica(); });
  // botão direito: sem o menu do navegador; no jogador desce o grau / solta
  tela.addEventListener('contextmenu', ev=>{
    ev.preventDefault();
    const id = noEmPonto(ev.clientX, ev.clientY); if(!id) return;
    selecionado = id;
    const p = personagemAtual();
    if(ui.modo==='jogador' && p && p.alocados[id]) descerGrau(id);
    desenhar(); pintarPainel();
  });
  tela.addEventListener('wheel', ev=>{
    ev.preventDefault();
    const r = tela.getBoundingClientRect();
    zoomPara(cam.k * (ev.deltaY<0 ? 1.12 : 1/1.12), ev.clientX-r.left, ev.clientY-r.top);
    desenhar();
  }, {passive:false});
  $('#btMais').onclick = ()=>{ zoomPara(cam.k*1.25); desenhar(); };
  $('#btMenos').onclick = ()=>{ zoomPara(cam.k/1.25); desenhar(); };
  $('#btCentro').onclick = ()=>{ centralizar(); desenhar(); };
}

/* ---------- arrastar para mudar a ordem (mouse e toque) ----------
   cont: onde ficam os itens; selItem: cada item (com data-id).
   o.eixo 'x' (botões que quebram linha) ou 'y' (lista); o.alca: no toque, só arrasta por ela
   (o resto continua rolando o painel); o.rolar: rola o painel perto das bordas;
   o.soltar(id, antesDe, peloTeclado): antesDe null = no fim; o.focar(id): foco depois do teclado. */
let ordenando = null, cliqueAposArrasto = 0;
// o clique que o navegador gera ao soltar um arrasto não conta como clique (vale para a página toda)
document.addEventListener('click', e=>{
  if(cliqueAposArrasto && Date.now()-cliqueAposArrasto < 600){ cliqueAposArrasto = 0; e.stopPropagation(); e.preventDefault(); }
}, true);
document.addEventListener('pointerdown', ()=>{ cliqueAposArrasto = 0; }, true);
function tornarOrdenavel(cont, selItem, o){
  // teclado: Alt + setas
  cont.addEventListener('keydown', e=>{
    if(!e.altKey || e.ctrlKey || e.metaKey || !/^Arrow(Left|Right|Up|Down)$/.test(e.key)) return;
    const item = e.target.closest(selItem); if(!item || !cont.contains(item)) return;
    if(o.alca && e.target!==item && !e.target.closest(o.alca)) return;
    e.preventDefault(); e.stopPropagation();
    const itens = [...cont.querySelectorAll(selItem)], i = itens.indexOf(item);
    const j = i + (/Left|Up/.test(e.key) ? -1 : 1);
    if(j<0 || j>=itens.length) return;
    const antes = j<i ? itens[j] : itens[j+1];
    const id = item.dataset.id;
    o.soltar(id, antes ? antes.dataset.id : null, true);
    if(o.focar) o.focar(id);
  });
  cont.addEventListener('pointerdown', ev=>{
    if(ordenando || ev.button!==0 || !ev.isPrimary) return;
    const item = ev.target.closest(selItem); if(!item || !cont.contains(item)) return;
    const bt = ev.target.closest('button, input, select, textarea, a');
    if(bt && bt!==item) return;                                              // o × e outros botões de dentro
    if(o.alca && ev.pointerType!=='mouse' && !ev.target.closest(o.alca)) return;   // no toque, só pela alça
    const itens = [...cont.querySelectorAll(selItem)];
    if(itens.length<2) return;
    const est = {item, itens, de:itens.indexOf(item), pid:ev.pointerId, x0:ev.clientX, y0:ev.clientY,
                 x:ev.clientX, y:ev.clientY, ativo:false, cancelado:false, antes:undefined, raf:0, fantasma:null, marca:null};
    const limiar = ev.pointerType==='mouse' ? 4 : 7;
    const painel = o.rolar ? cont.closest('#painel') : null;

    const atualizar = () => {
      if(!est.itens.every(x=>x.isConnected)){ cancelar(); return false; }      // a lista foi redesenhada no meio
      // na lista o fantasma só sobe e desce
      est.fantasma.style.transform = o.eixo==='y' ? `translate(10px,${est.y-est.y0}px)` : `translate(${est.x-est.x0}px,${est.y-est.y0}px) rotate(-2deg)`;
      const {s, marca} = slotOrdem(est.itens, est.x, est.y, o.eixo);
      const igual = s===est.de || s===est.de+1;
      est.antes = igual ? undefined : (s<est.itens.length ? est.itens[s].dataset.id : null);
      est.marca.classList.toggle('on', !igual);
      if(!igual) Object.assign(est.marca.style, {left:marca.left+'px', top:marca.top+'px', width:marca.width+'px', height:marca.height+'px'});
      return true;
    };
    const rolar = () => {
      if(!est.ativo) return;
      if(painel){
        const r = painel.getBoundingClientRect(), borda = 44;
        let v = 0;
        if(est.y < r.top + borda) v = -Math.min(16, Math.ceil((r.top + borda - est.y)/3));
        else if(est.y > r.bottom - borda) v = Math.min(16, Math.ceil((est.y - r.bottom + borda)/3));
        if(v){ const t = painel.scrollTop; painel.scrollTop += v; if(painel.scrollTop!==t && !atualizar()) return; }
      }
      est.raf = requestAnimationFrame(rolar);
    };
    const comecar = () => {
      if(ordenando){ desligar(); return; }
      est.ativo = true; ordenando = est;
      const r = item.getBoundingClientRect();
      const f = item.cloneNode(true);
      f.removeAttribute('id'); f.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));
      f.classList.add('fantasma-ordem'); f.setAttribute('aria-hidden', 'true');
      Object.assign(f.style, {left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px'});
      document.body.appendChild(f); est.fantasma = f;
      est.marca = document.createElement('div'); est.marca.className = 'marca-ordem ' + o.eixo; document.body.appendChild(est.marca);
      item.classList.add('levantada'); document.body.classList.add('ordenando');
      try{ item.setPointerCapture(est.pid); }catch(_){}
      esconderDica();
      if(ev.pointerType!=='mouse') try{ navigator.vibrate && navigator.vibrate(8); }catch(_){}
      if(painel) est.raf = requestAnimationFrame(rolar);
    };
    const mover = e => {
      if(e.pointerId!==est.pid || est.cancelado) return;
      if(e.pointerType==='mouse' && !(e.buttons & 1)){ apagar(); desligar(); return; }   // o botão subiu sem a página ver
      est.x = e.clientX; est.y = e.clientY;
      if(!est.ativo){
        if(Math.hypot(est.x-est.x0, est.y-est.y0) < limiar) return;
        comecar(); if(!est.ativo) return;
      }
      e.preventDefault();
      atualizar();
    };
    const soltar = e => {
      if(e.pointerId!==est.pid) return;
      desligar();
      if(est.cancelado){ cliqueAposArrasto = Date.now(); return; }
      if(!est.ativo) return;                                                   // foi só um clique
      est.x = e.clientX; est.y = e.clientY;
      if(!atualizar()){ cliqueAposArrasto = Date.now(); return; }
      const antes = est.antes;
      apagar(); cliqueAposArrasto = Date.now();
      if(antes!==undefined) o.soltar(item.dataset.id, antes, false);
    };
    // Esc ou lista redesenhada: desiste, mas ainda espera o dedo/botão subir para engolir o clique
    const cancelar = () => { if(est.ativo){ apagar(); est.cancelado = true; } };
    const cancelarPtr = e => { if(e.pointerId===est.pid){ apagar(); desligar(); } };
    const tecla = e => { if(e.key==='Escape' && est.ativo){ e.preventDefault(); e.stopPropagation(); cancelar(); } };
    const saiu = () => { apagar(); desligar(); };                                // trocou de janela no meio do arrasto
    function apagar(){
      cancelAnimationFrame(est.raf);
      if(est.fantasma) est.fantasma.remove();
      if(est.marca) est.marca.remove();
      item.classList.remove('levantada');
      try{ if(item.hasPointerCapture && item.hasPointerCapture(est.pid)) item.releasePointerCapture(est.pid); }catch(_){}
      if(ordenando===est){ ordenando = null; document.body.classList.remove('ordenando'); }
      est.ativo = false;
    }
    function desligar(){
      removeEventListener('pointermove', mover, true); removeEventListener('pointerup', soltar, true);
      removeEventListener('pointercancel', cancelarPtr, true); removeEventListener('keydown', tecla, true);
      removeEventListener('blur', saiu);
    }
    addEventListener('pointermove', mover, true); addEventListener('pointerup', soltar, true);
    addEventListener('pointercancel', cancelarPtr, true); addEventListener('keydown', tecla, true);
    addEventListener('blur', saiu);
  });
}
// onde o item cairia: índice de inserção (0..n) e o traço que mostra o lugar
function slotOrdem(itens, x, y, eixo){
  const rs = itens.map(e=>e.getBoundingClientRect()), n = itens.length;
  if(eixo==='y'){
    let s = n;
    for(let i=0;i<n;i++) if(y < rs[i].top + rs[i].height/2){ s = i; break; }
    const r = rs[Math.min(s, n-1)];
    return {s, marca:{left:r.left-5, width:r.width+10, height:3, top: s<n ? r.top-4 : r.bottom+1}};
  }
  // botões em linhas que quebram: acha a linha mais perto e, nela, o vão mais perto
  const linhas = [];
  rs.forEach((r,i)=>{
    const l = linhas.find(l=>r.top < l.bottom - 4 && r.bottom > l.top + 4);
    if(l){ l.idx.push(i); l.top = Math.min(l.top, r.top); l.bottom = Math.max(l.bottom, r.bottom); }
    else linhas.push({top:r.top, bottom:r.bottom, idx:[i]});
  });
  let lin = linhas[0], perto = Infinity;
  for(const l of linhas){ const d = y<l.top ? l.top-y : y>l.bottom ? y-l.bottom : 0; if(d<perto){ perto = d; lin = l; } }
  for(const i of lin.idx) if(x < rs[i].left + rs[i].width/2){ const r = rs[i]; return {s:i, marca:{left:r.left-4.5, top:r.top, width:3, height:r.height}}; }
  const u = lin.idx[lin.idx.length-1], r = rs[u];
  return {s:u+1, marca:{left:r.right+1.5, top:r.top, width:3, height:r.height}};
}

/* ---------- tema e modo ---------- */
function trocarTema(t){
  ui.tema = t; document.documentElement.setAttribute('data-tema', t);
  salvar(); atualizarModoUI(); desenhar(); pintarPainel();
}
function trocarModo(m){
  if(ui.modo===m) return;
  ui.modo = m; selecionado = null; filtroNat.clear();
  salvar(); pintarTudo(); centralizar(); desenhar();
  if(!$('#dica').dataset.aviso) $('#dica').textContent = dicaPadrao();
}

/* ============================================================
   INÍCIO
   ============================================================ */
function iniciar(){
  carregar();
  document.documentElement.setAttribute('data-tema', temaResolvido());
  gerarPapel();
  $('#nomeBib').addEventListener('input', e=>{ registrar('renomear biblioteca', 'bib'); bib().nome = e.target.value; salvar(); });
  $('#nomeBib').addEventListener('change', e=>{ if(!e.target.value.trim()){ bib().nome = 'Árvores de Habilidade'; e.target.value = bib().nome; salvar(); } });
  $('#busca').addEventListener('input', e=>{ filtro = e.target.value; desenhar(); });
  $('#btTinta').onclick = ()=>trocarTema('tinta');
  $('#btPedra').onclick = ()=>trocarTema('pedra');
  $('#btMestre').onclick = ()=>trocarModo('mestre');
  $('#btJogador').onclick = ()=>trocarModo('jogador');
  $('#btDesfazer').onclick = desfazer;
  $('#btRefazer').onclick = refazer;
  $('#btTroca').onclick = abrirTroca;
  $('#btNovaAba').onclick = novaAba;
  $('#btRenomearAba').onclick = renomearAba;
  $('#btDuplicarAba').onclick = duplicarAba;
  $('#btExcluirAba').onclick = excluirAba;
  $('#veu').addEventListener('click', e=>{ if(e.target.id==='veu') fecharModal(); });
  if(window.matchMedia){
    const mq = matchMedia('(prefers-color-scheme: light)');
    const seguir = () => { if(ui.tema!=='tinta' && ui.tema!=='pedra'){ document.documentElement.setAttribute('data-tema', temaResolvido()); atualizarModoUI(); desenhar(); } };
    if(mq.addEventListener) mq.addEventListener('change', seguir); else if(mq.addListener) mq.addListener(seguir);
  }
  document.addEventListener('keydown', e=>{
    if(dialogoAberto()) return;
    const emCampo = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
    if((e.ctrlKey || e.metaKey) && !emCampo && !modalAberto()){
      const k = e.key.toLowerCase();
      if(k==='z' && !e.shiftKey){ e.preventDefault(); return desfazer(); }
      if((k==='z' && e.shiftKey) || k==='y'){ e.preventDefault(); return refazer(); }
    }
    if(e.key==='Escape'){
      if(modalAberto()) return fecharModal();
      if(selecionado){ selecionado = null; desenhar(); pintarPainel(); }
    }
  });
  ligarTela();
  // botões das árvores do personagem, em cima da tela: arrastar muda a ordem
  tornarOrdenavel($('#seletor'), '.arv[data-id]', {eixo:'x', soltar:reordenarEquipada,
    focar:id=>$(`#seletor .arv[data-id="${CSS.escape(id)}"]`)?.focus()});
  indexar(); garantirSelecoes(); podarTodos();
  pintarTudo(); centralizar(); desenhar();
  let espera;
  addEventListener('resize', ()=>{ clearTimeout(espera); espera = setTimeout(desenhar, 80); });
  if(migrado){ salvarJa(); aviso('Seus dados foram convertidos: cada aba antiga virou um personagem com a árvore dela.', 'ok', 7000); }
  if(danificado) aviso('Os dados salvos neste navegador estavam danificados. Guardei uma cópia e comecei do zero: carregue um backup em Importar / Exportar.', 'err', 12000);
  // não perde a última edição se a aba for fechada logo em seguida
  // (só grava se houver mudança pendente: uma aba antiga não pode sobrescrever a mais nova)
  addEventListener('pagehide', ()=>{ if(sujo) salvarJa(); });
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && sujo) salvarJa(); });
  // outra aba deste navegador salvou: acompanha
  addEventListener('storage', e=>{
    if(e.key!==CHAVE_DOC || !e.newValue || sujo) return;
    try{ doc = JSON.parse(e.newValue); normalizarDoc(); pintarTudo(); }catch(_){}
  });
}
// Dentro do site, com uma mesa aberta, as árvores e os personagens vêm da mesa (mesa.js prepara tudo antes de abrir).
ArvoreMesa.preparar().then(()=>{ iniciar(); ArvoreMesa.depoisDeAbrir(); }, e=>ArvoreMesa.falhou(e));
